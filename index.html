        plus: String.raw`<p><b>Warum nicht immer einsetzen?</b> Das Auflösen der Nebenbedingung ist die Ausnahme, nicht die Regel. Schon \(F(x,y)=x^{2}+y^{2}-1=0\) lässt sich nur lokal und nur mit Vorzeichenwahl nach \(y\) auflösen (\(y=\pm\sqrt{1-x^{2}}\)), und in den Punkten \((\pm1,0)\) gar nicht. Bei mehreren Variablen und mehreren Nebenbedingungen wird das Einsetzen vollends unpraktikabel; außerdem zerstört es meist die Symmetrie des Problems. Die Lagrange-Methode behandelt alle Variablen gleichberechtigt und braucht die Auflösung nur als <i>theoretisches</i> Hilfsmittel im Beweis.</p><p><b>Roter Faden.</b> \(\nabla f=\mathbf{0}_2\) ist die notwendige Bedingung für freie Extrema (vgl. <a href="#/ref/diffrechnung">Differentialrechnung</a>); \(\nabla f=\lambda\nabla F\) ist ihr Gegenstück unter einer Nebenbedingung. Beide sind <b>nur notwendig</b>: Sie liefern Kandidaten, nicht die Entscheidung Maximum/Minimum/keines von beiden.</p>`}},
       {id:"7.12.2", title:"Die Lagrange-Funktion (eine Nebenbedingung)", body:{
        def: String.raw`<p><b>Rahmen.</b> \(V\subset\mathbb{R}^{2}\) offen, Zielfunktion \(f:V\to\mathbb{R}\), Nebenbedingung \(F:V\to\mathbb{R}\) mit \(F(x,y)=0\).</p><p><b>Definition (lokaler Extremwert unter Nebenbedingung).</b> \(f\) nimmt in \((x^{*},y^{*})\in V\) einen lokalen Extremwert unter der Nebenbedingung \(F(x,y)=0\) an, falls</p><ul><li>(1) \(F(x^{*},y^{*})=0\) und</li><li>(2) \(\exists\,\varepsilon,\delta>0\ \ \forall\,(x,y)\in U_\varepsilon(x^{*})\cap U_\delta(y^{*})\cap V:\quad \big[\,F(x,y)=0\ \Rightarrow\ f(x,y)\le f(x^{*},y^{*})\,\big]\)</li></ul><p>(so gelesen ein <b>Maximum</b>; mit \(\ge\) statt \(\le\) ein Minimum).</p><p><b>Definition (Lagrange-Funktion).</b></p>\[\mathcal{L}(x,y;\lambda)=f(x,y)-\lambda\cdot F(x,y)\]<p>heißt die <b>Lagrange-Funktion</b> des Problems; \(\lambda\) heißt <b>Lagrange-Faktor</b>.</p><p><b>Lösungsschema (Tafel).</b></p><p>(I) \(\ \nabla_{(x,y)}\mathcal{L}(x,y;\lambda)=\nabla f(x,y)-\lambda\cdot\nabla F(x,y)=\mathbf{0}_2\)&nbsp;&nbsp;— 2 Gleichungen;</p><p>(II) \(\ \dfrac{\partial}{\partial\lambda}\mathcal{L}(x,y;\lambda)=-F(x,y)=0\)&nbsp;&nbsp;— 1 Gleichung.</p><p>Zusammen: <b>3 Gleichungen für die 3 Unbekannten</b> \(x,\ y,\ \lambda\).</p>`,
        worte: String.raw`<p>Der ganze Trick besteht darin, den Proportionalitätsfaktor \(\lambda\) aus Beobachtung ④ zu einer <b>gleichberechtigten Unbekannten</b> zu machen. Man bezahlt mit einer zusätzlichen Variablen und bekommt dafür ein <i>freies</i> Extremwertproblem: Statt „Extremwert von \(f\) auf der Menge \(F=0\)“ sucht man kritische Punkte von \(\mathcal{L}\) in allen drei Variablen \(x,y,\lambda\).</p><p>Die Buchführung geht dabei perfekt auf. Die Ableitung nach \(\lambda\) reproduziert automatisch die Nebenbedingung — sie ist in (II) versteckt und kann gar nicht vergessen werden. Die Ableitungen nach \(x\) und \(y\) in (I) sind genau die Aussage \(\nabla f=\lambda\nabla F\), also die Tangentialität aus <a href="#/7.12.1">7.12.1</a>. Die Zählung stimmt: zwei Unbekannte des Problems plus ein Multiplikator, dagegen zwei Gradientengleichungen plus eine Nebenbedingung.</p><p>Zwei Warnungen. Erstens ist das Schema <b>nur notwendig</b>: Jede Lösung von (I)+(II) ist ein Kandidat, mehr nicht; ob dort Maximum, Minimum oder gar nichts vorliegt, muss zusätzlich entschieden werden (typisch über Kompaktheit der Nebenbedingungsmenge und Vergleich der Funktionswerte). Zweitens ist \(\lambda\) meist keine gesuchte Größe, sondern eine Hilfsvariable, die man beim Auflösen des Systems so früh wie möglich eliminiert. Das Vorzeichen in \(f-\lambda F\) ist reine Konvention: Mit \(f+\lambda F\) ändert sich nur das Vorzeichen von \(\lambda\).</p>`,
        beispiel: String.raw`<p><b>Beispiel ① mit dem Lagrange-Verfahren</b> (an der Tafel als Hausaufgabe gestellt).</p><p>Zielfunktion \(f(x,y)=xy\), Nebenbedingung \(F(x,y)=2(x+y)-U=0\), also</p>\[\mathcal{L}(x,y;\lambda)=xy-\lambda\big(2(x+y)-U\big).\]<p><b>(I) Gradient nach \((x,y)\):</b></p>\[\frac{\partial\mathcal{L}}{\partial x}=y-2\lambda=0,\qquad \frac{\partial\mathcal{L}}{\partial y}=x-2\lambda=0.\]<p><b>(II) Ableitung nach \(\lambda\):</b></p>\[\frac{\partial\mathcal{L}}{\partial\lambda}=-\big(2(x+y)-U\big)=0.\]<p><b>Auflösen.</b> Aus (I) folgt sofort \(x=y=2\lambda\) — die Symmetrie des Problems bleibt also erhalten, anders als beim Einsetzverfahren. Einsetzen in (II):</p>\[2\big(2\lambda+2\lambda\big)=U\ \Longrightarrow\ 8\lambda=U\ \Longrightarrow\ \lambda=\frac{U}{8},\qquad x^{*}=y^{*}=2\lambda=\frac{U}{4}.\]<p>Einziger Kandidat ist das Quadrat mit Seitenlänge \(U/4\) und \(f(x^{*},y^{*})=U^{2}/16\) — dasselbe Ergebnis wie in <a href="#/7.12.1">7.12.1</a>, und der Lagrange-Faktor \(\lambda=U/8\) stimmt mit dem dort abgelesenen Proportionalitätsfaktor überein.</p><p><b>Warum ist das das Maximum?</b> Auf der abgeschlossenen und beschränkten (also kompakten) Menge \(K=\{(x,y):x,y\ge0,\ 2(x+y)=U\}\) nimmt die stetige Funktion \(f\) ihr Maximum an. In den beiden Endpunkten \((0,\tfrac{U}{2})\) und \((\tfrac{U}{2},0)\) ist \(f=0\); in allen übrigen Punkten von \(K\), also für \(x,y>0\), ist \((\tfrac{U}{4},\tfrac{U}{4})\) der einzige Kandidat des Lagrange-Systems. Wegen \(f(\tfrac{U}{4},\tfrac{U}{4})=U^{2}/16>0\) wird das Maximum also dort angenommen.</p>`,
        plus: String.raw`<p><b>Notation.</b> Für den Nullvektor schreibt die Vorlesung an der Tafel eine <i>durchgestrichene</i> Null mit Raumindex; auf diesen Karten steht dafür \(\mathbf{0}_2,\ \mathbf{0}_k,\ \mathbf{0}_n\). Ebenso steht \(\mathbf{1}\) für die Einheitsmatrix (Tafel: doppelt gestrichene Eins).</p><p><b>Klausurfallen.</b></p><ul><li>Gleichung (II) nicht vergessen: Wer nur \(\nabla f=\lambda\nabla F\) löst, hat zwei Gleichungen für drei Unbekannte und bekommt eine ganze Kurve von Scheinlösungen.</li><li>Beim Auflösen von (I) nicht unbedacht dividieren. Aus \(y=2\lambda\) und \(x=2\lambda\) darf man \(x=y\) folgern; aus einer Gleichung der Form \(y=\lambda g(x)\) darf man aber nicht durch \(g(x)\) teilen, ohne den Fall \(g(x)=0\) gesondert zu behandeln. Fallunterscheidungen (insbesondere \(\lambda=0\)) sind der Normalfall.</li><li>Der Punkt muss die Nebenbedingung <i>und</i> die Gradientenbedingung erfüllen; ein Kandidat, der (I) löst, aber nicht auf \(F=0\) liegt, ist keiner.</li><li>Punkte mit \(\nabla F=\mathbf{0}_2\) fallen durch das Verfahren hindurch und müssen separat geprüft werden — siehe <a href="#/7.12.3">7.12.3</a>.</li></ul>`}},
       {id:"7.12.3", title:"Herleitung über den Satz über implizite Funktionen", body:{
        def: String.raw`<p><b>Annahmen (Tafel).</b></p><ul><li>alle partiellen Ableitungen 1. Ordnung von \(f\) und \(F\) existieren und sind stetig;</li><li>in \((x^{*},y^{*})\) liege ein lokaler Extremwert unter der Nebenbedingung vor;</li><li>\(\left.\dfrac{\partial F}{\partial y}\right|_{(x^{*},y^{*})}=F'_y(x^{*},y^{*})\ne0\).</li></ul><p><b>Schritt 1 (Auflösen).</b> Nach dem Satz über implizite Funktionen ist \(F(x,y)=0\) in einer Umgebung von \((x^{*},y^{*})\) lokal zu \(y=y(x)\) auflösbar, und</p>\[y'_x(x^{*})=-\,\frac{1}{F'_y(x^{*},y^{*})}\cdot F'_x(x^{*},y^{*}).\]<p><b>Schritt 2 (Einsetzen).</b> Mit der Parametrisierung \(\varkappa(x)=\begin{pmatrix}x\\ y(x)\end{pmatrix}\) setze</p>\[\tilde f(x)=f\big(x,y(x)\big)=(f\circ\varkappa)(x).\]<p>Nach Voraussetzung hat \(\tilde f\) in \(x=x^{*}\) einen <i>freien</i> lokalen Extremwert.</p><p><b>Schritt 3 (Kettenregel).</b> Also muss gelten</p>\[\left.\tilde f'_x\right|_{x=x^{*}}=0=\left.f'_{(x,y)}\,\varkappa'_x=(f'_x,\,f'_y)\begin{pmatrix}1\\ y'(x)\end{pmatrix}\right|_{x=x^{*}}=f'_x(x^{*},y^{*})+f'_y(x^{*},y^{*})\cdot y'(x^{*}).\]<p><b>Schritt 4 (\(y'(x^{*})\) einsetzen und \(\lambda\) taufen).</b></p>\[0=f'_x(x^{*},y^{*})-\underbrace{\frac{f'_y(x^{*},y^{*})}{F'_y(x^{*},y^{*})}}_{=:\ \lambda\,\in\,\mathbb{R}}\cdot F'_x(x^{*},y^{*}).\]<p>Damit ist \(f'_x(x^{*},y^{*})=\lambda\cdot F'_x(x^{*},y^{*})\), und \(f'_y(x^{*},y^{*})=\lambda\,F'_y(x^{*},y^{*})\) gilt nach Definition von \(\lambda\). Zusammen:</p>\[\left.\nabla f\right|_{(x^{*},y^{*})}=\lambda\cdot\nabla F(x^{*},y^{*}),\qquad \mathcal{L}(x,y;\lambda)=f(x,y)-\lambda\cdot F(x,y)\]<p>— weiter wie im Beispiel ①.</p>`,
        worte: String.raw`<p>Diese Herleitung macht aus der Zeichnung einen Beweis. Die geometrische Beobachtung „die Nebenbedingung schränkt auf eine Kurve ein“ ist genau das, was der Satz über implizite Funktionen präzisiert: Unter der Voraussetzung \(F'_y\ne0\) ist die Lösungsmenge \(F=0\) in der Nähe von \((x^{*},y^{*})\) der <b>Graph</b> einer stetig differenzierbaren Funktion \(y=y(x)\). Und der Satz liefert die Ableitung \(y'_x\) gleich mit, obwohl man \(y(x)\) gar nicht explizit kennt — das ist der Punkt, an dem das Verfahren dem Schulweg überlegen wird.</p><p>Ist das einmal bekannt, wird das Problem in eine Dimension gedrückt: Auf der Kurve ist \(f\) nur noch eine Funktion einer Variablen, nämlich \(\tilde f=f\circ\varkappa\), und für diese gilt die altbekannte notwendige Bedingung \(\tilde f'(x^{*})=0\) aus der eindimensionalen <a href="#/ref/diffrechnung">Differentialrechnung</a>. Die Kettenregel übersetzt das zurück in die partiellen Ableitungen von \(f\).</p><p>Bemerkenswert ist, dass \(\lambda\) nicht herbeigezaubert wird: Es ist der <b>explizit hingeschriebene Quotient</b> \(\lambda=f'_y/F'_y\), und dieser Quotient existiert genau deshalb, weil \(F'_y(x^{*},y^{*})\ne0\) vorausgesetzt wurde. Die Rolle von \(x\) und \(y\) ist dabei austauschbar: Wäre stattdessen \(F'_x\ne0\), so löste man nach \(x\) auf und erhielte dieselbe Schlussfolgerung. Gebraucht wird also nur \(\nabla F(x^{*},y^{*})\ne\mathbf{0}_2\) — und genau daraus wird im allgemeinen Fall die Rangbedingung (<a href="#/7.12.4">7.12.4</a>).</p>`,
        erfuellt: String.raw`<p><b>Voraussetzung erfüllt: Beispiel ①, Schritt für Schritt durch die Herleitung.</b></p><p>\(f(x,y)=xy\), \(F(x,y)=2(x+y)-U\) auf \(V=\mathbb{R}^{2}\). Alle partiellen Ableitungen sind Polynome, also stetig. Weiter</p>\[f'_x=y,\quad f'_y=x,\qquad F'_x=2,\quad F'_y=2\ne0\ \text{überall}.\]<p><b>Schritt 1.</b> Die Auflösung existiert (hier sogar global): \(y(x)=\dfrac{U}{2}-x\). Die Formel des Satzes bestätigt das:</p>\[y'_x=-\frac{1}{F'_y}\cdot F'_x=-\frac{1}{2}\cdot 2=-1,\]<p>und in der Tat ist \(\frac{d}{dx}\left(\frac{U}{2}-x\right)=-1\).</p><p><b>Schritte 2 und 3.</b> \(\tilde f(x)=f(x,y(x))\), und die Kettenregel liefert</p>\[\tilde f'(x)=f'_x+f'_y\cdot y'(x)=y(x)+x\cdot(-1)=\frac{U}{2}-x-x=\frac{U}{2}-2x.\]<p>Nullsetzen: \(x^{*}=\dfrac{U}{4}\), also \(y^{*}=\dfrac{U}{4}\).</p><p><b>Schritt 4.</b> \(\lambda=\dfrac{f'_y(x^{*},y^{*})}{F'_y(x^{*},y^{*})}=\dfrac{x^{*}}{2}=\dfrac{U}{8}\), und die Probe der ersten Komponente geht auf:</p>\[f'_x(x^{*},y^{*})=y^{*}=\frac{U}{4}\quad\text{und}\quad \lambda\cdot F'_x(x^{*},y^{*})=\frac{U}{8}\cdot2=\frac{U}{4}.\]<p>Also \(\nabla f|_{(x^{*},y^{*})}=\lambda\,\nabla F(x^{*},y^{*})\), genau wie behauptet.</p>`,
        verletzt: String.raw`<p><b>Voraussetzung verletzt: die Neilsche Parabel.</b> Sei \(V=\mathbb{R}^{2}\),</p>\[f(x,y)=x,\qquad F(x,y)=y^{2}-x^{3}=0.\]<p><b>Es liegt ein Extremwert unter der Nebenbedingung vor.</b> Aus \(x^{3}=y^{2}\ge0\) folgt \(x\ge0\) für jeden zulässigen Punkt, also \(f(x,y)=x\ge0=f(0,0)\). Da \((0,0)\) die Nebenbedingung erfüllt, nimmt \(f\) dort ein (sogar globales) Minimum unter der Nebenbedingung an.</p><p><b>Die Voraussetzung scheitert.</b></p>\[\nabla F(x,y)=\begin{pmatrix}-3x^{2}\\ 2y\end{pmatrix},\qquad \nabla F(0,0)=\begin{pmatrix}0\\ 0\end{pmatrix}=\mathbf{0}_2,\]<p>insbesondere \(F'_y(0,0)=0\). Der Satz über implizite Funktionen ist nicht anwendbar; die Nebenbedingungsmenge hat im Ursprung eine Spitze und ist dort kein \(C^{1}\)-Graph.</p><p><b>Folge: Das Lagrange-System hat gar keine Lösung.</b> Mit \(\mathcal{L}(x,y;\lambda)=x-\lambda(y^{2}-x^{3})\) lautet es</p>\[\text{(I)}\quad 1+3\lambda x^{2}=0,\qquad -2\lambda y=0,\qquad\qquad \text{(II)}\quad y^{2}-x^{3}=0.\]<p>Aus \(-2\lambda y=0\) folgt \(\lambda=0\) oder \(y=0\). Für \(\lambda=0\) wird die erste Gleichung zu \(1=0\) — unmöglich. Für \(y=0\) liefert (II) \(x=0\), und die erste Gleichung wird zu \(1+0=1\ne0\) — ebenfalls unmöglich.</p><p>Das Verfahren <b>übersieht</b> also den tatsächlich vorhandenen Extremwert in \((0,0)\). Direkt gesehen: \(\nabla f=(1,0)^{T}\) ist nicht Vielfaches von \(\nabla F(0,0)=\mathbf{0}_2\), für kein \(\lambda\in\mathbb{R}\).</p>`,
        plus: String.raw`<p><b>Die Klausurfalle schlechthin.</b> Das Lagrange-Verfahren findet nur solche Extremwerte, in denen die Regularitätsvoraussetzung gilt. Die vollständige Kandidatenliste besteht deshalb aus <i>zwei</i> Sorten von Punkten: den Lösungen des Lagrange-Systems <b>und</b> den Punkten der Nebenbedingungsmenge mit \(\nabla F=\mathbf{0}_2\) (im allgemeinen Fall: mit Rangabfall, siehe <a href="#/7.12.4">7.12.4</a>). Letztere müssen von Hand untersucht werden.</p><p><b>Beweisstruktur zum Merken.</b> Auflösen (Satz über implizite Funktionen) — Einsetzen (\(\tilde f=f\circ\varkappa\)) — Kettenregel — \(\lambda\) taufen. Genau diese vier Schritte werden in <a href="#/7.12.4">7.12.4</a> wörtlich wiederholt, nur mit Matrizen statt Zahlen: aus \(1/F'_y\) wird \([F'_y]^{-1}\), aus dem einen \(\lambda\) ein Vektor \((\lambda_1,\dots,\lambda_n)^{T}\). Wer diese Karte verstanden hat, muss dort nur noch mitzählen.</p><p><b>Hinreichende Bedingungen</b> werden an dieser Stelle nicht bereitgestellt. Entschieden wird in der Praxis über Kompaktheit der Nebenbedingungsmenge und Vergleich der Funktionswerte in den endlich vielen Kandidaten (siehe das Beispiel in <a href="#/7.12.2">7.12.2</a>). Eine Übersicht über die verwendeten Sätze steht auf dem Spickzettel <a href="#/ref/saetze">Sätze</a>.</p>`}},
       {id:"7.12.4", title:"Der allgemeine Fall: k Variablen, n Nebenbedingungen", body:{
        def: String.raw`<p><b>Rahmen.</b> \(V\subset\mathbb{R}^{k}\) offen, \(\tilde x=(\tilde x_1,\dots,\tilde x_k)\in V\). Zielfunktion \(f:V\subset\mathbb{R}^{k}\to\mathbb{R}\), Nebenbedingung \(F:V\subset\mathbb{R}^{k}\to\mathbb{R}^{n}\) mit \(n< k\) und</p>\[F(\tilde x)=\begin{pmatrix}F_1(\tilde x_1,\dots,\tilde x_k)\\ \vdots\\ F_n(\tilde x_1,\dots,\tilde x_k)\end{pmatrix}=\mathbf{0}_n\qquad (n\ \text{Nebenbedingungen}).\]<p><b>Annahmen.</b> Alle partiellen Ableitungen der Ordnung 1 von \(f\) und \(F\) existieren und sind stetig; in \(\tilde x^{*}=(\tilde x^{*}_1,\dots,\tilde x^{*}_k)\) liege ein lokaler Extremwert unter den Nebenbedingungen vor; und es gelte die <b>Rangbedingung</b></p>\[\operatorname{rg}\Big(\left.\mathcal{J}_{\tilde x}(F)\right|_{\tilde x=\tilde x^{*}}\Big)=n\qquad\text{für }\tilde x\in U_\varepsilon(\tilde x^{*})\cap V\]<p>(so steht es an der Tafel; gemeint ist, dass \(\mathcal{J}_{\tilde x}(F)\) in der ganzen Umgebung \(U_\varepsilon(\tilde x^{*})\cap V\) den vollen Rang \(n\) hat).</p><p><b>Schritt 1 (Auflösen).</b> Nach Umnummerierung spaltet man</p>\[\tilde x=(\underbrace{\tilde x_1,\dots,\tilde x_{k-n}}_{=:\,x}\,;\ \underbrace{\tilde x_{k-n+1},\dots,\tilde x_k}_{=:\,y}),\qquad F'_{\tilde x}=\mathcal{J}_{\tilde x}(F)=\big(\underbrace{F'_x}_{(n,\,k-n)},\ \underbrace{F'_y}_{(n,n)}\big),\]<p>so dass \(F'_y(x^{*},y^{*})\) invertierbar ist. Dann ist \(F(\tilde x)=\mathbf{0}_n\) lokal auflösbar zu \(y=y(x)\), also \(y_1=y_1(x_1,\dots,x_{k-n}),\dots,y_n=y_n(x_1,\dots,x_{k-n})\), wobei \(y\) nach \(x\) differenzierbar ist; mit \(\varkappa:x\in\mathbb{R}^{k-n}\mapsto\begin{pmatrix}x\\ y(x)\end{pmatrix}\) gilt</p>\[\underbrace{y'_x(x^{*})}_{(n,\,k-n)}=-\underbrace{\big[F'_y(x^{*},y^{*})\big]^{-1}}_{(n,n)}\ \underbrace{F'_x(x^{*},y^{*})}_{(n,\,k-n)}.\]<p><b>Schritt 2 (Einsetzen und Kettenregel).</b> \(\hat f(x)=f(x,y(x))=(f\circ\varkappa)(x)\) hat in \(x^{*}\) einen freien lokalen Extremwert, also</p>\[0=\left.\hat f'_x\right|_{x=x^{*}}=\left.f'_{(x,y)}\right|_{\varkappa(x^{*})}\cdot\varkappa'_x(x^{*})=\big(f'_x,\ f'_y\big)\begin{pmatrix}\mathbf{1}\\ y'(x)\end{pmatrix},\]\[\text{d.h.}\quad 0=f'_x(x^{*},y^{*})-f'_y(x^{*},y^{*})\big[F'_y(x^{*},y^{*})\big]^{-1}F'_x(x^{*},y^{*}),\]\[\text{bzw.}\quad f'_y(x^{*},y^{*})\big[F'_y(x^{*},y^{*})\big]^{-1}F'_x(x^{*},y^{*})=f'_x(x^{*},y^{*}).\]<p><b>Schritt 3 (Transponieren und \(\lambda\) taufen).</b></p>\[\big[F'_x(x^{*},y^{*})\big]^{T}\underbrace{\big[F_y'^{\,T}(x^{*},y^{*})\big]^{-1}\big[f'_y(x^{*},y^{*})\big]^{T}}_{=:\ (\lambda_1,\dots,\lambda_n)^{T}}=\big[f'_x(x^{*},y^{*})\big]^{T},\]<p>also, da die Spalten von \(\big[F'_x\big]^{T}\) gerade die \(\nabla_x F_\ell\) sind,</p>\[\big(\nabla_x F_1(x^{*},y^{*}),\ \dots,\ \nabla_x F_n(x^{*},y^{*})\big)\begin{pmatrix}\lambda_1\\ \vdots\\ \lambda_n\end{pmatrix}=\nabla_x f(x^{*},y^{*}),\]<p>und damit</p>\[\nabla_x f(x^{*},y^{*})=\sum_{\ell=1}^{n}\lambda_\ell\,\nabla_x F_\ell(x^{*},y^{*}),\qquad \nabla_y f(x^{*},y^{*})=\sum_{\ell=1}^{n}\lambda_\ell\,\nabla_y F_\ell(x^{*},y^{*}).\]<p><b>Definition (Lagrange-Funktion mit \(n\) Multiplikatoren).</b></p>\[\mathcal{L}(\tilde x;\lambda_1,\dots,\lambda_n)=f(\tilde x)-\sum_{\ell=1}^{n}\lambda_\ell F_\ell(\tilde x),\qquad \tilde x=(x,y).\]<p><b>Notwendige Bedingungen.</b> Es muss erfüllt sein:</p><p>(1) \(\ \left.\nabla_{\tilde x}\mathcal{L}\right|_{\tilde x=\tilde x^{*}}=\nabla_{\tilde x}f(\tilde x^{*})-\displaystyle\sum_{\ell=1}^{n}\lambda_\ell\,\nabla_{\tilde x}F_\ell(\tilde x^{*})=\mathbf{0}_k\);</p><p>(2) \(\ \left.\nabla_\lambda\mathcal{L}\right|_{\tilde x=\tilde x^{*}}=\mathbf{0}_n\), d.h. \(F(\tilde x^{*})=\mathbf{0}_n\).</p><p>Das sind \(k+n\) Gleichungen für die \(k+n\) Unbekannten \(\tilde x\) (\(k\) Stück) und \(\lambda=(\lambda_1,\dots,\lambda_n)\) (\(n\) Stück).</p>`,
        worte: String.raw`<p>Inhaltlich passiert nichts Neues gegenüber <a href="#/7.12.3">7.12.3</a> — es werden nur Zahlen durch Matrizen ersetzt. Aus der Zahl \(F'_y\ne0\) wird die invertierbare \((n,n)\)-Matrix \(F'_y\), aus \(-\frac{1}{F'_y}F'_x\) wird \(-[F'_y]^{-1}F'_x\), aus dem einen \(\lambda\) wird der Vektor \((\lambda_1,\dots,\lambda_n)^{T}\). Beim Nachrechnen lohnt es sich, die Formate mitzuführen: \(F'_x\) ist \((n,k-n)\), \(F'_y\) ist \((n,n)\), \(y'_x\) ist \((n,k-n)\) — nur so passt das Produkt zusammen.</p><p>Der Kern ist die <b>Rangbedingung</b> \(\operatorname{rg}\mathcal{J}_{\tilde x}(F)=n\). Sie sagt, dass die \(n\) Nebenbedingungen in der Nähe von \(\tilde x^{*}\) wirklich \(n\) unabhängige Einschränkungen sind und nicht heimlich voneinander abhängen. Technisch garantiert sie, dass irgendein \((n,n)\)-Block der Jacobi-Matrix invertierbar ist — nach Umnummerierung der Variablen ist das der Block \(F'_y\), und genau das braucht der Satz über implizite Funktionen. Geometrisch heißt sie: Die Nebenbedingungsmenge ist lokal ein \((k-n)\)-dimensionales Gebilde, über \(x\) als Graph \(y=y(x)\) darstellbar.</p><p>Die Schlussformel \(\nabla f=\sum_\ell\lambda_\ell\nabla F_\ell\) sagt: Der Gradient der Zielfunktion liegt im <b>Aufspann der Gradienten der Nebenbedingungen</b>. Anders gesagt: \(\nabla f\) hat keine Komponente <i>längs</i> der Nebenbedingungsmenge, sonst könnte man dort weiterlaufen und \(f\) vergrößern — dieselbe Idee wie die Tangentialität aus <a href="#/7.12.1">7.12.1</a>, nur in \(k\) Dimensionen. Hübsch ist, dass an der Tafel nur die \(x\)-Zeile bewiesen werden muss: Die \(y\)-Zeile ist die Definition von \((\lambda_1,\dots,\lambda_n)^{T}\), umgestellt. Genau deswegen fasst die Tafel beide zu der einen Gleichung \(\nabla_{\tilde x}\mathcal{L}=\mathbf{0}_k\) zusammen.</p>`,
        beispiel: String.raw`<p><b>Ein Beispiel mit \(k=3\), \(n=2\).</b> Maximiere \(f(\tilde x)=\tilde x_3\) auf dem Schnitt der Einheitssphäre mit einer Ebene durch den Ursprung:</p>\[F_1(\tilde x)=\tilde x_1^{2}+\tilde x_2^{2}+\tilde x_3^{2}-1=0,\qquad F_2(\tilde x)=\tilde x_1+\tilde x_2+\tilde x_3=0.\]<p><b>Schritt 1: Rangbedingung prüfen.</b></p>\[\mathcal{J}_{\tilde x}(F)=\begin{pmatrix}2\tilde x_1&2\tilde x_2&2\tilde x_3\\ 1&1&1\end{pmatrix}.\]<p>Der Rang ist nur dann kleiner als \(2\), wenn die erste Zeile ein Vielfaches der zweiten ist, d.h. \(\tilde x=t\,(1,1,1)^{T}\). Wegen \(F_2(\tilde x)=3t=0\) wäre dann \(t=0\) und \(\tilde x=\mathbf{0}_3\), was \(F_1=0\) widerspricht. Also gilt \(\operatorname{rg}\mathcal{J}_{\tilde x}(F)=2=n\) in <i>jedem</i> Punkt der Nebenbedingungsmenge.</p><p><b>Schritt 2: Lagrange-Funktion.</b></p>\[\mathcal{L}(\tilde x;\lambda_1,\lambda_2)=\tilde x_3-\lambda_1\big(\tilde x_1^{2}+\tilde x_2^{2}+\tilde x_3^{2}-1\big)-\lambda_2\big(\tilde x_1+\tilde x_2+\tilde x_3\big).\]<p><b>Schritt 3: die \(k+n=5\) Gleichungen.</b> Aus (1):</p>\[-2\lambda_1\tilde x_1-\lambda_2=0,\qquad -2\lambda_1\tilde x_2-\lambda_2=0,\qquad 1-2\lambda_1\tilde x_3-\lambda_2=0,\]<p>aus (2): \(\ \tilde x_1^{2}+\tilde x_2^{2}+\tilde x_3^{2}=1\) und \(\tilde x_1+\tilde x_2+\tilde x_3=0\).</p><p><b>Schritt 4: auflösen.</b> Die Differenz der ersten beiden Gleichungen ist \(2\lambda_1(\tilde x_2-\tilde x_1)=0\). Wäre \(\lambda_1=0\), so folgte aus der ersten Gleichung \(\lambda_2=0\) und dann aus der dritten \(1=0\) — unmöglich. Also \(\tilde x_1=\tilde x_2=:a\). Die Ebenengleichung gibt \(\tilde x_3=-2a\), die Sphärengleichung</p>\[a^{2}+a^{2}+4a^{2}=6a^{2}=1\ \Longrightarrow\ a=\pm\frac{1}{\sqrt6}.\]<p><b>Schritt 5: Kandidaten und Entscheidung.</b> Es bleiben</p>\[\tilde x^{*}=\frac{1}{\sqrt6}\begin{pmatrix}-1\\ -1\\ 2\end{pmatrix}\ \text{mit}\ f=\frac{2}{\sqrt6},\qquad \frac{1}{\sqrt6}\begin{pmatrix}1\\ 1\\ -2\end{pmatrix}\ \text{mit}\ f=-\frac{2}{\sqrt6}.\]<p>Die Nebenbedingungsmenge ist als Schnitt einer Sphäre mit einer Ebene abgeschlossen und beschränkt, also kompakt; die stetige Funktion \(f\) nimmt dort Maximum und Minimum an, und beide müssen unter den Kandidaten sein. Also ist \(\frac{2}{\sqrt6}=\frac{\sqrt6}{3}\) das Maximum, angenommen in \(\tilde x^{*}\).</p><p><b>Schritt 6: Multiplikatoren und Probe.</b> Aus der ersten Gleichung \(\lambda_2=-2\lambda_1 a\), eingesetzt in die dritte: \(1=2\lambda_1\tilde x_3+\lambda_2=-4\lambda_1a-2\lambda_1a=-6\lambda_1a\). Mit \(a=-\frac{1}{\sqrt6}\) folgt \(\lambda_1=\frac{1}{\sqrt6}\) und \(\lambda_2=\frac13\). Probe:</p>\[\lambda_1\nabla F_1(\tilde x^{*})+\lambda_2\nabla F_2(\tilde x^{*})=\frac{1}{\sqrt6}\begin{pmatrix}-2/\sqrt6\\ -2/\sqrt6\\ 4/\sqrt6\end{pmatrix}+\frac13\begin{pmatrix}1\\ 1\\ 1\end{pmatrix}=\begin{pmatrix}-\tfrac13+\tfrac13\\ -\tfrac13+\tfrac13\\ \tfrac23+\tfrac13\end{pmatrix}=\begin{pmatrix}0\\ 0\\ 1\end{pmatrix}=\nabla f.\]<p>Die notwendige Bedingung ist also erfüllt.</p>`,
        plus: String.raw`<p><b>Zählen als Kontrolle.</b> \(k\) Variablen, \(n\) Nebenbedingungen, \(n\) Multiplikatoren: \(k+n\) Unbekannte gegen \(k+n\) Gleichungen. Passt die Zählung in einer Aufgabe nicht, ist meist eine Nebenbedingung vergessen oder ein Multiplikator zu wenig angesetzt. Die Bedingung \(n< k\) ist wesentlich: Bei \(n=k\) wäre die Nebenbedingungsmenge (bei vollem Rang) diskret, es gäbe nichts mehr zu optimieren.</p><p><b>Der Fall \(n=1\)</b> ist genau <a href="#/7.12.2">7.12.2</a> bzw. <a href="#/7.12.3">7.12.3</a>: Die Rangbedingung \(\operatorname{rg}\mathcal{J}_{\tilde x}(F)=1\) bedeutet dann schlicht \(\nabla F\ne\mathbf{0}_k\), und aus der Summe wird der eine Term \(\lambda\nabla F\).</p><p><b>Praxis.</b> Erst die Rangbedingung auf der ganzen Nebenbedingungsmenge prüfen und die Ausnahmepunkte (Rangabfall) als zusätzliche Kandidaten notieren; dann das System aufstellen und die \(\lambda_\ell\) so früh wie möglich eliminieren (Differenzen und Quotienten von Gleichungen bilden, aber Fallunterscheidung \(\lambda_\ell=0\) nicht vergessen); zuletzt die Kandidaten in \(f\) einsetzen und über Kompaktheit entscheiden. Die \(\lambda_\ell\) sind unter der Rangbedingung übrigens eindeutig bestimmt, denn die \(\nabla F_\ell(\tilde x^{*})\) sind linear unabhängig.</p><p><b>Roter Faden.</b> Damit schließt sich der Bogen des Kapitels: Der Satz über implizite Funktionen war kein Selbstzweck, sondern liefert hier — wie schon bei der Beschreibung von Niveaumengen — das Werkzeug, mit dem sich eine implizit gegebene Menge lokal als Graph behandeln lässt. Eine Übersicht der benutzten Aussagen steht auf dem Spickzettel <a href="#/ref/saetze">Sätze</a>, die Ableitungsregeln auf <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}}]}
   ]}
];

        <tr><td>\(\cos x-\cos y=-2\sin\dfrac{x+y}{2}\sin\dfrac{x-y}{2}\)</td></tr>
      </table>
    </div>
  </div>
  <div class="refblock">
    <h3>Euler-Formel &amp; Anwendung</h3>
    <table class="reftable">
      <tr><td>\(e^{ix}=\cos x+i\sin x\)</td><td>\(\cos x=\dfrac{e^{ix}+e^{-ix}}{2},\quad \sin x=\dfrac{e^{ix}-e^{-ix}}{2i}\)</td></tr>
    </table>
    ${exBox(String.raw`<p>Doppelwinkel beim Integrieren:</p>\[\int\sin^{2}x\,dx=\int\frac{1-\cos 2x}{2}\,dx=\frac{x}{2}-\frac{\sin 2x}{4}+C\]`)}
  </div>
  <div class="refblock">
    <h3>Hyperbelfunktionen \(\sinh,\cosh,\tanh\)</h3>
    <p class="sub">\(\sinh x=\frac{e^{x}-e^{-x}}{2},\quad \cosh x=\frac{e^{x}+e^{-x}}{2},\quad \tanh x=\frac{\sinh x}{\cosh x}\). Fast wie trig — aber auf die Vorzeichen achten!</p>
    <div class="twocol">
      <div class="refblock">
        <h3>Additionstheoreme</h3>
        <table class="reftable">
          <tr><td>\(\sinh(x\pm y)=\sinh x\cosh y\pm\cosh x\sinh y\)</td></tr>
          <tr><td>\(\cosh(x\pm y)=\cosh x\cosh y\pm\sinh x\sinh y\)</td></tr>
          <tr><td>\(\tanh(x\pm y)=\dfrac{\tanh x\pm\tanh y}{1\pm\tanh x\tanh y}\)</td></tr>
          <tr><td>\(\sinh 2x=2\sinh x\cosh x\)</td></tr>
          <tr><td>\(\cosh 2x=\cosh^{2}x+\sinh^{2}x=2\cosh^{2}x-1\)</td></tr>
        </table>
      </div>
      <div class="refblock">
        <h3>Identitäten & Ableitungen</h3>
        <table class="reftable">
          <tr><td>\(\cosh^{2}x-\sinh^{2}x=1\)</td><td class="cond">„Pythagoras"</td></tr>
          <tr><td>\(1-\tanh^{2}x=\dfrac{1}{\cosh^{2}x}\)</td></tr>
          <tr><td>\((\sinh x)'=\cosh x,\ (\cosh x)'=\sinh x\)</td></tr>
          <tr><td>\((\tanh x)'=\dfrac{1}{\cosh^{2}x}=1-\tanh^{2}x\)</td></tr>
          <tr><td>\(\cosh(ix)=\cos x,\ \sinh(ix)=i\sin x\)</td><td class="cond">Brücke zu trig</td></tr>
        </table>
      </div>
    </div>
    ${exBox(String.raw`<p>Vorzeichen-Merker: bei \(\cosh(x+y)\) steht ein <b>Plus</b> (nicht Minus wie bei \(\cos\)), und \(\cosh^{2}-\sinh^{2}=1\) (nicht \(+\)). Check über die Definition:</p>\[\cosh^{2}x-\sinh^{2}x=\frac{(e^{x}+e^{-x})^{2}-(e^{x}-e^{-x})^{2}}{4}=\frac{4}{4}=1.\]`)}
  </div>`; }

function reihenHtml(){ return String.raw`
  <div class="twocol">
    <div class="refblock">
      <h3>Endliche Summen</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\sum_{k=1}^{n}k=\frac{n(n+1)}{2}\)</td><td class="cond">Gauß-Summe</td></tr>
        <tr><td>\(\displaystyle\sum_{k=m}^{n}q^{k}=\frac{q^{m}-q^{n+1}}{1-q}\)</td><td class="cond">geometrisch, \(q\neq1\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=1}^{n}\big(b_{k}-b_{k+1}\big)=b_{1}-b_{n+1}\)</td><td class="cond">Teleskop</td></tr>
      </table>
      <h3 style="margin-top:16px">Geometrische Reihe</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\sum_{k=m}^{\infty}q^{k}=\frac{q^{m}}{1-q}\)</td><td class="cond">\(|q|<1\)</td></tr>
        <tr><td>Merke: \(\dfrac{\text{erster Summand}}{1-q}\) — der Start \(m\) steckt nur im Zähler</td><td class="cond"></td></tr>
      </table>
      ${exBox(String.raw`<p>Geometrisch, \(q=\tfrac12\), Start \(m=1\):</p>\[\sum_{k=1}^{\infty}\Big(\tfrac{1}{2}\Big)^{k}=\frac{1/2}{1-1/2}=1\]<p>Genau die Merkregel: erster Summand \(\tfrac12\) durch \(1-q=\tfrac12\).</p>`,"Beispiel: q = ½, Start m = 1")}
      <h3 style="margin-top:16px">Werte &amp; Konvergenz-Fakten</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\frac{1}{k}=\infty\)</td><td class="cond">harmonisch</td></tr>
        <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\frac{1}{k^{p}}\) konv. \(\Leftrightarrow p>1\)</td><td class="cond">p-Reihe</td></tr>
        <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\frac{1}{k^{2}}=\frac{\pi^{2}}{6}\)</td><td class="cond">Basel</td></tr>
        <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\frac{(-1)^{k+1}}{k}=\ln 2\)</td><td class="cond">Leibniz</td></tr>
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}=\frac{\pi}{4}\)</td><td class="cond">Leibniz</td></tr>
      </table>
    </div>
    <div class="refblock">
      <h3>Potenzreihen-Klassiker (um \(0\))</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}\frac{x^{k}}{k!}=e^{x}\)</td><td class="cond">\(\forall x\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}\frac{(-1)^{k}x^{2k}}{(2k)!}=\cos x\)</td><td class="cond">\(\forall x\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}\frac{(-1)^{k}x^{2k+1}}{(2k+1)!}=\sin x\)</td><td class="cond">\(\forall x\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}x^{k}=\frac{1}{1-x}\)</td><td class="cond">\(|x|<1\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\frac{(-1)^{k+1}}{k}x^{k}=\ln(1+x)\)</td><td class="cond">\(-1< x\le1\)</td></tr>
        <tr><td>\(\displaystyle\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}x^{2k+1}=\arctan x\)</td><td class="cond">\(|x|\le1\)</td></tr>
        <tr><td>\(\displaystyle(1+x)^{\alpha}=\sum_{k=0}^{\infty}\binom{\alpha}{k}x^{k}\)</td><td class="cond">\(|x|<1\)</td></tr>
      </table>
      ${exBox(String.raw`<p>Quotientenkriterium für \(\sum\frac{x^{k}}{k!}\):</p>\[\left|\frac{a_{k+1}}{a_{k}}\right|=\frac{|x|}{k+1}\to 0<1\quad(k\to\infty)\ \Rightarrow\ \text{konvergent }\forall x\]`,"Beispiel: warum e-Reihe überall konvergiert")}
    </div>
  </div>
  <div class="refblock">
    <h3>Teleskopreihen</h3>
    <table class="reftable">
      <tr><td>\(\displaystyle\sum_{k=1}^{n}\big(b_{k}-b_{k+1}\big)=b_{1}-b_{n+1}\) — die mittleren Terme heben sich alle weg</td></tr>
      <tr><td>\(\displaystyle\sum_{k=1}^{\infty}\big(b_{k}-b_{k+1}\big)=b_{1}-\lim_{n\to\infty}b_{n+1}\)</td><td class="cond">falls der Limes existiert</td></tr>
    </table>
    ${exBox(String.raw`<p>Mit Partialbruch \(\dfrac{1}{k(k+1)}=\dfrac{1}{k}-\dfrac{1}{k+1}\) (also \(b_k=\tfrac1k\)):</p>\[\sum_{k=1}^{n}\frac{1}{k(k+1)}=1-\frac{1}{n+1}\ \longrightarrow\ 1.\]<p>Typisches Muster: Bruch per PBZ in eine Differenz \(b_k-b_{k+1}\) verwandeln.</p>`,"Teleskop-Klassiker")}
  </div>
  <div class="refblock">
    <h3>Fourierreihen &amp; Orthogonalität</h3>
    <p class="sub">Für \(2\pi\)-periodische Funktionen: \(f\) als Überlagerung von Sinus/Kosinus schreiben.</p>
    <table class="reftable">
      <tr><td>\(\displaystyle f(x)\sim\frac{a_0}{2}+\sum_{k=1}^{\infty}\big(a_k\cos kx+b_k\sin kx\big)\)</td></tr>
      <tr><td>\(\displaystyle a_k=\frac{1}{\pi}\int_{-\pi}^{\pi}f(x)\cos kx\,dx,\qquad b_k=\frac{1}{\pi}\int_{-\pi}^{\pi}f(x)\sin kx\,dx\)</td></tr>
      <tr><td><b>Orthogonalität</b> (\(k,m\ge1\)): \(\displaystyle\int_{-\pi}^{\pi}\sin kx\,\sin mx\,dx=\pi\,\delta_{km},\quad \int_{-\pi}^{\pi}\cos kx\,\cos mx\,dx=\pi\,\delta_{km},\quad \int_{-\pi}^{\pi}\sin kx\,\cos mx\,dx=0\)</td></tr>
      <tr><td>Praktisch: \(f\) gerade \(\Rightarrow b_k=0\); \(f\) ungerade \(\Rightarrow a_k=0\)</td></tr>
    </table>
    ${exBox(String.raw`<p>Multipliziere die Reihe mit \(\sin mx\) und integriere über \([-\pi,\pi]\):</p>\[\int_{-\pi}^{\pi}f(x)\sin mx\,dx=\sum_{k}a_k\underbrace{\int\cos kx\sin mx}_{=0}+\sum_{k}b_k\underbrace{\int\sin kx\sin mx}_{=\pi\delta_{km}}=b_m\,\pi.\]<p>Wegen der Orthogonalität überlebt nur der Term \(k=m\) — genau das liefert die Koeffizientenformel. Die Orthogonalität selbst folgt aus Produkt→Summe: \(\sin kx\sin mx=\tfrac12[\cos(k-m)x-\cos(k+m)x]\), und \(\int_{-\pi}^{\pi}\cos(jx)\,dx=0\) für \(j\neq0\).</p>`,"Warum das klappt (Orthogonalität)")}
    ${exBox(String.raw`<p>\(f(x)=x\) auf \(\left]-\pi,\pi\right[\) ist ungerade \(\Rightarrow a_k=0\). Für \(b_k\) (partielle Integration):</p>\[b_k=\frac{1}{\pi}\int_{-\pi}^{\pi}x\sin kx\,dx=\frac{2}{\pi}\Big[-\frac{x\cos kx}{k}\Big]_{0}^{\pi}=-\frac{2\cos k\pi}{k}=\frac{2(-1)^{k+1}}{k}\]\[\Rightarrow\ x\sim 2\sum_{k=1}^{\infty}\frac{(-1)^{k+1}}{k}\sin kx.\]`,"Beispiel: Sägezahn f(x) = x")}
  </div>`; }

function grenzHtml(){ return String.raw`
  <div class="twocol">
    <div class="refblock">
      <h3>Bei \(x\to0\)</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{\sin x}{x}=1\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{\tan x}{x}=1\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{1-\cos x}{x^{2}}=\frac{1}{2}\)
          ${exBox(String.raw`<p>Über die \(\cos\)-Reihe:</p>\[\frac{1-\cos x}{x^{2}}=\frac{\frac{x^{2}}{2}-\frac{x^{4}}{24}+\cdots}{x^{2}}=\frac{1}{2}-\frac{x^{2}}{24}+\cdots\to\frac{1}{2}\quad(x\to0)\]`,"Herleitung über die cos-Reihe")}</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{e^{x}-1}{x}=1\)
          ${exBox(String.raw`<p>Über die \(e^{x}\)-Reihe:</p>\[\frac{e^{x}-1}{x}=\frac{x+\frac{x^{2}}{2}+\cdots}{x}=1+\frac{x}{2}+\cdots\to 1\quad(x\to0)\]`,"Herleitung über die e-Reihe")}</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{\ln(1+x)}{x}=1\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0}\frac{\arcsin x}{x}=1\)</td></tr>
      </table>
    </div>
    <div class="refblock">
      <h3>Bei \(x\to\infty\), \(n\to\infty\)</h3>
      <table class="reftable">
        <tr><td>\(\displaystyle\lim_{n\to\infty}\Big(1+\frac{1}{n}\Big)^{n}=e\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to\infty}\Big(1+\frac{a}{x}\Big)^{x}=e^{a}\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to\infty}\frac{x^{n}}{e^{x}}=0\)</td><td class="cond">\(n\) fest</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to\infty}\frac{\ln x}{x}=0\)</td></tr>
        <tr><td>\(\displaystyle\lim_{x\to0^{+}}x\ln x=0\)</td></tr>
        <tr><td>\(\displaystyle\lim_{n\to\infty}\sqrt[n]{n}=1,\ \lim_{n\to\infty}\sqrt[n]{a}=1\)</td><td class="cond">\(a>0\)</td></tr>
        <tr><td>\(\displaystyle\lim_{n\to\infty}\frac{\sqrt[n]{n!}}{n}=\frac{1}{e}\)</td><td class="cond">Stirling</td></tr>
      </table>
      <p class="sub" style="margin-top:8px">Merke: <b>exp \(\gg\) Potenz \(\gg\) Logarithmus</b>.</p>
    </div>
  </div>
  <div class="refblock">
    <h3>Häufige Umformungen — je mit Beispiel</h3>
    <table class="reftable">
      <tr><td><b>Konjugiert erweitern</b> (3. binomische) bei \(\sqrt{\ }-\sqrt{\ }\)
        ${exBox(String.raw`\[\sqrt{n^{2}+n}-n=\frac{(n^{2}+n)-n^{2}}{\sqrt{n^{2}+n}+n}=\frac{n}{\sqrt{n^{2}+n}+n}=\frac{1}{\sqrt{1+\frac1n}+1}\ \longrightarrow\ \frac{1}{2}\]`,"Beispiel: √(n²+n) − n → ½")}</td></tr>
      <tr><td><b>Potenz-Trick:</b> \(f(x)^{g(x)}=e^{\,g(x)\ln f(x)}\) — nur den Exponenten untersuchen
        ${exBox(String.raw`<p>\(\displaystyle\lim_{x\to0^{+}}x^{x}\):</p>\[x^{x}=e^{x\ln x},\qquad x\ln x\to0\ (x\to0^{+})\ \Rightarrow\ x^{x}\to e^{0}=1\]`,"Beispiel: x^x → 1 für x→0⁺")}</td></tr>
      <tr><td><b>Höchste Potenz ausklammern</b> bei rationalen Ausdrücken
        ${exBox(String.raw`\[\frac{3n^{2}+n}{2n^{2}+5}=\frac{n^{2}\big(3+\frac1n\big)}{n^{2}\big(2+\frac{5}{n^{2}}\big)}=\frac{3+\frac1n}{2+\frac{5}{n^{2}}}\ \longrightarrow\ \frac{3}{2}\]`,"Beispiel: (3n²+n)/(2n²+5) → 3/2")}</td></tr>
      <tr><td>\(\Big(1+\dfrac{a_n}{n}\Big)^{n}\to e^{a}\), falls \(a_n\to a\)
        ${exBox(String.raw`\[\Big(\frac{n+2}{n}\Big)^{n}=\Big(1+\frac{2}{n}\Big)^{n}\ \longrightarrow\ e^{2}\]`,"Beispiel: ((n+2)/n)ⁿ → e²")}</td></tr>
    </table>
  </div>
  <div class="refblock">
    <h3>Landau-Symbole \(o\) und \(O\)</h3>
    <p class="sub">Vergleichen das Verhalten zweier Funktionen für \(x\to a\) — <b>immer dazu sagen, wohin \(x\) läuft!</b> Die Idee auf einen Blick:</p>
    <div class="subgrid">
      <div class="subcard">
        <div class="subhead">\(f=o(g)\):\quad \(\displaystyle\lim_{x\to a}\left|\frac{f(x)}{g(x)}\right|=0\)</div>
        <div class="subrule">Der Quotient geht gegen <b>null</b>: \(f\) wird <b>vernachlässigbar klein</b> gegen \(g\).</div>
      </div>
      <div class="subcard">
        <div class="subhead">\(f=O(g)\):\quad \(\displaystyle\limsup_{x\to a}\left|\frac{f(x)}{g(x)}\right|<\infty\)</div>
        <div class="subrule">Der Quotient bleibt <b>beschränkt</b> („kleiner \(\infty\)"): \(f\) wächst <b>höchstens wie</b> \(g\) — muss aber nicht gegen 0 gehen.</div>
      </div>
    </div>
    <table class="reftable">
      <tr><td><b>klein-o:</b> \(f=o(g)\) für \(x\to a\)<span class="when">Einsetzen für Restglieder: \(f(x)=T_n(x)+o\big((x-x_0)^{n}\big)\), z. B. \(\sin x=x+o(x)\) für \(x\to0\).</span>
        ${exBox(String.raw`<p><b>Zutreffend:</b> \(x^{2}=o(x)\) für \(x\to0\), denn</p>\[\frac{x^{2}}{x}=x\ \longrightarrow\ 0\quad(x\to0).\]<p><b>Ähnlich, aber falsch:</b> \(x^{2}\) ist <b>nicht</b> \(o(x)\) für \(x\to\infty\) — gleicher Quotient, anderer Grenzpunkt:</p>\[\frac{x^{2}}{x}=x\ \longrightarrow\ \infty\quad(x\to\infty).\]<p>Und: \(\sin x=o(1)\) gilt <b>nicht</b> für \(x\to\infty\) (\(\sin x\not\to0\)), obwohl \(\sin x=O(1)\) stimmt.</p>`,"Beispiel & Gegenbeispiel: o")}</td></tr>
      <tr><td><b>groß-O:</b> \(f=O(g)\) für \(x\to a\)<span class="when">Einsetzen für Schranken und Fehlerordnungen, z. B. Trapezregel-Fehler \(=O(h^{2})\).</span>
        ${exBox(String.raw`<p><b>Zutreffend:</b> \(5x^{2}+3x=O(x^{2})\) für \(x\to\infty\), denn</p>\[\frac{5x^{2}+3x}{x^{2}}=5+\frac{3}{x}\ \longrightarrow\ 5\quad(\text{beschränkt}).\]<p><b>Ähnlich, aber falsch:</b> \(5x^{2}+3x\) ist <b>nicht</b> \(O(x)\) für \(x\to\infty\):</p>\[\frac{5x^{2}+3x}{x}=5x+3\ \longrightarrow\ \infty\quad(\text{unbeschränkt}).\]<p>Auch: \(\sin x=O(x)\) für \(x\to0\) (\(|\sin x|\le|x|\)) ✓ — aber \(\sqrt{x}\neq O(x)\) für \(x\to0^{+}\) (\(\frac{\sqrt x}{x}=\frac{1}{\sqrt x}\to\infty\)).</p>`,"Beispiel & Gegenbeispiel: O")}</td></tr>
      <tr><td><b>Rechenregeln:</b> \(o(g)\pm o(g)=o(g)\); \(O(g)\cdot O(h)=O(gh)\); \(f=o(g)\Rightarrow f=O(g)\) — die Umkehrung gilt <b>nicht</b> (\(\sin x=O(1)\), aber \(\neq o(1)\), \(x\to\infty\)).</td></tr>
    </table>
  </div>`; }

  <div class="refblock">

        <div class="rmstep">

          <span class="rmexit yes">Leibniz → ✅</span><span class="rmexit no">sonst → ⛔</span>

      <div class="rmpanels">

          ${exBox(String.raw`<p>\(\displaystyle\sum\frac1k\): \(a_k\to0\) ✓ — aber die Reihe ist trotzdem <b>divergent</b> (Station 3/4 zeigt es). Der Test kann nur aussortieren, nie Konvergenz beweisen.</p>`,"✗ Test entscheidet nicht: weiter prüfen")}
        </div>
        <div class="rmpanel fnode" id="rms2" hidden>

          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{k^{2}}{2^{k}}\) (Potenz im Nenner → Quotient):</p>\[\frac{a_{k+1}}{a_k}=\frac{(k+1)^{2}}{2k^{2}}\ \longrightarrow\ \frac12<1\ \Rightarrow\ \text{✅ konvergent.}\]`,"✓ Beispiel: L < 1")}

          <div class="ftit"><span class="fnum">3</span><span>Rational in \(k\)? Nur die <b>höchsten Potenzen</b> zählen: \(a_k\sim\frac{c}{k^{p}}\) → Grenzwertvergleich mit der p-Reihe.</span></div>
          <div class="fout"><span class="fyes">p &gt; 1 → ✅ konvergent</span><span class="fno">p ≤ 1 → ⛔ divergent</span><span class="fnext">passt nicht → Station 4</span></div>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{2k+3}{k^{3}-k+1}\): führend \(\sim\frac{2}{k^{2}}\), Grenzwertvergleich mit \(\frac{1}{k^{2}}\) liefert \(\frac{a_k}{b_k}\to2\in\left]0,+\infty\right[\) ⇒ wie \(\sum k^{-2}\): <b>✅ konvergent</b> (\(p=2>1\)).</p>`,"✓ Beispiel: p = 2 > 1")}
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{k+1}{k^{2}+5}\): führend \(\sim\frac1k\) ⇒ wie die harmonische Reihe: <b>⛔ divergent</b> (\(p=1\)).</p>`,"✗ Beispiel: p = 1, harmonisch")}
        </div>
        <div class="rmpanel fnode" id="rms4" hidden>
          <div class="ftit"><span class="fnum">4</span><span>Logarithmen / \(f(k)\) leicht integrierbar? → <b>Integralkriterium</b> (\(f\ge0\) fallend).</span></div>
          <div class="fout"><span class="fyes">\(\int_1^{+\infty}f\) konv. → ✅</span><span class="fno">\(\int_1^{+\infty}f\) div. → ⛔</span><span class="fnext">Vorzeichenwechsel? → Station 5</span></div>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{1}{k\,(\ln k)^{2}}\):</p>\[\int_2^{+\infty}\frac{dx}{x(\ln x)^{2}}=\Big[-\frac{1}{\ln x}\Big]_2^{+\infty}=\frac{1}{\ln 2}<\infty\ \Rightarrow\ \text{✅ konvergent.}\]`,"✓ Beispiel: Σ 1/(k ln²k)")}
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{1}{k\ln k}\):</p>\[\int_2^{+\infty}\frac{dx}{x\ln x}=\ln\ln x\Big|_2^{+\infty}=+\infty\ \Rightarrow\ \text{⛔ divergent}\]<p>— der Unterschied zwischen \(\ln k\) und \((\ln k)^{2}\) im Nenner entscheidet!</p>`,"✗ Beispiel: Σ 1/(k ln k)")}
        </div>
        <div class="rmpanel fnode" id="rms5" hidden>
          <div class="ftit"><span class="fnum">5</span><span>Vorzeichenwechsel: erst <b>absolute</b> Konvergenz testen (\(|a_k|\) durch Stationen 2–4 schicken); scheitert das → <b>Leibniz/Dirichlet</b> (monoton fallende Nullfolge?).</span></div>
          <div class="fout"><span class="fyes">absolut konv. → ✅ (robust)</span><span class="fyes">Leibniz greift → ✅ (bedingt)</span><span class="fno">nichts greift + \(a_k\not\to0\) → ⛔</span></div>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{(-1)^{k}}{\sqrt k}\): absolut? \(\sum\frac{1}{\sqrt k}\) divergiert (\(p=\tfrac12\)). Leibniz: \(\frac{1}{\sqrt k}\downarrow0\) monoton ⇒ <b>✅ konvergent (bedingt)</b> — Umordnen verboten!</p>`,"✓ Beispiel: Leibniz rettet")}
          ${exBox(String.raw`<p>\(\displaystyle\sum(-1)^{k}\frac{k}{k+1}\): sieht alternierend aus, aber \(|a_k|\to1\neq0\) ⇒ <b>⛔ divergent</b>. Moral: Station 1 gilt auch für alternierende Reihen — Leibniz braucht zwingend eine <i>Nullfolge</i>.</p>`,"✗ Beispiel: alternierend, aber keine Nullfolge")}
        </div>
      </div>
    </div>
  </div>
  <div class="twocol">
    <div class="refblock">
      <h3>Basis-Checks &amp; Vergleichskriterien</h3>
      <table class="reftable">
        <tr><td><b>Notwendig:</b> \(a_k\to0\)<span class="when">Immer zuerst prüfen: gilt \(a_k\not\to0\) → sofort divergent, fertig.</span></td><td class="cond">sonst div.</td></tr>
        <tr><td><b>Absolut:</b> \(\sum|a_k|\) konv. \(\Rightarrow\sum a_k\) konv.<span class="when">Einsetzen bei Vorzeichenwechseln oder komplexen Gliedern — erst \(\sum|a_k|\) testen.</span></td></tr>
        <tr><td><b>Majorante:</b> \(|a_k|\le b_k,\ \sum b_k\) konv. \(\Rightarrow\) konv.<span class="when">Einsetzen, wenn sich \(|a_k|\) gegen p-Reihe oder geometrische Reihe abschätzen lässt.</span>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{\ln k}{k^{2}}\): ab großem \(k\) ist \(\ln k\le\sqrt{k}\):</p>\[\frac{\ln k}{k^{2}}\le\frac{1}{k^{3/2}}\quad\Rightarrow\quad\text{konvergent }(p=\tfrac32>1).\]`,"Beispiel: Σ ln k / k²")}</td></tr>
        <tr><td><b>Minorante:</b> \(0\le c_k\le a_k,\ \sum c_k\) div. \(\Rightarrow\) div.<span class="when">Einsetzen für Divergenz-Nachweise — meist mit der harmonischen Reihe als Minorante.</span>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{1}{\sqrt{k(k+1)}}\): wegen \(k(k+1)\le (k+1)^{2}\):</p>\[\frac{1}{\sqrt{k(k+1)}}\ge\frac{1}{k+1}\quad\Rightarrow\quad\text{divergent (harmonische Minorante).}\]`,"Beispiel: Σ 1/√(k(k+1))")}</td></tr>
        <tr><td><b>p-Reihe:</b> \(\sum \frac{1}{k^{p}}\) konv. \(\Leftrightarrow p>1\)<span class="when">Der Standard-Vergleichspartner für Majorante/Minorante.</span></td></tr>
        <tr><td><b>Geometrisch:</b> \(\sum q^{k}\) konv. \(\Leftrightarrow |q|<1\)<span class="when">Vergleichspartner bei exponentiell fallenden Gliedern.</span></td></tr>
      </table>
    </div>
    <div class="refblock">
      <h3>An der Struktur von \(a_k\) erkennbar</h3>
      <table class="reftable">
        <tr><td><b>Quotient:</b> \(L=\lim\left|\frac{a_{k+1}}{a_k}\right|\)<span class="when">Einsetzen bei Fakultäten \(k!\) und Potenzen \(q^{k}\) — alles, was sich beim Schritt \(k\to k{+}1\) gut kürzt.</span>
          ${exBox(String.raw`<p>\(\displaystyle\sum \frac{k}{2^{k}}\):</p>\[\frac{a_{k+1}}{a_k}=\frac{k+1}{2k}\to\frac{1}{2}<1\ \Rightarrow\ \text{konvergent.}\]`,"Beispiel: Σ k/2^k")}</td><td class="cond">\(L<1\) konv, \(L>1\) div</td></tr>
        <tr><td><b>Wurzel:</b> \(L=\limsup_{k}\sqrt[k]{|a_k|}\)<span class="when">Einsetzen, wenn \(a_k\) selbst eine \(k\)-te Potenz \((\dots)^{k}\) ist — die Wurzel räumt den Exponenten ab.</span>
          ${exBox(String.raw`<p>\(\displaystyle\sum\Big(\tfrac{k}{k+1}\Big)^{k^{2}}\):</p>\[\sqrt[k]{a_k}=\Big(\frac{k}{k+1}\Big)^{k}=\Big(1+\tfrac{1}{k}\Big)^{-k}\to\frac{1}{e}<1\ \Rightarrow\ \text{konvergent.}\]`,"Beispiel: Σ (k/(k+1))^(k²)")}</td><td class="cond">\(L<1\) konv, \(L>1\) div</td></tr>
        <tr><td><b>Leibniz</b> (alternierend): \(a_k=(-1)^{k}b_k\), \(b_k\ge0\) monoton \(\downarrow 0\) \(\Rightarrow\) konv.<span class="when">Einsetzen bei \((-1)^{k}\cdot(\text{monoton fallende Nullfolge})\) — der Rettungsanker, wenn absolute Konvergenz scheitert.</span>
          ${exBox(String.raw`<p>\(\displaystyle\sum\frac{(-1)^{k+1}}{k}\): \(b_k=\tfrac1k\downarrow0\ \Rightarrow\) konvergent (bedingt, \(=\ln 2\)); \(\sum\tfrac1k\) selbst divergiert.</p>`,"Beispiel: Σ (−1)^(k+1)/k")}</td><td class="cond">\(|R_n|\le b_{n+1}\)</td></tr>
        <tr><td><b>Integralkriterium:</b> \(f\ge0\) fallend, \(a_k=f(k)\): \(\sum f(k)\) und \(\int_1^{+\infty}\!f\) gleiches Verhalten.<span class="when">Einsetzen, wenn \(f\) leicht integrierbar ist — Klassiker: \(\sum\frac{1}{k\ln k}\) div., denn \(\int\frac{dx}{x\ln x}=\ln\ln x\to\infty\).</span></td></tr>
      </table>
      <p class="sub" style="margin-top:8px">Bei \(L=1\): keine Aussage. Das Wurzel- ist „stärker" als das Quotientenkriterium — und wenn auch das mit \(L=1\) versagt, helfen die feineren Kriterien von <b>Raabe &amp; Kummer</b> (unten).</p>
    </div>
  </div>
  <div class="refblock">
    <h3>Wenn \(L=1\): die feineren Kriterien von Raabe &amp; Kummer</h3>
    <p class="sub">Genau für den blinden Fleck des Quotientenkriteriums (\(\frac{a_{k+1}}{a_k}\to1\)) gedacht. Beide brauchen \(a_k&gt;0\).</p>
    <table class="reftable">
      <tr><td><b>Raabe:</b> bilde \(\displaystyle R_k=k\Big(\frac{a_k}{a_{k+1}}-1\Big)\) (gleichwertig \(k\big(1-\frac{a_{k+1}}{a_k}\big)\)). Ist \(\liminf_k R_k&gt;1\) ⇒ <b>konvergent</b>; ist \(\limsup_k R_k&lt;1\) ⇒ <b>divergent</b>.<span class="when">Einsetzen, wenn das Quotientenkriterium \(L=1\) liefert: \(R_k\) misst die <i>Rate</i>, mit der \(\frac{a_{k+1}}{a_k}\to1\). Für die p-Reihe \(a_k=k^{-p}\) ist \(R_k\to p\) — Raabe „sieht" also den Exponenten und gibt konvergent \(\Leftrightarrow p&gt;1\).</span>
        ${exBox(String.raw`<p>Die Reihe \(\displaystyle\sum_{k\ge1}a_k\) mit \(\displaystyle a_k=\frac{1\cdot3\cdot5\cdots(2k-1)}{2\cdot4\cdot6\cdots(2k)}=\frac{1}{4^{k}}\binom{2k}{k}\).</p><p><b>1. Quotientenkriterium versagt:</b> beim Schritt \(k\to k{+}1\) kommt im Zähler \((2k+1)\), im Nenner \((2k+2)\) hinzu:</p>\[\frac{a_{k+1}}{a_k}=\frac{2k+1}{2k+2}\longrightarrow 1\qquad(L=1,\ \text{keine Aussage}).\]<p><b>2. Raabe ansetzen:</b> mit \(\displaystyle\frac{a_k}{a_{k+1}}=\frac{2k+2}{2k+1}=1+\frac{1}{2k+1}\) folgt</p>\[R_k=k\Big(\frac{a_k}{a_{k+1}}-1\Big)=\frac{k}{2k+1}\longrightarrow\frac12<1.\]<p><b>3. Ergebnis:</b> \(\lim R_k=\tfrac12<1\ \Rightarrow\ \textbf{divergent}\). Passt zur Asymptotik \(a_k\sim\frac{1}{\sqrt{\pi k}}\) (verhält sich wie \(\sum k^{-1/2}\), \(p=\tfrac12\)).</p>`,"Rechenbeispiel: Raabe an der Mittelbinomial-Reihe")}</td><td class="cond">\(R>1\) konv, \(R<1\) div</td></tr>
      <tr><td><b>Kummer:</b> wähle eine Hilfsfolge \(p_k&gt;0\) und bilde \(\displaystyle K_k=p_k\,\frac{a_k}{a_{k+1}}-p_{k+1}\). Gibt es ein \(c&gt;0\) mit \(K_k\ge c\) für große \(k\) (also \(\liminf_k K_k&gt;0\)) ⇒ <b>konvergent</b>. Ist \(K_k\le 0\) ab einem Index <b>und</b> divergiert \(\sum\frac{1}{p_k}\) ⇒ <b>divergent</b>.<span class="when">Das „Meister-Kriterium", aus dem die anderen fallen: \(p_k=1\) ⇒ Quotientenkriterium, \(p_k=k\) ⇒ Raabe (\(K_k=R_k-1\)), \(p_k=k\ln k\) ⇒ Bertrand. Freie Wahl von \(p_k\) = mehr Feinschärfe.</span>
        ${exBox(String.raw`<p>Gleiche Reihe \(\displaystyle a_k=\frac{1}{4^{k}}\binom{2k}{k}\), jetzt mit Kummer und der Wahl \(p_k=k\).</p><p><b>1. \(K_k\) ausrechnen</b> (mit \(\frac{a_k}{a_{k+1}}=\frac{2k+2}{2k+1}\)):</p>\[K_k=k\cdot\frac{2k+2}{2k+1}-(k+1)=\frac{k(2k+2)-(k+1)(2k+1)}{2k+1}=\frac{-(k+1)}{2k+1}\longrightarrow-\frac12.\]<p><b>2. Divergenz-Ast:</b> \(K_k<0\) ab \(k=1\) <i>und</i> \(\sum\frac{1}{p_k}=\sum\frac1k\) divergiert \(\Rightarrow\) <b>divergent</b> — dieselbe Aussage wie oben, denn \(p_k=k\) liefert genau \(K_k=R_k-1\).</p><p><b>3. Konvergenz-Ast zur Gegenprobe</b> (\(a_k=\frac1{k^2}\), \(p_k=k\)):</p>\[K_k=k\cdot\frac{(k+1)^2}{k^2}-(k+1)=\frac{(k+1)^2}{k}-(k+1)=\frac{k+1}{k}\longrightarrow 1>0\ \Rightarrow\ \textbf{konvergent.}\]`,"Rechenbeispiel: Kummer mit Hilfsfolge p_k = k")}</td><td class="cond">\(\liminf K_k>0\) konv</td></tr>
    </table>
    <p class="sub" style="margin-top:8px">Auch Raabe/Kummer haben einen Grenzfall (\(R=1\) bzw. \(\liminf K_k=0\)) ohne Aussage — dann eine feinere Hilfsfolge \(p_k\) (z. B. Bertrand \(k\ln k\)) wählen oder direkt vergleichen.</p>
  </div>
  <div class="refblock">
    <h3>Tricks: typische Majoranten, Minoranten &amp; Umformungen</h3>
    <table class="reftable">
      <tr><td><b>Vergleichs-Skala:</b> \(\sum\frac{1}{k^{p}}\) (konv. \(\Leftrightarrow p>1\)), \(\sum q^{k}\) (\(|q|<1\)), \(\sum k^{a}q^{k}\) konv. für \(|q|<1\) (jedes \(a\))</td></tr>
      <tr><td><b>„Nur höchste Potenzen zählen":</b> \(\dfrac{P(k)}{Q(k)}\sim\dfrac{c}{k^{\deg Q-\deg P}}\) → Grenzwertvergleich mit \(\frac{1}{k^{p}}\)
        ${exBox(String.raw`<p>\(\displaystyle\sum\frac{2k+3}{k^{3}-k+1}\). Höchste Potenzen: \(\sim\frac{2}{k^{2}}\). Prüfen mit \(b_k=\frac{1}{k^{2}}\):</p>\[\frac{a_k}{b_k}=\frac{(2k+3)k^{2}}{k^{3}-k+1}\longrightarrow 2\in\left]0,+\infty\right[\ \Rightarrow\ \text{wie }\sum\frac{1}{k^{2}}\ \text{konvergent.}\]`,"Beispiel: Grenzwertvergleich")}</td></tr>
      <tr><td><b>Beschränktes wegschätzen:</b> \(|\sin k|,|\cos k|\le1\) → \(\Big|\dfrac{\sin k}{k^{2}}\Big|\le\dfrac{1}{k^{2}}\)</td></tr>
      <tr><td><b>Logs sind klein:</b> \(\ln k\le C_\varepsilon\,k^{\varepsilon}\) → z. B. \(\dfrac{\ln k}{k^{2}}\le\dfrac{C\,k^{1/2}}{k^{2}}=\dfrac{C}{k^{3/2}}\) (konv.)</td></tr>
      <tr><td><b>Minoranten für Divergenz:</b> \(\dfrac{1}{\sqrt{k}}\ge\dfrac{1}{k}\); \(\dfrac{k+1}{k^{2}+5}\sim\dfrac{1}{k}\) (div.)</td></tr>
    </table>
  </div>
  <div class="refblock">
    <h3>Summierbarkeit divergenter Reihen</h3>
    <p class="sub">Divergente Reihen bekommen über gemittelte/geglättete Grenzwerte einen sinnvollen „Wert". Beide Verfahren sind <b>regulär</b>: eine schon konvergente Reihe behält ihren Wert. Durchgängiges Beispiel: die <b>Grandi-Reihe</b> \(1-1+1-1+\cdots\) (\(a_k=(-1)^{k+1}\), Start \(k=1\) wie in der Vorlesung).</p>
    <table class="reftable">
      <tr><td><b>Cesàro (C,1)</b> — über die <b>Partialsummen</b>: bilde \(S_n=a_1+\cdots+a_n\), dann ihr Mittel \(\displaystyle\sigma_n=\frac{S_1+S_2+\cdots+S_n}{n}\). Cesàro-Summe \(S_c=\lim_{n\to\infty}\sigma_n\).<span class="when">Einsetzen, wenn die Partialsummen beschränkt hin- und herspringen — das Mitteln glättet die Sprünge.</span>
        ${exBox(String.raw`<p><b>Schritt 1 — Partialsummen:</b> \(S_n=1,0,1,0,\dots\) (springt, divergent).</p><p><b>Schritt 2 — aufsummieren:</b> \(S_1+\cdots+S_n\): \(1,1,2,2,3,3,\dots\) — allgemein \(=m\) für \(n=2m\) wie für \(n=2m-1\).</p><p><b>Schritt 3 — mitteln:</b></p>\[\sigma_{2m}=\frac{m}{2m}=\frac12\ \text{(exakt!)},\qquad \sigma_{2m-1}=\frac{m}{2m-1}\ \longrightarrow\ \frac12\]<p>Beide Teilfolgen \(\to\tfrac12\) \(\Rightarrow\) <b>Cesàro-Summe \(S_c=\tfrac12\)</b>.</p>`,"Rechenbeispiel: Grandi nach Cesàro")}</td></tr>
      <tr><td><b>Abel / Poisson-Abel</b> — über die <b>Potenzreihe</b>: bilde \(f(x)=\sum_k a_k x^{k}\) (\(|x|<1\)), dann lasse \(x\to1^{-}\). Abel-Summe \(=\lim_{x\to1^{-}}f(x)\).<span class="when">Einsetzen, wenn \(\sum a_k x^{k}\) eine geschlossene Form hat — meist geometrische Reihe oder deren Ableitung.</span>
        ${exBox(String.raw`<p><b>Schritt 1 — Potenzreihe aufstellen:</b> mit \(a_k=(-1)^{k+1}\), \(k\ge1\):</p>\[f(x)=\sum_{k=1}^{\infty}(-1)^{k+1}x^{k}=x\sum_{j=0}^{\infty}(-x)^{j}\]<p><b>Schritt 2 — geschlossene Form</b> (geometrische Reihe mit \(q=-x\), \(|q|<1\)):</p>\[f(x)=x\cdot\frac{1}{1-(-x)}=\frac{x}{1+x},\qquad |x|<1\]<p><b>Schritt 3 — Randlimes:</b></p>\[\lim_{x\to1^{-}}\frac{x}{1+x}=\frac12\ \Rightarrow\ \textbf{Abel-Summe }=\tfrac12\]<p>— gleicher Wert wie Cesàro, wie es Frobenius verlangt.</p>`,"Rechenbeispiel: Grandi nach Poisson-Abel")}</td></tr>
      <tr><td><b>Hierarchie:</b> konvergent \(\Rightarrow\) Cesàro \(\Rightarrow\) Abel (jeweils derselbe Wert). Also: <b>aus Cesàro folgt Abel</b> (Satz von Frobenius) — Abel ist das stärkste Verfahren. Rückrichtung nur mit Tauber-Bedingung (z. B. \(a_k\to0\)).<span class="when">Merk-Beispiel dafür, dass Abel echt stärker ist: \(1-2+3-4+\cdots\).</span>
        ${exBox(String.raw`<p>\(1-2+3-4+\cdots\), also \(a_k=(-1)^{k+1}k\), \(k\ge1\).</p><p><b>Cesàro scheitert:</b> \(S_n=1,-1,2,-2,3,\dots\); aufsummiert \(S_1+\cdots+S_n\): \(1,0,2,0,3,0,\dots\), also</p>\[\sigma_{2m-1}=\frac{m}{2m-1}\to\frac12,\qquad \sigma_{2m}=0\to0\]<p>— zwei verschiedene Häufungswerte \(\Rightarrow\) \(\sigma_n\) divergiert, <b>nicht Cesàro-summierbar</b>.</p><p><b>Abel klappt:</b> Ableiten der geometrischen Reihe \(\sum_{k\ge0}u^{k}=\frac{1}{1-u}\) gibt \(\sum_{k\ge1}k\,u^{k}=\frac{u}{(1-u)^{2}}\). Mit \(u=-x\):</p>\[\sum_{k=1}^{\infty}(-1)^{k+1}k\,x^{k}=\frac{x}{(1+x)^{2}}\ \longrightarrow\ \frac14\quad(x\to1^{-})\]<p>\(\Rightarrow\) <b>Abel-Summe \(=\tfrac14\)</b> — Abel summiert echt „mehr" als Cesàro.</p>`,"Rechenbeispiel: 1 − 2 + 3 − 4 + ⋯")}</td></tr>
    </table>
  </div>`; }

          <div class="ftit"><span class="fnum">1</span><span>Alle <b>kritischen Stellen</b> sammeln (\(\pm\infty\), Pole, Randsingularitäten) und dort <b>aufspalten</b> — jedes Teilintegral muss einzeln konvergieren.</span></div>
