<div class="twocol">
<div class="refblock">
<h3>Fréchet-Ableitung: Definition und Eindeutigkeit</h3>
<table class="reftable">
<tr><td><b>Definition.</b> \(f\) heißt in \(x_0\) Fréchet-differenzierbar, falls ein \(T\in\mathcal{L}(E,F)\) existiert mit
\[ f(x_0+h)=f(x_0)+\underbrace{T\,h}_{\text{linear, stetig}}+\underbrace{o\big(\|h\|_E\big)}_{=\,r(h)},\quad h\to\mathbf{0}_E, \]
und man schreibt \(f'(x_0)=T\in\mathcal{L}(E,F)\).</td><td class="cond">\(\mathcal{U}\) offen, damit \(h\) in <i>jeder</i> Richtung klein werden darf</td></tr>
<tr><td><b>Was \(o(\|h\|_E)\) heißt.</b> \(\dfrac{\|r(h)\|_F}{\|h\|_E}\longrightarrow 0\) für \(h\to\mathbf{0}_E\); gleichwertig: zu jedem \(\varepsilon>0\) gibt es \(\delta>0\) mit \(\|r(h)\|_F\le\varepsilon\|h\|_E\) für <b>alle</b> \(\|h\|_E<\delta\).</td><td class="cond">Fehler in \(\|\cdot\|_F\), gemessen an \(\|h\|_E\)</td></tr>
<tr><td><b>Stetigkeit versus Differenzierbarkeit.</b> Stetigkeit ist \(f(x_0+h)=f(x_0)+o(1)\), Differenzierbarkeit \(f(x_0+h)=f(x_0)+Th+o(\|h\|_E)\). Die ganze Feinheit steckt im \(o(\|h\|_E)\).</td></tr>
<tr><td><b>Eindeutigkeit.</b> Es gibt höchstens ein solches \(T\). Beweis: aus \((T_1-T_2)h=o(\|h\|_E)\) folgt \(\frac{\|(T_1-T_2)h\|_F}{\|h\|_E}\le\varepsilon\) für kleine \(h\); der Quotient ist homogen, also \(\|T_1-T_2\|_{\mathcal{L}(E,F)}\le\varepsilon\) für jedes \(\varepsilon>0\).<span class="when">Wer zwei verschiedene Kandidaten findet, hat in einem den Rest falsch abgeschätzt</span></td><td class="cond">beste affine Näherung, und die einzige</td></tr>
<tr><td><b>Affin-lineare Abbildungen.</b> \(f(x)=y_0+A(x-x_0)\) mit \(A\in\mathcal{L}(E,F)\): der Rest ist identisch \(\mathbf{0}_F\), also \(f'(x)=A\) für <i>jedes</i> \(x\). Insbesondere \(A'(x_0)=A\), \(f\equiv y_0\Rightarrow f'(x_0)=\mathbf{0}_{\mathcal{L}}\), \(\mathbf{1}'(x_0)=\mathbf{1}\).<span class="when">meistbenutzte Regel des Kapitels: erst prüfen, ob die Abbildung schon linear und stetig ist</span></td><td class="cond">Ableitung punktunabhängig</td></tr>
<tr><td><b>Skalarer Fall \(E=F=\mathbb{K}\).</b> Jedes \(T\in\mathcal{L}(\mathbb{K},\mathbb{K})\) ist Multiplikation mit \(t_{x_0}\in\mathbb{K}\), und
\[ t_{x_0}=\lim_{h\to0}\frac{f(x_0+h)-f(x_0)}{h}=\frac{df(x_0)}{dx}. \]
Der neue Begriff verallgemeinert die Schulableitung, er bricht sie nicht.</td><td class="cond">vgl. <a href="#/ref/diffrechnung">Differentialrechnung</a></td></tr>
<tr><td><b>Zur Operatornorm</b> (Werkzeug in allen Beweisen): \(\|Tx\|_F\le\|T\|_{\mathcal{L}(E,F)}\|x\|_E\) und \(\|ST\|_{\mathcal{L}(E,G)}\le\|S\|_{\mathcal{L}(F,G)}\|T\|_{\mathcal{L}(E,F)}\).</td><td class="cond">siehe <a href="#/ref/normen">Normen</a></td></tr>
</table>
</div>

<div class="refblock">
<h3>Richtungsableitung und schwache Ableitung</h3>
<table class="reftable">
<tr><td><b>Hilfsfunktion.</b> Zu festem \(h\in E\) gibt es \(\varepsilon>0\) mit \(x_0+th\in\mathcal{U}\) für \(|t|<\varepsilon\); setze
\[ \varphi_h(t)=f(x_0+th),\qquad \varphi_h:\left]-\varepsilon,\varepsilon\right[\longrightarrow F. \]</td><td class="cond">\(\mathcal{U}\) offen \(\Rightarrow\) \(t=0\) innerer Punkt</td></tr>
<tr><td><b>Richtungsableitung.</b>
\[ Df(x_0)[h]=\left.\frac{d\varphi_h}{dt}\right|_{t=0}=\lim_{t\to0}\frac{f(x_0+th)-f(x_0)}{t}\in F. \]
Speziell \(Df(x_0)[e_j]=\left.\frac{\partial f}{\partial x_j}\right|_{x=x_0}\).<span class="when">immer der erste Griff: er macht aus einem Problem in \(E\) eine Ableitung in einer Variablen</span></td><td class="cond">eckige Klammern, \(h\) eingefroren</td></tr>
<tr><td><b>Praxisregel.</b> Ist \(\varphi_h(t)\) ein Polynom in \(t\), so ist \(Df(x_0)[h]\) einfach der Koeffizient von \(t^1\).
${exBox(String.raw`<p>\(f(x_1,x_2)=x_1^2+3x_2^2+x_1+2\), \(x^{(0)}=\left(x_1^{(0)},x_2^{(0)}\right)\), \(h=(h_1,h_2)\):</p>\[ \varphi_h(t)=f\!\left(x^{(0)}\right)+t\Big[\left(2x_1^{(0)}+1\right)h_1+6x_2^{(0)}h_2\Big]+t^2\Big[h_1^2+3h_2^2\Big], \]\[ Df\!\left(x^{(0)}\right)[h]=\left(2x_1^{(0)}+1\right)h_1+6x_2^{(0)}h_2=\mathcal{J}_{x^{(0)}}(f)\,h. \]<p>Für \(h=e_1\) bzw. \(h=e_2\) fallen die partiellen Ableitungen heraus. In \(x^{(0)}=(1,2)^{T}\) also \(\mathcal{J}_{(1,2)}(f)=(3,\ 12)\) und \(Df(x^{(0)})[h]=3h_1+12h_2\) — linear und stetig, wie es sein muss.</p>`,"φ_h ausrechnen — Polynom im R²")}</td></tr>
<tr><td><b>Homogenität (Eigenschaft 1).</b> \(Df(x_0)[\alpha h]=\alpha\,Df(x_0)[h]\) für alle \(\alpha\in\mathbb{K}\) — Beweis durch Substitution \(\vartheta=t\alpha\). Mehr ist gratis <b>nicht</b> zu haben.</td><td class="cond">Additivität: nicht gratis</td></tr>
<tr><td><b>Gâteaux-Ableitung.</b> Es sollen alle \(Df(x_0)[h]\), \(h\in E\), existieren <b>und</b> \(h\mapsto Df(x_0)[h]\) linear und stetig sein. Dann heißt \(f'_S(x_0)\in\mathcal{L}(E,F)\) mit
\[ f'_S(x_0)\,h=Df(x_0)[h]\quad\text{für alle }h\in E \]
die schwache Ableitung.</td><td class="cond">\(S\) wie „schwach“</td></tr>
<tr><td><b>Konsistenz (Eigenschaft 2).</b> Ist \(f\) in \(x_0\) Fréchet-differenzierbar, so existiert für jedes \(h\) die Richtungsableitung und
\[ Df(x_0)[h]=f'(x_0)h,\qquad f'_S(x_0)=f'(x_0). \]
Beweis: setze \(\tilde h=th\); Linearität zieht \(t\) heraus, und \(o(\|h\|_E|t|)=o(|t|)\) bei festem \(h\).</td><td class="cond">Umkehrung falsch</td></tr>
<tr><td><b>Der Unterschied in einem Satz.</b> Gâteaux: \(f(x_0+th)=f(x_0)+t\,f'_S(x_0)h+o(|t|)\) mit einem Restglied, das von \(h\) abhängen darf. Fréchet: \(o(\|h\|_E)\) ohne Rücksicht auf die Richtung.</td></tr>
</table>
</div>
</div>

<div class="refblock">
<h3>Rezept: die Fréchet-Ableitung nachweisen</h3>
<div class="subgrid">
<div class="subcard"><b>Weg A — direkt entwickeln</b>
<ul>
<li><b>1.</b> \(f(x_0+h)-f(x_0)\) hinschreiben und vollständig ausmultiplizieren.</li>
<li><b>2.</b> Nach Potenzen von \(h\) sortieren: konstant \(=\) Funktionswert, <b>in \(h\) linear</b> \(=\) Kandidat \(T\), alles Höhere \(=\) Rest \(r(h)\).</li>
<li><b>3.</b> Prüfung 1 (Ausrufezeichen der Tafel): \(T\) muss linear <b>und</b> stetig sein, also \(\|Th\|_F\le C\,\|h\|_E\) mit endlichem \(C\) — dann ist \(T\in\mathcal{L}(E,F)\).</li>
<li><b>4.</b> Prüfung 2: \(\dfrac{\|r(h)\|_F}{\|h\|_E}\to0\) für \(h\to\mathbf{0}_E\). Erst dann \(f'(x_0)=T\).</li>
</ul></div>
<div class="subcard"><b>Weg B — über \(\varphi_h\) und Satz (∗)</b>
<ul>
<li><b>1.</b> \(\varphi_h(t)=f(x+th)\) bilden und in \(t=0\) ableiten \(\Rightarrow\) \(Df(x)[h]\) — meist zwei Zeilen.</li>
<li><b>2.</b> Linearität und Stetigkeit in \(h\) prüfen \(\Rightarrow\) \(f'_S(x)\in\mathcal{L}(E,F)\), und zwar für alle \(x\in U_\varepsilon(x_0)\).</li>
<li><b>3.</b> Zeigen, dass \(x\mapsto f'_S(x)\) auf \(U_\varepsilon(x_0)\) in der <i>Operatornorm</i> stetig ist (oft sogar Lipschitz).</li>
<li><b>4.</b> Satz (∗) zitieren: \(f'(x_0)=f'_S(x_0)\). Keine Restgliedabschätzung nötig.</li>
</ul></div>
</div>
<table class="reftable">
<tr><td><b>Welchen Weg?</b> Weg B ist fast immer kürzer. Wer aber Schritt 3 unterschlägt, hat nur die schwache Ableitung in der Hand und darf \(f'(x_0)\) nicht schreiben. Weg A lohnt vor allem in den kritischen Punkten stückweise definierter Funktionen — dort hilft Satz (∗) nicht.</td><td class="cond">Klausurentscheidung</td></tr>
<tr><td><b>Standardabschätzung für Schritt 4 (Weg A).</b> Alles, was mindestens quadratisch in \(h\) ist, ist \(o(\|h\|_E)\):
\[ \|r(h)\|_F\le C\|h\|_E^2\ \Longrightarrow\ \frac{\|r(h)\|_F}{\|h\|_E}\le C\|h\|_E\longrightarrow 0 . \]
<span class="when">bei Polynomen, quadratischen Funktionalen, Produkten zweier Ableitungsterme</span></td></tr>
<tr><td><b>Vollständiges Muster (Weg A).</b>
${exBox(String.raw`<p>\(f:\mathbb{R}^2\to\mathbb{R}^2\), \(f(x)=\left(x_1^2+3x_2^2+x_1+2,\ x_1x_2\right)^{T}\).</p><p><i>Schritt 1/2 (entwickeln und sortieren).</i> Mit \(h=(h_1,h_2)^{T}\):</p>\[ f_1(x_0+h)=f_1(x_0)+\left(2x_1^{(0)}+1\right)h_1+6x_2^{(0)}h_2+\underbrace{h_1^2+3h_2^2}_{=\,r_1(h)}, \]\[ f_2(x_0+h)=f_2(x_0)+x_2^{(0)}h_1+x_1^{(0)}h_2+\underbrace{h_1h_2}_{=\,r_2(h)}, \]<p>zusammen \(f(x_0+h)=f(x_0)+\mathcal{J}_{x_0}(f)h+r(h)\) mit</p>\[ \mathcal{J}_{x_0}(f)=\begin{pmatrix}2x_1^{(0)}+1&6x_2^{(0)}\\ x_2^{(0)}&x_1^{(0)}\end{pmatrix},\qquad r(h)=\begin{pmatrix}h_1^2+3h_2^2\\ h_1h_2\end{pmatrix}. \]<p><i>Schritt 3.</i> \(\mathcal{J}_{x_0}(f)\,h\) ist linear, und als Matrix-Vektor-Produkt im \(\mathbb{R}^2\) automatisch stetig.</p><p><i>Schritt 4.</i> Aus \(|h_1|,|h_2|\le\|h\|\) folgt \(\|r(h)\|\le\left|h_1^2+3h_2^2\right|+\left|h_1h_2\right|\le 3\|h\|^2+\|h\|^2=4\|h\|^2\), also</p>\[ \frac{\|r(h)\|}{\|h\|}\le 4\|h\|\longrightarrow 0 . \]<p>Damit \(f'(x_0)=\mathcal{J}_{x_0}(f)\); in \(x_0=(1,-1)^{T}\) etwa \(f'(x_0)=\begin{pmatrix}3&-6\\ -1&1\end{pmatrix}\). Genau die Zeile „\(\|r(h)\|\le 4\|h\|^2\)“ ist der Beweis — sie darf nicht fehlen.</p>`,"Weg A im R², vektorwertig")}</td></tr>
</table>
<div class="note"><b>Merke:</b> Die Kandidatin steht immer schon fest — im \(\mathbb{K}^m\) ist es die Jacobi-Matrix, im Funktionenraum der in \(h\) lineare Anteil der Entwicklung. Sie hinzuschreiben ist <i>kein</i> Beweis; bewiesen wird erst mit Prüfung 1 und Prüfung 2 (oder mit Satz (∗)).</div>
</div>

<div class="twocol">
<div class="refblock">
<h3>Hinreichende Bedingungen</h3>
<table class="reftable">
<tr><td><b>Satz (∗) — in normierten Räumen.</b> Für ein \(\varepsilon_0>0\) sei \(f\) in <b>allen</b> Punkten von \(U_{\varepsilon_0}(x_0)\subset\mathcal{U}\) Gâteaux-differenzierbar und
\[ f'_S(\cdot):U_{\varepsilon_0}(x_0)\to\mathcal{L}(E,F),\quad x\mapsto f'_S(x) \]
stetig bezüglich \(\|\cdot\|_{\mathcal{L}(E,F)}\). Dann ist \(f\) in \(x_0\) Fréchet-differenzierbar mit \(f'(x_0)=f'_S(x_0)\).</td><td class="cond">Beweis über Mittelwertungleichung (2)</td></tr>
<tr><td><b>Warum „auf einer ganzen Umgebung“?</b> Die Spiralfunktion ist in \((0,0)\) Gâteaux-differenzierbar, in <i>jedem</i> Punkt von \(\Gamma\) aber nicht (dort existiert keine einzige Richtungsableitung), und jede Kugel \(U_\varepsilon(0,0)\) enthält Punkte von \(\Gamma\). Die Voraussetzung ist keine Bequemlichkeit.</td><td class="cond">Kern der Sache</td></tr>
<tr><td><b>Im \(\mathbb{R}^m\), Fassung 1.</b> Existieren alle \(\frac{\partial f_k}{\partial x_\ell}\) auf \(U_\varepsilon\!\left(x^{(0)}\right)\) und sind sie <b>in \(x^{(0)}\)</b> stetig, so ist \(f\) dort Gâteaux-differenzierbar mit \(f'_S\!\left(x^{(0)}\right)=\mathcal{J}_{x^{(0)}}(f)\).</td><td class="cond">Stetigkeit im Punkt</td></tr>
<tr><td><b>Im \(\mathbb{R}^m\), Fassung 2.</b> Existieren alle \(\frac{\partial f_k}{\partial x_\ell}\) und sind sie <b>auf ganz \(U_\varepsilon\!\left(x^{(0)}\right)\)</b> stetig, so ist \(f\) in \(x^{(0)}\) Fréchet-differenzierbar mit \(f'\!\left(x^{(0)}\right)=\mathcal{J}_{x^{(0)}}(f)\). Sprechweise: \(f\in C^1(\mathcal{U})\).<span class="when">erledigt fast jede Klausuraufgabe in zwei Zeilen — Polynome, \(\exp\), \(\sin\), \(\cos\), Wurzeln, Quotienten mit nichtverschwindendem Nenner</span>
${exBox(String.raw`<p>\(f:\mathbb{R}^2\to\mathbb{R}^2\), \(f(x_1,x_2)=\left(e^{x_1}\cos x_2,\ e^{x_1}\sin x_2\right)^{T}\).</p>\[ \frac{\partial f_1}{\partial x_1}=e^{x_1}\cos x_2,\quad \frac{\partial f_1}{\partial x_2}=-e^{x_1}\sin x_2,\quad \frac{\partial f_2}{\partial x_1}=e^{x_1}\sin x_2,\quad \frac{\partial f_2}{\partial x_2}=e^{x_1}\cos x_2 . \]<p>Alle vier existieren auf ganz \(\mathbb{R}^2\) und sind dort stetig, also ist \(f\) überall Fréchet-differenzierbar mit</p>\[ f'\!\left(x^{(0)}\right)=\mathcal{J}_{x^{(0)}}(f)=e^{x_1^{(0)}}\begin{pmatrix}\cos x_2^{(0)}&-\sin x_2^{(0)}\\ \sin x_2^{(0)}&\cos x_2^{(0)}\end{pmatrix}, \]<p>und \(\det\mathcal{J}_{x^{(0)}}(f)=e^{2x_1^{(0)}}\neq0\): in jedem Punkt eine Drehstreckung. Keine einzige Restabschätzung war nötig.</p>`,"Zwei Zeilen statt Restgliedabschätzung")}</td><td class="cond">Stetigkeit auf der Umgebung</td></tr>
<tr><td><b>Der ganze Unterschied</b> zwischen Fassung 1 und 2 ist der <i>Ort</i> der Stetigkeit — passend zur Merkregel, dass Gleichmäßigkeit in allen Richtungen Information auf einer ganzen Umgebung braucht.</td></tr>
<tr><td><b>Klausurfalle.</b> Die bloße <i>Existenz</i> der partiellen Ableitungen liefert gar nichts — nicht einmal Stetigkeit, geschweige denn Gâteaux (Linearität fehlt).</td><td class="cond">vgl. <a href="#/ref/saetze">Sätze</a></td></tr>
</table>
</div>

<div class="refblock">
<h3>Kurzblock: der Fall \(f:\mathcal{U}\subset\mathbb{K}^m\to\mathbb{K}^n\)</h3>
<table class="reftable">
<tr><td><b>Jacobi-Matrix.</b> \(f'\!\left(x^{(0)}\right)=\mathcal{J}_{x^{(0)}}(f)\in M^{n,m}\), Zeile \(k\) \(=\) Komponente \(f_k\), Spalte \(\ell\) \(=\) Ableitung nach \(x_\ell\):
\[ \mathcal{J}_{x^{(0)}}(f)=\left(\left.\frac{\partial f_k}{\partial x_\ell}\right|_{x=x^{(0)}}\right)_{k=1,\dots,n;\ \ell=1,\dots,m}. \]
Alternativ \(\left.\frac{D(f_1,\dots,f_n)}{D(x_1,\dots,x_m)}\right|_{x=x^{(0)}}\) — dasselbe Objekt, die <i>Matrix</i>.</td><td class="cond">so viele Zeilen wie Komponenten, so viele Spalten wie Variablen</td></tr>
<tr><td><b>Fall \(n=1\): Gradienten-Zeile.</b> \(f'\!\left(x^{(0)}\right)=\left(\left.\operatorname{grad} f\right|_{x=x^{(0)}}\right)^{T}=\left(\left.\nabla f\right|_{x=x^{(0)}}\right)^{T}\), also
\[ f'\!\left(x^{(0)}\right)h=\Big\langle \left.\nabla f\right|_{x=x^{(0)}},\,h\Big\rangle . \]
Der Gradient ist die <b>Spalte</b>, die Ableitung die <b>Zeile</b>.<span class="when">Verwechslung von Zeile und Spalte kostet Punkte, sobald Matrizen im Spiel sind</span></td><td class="cond">Klausurfalle</td></tr>
<tr><td><b>Geometrie.</b> Nach Cauchy-Schwarz ist \(|\langle\nabla f,h\rangle|\le\|\nabla f\|\,\|h\|\): der Gradient zeigt in Richtung des steilsten Anstiegs, \(\|\nabla f\|\) ist die maximale Anstiegsrate (bei \(\|h\|=1\)), \(-\nabla f\) die des steilsten Abstiegs, und \(\langle\nabla f,h\rangle=0\) sind die Richtungen tangential zur Niveaumenge.</td><td class="cond">Gradient lebt im Definitionsbereich</td></tr>
<tr><td><b>Totales Differential.</b> Mit \(h_j=dx_j\):
\[ df=\left.\frac{\partial f}{\partial x_1}\right|_{x=x^{(0)}}dx_1+\dots+\left.\frac{\partial f}{\partial x_m}\right|_{x=x^{(0)}}dx_m . \]
„Total differenzierbar“ und „Fréchet-differenzierbar“ meinen dasselbe.</td></tr>
<tr><td><b>Funktionaldeterminante.</b> Für \(n=m\) heißt \(\det\mathcal{J}_{x^{(0)}}(f)\) Funktionaldeterminante; bei Koordinatenwechseln \(y=f(x)\) wird dafür ebenfalls \(\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\) geschrieben — aus dem Zusammenhang lesen, ob Matrix oder Determinante gemeint ist.</td><td class="cond">Ausblick <a href="#/ref/implizit">Implizite Funktionen</a></td></tr>
<tr><td><b>Weiter.</b> Rechenregeln, Tangentialebene und die Diskussion \(\nabla f=\mathbf{0}_m\) stehen auf <a href="#/ref/diffrechnung">Differentialrechnung</a>; kritische Stellen \(x^{*}\) und die Hesse-Matrix \(H_{x_0}(f)\) auf <a href="#/ref/extrema">Extrema</a>.</td></tr>
</table>
</div>
</div>

<div class="refblock">
<h3>Rechenregeln — „Das Rechnen mit F.-Abl.“</h3>
<table class="reftable">
<tr><td><b>① Linearität.</b> Sind \(f,g:\mathcal{U}\subset E\to F\) in \(x_0\) differenzierbar und \(\alpha,\beta\in\mathbb{K}\), so ist
\[ (\alpha f+\beta g)'(x_0)=\alpha f'(x_0)+\beta g'(x_0)\ \in\ \mathcal{L}(E,F). \]</td><td class="cond">\(\mathcal{L}(E,F)\) ist ein Vektorraum</td></tr>
<tr><td><b>② Produktregel.</b> \(f:\mathcal{U}\subset E\to F\) und \(\alpha:\mathcal{U}\subset E\to\mathbb{K}\) in \(x_0\) differenzierbar. Dann ist \(\alpha f\) differenzierbar und
\[ (\alpha f)'(x_0)[h]=\underbrace{f(x_0)}_{\in F}\ \underbrace{\alpha'(x_0)[h]}_{\in\mathbb{K}}+\underbrace{\alpha(x_0)}_{\in\mathbb{K}}\ \underbrace{f'(x_0)[h]}_{\in F}. \]
<span class="when">Typenbuchhaltung: unter jeden Term den Raum schreiben, dann fallen Formatfehler sofort auf</span>
${exBox(String.raw`<p>\(E=\mathbb{K}^2\), \(F=\mathbb{K}\), \(\alpha(x)=x_1\), \(f(x)=x_2\). Beide sind linear und stetig, also \(\alpha'(x_0)=(1,0)\), \(f'(x_0)=(0,1)\), und</p>\[ (\alpha f)'(x_0)=f(x_0)\,\alpha'(x_0)+\alpha(x_0)\,f'(x_0)=x_2^{(0)}(1,0)+x_1^{(0)}(0,1)=\left(x_2^{(0)},\ x_1^{(0)}\right). \]<p>Probe: \((\alpha f)(x)=x_1x_2\) hat \(\frac{\partial}{\partial x_1}=x_2\) und \(\frac{\partial}{\partial x_2}=x_1\) — dieselbe Zeile.</p>`,"Produktregel, ausgerechnet")}</td><td class="cond">\(\alpha\) skalar, \(f\) vektorwertig</td></tr>
<tr><td><b>③ Kettenregel.</b> \(f:\mathcal{U}\subset E\to F\) mit \(f(\mathcal{U})\subset V\), \(g:V\subset F\to G\), \(y_0=f(x_0)\), \(f\) in \(x_0\) und \(g\) in \(y_0\) differenzierbar. Dann
\[ (g\circ f)'(x_0)=\underbrace{g'(y_0)}_{\mathcal{L}(F,G)}\ \underbrace{f'(x_0)}_{\mathcal{L}(E,F)}\ \in\ \mathcal{L}(E,G) \]
— die beiden Operatoren werden hintereinandergeschaltet, also multipliziert.</td><td class="cond">\(V\) offen, \(f(\mathcal{U})\subset V\)</td></tr>
<tr><td><b>③ in endlich vielen Variablen.</b> Für \(E=\mathbb{K}^m\), \(F=\mathbb{K}^n\), \(G=\mathbb{K}^p\) ist die Kettenregel ein Matrizenprodukt:
\[ \underbrace{\mathcal{J}_{x_0}(g\circ f)}_{M^{p,m}}=\underbrace{\mathcal{J}_{y_0}(g)}_{M^{p,n}}\ \underbrace{\mathcal{J}_{x_0}(f)}_{M^{n,m}},\qquad y_0=f(x_0). \]
<span class="when">Formatprobe \(M^{p,n}\cdot M^{n,m}=M^{p,m}\) — sie geht nur bei richtiger Reihenfolge auf</span>
${exBox(String.raw`<p>\(f(x)=\left(x_1+x_2,\ x_1x_2\right)^{T}\), \(g(y)=y_1^2+3y_2^2+y_1+2\), also \(m=n=2\), \(p=1\).</p><p><i>Schritt 1.</i> Mit \(y_0=f(x_0)=\left(x_1^{(0)}+x_2^{(0)},\ x_1^{(0)}x_2^{(0)}\right)^{T}\):</p>\[ \mathcal{J}_{x_0}(f)=\begin{pmatrix}1&1\\ x_2^{(0)}&x_1^{(0)}\end{pmatrix}\in M^{2,2},\qquad \mathcal{J}_{y_0}(g)=\left(2y_1^{(0)}+1,\ 6y_2^{(0)}\right)\in M^{1,2}. \]<p><i>Schritt 2.</i> Produkt bilden:</p>\[ \mathcal{J}_{x_0}(g\circ f)=\Big(2\left(x_1^{(0)}+x_2^{(0)}\right)+1+6x_1^{(0)}\left(x_2^{(0)}\right)^2,\ \ 2\left(x_1^{(0)}+x_2^{(0)}\right)+1+6\left(x_1^{(0)}\right)^2x_2^{(0)}\Big). \]<p><i>Schritt 3 (Probe).</i> Direkt: \((g\circ f)(x)=(x_1+x_2)^2+3(x_1x_2)^2+(x_1+x_2)+2\), also \(\frac{\partial(g\circ f)}{\partial x_1}=2(x_1+x_2)+6x_1x_2^2+1\) und \(\frac{\partial(g\circ f)}{\partial x_2}=2(x_1+x_2)+6x_1^2x_2+1\) — dasselbe. In \(x_0=(1,-1)^{T}\) etwa \(\mathcal{J}_{x_0}(g\circ f)=(7,-5)\).</p>`,"Kettenregel als Matrizenprodukt")}</td></tr>
<tr><td><b>Warum das stimmt.</b> Ableiten heißt affin-linear approximieren, und das Hintereinanderausführen zweier affiner Abbildungen ist wieder affin: aus \(f(x)=y_0+A(x-x_0)\) und \(g(y)=z_0+B(y-y_0)\) folgt \((g\circ f)(x)=z_0+BA\,(x-x_0)\).</td><td class="cond">exakt, nicht nur asymptotisch</td></tr>
<tr><td><b>Klausurfallen zur Kettenregel.</b> (i) <i>Reihenfolge:</i> erst innen, dann außen — Operatoren und Matrizen kommutieren nicht. (ii) <i>Auswertungspunkte:</i> \(g'\) wird in \(y_0=f(x_0)\) ausgewertet, nicht in \(x_0\). (iii) <i>Voraussetzung:</i> ohne \(f(\mathcal{U})\subset V\) ist \(g\circ f\) gar nicht erklärt.</td><td class="cond">drei klassische Punktverluste</td></tr>
</table>
</div>

<div class="refblock">
<h3>Hauptsatz der Differentialrechnung</h3>
<p class="sub">An der Tafel steht nur „Satz“ unter der Überschrift des Paragraphen; in der Literatur heißt er auch <i>Schrankensatz</i>. Verbindungsstrecke \(\overline{ab}=\left\{a+t(b-a):t\in[0,1]\right\}\), offene Strecke \(\overset{\circ}{\overline{ab}}=\overline{ab}\setminus\{a,b\}\). Vorausgesetzt: \(a,b\in\mathcal{U}\), \(\overline{ab}\subset\mathcal{U}\) und \(f\) in <i>jedem</i> Punkt von \(\overline{ab}\) Gâteaux-differenzierbar. Mehr nicht — Fréchet wird nicht gebraucht.</p>
<table class="reftable">
<tr><td><b>(1) Mittelwertungleichung.</b>
\[ \big\|f(b)-f(a)\big\|_F\ \le\ \sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)\big\|_{\mathcal{L}(E,F)}\cdot\|b-a\|_E . \]
<span class="when">Tempolimit-Argument: Lipschitz-Schranken für \(f\); ist \(f'_S\equiv\mathbf{0}_{\mathcal{L}}\) auf einem Gebiet, so ist \(f\) dort konstant</span></td><td class="cond">\(\overline{ab}\subset\mathcal{U}\)</td></tr>
<tr><td><b>(2) Linearisierte Fassung.</b>
\[ \big\|f(b)-f(a)-f'_S(a)(b-a)\big\|_F\ \le\ \sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)-f'_S(a)\big\|_{\mathcal{L}(E,F)}\cdot\|b-a\|_E . \]
Links steht der Fehler der linearen Näherung, rechts die <b>Oszillation</b> von \(f'_S\) längs der Strecke.<span class="when">immer dann, wenn ein Restglied \(o(\|h\|_E)\) gebraucht wird — das ist der Beweis von Satz (∗)</span></td><td class="cond">Werkzeug für Satz (∗)</td></tr>
<tr><td><b>(2) folgt aus (1)</b> mit der Hilfsfunktion \(\varphi(x)=f(x)-f'_S(a)(x-a)\): sie erfüllt \(\varphi(b)-\varphi(a)=f(b)-f(a)-f'_S(a)(b-a)\) und \(\varphi'_S(x)=f'_S(x)-f'_S(a)\), weil der affine Zusatzterm konstante Differenzenquotienten hat.</td><td class="cond">„begradigen, dann (1)“</td></tr>
<tr><td><b>Beweisstruktur von (1)</b> — ein Standardmuster, siehe <a href="#/ref/beweise">Beweise</a>: (i) auf die Strecke einschränken, \(x(t)=a+t(b-a)\); (ii) mit einem stetigen linearen Funktional \(\ell\) testen, \(\Psi(t)=\ell f(x(t))\in\mathbb{K}\), und eindimensional argumentieren; (iii) \(\ell\) nach Hahn-Banach zu \(y_0=f(b)-f(a)\) wählen, also \(\|\ell\|_{\mathcal{L}(F,\mathbb{K})}=1\) und \(\ell y_0=\|y_0\|_F\) — dann kostet die Reduktion nichts. Der Fall \(f(b)=f(a)\) ist trivial.</td><td class="cond">Stetigkeit von \(\ell\): Grenzwertvertauschung</td></tr>
<tr><td><b>Warum nur Ungleichungen?</b> Ein Mittelwertsatz mit Gleichheit ist in normierten Räumen falsch — der Zwischenpunkt hinge vom getesteten Funktional ab.
${exBox(String.raw`<p>\(E=\mathbb{R}\), \(F=\mathbb{R}^2\) euklidisch, \(f(t)=\left(t^2,\ t^3\right)^{T}\), \(a=0\), \(b=1\).</p><p>Ein Mittelwertsatz \(f(b)-f(a)=f'_S(t_0)(b-a)\) verlangte</p>\[ \begin{pmatrix}1\\ 1\end{pmatrix}=\begin{pmatrix}2t_0\\ 3t_0^2\end{pmatrix}\quad\Longrightarrow\quad t_0=\tfrac12\ \text{ und }\ t_0=\tfrac{1}{\sqrt3} \]<p>— Widerspruch. Ungleichung (1) gilt dagegen: \(\left\|f'_S(t)\right\|_{\mathcal{L}(\mathbb{R},\mathbb{R}^2)}=\sqrt{4t^2+9t^4}\), also \(\sup_{t\in\left]0,1\right[}\left\|f'_S(t)\right\|_{\mathcal{L}(\mathbb{R},\mathbb{R}^2)}=\sqrt{13}\), und</p>\[ \|f(1)-f(0)\|_F=\sqrt2\approx1{,}414\ \le\ \sqrt{13}\cdot 1\approx 3{,}606 . \]<p>Für das skalare \(\Psi(t)=\frac{t^2+t^3}{\sqrt2}\) existiert ein Zwischenpunkt sehr wohl, nämlich \(t_0=\frac{-1+\sqrt7}{3}\approx0{,}549\) — er hängt aber von der Wahl von \(\ell\) ab. Genau deshalb bleibt am Ende eine Schranke.</p>`,"Es gibt keinen Zwischenpunkt")}</td></tr>
<tr><td><b>Zahlenprobe.</b>
${exBox(String.raw`<p>\(E=\mathbb{R}^2\) euklidisch, \(F=\mathbb{R}\), \(f(x)=x_1^2+x_2^2\), \(a=(1,0)^{T}\), \(b=(0,1)^{T}\), \(\|b-a\|_E=\sqrt2\).</p><p><i>Ableitung.</i> \(f'_S(x)h=2x_1h_1+2x_2h_2\), also \(\left\|f'_S(x)\right\|_{\mathcal{L}(E,F)}=\|(2x_1,2x_2)\|=2\|x\|_E\). Auf der Strecke \(x(t)=(1-t,\,t)^{T}\) ist \(\sup_{t\in\left]0,1\right[}\|x(t)\|_E=1\).</p><p><i>(1):</i> links \(|f(b)-f(a)|=|1-1|=0\), rechts \(2\cdot1\cdot\sqrt2=2\sqrt2\). Also \(0\le 2\sqrt2\) — richtig, aber grob.</p><p><i>(2):</i> \(f'_S(a)(b-a)=2\cdot1\cdot(-1)+2\cdot0\cdot1=-2\), links also \(|0-(-2)|=2\). Rechts hat \(f'_S(x(t))-f'_S(a)\) den Koeffizientenvektor \((-2t,\,2t)\) mit Norm \(2t\sqrt2\), Supremum \(2\sqrt2\), und</p>\[ 2\ \le\ 2\sqrt2\cdot\sqrt2=4 . \]<p>Beide Ungleichungen gelten, keine mit Gleichheit.</p>`,"(1) und (2) an einem Beispiel nachrechnen")}</td></tr>
<tr><td><b>Klausurfallen.</b> (i) \(\overline{ab}\subset\mathcal{U}\) ist eine echte Voraussetzung — \(\mathcal{U}\) muss nicht konvex sein. (ii) Die Suprema laufen über die <b>offene</b> Strecke \(\overset{\circ}{\overline{ab}}\). (iii) Rechts steht die <b>Operatornorm</b>, kein Funktionswert. (iv) Im Beweis von (1) treten <i>zwei</i> verschiedene Operatornormen auf — \(\|\ell\|_{\mathcal{L}(F,\mathbb{K})}\) für das Testfunktional und \(\|f'_S(x)\|_{\mathcal{L}(E,F)}\) für die Ableitung; nicht verwechseln. (v) Ist das Supremum \(=\infty\), ist die Aussage richtig, aber nutzlos.</td><td class="cond">fünf Punktverluste</td></tr>
</table>
</div>

<div class="refblock">
<h3>Beispielkatalog: Ableiten in Funktionenräumen</h3>
<p class="sub">Grundräume \(C=C([a,b],\mathbb{R})\) mit \(\|y\|_{C}=\max_{x\in[a,b]}|y(x)|\) und \(C^1=C^1([a,b],\mathbb{R})\) mit \(\|y\|_{C^1}=\|y\|_{C}+\|y'\|_{C}\), \(a< b\) (hier Intervallenden, nicht die Endpunkte einer Strecke). Der „Punkt“, in dem abgeleitet wird, ist jetzt eine Funktion \(y_0\), der Zuwachs \(h=h(x)\) ebenfalls. Die Kreisziffern ⑤–⑧ sind die Beispielnummern der Vorlesung, nicht die Stufen der Hierarchie oben.</p>
<table class="reftable">
<tr><td><b>Bausteine, die man ständig braucht.</b> Multiplikationsoperator \(A:y\mapsto c(\cdot)y\) mit Koeffizient \(c\in C\) ist stetig \(C\to C\) und \(C^1\to C\), denn \(\|cy\|_{C}\le\|c\|_{C}\|y\|_{C}\le\|c\|_{C}\|y\|_{C^1}\); Ableitungsoperator \(D=\frac{d}{dx}\in\mathcal{L}(C^1,C)\); Integral \(I\in\mathcal{L}(C,\mathbb{R})\) mit \(\|I\|\le b-a\).</td><td class="cond">Verkettung: \(\mathcal{L}(C,C)\cdot\mathcal{L}(C^1,C)\subset\mathcal{L}(C^1,C)\)</td></tr>
<tr><td><b>⑤ Ableitungsoperator.</b> \(D:C^1\to C\), \(Dy=y'\). Linear, und \(\|Dy\|_{C}=\|y'\|_{C}\le\|y\|_{C}+\|y'\|_{C}=\|y\|_{C^1}\), also \(D\in\mathcal{L}(C^1,C)\) und damit
\[ D'(y_0)=D\qquad\text{für jedes }y_0\in C^1. \]</td><td class="cond">linear und stetig \(\Rightarrow\) eigene Ableitung</td></tr>
<tr><td><b>⑥ Nichtlinearer Operator.</b> \(K:C^1\to C\),
\[ K:\ y\longmapsto y^2+3y+2\left(y'\right)^2+y\,y' . \]
Die Ableitung ist selbst ein <b>Differentialoperator</b>:
\[ K'(y_0)=\left(2y_0+3+y_0'\right)\cdot\ +\ \left(4y_0'+y_0\right)\frac{d}{dx}\ \in\ \mathcal{L}(C^1,C). \]
${exBox(String.raw`<p><i>Schritt 1/2 (einsetzen, sortieren).</i></p>\[ K(y_0+h)=\underbrace{y_0^2+3y_0+2\left(y_0'\right)^2+y_0y_0'}_{=\,K y_0}+\underbrace{2y_0h+3h+4y_0'h'+y_0h'+y_0'h}_{\text{linear in }h}+\underbrace{h^2+2\left(h'\right)^2+h\,h'}_{\text{Rest}} . \]<p>Der Hauptterm, nach \(h\) und \(h'\) sortiert:</p>\[ T_{y_0}h=\left(2y_0+3+y_0'\right)h+\left(4y_0'+y_0\right)\frac{d}{dx}h . \]<p><i>Schritt 3 (\(T_{y_0}\in\mathcal{L}(C^1,C)\)).</i> Der erste Summand ist ein Multiplikationsoperator mit Koeffizient in \(C\), also stetig \(C^1\to C\); der zweite ist die Verkettung \(\left(4y_0'+y_0\right)\cdot\ \in\mathcal{L}(C,C)\) mit \(\frac{d}{dx}\in\mathcal{L}(C^1,C)\), also ebenfalls in \(\mathcal{L}(C^1,C)\). Summe: \(T_{y_0}\in\mathcal{L}(C^1,C)\).</p><p><i>Schritt 4 (Rest).</i></p>\[ \left\|h^2\right\|_{C}=\|h\|_{C}^2\le\|h\|_{C^1}^2,\qquad \left\|2(h')^2\right\|_{C}=2\|h'\|_{C}^2\le 2\|h\|_{C^1}^2,\qquad \left\|h\,h'\right\|_{C}\le\|h\|_{C}\|h'\|_{C}\le\|h\|_{C^1}^2 . \]<p>Alles \(\le\ \text{const}\cdot\|h\|_{C^1}^2=o\!\left(\|h\|_{C^1}\right)\). Also \(K'(y_0)=T_{y_0}\).</p>`,"Beispiel ⑥ vollständig gerechnet")}</td><td class="cond">Koeffizienten hängen von \(y_0\) ab</td></tr>
<tr><td><b>⑦ Lineares Integralfunktional.</b> \(I:C\to\mathbb{R}\), \(Iy=\int_a^b y(x)\,dx\). Aus
\[ \left|\int_a^b y\,dx\right|\le\int_a^b|y|\,dx\le(b-a)\|y\|_{C} \]
folgt \(I\in\mathcal{L}(C,\mathbb{R})\), also \(I'(y_0)=I\).</td><td class="cond">punktunabhängig</td></tr>
<tr><td><b>⑧ Quadratisches Funktional.</b> \(V\in C([a,b],\mathbb{R})\) und
\[ I(y)=\int_a^b\Big(\left(y'(x)\right)^2-V(x)\left(y(x)\right)^2\Big)dx,\qquad I'(y_0)\in\mathcal{L}\!\left(C^1,\mathbb{R}\right), \]
\[ I'(y_0)[h]=2\int_a^b y_0'(x)h'(x)\,dx-2\int_a^b V(x)y_0(x)h(x)\,dx . \]
<span class="when">Prototyp der Variationsrechnung — das Standardbeispiel für beide Rezeptwege</span>
${exBox(String.raw`<p><i>Weg A (direkt entwickeln).</i></p>\[ I(y_0+h)=\underbrace{\int_a^b\!\Big(\left(y_0'\right)^2-Vy_0^2\Big)dx}_{=\,I(y_0)}+\underbrace{\int_a^b\!\Big(2y_0'h'-2Vy_0h\Big)dx}_{\text{linear in }h}+\underbrace{\int_a^b\!\Big(\left(h'\right)^2-Vh^2\Big)dx}_{\text{Rest}} . \]<p>Hauptterm stetig: \(\left|2\int_a^b y_0'h'\,dx\right|\le 2(b-a)\|y_0'\|_{C}\|h'\|_{C}\le M\|h\|_{C^1}\), der zweite Summand analog. Rest:</p>\[ \int_a^b\left(h'(x)\right)^2dx\le(b-a)\|h'\|_{C}^2\le(b-a)\|h\|_{C^1}^2=o\!\left(\|h\|_{C^1}\right), \]<p>und der Term mit \(V\) genauso.</p><p><i>Weg B (über \(\varphi_h\) und Satz (∗)).</i> \(\varphi_h(t)=I(y+th)=I(y)+2t\int_a^b\left(y'h'-Vyh\right)dx+t^2\int_a^b\left(\left(h'\right)^2-Vh^2\right)dx\) ist ein Polynom in \(t\), also</p>\[ DI(y)[h]=2\int_a^b\Big(y'h'-Vyh\Big)dx . \]<p>Linear in \(h\); stetig wegen \(\left|DI(y)[h]\right|\le M(y)\|h\|_{C^1}\) mit \(M(y)=2(b-a)\left(\|y'\|_{C}+\|V\|_{C}\|y\|_{C}\right)\). Also existiert \(I'_S(y)\in\mathcal{L}(C^1,\mathbb{R})\). Und mit \(u=y-z\) ist \(\left(I'_S(y)-I'_S(z)\right)h=2\int_a^b\left(u'h'-Vuh\right)dx\), nach Supremumsbildung über \(\|h\|_{C^1}\le1\) also</p>\[ \left\|I'_S(y)-I'_S(z)\right\|_{\mathcal{L}(C^1,\mathbb{R})}\le 2(b-a)\left(1+\|V\|_{C}\right)\|y-z\|_{C^1} . \]<p>\(y\mapsto I'_S(y)\) ist Lipschitz-stetig, Satz (∗) liefert \(I'(y_0)=I'_S(y_0)\) — ganz ohne Restgliedrechnung.</p>`,"Beispiel ⑧ auf beiden Wegen")}</td><td class="cond">\(E=C^1\), \(F=\mathbb{R}\)</td></tr>
<tr><td><b>Klausurfalle: die Normwahl ist Teil der Aufgabe.</b> Kommt \(y'\) im Ausdruck vor, muss \(E=C^1\) sein: \(\left(4y_0'+y_0\right)\frac{d}{dx}h\) ist als Abbildung \(C^1\to C\) stetig, auf \(C\) mit \(\|\cdot\|_{C}\) ist \(\frac{d}{dx}\) dagegen nicht einmal überall erklärt — dort gibt es den Operator gar nicht.<span class="when">immer angeben, bezüglich welcher Normen Linearität und Stetigkeit geprüft werden</span></td><td class="cond">\(\|y\|_{C^1}=\|y\|_{C}+\|y'\|_{C}\)</td></tr>
<tr><td><b>Arbeitsschema in drei Zeilen.</b> (1) \(y_0+h\) einsetzen und ausmultiplizieren. (2) Sortieren: konstant \(=\) Funktionswert, linear \(=\) Kandidat \(T_{y_0}\), quadratisch \(=\) Rest. (3) Die zwei Ausrufezeichen: \(T_{y_0}\) linear und stetig in der richtigen Norm, Rest \(o\!\left(\|h\|_{C^1}\right)\).</td><td class="cond">gilt wörtlich wie im \(\mathbb{K}^m\)</td></tr>
</table>
</div>

<div class="refblock">
<h3>Klausurfallen in Kürze</h3>
<table class="reftable">
<tr><td>Das \(o\) bezieht sich auf \(\|h\|_E\) — die Norm des <b>Urbildraums</b>; gemessen wird der Fehler in \(\|\cdot\|_F\).</td><td class="cond">zwei Normen, zwei Rollen</td></tr>
<tr><td>Die Abschätzung muss für <b>alle</b> \(h\to\mathbf{0}_E\) gelten, nicht nur längs einzelner Geraden oder Achsen. Daran scheitern sämtliche Umkehrungen der Hierarchie.</td><td class="cond">gleichmäßig, nicht richtungsweise</td></tr>
<tr><td>Ein linearer Hauptterm allein genügt nicht — verlangt ist \(T\in\mathcal{L}(E,F)\). In unendlichdimensionalen Räumen ist die Stetigkeit eine echte Zusatzforderung und hängt an der Normwahl.</td><td class="cond">im \(\mathbb{R}^m\) automatisch</td></tr>
<tr><td>\(\mathcal{J}_{x_0}(f)\) hinzuschreiben beweist nichts; es notiert nur die einzige Kandidatin. Schreibt man sie transponiert hin, so scheitert für \(n\neq m\) schon das Format des Produkts; für \(n=m\) ist das Produkt bildbar und liefert unbemerkt ein falsches Ergebnis.</td><td class="cond">\(M^{n,m}\): Zeilen \(=n\), Spalten \(=m\)</td></tr>
<tr><td>\(Df(x_0)[h]\in F\) ist ein Vektor (eckige Klammern), \(f'(x_0)\in\mathcal{L}(E,F)\) ein Operator (Anwendung ohne Klammern als Produkt \(f'(x_0)h\)).</td><td class="cond">Typen nicht mischen</td></tr>
<tr><td>Weg B ohne den Nachweis der Stetigkeit von \(x\mapsto f'_S(x)\) liefert nur die schwache Ableitung — nicht \(f'(x_0)\).</td><td class="cond">Satz (∗) vollständig zitieren</td></tr>
<tr><td>Bei Funktionalen ist \(I'(y_0)\in\mathcal{L}(C^1,\mathbb{R})\) der <i>Operator</i> und \(I'(y_0)[h]\in\mathbb{R}\) sein <i>Wert</i>. Die Zugehörigkeit zu \(\mathcal{L}\) nie an den Wert schreiben.</td><td class="cond">Operator gegen Zahl</td></tr>
<tr><td>Offene Intervalle stets \(\left]a,b\right[\); der Nullvektor der Tafel (durchgestrichene Null) heißt hier \(\mathbf{0}_E,\mathbf{0}_F,\mathbf{0}_m\), die Identität \(\mathbf{1}\).</td><td class="cond">Notation der Vorlesung</td></tr>
</table>
</div>`; }

function extremaHtml(){ return String.raw`
<p class="sub">Kritische Punkte finden, mit der zweiten Ableitung klassifizieren, und dasselbe unter Nebenbedingungen mit Lagrange-Multiplikatoren. Das Blatt ist als Rechenweg gebaut: oben der Fahrplan, darunter für jeden Schritt das Werkzeug, unten die Nebenbedingungen. Den Ableitungsbegriff selbst liefert <a href="#/ref/frechet">Fréchet-Ableitung</a>, das Auflösen von \(F=\mathbf{0}_n\) der Spickzettel <a href="#/ref/implizit">Implizite Funktionen</a>.</p>

<div class="refblock">
<h3>Fahrplan: freie Extrema</h3>
<p class="sub">\((E,\|\cdot\|_E)\) vollständig, \(\mathcal{U}\subset E\) offen, \(f:\mathcal{U}\to\mathbb{R}\); zum Rechnen ist \(E=\mathbb{R}^m\). Vier Schritte, immer in dieser Reihenfolge.</p>
<table class="reftable">
<tr><td><b>1. Kandidaten sammeln.</b> \(f'(x^*)=0\) in \(\mathcal{L}(E,\mathbb{R})\) lösen, im \(\mathbb{R}^m\) also \(\nabla f\big|_{x=x^*}=\mathbf{0}_m\): \(m\) Gleichungen für \(m\) Unbekannte<span class="when">gibt die vollständige Liste der <i>inneren</i> Kandidaten</span></td><td class="cond">\(\mathcal{U}\) offen, \(Df(x^*)[h]\) existiert</td></tr>
<tr><td><b>2. Zweite Ableitung dort auswerten.</b> Die quadratische Form \(f''(x^*)h^2\) aufstellen; im \(\mathbb{R}^m\) die Hesse-Matrix \(H_x(f)\) einmal allgemein bilden und erst dann jeden Kandidaten einsetzen<span class="when">erst ableiten, dann auswerten — nie umgekehrt</span></td><td class="cond">\(f\) 3-fach stetig differenzierbar</td></tr>
<tr><td><b>3. Klassifizieren.</b> positiv definit \(\Rightarrow\) lokales Minimum, negativ definit \(\Rightarrow\) lokales Maximum, indefinit \(\Rightarrow\) Sattelpunkt, semidefinit \(\Rightarrow\) keine Aussage</td><td class="cond">\(x^*\) kritischer Punkt</td></tr>
<tr><td><b>4. Rand und Unbeschränktheit getrennt prüfen.</b> Die Schritte 1–3 sehen ausschließlich innere Punkte. Rand parametrisieren oder als Nebenbedingung mit Lagrange behandeln; für globale Aussagen zusätzlich das Verhalten für \(\|x\|\to\infty\) ansehen<span class="when">immer, wenn nach globalen Extrema gefragt ist</span></td><td class="cond">bei nicht offenem Definitionsbereich</td></tr>
</table>
<div class="note">Schritt 1 ist <b>notwendig und nicht hinreichend</b>, Schritt 3 ist <b>hinreichend und nicht notwendig</b>. Ein Kandidat, den Schritt 3 nicht entscheidet, ist damit nicht erledigt, sondern muss von Hand untersucht werden.</div>
</div>

<div class="twocol">
<div class="refblock">
<h3>Schritt 1: Fermat und kritischer Punkt</h3>
<table class="reftable">
<tr><td><b>Lokales Maximum</b> in \(x^*\in\mathcal{U}\): \[\exists_{\varepsilon>0}\ \forall_{x\in U_\varepsilon(x^*)\cap\,\mathcal{U}}:\quad f(x)\le f(x^*),\] <b>lokales Minimum</b> mit \(\ge\). Verglichen wird nur innerhalb einer Kugel, weit weg darf \(f\) beliebig groß werden.</td><td class="cond">braucht nur die Norm</td></tr>
<tr><td><b>Satz von Fermat (notwendig).</b> Nimmt \(f\) in \(x^*\) einen lokalen Extremwert an und existiert dort die Richtungsableitung \(Df(x^*)[h]\), so ist \[Df(x^*)[h]=0.\]</td><td class="cond">\(x^*\) innerer Punkt</td></tr>
<tr><td><b>Kritischer Punkt.</b> \(Df(x^*)[h]=0\) für <i>alle</i> zugelassenen \(h\in E\). Ist \(f\) Fréchet-differenzierbar, heißt das schlicht \(f'(x^*)=0\).</td></tr>
<tr><td><b>Im \(\mathbb{R}^m\).</b> Wegen \(Df(x)[h]=\langle h,\nabla f\rangle\big|_{x}\) ist \(x^*\) genau dann kritisch, wenn \[\langle h,\nabla f(x^*)\rangle\ \overset{!}{=}\ 0\ \ \text{für alle }h\in\mathbb{R}^m,\] d.h. \(\frac{\partial f}{\partial x_1}\big|_{x=x^*}=\ldots=\frac{\partial f}{\partial x_m}\big|_{x=x^*}=0\).<span class="when">das ist die Rechenvorschrift für Schritt 1</span></td></tr>
<tr><td><b>Beweis in einer Zeile.</b> \(\varphi_h(t)=f(x^*+t\,h)\) ist auf einem Intervall \(\left]-\tilde\varepsilon,\tilde\varepsilon\right[\) definiert (\(\mathcal{U}\) offen) und hat in \(t=0\) ein Extremum; der eindimensionale Satz von Fermat gibt \(\varphi_h'(0)=Df(x^*)[h]=0\).<span class="when">diese Restriktion auf Geraden trägt den ganzen Abschnitt</span></td></tr>
<tr><td><b>Klausurfallen.</b> Die Umkehrung ist falsch (\(f(t)=t^3\) in \(t=0\)). \(Df(x^*)[h]=0\) für <i>ein</i> \(h\) macht \(x^*\) noch nicht kritisch. Auf dem Rand und unter Nebenbedingungen gilt der Satz nicht — dafür Lagrange. Vgl. <a href="#/7.9.1">7.9.1</a>.</td></tr>
</table>
</div>

<div class="refblock">
<h3>Schritt 2: \(f''(x^*)h^2\) und Definitheit</h3>
<table class="reftable">
<tr><td><b>Taylor im kritischen Punkt.</b> \[f(x^*+h)=f(x^*)+\underbrace{f'(x^*)h}_{=\,0}+\tfrac12\,f''(x^*)h^2+\mathcal{O}\!\left(\|h\|_E^3\right)\] Der quadratische Term bestimmt das Vorzeichen der Änderung.</td><td class="cond">3-fach stetig Fréchet-diffbar</td></tr>
<tr><td><b>Bilinearform.</b> \(f''(x^*)\in\mathcal{L}^{(2)}(E,\mathbb{R})\), und \(f''(x^*)h^2=\big(f''(x^*)h\big)h\) ist die zugehörige quadratische Form — <i>keine</i> Potenz, sondern dieselbe Richtung zweimal eingesetzt.</td></tr>
<tr><td><b>positiv definit</b> \[\exists_{\varepsilon>0}\ \forall h\in E:\quad f''(x^*)h^2\ \ge\ \varepsilon\,\|h\|_E^2,\] <b>negativ definit</b> mit \(\le-\varepsilon\|h\|_E^2\). Ein <i>einziges</i> \(\varepsilon>0\) muss für alle \(h\) taugen.</td></tr>
<tr><td><b>Hinreichende Bedingung.</b> \(x^*\) kritisch und \(f''(x^*)\) positiv definit \(\Rightarrow\) striktes lokales <b>Minimum</b>; negativ definit \(\Rightarrow\) striktes lokales <b>Maximum</b>.<span class="when">sobald ein gemeinsames \(\varepsilon>0\) für alle \(h\) gefunden ist — „nicht entartet“ genügt nicht</span></td><td class="cond">\(x^*\) kritisch</td></tr>
<tr><td><b>Warum das trägt.</b> Mit \(\left|\mathcal{O}(\|h\|^3)\right|\le C\|h\|^3\) für \(\|h\|<\delta\) folgt \[f(x^*+h)-f(x^*)\ \ge\ \left(\tfrac{\varepsilon}{2}-C\|h\|\right)\|h\|^2\ \ge\ \tfrac{\varepsilon}{4}\|h\|^2\] für \(\|h\|<\min\{\delta,\ \varepsilon/(4C)\}\).<span class="when">\(\|h\|^3\) ist für kleine \(\|h\|\) viel kleiner als \(\|h\|^2\)</span></td></tr>
<tr><td><b>Warum das \(\varepsilon\)?</b> Im \(\mathbb{R}^m\) ist die Einheitssphäre kompakt, dort ist „\(f''(x^*)h^2>0\) für alle \(h\ne\mathbf{0}_m\)“ bereits gleichwertig zur Definitheit (mit \(\varepsilon=\lambda_1\)). In unendlichdimensionalen Räumen nicht.
${exBox(String.raw`<p>Auf \(E=\ell^2\) sei \(Q(h)=\sum_{k\ge1}\frac{h_k^2}{k}\). Für jedes \(h\ne\mathbf{0}_E\) ist \(Q(h)>0\), aber für die Einheitsvektoren gilt \[\|e_k\|=1,\qquad Q(e_k)=\tfrac1k\ \xrightarrow{\ k\to\infty\ }\ 0.\] Ein gemeinsames \(\varepsilon>0\) existiert also nicht — genau deshalb formuliert die Vorlesung die Definitheit mit \(\varepsilon\) und nicht mit „\(>0\)“.</p>`,"Gegenbeispiel in \(\ell^2\)")}</td></tr>
</table>
</div>
</div>

<div class="refblock">
<h3>Schritt 3: Klassifikation und Sattelpunkt-Kriterium</h3>
<table class="reftable">
<tr><td><b>Sattelpunkt-Kriterium.</b> Gibt es zwei Richtungen \(h',h''\in E\) mit \[f''(x^*)(h')^2>0\qquad\text{und}\qquad f''(x^*)(h'')^2<0,\] so liegt in \(x^*\) <b>kein lokaler Extremwert</b> vor. Man nennt \(x^*\) dann einen <b>Sattelpunkt</b>.<span class="when">zwei Testrichtungen genügen — die ganze Form muss man nicht kennen</span></td><td class="cond">\(x^*\) kritisch, strikte Ungleichungen</td></tr>
<tr><td><b>Dieselbe Größe, andere Schreibweise.</b> Die iterierte Richtungsableitung ist gerade die quadratische Form: \[D\big(Df(x^*)h\big)h=f''(x^*)\big[h,h\big]=f''(x^*)h^2=\varphi_h''(0).\]</td></tr>
<tr><td><b>Warum zwei Richtungen reichen.</b> Für \(\varphi_{h'}\) ist \(\varphi_{h'}'(0)=0\) und \(\varphi_{h'}''(0)>0\), also hat \(\varphi_{h'}\) in \(t=0\) ein striktes Minimum; entsprechend hat \(\varphi_{h''}\) ein striktes Maximum. In <i>jeder</i> Umgebung von \(x^*\) liegen damit größere und kleinere Werte als \(f(x^*)\).<span class="when">für den Ausschluss genügen zwei Geraden, für den Nachweis reichen alle Geraden nicht</span></td></tr>
<tr><td><b>Testrichtungen finden.</b> Im \(\mathbb{R}^m\): Eigenvektoren von \(H_{x^*}(f)\) zum größten Eigenwert \(\lambda_m>0\) und zum kleinsten \(\lambda_1<0\). Oft genügen schon die Koordinatenrichtungen — haben zwei der Zahlen \(\frac{\partial^2f}{\partial x_j^2}\big|_{x=x^*}\) verschiedene Vorzeichen, ist man fertig.
${exBox(String.raw`<p><b>1.</b> \(\nabla f\big|_{x}=(3x^2-3y,\ 3y^2-3x)^{T}\), also \(\nabla f\big|_{x=(0,0)^{T}}=\mathbf{0}_2\): kritisch.</p><p><b>2.</b> Mit \(\frac{\partial^2f}{\partial x^2}=6x\), \(\frac{\partial^2f}{\partial y^2}=6y\), \(\frac{\partial^2f}{\partial x\,\partial y}=-3\) wird im Nullpunkt \[f''(x^*)h^2=-3h_1h_2-3h_2h_1=-6\,h_1h_2.\]</p><p><b>3.</b> \(h'=(1,-1)^{T}\): \(f''(x^*)(h')^2=6>0\). \(h''=(1,1)^{T}\): \(f''(x^*)(h'')^2=-6<0\).</p><p><b>4. Gegenprobe.</b> \(\varphi_{h'}(t)=f(t,-t)=3t^2>0=f(0,0)\) für \(t\ne0\), und \(\varphi_{h''}(t)=f(t,t)=t^2(2t-3)<0\) für \(0<|t|<\tfrac32\). Also Sattelpunkt.</p>`,"Sattelpunkt von \(f(x,y)=x^3+y^3-3xy\) in \((0,0)^{T}\)")}</td></tr>
<tr><td><b>Grenze des Kriteriums: der semidefinite Fall.</b> Verschwindet die Form in einer Richtung, sagt weder <a href="#/7.9.2">7.9.2</a> noch <a href="#/7.9.3">7.9.3</a> etwas. \(f(x,y)=x^2+y^4\) und \(g(x,y)=x^2-y^4\) haben in \((0,0)^{T}\) beide \(f''(x^*)h^2=2h_1^2\ \ge0\); dennoch hat \(f\) ein striktes Minimum und \(g\) einen Sattel, denn \(g(0,t)=-t^4<0< t^2=g(t,0)\).<span class="when">dann von Hand untersuchen, am besten längs der Richtung, in der die Form verschwindet</span></td><td class="cond">zweite Ordnung entscheidet nicht</td></tr>
</table>
<div class="note"><b>Merksatz.</b> Drei Ausgänge, drei Werkzeuge: <b>definit</b> \(\Rightarrow\) Extremum (<a href="#/7.9.2">7.9.2</a>) — <b>indefinit</b> \(\Rightarrow\) Sattel (<a href="#/7.9.3">7.9.3</a>) — <b>semidefinit</b> \(\Rightarrow\) keine Aussage, direkte Untersuchung nötig.</div>
</div>

<div class="refblock">
<h3>Spezialfall \(\mathbb{R}^m\): Hesse-Matrix und Eigenwerte</h3>
<table class="reftable">
<tr><td><b>Die Form ist eine Matrix.</b> Für \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}\) gilt \[f''(x^*)h^2=\big\langle h,\ H_{x^*}(f)\,h\big\rangle,\qquad H_{x^*}(f)=\begin{pmatrix}\dfrac{\partial^2f}{\partial x_1^2}&\cdots&\dfrac{\partial^2f}{\partial x_1\partial x_m}\\ \vdots&&\vdots\\ \dfrac{\partial^2f}{\partial x_m\partial x_1}&\cdots&\dfrac{\partial^2f}{\partial x_m^2}\end{pmatrix}\Bigg|_{x=x^*}.\] Ausgeschrieben \(f''(x^*)h^2=\sum_{j,\ell=1}^{m}\frac{\partial^2f}{\partial x_j\partial x_\ell}\big|_{x=x^*}h_jh_\ell\) — das gilt ohne jede Zusatzannahme.</td><td class="cond">3-fach stetig diffbar</td></tr>
<tr><td><b>Satz von Schwarz.</b> Bei stetigen zweiten partiellen Ableitungen ist \(H_{x^*}(f)\) <b>symmetrisch</b>, also reell diagonalisierbar mit Eigenwerten \(\lambda_1\le\lambda_2\le\ldots\le\lambda_m\) (mit Vielfachheit).<span class="when">nur deshalb darf man gleiche gemischte Terme zusammenfassen</span></td></tr>
<tr><td><b>Rayleigh-Quotient (Merkhilfe für alles Folgende).</b> Für \(h\ne\mathbf{0}_m\) \[\lambda_1\ \le\ \frac{\big\langle h,H_{x^*}(f)h\big\rangle}{\|h\|^2}\ \le\ \lambda_m,\] und beide Schranken werden angenommen (für \(h=v_1\) bzw. \(h=v_m\)). Grund: mit \(h=\sum_k c_kv_k\) in einer Orthonormalbasis aus Eigenvektoren ist \(\langle h,Hh\rangle=\sum_k\lambda_kc_k^2\) ein gewichteter Mittelwert der Eigenwerte.<span class="when">liefert das optimale \(\varepsilon\) der abstrakten Definition</span></td></tr>
<tr><td><b>Fall 1.</b> \(0<\varepsilon=\lambda_1\le\ldots\le\lambda_m\): \(H_{x^*}(f)\) positiv definit \(\Rightarrow\) lokales <b>Minimum</b>.</td><td class="cond">alle Eigenwerte \(>0\)</td></tr>
<tr><td><b>Fall 2.</b> \(\lambda_1\le\ldots\le\lambda_m=-\varepsilon<0\): negativ definit \(\Rightarrow\) lokales <b>Maximum</b>.</td><td class="cond">alle Eigenwerte \(<0\)</td></tr>
<tr><td><b>Fall 3.</b> \(\lambda_1<0<\lambda_m\): indefinit \(\Rightarrow\) kein Extremwert, <b>Sattelpunkt</b> (Testrichtungen \(h'=v_m\), \(h''=v_1\)).</td><td class="cond">gemischte Vorzeichen</td></tr>
<tr><td><b>Sonst</b>, d.h. \(\lambda_1=0\) oder \(\lambda_m=0\): <b>keine Aussage möglich</b>. Häufigster Fehler ist der Schluss von \(\lambda_1=0,\ \lambda_2>0\) auf ein Minimum — das Paar \(x^2+y^4\) und \(x^2-y^4\) hat in \((0,0)^{T}\) dieselbe Hesse-Matrix \(\left(\begin{smallmatrix}2&0\\0&0\end{smallmatrix}\right)\) und verschiedenes Verhalten.<span class="when">Null als Eigenwert ist immer ein Warnsignal</span></td><td class="cond">semidefinit</td></tr>
</table>
<div class="subgrid">
<div class="subcard"><b>Weg A: Eigenwerte</b><br>Charakteristisches Polynom aufstellen, Nullstellen bestimmen, Vorzeichen ablesen. Nötig für \(m\ge3\), liefert zusätzlich das optimale \(\varepsilon=\lambda_1\) und die Testrichtungen als Eigenvektoren.</div>
<div class="subcard"><b>Weg B: Schnelltest für \(m=2\)</b><br>Für \(H=\left(\begin{smallmatrix}a&c\\ c&b\end{smallmatrix}\right)\) ist \(\operatorname{Tr}H=a+b=\lambda_1+\lambda_2\) und \(\det H=ab-c^2=\lambda_1\lambda_2\). Damit: \(\det H<0\Rightarrow\) Sattel; \(\det H>0\) und \(\operatorname{Tr}H>0\Rightarrow\) Minimum; \(\det H>0\) und \(\operatorname{Tr}H<0\Rightarrow\) Maximum; \(\det H=0\Rightarrow\) keine Aussage.</div>
</div>
</div>

<div class="refblock">
<h3>Musteraufgabe: vollständige Diskussion im \(\mathbb{R}^2\)</h3>
<p class="sub">Bestimme alle lokalen und globalen Extrema von \(f(x,y)=x^3+y^3-3xy\) auf \(\mathcal{U}=\mathbb{R}^2\). Das Polynom ist beliebig oft stetig differenzierbar, alle Voraussetzungen sind erfüllt.</p>
<table class="reftable">
<tr><td><b>Schritt 1: kritische Punkte.</b> \[\nabla f\big|_{x}=\begin{pmatrix}3x^2-3y\\ 3y^2-3x\end{pmatrix}\overset{!}{=}\mathbf{0}_2\ \Longleftrightarrow\ y=x^2\ \text{und}\ x=y^2.\] Einsetzen: \(x=x^4\), also \(x(x^3-1)=0\), d.h. \(x=0\) oder \(x=1\). Mit \(y=x^2\): \[x^*_{(1)}=(0,0)^{T},\qquad x^*_{(2)}=(1,1)^{T}.\] Funktionswerte \(f(0,0)=0\) und \(f(1,1)=-1\).<span class="when">immer beide Gleichungen zugleich lösen, nicht nacheinander</span></td><td class="cond">Schritt 1 des Fahrplans</td></tr>
<tr><td><b>Schritt 2: Hesse-Matrix einmal allgemein.</b> \[H_{x}(f)=\begin{pmatrix}6x&-3\\ -3&6y\end{pmatrix}\] — symmetrisch, wie Schwarz es verlangt (die Einträge sind Polynome, also stetig).</td><td class="cond">erst allgemein, dann einsetzen</td></tr>
<tr><td><b>Schritt 3a: der Punkt \((0,0)^{T}\).</b> \[H_{(0,0)^{T}}(f)=\begin{pmatrix}0&-3\\ -3&0\end{pmatrix},\quad \operatorname{Tr}H=0,\quad \det H=-9<0.\] Also \(\lambda_1<0<\lambda_2\), genauer liefert \(\lambda^2-9=0\) die Werte \(\lambda_1=-3\) und \(\lambda_2=3\) mit Eigenvektoren \(v_1=(1,1)^{T}\) und \(v_2=(1,-1)^{T}\): <b>Fall 3, Sattelpunkt</b> — dieselben Testrichtungen wie im Beispiel oben.</td></tr>
<tr><td><b>Schritt 3b: der Punkt \((1,1)^{T}\).</b> \[H_{(1,1)^{T}}(f)=\begin{pmatrix}6&-3\\ -3&6\end{pmatrix},\quad \operatorname{Tr}H=12>0,\quad \det H=36-9=27>0.\] Beide Eigenwerte positiv (\(\lambda^2-12\lambda+27=(\lambda-3)(\lambda-9)\), also \(\lambda_1=3\), \(\lambda_2=9\)): <b>Fall 1, striktes lokales Minimum</b> mit \(f(1,1)=-1\) und optimalem \(\varepsilon=\lambda_1=3\).
${exBox(String.raw`<p>Mit \(h=(h_1,h_2)^{T}\) ist \[f''(x^*)h^2=6h_1^2-3h_1h_2-3h_2h_1+6h_2^2=6h_1^2-6h_1h_2+6h_2^2.\] Ansatz \(\varepsilon=3\) und Differenz bilden: \[6h_1^2-6h_1h_2+6h_2^2-3\left(h_1^2+h_2^2\right)=3h_1^2-6h_1h_2+3h_2^2=3\,(h_1-h_2)^2\ \ge\ 0,\] also \(f''(x^*)h^2\ge3\|h\|^2\) für alle \(h\in\mathbb{R}^2\): positiv definit mit \(\varepsilon=3\). Kontrolle über die exakte Entwicklung: \[f(1+h_1,1+h_2)-f(1,1)=\underbrace{3h_1^2-3h_1h_2+3h_2^2}_{=\;\frac12f''(x^*)h^2}+h_1^3+h_2^3,\] und wegen \(3h_1^2-3h_1h_2+3h_2^2=\tfrac32(h_1-h_2)^2+\tfrac32\left(h_1^2+h_2^2\right)\ge\tfrac32\|h\|^2\) überwiegt der quadratische Anteil für kleine \(\|h\|\) den kubischen Rest.</p>`,"Dieselbe Definitheit zu Fuß, ohne Eigenwerte")}</td></tr>

<div class="refblock">
<h3>Schritt 4: Rand, Kompaktheit, Unbeschränktheit</h3>
<table class="reftable">
<tr><td><b>Warum überhaupt.</b> Fermat gilt nur in inneren Punkten. Auf einer abgeschlossenen Menge kann das Maximum am Rand liegen, ohne dass dort \(\nabla f\) verschwindet — der Gradient darf nach außen zeigen.<span class="when">sobald der Definitionsbereich nicht offen ist</span></td></tr>
<tr><td><b>Existenzgarantie.</b> Ist \(K\subset\mathbb{R}^m\) <b>kompakt</b> (abgeschlossen und beschränkt) und \(f\) stetig, so werden Maximum und Minimum angenommen. Dann genügt es, die endlich vielen Kandidaten zu vergleichen — eine Klassifikation über die Hesse-Matrix ist gar nicht nötig.</td><td class="cond">\(K\) kompakt, \(f\) stetig</td></tr>
<tr><td><b>Kandidatenliste auf \(K\).</b> (i) kritische Punkte im Inneren; (ii) Randpunkte, gefunden per Parametrisierung oder per Lagrange mit der Randgleichung als Nebenbedingung; (iii) Ecken bzw. Punkte, in denen der Rand nicht glatt ist.
${exBox(String.raw`<p><b>Inneres.</b> \(\nabla f\big|_{x}=(y,x)^{T}=\mathbf{0}_2\) nur in \((0,0)^{T}\); dort ist \(H=\left(\begin{smallmatrix}0&1\\1&0\end{smallmatrix}\right)\) mit \(\det H=-1<0\), also ein Sattelpunkt mit \(f=0\).</p><p><b>Rand.</b> Parametrisierung \(\varkappa(t)=(\cos t,\sin t)^{T}\), \(t\in[0,2\pi]\), liefert \[(f\circ\varkappa)(t)=\cos t\,\sin t=\tfrac12\sin 2t.\] Extrema bei \(2t=\tfrac\pi2+k\pi\), also \(t\in\{\tfrac\pi4,\tfrac{3\pi}4,\tfrac{5\pi}4,\tfrac{7\pi}4\}\) mit Werten \(\pm\tfrac12\).</p><p><b>Vergleich.</b> \(K\) ist kompakt, \(f\) stetig: das Maximum \(\tfrac12\) wird in \(\pm\tfrac{1}{\sqrt2}(1,1)^{T}\), das Minimum \(-\tfrac12\) in \(\pm\tfrac{1}{\sqrt2}(1,-1)^{T}\) angenommen. Der innere Kandidat mit \(f=0\) verliert.</p><p><b>Brücke.</b> Der Rand ist die Nebenbedingung \(F(x,y)=x^2+y^2-1=0\); dasselbe Ergebnis liefert unten das Lagrange-Verfahren, ohne dass man parametrisieren muss.</p>`,"\(f(x,y)=xy\) auf der abgeschlossenen Einheitskreisscheibe")}</td></tr>
<tr><td><b>Unbeschränkter Bereich.</b> Vor jeder globalen Aussage \(f\) längs geeigneter Strahlen oder für \(\|x\|\to\infty\) abschätzen. Gilt \(f(x)\to+\infty\) für \(\|x\|\to\infty\) und ist \(\mathcal{U}=\mathbb{R}^m\) (allgemeiner: \(\mathcal{U}\) abgeschlossen), so existiert ein globales Minimum (und kein Maximum); ist \(f\) weder nach oben noch nach unten beschränkt, existiert keines von beiden.<span class="when">eine Zeile Abschätzung ersetzt hier eine lange Diskussion</span></td><td class="cond">\(\mathcal{U}\) unbeschränkt</td></tr>
</table>
</div>

<div class="twocol">
<div class="refblock">
<h3>Extrema unter Nebenbedingungen: die Idee</h3>
<table class="reftable">
<tr><td><b>Begriffe.</b> Optimiert wird die <b>Zielfunktion</b> \(f\), zulässig sind nur die Punkte der <b>Nebenbedingung</b> \(F=0\) (an der Tafel „Zf“ und „NB“).</td></tr>
<tr><td><b>Definition.</b> \(f\) nimmt in \((x^*,y^*)\in V\) ein lokales Maximum unter \(F(x,y)=0\) an, falls \(F(x^*,y^*)=0\) und \[\exists_{\varepsilon,\delta>0}\ \forall_{(x,y)\in U_\varepsilon(x^*)\cap U_\delta(y^*)\cap V}:\] \[F(x,y)=0\ \Rightarrow\ f(x,y)\le f(x^*,y^*)\] (Minimum mit \(\ge\)).</td><td class="cond">\(V\subset\mathbb{R}^2\) offen</td></tr>
<tr><td><b>Geometrie in vier Beobachtungen.</b> ① \(f\) erzeugt Höhenlinien in der \((x,y)\)-Ebene. ② Die Nebenbedingung schränkt auf eine Kurve ein. ③ Extremal ist es dort, wo die Höhenlinie die Kurve <i>berührt</i> statt sie zu kreuzen. ④ Also stehen beide Gradienten senkrecht auf derselben Tangente: \[\nabla f=\lambda\,\nabla F\quad\text{für ein }\lambda\in\mathbb{R}.\]<span class="when">das ist der ganze Inhalt der Methode</span></td></tr>
<tr><td><b>Warum ③ zwingend ist.</b> Kreuzt die Höhenlinie die Kurve, so liegt auf der einen Seite ein größerer, auf der anderen ein kleinerer Wert — man könnte längs der Kurve weiterlaufen und \(f\) vergrößern.</td></tr>
<tr><td><b>Unterschied zum freien Fall.</b> Frei muss \(\nabla f=\mathbf{0}_2\) gelten, weil man in alle Richtungen ausweichen darf. Unter einer Nebenbedingung muss \(Df\) nur in den Richtungen <i>längs</i> der Kurve verschwinden; \(\nabla f\) selbst darf ungleich Null sein.</td></tr>
<tr><td><b>Warum nicht einfach einsetzen?</b> Der Schulweg (nach \(y\) auflösen, einsetzen, ableiten) ist der Ausnahmefall. Schon \(x^2+y^2-1=0\) lässt sich nur lokal und mit Vorzeichenwahl auflösen, in \((\pm1,0)\) gar nicht. Bei mehreren Nebenbedingungen wird das Einsetzen unpraktikabel und zerstört die Symmetrie. Vgl. <a href="#/7.12.1">7.12.1</a>.</td></tr>
</table>
</div>

<div class="refblock">
<h3>Die Lagrange-Funktion</h3>
<table class="reftable">
<tr><td><b>Eine Nebenbedingung.</b> \[\mathcal{L}(x,y;\lambda)=f(x,y)-\lambda\cdot F(x,y),\] \(\lambda\) heißt Lagrange-Faktor. Bedingungen: \[\text{(I)}\ \nabla_{(x,y)}\mathcal{L}=\nabla f-\lambda\nabla F=\mathbf{0}_2\ \ (2\ \text{Gl.}),\] \[\text{(II)}\ \tfrac{\partial}{\partial\lambda}\mathcal{L}=-F(x,y)=0\ \ (1\ \text{Gl.}).\] Zusammen 3 Gleichungen für \(x,y,\lambda\).<span class="when">(II) reproduziert automatisch die Nebenbedingung</span></td></tr>
<tr><td><b>Allgemein: \(k\) Variablen, \(n\) Nebenbedingungen.</b> \(V\subset\mathbb{R}^k\) offen, \(\tilde x=(\tilde x_1,\dots,\tilde x_k)\), \(F=(F_1,\dots,F_n)^{T}\) mit \(F(\tilde x)=\mathbf{0}_n\) und \(n< k\): \[\mathcal{L}(\tilde x;\lambda_1,\dots,\lambda_n)=f(\tilde x)-\sum_{\ell=1}^{n}\lambda_\ell F_\ell(\tilde x).\]</td><td class="cond">\(n< k\)</td></tr>
<tr><td><b>Die beiden Bedingungsgruppen.</b> \[\text{(1)}\ \ \nabla_{\tilde x}\mathcal{L}\big|_{\tilde x=\tilde x^*}=\nabla_{\tilde x}f-\sum_{\ell=1}^{n}\lambda_\ell\nabla_{\tilde x}F_\ell=\mathbf{0}_k,\] \[\text{(2)}\ \ \nabla_\lambda\mathcal{L}=\mathbf{0}_n,\quad\text{d.h.}\quad F(\tilde x^*)=\mathbf{0}_n.\]</td></tr>
<tr><td><b>Zählung als Kontrolle.</b> \(k\) Variablen plus \(n\) Multiplikatoren gegen \(k\) Gradientengleichungen plus \(n\) Nebenbedingungen: \[k+n\ \text{Gleichungen für}\ k+n\ \text{Unbekannte}.\] Geht die Zählung nicht auf, fehlt meist eine Nebenbedingung oder ein Multiplikator.<span class="when">erste Kontrolle, bevor man rechnet</span></td></tr>
<tr><td><b>Was die Schlussformel sagt.</b> \(\nabla f(\tilde x^*)=\sum_{\ell}\lambda_\ell\nabla F_\ell(\tilde x^*)\): der Gradient der Zielfunktion liegt im <b>Aufspann der Nebenbedingungsgradienten</b>, hat also keine Komponente längs der zulässigen Menge.</td></tr>
<tr><td><b>Rangbedingung.</b> Gefordert ist \[\operatorname{rg}\Big(\mathcal{J}_{\tilde x}(F)\big|_{\tilde x=\tilde x^*}\Big)=n\] in einer ganzen Umgebung \(U_\varepsilon(\tilde x^*)\cap V\): die \(n\) Nebenbedingungen sind wirklich \(n\) unabhängige Einschränkungen. Für \(n=1\) heißt das schlicht \(\nabla F\ne\mathbf{0}_k\).<span class="when">ohne sie greift das Verfahren nicht — siehe Fallen unten</span></td><td class="cond">notwendig für die Herleitung</td></tr>
<tr><td><b>Vorzeichenkonvention.</b> \(f+\lambda F\) statt \(f-\lambda F\) ändert nur das Vorzeichen von \(\lambda\); die Kandidaten sind dieselben. Vgl. <a href="#/7.12.2">7.12.2</a>, <a href="#/7.12.4">7.12.4</a>.</td></tr>
</table>
</div>
</div>

<div class="refblock">
<h3>Rezept: Extrema mit Lagrange-Multiplikatoren</h3>
<table class="reftable">
<tr><td><b>1. Aufschreiben.</b> Zielfunktion \(f:V\subset\mathbb{R}^k\to\mathbb{R}\), Nebenbedingungen \(F_1=\ldots=F_n=0\) mit \(n< k\). Alle partiellen Ableitungen 1. Ordnung von \(f\) und \(F\) müssen existieren und stetig sein.</td><td class="cond">Voraussetzungen zuerst</td></tr>
<tr><td><b>2. Rangprobe.</b> \(\mathcal{J}_{\tilde x}(F)\) aufstellen und \(\operatorname{rg}=n\) auf der ganzen Nebenbedingungsmenge prüfen. Punkte mit Rangabfall (für \(n=1\): \(\nabla F=\mathbf{0}_k\)) sofort als <b>Sonderkandidaten</b> notieren — sie fallen durch das Verfahren hindurch.</td><td class="cond">sonst fehlen Kandidaten</td></tr>
<tr><td><b>3. Lagrange-Funktion bilden.</b> \(\mathcal{L}(\tilde x;\lambda_1,\dots,\lambda_n)=f(\tilde x)-\sum_{\ell=1}^{n}\lambda_\ell F_\ell(\tilde x)\).</td></tr>
<tr><td><b>4. System aufstellen.</b> \(\nabla_{\tilde x}\mathcal{L}=\mathbf{0}_k\) und \(\nabla_\lambda\mathcal{L}=\mathbf{0}_n\); Gleichungen zählen: \(k+n\).</td></tr>
<tr><td><b>5. Auflösen.</b> Die \(\lambda_\ell\) so früh wie möglich eliminieren — Differenzen und Quotienten von Gleichungen bilden, Symmetrien ausnutzen. Jede Fallunterscheidung (\(\lambda_\ell=0\), verschwindende Faktoren) mitschreiben.<span class="when">nie ungeprüft durch einen Ausdruck teilen</span></td></tr>
<tr><td><b>6. Entscheiden.</b> Alle Kandidaten aus 2. und 5. in \(f\) einsetzen und die Werte vergleichen. Ist die Nebenbedingungsmenge kompakt, werden Maximum und Minimum angenommen und stehen in dieser Liste — das ersetzt jede hinreichende Bedingung.
${exBox(String.raw`<p><b>Aufgabe.</b> Unter allen Rechtecken mit Umfang \(U>0\) das mit größtem Flächeninhalt finden. Mit Breite \(x\) und Höhe \(y\): \[f(x,y)=x\,y,\qquad F(x,y)=2(x+y)-U=0.\]</p><p><b>2. Rangprobe.</b> \(\nabla F=(2,2)^{T}\ne\mathbf{0}_2\) überall — keine Sonderkandidaten.</p><p><b>3. Lagrange-Funktion.</b> \(\mathcal{L}(x,y;\lambda)=xy-\lambda\big(2(x+y)-U\big)\).</p><p><b>4. System.</b> \[\frac{\partial\mathcal{L}}{\partial x}=y-2\lambda=0,\qquad \frac{\partial\mathcal{L}}{\partial y}=x-2\lambda=0,\qquad \frac{\partial\mathcal{L}}{\partial\lambda}=-\big(2(x+y)-U\big)=0.\] Drei Gleichungen, drei Unbekannte.</p><p><b>5. Auflösen.</b> Aus den ersten beiden folgt \(x=y=2\lambda\) (die Symmetrie bleibt erhalten, anders als beim Einsetzverfahren). Eingesetzt in die dritte: \[2(2\lambda+2\lambda)=U\ \Longrightarrow\ 8\lambda=U\ \Longrightarrow\ \lambda=\frac{U}{8},\qquad x^*=y^*=\frac{U}{4}.\]</p><p><b>6. Entscheiden.</b> Auf der kompakten Menge \(K=\{(x,y):x,y\ge0,\ 2(x+y)=U\}\) nimmt das stetige \(f\) sein Maximum an. In den Endpunkten \((0,\tfrac{U}{2})\) und \((\tfrac{U}{2},0)\) ist \(f=0\); in allen übrigen Punkten von \(K\), also für \(x,y>0\), ist \((\tfrac{U}{4},\tfrac{U}{4})\) der einzige Kandidat. Wegen \(f=\tfrac{U^2}{16}>0\) liegt dort das Maximum: das optimale Rechteck ist das <b>Quadrat</b> mit Seitenlänge \(U/4\).</p><p><b>Probe auf Beobachtung ④.</b> \(\nabla f\big|_{(x^*,y^*)}=(y^*,x^*)^{T}=(\tfrac{U}{4},\tfrac{U}{4})^{T}\) und \(\nabla F=(2,2)^{T}\), also \(\nabla f=\lambda\nabla F\) mit \(\lambda=\tfrac{U}{8}\). Geometrisch berührt die Hyperbel \(xy=U^2/16\) die Gerade \(x+y=U/2\); jede Hyperbel mit größerem Wert verfehlt die Gerade ganz.</p>`,"Rechteck mit gegebenem Umfang \(U\) — vollständig gerechnet")}</td><td class="cond">Kompaktheit liefert die Existenz</td></tr>
<tr><td><b>Zwei Nebenbedingungen, dieselben sechs Schritte.</b>
${exBox(String.raw`<p>\[f(\tilde x)=\tilde x_3,\quad F_1=\tilde x_1^2+\tilde x_2^2+\tilde x_3^2-1=0,\quad F_2=\tilde x_1+\tilde x_2+\tilde x_3=0.\]</p><p><b>Rangprobe.</b> \(\mathcal{J}_{\tilde x}(F)=\left(\begin{smallmatrix}2\tilde x_1&2\tilde x_2&2\tilde x_3\\ 1&1&1\end{smallmatrix}\right)\) hat Rang \(<2\) nur, wenn \(\tilde x=t(1,1,1)^{T}\); dann zwingt \(F_2=3t=0\) auf \(t=0\), im Widerspruch zu \(F_1=0\). Also \(\operatorname{rg}=2=n\) in jedem zulässigen Punkt.</p><p><b>System.</b> \(\mathcal{L}=\tilde x_3-\lambda_1(\tilde x_1^2+\tilde x_2^2+\tilde x_3^2-1)-\lambda_2(\tilde x_1+\tilde x_2+\tilde x_3)\) liefert \(k+n=5\) Gleichungen: \[-2\lambda_1\tilde x_1-\lambda_2=0,\quad -2\lambda_1\tilde x_2-\lambda_2=0,\quad 1-2\lambda_1\tilde x_3-\lambda_2=0\] und die beiden Nebenbedingungen.</p><p><b>Auflösen.</b> Die Differenz der ersten beiden Gleichungen ist \(2\lambda_1(\tilde x_2-\tilde x_1)=0\). Der Fall \(\lambda_1=0\) gibt \(\lambda_2=0\) und damit \(1=0\) — unmöglich. Also \(\tilde x_1=\tilde x_2=:a\), aus der Ebene \(\tilde x_3=-2a\), aus der Sphäre \(6a^2=1\), d.h. \(a=\pm\tfrac{1}{\sqrt6}\).</p><p><b>Entscheiden.</b> Die zulässige Menge ist als Schnitt von Sphäre und Ebene kompakt. Die beiden Kandidaten haben \(f=\pm\tfrac{2}{\sqrt6}\), also ist \(\tfrac{2}{\sqrt6}=\tfrac{\sqrt6}{3}\) das Maximum, angenommen in \(\tilde x^*=\tfrac{1}{\sqrt6}(-1,-1,2)^{T}\).</p><p><b>Probe.</b> Mit \(\lambda_1=\tfrac{1}{\sqrt6}\), \(\lambda_2=\tfrac13\) ist \(\lambda_1\nabla F_1(\tilde x^*)+\lambda_2\nabla F_2(\tilde x^*)=(0,0,1)^{T}=\nabla f\).</p>`,"\(k=3\), \(n=2\): Maximum von \(\tilde x_3\) auf Sphäre geschnitten Ebene")}</td></tr>
</table>
</div>

<div class="twocol">
<div class="refblock">
<h3>Woher \(\lambda\) kommt (Herleitung in vier Schritten)</h3>
<p class="sub">Der Beweis erklärt, warum die Rangbedingung dort steht — und was ohne sie schiefgeht. Ausführlich in <a href="#/7.12.3">7.12.3</a> und <a href="#/7.12.4">7.12.4</a>.</p>
<table class="reftable">
<tr><td><b>1. Auflösen.</b> Ist \(F'_y(x^*,y^*)\) invertierbar (im Fall \(n=1\): \(\ne0\)), so ist \(F=\mathbf{0}_n\) lokal nach \(y\) auflösbar, \(y=y(x)\) ist nach \(x\) differenzierbar, und \[y'_x(x^*)=-\big[F'_y(x^*,y^*)\big]^{-1}F'_x(x^*,y^*).\]<span class="when">Satz über implizite Funktionen, ohne \(y(x)\) je hinzuschreiben</span></td><td class="cond">Rangbedingung</td></tr>
<tr><td><b>2. Einsetzen.</b> Mit \(\varkappa(x)=\begin{pmatrix}x\\ y(x)\end{pmatrix}\) hat \(\hat f=f\circ\varkappa\) in \(x^*\) ein <i>freies</i> Extremum.</td></tr>
<tr><td><b>3. Kettenregel.</b> \[0=\hat f'_x\big|_{x=x^*}=\big(f'_x,\ f'_y\big)\begin{pmatrix}\mathbf{1}\\ y'(x^*)\end{pmatrix}=f'_x-f'_y\big[F'_y\big]^{-1}F'_x.\]</td></tr>
<tr><td><b>4. \(\lambda\) taufen.</b> Für \(n=1\) ist \(\lambda:=\dfrac{f'_y(x^*,y^*)}{F'_y(x^*,y^*)}\) — der Quotient existiert genau wegen \(F'_y\ne0\). Allgemein setzt man \[(\lambda_1,\dots,\lambda_n)^{T}:=\big[F_y'^{\,T}\big]^{-1}\big[f'_y\big]^{T}\] und liest aus \(\big[F'_x\big]^{T}(\lambda_1,\dots,\lambda_n)^{T}=\big[f'_x\big]^{T}\) die Formel \(\nabla_x f=\sum_{\ell}\lambda_\ell\nabla_x F_\ell\) ab; die \(y\)-Zeile ist die Definition der \(\lambda_\ell\), umgestellt.</td></tr>
<tr><td><b>Format-Kontrolle.</b> \(F'_x\) ist \((n,k-n)\), \(F'_y\) ist \((n,n)\), \(y'_x\) ist \((n,k-n)\) — nur so passen die Produkte.<span class="when">beim Nachrechnen immer die Formate mitführen</span></td></tr>
<tr><td><b>Eindeutigkeit.</b> Unter der Rangbedingung sind die \(\nabla F_\ell(\tilde x^*)\) linear unabhängig, also sind die \(\lambda_\ell\) eindeutig bestimmt.</td></tr>
</table>
</div>

<div class="refblock">
<h3>Klausurfallen bei Lagrange</h3>
<table class="reftable">
<tr><td><b>Nur notwendig.</b> Jede Lösung des Systems ist ein <i>Kandidat</i>, mehr nicht. Ob Maximum, Minimum oder nichts vorliegt, entscheidet erst der Wertevergleich — hinreichende Bedingungen werden hier nicht bereitgestellt.</td><td class="cond">immer</td></tr>
<tr><td><b>Gleichung (2) vergessen.</b> Wer nur \(\nabla f=\lambda\nabla F\) löst, hat \(k\) Gleichungen für \(k+n\) Unbekannte und produziert eine ganze Kurve von Scheinlösungen.</td></tr>
<tr><td><b>Der Fall \(\lambda_\ell=0\).</b> Immer gesondert behandeln. Verschwinden <i>alle</i> \(\lambda_\ell\), so ist \(\nabla f(\tilde x^*)=\mathbf{0}_k\), also liegt ein <i>freier</i> kritischer Punkt vor, der zufällig auf der Nebenbedingungsmenge liegt; verschwindet nur ein einzelnes \(\lambda_\ell\), fällt bloß der Term \(\lambda_\ell\nabla F_\ell\) aus der Linearkombination heraus. Oft führt der Fall auf einen Widerspruch — dann darf man ihn ausschließen, aber erst nach dem Hinschreiben.</td><td class="cond">bei jedem Produkt \(=0\)</td></tr>
<tr><td><b>Nicht unbedacht dividieren.</b> Aus \(y=2\lambda\) und \(x=2\lambda\) folgt \(x=y\) — erlaubt. Aus \(y=\lambda\,g(x)\) darf man nicht durch \(g(x)\) teilen, ohne \(g(x)=0\) zu prüfen. Fallunterscheidungen sind der Normalfall, nicht die Ausnahme.</td></tr>
<tr><td><b>Rangabfall: die Falle schlechthin.</b> Punkte mit \(\nabla F=\mathbf{0}_k\) bzw. \(\operatorname{rg}\mathcal{J}_{\tilde x}(F)< n\) werden vom Verfahren <b>übersehen</b> und müssen von Hand geprüft werden.
${exBox(String.raw`<p>\(f(x,y)=x\), \(F(x,y)=y^2-x^3=0\) auf \(V=\mathbb{R}^2\).</p><p><b>Es gibt ein Extremum.</b> Aus \(x^3=y^2\ge0\) folgt \(x\ge0\) für jeden zulässigen Punkt, also \(f(x,y)=x\ge0=f(0,0)\): in \((0,0)\) liegt ein globales Minimum unter der Nebenbedingung.</p><p><b>Die Voraussetzung scheitert.</b> \(\nabla F(x,y)=(-3x^2,\ 2y)^{T}\), also \(\nabla F(0,0)=\mathbf{0}_2\). Die zulässige Menge hat im Ursprung eine Spitze.</p><p><b>Das System ist unlösbar.</b> Mit \(\mathcal{L}=x-\lambda(y^2-x^3)\): \[1+3\lambda x^2=0,\qquad -2\lambda y=0,\qquad y^2-x^3=0.\] Aus der zweiten folgt \(\lambda=0\) (dann sagt die erste \(1=0\)) oder \(y=0\) (dann \(x=0\) und wieder \(1\ne0\)). Kein Kandidat — und trotzdem existiert das Minimum.</p>`,"Die Neilsche Parabel — Lagrange versagt")}</td><td class="cond">\(\operatorname{rg}< n\)</td></tr>
<tr><td><b>Kandidat ohne Nebenbedingung.</b> Ein Punkt, der (1) löst, aber nicht auf \(F=\mathbf{0}_n\) liegt, ist keiner.</td></tr>
<tr><td><b>Existenz nicht vergessen.</b> Ohne Kompaktheit der zulässigen Menge ist nicht garantiert, dass Extrema überhaupt angenommen werden; dann braucht es ein zusätzliches Argument (Abschätzung, Verhalten im Unendlichen).</td><td class="cond">\(K\) nicht kompakt</td></tr>
<tr><td><b>\(\lambda\) ist keine Antwort.</b> Der Multiplikator ist Hilfsvariable, nicht Ergebnis — er gehört in die Rechnung, nicht in den Antwortsatz.</td></tr>
</table>
</div>
</div>

<div class="refblock">
<h3>Alles auf einen Blick</h3>
<table class="reftable">
<tr><td><b>Frei, abstrakt.</b> \(f'(x^*)=0\) \(\rightarrow\) \(f''(x^*)h^2\) definit? \(\rightarrow\) Min / Max / Sattel / keine Aussage.</td><td class="cond"><a href="#/7.9.1">7.9.1</a>–<a href="#/7.9.3">7.9.3</a></td></tr>
<tr><td><b>Frei, im \(\mathbb{R}^m\).</b> \(\nabla f\big|_{x=x^*}=\mathbf{0}_m\) \(\rightarrow\) Eigenwerte von \(H_{x^*}(f)\) (für \(m=2\): \(\det H\), \(\operatorname{Tr}H\)) \(\rightarrow\) Fall 1/2/3 oder keine Aussage.</td><td class="cond"><a href="#/7.9.4">7.9.4</a></td></tr>
<tr><td><b>Mit Nebenbedingungen.</b> Rangprobe \(\rightarrow\) \(\mathcal{L}=f-\sum_\ell\lambda_\ell F_\ell\) \(\rightarrow\) \(k+n\) Gleichungen \(\rightarrow\) Kandidaten \(+\) Rangabfallpunkte \(\rightarrow\) Werte vergleichen.</td><td class="cond"><a href="#/7.12.1">7.12.1</a>–<a href="#/7.12.4">7.12.4</a></td></tr>
<tr><td><b>Woher die Werkzeuge stammen.</b> Der quadratische Term ist der \(k=2\)-Term der Taylorformel (<a href="#/7.8.2">7.8.2</a>, <a href="#/ref/entwickeln">Entwickeln</a>), das Auflösen der Nebenbedingung leistet der Satz über implizite Funktionen (<a href="#/ref/implizit">Implizite Funktionen</a>); die eindimensionalen Vorbilder stehen auf <a href="#/ref/diffrechnung">Differentialrechnung</a>, die Satzübersicht auf <a href="#/ref/saetze">Sätze</a>.</td></tr>
