        erfuellt: String.raw`<p>\(f(x)=\sum_{k=1}^{+\infty}\frac{\sin(kx)}{k^{2}}\): alle Partialsummen stetig, Konvergenz gleichmäßig (M-Test mit \(C_k=\frac{1}{k^{2}}\), 6.4.2) ⇒ \(f\) ist stetig auf ganz \(\mathbb R\) — ohne \(f\) zu kennen.</p>`,
        verletzt: String.raw`<p>\(f_n(x)=x^{n}\) auf \([0,1]\): alle \(f_n\) stetig, Grenzfunktion</p>\[f(x)=\begin{cases}0,&0\le x<1\\ 1,&x=1\end{cases}\]<p><b>unstetig</b> ⇒ (Kontraposition) die Konvergenz war nicht gleichmäßig.</p>`,
        plus: String.raw`<p>Nur eine Richtung! Aus „Grenzfunktion stetig" folgt <b>nicht</b> Gleichmäßigkeit (Spike-Beispiel: Grenzfunktion \(0\) stetig, Konvergenz trotzdem nicht glm.).</p>`}}]},
    {id:"6.4",  t:"Vertauschen von Σ und lim", topics:[
       {id:"6.4.1", title:"Gleichmäßige Konvergenz von Funktionenreihen", body:{
        def: String.raw`Die Funktionenreihe \(\sum_{k=1}^{+\infty}a_k(x)\) konvergiert <b>gleichmäßig</b> auf \(X\), wenn ihre Partialsummen \(S_m(x)=\sum_{k=1}^{m}a_k(x)\rightrightarrows S(x)\). <b>Satz (Tafel V19):</b> sind zusätzlich alle \(a_k\) stetig in \(\xi\in\mathrm{acc}(X)\), so gilt\[\lim_{x\to\xi}\ \sum_{k=1}^{+\infty}a_k(x)\ =\ \sum_{k=1}^{+\infty}\ \lim_{x\to\xi}a_k(x)\]— Grenzwert und Summe dürfen getauscht werden; \(S\) ist stetig.`,
        worte: String.raw`<p>Eine Reihe von Funktionen ist die Folge ihrer Partialsummen — „gleichmäßig konvergente Reihe" heißt also nichts Neues, sondern: die <b>Folge</b> \(S_m\) konvergiert gleichmäßig. Dann vererbt 6.3 alle guten Eigenschaften (Stetigkeit, Vertauschen) von den endlichen Summen auf die Reihe. Beweisidee: endliche Linearität des Grenzwerts + Grenzübergang \(m\to\infty\).</p>`,
        erfuellt: String.raw`<p>Geometrische Reihe auf \([-q,q]\) mit festem \(q<1\): \(|x^{k}|\le q^{k}\), \(\sum q^{k}<\infty\) ⇒ gleichmäßig (M-Test). Also darf man z. B. \(\lim_{x\to\xi}\sum x^{k}=\sum\xi^{k}=\frac{1}{1-\xi}\) für \(|\xi|\le q\) direkt tauschen.</p>`,
        verletzt: String.raw`<p>Dieselbe Reihe auf ganz \(\left]-1,1\right[\): <b>nicht</b> gleichmäßig, denn</p>\[\sup_{|x|<1}\Big|\sum_{k=m+1}^{+\infty}x^{k}\Big|=\sup_{|x|<1}\frac{|x|^{m+1}}{1-|x|}=+\infty\]<p>(Restglied explodiert nahe \(1\)). Auf jedem kompakten Teilintervall aber schon — „lokal gleichmäßig".</p>`,
        plus: String.raw`<p>Das Muster „glm. auf jedem Kompaktum in \(\left]x_0-R,x_0+R\right[\)" ist der Normalfall bei Potenzreihen (6.10) — für Stetigkeit/Integrieren im Innern reicht das völlig.</p>`}},
       {id:"6.4.2", title:"Majorantenkriterium von Weierstraß (M-Test)", body:{
        def: String.raw`<b>Satz (Tafel V19):</b> \(a:\mathbb N\times X\to Y\), \(Y\) Banachraum. Gibt es Konstanten \(C_k\) mit\[\|a_k(x)\|\le C_k\ \ \forall x\in X\qquad\text{und}\qquad \sum_{k=1}^{+\infty}C_k<+\infty,\]so konvergiert \(\sum_{k=1}^{+\infty}a_k(x)\) <b>absolut und gleichmäßig</b> auf \(X\).`,
        worte: String.raw`<p>Eine \(x\)-freie summierbare „Deckel-Folge" \(C_k\) erledigt alles auf einmal: das Cauchy-Restglied \(\big\|\sum_{n+1}^{m}a_k(x)\big\|\le\sum_{n+1}^{m}C_k\) wird klein — <b>gleichzeitig für alle \(x\)</b>. Das ist DER Standardweg, gleichmäßige Konvergenz von Reihen zu zeigen.</p>`,
        erfuellt: String.raw`<p>\(\displaystyle\sum_{k=1}^{+\infty}\frac{\sin(kx)}{k^{2}}\) auf \(\mathbb R\) (Tafel-Beispiel \(\sum\alpha_k\sin(kx)\)):</p>\[\Big\|\frac{\sin(kx)}{k^{2}}\Big\|\le\frac{1}{k^{2}}=C_k,\qquad\sum C_k<\infty\]<p>⇒ absolut & gleichmäßig auf ganz \(\mathbb R\); Summe stetig.</p>`,
        verletzt: String.raw`<p>\(\sum x^{k}\) auf \(\left]-1,1\right[\): die beste \(x\)-freie Schranke ist \(C_k=\sup_{|x|<1}|x|^{k}=1\), und \(\sum1=+\infty\) — M-Test <b>nicht anwendbar</b>; die Reihe ist dort tatsächlich nicht gleichmäßig konvergent (6.4.1).</p>`,
        plus: String.raw`<p>Der M-Test ist hinreichend, nicht notwendig: es gibt gleichmäßig konvergente Reihen ohne summierbare Majorante (z. B. \(\sum\frac{(-1)^{k}}{k+x^{2}}\), Leibniz gleichmäßig). Notation der Vorlesung: \(C_k\) statt \(M_k\).</p>`}}]},
    {id:"6.5",  t:"Doppelte Grenzwerte limₓ, limᵧ", topics:[], body:{
        def: String.raw`<b>Satz (Tafel V19):</b> \(X\subset M_1\), \(Y\subset M_2\), \(M_3\) vollständig, \(f:X\times Y\to M_3\), \(\xi\in\mathrm{acc}(X)\), \(\eta\in\mathrm{acc}(Y)\). Es gelte\[(1)\ \lim_{y\to\eta}f(x,y)=\varphi(x)\ \ \forall x\in X\qquad(2)\ \lim_{x\to\xi}f(x,y)=\psi(y)\ \ \forall y\in Y,\]wobei <b>einer</b> der beiden Grenzwerte gleichmäßig angenommen wird. Dann existieren beide iterierten Limites und\[\lim_{x\to\xi}\varphi(x)\ =\ \lim_{y\to\eta}\psi(y)\qquad\text{d.h.}\qquad \lim_{x\to\xi}\lim_{y\to\eta}f(x,y)=\lim_{y\to\eta}\lim_{x\to\xi}f(x,y).\]`,
        worte: String.raw`<p>Das \(n\)-\(x\)-Vertauschen (6.3) mit zwei kontinuierlichen Variablen: erst \(y\), dann \(x\) — oder umgekehrt? Ohne Zusatzbedingung können die Reihenfolgen verschiedene Ergebnisse liefern. Ist eine der beiden Konvergenzen <b>gleichmäßig</b> (im \(\varepsilon\)-\(\delta\)-Sinn unabhängig von der anderen Variablen), stimmen beide überein. Beweis über Folgendefinition: \(a_{j,k}=f(x_j,y_k)\) führt alles auf 6.3 zurück (Tafel).</p>`,
        verletzt: String.raw`<p>Der Klassiker \(f(x,y)=\dfrac{x^{2}}{x^{2}+y^{2}}\) bei \((\xi,\eta)=(0,0)\):</p>\[\lim_{x\to0}\lim_{y\to0}f=\lim_{x\to0}\frac{x^{2}}{x^{2}}=1,\qquad \lim_{y\to0}\lim_{x\to0}f=\lim_{y\to0}\,0=0\]<p>— verschiedene Werte, also war <b>keine</b> der Konvergenzen gleichmäßig.</p>`,
        erfuellt: String.raw`<p>\(f(x,y)=x+y\) bei \((0,0)\): \(\lim_{y\to0}f=x\) gleichmäßig in \(x\) (Fehler \(|y|\) hängt nicht von \(x\) ab) ⇒ beide iterierten Limites existieren und sind \(=0\). ✓</p>`,
        plus: String.raw`<p>Dieses Schema steckt hinter vielen „darf ich vertauschen?"-Fragen: Doppelfolgen \(a_{j,k}\), \(\lim\)–\(\int\), \(\partial\)-Ableitungen von Parameterintegralen. Immer fragen: <b>welcher der beiden Prozesse läuft gleichmäßig?</b></p>`}},
    {id:"6.6",  t:"Vertauschen von Grenzwert und Integral", topics:[
       {id:"6.6.1", title:"Gleichmäßige Konvergenz und ∫ auf [a,b]", body:{
        def: String.raw`<b>Satz (Tafel V19):</b> \(f_n\in C([a,b],\mathbb K^{d})\) (oder \(f_n\in R[a,b]\)) und \(f_n\rightrightarrows f\) auf \([a,b]\). Dann existiert\[\lim_{n\to\infty}\int_a^{b}f_n(x)\,dx\ =\ \int_a^{b}f(x)\,dx.\]`,
        worte: String.raw`<p>Der Beweis ist eine Zeile Dreiecksungleichung:\[\Big\|\int_a^b f_n-\int_a^b f\Big\|\le\int_a^b\|f_n-f\|\,dx\le (b-a)\,\|f_n-f\|_C\ \to\ 0.\]Der maximale Fehler mal Intervalllänge kontrolliert den Flächenfehler — deshalb braucht es die <b>gleichmäßige</b> Schranke und ein <b>endliches</b> Intervall.</p>`,
        erfuellt: String.raw`<p>\(f_n(x)=\frac{\sin(nx)}{n}\rightrightarrows0\) auf \([0,\pi]\) (\(M_n=\frac1n\)):</p>\[\int_0^{\pi}\frac{\sin(nx)}{n}dx=\frac{1-\cos(n\pi)}{n^{2}}\ \longrightarrow\ 0=\int_0^{\pi}0\,dx.\ \checkmark\]`,
        verletzt: String.raw`<p>Spike \(f_n=n\) auf \(\left]0,\tfrac1n\right[\), sonst \(0\): nur punktweise \(f_n\to0\), und</p>\[\int_0^{1}f_n\,dx=1\ \neq\ 0=\int_0^{1}\lim_n f_n\,dx\]<p>— die Fläche flieht in den Turm. Ohne Gleichmäßigkeit kein Tausch.</p>`,
        plus: String.raw`<p>Für <b>Ableitungen</b> ist es subtiler: man braucht \(f_n'\rightrightarrows\) (nicht \(f_n\)!) plus Konvergenz in einem Punkt — Ableiten verstärkt Fehler, Integrieren glättet sie.</p>`}},
       {id:"6.6.2", title:"Gliedweise Integration von Reihen", body:{
        def: String.raw`<b>Satz (Tafel V19):</b> \(a_k\in C([a,b],\mathbb K^{d})\) und \(S(x)=\sum_{k=1}^{+\infty}a_k(x)\) konvergiere <b>gleichmäßig</b> bzgl. \(x\in[a,b]\). Dann\[\int_a^{b}\Big(\sum_{k=1}^{+\infty}a_k(x)\Big)dx\ =\ \sum_{k=1}^{+\infty}\int_a^{b}a_k(x)\,dx.\]`,
        worte: String.raw`<p>6.6.1, angewandt auf die Partialsummen: \(\int S_m=\sum_{k\le m}\int a_k\) (endliche Linearität), und \(S_m\rightrightarrows S\) erlaubt den Grenzübergang links. Kurz: bei gleichmäßiger Konvergenz darf man <b>Summe und Integral tauschen</b>.</p>`,
        beispiel: String.raw`<p>Geometrische Reihe auf \([0,q]\), \(q<1\) (glm. per M-Test):</p>\[\int_0^{q}\frac{dx}{1-x}=\sum_{k=0}^{+\infty}\int_0^{q}x^{k}dx=\sum_{k=0}^{+\infty}\frac{q^{k+1}}{k+1}\ \Rightarrow\ -\ln(1-q)=\sum_{k=1}^{+\infty}\frac{q^{k}}{k}\]<p>— die \(\ln\)-Reihe, gratis durch gliedweises Integrieren. (Tafel-Anwendung: Orthogonalitäts-Rechnung \(A_m=\sum\alpha_k\int\sin(kx)\sin(mx)\,dx\) bei Fourierreihen.)</p>`,
        plus: String.raw`<p>Genauso entsteht \(\arctan x=\sum\frac{(-1)^{k}}{2k+1}x^{2k+1}\) aus \(\frac{1}{1+x^{2}}=\sum(-1)^{k}x^{2k}\). Bei Potenzreihen ist gliedweises Integrieren im Innern des Konvergenzkreises immer erlaubt (6.10.2).</p>`}}]},
    {id:"6.7",  t:"Parameterintegrale", topics:[], body:{
        def: String.raw`<b>Satz (Tafel V20):</b> Sei \(\Omega=[\alpha,\beta]\times[a,b]\subset\mathbb R^{2}\) und \(f\in C(\Omega,\mathbb K^{d})\). Dann ist\[I(x)\ :=\ \int_a^{b}f(x,y)\,dy\qquad\textbf{stetig auf }[\alpha,\beta].\]`,
        worte: String.raw`<p>Ein Integral, dessen Integrand von einem Parameter \(x\) abhängt, definiert eine neue Funktion \(I(x)\) — und die erbt Stetigkeit. Kern des Beweises (Tafel): \(f\) ist auf dem <b>Kompaktum</b> \(\Omega\) automatisch <b>gleichmäßig stetig</b>; also gilt \(f(x,y)\to f(\xi,y)\) für \(x\to\xi\) <b>gleichmäßig in \(y\)</b>, und 6.6.1 erlaubt den Tausch von \(\lim_{x\to\xi}\) und \(\int_a^b\).</p>`,
        beispiel: String.raw`<p>\(I(x)=\displaystyle\int_0^{1}e^{xy}\,dy\): für \(x\neq0\) ist \(I(x)=\frac{e^{x}-1}{x}\), und \(I(0)=1\). Der Satz garantiert Stetigkeit — tatsächlich:</p>\[\lim_{x\to0}\frac{e^{x}-1}{x}=1=I(0)\ \checkmark\]<p>(der Standardgrenzwert aus dem Spickzettel).</p>`,
        plus: String.raw`<p>Nächste Stufe: <b>Differenzieren unter dem Integral</b> — ist auch \(\partial f/\partial x\) stetig auf \(\Omega\), gilt \(I'(x)=\int_a^b \frac{\partial f}{\partial x}(x,y)\,dy\) (Leibniz-Regel, siehe Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>).</p>`}},
    {id:"6.9",  t:"Grenzwerte und uneigentliche Integrale", topics:[], body:{
        def: String.raw`<b>Satz (Tafel V21):</b> \(f_n:[A,+\infty[\,\to\mathbb K^{d}\) stetig, mit\[(1)\ \lim_{R\to+\infty}\int_A^{R}f_n=\int_A^{+\infty}f_n\ \ \text{gleichmäßig bzgl. }n\quad\Big(\forall\varepsilon\ \exists R_\varepsilon\ \forall n\ \forall R\ge R_\varepsilon:\ \big\|{\textstyle\int_A^{R}f_n-\int_A^{+\infty}f_n}\big\|<\varepsilon\Big)\]\[(2)\ f_n\rightrightarrows f\ \text{auf jedem festen }[A,R].\]Dann existiert \(\displaystyle\lim_{n\to\infty}\int_A^{+\infty}f_n=\int_A^{+\infty}f\).`,
        worte: String.raw`<p>Beim unendlichen Intervall reicht „gleichmäßig auf Kompakta" <b>nicht</b> — die Masse könnte nach \(+\infty\) entwischen. Bedingung (1) verbietet genau das: die „Schwänze" \(\int_R^{+\infty}f_n\) müssen <b>gleichmäßig in \(n\)</b> klein sein. Dann: Doppel-Grenzwert-Schema (6.5) mit den Variablen \(n\) und \(R\).</p>`,
        verletzt: String.raw`<p>Wandernde Masse: \(f_n=\frac1n\) auf \([0,n]\), sonst \(0\) (geglättet): sogar \(f_n\rightrightarrows0\) auf ganz \([0,+\infty[\) (\(M_n=\frac1n\)), aber</p>\[\int_0^{+\infty}f_n\,dx=\frac1n\cdot n=1\ \neq\ 0=\int_0^{+\infty}0\,dx\]<p>— Bedingung (1) ist verletzt: \(\int_R^{+\infty}f_n=\frac{n-R}{n}\to1\) für \(n\gg R\).</p>`,
        erfuellt: String.raw`<p>\(f_n(x)=e^{-x}\big(1+\tfrac{\sin x}{n}\big)\): (2) klar (\(M_n\le\frac1n\sup e^{-x}\)), (1): \(\big\|\int_R^{+\infty}f_n\big\|\le2e^{-R}\) unabhängig von \(n\) ⇒</p>\[\lim_n\int_0^{+\infty}f_n=\int_0^{+\infty}e^{-x}dx=1.\ \checkmark\]`,
        plus: String.raw`<p>Merkregel: unendliches Intervall = <b>zwei</b> Grenzprozesse (\(n\to\infty\) und \(R\to+\infty\)) — einer davon muss gleichmäßig laufen. Das Spike- und das Wander-Beispiel sind die zwei Arten, wie Fläche „verloren geht".</p>`}},
    {id:"6.10", t:"Potenzreihen", topics:[
       {id:"6.10.1", title:"Konvergenzradius (Cauchy-Hadamard)", body:{
        def: String.raw`Für die Potenzreihe \(S(z)=\sum_{k=0}^{+\infty}a_k(z-z_0)^{k}\) (\(z,z_0,a_k\in\mathbb C\)) definiert (Tafel V22)\[\frac{1}{R}\ =\ \limsup_{k\to\infty}\ \sqrt[k]{|a_k|}\qquad(\tfrac10:=\infty,\ \tfrac{1}{\infty}:=0)\]den <b>Konvergenzradius</b>: \(S\) konvergiert <b>absolut</b> im Inneren des Konvergenzkreises \(U_R(z_0)=\{|z-z_0|< R\}\) und divergiert für \(|z-z_0|>R\).`,
        worte: String.raw`<p>Wurzelkriterium auf \(|a_k||z-z_0|^{k}\) angewandt: \(\limsup\sqrt[k]{\cdot}=\frac{|z-z_0|}{R}\) — kleiner 1 innen, größer 1 außen. Auf dem <b>Rand</b> \(|z-z_0|=R\) sagt der Satz nichts: dort muss man jeden Punkt einzeln prüfen. Auf jedem kompakten Teilkreis \(|z-z_0|\le r< R\) ist die Konvergenz gleichmäßig (M-Test mit \(C_k=|a_k|r^{k}\)).</p>`,
        erfuellt: String.raw`<p>\(\displaystyle\sum_{k=0}^{+\infty}\frac{z^{k}}{k!}\): Quotienten-Form \(R=\lim\big|\frac{a_k}{a_{k+1}}\big|=\lim(k+1)=\infty\) — konvergiert in ganz \(\mathbb C\) (das ist \(e^{z}\)).</p>`,
        verletzt: String.raw`<p>\(\displaystyle\sum_{k=0}^{+\infty}k!\,z^{k}\): \(\sqrt[k]{k!}\sim\frac ke\to\infty\) ⇒ \(R=0\) — konvergiert <b>nur</b> in \(z=0\). Und Randverhalten ist individuell: \(\sum\frac{z^{k}}{k}\) hat \(R=1\), divergiert bei \(z=1\), konvergiert bei \(z=-1\).</p>`,
        plus: String.raw`<p>Radius-Tricks (Lücken-Reihen, \(u=z^{2}\)-Substitution, nützliche \(k\)-te Wurzeln): Spickzettel <a href="#/ref/potenzreihen">Potenzreihen</a>. Cauchy-Hadamard funktioniert <b>immer</b> — der limsup existiert stets.</p>`}},
       {id:"6.10.2", title:"Termweise Differentiation & Integration", body:{
        def: String.raw`<b>Satz (Tafel V22):</b> \(S(z)=\sum_{k=0}^{+\infty}a_k(z-z_0)^{k}\) ist im Inneren des Konvergenzkreises <b>termweise (komplex) differenzierbar</b>:\[S'(z)=\sum_{k=1}^{+\infty}k\,a_k\,(z-z_0)^{k-1},\]und die Reihe der Ableitungen hat <b>denselben Konvergenzradius</b> \(R\) (ebenso beim gliedweisen Integrieren).`,
        worte: String.raw`<p>Im Konvergenzkreis darf man mit Potenzreihen wie mit Polynomen umgehen: Glied für Glied ableiten und integrieren, beliebig oft — der Radius ändert sich nicht, weil \(\sqrt[k]{k}\to1\) den limsup nicht verschiebt. Folge: \(S\) ist innen beliebig oft differenzierbar und \(a_k=\frac{S^{(k)}(z_0)}{k!}\) (die Potenzreihe ist ihre eigene Taylorreihe).</p>`,
        beispiel: String.raw`<p>Geometrische Reihe \(\frac{1}{1-z}=\sum_{k\ge0}z^{k}\) (\(R=1\)) termweise ableiten:</p>\[\frac{1}{(1-z)^{2}}=\sum_{k=1}^{+\infty}k\,z^{k-1}=\sum_{k=0}^{+\infty}(k+1)\,z^{k},\qquad |z|<1\]<p>— dieselbe Formel, die bei der Abel-Summation von \(1-2+3-\cdots\) (5.6.4) benutzt wird.</p>`,
        plus: String.raw`<p>Der Beweis (Tafel) läuft über die Abschätzung \(\big|\frac{z^{k}-z'^{k}}{z-z'}\big|\le k\,r^{k-1}\) für \(|z|,|z'|\le r< R\) + Majorantenkriterium. Das ist der Einstieg in die Funktionentheorie: Potenzreihen = holomorphe Funktionen.</p>`}}]}
   ]},
 { id:"7", title:"Differentiation von Funktionen mehrerer Veränderlicher", key:"ch7",
   sections:[
    {id:"7.1", t:"Normierte Räume", topics:[
       {id:"7.1.1", title:"Norm und normierter Raum", body:{
        def: String.raw`<p>Sei \(E\) ein Vektorraum über \(\mathbb{K}\) (also \(\mathbb{K}=\mathbb{R}\) oder \(\mathbb{K}=\mathbb{C}\)), d.h. es sind Verknüpfungen</p>\[+:E\times E\to E,\qquad \cdot:\mathbb{K}\times E\to E\]<p>mit den entsprechenden Axiomen gegeben; \(\mathbf{0}_E\) bezeichnet den <b>Nullvektor</b>, das neutrale Element bezüglich „+“.</p><p>Eine Abbildung \(\|\cdot\|:E\to\mathbb{R}\) nennen wir <b>Norm auf \(E\)</b>, falls</p>\[\text{(1)}\quad \|x\|\ge 0,\ \ x\in E,\qquad \|x\|=0\ \Longleftrightarrow\ x=\mathbf{0}_E\]\[\text{(2)}\quad \|\alpha x\|=|\alpha|\cdot\|x\|,\qquad \alpha\in\mathbb{K},\ x\in E\]\[\text{(3)}\quad \|x+y\|\le\|x\|+\|y\|,\qquad x,y\in E.\]<p>Das Paar \((E,\|\cdot\|)\) heißt <b>normierter Raum</b>. Durch</p>\[d(x,y)=\|x-y\|\]<p>wird auf \(E\) eine <b>Metrik</b> erklärt.</p>`,
        worte: String.raw`<p>Eine Norm ist nichts anderes als ein Längenbegriff auf einem Vektorraum: \(\|x\|\) misst, „wie groß“ der Vektor \(x\) ist. Die drei Axiome sind genau das, was man von einer Länge erwartet.</p><p>(1) ist die <b>Definitheit</b>: Längen sind nie negativ, und nur der Nullvektor hat Länge null. Das ist das empfindlichste Axiom — an ihm scheitern die meisten Kandidaten (siehe „Verletzt“). Erfüllt eine Abbildung nur (2) und (3) sowie \(\|x\|\ge0\), so spricht man von einer <i>Halbnorm</i>.</p><p>(2) ist die <b>absolute Homogenität</b>: Streckt man einen Vektor um den Faktor \(\alpha\), so streckt sich seine Länge um \(|\alpha|\). Insbesondere ist \(\|-x\|=\|x\|\) und \(\|\mathbf{0}_E\|=\|0\cdot x\|=0\).</p><p>(3) ist die <b>Dreiecksungleichung</b>: der Umweg über einen dritten Punkt ist nie kürzer als der direkte Weg.</p><p>Der entscheidende Punkt für die ganze restliche Vorlesung: Sobald man \(d(x,y)=\|x-y\|\) setzt, ist \((E,d)\) ein metrischer Raum — und damit stehen alle Begriffe aus Analysis 1 (Konvergenz, Cauchy-Folge, Stetigkeit, offen, abgeschlossen, Umgebung \(U_\varepsilon(x_0)\)) sofort zur Verfügung, ohne dass irgendetwas neu bewiesen werden müsste. Man rechnet nur nach: Positivität und Definitheit von \(d\) folgen aus (1), die Symmetrie \(d(x,y)=\|x-y\|=\|-(y-x)\|=\|y-x\|=d(y,x)\) aus (2), und die Dreiecksungleichung \(d(x,z)\le d(x,y)+d(y,z)\) aus (3) angewandt auf \(x-z=(x-y)+(y-z)\).</p><p>Eine Norm ist also mehr als eine Metrik: sie ist mit der Vektorraumstruktur verträglich (translationsinvariant und homogen). Genau das macht sie zum richtigen Werkzeug für die Differentialrechnung, wo man Zuwächse \(h\) skalieren und addieren muss.</p>`,
        erfuellt: String.raw`<p><b>Die Betragssummennorm \(\|\cdot\|_1\) auf \(\mathbb{K}^d\) ist eine Norm.</b> Für \(x=(x_1,\dots,x_d)\) sei \(\displaystyle\|x\|_1=\sum_{k=1}^{d}|x_k|\).</p><p><b>(1)</b> Als Summe von Beträgen ist \(\|x\|_1\ge 0\). Ist \(\|x\|_1=0\), so ist eine Summe nichtnegativer Zahlen null, also \(|x_k|=0\) für jedes \(k\), also \(x_k=0\) für alle \(k\), d.h. \(x=\mathbf{0}_d\). Umgekehrt ist \(\|\mathbf{0}_d\|_1=0\).</p><p><b>(2)</b> \(\displaystyle\|\alpha x\|_1=\sum_{k=1}^{d}|\alpha x_k|=\sum_{k=1}^{d}|\alpha|\,|x_k|=|\alpha|\sum_{k=1}^{d}|x_k|=|\alpha|\cdot\|x\|_1.\)</p><p><b>(3)</b> Aus der Dreiecksungleichung für den Betrag in \(\mathbb{K}\) folgt \(|x_k+y_k|\le|x_k|+|y_k|\); Summation über \(k\) liefert</p>\[\|x+y\|_1=\sum_{k=1}^{d}|x_k+y_k|\le\sum_{k=1}^{d}|x_k|+\sum_{k=1}^{d}|y_k|=\|x\|_1+\|y\|_1.\]<p><b>Zahlenprobe</b> in \(\mathbb{R}^3\) mit \(x=(3,-4,12)^{T}\), \(y=(1,1,-1)^{T}\):</p><p>\(\|x\|_1=3+4+12=19\), \(\|y\|_1=1+1+1=3\), \(x+y=(4,-3,11)^{T}\), also \(\|x+y\|_1=4+3+11=18\le 19+3=22\) — (3) bestätigt.<br>\(\|-2x\|_1=\|(-6,8,-24)^{T}\|_1=6+8+24=38=2\cdot 19=|-2|\cdot\|x\|_1\) — (2) bestätigt.</p>`,
        verletzt: String.raw`<p><b>Die \(L^1\)-Norm auf \(R[0,1]\) ist keine Norm</b> — genau das meint die Tafelnotiz „(gilt nicht auf \(R[0,1]\)!)“. Dabei ist \(R[0,1]\) der Raum der Riemann-integrierbaren Funktionen auf \([0,1]\) und</p>\[\|f\|_{L^1}=\int_0^1|f(x)|\,dx.\]<p>Die Axiome (2) und (3) gelten (Linearität und Monotonie des Integrals, \(|f+g|\le|f|+|g|\)). Die <b>Definitheit (1) scheitert</b>:</p><p>Wähle</p>\[f(x)=\begin{cases}1,& x=0\\ 0,& 0< x\le 1.\end{cases}\]<p><b>Schritt 1.</b> \(f\) ist beschränkt und nur in einem einzigen Punkt unstetig, also \(f\in R[0,1]\).</p><p><b>Schritt 2.</b> Jede Riemann-Zwischensumme zu einer Zerlegung der Feinheit \(\delta\) ist höchstens \(1\cdot\delta\), also \(\displaystyle\int_0^1|f(x)|\,dx=0\), d.h. \(\|f\|_{L^1}=0\).</p><p><b>Schritt 3.</b> Aber \(f\ne\mathbf{0}\), denn \(f(0)=1\). Also gibt es einen Vektor der „Länge“ \(0\), der nicht der Nullvektor ist: \(\|\cdot\|_{L^1}\) ist auf \(R[0,1]\) nur eine <i>Halbnorm</i>.</p><p><b>Warum es auf \(C([0,1])\) doch klappt.</b> Ist \(f\) stetig mit \(\int_0^1|f|=0\) und wäre \(|f(x_0)|=c>0\) für ein \(x_0\), so gäbe es wegen der Stetigkeit ein Teilintervall \(I\subset[0,1]\) der Länge \(\delta>0\) mit \(|f|\ge c/2\) auf \(I\), also \(\int_0^1|f|\ge \tfrac{c}{2}\delta>0\) — Widerspruch. Also ist \(f\equiv 0\), und \(\|\cdot\|_{L^1}\) ist auf \(C([0,1])\) tatsächlich eine Norm (siehe <a href="#/7.1.6">7.1.6</a>).</p>`,
        plus: String.raw`<p><b>Zur Notation.</b> Die Vorlesung schreibt den Nullvektor als eine <i>durchgestrichene Null</i> mit Raum-Index (analog zu \(\mathbb{R}\), \(\mathbb{K}\)), um ihn vom Skalar \(0\) zu unterscheiden. Da es dieses Zeichen im Formelsatz dieser Seite nicht gibt, schreiben wir durchgehend \(\mathbf{0}_E\), \(\mathbf{0}_F\), \(\mathbf{0}_d\) — gemeint ist immer die durchgestrichene Null der Tafel. Ebenso schreibt die Vorlesung die Identität als doppelt gestrichene Eins; hier steht dafür \(\mathbf{1}\).</p><p><b>Roter Faden.</b> Kapitel 7 will Differentialrechnung in mehreren Veränderlichen betreiben. Der Ableitungsbegriff \(f(x_0+h)=f(x_0)+f'(x_0)h+o(\|h\|)\) braucht nur zwei Dinge: eine Vektorraumstruktur (um \(x_0+h\) zu bilden) und einen Längenbegriff (um „klein von höherer Ordnung“ zu erklären). Genau deshalb steht der normierte Raum am Anfang — nicht der \(\mathbb{R}^m\). Alle Sätze gelten dann automatisch auch für Funktionenräume.</p><p><b>Klausurfalle.</b> Beim Nachweis „ist eine Norm“ zuerst (1) prüfen, und zwar beide Richtungen der Äquivalenz. Bei Integral- und Supremumsausdrücken entscheidet der zugrundeliegende Funktionenraum darüber, ob die Definitheit greift — dieselbe Formel kann auf \(C([0,1])\) eine Norm und auf \(R[0,1]\) keine sein. Vergleiche auch den Spickzettel <a href="#/ref/grenzwerte">Grenzwerte</a>.</p>`}},
       {id:"7.1.2", title:"Konvergenz; Stetigkeit von Norm und Vektorraum-Operationen", body:{
        def: String.raw`<p>Sei \((E,\|\cdot\|)\) ein normierter Raum, \((x_n)_{n\in\mathbb{N}}\) eine Folge mit \(x_n,y\in E\), \(n\in\mathbb{N}\).</p><p><b>Konvergenz.</b></p>\[x_n\xrightarrow[\ \|\cdot\|\ ]{\ n\to\infty\ }y\ \Longleftrightarrow\ \forall_{\varepsilon>0}\ \exists_{N_\varepsilon\in\mathbb{N}}\ \forall_{n\ge N_\varepsilon}:\ d(x_n,y)=\|x_n-y\|<\varepsilon\]\[\Longleftrightarrow\ d(x_n,y)\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }0\ \Longleftrightarrow\ \|x_n-y\|\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }0.\]<ul><li>Falls der Grenzwert existiert, so ist er eindeutig bestimmt.</li><li>Jede konvergente Folge ist beschränkt.</li></ul><p><b>Stetigkeit der Vektorraum-Operationen.</b> Seien \(x_n,y_n,x,y\in E\) und \(\alpha_n,\alpha\in\mathbb{K}\) mit</p>\[x_n\xrightarrow[\ \|\cdot\|\ ]{\ n\to\infty\ }x,\qquad y_n\xrightarrow[\ \|\cdot\|\ ]{\ n\to\infty\ }y,\qquad \alpha_n\xrightarrow[\ |\cdot|\ ]{\ n\to\infty\ }\alpha.\]<p>Dann folgt</p>\[x_n+y_n\xrightarrow[\ \|\cdot\|\ ]{\ n\to\infty\ }x+y,\qquad \alpha_n\cdot x_n\xrightarrow[\ \|\cdot\|\ ]{\ n\to\infty\ }\alpha\cdot x.\]<p><b>Stetigkeit der Norm.</b></p>\[\big|\,\|x\|-\|y\|\,\big|\le\|x-y\|\qquad\text{für alle }x,y\in E.\]<p>Aus \(x_n\to x\) in \(\|\cdot\|\) folgt daher \(0\le\big|\,\|x_n\|-\|x\|\,\big|\le\|x_n-x\|\to 0\), also</p>\[\|x_n\|\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }\|x\|.\]<p><b>Anmerkung.</b> \(x_n\to\mathbf{0}_E\) bezüglich \(\|\cdot\|\) \(\iff\) \(\|x_n\|\to 0\) in \(\mathbb{R}\).</p>`,
        worte: String.raw`<p>Konvergenz in einem normierten Raum wird auf Konvergenz einer <i>reellen Zahlenfolge</i> zurückgespielt: \(x_n\to y\) heißt schlicht, dass die Zahlenfolge \(\|x_n-y\|\) gegen \(0\) geht. Man muss also nie etwas Neues können — man muss nur den richtigen Abstand ausrechnen.</p><p>Die <b>Stetigkeit der Norm</b> ist die <i>umgekehrte Dreiecksungleichung</i>, und sie folgt in zwei Zeilen aus Axiom (3): Aus \(x=(x-y)+y\) folgt \(\|x\|\le\|x-y\|+\|y\|\), also \(\|x\|-\|y\|\le\|x-y\|\). Vertauscht man die Rollen von \(x\) und \(y\), so folgt \(\|y\|-\|x\|\le\|y-x\|=\|x-y\|\). Beides zusammen ergibt die Betragsabschätzung. Praktisch bedeutet sie: <i>man darf die Norm in den Limes hineinziehen</i>, \(\lim\|x_n\|=\|\lim x_n\|\).</p><p>Die <b>Stetigkeit der Vektorraum-Operationen</b> sagt: Addition und Skalarmultiplikation vertragen sich mit Grenzübergängen. Für die Addition rechnet man</p>\[\|(x_n+y_n)-(x+y)\|\le\|x_n-x\|+\|y_n-y\|\to 0,\]<p>für die Skalarmultiplikation mit dem üblichen Nulltrick</p>\[\|\alpha_nx_n-\alpha x\|=\|\alpha_n(x_n-x)+(\alpha_n-\alpha)x\|\le|\alpha_n|\,\|x_n-x\|+|\alpha_n-\alpha|\,\|x\|\to 0,\]<p>wobei \(|\alpha_n|\) beschränkt ist, weil \((\alpha_n)\) konvergiert. Genau an dieser Stelle wird die Bemerkung „jede konvergente Folge ist beschränkt“ gebraucht.</p><p>Der wichtigste Merksatz: <b>Konvergenz ist keine Eigenschaft der Folge allein, sondern des Paares (Folge, Norm).</b> Dieselbe Folge kann bezüglich einer Norm gegen \(\mathbf{0}_E\) laufen und bezüglich einer anderen konstanten Abstand \(1\) halten (siehe „Verletzt“). In \(\mathbb{K}^d\) ist das harmlos, weil dort alle Normen äquivalent sind (<a href="#/7.1.3">7.1.3</a>); in Funktionenräumen ist es der Normalfall.</p>`,
        erfuellt: String.raw`<p><b>Konvergenz in \((\mathbb{R}^2,\|\cdot\|_2)\).</b> Sei</p>\[x_n=\begin{pmatrix}\dfrac{n+1}{n}\\[4pt] 2-\dfrac{3}{n^2}\end{pmatrix},\qquad x=\begin{pmatrix}1\\2\end{pmatrix}.\]<p><b>Schritt 1 (Konvergenz).</b> Es ist \(x_n-x=\big(\tfrac1n,\,-\tfrac{3}{n^2}\big)^{T}\), also</p>\[\|x_n-x\|_2=\sqrt{\frac{1}{n^2}+\frac{9}{n^4}}\le\sqrt{\frac{1}{n^2}+\frac{9}{n^2}}=\frac{\sqrt{10}}{n}\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }0.\]<p>Zu \(\varepsilon>0\) leistet \(N_\varepsilon=\lceil\sqrt{10}/\varepsilon\rceil+1\) das Gewünschte. Also \(x_n\to x\) bezüglich \(\|\cdot\|_2\).</p><p><b>Schritt 2 (Stetigkeit der Norm).</b> Ohne jede weitere Rechnung liefert die umgekehrte Dreiecksungleichung</p>\[\big|\,\|x_n\|_2-\|x\|_2\,\big|\le\|x_n-x\|_2\le\frac{\sqrt{10}}{n}\to 0,\]<p>also \(\|x_n\|_2\to\|x\|_2=\sqrt{1+4}=\sqrt5\approx 2{,}236\). Zur Kontrolle direkt: \(\|x_n\|_2=\sqrt{(1+\tfrac1n)^2+(2-\tfrac{3}{n^2})^2}\to\sqrt{1+4}=\sqrt5\).</p><p><b>Schritt 3 (Skalarmultiplikation).</b> Mit \(\alpha_n=1-\tfrac1n\to 1\) ist</p>\[\alpha_nx_n=\begin{pmatrix}\Big(1-\tfrac1n\Big)\Big(1+\tfrac1n\Big)\\[4pt] \Big(1-\tfrac1n\Big)\Big(2-\tfrac{3}{n^2}\Big)\end{pmatrix}=\begin{pmatrix}1-\tfrac{1}{n^2}\\[4pt] 2-\tfrac2n-\tfrac{3}{n^2}+\tfrac{3}{n^3}\end{pmatrix}\longrightarrow\begin{pmatrix}1\\2\end{pmatrix}=1\cdot x,\]<p>wie es die Stetigkeit der Vektorraum-Operationen vorhersagt.</p>`,
        verletzt: String.raw`<p><b>Keine Konvergenz gegen \(\mathbf{0}_C\) in \((C([0,1]),\|\cdot\|_C)\)</b> — das Tafelbeispiel mit den Dreieckspulsen.</p><p>Sei \(u_n\in C([0,1])\) der Dreieckspuls mit Träger \(\big[\tfrac{1}{2^{n+1}},\tfrac{1}{2^{n}}\big]\) und Höhe \(1\) (linear auf \(1\) hoch, linear zurück auf \(0\), außerhalb identisch \(0\)); vgl. <a href="#/7.1.6">7.1.6</a>.</p><p><b>Schritt 1 (punktweise passiert das Richtige).</b> Für festes \(x\in\left]0,1\right]\) gilt \(x>\tfrac{1}{2^n}\) für alle hinreichend großen \(n\), also \(u_n(x)=0\) ab einem Index; und \(u_n(0)=0\) für alle \(n\). Punktweise gilt also \(u_n(x)\to 0\).</p><p><b>Schritt 2 (in \(\|\cdot\|_C\) trotzdem keine Konvergenz).</b> Der Puls erreicht in seiner Spitze stets den Wert \(1\), also</p>\[\|u_n-\mathbf{0}_C\|_C=\|u_n\|_C=\max_{x\in[0,1]}|u_n(x)|=1\qquad\text{für alle }n.\]<p>Die Zahlenfolge \(\|u_n\|_C=1\) konvergiert nicht gegen \(0\); nach der Anmerkung gilt also <b>nicht</b> \(u_n\to\mathbf{0}_C\) bezüglich \(\|\cdot\|_C\). Wähle \(\varepsilon=\tfrac12\): kein \(N_\varepsilon\) leistet \(\|u_n-\mathbf{0}_C\|_C<\tfrac12\).</p><p><b>Schritt 3 (mit einer anderen Norm kippt das Ergebnis).</b> Die Grundseite des Dreiecks hat die Länge \(\tfrac{1}{2^{n}}-\tfrac{1}{2^{n+1}}=\tfrac{1}{2^{n+1}}\), die Höhe ist \(1\), also</p>\[\|u_n\|_{L^1}=\int_0^1|u_n(x)|\,dx=\frac12\cdot\frac{1}{2^{n+1}}\cdot 1=\frac{1}{2^{n+2}}\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }0,\]<p>d.h. bezüglich \(\|\cdot\|_{L^1}\) gilt sehr wohl \(u_n\to\mathbf{0}_C\). Ein und dieselbe Folge, zwei Normen, zwei verschiedene Antworten.</p>`,
        plus: String.raw`<p><b>Gut zu wissen.</b> Konvergenz bezüglich \(\|\cdot\|_C\) ist genau die gleichmäßige Konvergenz \(f_n\rightrightarrows f\) aus Kapitel 6; vgl. <a href="#/6.2.1">6.2.1</a> und den Spickzettel <a href="#/ref/grenzwerte">Grenzwerte</a>. Punktweise Konvergenz ist dagegen <i>keine</i> Konvergenz in einer Norm — Schritt 1 und Schritt 2 oben zeigen genau diesen Unterschied.</p><p><b>Klausurfalle.</b> Die Aussage „\(x_n\to x\)“ ist in einem unendlichdimensionalen Raum unvollständig, solange die Norm nicht dabeisteht. Deshalb schreibt die Vorlesung die Norm konsequent <i>unter</i> den Konvergenzpfeil und den Grenzübergang <i>über</i> den Pfeil.</p><p><b>Standardtrick.</b> Möchte man \(x_n\to x\) zeigen, schätzt man \(\|x_n-x\|\) durch eine explizite Nullfolge reeller Zahlen nach oben ab — man braucht die exakte Norm gar nicht, nur eine brauchbare obere Schranke. Möchte man \(x_n\to x\) <i>widerlegen</i>, gibt man umgekehrt ein festes \(\varepsilon>0\) und eine untere Schranke \(\|x_n-x\|\ge\varepsilon\) für unendlich viele \(n\) an.</p>`}},
       {id:"7.1.3", title:"Äquivalenz von Normen", body:{
        def: String.raw`<p><b>Definition.</b> Es seien \(\|\cdot\|_A\) und \(\|\cdot\|_B\) Normen auf dem Vektorraum \(E\). Wir nennen diese Normen <b>äquivalent</b>, falls Konstanten \(0< c,\ C<+\infty\) existieren, so dass</p>\[c\,\|x\|_A\ \le\ \|x\|_B\ \le\ C\,\|x\|_A,\qquad x\in E.\]<p><b>Anmerkung.</b> Für \(x_n,x\in E\) gilt dann</p>\[x_n\xrightarrow[\ \|\cdot\|_A\ ]{\ n\to\infty\ }x\quad\Longleftrightarrow\quad x_n\xrightarrow[\ \|\cdot\|_B\ ]{\ n\to\infty\ }x.\]<p><b>Satz.</b> Auf \(\mathbb{K}^d\), \(d\in\mathbb{N}\), sind beliebige zwei Normen immer äquivalent zueinander.</p><p><b>Wichtig:</b> Das gilt <b>nur</b> auf endlichdimensionalen Räumen!</p>`,
        worte: String.raw`<p>Zwei Normen sind äquivalent, wenn sie sich gegenseitig bis auf feste Faktoren kontrollieren. Bildlich: die Einheitskugel der einen Norm liegt zwischen zwei gestauchten Kopien der Einheitskugel der anderen. Die Zahlenwerte \(\|x\|_A\) und \(\|x\|_B\) dürfen sich unterscheiden — aber nie um mehr als einen festen Faktor, gleichmäßig in \(x\).</p><p>Die Anmerkung ist der Grund, warum der Begriff überhaupt eingeführt wird: Setzt man in die Definition \(x_n-x\) statt \(x\) ein, so folgt</p>\[c\,\|x_n-x\|_A\le\|x_n-x\|_B\le C\,\|x_n-x\|_A,\]<p>und weil \(c>0\) und \(C<\infty\) sind, geht die linke Seite genau dann gegen \(0\), wenn die rechte es tut. Äquivalente Normen erzeugen also <b>denselben Konvergenzbegriff</b> — und damit dieselben offenen Mengen, dieselben stetigen Funktionen, dieselben Cauchy-Folgen, dieselben kompakten Mengen. Für alles, was mit Konvergenz zu tun hat, darf man frei zwischen ihnen wechseln und diejenige nehmen, mit der man am bequemsten rechnet.</p><p>Der Satz ist eine der wichtigsten Aussagen des Abschnitts: In \(\mathbb{K}^d\) ist die Wahl der Norm völlig belanglos. Deshalb konnte man in Analysis 1 und in \(\mathbb{R}^m\) sorglos „\(x_n\to x\)“ schreiben, ohne die Norm anzugeben.</p><p><b>Beweisidee</b> (in zwei Schritten; Äquivalenz von Normen ist eine Äquivalenzrelation, es genügt also, jede Norm \(\|\cdot\|\) mit \(\|\cdot\|_\infty\) zu vergleichen):<br><b>1.</b> Obere Schranke: Mit der Standardbasis \(e_1,\dots,e_d\) ist \(x=\sum_k x_ke_k\), also \(\|x\|\le\sum_k|x_k|\,\|e_k\|\le\Big(\sum_k\|e_k\|\Big)\|x\|_\infty=:C\|x\|_\infty\). Daraus folgt insbesondere, dass \(x\mapsto\|x\|\) bezüglich \(\|\cdot\|_\infty\) stetig ist (umgekehrte Dreiecksungleichung).<br><b>2.</b> Untere Schranke: Die Menge \(S=\{x\in\mathbb{K}^d:\|x\|_\infty=1\}\) ist beschränkt und abgeschlossen, also kompakt. Die stetige Funktion \(x\mapsto\|x\|\) nimmt auf \(S\) ihr Minimum \(c\) an, und \(c>0\), weil \(\mathbf{0}_d\notin S\). Für beliebiges \(x\ne\mathbf{0}_d\) liefert die Homogenität mit \(x/\|x\|_\infty\in S\) dann \(\|x\|\ge c\,\|x\|_\infty\).<br>Genau Schritt 2 bricht in unendlicher Dimension zusammen: dort ist die Einheitssphäre nicht kompakt.</p>`,
        erfuellt: String.raw`<p><b>\(\|\cdot\|_1\) und \(\|\cdot\|_\infty\) sind auf \(\mathbb{K}^d\) äquivalent.</b> Sei \(x=(x_1,\dots,x_d)\).</p><p><b>Untere Schranke.</b> Jeder einzelne Summand ist höchstens so groß wie die ganze Summe:</p>\[\|x\|_\infty=\sup_{k=1,\dots,d}|x_k|\ \le\ \sum_{k=1}^{d}|x_k|=\|x\|_1.\]<p><b>Obere Schranke.</b> Jeder Summand ist höchstens das Maximum:</p>\[\|x\|_1=\sum_{k=1}^{d}|x_k|\ \le\ \sum_{k=1}^{d}\Big(\sup_{j=1,\dots,d}|x_j|\Big)=d\cdot\|x\|_\infty.\]<p>Zusammen also mit \(\|\cdot\|_A=\|\cdot\|_\infty\) und \(\|\cdot\|_B=\|\cdot\|_1\):</p>\[1\cdot\|x\|_\infty\ \le\ \|x\|_1\ \le\ d\cdot\|x\|_\infty,\qquad\text{d.h. }c=1,\ C=d.\]<p><b>Die Konstanten sind scharf.</b> Für \(x=e_1=(1,0,\dots,0)\) ist \(\|x\|_1=\|x\|_\infty=1\) (linke Ungleichung mit Gleichheit); für \(x=(1,1,\dots,1)\) ist \(\|x\|_1=d\) und \(\|x\|_\infty=1\) (rechte Ungleichung mit Gleichheit).</p><p><b>Ebenso für \(\|\cdot\|_2\):</b> Aus \(\|x\|_2^2=\sum_k|x_k|^2\ge\sup_k|x_k|^2=\|x\|_\infty^2\) und \(\|x\|_2^2\le d\cdot\sup_k|x_k|^2=d\,\|x\|_\infty^2\) folgt</p>\[\|x\|_\infty\le\|x\|_2\le\sqrt d\,\|x\|_\infty.\]<p><b>Konsequenz.</b> \(\|x_n-x\|_\infty\to 0\) bedeutet \(\sup_k|x_{n,k}-x_k|\to0\), also Konvergenz jeder einzelnen Komponente. Wegen der Äquivalenz gilt somit in \(\mathbb{K}^d\): Konvergenz bezüglich <i>irgendeiner</i> Norm ist dasselbe wie komponentenweise Konvergenz.</p>`,
        verletzt: String.raw`<p><b>Das Tafelgegenbeispiel: \(\|\cdot\|_1\) und \(\|\cdot\|_\infty\) sind auf \(\ell_1\) nicht äquivalent.</b></p><p>Betrachte die Folgen (jedes \(x^{(n)}\) ist selbst ein Vektor, nämlich eine abbrechende Zahlenfolge)</p>\[x^{(n)}=\big(\underbrace{\tfrac{1}{2^n},\ \dots,\ \tfrac{1}{2^n}}_{2^n\ \text{Einträge}},\ 0,\ \dots,\ 0,\ \dots\big),\qquad n\in\mathbb{N}.\]<p><b>Schritt 1.</b> Alle Einträge sind gleich, also</p>\[\|x^{(n)}\|_\infty=\sup_{k\in\mathbb{N}}|x^{(n)}_k|=\frac{1}{2^n}\xrightarrow[\ \mathbb{R}\ ]{\ n\to\infty\ }0,\]<p>d.h. \(x^{(n)}\to\mathbf{0}\) in \(\ell_\infty\).</p><p><b>Schritt 2.</b> Es sind genau \(2^n\) Einträge vom Betrag \(2^{-n}\), also</p>\[\|x^{(n)}\|_1=\sum_{k=1}^{\infty}|x^{(n)}_k|=2^n\cdot\frac{1}{2^n}=1\qquad\text{für alle }n.\]<p>Bezüglich \(\|\cdot\|_1\) hält die Folge also konstanten Abstand \(1\) zum Nullvektor: an der Tafel notiert als „\(x^{(n)}\to\mathbf{0}\) in \(\ell_\infty\); divergent in \(\ell_1\)“.</p><p><b>Schritt 3 (Widerspruch zur Äquivalenz).</b> Wären die beiden Normen äquivalent, so gäbe es ein festes \(c>0\) mit \(c\,\|x\|_1\le\|x\|_\infty\) für alle \(x\). Einsetzen von \(x^{(n)}\) liefert</p>\[c=c\cdot 1=c\,\|x^{(n)}\|_1\ \le\ \|x^{(n)}\|_\infty=\frac{1}{2^n}\xrightarrow{\ n\to\infty\ }0,\]<p>also \(c\le 0\) — im Widerspruch zu \(c>0\). Die eine Ungleichung \(\|x\|_\infty\le\|x\|_1\) gilt zwar weiterhin, die Gegenrichtung ist aber unrettbar: in \(\mathbb{K}^d\) war die Konstante \(d\), und \(d\) ist hier nicht mehr beschränkt.</p><p><b>Zweites Gegenbeispiel (Funktionenraum).</b> Auf \(C([0,1])\) sind \(\|\cdot\|_C\) und \(\|\cdot\|_{L^1}\) nicht äquivalent: für die Dreieckspulse aus <a href="#/7.1.6">7.1.6</a> ist \(\|u_n\|_C=1\), aber \(\|u_n\|_{L^1}=2^{-(n+2)}\to0\); eine Abschätzung \(\|f\|_C\le C\|f\|_{L^1}\) mit festem \(C\) würde \(1\le C\cdot 2^{-(n+2)}\to0\) erzwingen.</p>`,
        plus: String.raw`<p><b>Klausurfalle Nummer eins.</b> Der Satz „alle Normen sind äquivalent“ gilt <b>ausschließlich</b> auf endlichdimensionalen Räumen. Wer ihn in \(C([a,b])\) oder \(\ell_p\) benutzt, hat den Punkt verloren. Merkhilfe: Der Beweis braucht die Kompaktheit der Einheitssphäre — und die ist in unendlicher Dimension falsch.</p><p><b>Was sich überträgt.</b> Sind \(\|\cdot\|_A\) und \(\|\cdot\|_B\) äquivalent, so stimmen überein: konvergente Folgen samt Grenzwerten, Cauchy-Folgen, offene und abgeschlossene Mengen, beschränkte Mengen, stetige Abbildungen — und damit auch die Vollständigkeit (<a href="#/7.1.7">7.1.7</a>). Deshalb ist \(\mathbb{K}^d\) bezüglich <i>jeder</i> Norm ein Banachraum.</p><p><b>Was sich nicht überträgt.</b> Die konkreten Zahlenwerte, die Gestalt der Einheitskugel, und die Frage, welche Konstante in einer Abschätzung optimal ist. Bei quantitativen Aufgaben ist die Norm also durchaus relevant.</p><p><b>Nützlich in Kapitel 7.</b> Beim Differenzieren im \(\mathbb{R}^m\) darf man dank dieses Satzes für Restgliedabschätzungen \(o(\|h\|)\) frei zwischen \(\|\cdot\|_1\), \(\|\cdot\|_2\) und \(\|\cdot\|_\infty\) wechseln — Differenzierbarkeit hängt nicht von der Normwahl ab. Vgl. <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.1.4", title:"Beispiel: 𝕂^d und die p-Normen", body:{
        def: String.raw`<p><b>Lineare Unabhängigkeit und Dimension.</b> Ein endliches System \(x_1,\dots,x_m\in E\) heißt <b>linear unabhängig</b> (l.u.), falls</p>\[\alpha_1x_1+\dots+\alpha_mx_m=\mathbf{0}_E\]<p>nur für \(\alpha_1=\dots=\alpha_m=0\) erfüllt ist. Die <b>Dimension von \(E\)</b> ist die größtmögliche Zahl linear unabhängiger Vektoren (falls endlich) bzw. \(\infty\), falls beliebig große l.u. Systeme existieren.</p><p><b>Beispiel 1 (Tafel).</b> \(E=\mathbb{R}^d\) bzw. \(E=\mathbb{C}^d\), \(d\in\mathbb{N}\); dann ist \(\dim E=d\). Für</p>\[x=(x_1,\dots,x_d),\qquad x_j\in\mathbb{K},\ j=1,\dots,d\]<p>setzt man</p>\[\|x\|_2=\Big(\sum_{k=1}^{d}|x_k|^2\Big)^{1/2},\qquad \|x\|_1=\sum_{k=1}^{d}|x_k|,\]\[\|x\|_\infty=\sup_{k=1,\dots,d}|x_k|,\qquad \|x\|_p=\Big(\sum_{k=1}^{d}|x_k|^p\Big)^{1/p},\quad 1\le p<\infty.\]<p>Das sind sämtlich Normen auf \(\mathbb{K}^d\) — und nach dem Satz aus <a href="#/7.1.3">7.1.3</a> sind sie alle zueinander äquivalent.</p>`,
        worte: String.raw`<p>Der \(\mathbb{K}^d\) ist das Grundmodell: endlichdimensional, mit einer ganzen Familie natürlicher Normen, die man an der Einheitskugel unterscheiden kann. In \(\mathbb{R}^2\) ist die Einheitskugel von \(\|\cdot\|_1\) ein auf die Spitze gestelltes Quadrat, die von \(\|\cdot\|_2\) der gewohnte Kreis, die von \(\|\cdot\|_\infty\) das achsenparallele Quadrat. Die \(p\)-Kugeln für \(1< p<\infty\) liegen dazwischen und blähen sich mit wachsendem \(p\) vom Rhombus zum Quadrat auf.</p><p>Daraus liest man auch die <b>Monotonie in \(p\)</b> ab: für festes \(x\) ist \(p\mapsto\|x\|_p\) fallend,</p>\[\|x\|_\infty\le\dots\le\|x\|_2\le\|x\|_1,\]<p>und es gilt \(\|x\|_p\to\|x\|_\infty\) für \(p\to\infty\) — daher der Index \(\infty\) für die Maximumsnorm.</p><p>Die Axiome (1) und (2) rechnet man für \(\|\cdot\|_p\) unmittelbar nach; (1), weil eine Summe nichtnegativer Zahlen nur dann verschwindet, wenn jeder Summand verschwindet, und (2), weil \(|\alpha x_k|^p=|\alpha|^p|x_k|^p\) sich als \(|\alpha|^p\) aus der Summe herausziehen und die \(p\)-te Wurzel ihn wieder zu \(|\alpha|\) macht. Die Dreiecksungleichung (3) ist die einzige echte Arbeit; sie heißt <b>Minkowski-Ungleichung</b> und ist für \(p=1\) und \(p=\infty\) elementar, für allgemeines \(p\) etwas aufwendiger.</p><p>Die Dimensionsdefinition wird hier nur gebraucht, um endlich- von unendlichdimensionalen Räumen zu trennen — das ist die Trennlinie, an der der Äquivalenzsatz aus <a href="#/7.1.3">7.1.3</a> hängt.</p>`,
        beispiel: String.raw`<p><b>Ein Vektor, vier Normen.</b> Sei \(x=(3,-4,12)^{T}\in\mathbb{R}^3\).</p><p><b>\(\|\cdot\|_1\):</b> \(\ \|x\|_1=|3|+|-4|+|12|=3+4+12=19.\)</p><p><b>\(\|\cdot\|_2\):</b> \(\ \|x\|_2=\big(3^2+4^2+12^2\big)^{1/2}=(9+16+144)^{1/2}=\sqrt{169}=13.\)</p><p><b>\(\|\cdot\|_\infty\):</b> \(\ \|x\|_\infty=\sup\{3,4,12\}=12.\)</p><p><b>\(\|\cdot\|_3\):</b> \(\ \|x\|_3=\big(27+64+1728\big)^{1/3}=1819^{1/3}\approx 12{,}21.\)</p><p><b>Monotonie-Probe:</b> \(\ 12=\|x\|_\infty\le\|x\|_3\approx 12{,}21\le\|x\|_2=13\le\|x\|_1=19.\ \) Passt.</p><p><b>Äquivalenzkonstanten aus <a href="#/7.1.3">7.1.3</a> nachgeprüft:</b></p>\[\|x\|_\infty\le\|x\|_2\le\sqrt3\,\|x\|_\infty:\qquad 12\le 13\le \sqrt3\cdot 12\approx 20{,}78\quad\checkmark\]\[\|x\|_\infty\le\|x\|_1\le 3\,\|x\|_\infty:\qquad 12\le 19\le 36\quad\checkmark\]<p><b>Homogenität (2):</b> \(-2x=(-6,8,-24)^{T}\), also \(\|-2x\|_2=\sqrt{36+64+576}=\sqrt{676}=26=2\cdot 13=|-2|\cdot\|x\|_2.\)</p><p><b>Dreiecksungleichung (3):</b> mit \(y=(1,1,-1)^{T}\) ist \(x+y=(4,-3,11)^{T}\), also</p>\[\|x+y\|_2=\sqrt{16+9+121}=\sqrt{146}\approx 12{,}08\ \le\ \|x\|_2+\|y\|_2=13+\sqrt3\approx 14{,}73\quad\checkmark\]<p><b>Dimension:</b> Für die Standardbasis \(e_1,e_2,e_3\) liefert</p>\[\alpha_1e_1+\alpha_2e_2+\alpha_3e_3=(\alpha_1,\alpha_2,\alpha_3)^{T}=\mathbf{0}_3\ \Longrightarrow\ \alpha_1=\alpha_2=\alpha_3=0,\]<p>also sind \(e_1,e_2,e_3\) linear unabhängig, und ein viertes System wäre es nicht mehr: \(\dim\mathbb{R}^3=3\), allgemein \(\dim\mathbb{K}^d=d\).</p>`,
        plus: String.raw`<p><b>Namen.</b> \(\|\cdot\|_1\) heißt Betragssummen- oder Manhattan-Norm (Weglänge im Straßenraster), \(\|\cdot\|_2\) euklidische Norm, \(\|\cdot\|_\infty\) Maximumsnorm. Die Vorlesung schreibt bei \(\|\cdot\|_\infty\) auf \(\mathbb{K}^d\) ein \(\sup\), obwohl über eine endliche Indexmenge maximiert wird — auf \(\ell_\infty\) (<a href="#/7.1.5">7.1.5</a>) ist das Supremum dann wirklich nötig.</p><p><b>Der Parameterbereich \(1\le p<\infty\) ist kein Zufall.</b> Für \(0< p<1\) ist \(\|\cdot\|_p\) keine Norm, denn die Dreiecksungleichung scheitert: mit \(p=\tfrac12\), \(x=(1,0)\), \(y=(0,1)\) in \(\mathbb{R}^2\) ist \(\|x\|_{1/2}=\|y\|_{1/2}=1\), aber \(\|x+y\|_{1/2}=\big(1+1\big)^{2}=4>2=\|x\|_{1/2}+\|y\|_{1/2}\).</p><p><b>Klausurhinweis.</b> Da alle diese Normen äquivalent sind, darf man sich für Konvergenz- und Stetigkeitsfragen die bequemste aussuchen — meist \(\|\cdot\|_\infty\), weil sich damit alles auf komponentenweise Aussagen zurückführt. Für Abschätzungen mit Skalarprodukt (Cauchy-Schwarz) und für die Geometrie (Orthogonalität) nimmt man dagegen \(\|\cdot\|_2=\sqrt{\langle x,x\rangle}\).</p>`}},
       {id:"7.1.5", title:"Beispiel: die Folgenräume ℓ_p und ℓ_∞", body:{
        def: String.raw`<p><b>Beispiel 2 (Tafel): Folgen als Vektoren.</b> Für Zahlenfolgen</p>\[x=(x_n)_{n\in\mathbb{N}},\qquad y=(y_n)_{n\in\mathbb{N}},\qquad x_n,y_n\in\mathbb{K}\]<p>erklärt man die Vektorraum-Operationen gliedweise:</p>\[x+y=(x_n+y_n)_{n\in\mathbb{N}},\qquad \alpha\cdot x=(\alpha x_1,\dots,\alpha x_k,\dots).\]<p><b>Der Raum \(\ell_\infty\).</b></p>\[E=\ell_\infty=\Big\{x:\ \sup_{n\in\mathbb{N}}|x_n|<\infty\Big\},\qquad \|x\|_\infty=\sup_{n\in\mathbb{N}}|x_n|\]<p>ist eine Norm auf \(\ell_\infty\).</p><p><b>Die Räume \(\ell_p\).</b></p>\[E=\ell_p=\Big\{x:\ \sum_{k=1}^{\infty}|x_k|^p<\infty\Big\},\qquad \|x\|_p=\Big(\sum_{k=1}^{\infty}|x_k|^p\Big)^{1/p}\]<p>ist eine Norm auf \(\ell_p\), \(1\le p<\infty\).</p><p><b>Hausaufgabe der Vorlesung:</b> \(\ell_p\) und \(\ell_\infty\) sind unendlichdimensional.</p>`,
        worte: String.raw`<p>Die Folgenräume sind die naheliegende Fortsetzung von <a href="#/7.1.4">7.1.4</a>: man lässt in \(\mathbb{K}^d\) einfach \(d\to\infty\) laufen. Die Formeln für die Normen sind buchstäblich dieselben, nur mit \(\sum_{k=1}^{\infty}\) statt \(\sum_{k=1}^{d}\) und \(\sup_{n\in\mathbb{N}}\) statt \(\sup_{k=1,\dots,d}\).</p><p>Der entscheidende Unterschied: Jetzt ist die Norm nicht mehr für jeden Vektor endlich. Deshalb muss man den <i>Raum</i> mitdefinieren — \(\ell_p\) besteht genau aus denjenigen Folgen, für die die Reihe konvergiert. Die Endlichkeit der Norm ist Teil der Zugehörigkeitsbedingung, nicht ein Satz. Dass \(\ell_p\) überhaupt ein Vektorraum ist (dass also mit \(x,y\in\ell_p\) auch \(x+y\in\ell_p\) liegt), ist genau der Inhalt der Minkowski-Ungleichung \(\|x+y\|_p\le\|x\|_p+\|y\|_p\).</p><p>Die Definitheit ist unproblematisch: \(\|x\|_p=0\) erzwingt \(|x_k|^p=0\) für jedes einzelne \(k\), also \(x=\mathbf{0}\); ebenso zwingt \(\sup_n|x_n|=0\) jedes Folgenglied auf null.</p><p>Und hier wird die Warnung aus <a href="#/7.1.3">7.1.3</a> konkret: Die Räume \(\ell_p\) sind unendlichdimensional, also sind ihre Normen <b>nicht</b> mehr äquivalent. Anders als in \(\mathbb{K}^d\), wo \(\|\cdot\|_1\), \(\|\cdot\|_2\) und \(\|\cdot\|_\infty\) denselben Raum und denselben Konvergenzbegriff liefern, sind \(\ell_1\), \(\ell_2\) und \(\ell_\infty\) schon als Mengen verschieden.</p>`,
        beispiel: String.raw`<p><b>(a) Wo liegt \(x=\big(\tfrac1k\big)_{k\in\mathbb{N}}=(1,\tfrac12,\tfrac13,\dots)\)?</b></p><p><b>In \(\ell_\infty\):</b> \(\ \|x\|_\infty=\sup_{k\in\mathbb{N}}\tfrac1k=1<\infty\), also \(x\in\ell_\infty\) mit \(\|x\|_\infty=1\).</p><p><b>Nicht in \(\ell_1\):</b> \(\ \sum_{k=1}^{\infty}\tfrac1k\) ist die harmonische Reihe und divergiert (vgl. <a href="#/ref/konv_summen">Konvergenz von Summen</a>), also \(x\notin\ell_1\).</p><p><b>In \(\ell_2\):</b> \(\ \sum_{k=1}^{\infty}\tfrac{1}{k^2}=\tfrac{\pi^2}{6}<\infty\), also \(x\in\ell_2\) mit</p>\[\|x\|_2=\Big(\frac{\pi^2}{6}\Big)^{1/2}=\frac{\pi}{\sqrt6}\approx 1{,}283.\]<p>Damit ist die Inklusion \(\ell_1\subset\ell_2\) <i>echt</i>. Für die zweite Inklusion braucht man einen anderen Zeugen: für \(z=\big(\tfrac{1}{\sqrt k}\big)_{k\in\mathbb{N}}\) ist \(\|z\|_\infty=1<\infty\), aber</p>\[\sum_{k=1}^{\infty}\Big(\frac{1}{\sqrt k}\Big)^{2}=\sum_{k=1}^{\infty}\frac1k=\infty,\]<p>also \(z\in\ell_\infty\setminus\ell_2\). Zusammen: beide Inklusionen in \(\ell_1\subset\ell_2\subset\ell_\infty\) sind echt.</p><p><b>(b) Ein Vektor in allen drei Räumen:</b> \(y=\big(2^{-k}\big)_{k\in\mathbb{N}}\).</p>\[\|y\|_1=\sum_{k=1}^{\infty}\frac{1}{2^k}=\frac{1/2}{1-1/2}=1,\qquad \|y\|_2=\Big(\sum_{k=1}^{\infty}\frac{1}{4^k}\Big)^{1/2}=\Big(\frac{1/4}{1-1/4}\Big)^{1/2}=\frac{1}{\sqrt3}\approx 0{,}577,\]\[\|y\|_\infty=\sup_{k\in\mathbb{N}}\frac{1}{2^k}=\frac12.\]<p>Monotonie-Probe: \(0{,}5=\|y\|_\infty\le\|y\|_2\approx 0{,}577\le\|y\|_1=1\). Passt.</p><p><b>(c) Unendliche Dimension (die Hausaufgabe).</b> Sei</p>\[e^{(j)}=(0,\dots,0,\underbrace{1}_{j\text{-te Stelle}},0,\dots),\qquad j\in\mathbb{N}.\]<p>Es ist \(\|e^{(j)}\|_p=1\) und \(\|e^{(j)}\|_\infty=1\), also \(e^{(j)}\in\ell_p\cap\ell_\infty\) für alle \(p\). Für beliebiges \(m\in\mathbb{N}\) gilt</p>\[\alpha_1e^{(1)}+\dots+\alpha_me^{(m)}=(\alpha_1,\dots,\alpha_m,0,0,\dots)=\mathbf{0}\ \Longrightarrow\ \alpha_1=\dots=\alpha_m=0,\]<p>also ist \(e^{(1)},\dots,e^{(m)}\) linear unabhängig. Da \(m\) beliebig groß gewählt werden kann, existieren beliebig große l.u. Systeme, d.h.</p>\[\dim\ell_p=\dim\ell_\infty=\infty.\]`,
        plus: String.raw`<p><b>Inklusionskette.</b> Für \(1\le p\le q<\infty\) gilt \(\ell_1\subset\ell_p\subset\ell_q\subset\ell_\infty\) und \(\|x\|_\infty\le\|x\|_q\le\|x\|_p\le\|x\|_1\). Begründung in einer Zeile: aus \(x\in\ell_p\) folgt \(|x_k|\to0\), also \(|x_k|\le1\) ab einem Index, und dann \(|x_k|^q\le|x_k|^p\). Das ist genau umgekehrt zu \(\mathbb{K}^d\), wo alle \(p\)-Normen denselben Raum tragen.</p><p><b>Die zentrale Warnung.</b> Wegen \(\dim=\infty\) versagt der Äquivalenzsatz aus <a href="#/7.1.3">7.1.3</a>. Das Tafelgegenbeispiel \(x^{(n)}=(2^{-n},\dots,2^{-n},0,\dots)\) mit \(2^n\) Einträgen lebt genau hier: \(\|x^{(n)}\|_\infty=2^{-n}\to0\), aber \(\|x^{(n)}\|_1=1\) für alle \(n\).</p><p><b>Gut zu wissen.</b> Alle \(\ell_p\) (\(1\le p\le\infty\)) sind Banachräume (<a href="#/7.1.7">7.1.7</a>), und \(\ell_2\) ist der Prototyp eines unendlichdimensionalen Hilbertraums mit \(\langle x,y\rangle=\sum_k x_k\overline{y_k}\) und \(\|x\|_2=\sqrt{\langle x,x\rangle}\).</p><p><b>Klausurfalle.</b> Bei einer Aufgabe „Liegt die Folge in \(\ell_p\)?“ ist stets ein Reihenkonvergenz-Kriterium aus Kapitel 5 gefragt — Majoranten-, Verdichtungs- oder Integralkriterium; siehe <a href="#/ref/konv_summen">Konvergenz von Summen</a>.</p>`}},
       {id:"7.1.6", title:"Beispiel: C([a,b]) und C¹([a,b])", body:{
        def: String.raw`<p><b>Beispiel 3 (Tafel).</b> \(E=C([a,b],\mathbb{R})\), z.B. \(a=0\), \(b=1\); also \(f:[0,1]\to\mathbb{R}\) stetig. Dann ist</p>\[\|f\|_C=\max_{x\in[a,b]}|f(x)|\]<p>eine <b>Norm</b> auf \(E\). Das Maximum wird tatsächlich angenommen, weil \([a,b]\) kompakt und \(|f|\) stetig ist. Das Nullelement ist die identisch verschwindende Funktion</p>\[\mathbf{0}_C=\mathbf{0}(x)\equiv 0.\]<p>Ein beliebiger endlicher Satz von Funktionen vom Typ \(u_n\) (Dreieckspulse, siehe Beispiel) ist linear unabhängig, folglich</p>\[\dim C([0,1])=\infty.\]<p><b>Alternative Norm.</b></p>\[\|f\|_{L^1}=\int_0^1|f(x)|\,dx\]<p>(gilt nicht auf \(R[0,1]\)! — vgl. <a href="#/7.1.1">7.1.1</a>)</p><p><b>Beispiel 4 (Tafel).</b></p>\[C^1([a,b],\mathbb{R})=\big\{f:[a,b]\to\mathbb{R}\ :\ f,\,f'\in C([a,b])\big\},\qquad \|f\|_{C^1}=\|f\|_C+\|f'\|_C.\]`,
        worte: String.raw`<p>Hier wird der Schritt vollzogen, um den es in Kapitel 7 eigentlich geht: <b>Funktionen werden zu Vektoren</b>. Die Summe zweier stetiger Funktionen ist stetig, das skalare Vielfache auch — \(C([a,b])\) ist also ein Vektorraum, und \(\|f\|_C\) misst darin die „Größe“ einer Funktion als ihre maximale Auslenkung.</p><p>Die Normaxiome sind schnell geprüft: \(\|f\|_C=0\) heißt \(\max|f|=0\), also \(f(x)=0\) für <i>jedes</i> \(x\), d.h. \(f=\mathbf{0}_C\); die Homogenität folgt aus \(\max|\alpha f|=|\alpha|\max|f|\); und die Dreiecksungleichung aus der punktweisen Abschätzung \(|f(x)+g(x)|\le|f(x)|+|g(x)|\le\|f\|_C+\|g\|_C\), gefolgt vom Maximum über \(x\).</p><p>Der Raum \(C([0,1])\) ist <b>unendlichdimensional</b> — und die Vorlesung beweist das nicht abstrakt, sondern baut die linear unabhängigen Vektoren explizit hin: immer schmalere Dreieckspulse, die auf disjunkten Stücken von \([0,1]\) sitzen. Diese Pulse sind das Arbeitspferd des ganzen Abschnitts; sie liefern gleichzeitig das Gegenbeispiel zur Normäquivalenz (<a href="#/7.1.3">7.1.3</a>) und den Beleg dafür, dass Konvergenz normabhängig ist (<a href="#/7.1.2">7.1.2</a>).</p><p>Bei \(C^1([a,b])\) reicht \(\|f\|_C\) nicht mehr: Wer stetig differenzierbare Funktionen betrachten will, muss auch die Ableitung kontrollieren, sonst kann eine Folge zwar gleichmäßig konvergieren, ihre Ableitungen aber wild oszillieren. Deshalb addiert man beide Beiträge: \(\|f\|_{C^1}=\|f\|_C+\|f'\|_C\). Dass das wieder eine Norm ist, folgt axiomweise aus den Eigenschaften von \(\|\cdot\|_C\); für die Definitheit genügt sogar der erste Summand, denn \(\|f\|_{C^1}=0\) erzwingt insbesondere \(\|f\|_C=0\).</p>`,
        beispiel: String.raw`<p><b>(a) Die Dreieckspulse der Vorlesung.</b> Für \(n\in\mathbb{N}\) sei \(u_n\in C([0,1])\) die stückweise lineare Funktion mit Träger \(\big[\tfrac{1}{2^{n+1}},\ \tfrac{1}{2^{n}}\big]\), die dort von \(0\) auf die Höhe \(1\) ansteigt und wieder auf \(0\) fällt, und die außerhalb identisch \(0\) ist. (Für \(n=0\) ist das der breite Puls \(u_0\) mit Träger \(\big[\tfrac12,1\big]\).)</p><p><b>Maximumsnorm.</b> Der Wert \(1\) wird in der Spitze angenommen, sonst nichts Größeres:</p>\[\|u_n\|_C=\max_{x\in[0,1]}|u_n(x)|=1\qquad\text{für alle }n.\]<p><b>\(L^1\)-Norm.</b> Die Grundseite des Dreiecks hat die Länge</p>\[\frac{1}{2^{n}}-\frac{1}{2^{n+1}}=\frac{2-1}{2^{n+1}}=\frac{1}{2^{n+1}},\]<p>die Höhe ist \(1\), also ist die Fläche unter dem Puls</p>\[\|u_n\|_{L^1}=\int_0^1|u_n(x)|\,dx=\frac12\cdot\frac{1}{2^{n+1}}\cdot 1=\frac{1}{2^{n+2}}\xrightarrow{\ n\to\infty\ }0.\]<p>Kontrolle für \(n=0\): \(\tfrac12\cdot\tfrac12\cdot1=\tfrac14=\tfrac{1}{2^{2}}\) — passt.</p><p><b>Lineare Unabhängigkeit.</b> Seien \(n_1<\dots< n_m\) und \(\alpha_1u_{n_1}+\dots+\alpha_mu_{n_m}=\mathbf{0}_C\). Die Träger \(\big[\tfrac{1}{2^{n_j+1}},\tfrac{1}{2^{n_j}}\big]\) überlappen sich höchstens in Randpunkten. Wertet man die Gleichung in der Spitze \(x_j\) von \(u_{n_j}\) aus, so verschwinden dort alle übrigen Pulse und es bleibt</p>\[\alpha_j\cdot 1=0,\qquad\text{also}\quad \alpha_j=0,\ j=1,\dots,m.\]<p>Da \(m\) beliebig groß sein darf, folgt \(\dim C([0,1])=\infty\).</p><p><b>(b) Die \(C^1\)-Norm an zwei Funktionen.</b></p><p>\(f(x)=x^2\) auf \([0,1]\): \(\ \|f\|_C=\max_{x\in[0,1]}x^2=1\) (angenommen in \(x=1\)), \(f'(x)=2x\), \(\|f'\|_C=\max_{x\in[0,1]}2x=2\), also</p>\[\|f\|_{C^1}=\|f\|_C+\|f'\|_C=1+2=3.\]<p>\(g(x)=\sin(2\pi x)\) auf \([0,1]\): \(\ \|g\|_C=1\), \(g'(x)=2\pi\cos(2\pi x)\), \(\|g'\|_C=2\pi\), also</p>\[\|g\|_{C^1}=1+2\pi\approx 7{,}28.\]<p><b>Dreiecksungleichung-Probe:</b> \((f+g)'(x)=2x+2\pi\cos(2\pi x)\), also \(\|f+g\|_C\le 1+1=2\) und \(\|(f+g)'\|_C\le 2+2\pi\), somit \(\|f+g\|_{C^1}\le 3+(1+2\pi)=\|f\|_{C^1}+\|g\|_{C^1}\).</p>`,
        plus: String.raw`<p><b>Anschluss an Kapitel 6.</b> Die Norm \(\|\cdot\|_C\) ist genau die aus <a href="#/6.2.1">6.2.1</a> bekannte Supremumsnorm auf \(C(X,Y)\); Konvergenz bezüglich \(\|\cdot\|_C\) ist gleichmäßige Konvergenz, \(f_n\rightrightarrows f\).</p><p><b>Zwei Normen, zwei Welten.</b> Die Pulse \(u_n\) zeigen in einem Beispiel gleich drei Dinge: \(\dim C([0,1])=\infty\); \(\|\cdot\|_C\) und \(\|\cdot\|_{L^1}\) sind nicht äquivalent (<a href="#/7.1.3">7.1.3</a>); und Konvergenz hängt von der gewählten Norm ab (<a href="#/7.1.2">7.1.2</a>). Wer die Pulse einmal gezeichnet hat, hat den halben Abschnitt verstanden.</p><p><b>Klausurfalle.</b> Die Formel \(\int_0^1|f|\,dx\) ist auf \(C([0,1])\) eine Norm, auf \(R[0,1]\) nur eine Halbnorm — die Tafel setzt dort ein Ausrufezeichen. Der Grund ist allein die Definitheit; siehe <a href="#/7.1.1">7.1.1</a>.</p><p><b>Warum \(\|\cdot\|_{C^1}\) und nicht \(\|\cdot\|_C\) auf \(C^1\)?</b> Mit \(\|\cdot\|_C\) ist \(C^1([a,b])\) zwar ein normierter Raum, aber nicht vollständig — der gleichmäßige Limes stetig differenzierbarer Funktionen muss nicht differenzierbar sein. Erst \(\|\cdot\|_{C^1}\) macht \(C^1([a,b],\mathbb{K}^d)\) zu einem Banachraum (<a href="#/7.1.7">7.1.7</a>).</p>`}},
       {id:"7.1.7", title:"Vollständigkeit — der Banachraum", body:{
        def: String.raw`<p>Sei \((E,\|\cdot\|)\) ein normierter Raum. Eine Folge \((x_n)_{n\in\mathbb{N}}\) in \(E\) heißt <b>Cauchy-Folge</b>, falls</p>\[\forall_{\varepsilon>0}\ \exists_{N_\varepsilon\in\mathbb{N}}\ \forall_{n,m\ge N_\varepsilon}:\quad \|x_n-x_m\|<\varepsilon.\]<p>Der Raum \((E,\|\cdot\|)\) heißt <b>vollständig</b>, falls jede Cauchy-Folge in \(E\) einen Grenzwert <b>in \(E\)</b> besitzt.</p><p><b>Definition (Tafel).</b> Einen vollständigen normierten Raum nennt man <b>Banachraum</b>.</p><p><b>Beispiele (Tafel).</b></p>\[\mathbb{R},\quad \mathbb{C},\quad \mathbb{R}^d,\quad \mathbb{C}^d\]\[C([a,b],\mathbb{K}^d)\ \text{ bzgl. }\|\cdot\|_C\]\[C^1([a,b],\mathbb{K}^d)\ \text{ bzgl. }\|\cdot\|_{C^1}\]`,
        worte: String.raw`<p>Eine Cauchy-Folge ist eine Folge, deren Glieder sich untereinander beliebig nahekommen — sie „will“ konvergieren. Vollständigkeit heißt: dieser Wille wird auch erfüllt, der Grenzwert existiert und liegt noch im Raum. Es ist eine Aussage darüber, dass der Raum <i>keine Löcher</i> hat.</p><p>Der Gewinn: Man kann die Existenz eines Objekts nachweisen, ohne es zu kennen. Man konstruiert eine Folge, zeigt die Cauchy-Eigenschaft — und bekommt den Grenzwert geschenkt. Genau darauf beruhen der Banachsche Fixpunktsatz und mit ihm der Satz über implizite Funktionen und der Umkehrsatz, die tragenden Existenzsätze des Kapitels.</p><p>Entscheidend ist der Zusatz „in \(E\)“. \(\mathbb{Q}\) mit dem Betrag ist nicht vollständig, obwohl jede rationale Cauchy-Folge in \(\mathbb{R}\) konvergiert — der Grenzwert liegt bloß nicht mehr in \(\mathbb{Q}\). Genauso ist \(C([0,1])\) mit \(\|\cdot\|_{L^1}\) nicht vollständig: die Grenzfunktion existiert als Funktion, ist aber nicht mehr stetig.</p><p>Ganz wichtig: <b>Vollständigkeit ist eine Eigenschaft des Paares \((E,\|\cdot\|)\), nicht des Vektorraums allein.</b> Ein und derselbe Raum \(C([0,1])\) ist mit \(\|\cdot\|_C\) ein Banachraum und mit \(\|\cdot\|_{L^1}\) keiner — siehe „Erfüllt“ und „Verletzt“. Bei <i>äquivalenten</i> Normen (<a href="#/7.1.3">7.1.3</a>) überträgt sich die Vollständigkeit dagegen, denn äquivalente Normen haben dieselben Cauchy-Folgen und dieselben Grenzwerte. Da auf \(\mathbb{K}^d\) alle Normen äquivalent sind und \(\mathbb{K}\) vollständig ist, ist \(\mathbb{K}^d\) bezüglich <i>jeder</i> Norm ein Banachraum — genau die erste Beispielzeile der Tafel.</p>`,
        erfuellt: String.raw`<p><b>\(\big(C([0,1],\mathbb{R}),\ \|\cdot\|_C\big)\) ist ein Banachraum</b> (vgl. <a href="#/6.2.2">6.2.2</a>). Beweis in vier Schritten.</p><p><b>Schritt 1 (punktweiser Grenzwert existiert).</b> Sei \((f_n)\) Cauchy bezüglich \(\|\cdot\|_C\). Für jedes feste \(x\in[0,1]\) ist</p>\[|f_n(x)-f_m(x)|\le\max_{t\in[0,1]}|f_n(t)-f_m(t)|=\|f_n-f_m\|_C,\]<p>also ist \((f_n(x))_n\) eine Cauchy-Folge in \(\mathbb{R}\). Da \(\mathbb{R}\) vollständig ist, existiert \(f(x):=\lim_{n\to\infty}f_n(x)\).</p><p><b>Schritt 2 (die Konvergenz ist gleichmäßig).</b> Zu \(\varepsilon>0\) wähle \(N_\varepsilon\) mit \(\|f_n-f_m\|_C<\tfrac{\varepsilon}{2}\) für \(n,m\ge N_\varepsilon\). Für festes \(n\ge N_\varepsilon\) und beliebiges \(x\) liefert der Grenzübergang \(m\to\infty\) in \(|f_n(x)-f_m(x)|<\tfrac{\varepsilon}{2}\) die Abschätzung \(|f_n(x)-f(x)|\le\tfrac{\varepsilon}{2}\), und zwar <i>gleichmäßig</i> in \(x\). Also \(f_n\rightrightarrows f\) auf \([0,1]\).</p><p><b>Schritt 3 (der Limes ist wieder stetig).</b> Nach dem Satz über gleichmäßige Konvergenz aus Kapitel 6 ist der gleichmäßige Limes stetiger Funktionen stetig, also \(f\in C([0,1],\mathbb{R})\) — der Grenzwert liegt im Raum.</p><p><b>Schritt 4 (Konvergenz in der Norm).</b> Aus Schritt 2 folgt \(\|f_n-f\|_C=\max_x|f_n(x)-f(x)|\le\tfrac{\varepsilon}{2}<\varepsilon\) für \(n\ge N_\varepsilon\), also \(f_n\to f\) bezüglich \(\|\cdot\|_C\). Damit ist der Raum vollständig.</p><p><b>Konkrete Probe.</b> Sei \(\displaystyle f_n(x)=\sum_{k=0}^{n}\frac{x^k}{k!}\in C([0,1])\). Für \(n>m\) ist</p>\[\|f_n-f_m\|_C=\max_{x\in[0,1]}\Big|\sum_{k=m+1}^{n}\frac{x^k}{k!}\Big|=\sum_{k=m+1}^{n}\frac{1}{k!}\le\sum_{k=m+1}^{\infty}\frac{1}{k!}\xrightarrow{\ m\to\infty\ }0,\]<p>also ist \((f_n)\) eine Cauchy-Folge. Und tatsächlich liegt der Grenzwert im Raum: \(f(x)=e^x\in C([0,1])\) mit \(\|f_n-f\|_C=\sum_{k=n+1}^{\infty}\tfrac{1}{k!}\to0\).</p>`,
        verletzt: String.raw`<p><b>\(\big(C([0,1],\mathbb{R}),\ \|\cdot\|_{L^1}\big)\) ist kein Banachraum.</b> Derselbe Vektorraum, andere Norm — und die Vollständigkeit ist weg.</p><p><b>Die Folge.</b> Für \(n\ge 3\) sei \(f_n:[0,1]\to\mathbb{R}\),</p>\[f_n(x)=\begin{cases}0,& 0\le x\le \tfrac12,\\[3pt] n\big(x-\tfrac12\big),& \tfrac12\le x\le \tfrac12+\tfrac1n,\\[3pt] 1,& \tfrac12+\tfrac1n\le x\le 1.\end{cases}\]<p>Die drei Vorschriften stimmen an den Nahtstellen überein, also ist \(f_n\in C([0,1],\mathbb{R})\): eine Rampe, die immer steiler wird.</p><p><b>Schritt 1 (Cauchy-Eigenschaft).</b> Für \(m\ge n\) sind \(f_n\) und \(f_m\) außerhalb von \(\big[\tfrac12,\tfrac12+\tfrac1n\big]\) identisch, und dort gilt \(0\le f_n,f_m\le 1\), also \(|f_n-f_m|\le1\). Somit</p>\[\|f_n-f_m\|_{L^1}=\int_{1/2}^{1/2+1/n}|f_n(x)-f_m(x)|\,dx\ \le\ 1\cdot\frac1n\ \xrightarrow{\ n\to\infty\ }0.\]<p>\((f_n)\) ist also Cauchy bezüglich \(\|\cdot\|_{L^1}\).</p><p><b>Schritt 2 (Annahme eines Grenzwerts).</b> Angenommen, es gäbe \(f\in C([0,1],\mathbb{R})\) mit \(\|f_n-f\|_{L^1}\to0\).</p><p><b>Schritt 3 (links vom Sprung).</b> Auf \(\big[0,\tfrac12\big]\) ist \(f_n\equiv 0\), also</p>\[\int_0^{1/2}|f(x)|\,dx=\int_0^{1/2}|f(x)-f_n(x)|\,dx\le\|f-f_n\|_{L^1}\xrightarrow{\ n\to\infty\ }0,\]<p>d.h. \(\int_0^{1/2}|f|\,dx=0\). Da \(f\) stetig ist, folgt daraus \(f\equiv 0\) auf \(\big[0,\tfrac12\big]\) (Argument wie in <a href="#/7.1.1">7.1.1</a>), insbesondere \(f\big(\tfrac12\big)=0\).</p><p><b>Schritt 4 (rechts vom Sprung).</b> Sei \(\delta\in\left]0,\tfrac12\right[\) beliebig. Für \(n>\tfrac1\delta\) ist \(f_n\equiv 1\) auf \(\big[\tfrac12+\delta,1\big]\), also</p>\[\int_{1/2+\delta}^{1}|f(x)-1|\,dx=\int_{1/2+\delta}^{1}|f(x)-f_n(x)|\,dx\le\|f-f_n\|_{L^1}\xrightarrow{\ n\to\infty\ }0,\]<p>also \(f\equiv 1\) auf \(\big[\tfrac12+\delta,1\big]\) für <i>jedes</i> \(\delta>0\), d.h. \(f\equiv 1\) auf \(\left]\tfrac12,1\right]\).</p><p><b>Schritt 5 (Widerspruch).</b> Aus der Stetigkeit von \(f\) in \(x=\tfrac12\) folgt</p>\[0=f\Big(\tfrac12\Big)=\lim_{x\to 1/2,\ x>1/2}f(x)=1,\]<p>ein Widerspruch. Es gibt also keinen Grenzwert in \(C([0,1])\): der Raum ist bezüglich \(\|\cdot\|_{L^1}\) <b>nicht vollständig</b>. Der „fehlende“ Grenzwert ist die Sprungfunktion — erst der Lebesgue-Raum \(L^1([0,1])\) schließt dieses Loch.</p>`,
        plus: String.raw`<p><b>Warum das der Schlussstein von §7.1 ist.</b> Vollständigkeit ist die Eigenschaft, die man in Kapitel 7 ständig braucht, aber selten nennt: der Banachsche Fixpunktsatz liefert nur in vollständigen Räumen einen Fixpunkt, und auf ihm ruhen der Satz über implizite Funktionen und der Umkehrsatz. Vgl. <a href="#/ref/saetze">Sätze</a>.</p><p><b>Merksatz zur Beispielliste der Tafel.</b> \(\mathbb{R},\mathbb{C},\mathbb{R}^d,\mathbb{C}^d\) sind vollständig, weil \(\mathbb{R}\) es ist und alle Normen auf \(\mathbb{K}^d\) äquivalent sind. \(C([a,b],\mathbb{K}^d)\) ist vollständig, weil gleichmäßige Limites stetiger Funktionen stetig sind (<a href="#/6.2.2">6.2.2</a>). \(C^1([a,b],\mathbb{K}^d)\) ist vollständig, weil die \(C^1\)-Norm zusätzlich die Ableitungen gleichmäßig kontrolliert: aus \(f_n\rightrightarrows f\) und \(f_n'\rightrightarrows g\) folgt \(f\in C^1\) mit \(f'=g\) (Satz über die Vertauschung von Limes und Ableitung, siehe <a href="#/ref/vertauschen">Vertauschen von Grenzprozessen</a>).</p><p><b>Klausurfalle.</b> Die naheliegende Falschaussage lautet „\(C^1([0,1])\) ist mit \(\|\cdot\|_C\) vollständig“. Ist es nicht: Man kann eine Knickfunktion wie \(x\mapsto|x-\tfrac12|\) gleichmäßig durch glatte Funktionen approximieren, der Grenzwert liegt dann nicht mehr in \(C^1\). Genau deshalb führt die Vorlesung \(\|f\|_{C^1}=\|f\|_C+\|f'\|_C\) ein.</p><p><b>Merkhilfe zum Prüfen.</b> „Vollständig?“ heißt immer: Cauchy-Folge nehmen, Kandidaten für den Grenzwert konstruieren, nachweisen, dass er im Raum liegt, und dann Konvergenz <i>in der Norm</i> zeigen. Der dritte Schritt ist der, an dem Gegenbeispiele scheitern.</p>`}}]},
    {id:"7.2", t:"Lineare stetige Operatoren", topics:[
       {id:"7.2.1", title:"Linearer Operator", body:{
        def: String.raw`<p>Seien \((E,\|\cdot\|_E)\) und \((F,\|\cdot\|_F)\) normierte Räume über \(\mathbb{K}\) und sei \(D_T\subset E\) eine <b>lineare Teilmenge</b>; insbesondere ist \(\mathbf{0}_E\in D_T\).</p><p><b>Definition.</b> \(T:D_T\subset E\to F\) heißt <b>linear</b>, falls</p>\[T(\alpha x+\beta y)=\alpha Tx+\beta Ty,\qquad \alpha,\beta\in\mathbb{K},\quad x,y\in D_T.\]<p>Man nennt \(T\) dann einen <b>linearen Operator</b>. \(D_T\) heißt Definitionsbereich von \(T\).</p><p><b>Anmerkung.</b> Jeder lineare Operator bildet den Nullvektor auf den Nullvektor ab:</p>\[T\mathbf{0}_E=T(0\cdot\mathbf{0}_E)=0\cdot T\mathbf{0}_E=\mathbf{0}_F.\]<p><b>Anmerkung (Nulloperator).</b> \(T=\mathbf{0}:D_T=E\to F\) mit \(\mathbf{0}x=\mathbf{0}_F\) für alle \(x\in E\) ist linear.</p>`,
        worte: String.raw`<p>Ein linearer Operator ist nichts anderes als eine Abbildung zwischen zwei normierten Räumen, die mit den beiden Vektorraum-Operationen verträglich ist: erst addieren und dann abbilden liefert dasselbe wie erst abbilden und dann addieren, und Streckungen darf man aus der Abbildung herausziehen. Neu gegenüber der linearen Algebra ist nur, dass \(E\) und \(F\) jetzt <i>Normen</i> tragen und dass \(T\) nicht auf ganz \(E\) definiert sein muss, sondern nur auf einem Teilraum \(D_T\). Genau diese Freiheit wird gleich gebraucht: der Ableitungsoperator aus Beispiel ⑤ bildet von \(E=C\) nach \(F=C\) ab, ist aber nur auf dem echten Teilraum \(D_T=C^1\) von \(E\) erklärt.</p><p>Dass \(D_T\) eine <i>lineare</i> Teilmenge sein muss, ist keine Schikane: die Gleichung \(T(\alpha x+\beta y)=\alpha Tx+\beta Ty\) ist überhaupt nur sinnvoll, wenn mit \(x,y\in D_T\) auch \(\alpha x+\beta y\in D_T\) liegt. Setzt man dort \(\alpha=\beta=0\), so folgt sofort \(\mathbf{0}_E\in D_T\) und \(T\mathbf{0}_E=\mathbf{0}_F\). Diese kleine Anmerkung ist der schnellste Nichtlinearitätstest überhaupt: bildet eine Abbildung die Null nicht auf die Null ab, kann sie nicht linear sein. Umgekehrt ist \(T\mathbf{0}_E=\mathbf{0}_F\) nur notwendig, nicht hinreichend.</p><p>Beachten Sie die Schreibweise der Vorlesung: die Anwendung eines Operators wird <i>ohne</i> Klammern notiert, also \(Tx\), \(T_\varphi f\), \(\delta_y f\). Klammern stehen nur, wenn das Argument selbst zusammengesetzt ist, etwa \(T(\alpha x+\beta y)\), oder wenn das Ergebnis noch ausgewertet wird, etwa \((T_\varphi f)(x)\).</p>`,
        erfuellt: String.raw`<p><b>Beispiel ③ der Vorlesung (Multiplikationsoperator).</b> Sei \(D_T=E=F=C([0,1],\mathbb{K})\) und \(\varphi\in C([0,1],\mathbb{K})\) fest. Definiere</p>\[(T_\varphi f)(x)=\varphi(x)\cdot f(x),\qquad x\in[0,1].\]<p>Da mit \(\varphi\) und \(f\) auch das Produkt stetig ist, gilt tatsächlich \(T_\varphi:C([0,1],\mathbb{K})\to C([0,1],\mathbb{K})\). Nachweis der Linearität für \(f,g\in C([0,1],\mathbb{K})\) und \(\alpha,\beta\in\mathbb{K}\), punktweise gerechnet:</p>\[\big(T_\varphi(\alpha f+\beta g)\big)(x)=\varphi(x)\cdot(\alpha f+\beta g)(x)=\varphi(x)\big(\alpha f(x)+\beta g(x)\big)\]\[=\alpha\,\varphi(x)f(x)+\beta\,\varphi(x)g(x)=\alpha\,(T_\varphi f)(x)+\beta\,(T_\varphi g)(x)=\big(\alpha T_\varphi f+\beta T_\varphi g\big)(x).\]<p>Da dies für jedes \(x\in[0,1]\) gilt, sind die beiden Funktionen gleich, also \(T_\varphi(\alpha f+\beta g)=\alpha T_\varphi f+\beta T_\varphi g\). Somit ist \(T_\varphi\) ein linearer Operator. Der Test an der Null bestätigt das: \((T_\varphi\mathbf{0}_E)(x)=\varphi(x)\cdot 0=0\), also \(T_\varphi\mathbf{0}_E=\mathbf{0}_F\).</p>`,
        verletzt: String.raw`<p><b>(a) Der Null-Test schlägt sofort an.</b> Sei \(E=F=\mathbb{K}\) und \(Ax=x+1\). Dann ist \(A\mathbf{0}_E=A0=1\neq 0=\mathbf{0}_F\). Nach der Anmerkung kann \(A\) also nicht linear sein. Direkt nachgerechnet: \(A(2\cdot 3)=A6=7\), aber \(2\cdot A3=2\cdot 4=8\). Affine Abbildungen sind eben keine linearen.</p><p><b>(b) Der Null-Test reicht nicht immer.</b> Sei \(E=F=C([0,1],\mathbb{R})\) und \((Sf)(x)=\big(f(x)\big)^2\). Hier gilt zwar \(S\mathbf{0}_E=\mathbf{0}_F\), aber die Homogenität scheitert: für \(\alpha\in\mathbb{R}\) ist</p>\[\big(S(\alpha f)\big)(x)=\big(\alpha f(x)\big)^2=\alpha^2\big(f(x)\big)^2=\alpha^2\,(Sf)(x).\]<p>Mit \(f\equiv 1\) und \(\alpha=2\) folgt \(S(2f)\equiv 4\), aber \(2\,Sf\equiv 2\); wegen \(4\neq 2\) ist \(S\) nicht linear. Ebenso scheitert die Additivität: für \(f=g\equiv 1\) ist \(S(f+g)\equiv 4\), aber \(Sf+Sg\equiv 2\).</p>`,
        plus: String.raw`<p><b>Notation.</b> Die Vorlesung schreibt für den Nullvektor eine durchgestrichene (doppelt geschriebene) Null mit Raum-Index, um ihn vom Skalar \(0\) zu unterscheiden. Da KaTeX dieses Zeichen nicht kennt, steht hier durchgängig \(\mathbf{0}_E\), \(\mathbf{0}_F\), \(\mathbf{0}_n\) — gemeint ist immer der Nullvektor des jeweiligen Raums. Ebenso schreibt die Tafel für die Identität eine doppelt gestrichene Eins; hier steht \(\mathbf{1}\).</p><p><b>Roter Faden.</b> Die Linearität allein ist harmlos; das ganze Kapitel dreht sich darum, wann ein linearer Operator zusätzlich <i>stetig</i> ist (<a href="#/7.2.2">7.2.2</a>) beziehungsweise gleichbedeutend <i>beschränkt</i> (<a href="#/7.2.3">7.2.3</a>). In endlicher Dimension ist das automatisch erfüllt, in Funktionenräumen nicht — und genau dieser Unterschied ist der Grund, warum die Fréchet-Ableitung in §7.3 als Element von \(\mathcal{L}(E,F)\) und nicht bloß als irgendeine lineare Abbildung definiert wird.</p>`}},
       {id:"7.2.2", title:"Stetigkeit — Prüfung genügt im Nullpunkt", body:{
        def: String.raw`<p>Sei \(T:D_T\subset E\to F\) linear. \(T\) heißt <b>stetig in \(y\in D_T\)</b>, falls</p>\[\forall_{\varepsilon>0}\ \exists_{\delta_\varepsilon>0}\ \forall_{x\in D_T,\ \|x-y\|_E\le\delta_\varepsilon}\quad \|Tx-Ty\|_F<\varepsilon,\]<p>gleichbedeutend (Folgenkriterium): für jede Folge \(x_n\in D_T\) mit \(x_n\to y\) bezüglich \(\|\cdot\|_E\) folgt \(Tx_n\to Ty\) bezüglich \(\|\cdot\|_F\).</p><p><b>Satz.</b> Sei \(T:D_T\subset E\to F\) linear. Dann gilt</p><p>(1) \(T\) ist in einem beliebigen \(y\in D_T\) stetig \(\ \Longleftrightarrow\ \) (2) \(T\) ist in \(y=\mathbf{0}_E\) stetig.</p><p><b>Beweis (1) \(\Rightarrow\) (2).</b> Sei \(x_n\in D_T\) mit \(x_n\to\mathbf{0}_E\) in \(\|\cdot\|_E\).</p><ul><li>Setze \(y_n=y+x_n\in D_T\), also \(x_n=y_n-y\). Dann ist \(\|y_n-y\|_E=\|x_n\|_E\to 0\), d.h. \(y_n\to y\) in \(\|\cdot\|_E\).</li><li>\(T\) ist stetig in \(y\), also \(Ty_n\to Ty\) in \(\|\cdot\|_F\).</li><li>Mit der Linearität folgt \(Tx_n=T(y_n-y)=Ty_n-Ty\), und wegen \(Ty_n\to Ty\) somit \(Tx_n\to\mathbf{0}_F=T\mathbf{0}_E\).</li></ul><p>Die Richtung (2) \(\Rightarrow\) (1) verläuft ebenso (Hausaufgabe): man verschiebt die Folge um \(y\) zurück. \(\ \blacksquare\)</p><p><b>Anmerkung.</b> Somit kann man die Stetigkeit von \(T\) auf ganz \(D_T\) allein im Punkt \(\mathbf{0}_E\in D_T\) prüfen.</p>`,
        worte: String.raw`<p>Für allgemeine Funktionen ist Stetigkeit eine punktweise Eigenschaft: eine Funktion kann in einem Punkt stetig sein und im nächsten springen. Für <i>lineare</i> Operatoren kollabiert diese Vielfalt vollständig — ein linearer Operator ist entweder überall stetig oder nirgends. Der Grund ist die Translationsstruktur: der Zuwachs \(Tx-Ty=T(x-y)\) hängt nur von der Differenz \(x-y\) ab, nicht davon, wo man sitzt. Verschiebt man also den Testpunkt vom Nullpunkt an eine beliebige Stelle \(y\), passiert mit den Differenzen gar nichts.</p><p>Der Beweis macht genau das sichtbar: eine Nullfolge \(x_n\) wird durch \(y_n=y+x_n\) in eine Folge mit Grenzwert \(y\) verwandelt und nach Anwendung von \(T\) durch Subtraktion von \(Ty\) wieder zurückverschoben. Die Linearität ist die einzige Zutat.</p><p>Der praktische Gewinn ist enorm: statt für jedes \(y\in D_T\) ein \(\delta_\varepsilon\) zu suchen, genügt <i>ein</i> Test im Nullpunkt. Konkret heißt das: man nimmt eine beliebige Folge \(x_n\to\mathbf{0}_E\) und prüft, ob \(\|Tx_n\|_F\to 0\) gilt. Findet man eine einzige Nullfolge, deren Bild nicht gegen \(\mathbf{0}_F\) geht, ist \(T\) in <i>keinem</i> Punkt stetig. Genau aus dieser Beobachtung wird in <a href="#/7.2.3">7.2.3</a> das noch bequemere Kriterium „stetig \(\Leftrightarrow\) beschränkt“.</p>`,
        erfuellt: String.raw`<p><b>Beispiel ④ der Vorlesung (Auswertungsfunktional).</b> Sei \(D_T=E=C([0,1],\mathbb{K})\) mit \(\|f\|_C=\max_{x\in[0,1]}|f(x)|\), \(F=\mathbb{K}\) und \(y\in[0,1]\) fest. Setze \(\delta_y f=f(y)\).</p><p><b>Test im Nullpunkt.</b> Sei \(f_n\in C([0,1],\mathbb{K})\) mit \(f_n\to\mathbf{0}_E\) in \(\|\cdot\|_C\), also \(\|f_n\|_C\to 0\). Dann</p>\[|\delta_y f_n-\delta_y\mathbf{0}_E|=|f_n(y)-0|=|f_n(y)|\le\max_{x\in[0,1]}|f_n(x)|=\|f_n\|_C\ \longrightarrow\ 0.\]<p>Also ist \(\delta_y\) stetig in \(\mathbf{0}_E\), und nach dem Satz damit in <i>jedem</i> \(g\in C([0,1],\mathbb{K})\) stetig.</p><p><b>Kontrolle mit \(\varepsilon\)-\(\delta\) an beliebiger Stelle \(g\).</b> Zu \(\varepsilon>0\) wähle \(\delta_\varepsilon=\tfrac{\varepsilon}{2}\). Für \(f\in C([0,1],\mathbb{K})\) mit \(\|f-g\|_C\le\delta_\varepsilon\) gilt</p>\[|\delta_y f-\delta_y g|=|f(y)-g(y)|\le\|f-g\|_C\le\tfrac{\varepsilon}{2}<\varepsilon.\]<p>Das Verschieben des Basispunktes von \(\mathbf{0}_E\) nach \(g\) ändert an der Rechnung tatsächlich nichts — genau die Aussage des Satzes.</p>`,
        verletzt: String.raw`<p><b>Beispiel ⑤ der Vorlesung (Ableitungsoperator).</b> Sei \(E=F=C([0,1],\mathbb{R})\) mit \(\|\cdot\|_C\) und \(D_T=C^1([0,1],\mathbb{R})\), sowie</p>\[(Tf)(x)=\frac{df(x)}{dx}\in C([0,1],\mathbb{R})\quad\text{für } f\in C^1([0,1],\mathbb{R}).\]<p>An der Tafel wurden die Testfunktionen \(f_n(x)=\sin(n\pi x)\), \(n\in\mathbb{N}\), benutzt:</p>\[(Tf_n)(x)=\frac{d}{dx}\sin(n\pi x)=n\pi\cos(n\pi x),\qquad \|f_n\|_E=\|f_n\|_C=1,\qquad \|Tf_n\|_F=\|f_n'\|_C=n\pi.\]<p><b>Nullfolge bauen.</b> Die \(f_n\) selbst sind keine Nullfolge; normiert man aber \(g_n:=\tfrac1n f_n\in C^1([0,1],\mathbb{R})\), so gilt</p>\[\|g_n\|_E=\frac{1}{n}\|f_n\|_C=\frac{1}{n}\ \longrightarrow\ 0,\qquad\text{also } g_n\to\mathbf{0}_E \text{ in } \|\cdot\|_E,\]\[(Tg_n)(x)=\frac{1}{n}\cdot n\pi\cos(n\pi x)=\pi\cos(n\pi x),\qquad \|Tg_n\|_F=\pi.\]<p>Es ist also \(\|Tg_n-T\mathbf{0}_E\|_F=\|Tg_n\|_F=\pi\) für alle \(n\); die Bildfolge konvergiert nicht gegen \(\mathbf{0}_F\). Damit ist \(T\) in \(\mathbf{0}_E\) unstetig — und nach dem Satz in <i>keinem</i> Punkt von \(D_T\) stetig, obwohl \(T\) linear ist. Die Vorlesung notiert kurz: „nicht stetig, unbeschränkt“.</p>`,
        plus: String.raw`<p><b>Klausurfalle.</b> „Stetig in einem Punkt“ und „stetig auf \(D_T\)“ sind für lineare Operatoren dasselbe. Wer bei einer Aufgabe an einer beliebigen Stelle \(y\) mit \(\varepsilon\)-\(\delta\) hantiert, macht unnötige Arbeit: nach diesem Satz genügt der Nullpunkt, und nach <a href="#/7.2.3">7.2.3</a> genügt sogar eine einzige Ungleichung \(\|Tx\|_F\le C\|x\|_E\).</p><p><b>Zum Trick mit der Nullfolge.</b> Der Übergang von \(f_n\) zu \(g_n=\tfrac1n f_n\) im Gegenbeispiel ist dasselbe Skalierungsargument, mit dem im Beweis von <a href="#/7.2.3">7.2.3</a> aus einer unbeschränkten Familie eine Nullfolge mit nicht verschwindenden Bildern gemacht wird. Merken: bei linearen Operatoren darf man Testvektoren beliebig umskalieren, ohne den Quotienten \(\|Tx\|_F/\|x\|_E\) zu ändern.</p><p><b>Notation.</b> Die Vorlesung schreibt in der Quantorenzeile \(\|x-y\|_E\le\delta_\varepsilon\) (mit \(\le\)) und \(\|Tx-Ty\|_F<\varepsilon\); ob man an diesen beiden Stellen \(<\) oder \(\le\) verwendet, ist für die Definition gleichgültig. Der Index an \(\delta_\varepsilon\) betont die Abhängigkeit von \(\varepsilon\).</p>`}},
       {id:"7.2.3", title:"Beschränktheit: stetig ⇔ beschränkt", body:{
        def: String.raw`<p><b>Definition.</b> Sei \(T:D_T\subset E\to F\) linear. \(T\) heißt <b>beschränkt</b>, falls ein \(C\in\mathbb{R}\) existiert mit</p>\[\|Tx\|_F\le C\cdot\|x\|_E,\qquad x\in D_T.\]<p><b>Satz.</b> \(T:D_T\subset E\to F\) linear ist stetig auf \(D_T\) \(\ \Longleftrightarrow\ \) \(T\) ist beschränkt.</p><p><b>Beweis „\(\Leftarrow\)“ (beschränkt \(\Rightarrow\) stetig).</b> Nach <a href="#/7.2.2">7.2.2</a> genügt die Stetigkeit in \(\mathbf{0}_E\). Sei \(x_n\in D_T\) mit \(x_n\to\mathbf{0}_E\) in \(\|\cdot\|_E\). Dann</p>\[\|Tx_n\|_F\le C\cdot\|x_n\|_E\ \longrightarrow\ 0\quad(n\to\infty),\]<p>also \(\|Tx_n\|_F\to 0\) in \(\mathbb{R}\) und damit \(Tx_n\to\mathbf{0}_F=T\mathbf{0}_E\) in \(\|\cdot\|_F\). Somit ist \(T\) stetig in \(\mathbf{0}_E\).</p><p><b>Beweis „\(\Rightarrow\)“ (Gegenannahme).</b> Sei \(T\) stetig, aber nicht beschränkt, d.h.</p>\[\forall_{k\in\mathbb{N}}\ \exists_{x_k\in D_T,\ x_k\neq\mathbf{0}_E}\quad \|Tx_k\|_F>k\,\|x_k\|_E.\]<ul><li><b>Schritt 1 (normieren).</b> \(y_k=x_k/\|x_k\|_E\in D_T\) erfüllt \(\|y_k\|_E=\tfrac{1}{\|x_k\|_E}\|x_k\|_E=1\).</li><li><b>Schritt 2 (Quotient benennen).</b> \(\|Ty_k\|_F=\big\|T\tfrac{x_k}{\|x_k\|_E}\big\|_F=\dfrac{\|Tx_k\|_F}{\|x_k\|_E}=:A_k>k\).</li><li><b>Schritt 3 (herunterskalieren).</b> \(z_k=y_k/A_k\in D_T\) erfüllt \(\|z_k\|_E=\dfrac{\|y_k\|_E}{A_k}<\dfrac1k\to 0\), also \(z_k\to\mathbf{0}_E\). Wegen der Stetigkeit in \(\mathbf{0}_E\) müsste \(Tz_k\to\mathbf{0}_F=T\mathbf{0}_E\) gelten.</li><li><b>Widerspruch.</b> Aber \(\|Tz_k\|_F=\big\|T\tfrac{y_k}{A_k}\big\|_F=\dfrac{\|Ty_k\|_F}{A_k}=\dfrac{A_k}{A_k}=1\) für alle \(k\), also \(\|Tz_k\|_F=1\) und \(Tz_k\) konvergiert nicht gegen \(\mathbf{0}_F\). Widerspruch. \(\ \blacksquare\)</li></ul>`,
        worte: String.raw`<p>Der Name „beschränkt“ ist irreführend und die häufigste Verwechslung in diesem Abschnitt: gemeint ist <i>nicht</i>, dass das Bild \(T(D_T)\) eine beschränkte Menge ist. Ein linearer Operator mit beschränktem Bild wäre nämlich zwangsläufig der Nulloperator, denn mit \(x\) liegt auch \(\lambda x\) im Definitionsbereich und \(\|T(\lambda x)\|_F=|\lambda|\,\|Tx\|_F\) wächst über alle Grenzen. Gemeint ist vielmehr: der <i>Streckfaktor</i> ist beschränkt. \(T\) darf Vektoren verlängern, aber höchstens um einen festen, von \(x\) unabhängigen Faktor \(C\).</p><p>Der Satz ersetzt damit eine analytische Eigenschaft (Grenzwerte) durch eine algebraische Ungleichung — das ist der eigentliche Grund, warum man mit linearen Operatoren so bequem rechnen kann. Die Richtung „beschränkt \(\Rightarrow\) stetig“ ist eine Zeile: die Abschätzung drückt \(\|Tx_n\|_F\) durch \(\|x_n\|_E\) nach unten in die Null.</p><p>Die Rückrichtung ist der interessante Teil. Man nimmt an, es gäbe keine Konstante; dann gibt es zu jedem \(k\) einen Vektor \(x_k\), der um mehr als den Faktor \(k\) gestreckt wird. Der Trick besteht aus zwei Umskalierungen, die den Quotienten \(A_k=\|Tx_k\|_F/\|x_k\|_E\) unangetastet lassen: erst auf Länge \(1\) normieren, dann durch \(A_k\) teilen. Das Ergebnis \(z_k\) ist beliebig kurz (Länge \(<1/k\)), sein Bild hat aber exakt die Länge \(1\). Eine Nullfolge mit Bildern der Länge \(1\) widerspricht der Stetigkeit im Nullpunkt. Kurz: Unbeschränktheit lässt sich immer in die Null hinein zusammenschieben.</p>`,
        erfuellt: String.raw`<p><b>Beispiel ① der Vorlesung (Multiplikation mit einem Skalar).</b> \(D_T=E=F=\mathbb{K}\), \(Tx=c\cdot x\) mit festem \(c\in\mathbb{K}\). Dann</p>\[|Tx|=|c\cdot x|=|c|\cdot|x|\le C\cdot|x|\quad\text{mit }C:=|c|.\]<p>\(T\) ist also stets beschränkt, damit nach dem Satz stetig. (\(C=|c|\) ist sogar die kleinstmögliche Konstante, siehe <a href="#/7.2.5">7.2.5</a>.)</p><p><b>Beispiel ② der Vorlesung (Matrixoperator), Hausaufgabe.</b> \(D_T=E=\mathbb{K}^m\), \(F=\mathbb{K}^n\), \(Tx=Ax\) mit</p>\[Ax=\begin{pmatrix} a_{11} & \dots & a_{1m}\\ \vdots & & \vdots\\ a_{n1} & \dots & a_{nm}\end{pmatrix}\begin{pmatrix} x_1\\ \vdots\\ x_m\end{pmatrix},\qquad a_{k\ell}\in\mathbb{K}.\]<p>Mit der euklidischen Norm und der Cauchy-Schwarz-Ungleichung gilt für die \(k\)-te Komponente</p>\[\Big|\sum_{\ell=1}^{m}a_{k\ell}x_\ell\Big|^2\le\Big(\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)\Big(\sum_{\ell=1}^{m}|x_\ell|^2\Big)=\Big(\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)\|x\|^2,\]<p>und nach Summation über \(k=1,\dots,n\)</p>\[\|Ax\|^2\le\Big(\sum_{k=1}^{n}\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)\|x\|^2,\qquad\text{also}\qquad \|Ax\|\le C\,\|x\|,\quad C=\Big(\sum_{k=1}^{n}\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)^{1/2}.\]<p>Konkret für \(A=\begin{pmatrix}1&2\\0&1\end{pmatrix}\): \(C=\sqrt{1+4+0+1}=\sqrt6\). Damit ist \(T:\mathbb{K}^m\to\mathbb{K}^n\) für alle \(n,m\in\mathbb{N}\) automatisch beschränkt, also stetig.</p>`,
        verletzt: String.raw`<p><b>Beispiel ⑤ der Vorlesung (Ableitungsoperator auf \(C\)).</b> \(E=F=C([0,1],\mathbb{R})\) mit \(\|\cdot\|_C\), \(D_T=C^1([0,1],\mathbb{R})\), \((Tf)(x)=\dfrac{df(x)}{dx}\).</p><p>Angenommen, es gäbe ein \(C\in\mathbb{R}\) mit \(\|Tf\|_C\le C\|f\|_C\) für alle \(f\in C^1([0,1],\mathbb{R})\). Teste mit \(f_n(x)=\sin(n\pi x)\), \(n\in\mathbb{N}\):</p>\[\|f_n\|_E=\|f_n\|_C=\max_{x\in[0,1]}|\sin(n\pi x)|=1,\]\[(Tf_n)(x)=n\pi\cos(n\pi x),\qquad \|Tf_n\|_F=\|f_n'\|_C=\max_{x\in[0,1]}|n\pi\cos(n\pi x)|=n\pi.\]<p>Die angenommene Ungleichung lieferte \(n\pi\le C\cdot 1\) für <i>alle</i> \(n\in\mathbb{N}\) — unmöglich, da \(n\pi\to\infty\). Der Quotient</p>\[\frac{\|Tf_n\|_F}{\|f_n\|_E}=n\pi\ \longrightarrow\ \infty\]<p>ist unbeschränkt. Also ist \(T\) nicht beschränkt und nach dem Satz auch nicht stetig.</p><p><b>Abgleich mit dem Beweis.</b> Hier ist \(A_n=\dfrac{\|Tf_n\|_F}{\|f_n\|_E}=n\pi\) und \(y_n=f_n/\|f_n\|_E=f_n\). Die im Beweis konstruierte Folge ist also \(z_n=y_n/A_n=\dfrac{1}{n\pi}f_n\) mit</p>\[\|z_n\|_E=\frac{1}{n\pi}\to 0,\qquad \|Tz_n\|_F=\frac{n\pi}{n\pi}=1.\]<p>Das Gegenbeispiel in <a href="#/7.2.2">7.2.2</a> benutzt die etwas gröbere Skalierung \(g_n=\tfrac1n f_n\) — dort wird nur durch \(n\) statt durch \(A_n=n\pi\) geteilt, und deshalb ist \(\|Tg_n\|_F=\pi\) statt \(1\). Beide Folgen sind Nullfolgen mit nicht verschwindenden Bildern und widerlegen die Stetigkeit in \(\mathbf{0}_E\) gleichermaßen.</p>`,
