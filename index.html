function implizitHtml(){ return String.raw`
<p class="sub">Handwerkszeug zu §7.10 und §7.11: der Fixpunktsatz von Banach als Existenz- und Rechenmaschine, der Satz über implizite Funktionen als Antwort auf die Frage „wann beschreibt \(\Phi(x,y)=0\) lokal einen Graphen?“ und der Umkehrsatz als dessen Spezialfall. Links steht die Formel, rechts die Voraussetzung; in den Klappkästen steht der vollständige Rechenweg.</p>

<div class="twocol">
  <div class="refblock">
    <h3>Kontraktion &amp; Fixpunktsatz</h3>
    <table class="reftable">
      <tr><td><b>Kontraktion.</b> \(T:M\to M\) heißt Kontraktion, wenn ein \(\alpha<1\) existiert mit \[d(Tx,Ty)\;\le\;\alpha\cdot d(x,y)\qquad\text{für alle }x,y\in M.\]</td><td class="cond">\((M,d)\) metrischer Raum</td></tr>
      <tr><td><b>Satz (Banach).</b> Ist \((M,d)\) vollständig, \(M\neq\emptyset\), und \(T:M\to M\) eine Kontraktion, so existiert <b>genau ein</b> \(x^*\in M\) mit \[Tx^*=x^*.\] Lösungen von \(Tx=x\) heißen Fixpunkte.</td><td class="cond">Existenz <i>und</i> Eindeutigkeit in einem Satz</td></tr>
      <tr><td><b>Prüfschema — immer in dieser Reihenfolge:</b><ul><li>(1) \(M\neq\emptyset\) und \(M\) <b>vollständig</b>. Bequemster Fall: \(M\) abgeschlossene Teilmenge eines vollständigen Raums.</li><li>(2) <b>Selbstabbildung</b> \(T(M)\subseteq M\).</li><li>(3) <b>Uniformes</b> \(\alpha<1\) bestimmen, gültig für alle Paare \(x,y\).</li><li>(4) Erst danach iterieren und abschätzen.</li></ul><span class="when">Punkt (2) wird am häufigsten vergessen — ohne ihn ist schon \(x_2=Tx_1\) gar nicht definiert</span></td></tr>
      <tr><td><b>Warum genau diese Voraussetzungen?</b> Jede einzelne kippt den Satz: „\(d(Tx,Ty) < d(x,y)\) für \(x\neq y\)“ genügt <i>nicht</i>, und ohne Vollständigkeit fehlt der Grenzwert in \(M\).
      ${exBox(String.raw`<p><b>(a) „Echt kleiner“ genügt nicht.</b> \(M=\left[1,\infty\right[\) mit \(d(x,y)=|x-y|\), \(Tx=x+\frac1x\). \(M\) ist abgeschlossen in \(\mathbb{R}\), also vollständig, und für \(x\ge1\) ist \(Tx\ge1\), also \(T(M)\subseteq M\). Für \(1\le x < y\):</p>
      \[Ty-Tx=(y-x)+\Big(\frac1y-\frac1x\Big)=(y-x)\Big(1-\frac{1}{xy}\Big),\qquad 0<1-\frac{1}{xy}<1,\]
      <p>also \(0 < d(Tx,Ty) < d(x,y)\) für alle \(x\neq y\). Trotzdem keine Kontraktion: mit \(x=n\), \(y=n+1\) ist</p>
      \[\frac{d(Tx,Ty)}{d(x,y)}=1-\frac{1}{n(n+1)}\;\longrightarrow\;1\qquad(n\to\infty),\]
      <p>das Supremum der Quotienten ist \(1\), ein \(\alpha<1\) existiert nicht. Und tatsächlich: \(Tx=x\iff\frac1x=0\) ist unlösbar, es gibt keinen Fixpunkt.</p>
      <p><b>(b) Fehlende Vollständigkeit.</b> \(M=\left]0,1\right]\), \(Tx=\frac{x}{2}\). Hier ist \(T(M)=\left]0,\tfrac12\right]\subset M\) und \(|Tx-Ty|=\tfrac12|x-y|\), also Kontraktion mit \(\alpha=\tfrac12\). Dennoch: \(x=\frac x2\iff x=0\notin M\), kein Fixpunkt. Die Iterationsfolge \(x_k=2^{-k}\) ist Cauchy, ihr Grenzwert \(0\) liegt nur nicht mehr in \(M\).</p>`,"Zwei Gegenbeispiele — was ohne uniformes α bzw. ohne Vollständigkeit schiefgeht")}</td></tr>
      <tr><td><b>Der Eindeutigkeits-Kniff</b> (Standardtrick, überall verwendbar): aus \(0\le t\le\alpha t\) mit \(\alpha<1\) folgt \(t=0\). Hier mit \(t=d(x^*,x^{**})=d(Tx^*,Tx^{**})\le\alpha\,d(x^*,x^{**})\).<span class="when">Immer wenn eine nichtnegative Größe sich selbst mit Faktor \(<1\) beschränkt — vgl. <a href="#/ref/beweise">Beweistricks</a></span></td></tr>
      <tr><td>Der Fixpunkt hängt <b>nicht vom Startwert</b> ab: \(\lim_{n\to\infty}T^nx_0\) ist für jedes \(x_0\in M\) dasselbe \(x^*\).</td><td class="cond">folgt aus der Eindeutigkeit</td></tr>
    </table>
  </div>
  <div class="refblock">
    <h3>Iteration &amp; Fehlerabschätzung</h3>
    <table class="reftable">
      <tr><td><b>Verfahren.</b> \(x_0\in M\) beliebig wählen und iterieren \[x_{n+1}=Tx_n,\qquad x^*=\lim_{n\to\infty}x_n=\lim_{n\to\infty}T^nx_0.\]<span class="when">Bequemsten Startwert nehmen — das Ergebnis ist dasselbe</span></td><td class="cond">Beweis ist konstruktiv</td></tr>
      <tr><td><b>Grundabschätzung.</b> Die Schrittlängen bilden eine geometrische Nullfolge: \[d(x_k,x_{k-1})\le\alpha^{k-1}d(x_1,x_0),\qquad d(x_n,x_m)\le\frac{\alpha^{m}}{1-\alpha}\,d(x_1,x_0).\]</td><td class="cond">\(n>m\); der <i>kleinere</i> Index zählt</td></tr>
      <tr><td><b>A-priori-Fehlerabschätzung</b> (Grenzübergang \(n\to\infty\) bei festem \(m\)): \[d(x^*,x_m)\;\le\;\frac{\alpha^{m}}{1-\alpha}\,d(x_1,x_0)\qquad\text{für alle }m\in\mathbb{N}.\]<span class="when">Zum <b>Planen</b>: rechts steht nur der erste Schritt, man kennt die Schrittzahl vorab</span></td><td class="cond">\(\alpha\in\left]0,1\right[\)</td></tr>
      <tr><td><b>A-posteriori-Fehlerabschätzung</b> (dieselbe Formel auf die verschobene Iteration \(\tilde x_0=x_{m-1}\) angewandt): \[d(x^*,x_m)\;\le\;\frac{\alpha}{1-\alpha}\,d(x_m,x_{m-1}),\qquad m\ge1.\]<span class="when">Zum <b>Abnehmen</b> des Ergebnisses: benutzt den zuletzt gemachten Schritt, meist erheblich schärfer</span></td></tr>
      <tr><td><b>Schrittzahl planen.</b> Genauigkeit \(\varepsilon>0\) gefordert: kleinstes \(m\) mit \(\dfrac{\alpha^m}{1-\alpha}d(x_1,x_0)\le\varepsilon\), also \[m\;\ge\;\frac{\ln\varepsilon-\ln\frac{d(x_1,x_0)}{1-\alpha}}{\ln\alpha}.\]<span class="when">Logarithmieren dreht die Ungleichung, weil \(\ln\alpha<0\)</span></td></tr>
      <tr><td><b>Vollständig durchgerechnet:</b> \(\sqrt2\) als Fixpunkt (Heron-Verfahren) — Prüfschema, Iteration, beide Fehlerschranken.
      ${exBox(String.raw`<p>Gesucht \(\sqrt2\). Ansatz \[M=[1,2],\qquad d(x,y)=|x-y|,\qquad Tx=\frac12\Big(x+\frac2x\Big).\]</p>
      <p><b>Schritt A (Raum).</b> \([1,2]\) ist abgeschlossen in \(\mathbb{R}\), also vollständig, und nicht leer.</p>
      <p><b>Schritt B (Selbstabbildung).</b> Für \(x\in[1,2]\) ist \[Tx-\sqrt2=\frac{x^2-2\sqrt2\,x+2}{2x}=\frac{(x-\sqrt2)^2}{2x}\ge0,\] also \(Tx\ge\sqrt2\ge1\); nach oben \(x\le2\) und \(\frac2x\le2\), somit \(Tx\le\frac12(2+2)=2\). Insgesamt \(T([1,2])\subseteq[\sqrt2,2]\subset[1,2]\).</p>
      <p><b>Schritt C (Kontraktionskonstante).</b> Für \(x,y\in[1,2]\) ist \[Tx-Ty=\frac12\Big[(x-y)+2\Big(\frac1x-\frac1y\Big)\Big]=\frac12\,(x-y)\Big(1-\frac{2}{xy}\Big).\] Wegen \(1\le xy\le4\) ist \(\tfrac12\le\frac{2}{xy}\le2\), also \(\big|1-\frac{2}{xy}\big|\le1\) und damit \(|Tx-Ty|\le\tfrac12|x-y|\): Kontraktion mit \(\alpha=\tfrac12\).</p>
      <p><b>Schritt D (Satz greift).</b> Es gibt genau ein \(x^*\in[1,2]\) mit \(Tx^*=x^*\), und \[x=\frac12\Big(x+\frac2x\Big)\iff x^2=2\iff x^*=\sqrt2.\]</p>
      <p><b>Schritt E (Iteration, \(x_0=2\)).</b> \[x_1=\frac12(2+1)=\frac32,\qquad x_2=\frac12\Big(\frac32+\frac43\Big)=\frac{17}{12}\approx1{,}41667,\qquad x_3=\frac12\Big(\frac{17}{12}+\frac{24}{17}\Big)=\frac{577}{408}\approx1{,}4142157.\]</p>
      <p><b>Schritt F (a priori).</b> \(d(x_1,x_0)=\big|\tfrac32-2\big|=\tfrac12\) und \(\frac{1}{1-\alpha}=2\), also \[\big|\sqrt2-x_m\big|\le\frac{\alpha^m}{1-\alpha}\,d(x_1,x_0)=\Big(\frac12\Big)^m\cdot2\cdot\frac12=2^{-m}.\] Für \(m=3\): \(\big|\sqrt2-x_3\big|\le\tfrac18=0{,}125\).</p>
      <p><b>Schritt G (a posteriori).</b> \(d(x_3,x_2)=\big|\frac{577}{408}-\frac{17}{12}\big|=\frac{1}{408}\) und \(\frac{\alpha}{1-\alpha}=1\), also \(\big|\sqrt2-x_3\big|\le\frac{1}{408}\approx2{,}5\cdot10^{-3}\) — statt \(0{,}125\). Der wahre Fehler ist sogar \(\approx2{,}1\cdot10^{-6}\).</p>
      <p><b>Schritt H (Schrittzahl).</b> \(2^{-m}\le10^{-3}\iff2^m\ge1000\iff m\ge10\) (wegen \(2^{10}=1024\)) — und das steht fest, <i>bevor</i> man rechnet.</p>`,"Rechenbeispiel — Wurzelziehen als Fixpunktiteration")}</td></tr>
      <tr><td><b>Klausurfalle.</b> Die Schranke ist eine <b>Garantie, keine Prognose</b>: das Heron-Verfahren ist in Wahrheit ein quadratisch konvergentes Newton-Verfahren, der Fixpunktsatz sieht davon nichts. Und \(\frac{1}{1-\alpha}\) stammt aus der <i>unendlichen</i> geometrischen Reihe, ist also nur wegen \(\alpha<1\) endlich.</td></tr>
    </table>
  </div>
</div>

<div class="refblock">
  <h3>Satz über implizite Funktionen</h3>
  <p class="sub">Kernfrage von §7.11: Gegeben \(\Phi(x,y)=0\) — gibt es eine Funktion \(y=y(x)\), deren Graph lokal genau die Lösungsmenge ist?</p>
  <table class="reftable">
    <tr><td><b>Problemstellung.</b> \(E,F,G\) Banachräume, \(E\times F\) mit \(\|(x,y)\|_{E\times F}=\|x\|_E+\|y\|_F\), \(V\subset E\times F\) offen, \((x_0,y_0)\in V\), \(\Phi:V\to G\) mit \(\Phi(x_0,y_0)=\mathbf{0}_G\). Gesucht: Auflösung von \(\Phi(x,y)=\mathbf{0}_G\) nach \(y\).</td><td class="cond">Endlichdimensional: \(\Phi:\mathbb{R}^m\times\mathbb{R}^n\to\mathbb{R}^n\), also \(n\) Gleichungen für \(n\) Unbekannte \(y_1,\dots,y_n\)</td></tr>
    <tr><td><b>Motivation (Kreis).</b> \(\Phi(x,y)=x^2+y^2-r^2\). <b>Global unmöglich</b> — über \(|x| < r\) liegen zwei Lösungen, über \(|x|>r\) keine. <b>Lokal möglich</b> — aber nur in Punkten mit \(\Phi_y(x_0,y_0)=2y_0\neq0\).
    ${exBox(String.raw`<p><b>Global.</b> Aus \(x^2+y^2=r^2\) folgt \(y=\pm\sqrt{r^2-x^2}\): über jedem \(|x| < r\) zwei Punkte, über \(|x|>r\) keiner. Die Lösungsmenge ist kein Funktionsgraph.</p>
    <p><b>Lokal auflösbar in \((x_0,y_0)=(0,r)\).</b> Kandidat \(f(x)=\sqrt{r^2-x^2}\) (Pluszweig, weil \(y_0=r>0\)). Fenster \(\varepsilon=\delta=\tfrac r2\): für \(|x|<\tfrac r2\) ist \(r^2-x^2>\tfrac34r^2\), also \[\tfrac{\sqrt3}{2}\,r < f(x)\le r,\qquad |f(x)-r|<\Big(1-\tfrac{\sqrt3}{2}\Big)r\approx0{,}134\,r<\tfrac r2,\] d.h. \(f:U_{r/2}(0)\to U_{r/2}(r)\). Bedingung (1): \(\Phi(x,f(x))=x^2+(r^2-x^2)-r^2=0\). Bedingung (2): ist \((x,y)\) im Fenster mit \(\Phi(x,y)=0\), so ist \(y>r-\tfrac r2=\tfrac r2>0\), der Minuszweig scheidet aus, also \(y=f(x)\). Kontrolle: \(\Phi_y(0,r)=2r\neq0\).</p>
    <p><b>Nicht auflösbar in \((x_0,y_0)=(r,0)\)</b>, denn \(\Phi_y(r,0)=0\). Existenz scheitert: \(U_\varepsilon(r)\) enthält \(x>r\), und für die ist \(\Phi(x,y)\ge x^2-r^2>0\) für <i>jedes</i> \(y\) — es gibt gar keine Lösung. Eindeutigkeit scheitert ebenfalls: für \(\max\{0,\sqrt{r^2-\delta^2}\} < x < r\) liegen beide Punkte \(y_\pm=\pm\sqrt{r^2-x^2}\) in \(U_\delta(0)\) und lösen die Gleichung.</p>
    <p><b>Merke:</b> Nach \(x\) darf man in \((r,0)\) sehr wohl auflösen, denn \(\Phi_x(r,0)=2r\neq0\), nämlich \(x=\sqrt{r^2-y^2}\). Welche Variable auflösbar ist, entscheidet die jeweilige partielle Ableitung.</p>`,"Kreis — global nein, lokal ja, und wo es kippt")}</td><td class="cond">geometrisch: senkrechte Tangente</td></tr>
    <tr><td><b>Definition (lokal auflösbar).</b> Es gibt \(\varepsilon,\delta>0\) mit \(U_\varepsilon(x_0)\times U_\delta(y_0)\subset V\) und ein \(f:U_\varepsilon(x_0)\to U_\delta(y_0)\) mit<ul><li>(1) \(\Phi\big(x,f(x)\big)=\mathbf{0}_G\) für alle \(x\in U_\varepsilon(x_0)\) &nbsp;(<i>Existenz</i>),</li><li>(2) \(\Phi(x,y)=\mathbf{0}_G\ \Rightarrow\ y=f(x)\) für alle \((x,y)\) im Fenster &nbsp;(<i>Eindeutigkeit</i>).</li></ul><span class="when">Ohne (2) dürfte \(f\) willkürlich zwischen den Zweigen springen — die Definition wäre wertlos</span></td></tr>
    <tr><td><b>Satz (lokale Auflösbarkeit).</b> Es gelte \(\Phi(x_0,y_0)=\mathbf{0}_G\) und<ul><li>(1) \(\Phi:V\to G\) ist stetig;</li><li>(2) \(\Phi'_y\) existiert auf ganz \(V\) und \(\Phi'_y(\cdot):V\to\mathcal{L}(F,G)\) ist stetig;</li><li>(3) \(\Phi'_y(x_0,y_0)\) ist invertierbar, \(\Psi=\big[\Phi'_y(x_0,y_0)\big]^{-1}\in\mathcal{L}(G,F)\).</li></ul><b>Dann</b> ist \(\Phi\) in einer Umgebung von \((x_0,y_0)\) lokal nach \(y=f(x)\) auflösbar, mit \(f(x_0)=y_0\), und \(f\) ist in \(x_0\) stetig.</td><td class="cond">(3) wird nur <b>in einem Punkt</b> verlangt und liefert eine Aussage über eine ganze Umgebung</td></tr>
    <tr><td><b>Was nicht gefordert wird:</b> \(\Phi\) muss nach \(x\) überhaupt nicht differenzierbar sein — für die reine Existenz genügt Stetigkeit. Und es wird <i>keine Formel</i> für \(f\) geliefert; der Satz ist ein Existenzsatz (mit Iterationsverfahren im Beweis).</td><td class="cond">\(\Phi'_x\) kommt erst beim Differenzieren dazu</td></tr>
    <tr><td><b>Endlichdimensionales Kriterium.</b> Voraussetzung (3) heißt für \(\Phi:\mathbb{R}^m\times\mathbb{R}^n\to\mathbb{R}^n\): der rechte \(n\times n\)-Block der Jacobi-Matrix ist invertierbar, \[\det\frac{\partial\Phi}{\partial y}\Big|_{(x^{(0)},y^{(0)})}=\det\frac{D(\Phi_1,\dots,\Phi_n)}{D(y_1,\dots,y_n)}\Big|_{(x^{(0)},y^{(0)})}\neq0.\] Die ganze Ableitung zerfällt in zwei Blöcke: \(\Phi'=\big(\ \frac{\partial\Phi}{\partial x}\ \big|\ \frac{\partial\Phi}{\partial y}\ \big)\), Format \(n\times(m+n)\) — die ist gar nicht quadratisch, geprüft wird nur der rechte Block.
    ${exBox(String.raw`<p>\(E=\mathbb{R}\), \(F=G=\mathbb{R}^2\), \(V=\mathbb{R}\times\mathbb{R}^2\), \[\Phi(x;y_1,y_2)=\begin{pmatrix}y_1^2+y_2^2-1-x\\ y_1-y_2\end{pmatrix},\qquad x_0=0,\quad y_0=\Big(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\Big)^{T}.\]</p>
    <p><b>Schritt 0 (Lösungspunkt).</b> \(\Phi(0;y_0)=\big(\tfrac12+\tfrac12-1-0,\ \tfrac{1}{\sqrt2}-\tfrac{1}{\sqrt2}\big)^{T}=\mathbf{0}_2\). ✓</p>
    <p><b>Schritt 1 (Voraussetzung (1)).</b> Beide Komponenten sind Polynome, also ist \(\Phi\) auf ganz \(V\) stetig.</p>
    <p><b>Schritt 2 (Voraussetzung (2)).</b> Ableiten nach \(y=(y_1,y_2)\) bei festem \(x\): \[\Phi'_y(x;y_1,y_2)=\begin{pmatrix}2y_1&2y_2\\ 1&-1\end{pmatrix},\] Einträge stetig in \((x,y)\), also \(\Phi'_y(\cdot):V\to\mathcal{L}(\mathbb{R}^2,\mathbb{R}^2)\) stetig.</p>
    <p><b>Schritt 3 (Voraussetzung (3)).</b> \[\Phi'_y(0;y_0)=\begin{pmatrix}\sqrt2&\sqrt2\\ 1&-1\end{pmatrix},\qquad\det=-\sqrt2-\sqrt2=-2\sqrt2\neq0,\] also invertierbar, und mit \(\begin{pmatrix}a&b\\ c&d\end{pmatrix}^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&-b\\ -c&a\end{pmatrix}\): \[\Psi=\big[\Phi'_y(0;y_0)\big]^{-1}=\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}.\] Probe: \(\begin{pmatrix}\sqrt2&\sqrt2\\ 1&-1\end{pmatrix}\cdot\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}=\frac{1}{2\sqrt2}\begin{pmatrix}2\sqrt2&0\\ 0&2\sqrt2\end{pmatrix}=\mathbf{1}\). ✓</p>
    <p><b>Schritt 4 (Schluss).</b> Alle Voraussetzungen erfüllt, also ist die Gleichung in einer Umgebung von \((0;y_0)\) nach \(y=f(x)\) auflösbar.</p>
    <p><b>Kontrolle von Hand.</b> Zweite Gleichung: \(y_1=y_2=:y\); erste: \(2y^2=1+x\), also \(y=\pm\sqrt{\tfrac{1+x}{2}}\), Pluszweig wegen \((y_0)_1>0\): \[f(x)=\sqrt{\frac{1+x}{2}}\begin{pmatrix}1\\1\end{pmatrix},\quad x>-1,\qquad f(0)=y_0.\ \checkmark\]</p>`,"Ein System, alle drei Voraussetzungen komplett geprüft")}</td><td class="cond">nur der \(y\)-Block, nicht die ganze Matrix</td></tr>
    <tr><td><b>Satz (Differenzierbarkeit der Auflösung).</b> Gilt zusätzlich zu (1)–(3): \(\Phi\) ist auf \(V\) partiell Fréchet-differenzierbar nach \(E\) und \(\Phi'_x(\cdot):V\to\mathcal{L}(E,G)\) ist stetig. Dann ist \(f\) in \(x_0\) Fréchet-differenzierbar mit \[\mathcal{L}(E,F)\ \ni\ y'_x(x_0)=-\big[\Phi'_y(x_0,y_0)\big]^{-1}\,\Phi'_x(x_0,y_0).\]<span class="when">Immer wenn eine Ableitung gefragt ist, \(f\) aber nicht explizit bekannt ist</span>
    ${exBox(String.raw`<p>Fortsetzung des Systembeispiels: \(\Phi(x;y_1,y_2)=\big(y_1^2+y_2^2-1-x,\ y_1-y_2\big)^{T}\), \(x_0=0\), \(y_0=\big(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\big)^{T}\).</p>
    <p><b>Schritt 1 (Zusatzvoraussetzung).</b> Ableiten nach \(x\) bei festem \(y\): \[\Phi'_x(x;y)=\begin{pmatrix}-1\\ 0\end{pmatrix}\in\mathcal{L}(\mathbb{R},\mathbb{R}^2)\ \text{— konstant, also stetig.}\]</p>
    <p><b>Schritt 2 (Formel).</b> Mit \(\Psi=\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}\): \[\Psi\,\Phi'_x=\frac{1}{2\sqrt2}\begin{pmatrix}-1\\ -1\end{pmatrix},\qquad y'_x(0)=-\Psi\,\Phi'_x=\frac{1}{2\sqrt2}\begin{pmatrix}1\\ 1\end{pmatrix}=\frac{\sqrt2}{4}\begin{pmatrix}1\\ 1\end{pmatrix}.\]</p>
    <p><b>Schritt 3 (Probe).</b> Explizit war \(f(x)=\sqrt{\tfrac{1+x}{2}}\,(1,1)^{T}\), also \[f'(x)=\frac{1}{2\sqrt2\,\sqrt{1+x}}\begin{pmatrix}1\\1\end{pmatrix},\qquad f'(0)=\frac{1}{2\sqrt2}\begin{pmatrix}1\\1\end{pmatrix}.\ \checkmark\]</p>`,"Ableitungsformel im System — Rechnung und Probe")}</td><td class="cond">\(\Phi'_x\in\mathcal{L}(E,G)\), \(\Psi\in\mathcal{L}(G,F)\)</td></tr>
    <tr><td><b>Raum-Kontrolle als Rechenprobe.</b> \(\mathcal{L}(G,F)\circ\mathcal{L}(E,G)=\mathcal{L}(E,F)\) — die Faktoren müssen in genau dieser Reihenfolge stehen. Im Matrixfall ist \(\big[\Phi'_y\big]^{-1}\Phi'_x\neq\Phi'_x\big[\Phi'_y\big]^{-1}\), und Letzteres ist meist nicht einmal definiert.</td><td class="cond">Minuszeichen und Reihenfolge: die zwei häufigsten Fehler</td></tr>
  </table>
  <div class="note"><b>Klausurfalle.</b> „Lokal auflösbar“ ist eine Aussage über das <b>Paar</b> \((x_0,y_0)\), nicht über \(\Phi\) allein. Dieselbe Funktion ist im einen Punkt auflösbar und im nächsten nicht. Wer „Ist \(x^2+y^2-r^2=0\) nach \(y\) auflösbar?“ ohne Angabe des Punktes mit „ja“ beantwortet, hat die Frage nicht verstanden.</div>
</div>

<div class="refblock">
  <h3>Rezept: implizit differenzieren</h3>
  <p class="sub">Man braucht \(y(x)\) gar nicht zu kennen. \(\Phi\big(x,y(x)\big)=0\) ist keine Gleichung, die man an einer Stelle prüft, sondern eine <b>Identität in \(x\)</b> — und Identitäten darf man ableiten.</p>
  <table class="reftable">
    <tr><td><b>Die fünf Schritte:</b><ul><li><b>(1)</b> Punkt einsetzen und \(\Phi(x_0,y_0)=0\) verifizieren.</li><li><b>(2)</b> \(\Phi_y(x_0,y_0)\neq0\) bzw. \(\det\Phi'_y\neq0\) nachweisen — <i>erst das</i> rechtfertigt, dass \(y(x)\) überhaupt existiert und differenzierbar ist.</li><li><b>(3)</b> Die Identität \(\Phi(x,y(x))=0\) nach \(x\) ableiten. Kettenregel: \(y\) ist eine <i>Funktion</i> von \(x\), also entsteht bei jedem \(y\) ein Faktor \(y'\).</li><li><b>(4)</b> Nach \(y'\) auflösen, <i>danach</i> den Punkt einsetzen — nie vorher, sonst verliert man die Abhängigkeit.</li><li><b>(5)</b> Für \(y''\): die Gleichung aus (3) noch einmal nach \(x\) ableiten (Produktregel, \(y'\) hängt selbst von \(x\) ab) und nach \(y''\) auflösen.</li></ul><span class="when">Wer (2) überspringt, rechnet formal richtig, hat aber die eigentliche Frage nicht beantwortet</span></td><td class="cond">Struktur fast jeder Aufgabe zu §7.11</td></tr>
    <tr><td><b>Herleitung in einer Zeile.</b> Mit der Parametrisierung \(\varkappa:x\mapsto\big(x,y(x)\big)^{T}\), also \(\varkappa'_x=(1,y')^{T}\), und \(g=\Phi\circ\varkappa\): \[0=g'(x_0)=\Big(\frac{\partial\Phi}{\partial x},\ \frac{\partial\Phi}{\partial y}\Big)\Big|_{(x_0,y_0)}\begin{pmatrix}1\\ y'(x_0)\end{pmatrix}=\frac{\partial\Phi}{\partial x}+\frac{\partial\Phi}{\partial y}\,y'(x_0).\] Die \(1\) in der Spalte ist die Ableitung von \(x\mapsto x\) — deshalb steht \(\Phi_x\) unbegleitet da.</td><td class="cond">Kettenregel, <a href="#/ref/diffrechnung">Differentialrechnung</a></td></tr>
    <tr><td><b>Fall 1 — skalar, \(\Phi(x,y)=0\):</b> \[y'(x_0)=-\frac{\Phi_x}{\Phi_y}\bigg|_{(x_0,y_0)}\qquad\text{sofern }\Phi_y(x_0,y_0)\neq0.\]
    ${exBox(String.raw`<p>\(\Phi(x,y)=x^2+y^2-r^2\), Punkt \((x_0,y_0)\) auf dem Kreis mit \(y_0\neq0\).</p>
    <p><b>Schritt 1.</b> \(\Phi(x_0,y_0)=0\) nach Voraussetzung. <b>Schritt 2.</b> \(\Phi_y=2y\), also \(\Phi_y(x_0,y_0)=2y_0\neq0\) ✓ — \(y(x)\) existiert lokal und ist differenzierbar.</p>
    <p><b>Schritt 3 (Identität ableiten).</b> \(g(x)=x^2+y(x)^2-r^2=0\), also \[0=g'(x)=2x+2y(x)\,y'(x).\]</p>
    <p><b>Schritt 4 (auflösen).</b> \[y'(x)=-\frac{2x}{2y}=-\frac{x}{y},\qquad\text{bzw. mit der Formel }-\frac{\Phi_x}{\Phi_y}=-\frac{2x_0}{2y_0}=-\frac{x_0}{y_0}.\]</p>
    <p><b>Probe.</b> Mit \(y=\sqrt{r^2-x^2}\) ist \(y'=\frac{-2x}{2\sqrt{r^2-x^2}}=-\frac xy\). ✓</p>
    <p><b>Zahlenbeispiel.</b> \(r=5\), \((x_0,y_0)=(3,4)\): \(y'(3)=-\tfrac34\), Tangente \(y=4-\tfrac34(x-3)\). Die Steigung \(-x_0/y_0\) ist der negative Kehrwert der Steigung \(y_0/x_0\) des Ortsvektors — Tangente steht senkrecht auf dem Radius, wie es sein muss.</p>`,"Rechenweg — Tangentensteigung am Kreis")}</td><td class="cond">\(E=F=G=\mathbb{R}\)</td></tr>
    <tr><td><b>Fall 2 — zweite Ableitung.</b> Die Gleichung \(\Phi_x+\Phi_y\,y'=0\) noch einmal nach \(x\) ableiten: \[\Phi_{xx}+2\,\Phi_{xy}\,y'+\Phi_{yy}\,(y')^2+\Phi_y\,y''=0,\qquad y''=-\frac{\Phi_{xx}+2\,\Phi_{xy}\,y'+\Phi_{yy}\,(y')^2}{\Phi_y}\] und darin \(y'=-\Phi_x/\Phi_y\) einsetzen.<span class="when">Für Krümmung, Konvexität und die Entscheidung Maximum/Minimum auf einer impliziten Kurve</span>
    ${exBox(String.raw`<p><b>Weg A (direkt weiterableiten).</b> Aus \(2x+2y\,y'=0\), gekürzt \(x+y\,y'=0\), noch einmal nach \(x\) ableiten — im zweiten Term Produktregel, weil \(y\) und \(y'\) beide von \(x\) abhängen: \[1+\big(y'\big)^2+y\,y''=0\quad\Longrightarrow\quad y''=-\frac{1+(y')^2}{y}.\] Einsetzen von \(y'=-x/y\): \[y''=-\frac{1+\frac{x^2}{y^2}}{y}=-\frac{y^2+x^2}{y^3}=-\frac{r^2}{y^3}.\]</p>
    <p><b>Weg B (Formel).</b> \(\Phi_{xx}=2\), \(\Phi_{xy}=0\), \(\Phi_{yy}=2\), \(\Phi_y=2y\): \[y''=-\frac{2+0+2\frac{x^2}{y^2}}{2y}=-\frac{y^2+x^2}{y^3}=-\frac{r^2}{y^3}.\ \checkmark\]</p>
    <p><b>Deutung.</b> Für \(y>0\) (obere Halbkreislinie) ist \(y''<0\), die Kurve ist konkav — wie es die Anschauung verlangt. Zahlenbeispiel \(r=5\), \((x_0,y_0)=(3,4)\): \(y'(3)=-\tfrac34\), \(y''(3)=-\tfrac{25}{64}\).</p>
    <p><b>Typischer Fehler.</b> \(y'\) beim zweiten Ableiten wie eine Konstante behandeln. Ebenso ist \(\Phi_y(x,y(x))\) verkettet — beim Ableiten entstehen dort \(\Phi_{xy}\) und \(\Phi_{yy}\,y'\).</p>`,"Rechenweg — zweite Ableitung am Kreis, beide Wege")}</td></tr>
    <tr><td><b>Fall 3 — implizite Fläche \(\Phi(x,y,z)=0\), aufgelöst nach \(z=z(x,y)\):</b> \[\frac{\partial z}{\partial y}\bigg|_{(x_0,y_0)}=-\ \frac{\Phi_y}{\Phi_z}\bigg|_{(x_0,y_0,z_0)},\qquad\text{analog}\quad\frac{\partial z}{\partial x}=-\frac{\Phi_x}{\Phi_z},\qquad \Phi_z\neq0.\] Herleitung wie oben, nur mit \(\varkappa(x,y)=\big(x,y,z(x,y)\big)^{T}\) und der Richtungsableitung \(D[\,e_y\,]\), \(e_y=(0,1)^T\): \[0=\Big(\frac{\partial\Phi}{\partial x},\frac{\partial\Phi}{\partial y},\frac{\partial\Phi}{\partial z}\Big)\begin{pmatrix}1&0\\ 0&1\\ \frac{\partial z}{\partial x}&\frac{\partial z}{\partial y}\end{pmatrix}e_y=\frac{\partial\Phi}{\partial y}+\frac{\partial\Phi}{\partial z}\cdot\frac{\partial z}{\partial y}.\]<span class="when">Sauber trennen: frei sind \(x,y\), abhängig ist \(z=z(x,y)\)</span>
    ${exBox(String.raw`<p>\(\Phi(x,y,z)=x^2+y^2+z^2-r^2=0\), aufgelöst nach \(z=z(x,y)\) in einem Punkt mit \(z_0\neq0\).</p>
    <p><b>Schritt 1 (partielle Ableitungen).</b> \(\Phi_x=2x\), \(\Phi_y=2y\), \(\Phi_z=2z\). Bedingung \(\Phi_z(x_0,y_0,z_0)=2z_0\neq0\) ✓</p>
    <p><b>Schritt 2 (Formel).</b> \[\frac{\partial z}{\partial y}=-\frac{\Phi_y}{\Phi_z}=-\frac{2y_0}{2z_0}=-\frac{y_0}{z_0},\qquad \frac{\partial z}{\partial x}=-\frac{x_0}{z_0}.\]</p>
    <p><b>Schritt 3 (Probe).</b> Für \(z_0>0\) ist \(z(x,y)=\sqrt{r^2-x^2-y^2}\), also \(\frac{\partial z}{\partial y}=\frac{-2y}{2\sqrt{r^2-x^2-y^2}}=-\frac yz\). ✓</p>
    <p><b>Nebenprodukt:</b> Die Tangentialebene in \((x_0,y_0,z_0)\) lautet \(z=z_0-\frac{x_0}{z_0}(x-x_0)-\frac{y_0}{z_0}(y-y_0)\); der Normalenvektor ist \(\nabla\Phi=(2x_0,2y_0,2z_0)^T\), also das Doppelte des Ortsvektors — der Gradient steht senkrecht auf der Niveaufläche.</p>`,"Rechenweg — Kugel, partielle Ableitungen der Auflösung")}</td></tr>
    <tr><td><b>Zyklische Kettenregel</b> (Tripelproduktregel). Für \(\Phi(x,y,z)=0\) gilt \[\Big(\frac{\partial x}{\partial y}\Big)\Big(\frac{\partial y}{\partial z}\Big)\Big(\frac{\partial z}{\partial x}\Big)=-1\] — <b>nicht</b> \(+1\). Grund: alle drei Faktoren sind Quotienten der Form \(-\Phi_\bullet/\Phi_\bullet\); die Beträge kürzen sich weg, übrig bleiben drei Minuszeichen.<span class="when">Schneller Selbsttest, ob die Vorzeichen sitzen; in der Thermodynamik Standardwerkzeug</span>
    ${exBox(String.raw`<p>\(\Phi(x,y,z)=x^2+y^2+z^2-r^2\). Löst man dieselbe Gleichung jeweils nach der anderen Variablen auf, liefert Fall 3 dreimal dasselbe Muster:</p>
    \[\frac{\partial x}{\partial y}=-\frac{\Phi_y}{\Phi_x}=-\frac{y}{x},\qquad \frac{\partial y}{\partial z}=-\frac{\Phi_z}{\Phi_y}=-\frac{z}{y},\qquad \frac{\partial z}{\partial x}=-\frac{\Phi_x}{\Phi_z}=-\frac{x}{z}.\]
    \[\Big(-\frac yx\Big)\Big(-\frac zy\Big)\Big(-\frac xz\Big)=-\frac{xyz}{xyz}=-1.\ \checkmark\]
    <p>Die Rechnung zeigt zugleich, warum das Ergebnis universell ist: die Beträge kürzen sich immer, die drei Minuszeichen bleiben stehen. Voraussetzung ist nur, dass alle drei Nenner \(\Phi_x,\Phi_y,\Phi_z\) im Punkt nicht verschwinden.</p>`,"Rechenweg — an der Kugel nachgerechnet")}</td></tr>
    <tr><td><b>Vektorieller Fall (System).</b> Für \(\Phi:\mathbb{R}^m\times\mathbb{R}^n\to\mathbb{R}^n\) tritt an die Stelle des Bruchs das Matrixprodukt \[y'_x(x^{(0)})=-\Big[\frac{\partial\Phi}{\partial y}\Big]^{-1}\frac{\partial\Phi}{\partial x}\bigg|_{(x^{(0)},y^{(0)})}\in\mathbb{R}^{n\times m}.\] Praktisch löst man lieber das <i>lineare Gleichungssystem</i> \(\Phi'_y\,y'_x=-\Phi'_x\), statt die Inverse auszurechnen.<span class="when">Ab \(n\ge3\) immer über das LGS — Inverse nur bei \(2\times2\)</span></td><td class="cond">nur der \(y\)-Block wird invertiert</td></tr>
  </table>
</div>

<div class="refblock">
  <h3>Umkehrsatz (lokale Umkehrbarkeit)</h3>
  <p class="sub">Kein neuer Satz, sondern ein Rollentausch: \(y=f(x)\) wird als implizite Gleichung \(\Phi(x,y)=y-f(x)=\mathbf{0}_F\) gelesen und nach <b>\(x\)</b> statt nach \(y\) aufgelöst.</p>
  <table class="reftable">
    <tr><td><b>Herleitung.</b> Mit \(\Phi(x,y)=y-f(x)\) ist \(\Phi'_x=-f'_x\) und \(\Phi'_y=\mathbf{1}\). Auflösbarkeit nach \(x\) verlangt also, dass \(\Phi'_x(x_0)=-f'_x(x_0)\) invertierbar ist, und die Ableitungsformel aus <a href="#/7.11.4">7.11.4</a> gibt \[x'_y(y_0)=-\big[\Phi'_x\big]^{-1}\Phi'_y=-\big[-f'_x(x_0)\big]^{-1}\mathbf{1}=\big[f'_x(x_0)\big]^{-1}.\] Die beiden Minuszeichen heben sich weg.</td><td class="cond">Rollentausch von \(x\) und \(y\)</td></tr>
    <tr><td><b>Definition (Diffeomorphismus).</b> \(f:U\subset E\to V\subset F\) heißt <b>Diffeomorphismus der Klasse \(C^p\)</b>, wenn (1) \(f:U\to V\) bijektiv ist und (2) \(f\) <i>und</i> \(f^{-1}\) \(p\)-fach stetig Fréchet-differenzierbar sind.</td><td class="cond">beide Richtungen — daran scheitern die Gegenbeispiele</td></tr>
    <tr><td><b>Satz über die lokale Umkehrfunktion.</b> Sei \(W\subset\mathbb{R}^m\) offen, \(f:W\to\mathbb{R}^m\) \(p\)-fach stetig differenzierbar, \(x_0\in W\), \(y_0=f(x_0)\) und sei \[\mathcal{J}_{x}(f)\big|_{x=x_0}\ \text{invertierbar, d.h.}\quad\det\mathcal{J}_{x_0}(f)\neq0.\] Dann existieren offene Mengen \(\mathcal{U}\ni x_0\) und \(V\ni y_0\), so dass \(f:\mathcal{U}\to V\) ein \(C^p\)-Diffeomorphismus ist.</td><td class="cond">gleiche Dimension in Urbild und Bild — sonst ist \(\mathcal{J}\) nicht quadratisch</td></tr>
    <tr><td><b>Ableitung der Umkehrfunktion</b> = Inverse der Jacobi-Matrix: \[\big(f^{-1}\big)'(y_0)=\big[f'(x_0)\big]^{-1},\qquad \frac{D(x_1,\dots,x_n)}{D(y_1,\dots,y_n)}=\left[\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\right]^{-1}.\] Die \(D\)-Schreibweise bezeichnet stets die <b>Matrix</b>; wo die Determinante gemeint ist, muss \(\det\) ausdrücklich davorstehen.<span class="when">Bei Koordinatenwechseln (Polar-, Zylinder-, Kugelkoordinaten) und Substitutionsregeln</span>
    ${exBox(String.raw`<p>\(f:\left]0,\infty\right[\times\mathbb{R}\to\mathbb{R}^2\), \(f(r,\varphi)=(r\cos\varphi,\ r\sin\varphi)^{T}\).</p>
    <p><b>Schritt 1 (Jacobi-Matrix).</b> \[\mathcal{J}_{(r,\varphi)}(f)=\frac{D(x,y)}{D(r,\varphi)}=\begin{pmatrix}\cos\varphi&-r\sin\varphi\\ \sin\varphi&\ \ r\cos\varphi\end{pmatrix}.\]</p>
    <p><b>Schritt 2 (Determinante).</b> \(\det\mathcal{J}=r\cos^2\varphi+r\sin^2\varphi=r>0\) für \(r>0\). Alle Einträge sind beliebig oft stetig differenzierbar, also \(f\in C^\infty\).</p>
    <p><b>Schritt 3 (Schluss).</b> Zu jedem \((r_0,\varphi_0)\) mit \(r_0>0\) gibt es offene Umgebungen \(\mathcal{U}\ni(r_0,\varphi_0)\), \(V\ni f(r_0,\varphi_0)\) mit \(f:\mathcal{U}\to V\) ein \(C^\infty\)-Diffeomorphismus; konkret leistet das \(\mathcal{U}=\left]0,\infty\right[\times\left]\varphi_0-\pi,\varphi_0+\pi\right[\).</p>
    <p><b>Schritt 4 (Umkehrableitung).</b> \[\frac{D(r,\varphi)}{D(x,y)}=\left[\frac{D(x,y)}{D(r,\varphi)}\right]^{-1}=\frac1r\begin{pmatrix}r\cos\varphi&r\sin\varphi\\ -\sin\varphi&\cos\varphi\end{pmatrix}=\begin{pmatrix}\cos\varphi&\sin\varphi\\ -\frac{\sin\varphi}{r}&\frac{\cos\varphi}{r}\end{pmatrix}.\]</p>
    <p><b>Schritt 5 (Probe von Hand).</b> Aus \(r=\sqrt{x^2+y^2}\) und \(\varphi=\arctan(y/x)\) (Letzteres für \(x>0\)): \[\frac{\partial r}{\partial x}=\frac{x}{\sqrt{x^2+y^2}}=\cos\varphi\ \checkmark,\qquad \frac{\partial\varphi}{\partial x}=\frac{-y}{x^2+y^2}=-\frac{\sin\varphi}{r}\ \checkmark\]</p>
    <p><b>Schritt 6 (die Kehrwert-Warnung konkret).</b> Es ist \(\frac{\partial x}{\partial r}=\cos\varphi\) und \(\frac{\partial r}{\partial x}=\cos\varphi\), aber \(\frac{1}{\partial x/\partial r}=\frac{1}{\cos\varphi}\). Für \(\varphi=\tfrac\pi3\): \(\frac{\partial r}{\partial x}=\tfrac12\), während \(\frac{1}{\partial x/\partial r}=2\). Die naive Kehrwertregel ist also wirklich falsch.</p>`,"Rechenweg — Polarkoordinaten, Umkehrsatz komplett")}</td></tr>
    <tr><td><b>Der Satz ist strikt lokal.</b> \(\det\mathcal{J}\neq0\) in jedem Punkt von \(W\) macht \(f\) <i>nicht</i> global injektiv. Standardbeispiel: Polarkoordinaten haben \(\det\mathcal{J}=r>0\) überall, sind wegen der \(2\pi\)-Periodizität in \(\varphi\) aber global nicht injektiv.</td><td class="cond">lokal ja, global nein</td></tr>
    <tr><td><b>Invertierbarkeit ist notwendig für den Diffeomorphismus</b> — nicht für Bijektivität. Aus \(f^{-1}\circ f=\mathbf{1}\) und \(f\circ f^{-1}=\mathbf{1}\) folgt mit der Kettenregel \(\big(f^{-1}\big)'(y_0)f'(x_0)=\mathbf{1}\) und \(f'(x_0)\big(f^{-1}\big)'(y_0)=\mathbf{1}\), also ist \(f'(x_0)\) invertierbar.
    ${exBox(String.raw`<p><b>(a) Polarkoordinaten im Ursprung.</b> Dieselbe Vorschrift, jetzt auf ganz \(\mathbb{R}^2\), im Punkt \((r_0,\varphi_0)=(0,\varphi_0)\): \[\mathcal{J}_{(0,\varphi_0)}(f)=\begin{pmatrix}\cos\varphi_0&0\\ \sin\varphi_0&0\end{pmatrix},\qquad\det\mathcal{J}=0.\] Und es geht wirklich schief: \(f(0,\varphi)=(0,0)^{T}\) für <i>jedes</i> \(\varphi\). Jede noch so kleine Umgebung von \((0,\varphi_0)\) enthält \((0,\varphi_0)\) und \((0,\varphi_0+t)\), \(t\neq0\), mit demselben Bildpunkt — \(f\) ist also in keiner Umgebung dieses Punktes injektiv, es existiert dort nicht einmal eine unstetige Umkehrung.</p>
    <p><b>(b) Bijektiv und trotzdem kein Diffeomorphismus: \(f(x)=x^3\) auf \(\mathbb{R}\), \(x_0=0\).</b> Es ist \(f'(x)=3x^2\), also \(f'(0)=0\) — der Umkehrsatz ist nicht anwendbar. Trotzdem ist \(f:\mathbb{R}\to\mathbb{R}\) bijektiv mit \(f^{-1}(y)=y^{1/3}\); Bijektivität ist also nicht das Problem. Was scheitert, ist die Glattheit der Umkehrung: \[\big(f^{-1}\big)'(y)=\tfrac13y^{-2/3}\quad(y\neq0),\qquad \lim_{y\to0}\tfrac13y^{-2/3}=+\infty,\] also ist \(f^{-1}\) in \(0\) nicht differenzierbar und \(f\) auf keiner Umgebung von \(0\) ein \(C^1\)-Diffeomorphismus. Struktureller Grund: wäre \(f^{-1}\) in \(y_0\) differenzierbar, gäbe die Kettenregel \(\big(f^{-1}\big)'(y_0)\cdot f'(x_0)=\mathbf{1}\), mit \(f'(x_0)=0\) also \(0=1\).</p>`,"Zwei Gegenbeispiele — wenn die Voraussetzung verletzt ist")}</td></tr>
  </table>
  <div class="note"><b>Die Kehrwertfalle.</b> \(\ \dfrac{\partial x_k}{\partial y_\ell}\ \neq\ \dfrac{1}{\ \frac{\partial y_\ell}{\partial x_k}\ }\ \) — invertiert wird die <b>Matrix</b>, nicht der einzelne Eintrag. Die Bruchschreibweise \(\frac{D(\dots)}{D(\dots)}\) verführt zum Kürzen, aber gekürzt werden darf nur auf Matrixebene; ein Eintrag der Inversen mischt alle Einträge der Ausgangsmatrix. Nur in einer Dimension stimmt die Kehrwertregel.</div>
</div>

<div class="twocol">
  <div class="refblock">
    <h3>Der rote Faden: wie alles zusammenhängt</h3>
    <table class="reftable">
      <tr><td><b>1. Fixpunktsatz \(\Rightarrow\) implizite Funktionen.</b> Bei festem \(x\) wird \(\Phi(x,y)=\mathbf{0}_G\) mit \(\Psi=[\Phi'_y(x_0,y_0)]^{-1}\) in eine Fixpunktgleichung verwandelt: \[A(x)y=y-\Psi\,\Phi(x,y),\qquad A(x)y=y\iff\Phi(x,y)=\mathbf{0}_G.\] \(\Psi\) transportiert den Wert von \(G\) zurück nach \(F\) (sonst darf man gar nicht subtrahieren) und verliert dabei keine Information, weil es invertierbar ist.</td><td class="cond"><a href="#/7.11.3">7.11.3</a></td></tr>
      <tr><td><b>Warum \(A\) kontrahiert.</b> Beim Ableiten kürzt sich der Hauptterm weg: \[A'_y=\Psi\big(\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\big),\] also genau die <i>Abweichung</i> der Ableitung vom Basispunkt. Die ist nach Voraussetzung (2) stetig und in \((x_0,y_0)\) gleich null — durch Verkleinern der Umgebung drückt man daher \(\|A'_y\|_{\mathcal{L}(F,F)}\le C\,\|\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\|_{\mathcal{L}(F,G)}\) unter jedes vorgegebene \(\Theta<1\), wobei \(C=\|\Psi\|_{\mathcal{L}(G,F)}\). Das ist der Newton-Gedanke mit eingefrorener Ableitung.</td><td class="cond">Kontraktionskonstante \(\Theta\)</td></tr>
      <tr><td><b>2. Implizite Funktionen \(\Rightarrow\) Umkehrsatz.</b> Über \(\Phi(x,y)=y-f(x)\) und den Rollentausch. Umgekehrt geht es auch: aus dem Umkehrsatz gewinnt man den impliziten Satz, indem man \((x,y)\mapsto\big(x,\Phi(x,y)\big)\) betrachtet. Die beiden Sätze sind <b>äquivalent</b> — dieselbe Aussage in zwei Kleidern.</td><td class="cond"><a href="#/7.11.6">7.11.6</a></td></tr>
      <tr><td><b>3. Implizite Funktionen \(\Rightarrow\) Lagrange.</b> Eine Nebenbedingung \(F(\tilde x)=0\) wird lokal nach einem Teil der Variablen aufgelöst; einsetzen macht daraus ein freies Extremwertproblem in weniger Variablen, und die Kettenregel übersetzt \(\tilde f'(x^*)=0\) zurück in \(\nabla f=\lambda\nabla F\). Der Multiplikator ist kein Zaubertrick, sondern der Quotient \(\lambda=f'_y/F'_y\), der genau wegen \(F'_y\neq0\) existiert.</td><td class="cond">§7.12, <a href="#/ref/extrema">Extrema</a></td></tr>
      <tr><td><b>Merksatz.</b> Fixpunktsatz = Motor, impliziter Satz = Getriebe, Umkehrsatz und Lagrange = Räder. Wer den Motor kennt, kann alle drei Sätze rekonstruieren.</td></tr>
    </table>
  </div>
  <div class="refblock">
    <h3>Wo geht welche Voraussetzung ein?</h3>
    <p class="sub">Die klassische mündliche Nachfrage — und zugleich die Checkliste, wenn eine Rechnung nicht aufgeht.</p>
    <table class="reftable">
      <tr><td>(1) Stetigkeit von \(\Phi\)</td><td class="cond">Selbstabbildung der Kugel</td></tr>
      <tr><td>(2) Stetigkeit von \(\Phi'_y\)</td><td class="cond">liefert \(\Theta<1\)</td></tr>
      <tr><td>(3) Invertierbarkeit von \(\Phi'_y(x_0,y_0)\)</td><td class="cond">Äquivalenz \(Ay=y\iff\Phi=\mathbf{0}_G\)</td></tr>
      <tr><td>Vollständigkeit von \(F\)</td><td class="cond">Anwendung des Fixpunktsatzes</td></tr>
      <tr><td>Stetigkeit von \(\Phi'_x\)</td><td class="cond">erst für die Ableitungsformel</td></tr>
      <tr><td><b>Warum eine abgeschlossene Kugel?</b> Der Fixpunktsatz braucht einen vollständigen Raum. Eine offene Kugel ist nicht vollständig, eine abgeschlossene Kugel in einem Banachraum schon — deshalb halbiert der Beweis den Radius auf \(\delta_1=\delta_0/2\).</td></tr>
      <tr><td><b>Vollständigkeit nur von \(F\).</b> Die Vorlesung formuliert den Satz für drei Banachräume \(E,F,G\); benutzt wird die Vollständigkeit im Beweis aber allein für \(F\) (Schritt 4), an \(E\) und \(G\) nirgends wirklich. Zu Normen und Vollständigkeit: <a href="#/ref/normen">Normen</a>, zur Fréchet-Ableitung <a href="#/ref/frechet">Fréchet</a>.</td></tr>
      <tr><td><b>Stabilitätslesart.</b> Die Grundabschätzung \[\|y(x)-y_0\|_F\le\frac{C}{1-\Theta}\,\big\|\Phi(x,y_0)-\Phi(x_0,y_0)\big\|_G,\qquad C=\|\Psi\|_{\mathcal{L}(G,F)},\] misst, wie empfindlich die Auflösung auf Störungen von \(x\) reagiert. Je näher \(\Phi'_y(x_0,y_0)\) an der Nicht-Invertierbarkeit liegt, desto größer ist \(C\) — beim Kreis explodiert \(y'=-x/y\) genau für \(y\to0\).</td></tr>
    </table>
  </div>
</div>`; }

/* =========================================================================
   6) Mindmap-Renderer (generisch, klappbarer Horizontal-Baum)
   tree = {id,title,kcls,kind:'root'|'ch'|'leaf', children:[...], collapsed?, route?}
   onLeaf(node) -> Navigation; Knoten mit children & kind 'ch' klappen auf/zu.
   ========================================================================= */
function Mindmap(svg, tree, opts){
  opts = Object.assign({nodeW:236, nodeH:50, hGap:64, vGap:14}, opts||{});
  const NS="http://www.w3.org/2000/svg";
  let tx=0, ty=0, scale=1;
  const vp = document.createElementNS(NS,"g"); svg.appendChild(vp);

  function layout(){
    let leaf=0, maxD=0; const pos=new Map();
    (function assign(n,d){
      maxD=Math.max(maxD,d);
      const kids = (n.collapsed? [] : (n.children||[]));
      if(!kids.length){ const y=leaf*(opts.nodeH+opts.vGap)+opts.nodeH/2; leaf++; pos.set(n,{x:d*(opts.nodeW+opts.hGap),y}); return y; }
      let f=null,l=0; kids.forEach(k=>{ const ky=assign(k,d+1); if(f===null)f=ky; l=ky; });
      const y=(f+l)/2; pos.set(n,{x:d*(opts.nodeW+opts.hGap),y}); return y;
    })(tree,0);
    return {pos, w:(maxD)*(opts.nodeW+opts.hGap)+opts.nodeW, h:Math.max(leaf,1)*(opts.nodeH+opts.vGap)};
  }

  let dims;
  function render(){
    vp.textContent="";
    const {pos,w,h}=layout(); dims={w,h};
    // Links
    pos.forEach((p,n)=>{
      if(n.collapsed) return;
      (n.children||[]).forEach(c=>{
        const cp=pos.get(c); if(!cp) return;
        const x1=p.x+opts.nodeW, y1=p.y, x2=cp.x, y2=cp.y, mx=(x1+x2)/2;
        const path=document.createElementNS(NS,"path");
        path.setAttribute("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
        path.setAttribute("class","link "+(n.cls||""));
        vp.appendChild(path);
      });
    });
    // Nodes
    pos.forEach((p,n)=>{
      const fo=document.createElementNS(NS,"foreignObject");
      fo.setAttribute("x",p.x); fo.setAttribute("y",p.y-opts.nodeH/2);
      fo.setAttribute("width",opts.nodeW); fo.setAttribute("height",opts.nodeH);
      const div=document.createElement("div");
      let cls="node "+(n.kind==='root'?'root':'')+" "+(n.kind==='ch'?'ch '+(n.cls||''):'');
      div.className=cls.trim();
      const expander = (n.kind==='ch' && n.children&&n.children.length)? `<span class="tw">${n.collapsed?'▸':'▾'}</span>`:'';
      const badge = n.badge? `<span class="badge">${esc(n.badge)}</span>`:'';
      const dn = (n.kind==='leaf' && n.done)? `<span class="done">✓</span>`:'';
      div.innerHTML = `${badge}<span class="lbl">${esc(n.title)}</span>${dn}${expander}`;
      div.title = n.title;
      div.onclick=(ev)=>{ ev.stopPropagation();
        if(n.kind==='ch' && n.children && n.children.length){ n.collapsed=!n.collapsed; render(); }
        else if(n.route){ go(n.route); }
      };
      fo.appendChild(div); vp.appendChild(fo);
    });
    apply();
  }
  function apply(){ vp.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`); }
  function fit(){
    const r=svg.getBoundingClientRect(); const pad=28;
    const s=Math.min((r.width-2*pad)/dims.w,(r.height-2*pad)/dims.h, 1.15);
    scale=isFinite(s)&&s>0? s:1;
    tx=(r.width-dims.w*scale)/2; ty=(r.height-dims.h*scale)/2; apply();
  }
  // Pan / Zoom
  let drag=null;
  svg.addEventListener("pointerdown",e=>{ if(e.target.closest(".node"))return; drag={x:e.clientX,y:e.clientY,tx,ty}; svg.classList.add("grabbing"); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove",e=>{ if(!drag)return; tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply(); });
  svg.addEventListener("pointerup",e=>{ drag=null; svg.classList.remove("grabbing"); });
  svg.addEventListener("pointercancel",()=>{ drag=null; svg.classList.remove("grabbing"); });
  svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top; const f=e.deltaY<0?1.12:1/1.12;
    const ns=Math.max(.25,Math.min(2.2,scale*f)); const k=ns/scale;
    tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply();
  },{passive:false});

  render(); requestAnimationFrame(fit);
  return {fit, zoom:f=>{ const r=svg.getBoundingClientRect(); const mx=r.width/2,my=r.height/2;
    const ns=Math.max(.25,Math.min(2.2,scale*f)); const k=ns/scale; tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply(); }};
}

/* Luft im Diagramm. `target` ist die Stellschraube: gewünschter Mindestabstand zweier
   Blasen in Bildschirmpixeln. Das Layout nimmt den größten Maßstab, der das noch einhält —
   höher = übersichtlicher, aber kleinere Schrift. `gap`/`mid` steuern die Ring-Rohgeometrie. */
const AIR = { target:26, gap:34, mid:26 };
/* Blasengrößen. „many" gilt ab 19 Einträgen im Ring — dort wird es enger, deshalb kleiner.
   154x62 ist ausgemessen: breiter/flacher schneidet Titel ab UND verkleinert den Maßstab. */
const NODE = { centerW:216, centerH:96, catW:200, catH:80, leafW:176, leafH:70, manyW:154, manyH:62 };

function RadialMap(svg, ui, nav){
  const NS="http://www.w3.org/2000/svg";
  const vp=document.createElementNS(NS,"g"); svg.appendChild(vp);
  let tx=0, ty=0, scale=1, box={x:-1,y:-1,w:2,h:2};

  /* Kinder auf konzentrischen Ellipsen-Ringen verteilen. Die Ellipse richtet sich nach
     dem Seitenverhältnis der Box, damit die Breite genutzt wird; die Ring-Kapazität kommt
     aus dem Ellipsenumfang (Ramanujan-Näherung), nicht aus dem Kreisumfang. */
  function ringPlace(n, cfg){
    const out=[]; let i=0, ring=0;
    while(i<n && ring<8){
      const R = cfg.r0 + ring*cfg.rstep;
      const a = R*cfg.fx, b = R*cfg.fy;
      const per = Math.PI*(3*(a+b) - Math.sqrt(Math.max(0,(3*a+b)*(a+3*b))));
      const cap = Math.max(5, Math.floor(per*0.80/(cfg.w+cfg.gap)));
      const cnt = Math.min(cap, n-i);
      const off = (ring%2) ? Math.PI/cnt : 0;
      for(let k=0;k<cnt;k++){
        const t = -Math.PI/2 + off + (k/cnt)*2*Math.PI;
        out.push({ x: Math.cos(t)*a, y: Math.sin(t)*b });
      }
      i+=cnt; ring++;
    }
    return out;
  }

  function nodeEl(x, y, w, h, cls, color, html, onClick, delay){
    const fo=document.createElementNS(NS,"foreignObject");
    fo.setAttribute("x",x); fo.setAttribute("y",y);
    fo.setAttribute("width",w); fo.setAttribute("height",h);
    const div=document.createElement("div");
    div.className="tmnode tmpop "+cls;
    div.style.borderColor=color;
    div.style.background=rgbaOf(color, cls.indexOf("center")>=0 ? 0.20 : 0.13);
    div.style.animationDelay=delay+"ms";
    div.innerHTML=html;
    if(onClick){ div.onclick=(ev)=>{ ev.stopPropagation(); onClick(); }; }
    fo.appendChild(div); vp.appendChild(fo);
    return {x, y, w, h};
  }

  /* Beste Ring-Geometrie suchen: die Kombination aus Radius, Ringabstand und Ellipsenform,
     bei der am Ende der größte (= lesbarste) Maßstab herauskommt. Billig genug, um sie bei
     jedem Rendern neu zu bestimmen — so passt sich die Karte an jede Fenstergröße an. */
  function bestLayout(n, w, h, availW, availH, cw, ch){
    let best=null;
    const minA = cw/2 + w/2 + AIR.mid, minB = ch/2 + h/2 + AIR.mid;  /* Ring 0 darf die Mitte nicht berühren */
    for(const r0 of [200,240,290,340,400]){
      for(const rf of [0.40,0.52,0.64]){
        for(let ix=0; ix<7; ix++){
          const fx = 1.0 + ix*0.15;
          if(r0*fx < minA) continue;
          for(let iy=0; iy<6; iy++){
            const fy = 0.50 + iy*0.11;
            if(r0*fy < minB) continue;
            const pts = ringPlace(n, {w, gap:AIR.gap, r0, rstep:Math.round(r0*rf), fx, fy});
            let X=0, Y=0;
            for(const p of pts){ X=Math.max(X,Math.abs(p.x)); Y=Math.max(Y,Math.abs(p.y)); }
            const bw = 2*X + w, bh = 2*Y + h;
            const s = Math.min(availW/bw, availH/bh, 1.05);

            /* Kleinster Abstand zweier Blasen (und zur Mitte) in Layout-Koordinaten;
               negativ = Überlappung. Mal Maßstab ergibt die Luft in Bildschirmpixeln. */
            let sep = Infinity;
            for(let i=0;i<pts.length;i++){
              sep = Math.min(sep, Math.max(Math.abs(pts[i].x)-(w+cw)/2, Math.abs(pts[i].y)-(h+ch)/2));
              for(let j=i+1;j<pts.length;j++){
                sep = Math.min(sep, Math.max(Math.abs(pts[i].x-pts[j].x)-w,
                                             Math.abs(pts[i].y-pts[j].y)-h));
              }
            }
            const gap = s*sep;
            const ok  = gap >= AIR.target;
            /* Rangfolge: erst genug Luft, dann größter Maßstab. Wird die Luft nirgends
               erreicht, gewinnt die luftigste Variante. */
            const better = !best ? true
              : (ok !== best.ok) ? ok
              : (ok ? s > best.s : gap > best.gap);
            if(better) best = {s, pts, gap, ok};
          }
        }
      }
    }
    /* Rückfallebene, falls keine Kombination die Mindestabstände erfüllt */
    return best ? best.pts : ringPlace(n, {w, gap:AIR.gap, r0:300, rstep:150, fx:1.4, fy:0.85});
  }

  function render(){
    vp.textContent="";
    const m=nav.model();
    /* tiefere Ebene bekommt mehr Höhe — dort stehen bis zu 33 Einträge im Ring */
    const boxEl = svg.closest(".mapbox");
    if(boxEl) boxEl.classList.toggle("deep", !m.root);

    const r = svg.getBoundingClientRect();
    const availW = Math.max(320, (r.width||900) - 52);
    const availH = Math.max(220, (r.height||420) - 108);

    /* Behälter (Kategorie, Kapitel, Abschnitt) bekommen die große Blase, Themen die kleine */
    const container = m.kids.some(k=>k.open);
    const many = m.kids.length > 18;
    const NW = container?NODE.catW:(many?NODE.manyW:NODE.leafW);
    const NH = container?NODE.catH:(many?NODE.manyH:NODE.leafH);
    const CW = NODE.centerW, CH_ = NODE.centerH;
    const pts = bestLayout(m.kids.length, NW, NH, availW, availH, CW, CH_);

    /* Speiche von Rand zu Rand statt Mittelpunkt zu Mittelpunkt —
       sonst schimmert die Linie durch die Blasen hindurch. */
    function edge(dx, dy, rw, rh){
      const t = 1/Math.sqrt(Math.max(1e-6,(dx/rw)*(dx/rw) + (dy/rh)*(dy/rh)));
      return [dx*t, dy*t];
    }

    /* Speichen zuerst, damit die Knoten darüber liegen */
    pts.forEach((p,i)=>{
      const [sx,sy] = edge(p.x, p.y, CW/2, CH_/2);
      const [ex,ey] = edge(-p.x, -p.y, NW/2, NH/2);
      const ln=document.createElementNS(NS,"path");
      ln.setAttribute("d",`M${sx.toFixed(1)},${sy.toFixed(1)} L${(p.x+ex).toFixed(1)},${(p.y+ey).toFixed(1)}`);
      ln.setAttribute("class","tmspoke");
      ln.setAttribute("stroke", m.kids[i].color);
      ln.style.animation="tmfade .4s ease both";
      ln.style.animationDelay=(60+i*9)+"ms";
      vp.appendChild(ln);
    });

    const rects=[];
    /* Mitte */
    rects.push(nodeEl(-CW/2, -CH_/2, CW, CH_,
      "center"+(m.root?"":" back")+" tmsh"+(m.shape||3), m.color,
      `<span class="t">${esc(m.center.title)}</span><span class="n">${esc(m.center.sub)}</span>`,
      m.root? null : ()=>{ nav.up(); render(); fit(); }, 0));

    /* Ring */
    pts.forEach((p,i)=>{
      const k=m.kids[i];
      const badge = k.badge? `<span class="id" style="background:${chColorOf(k.badge)}">${esc(k.badge)}</span>` : "";
      const sub   = k.sub?   `<span class="n">${esc(k.sub)}</span>` : "";
      const act   = k.open? ()=>{ k.open(); render(); fit(); } : ()=>{ go(k.route); };
      rects.push(nodeEl(p.x-NW/2, p.y-NH/2, NW, NH,
        (k.open?"cat":"leaf")+((!k.open&&many)?" small":"")+" tmsh"+(k.shape||3),
        k.color, `${badge}<span class="t">${esc(k.title)}</span>${sub}`, act, 60+i*14));
    });

    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    rects.forEach(r=>{ x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); });
    box={x:x0, y:y0, w:Math.max(1,x1-x0), h:Math.max(1,y1-y0)};

    ui.back.hidden = m.root;
    ui.crumb.innerHTML = m.crumb.map((c,i)=> (i? `<span class="sep">›</span>`:"")+esc(c)).join("");
    ui.count.textContent = m.count;

    /* Legende — was auf dieser Ebene wirklich etwas unterscheidet (Form bzw. Farbe) */
    if(ui.leg){
      const L = m.legend;
      ui.leg.hidden = !L;
      ui.leg.innerHTML = !L ? "" : `<b>${esc(L.title)}</b>` + L.items.map(it=>
        `<i class="${it.cls}${it.fill?" fill":""}" style="color:${it.color}"></i><span>${esc(it.label)}</span>`).join("");
    }
    apply();
  }

  function apply(){ vp.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`); }
  function fit(){
    const r=svg.getBoundingClientRect(); const padX=26, padTop=62, padBot=46;
    const s=Math.min((r.width-2*padX)/box.w, (r.height-padTop-padBot)/box.h, 1.05);
    scale=(isFinite(s)&&s>0)? s : 1;
    tx = r.width/2 - (box.x+box.w/2)*scale;
    ty = padTop + (r.height-padTop-padBot)/2 - (box.y+box.h/2)*scale;
    apply();
  }

  let drag=null;
  svg.addEventListener("pointerdown",e=>{ if(e.target.closest(".tmnode")) return;
    drag={x:e.clientX,y:e.clientY,tx,ty}; svg.classList.add("grabbing"); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove",e=>{ if(!drag)return; tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply(); });
  svg.addEventListener("pointerup",()=>{ drag=null; svg.classList.remove("grabbing"); });
  svg.addEventListener("pointercancel",()=>{ drag=null; svg.classList.remove("grabbing"); });
  svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top, f=e.deltaY<0?1.12:1/1.12;
    const ns=Math.max(.3,Math.min(2.4,scale*f)), k=ns/scale;
    tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply();
  },{passive:false});

  ui.back.onclick=()=>{ if(nav.up()){ render(); fit(); } };

  render(); fit(); requestAnimationFrame(fit);
  return {fit, back:()=>ui.back.onclick(),
    zoom:f=>{ const r=svg.getBoundingClientRect(), mx=r.width/2, my=r.height/2;
      const ns=Math.max(.3,Math.min(2.4,scale*f)), k=ns/scale;
      tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply(); }};
}

/* Die beiden Navigationen. Beide merken sich ihre Ebene über die Modul-Variable, damit man
   nach dem Sprung in ein Thema und zurück wieder dort landet, wo man war. */
const TypeNav = (function(){
  let level = null;                       /* Kategorie oder null */
  return {
    up(){ if(level===null) return false; level=null; return true; },
    model(){
      const names = Object.keys(CAT);
      if(level && CAT[level]){
        const col = catColor(level, names.indexOf(level));
        const kids = CAT[level].map(it=>({
          id:it[0], title:it[1], badge:it[0], color:col, shape:chNumOf(it[0]), route:it[0] }));
        return { root:false, color:col, shape:3,
          center:{ title:level, sub:"↩ zurück zur Übersicht" },
          count: kids.length + (kids.length===1?" Eintrag":" Einträge"),
          crumb:["Nach Typ", level], kids,
          legend: shapeLegend(kids.map(k=>k.shape)) };
      }
      return { root:true, color:"#64748b", shape:3,
        center:{ title:"Nach Typ", sub:"Kategorie wählen" },
        count: names.length+" Kategorien", crumb:["Nach Typ"],
        kids: names.map((n,i)=>({ title:n, sub:CAT[n].length+" Einträge",
          color:catColor(n,i), shape:3, open:()=>{ level=n; } })),
        legend: null };
    }
  };
})();

const ChapterNav = (function(){
  let chId = null, secId = null;
  return {
    up(){ if(secId){ secId=null; return true; } if(chId){ chId=null; return true; } return false; },
    model(){
      if(chId && secId && byId.get(secId)){
        const se = byId.get(secId);
        const kids = se.topics.map(tp=>({
          id:tp.id, title:tp.title, badge:tp.id, color:topicColor(tp.id), shape:chId, route:tp.id }));
        return { root:false, color:chHex(chId), shape:chId,
          center:{ title:se.id+"  "+se.title, sub:"↩ zurück zu Kapitel "+chId },
          count: kids.length + (kids.length===1?" Thema":" Themen"),
          crumb:["Nach Kapitel", "Kap. "+chId, se.id], kids,
          legend: colorLegend(kids.map(k=>k.id)) };
      }
      if(chId && byId.get(chId)){
        const ch = byId.get(chId);
        const kids = ch.sections.map(se=>({
          id:se.id, title:se.title, badge:se.id, color:chHex(chId), shape:chId,
          sub: se.topics.length? se.topics.length+" Themen" : "direkt zur Karte",
          open: se.topics.length? (()=>{ secId=se.id; }) : null,
          route: se.topics.length? null : se.id }));
        return { root:false, color:chHex(chId), shape:chId,
          center:{ title:"Kapitel "+chId, sub:"↩ zurück zur Übersicht" },
          count: ch.sections.length+" Abschnitte",
          crumb:["Nach Kapitel", "Kap. "+chId], kids, legend:null };
      }
      return { root:true, color:"#64748b", shape:3,
        center:{ title:"Nach Kapitel", sub:"Kapitel wählen" },
        count: CH.length+" Kapitel", crumb:["Nach Kapitel"],
        kids: CH.map(ch=>({ title:"Kapitel "+ch.id, sub:CHSHORT[ch.id]||ch.title,
          color:chHex(ch.id), shape:ch.id, open:()=>{ chId=ch.id; } })),
        legend: shapeLegend(CH.map(c=>c.id)) };
    }
  };
})();

  }
  function showList(){
    host.innerHTML = `<div class="grid">`+ se.topics.map(tp=>`
      <a class="card" href="#/${tp.id}">
        <span class="cn">${tp.id}</span>
        <span class="ct">${esc(tp.title)}</span>
        <span class="cf"><span class="pill ${isDone(tp.id)?'done':'todo'}">${isDone(tp.id)?'✓ verstanden':'offen'}</span></span>
      </a>`).join("") + `</div>`;
  }
  document.querySelectorAll("#vt button").forEach(b=> b.onclick=()=>{
    document.querySelectorAll("#vt button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    b.dataset.v==="map"?showMap():showList();
  });
  showMap();
}

function renderTopic(tp){
  currentMap=null;
  const ch=chapterOf(tp);
  const idx=flat.indexOf(tp);
  const prev=idx>0?flat[idx-1]:null, next=idx<flat.length-1?flat[idx+1]:null;
  const ph = '<div class="placeholder">Inhalt folgt — wird in der nächsten Runde ergänzt.</div>';
  // Falls später tp.body gesetzt ist, wird es hier verwendet; sonst Platzhalter.
  const b = tp.body || {};
  function sec(cls,icon,title,html){ return `<section class="tsec ${cls||''}"><h3>${icon} ${title}</h3><div class="body">${html||ph}</div></section>`; }
  let inner;
  if(b.def!==undefined){
    const exs = (b.erfuellt||b.verletzt)
      ? (b.erfuellt?exBox(b.erfuellt,"✓ Beispiel — erfüllt"):"") + (b.verletzt?exBox(b.verletzt,"✗ Beispiel — verletzt / Gegenbeispiel"):"")
      : (b.beispiel?exBox(b.beispiel,"✏️ Beispiel — Rechenweg"):"");
    inner = sec("", "📐", "Mathematische Definition / Satz", b.def + (b.worte?exBox(b.worte,"🗣 In Worten"):"") + exs)
          + (b.plus? sec("linkh","➕","Gut zu wissen", b.plus) : "");
  } else {
    inner = sec("", "💡", "Kernidee", b.kernidee)
          + sec("", "📐", "Definition / Satz", b.satz)
          + sec("linkh", "🔗", "Zusammenhang (roter Faden)", b.zusammenhang)
          + sec("", "✏️", "Beispiel", b.beispiel)
          + sec("warnh", "⚠️", "Klausur-Falle", b.falle);
  }

  app.innerHTML = `
    ${crumbHtml(tp)}
    <div class="titlebar">
      <span class="num" style="background:var(--${ch.key})">${tp.id}</span>
      <h1>${esc(tp.title)}</h1>
    </div>
    <div class="srcline">
      <label class="chk ${isDone(tp.id)?'on':''}" id="chk">
        <input type="checkbox" ${isDone(tp.id)?'checked':''}> verstanden
      </label>
    </div>
    <div class="topic">${inner}</div>
    <div class="topnav">
      <span>${prev?`<a class="btn" href="#/${prev.id}">← ${esc(prev.id)}</a>`:''}</span>
      <span>${next?`<a class="btn" href="#/${next.id}">${esc(next.id)} →</a>`:''}</span>
    </div>`;

  const chk=document.getElementById("chk");
  chk.querySelector("input").onchange=(e)=>{ setDone(tp.id, e.target.checked); chk.classList.toggle("on", e.target.checked); };
}

/* =========================================================================
   8) Router
   ========================================================================= */
function typeset(){ if(window.renderMathInElement){ const opt={delimiters:[{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false,errorColor:"#dc2626"};
  try{ renderMathInElement(app,opt); }catch(e){}
  const b=document.querySelector(".brand small"); if(b){ try{ renderMathInElement(b,opt); }catch(e){} } } }
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h){ renderHome(); }
  else if(h.indexOf("ref/")===0){ renderRef(h.slice(4)); }
  else { const node=byId.get(h);
    if(!node || node.kind==="chapter"){ renderHome(); }
    else if(node.kind==="section"){ renderSection(node); }
    else { renderTopic(node); }
  }
  window.scrollTo(0,0);
  typeset();
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", ()=>{ if(currentMap) currentMap.fit(); });

/* =========================================================================
   9) Suche
   ========================================================================= */
const searchEl=document.getElementById("search"), resEl=document.getElementById("results");
const searchIndex=[];
byId.forEach(n=>{ if(n.kind==="section"||n.kind==="topic") searchIndex.push(n); });
Object.keys(REF).forEach(k=> searchIndex.push({id:"ref/"+k, title:REF[k].title, kind:"ref"}));
let activeRes=-1, curRes=[];
function runSearch(q){
  q=q.trim().toLowerCase();
  if(!q){ resEl.classList.remove("show"); return; }
  curRes = searchIndex.filter(n=> (n.id+" "+n.title).toLowerCase().includes(q)).slice(0,12);
  activeRes=-1;
  resEl.innerHTML = curRes.length? curRes.map((n,i)=>`
     <a href="#/${n.id}" data-i="${i}"><span class="tag">${n.kind==="section"?"Abschnitt":n.kind==="ref"?"Referenz":"Thema"} ${n.kind==="ref"?"":n.id}</span><br>${esc(n.title)}</a>
   `).join("") : `<a><span class="tag">Kein Treffer</span></a>`;
  resEl.classList.add("show");
}
searchEl.addEventListener("input",()=>runSearch(searchEl.value));
searchEl.addEventListener("keydown",e=>{
  if(!resEl.classList.contains("show")||!curRes.length) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); activeRes=Math.min(curRes.length-1,activeRes+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); activeRes=Math.max(0,activeRes-1); }
  else if(e.key==="Enter"){ if(activeRes>=0){ e.preventDefault(); go(curRes[activeRes].id); searchEl.value=""; resEl.classList.remove("show"); searchEl.blur(); } return; }
  else return;
  resEl.querySelectorAll("a").forEach((a,i)=>a.classList.toggle("active",i===activeRes));
});
resEl.addEventListener("click",e=>{ const a=e.target.closest("a"); if(a&&a.dataset.i!==undefined){ searchEl.value=""; resEl.classList.remove("show"); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) resEl.classList.remove("show"); });

/* Roadmap-Interaktion (horizontale Konvergenz-Roadmaps) */
app.addEventListener("click", e=>{
  const btn=e.target.closest(".rmnode"); if(!btn) return;
  const rm=btn.closest(".roadmap"); if(!rm) return;
  const panel=rm.querySelector("#"+btn.dataset.rm);
  const wasOpen=panel && !panel.hidden;
  rm.querySelectorAll(".rmpanel").forEach(p=>p.hidden=true);
  rm.querySelectorAll(".rmnode").forEach(n=>n.classList.remove("on"));
  if(panel && !wasOpen){ panel.hidden=false; btn.classList.add("on"); }
});

/* ---- Start ---- */
updateProgress();
route();
</script>
