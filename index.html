        plus: String.raw`<p><b>Merksatz.</b> „Beschränkt“ heißt <i>nicht</i> „beschränktes Bild“, sondern „beschränkter Streckfaktor“. Für lineare Operatoren sind stetig, beschränkt und Lipschitz-stetig ein und dasselbe: aus \(\|Tx\|_F\le C\|x\|_E\) folgt \(\|Tx-Ty\|_F=\|T(x-y)\|_F\le C\|x-y\|_E\).</p><p><b>Dimension entscheidet.</b> Von \(\mathbb{K}^m\) nach \(\mathbb{K}^n\) ist jeder lineare Operator automatisch beschränkt (Hausaufgabe der Vorlesung) — Gegenbeispiele wie der Ableitungsoperator gibt es nur in unendlichdimensionalen Räumen. Genau deshalb ist die Frage „linear und stetig?“ in Analysis 1 nie aufgetaucht und wird hier plötzlich wichtig.</p><p><b>Beweistechnik zum Mitnehmen.</b> Die Gegenannahme läuft über zwei Skalierungen, die den Quotienten \(\|Tx\|_F/\|x\|_E\) invariant lassen. Dieses Homogenitätsargument taucht in <a href="#/7.2.5">7.2.5</a> erneut auf, wenn das Supremum über \(x\neq\mathbf{0}_E\) durch das Supremum über die Einheitssphäre \(\|x\|_E=1\) ersetzt wird. Vergleiche auch <a href="#/ref/beweise">Beweistechniken</a>.</p>`}},
       {id:"7.2.4", title:"Beispiele: Multiplikations-, Auswertungs- und Ableitungsoperator", body:{
        def: String.raw`<p>Der Beispielkatalog der Vorlesung zu §7.2 (jeweils mit dem Nachweis der Beschränktheitskonstante \(C\) aus <a href="#/7.2.3">7.2.3</a>):</p><p><b>Beispiel ③ (Multiplikationsoperator).</b> \(D_T=E=F=C([0,1],\mathbb{K})\), \(\varphi\in C([0,1],\mathbb{K})\) fest, \((T_\varphi f)(x)=\varphi(x)\cdot f(x)\), \(x\in[0,1]\). Es gilt \(\|T_\varphi f\|_C\le\|\varphi\|_C\cdot\|f\|_C\), also \(C=\|\varphi\|_C\).</p><p><b>Beispiel ④ (Auswertungsfunktional).</b> \(D_T=E=C([0,1],\mathbb{K})\), \(F=\mathbb{K}\), \(y\in[0,1]\), \(\delta_y f=f(y)\). Wegen \(F=\mathbb{K}\) spricht man von einem <b>linearen Funktional</b>. Es gilt \(|\delta_y f|\le\|f\|_C\), also \(C=1\). Die Physiker schreiben dafür \(\int\delta(x-y)f(x)\,dx=f(y)\).</p><p><b>Beispiel ⑤ (Ableitungsoperator, unbeschränkt).</b> \(E=F=C([0,1],\mathbb{R})\), \(D_T=C^1([0,1],\mathbb{R})\), \((Tf)(x)=\dfrac{df(x)}{dx}\). Nicht stetig, unbeschränkt.</p><p><b>Beispiel ⑤a (Ableitungsoperator, beschränkt).</b> \(E=D_T=C^1([0,1],\mathbb{K})\) mit \(\|f\|_{C^1}=\|f\|_C+\|f'\|_C\), \(F=C([0,1],\mathbb{K})\), gleiche Abbildungsvorschrift. Dann \(\|Tf\|_F\le\|f\|_E\), also \(C=1\): beschränkt.</p><p><b>Beispiel ⑥ (Integralfunktional).</b> \(D_T=E=C([0,1],\mathbb{K})\), \(F=\mathbb{K}\), \(\psi\in R[0,1]\), \(\ T_\psi f=\displaystyle\int_0^1\psi(x)\,f(x)\,dx\) (Hausaufgabe).</p>`,
        worte: String.raw`<p>Dieser Katalog ist die eigentliche Botschaft von §7.2: Beschränktheit ist keine Eigenschaft der <i>Abbildungsvorschrift</i> allein, sondern des Tripels aus Vorschrift, Definitionsbereich und den beiden Normen. Am deutlichsten zeigen das die Beispiele ⑤ und ⑤a — es ist zweimal dieselbe Operation „ableiten“, und trotzdem einmal unstetig und einmal stetig. Der Unterschied liegt allein darin, wie man den Definitionsbereich misst: mit \(\|\cdot\|_C\) ist die Ableitung nicht kontrollierbar, mit \(\|\cdot\|_{C^1}=\|\cdot\|_C+\|(\cdot)'\|_C\) steckt die Ableitung bereits in der Norm und die Abschätzung wird trivial.</p><p>Die anderen Beispiele liefern die drei Grundmuster, die im ganzen Kapitel wiederkehren. Der Multiplikationsoperator \(T_\varphi\) ist das Funktionenraum-Analogon einer Diagonalmatrix: er wirkt punktweise, und der größte auftretende Faktor \(\|\varphi\|_C\) ist die Streckkonstante. Das Auswertungsfunktional \(\delta_y\) und das Integralfunktional \(T_\psi\) sind lineare Funktionale, also Operatoren mit Werten im Grundkörper — sie fassen eine ganze Funktion in einer Zahl zusammen und bilden den Dualraum, der in <a href="#/7.2.7">7.2.7</a> wieder auftaucht.</p><p>Der Ableitungsoperator hat noch eine zweite Besonderheit: sein Definitionsbereich \(D_T=C^1\) ist ein echter Teilraum von \(E=C\). Genau dafür wurde in <a href="#/7.2.1">7.2.1</a> überhaupt zwischen \(D_T\) und \(E\) unterschieden. Ab <a href="#/7.2.5">7.2.5</a> wird dann \(D_T=E\) vorausgesetzt, weil man sonst keinen vernünftigen Vektorraum von Operatoren bekommt.</p>`,
        beispiel: String.raw`<p><b>1) Normabschätzung für \(T_\varphi\) (Beispiel ③).</b> Für \(f\in C([0,1],\mathbb{K})\):</p>\[\|T_\varphi f\|_C=\max_{x\in[0,1]}\big|(T_\varphi f)(x)\big|=\max_{x\in[0,1]}|\varphi(x)f(x)|\le\Big(\max_{x\in[0,1]}|\varphi(x)|\Big)\cdot\Big(\max_{x\in[0,1]}|f(x)|\Big)=\|\varphi\|_C\cdot\|f\|_C.\]<p>Der entscheidende Schritt ist die mittlere Ungleichung: das Maximum eines Produkts ist höchstens das Produkt der Maxima (die Maximalstellen von \(|\varphi|\) und \(|f|\) müssen ja nicht übereinstimmen). Also ist \(T_\varphi\) beschränkt mit \(C=\|\varphi\|_C\), damit stetig. Zahlenbeispiel: \(\varphi(x)=1+x^2\) liefert \(\|\varphi\|_C=\max_{x\in[0,1]}(1+x^2)=2\), also \(\|T_\varphi f\|_C\le 2\|f\|_C\).</p><p><b>2) Normabschätzung für \(\delta_y\) (Beispiel ④).</b></p>\[|\delta_y f|=|f(y)|\le\max_{x\in[0,1]}|f(x)|=\|f\|_C,\qquad f\in C([0,1],\mathbb{K}),\]<p>also \(C=1\). Beachten Sie: dieselbe Abschätzung mit \(\|f\|_{L^1}=\int_0^1|f(x)|\,dx\) an Stelle von \(\|f\|_C\) ist <i>falsch</i> — punktweise Auswertung lässt sich durch ein Integral nicht kontrollieren (man schiebe einen schmalen hohen Puls unter die Stelle \(y\)). Die Vorlesung merkt zu \(\|\cdot\|_{L^1}\) außerdem an, dass es auf \(R[0,1]\) gar keine Norm ist.</p><p><b>3) Ableitungsoperator: ⑤ gegen ⑤a.</b> In ⑤ ist \(E=C\); mit \(f_n(x)=\sin(n\pi x)\) gilt \(\|f_n\|_E=1\), aber \(\|Tf_n\|_F=n\pi\to\infty\): unbeschränkt. In ⑤a ist \(E=C^1\), und für <i>jedes</i> \(f\in C^1([0,1],\mathbb{K})\)</p>\[\|Tf\|_F=\|Tf\|_C=\|f'\|_C\le\|f\|_C+\|f'\|_C=\|f\|_{C^1}=\|f\|_E,\]<p>also \(C=1\): beschränkt. Kontrolle an derselben Folge: \(\|f_n\|_{C^1}=1+n\pi\) und \(\|Tf_n\|_C=n\pi\le 1+n\pi\) — die Abschätzung hält, weil der Nenner mitwächst.</p><p><b>4) Integralfunktional \(T_\psi\) (Beispiel ⑥, Hausaufgabe).</b> Linearität folgt aus der Linearität des Integrals:</p>\[T_\psi(\alpha f+\beta g)=\int_0^1\psi(x)\big(\alpha f(x)+\beta g(x)\big)dx=\alpha\int_0^1\psi f\,dx+\beta\int_0^1\psi g\,dx=\alpha\,T_\psi f+\beta\,T_\psi g.\]<p>Beschränktheit über die Standardabschätzung des Integrals:</p>\[|T_\psi f|=\Big|\int_0^1\psi(x)f(x)\,dx\Big|\le\int_0^1|\psi(x)|\,|f(x)|\,dx\le\|f\|_C\int_0^1|\psi(x)|\,dx,\]<p>also \(C=\int_0^1|\psi(x)|\,dx<\infty\), da \(\psi\in R[0,1]\) und mit \(\psi\) auch \(|\psi|\) Riemann-integrierbar ist. Zahlenbeispiel \(\psi(x)=x\): \(C=\int_0^1 x\,dx=\tfrac12\), also \(|T_\psi f|\le\tfrac12\|f\|_C\).</p>`,
        plus: String.raw`<p><b>Klausurfalle Nummer eins.</b> Auf die Frage „ist der Ableitungsoperator stetig?“ gibt es ohne Angabe der Normen keine Antwort. Immer zuerst \(D_T\), \(E\) mit \(\|\cdot\|_E\) und \(F\) mit \(\|\cdot\|_F\) hinschreiben — die Beispiele ⑤ und ⑤a unterscheiden sich in nichts anderem.</p><p><b>Querverbindung.</b> \(\delta_y\) ist die mathematisch saubere Version dessen, was in der Physik als Dirac-Delta unter einem Integral geschrieben wird: \(\delta\) ist keine Funktion, sondern ein stetiges lineares Funktional auf \(C([0,1],\mathbb{K})\). Das Integralfunktional \(T_\psi\) ist der „gutartige“ Fall, in dem sich das Funktional wirklich durch eine integrierbare Dichte \(\psi\) darstellen lässt.</p><p><b>Ausblick.</b> Genau diese Beispiele werden in <a href="#/7.2.5">7.2.5</a> wieder aufgegriffen, um Operatornormen exakt zu berechnen: es stellt sich heraus, dass \(\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\) und \(\|\delta_y\|_{\mathcal{L}}=1\) gilt, die oben gefundenen Konstanten also bereits optimal sind. Zu den zugrundeliegenden Räumen \(C(X,Y)\) mit \(\|\cdot\|_C\) siehe <a href="#/6.2.1">6.2.1</a>.</p>`}},
       {id:"7.2.5", title:"Der Raum L(E,F) und die Operatornorm", body:{
        def: String.raw`<p>Seien \((E,\|\cdot\|_E)\), \((F,\|\cdot\|_F)\) normierte Räume über \(\mathbb{K}\). Ab jetzt sei stets \(D_T=E\).</p><p><b>Definition.</b> \(\mathcal{L}(E,F)\) bezeichnet die Menge aller Operatoren \(T:D_T=E\to F\), die <b>linear und stetig</b> (gleichbedeutend: linear und beschränkt) sind. Der <b>Nulloperator</b> \(\mathbf{0}_{\mathcal{L}}\in\mathcal{L}(E,F)\) ist durch \(\mathbf{0}_{\mathcal{L}}x=\mathbf{0}_F\), \(x\in E\), gegeben.</p><p><b>Satz.</b> \(\mathcal{L}(E,F)\) ist ein Vektorraum über \(\mathbb{K}\) mit</p>\[(T_1+T_2)f=T_1f+T_2f,\quad f\in E,\qquad (\alpha T_1)f=\alpha\cdot(T_1f),\quad \alpha\in\mathbb{K}.\]<p>(Hausaufgabe: die so konstruierten Abbildungen sind selbst wieder linear und stetig, und die Vektorraumaxiome gelten.)</p><p><b>Tafelrechnung dazu (z.B. die Summe).</b> Aus \(\|T_1x\|_F\le C_1\|x\|_E\) und \(\|T_2x\|_F\le C_2\|x\|_E\) folgt</p>\[\|(T_1+T_2)x\|_F=\|T_1x+T_2x\|_F\le\|T_1x\|_F+\|T_2x\|_F\le C_1\|x\|_E+C_2\|x\|_E=(C_1+C_2)\,\|x\|_E,\qquad x\in E,\]<p>d.h. \(C=C_1+C_2\) ist eine zulässige Konstante für \(T_1+T_2\); Summen beschränkter Operatoren sind also wieder beschränkt.</p><p><b>Definition (Operatornorm).</b> Für \(T\in\mathcal{L}(E,F)\):</p>\[\|T\|_{\mathcal{L}(E,F)}=\sup_{x\in E,\ x\neq\mathbf{0}_E}\frac{\|Tx\|_F}{\|x\|_E}<\infty.\]<p><b>Satz.</b> \(\|\cdot\|_{\mathcal{L}(E,F)}\) ist eine Norm auf \(\mathcal{L}(E,F)\).</p><p><b>Anmerkung.</b> Man kann \(\sup_{x\in E,\ x\neq\mathbf{0}_E}\) ersetzen durch \(\sup_{x\in E,\ \|x\|_E=1}\) (oder auch \(\sup_{x\in E,\ \|x\|_E\le 1,\ x\neq\mathbf{0}_E}\)).</p><p><b>Anmerkung (Grundabschätzung).</b> Für \(T\in\mathcal{L}(E,F)\) und \(x\in E\) gilt immer</p>\[\|Tx\|_F\le\|T\|_{\mathcal{L}(E,F)}\cdot\|x\|_E.\]<p><b>Beweis der Normaxiome.</b> (1) Alle Quotienten \(\|Tx\|_F/\|x\|_E\) sind \(\ge 0\), nach Supremumsbildung also \(\|T\|_{\mathcal{L}}\ge 0\). Ist \(\|T\|_{\mathcal{L}}=0\), so folgt \(\|Tx\|_F=0\) und damit \(Tx=\mathbf{0}_F\) für alle \(x\in E\), also \(T=\mathbf{0}_{\mathcal{L}}\). (2) \(\displaystyle\|\alpha T\|_{\mathcal{L}}=\sup_{x\neq\mathbf{0}_E}\frac{\|\alpha(Tx)\|_F}{\|x\|_E}=\sup_{x\neq\mathbf{0}_E}\frac{|\alpha|\,\|Tx\|_F}{\|x\|_E}=|\alpha|\,\|T\|_{\mathcal{L}}\). (3) \(\displaystyle\|T_1+T_2\|_{\mathcal{L}}=\sup_{x\neq\mathbf{0}_E}\frac{\|T_1x+T_2x\|_F}{\|x\|_E}\le\sup_{x\neq\mathbf{0}_E}\frac{\|T_1x\|_F}{\|x\|_E}+\sup_{x\neq\mathbf{0}_E}\frac{\|T_2x\|_F}{\|x\|_E}=\|T_1\|_{\mathcal{L}}+\|T_2\|_{\mathcal{L}}\). \(\ \square\)</p>`,
        worte: String.raw`<p>Bis hierher waren Operatoren einzelne Objekte, die man untersucht. Jetzt kommt der entscheidende Perspektivwechsel: die linearen stetigen Operatoren werden selbst zu <i>Punkten</i> eines neuen normierten Raums \(\mathcal{L}(E,F)\). Genau deshalb wird ab hier \(D_T=E\) verlangt — Operatoren mit verschiedenen Definitionsbereichen könnte man nicht sinnvoll addieren. Summe und skalares Vielfaches werden punktweise erklärt, genau wie bei Funktionen; die kleine Rechnung an der Tafel zeigt, dass Summen beschränkter Operatoren wieder beschränkt sind, weil man die Konstanten einfach addiert: \(C=C_1+C_2\).</p><p>Die Operatornorm misst den größtmöglichen Streckfaktor. Nach <a href="#/7.2.3">7.2.3</a> ist die Menge der zulässigen Konstanten \(C\) mit \(\|Tx\|_F\le C\|x\|_E\) genau für beschränkte \(T\) nichtleer, und \(\|T\|_{\mathcal{L}(E,F)}\) ist per Definition das Supremum der Quotienten, also die <b>kleinste</b> solche Konstante. Deshalb ist \(\|T\|_{\mathcal{L}}<\infty\) gleichbedeutend mit Beschränktheit, und die Grundabschätzung \(\|Tx\|_F\le\|T\|_{\mathcal{L}}\|x\|_E\) ist nur die Definition, rückwärts gelesen. Sie ist das meistbenutzte Werkzeug des ganzen Kapitels.</p><p>Dass man das Supremum auch über die Einheitssphäre \(\|x\|_E=1\) nehmen darf, liegt an der Homogenität: der Quotient \(\|Tx\|_F/\|x\|_E\) ändert sich beim Umskalieren \(x\mapsto\lambda x\) überhaupt nicht, denn Zähler und Nenner bekommen beide den Faktor \(|\lambda|\). Man verliert also nichts, wenn man von vornherein auf Länge \(1\) normiert — dasselbe Argument wie in Schritt 1 des Beweises von <a href="#/7.2.3">7.2.3</a>.</p><p>Der Nachweis der Normaxiome verläuft dann völlig mechanisch: Positivität und Definitheit aus der Definitheit von \(\|\cdot\|_F\), absolute Homogenität durch Herausziehen von \(|\alpha|\), und die Dreiecksungleichung, indem man erst in \(F\) abschätzt und danach das Supremum auf die beiden Summanden verteilt (\(\sup(a+b)\le\sup a+\sup b\)).</p>`,
        beispiel: String.raw`<p><b>1) \(\|\delta_y\|_{\mathcal{L}(C([0,1],\mathbb{K}),\mathbb{K})}=1\).</b> Nach <a href="#/7.2.4">7.2.4</a> gilt \(|\delta_y f|\le\|f\|_C\), also \(\|\delta_y\|_{\mathcal{L}}\le 1\). Für die umgekehrte Ungleichung teste mit \(f\equiv 1\): dann ist \(\|f\|_C=1\) und \(|\delta_y f|=|f(y)|=1\), also</p>\[\|\delta_y\|_{\mathcal{L}}\ \ge\ \frac{|\delta_y f|}{\|f\|_C}=\frac{1}{1}=1.\]<p>Zusammen \(\|\delta_y\|_{\mathcal{L}}=1\), und das Supremum wird sogar angenommen.</p><p><b>2) \(\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\) auf \(E=F=C([0,1],\mathbb{K})\).</b> Aus <a href="#/7.2.4">7.2.4</a> ist \(\|T_\varphi f\|_C\le\|\varphi\|_C\|f\|_C\), also \(\|T_\varphi\|_{\mathcal{L}}\le\|\varphi\|_C\). Test wieder mit \(f\equiv 1\), \(\|f\|_C=1\):</p>\[\|T_\varphi f\|_C=\max_{x\in[0,1]}|\varphi(x)\cdot 1|=\|\varphi\|_C\quad\Longrightarrow\quad \|T_\varphi\|_{\mathcal{L}}\ge\|\varphi\|_C.\]<p>Also \(\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\). Zahlenbeispiel: \(\varphi(x)=1+x^2\) liefert \(\|T_\varphi\|_{\mathcal{L}}=\max_{x\in[0,1]}(1+x^2)=2\).</p><p><b>3) Integralfunktional (Beispiel ⑥) mit \(\psi(x)=x\).</b> Es ist \(|T_\psi f|\le\|f\|_C\int_0^1 x\,dx=\tfrac12\|f\|_C\), also \(\|T_\psi\|_{\mathcal{L}}\le\tfrac12\). Mit \(f\equiv 1\) folgt \(T_\psi f=\int_0^1 x\,dx=\tfrac12\) und \(\|f\|_C=1\), also \(\|T_\psi\|_{\mathcal{L}}\ge\tfrac12\). Somit \(\|T_\psi\|_{\mathcal{L}}=\tfrac12\). (Der Testvektor \(f\equiv 1\) funktioniert hier, weil \(\psi\ge 0\) auf \([0,1]\) ist. Allgemein gilt \(\|T_\psi\|_{\mathcal{L}}=\int_0^1|\psi(x)|\,dx\); bei vorzeichenwechselndem \(\psi\) muss man \(f\) stetig an \(\operatorname{sgn}\psi\) annähern, und das Supremum wird dann im Allgemeinen <i>nicht</i> angenommen.)</p><p><b>4) Die Dreiecksungleichung an einem Zahlenbeispiel.</b> \(E=F=C([0,1],\mathbb{R})\), \(T_1=T_{\varphi_1}\) mit \(\varphi_1(x)=x\) und \(T_2=T_{\varphi_2}\) mit \(\varphi_2(x)=1-x\). Dann \(\|T_1\|_{\mathcal{L}}=\|\varphi_1\|_C=1\) und \(\|T_2\|_{\mathcal{L}}=\|\varphi_2\|_C=1\), aber \(T_1+T_2=T_{\varphi_1+\varphi_2}\) mit \(\varphi_1+\varphi_2\equiv 1\), also \(\|T_1+T_2\|_{\mathcal{L}}=1\le 1+1=2\). Die Ungleichung darf echt sein.</p>`,
        plus: String.raw`<p><b>Das Wichtigste in einem Satz.</b> \(\|T\|_{\mathcal{L}(E,F)}\) ist die kleinste Konstante \(C\), die in \(\|Tx\|_F\le C\|x\|_E\) funktioniert. Wer eine Operatornorm exakt bestimmen soll, macht deshalb immer zwei Schritte: erst eine Abschätzung \(\le C\) für alle \(x\), dann einen konkreten Testvektor, der \(C\) (fast) erreicht.</p><p><b>Vorsicht: Supremum, nicht Maximum.</b> Es kann sein, dass kein \(x\) das Supremum annimmt. Beispiel ⑤a: für \(T:C^1([0,1],\mathbb{R})\to C([0,1],\mathbb{R})\), \(Tf=f'\), gilt \(\|Tf\|_C/\|f\|_{C^1}=\|f'\|_C/(\|f\|_C+\|f'\|_C)<1\) für jedes \(f\neq\mathbf{0}_E\). Mit \(f_n(x)=\tfrac1n\sin(n\pi x)\) ist aber \(\|f_n\|_C=\tfrac1n\), \(\|f_n'\|_C=\pi\) und damit</p>\[\frac{\|Tf_n\|_C}{\|f_n\|_{C^1}}=\frac{\pi}{\tfrac1n+\pi}\ \longrightarrow\ 1,\]<p>also \(\|T\|_{\mathcal{L}}=1\), ohne dass das Supremum angenommen wird.</p><p><b>Notation.</b> Die Vorlesung kürzt den Index häufig zu \(\|T\|_{\mathcal{L}}\) ab, wenn klar ist, welche Räume gemeint sind. Für den Nulloperator schreibt die Tafel die durchgestrichene Null mit Index \(\mathcal{L}\); hier steht \(\mathbf{0}_{\mathcal{L}}\).</p><p><b>Roter Faden.</b> Erst dadurch, dass \(\mathcal{L}(E,F)\) selbst ein normierter Raum ist, kann man in §7.3 von der Fréchet-Ableitung \(f'(x_0)\in\mathcal{L}(E,F)\) sprechen, Ableitungen vergleichen und in <a href="#/7.2.7">7.2.7</a> sogar Grenzwerte von Operatorfolgen bilden. Vergleiche den analogen Aufbau bei \(C(X,Y)\) mit \(\|\cdot\|_C\) in <a href="#/6.2.1">6.2.1</a>.</p>`}},
       {id:"7.2.6", title:"Komposition und Submultiplikativität", body:{
        def: String.raw`<p>Seien \((E,\|\cdot\|_E)\), \((F,\|\cdot\|_F)\), \((G,\|\cdot\|_G)\) normierte Räume über \(\mathbb{K}\) und</p>\[T\in\mathcal{L}(E,F),\qquad S\in\mathcal{L}(F,G).\]<p><b>Satz.</b> Für die Komposition \(ST=S\circ T:E\to G\), also \((ST)x=S(Tx)\), gilt</p>\[ST\in\mathcal{L}(E,G)\qquad\text{mit}\qquad \|ST\|_{\mathcal{L}(E,G)}\ \le\ \|S\|_{\mathcal{L}(F,G)}\cdot\|T\|_{\mathcal{L}(E,F)}.\]<p><b>Beweisidee.</b></p><ul><li><b>Linearität:</b> \((ST)(\alpha x+\beta y)=S\big(\alpha Tx+\beta Ty\big)=\alpha S(Tx)+\beta S(Ty)=\alpha (ST)x+\beta (ST)y\).</li><li><b>Beschränktheit:</b> zweimalige Anwendung der Grundabschätzung aus <a href="#/7.2.5">7.2.5</a>, erst in \(G\), dann in \(F\):</li></ul>\[\|(ST)x\|_G=\|S(Tx)\|_G\le\|S\|_{\mathcal{L}(F,G)}\,\|Tx\|_F\le\|S\|_{\mathcal{L}(F,G)}\,\|T\|_{\mathcal{L}(E,F)}\,\|x\|_E,\qquad x\in E.\]<p>Also ist \(ST\) beschränkt, damit stetig, und nach Division durch \(\|x\|_E\) und Supremumsbildung über \(x\neq\mathbf{0}_E\) folgt die behauptete Ungleichung. \(\ \square\)</p><p><b>Folgerungen (Zusatz, an der Tafel nicht ausgeführt).</b> Für \(E=F=G\) ist \(\mathcal{L}(E,E)\) mit der Komposition als Produkt eine Algebra; die Identität \(\mathbf{1}\in\mathcal{L}(E,E)\), \(\mathbf{1}x=x\), erfüllt \(\|\mathbf{1}\|_{\mathcal{L}}=1\) (für \(E\neq\{\mathbf{0}_E\}\)), und induktiv gilt \(\|T^n\|_{\mathcal{L}}\le\|T\|_{\mathcal{L}}^n\) für \(n\in\mathbb{N}\).</p>`,
        worte: String.raw`<p>Die Aussage ist die Operator-Version der schlichten Beobachtung, dass sich Streckfaktoren beim Hintereinanderausführen multiplizieren: wenn \(T\) höchstens um den Faktor \(\|T\|_{\mathcal{L}}\) streckt und \(S\) höchstens um \(\|S\|_{\mathcal{L}}\), dann streckt \(S\circ T\) höchstens um das Produkt. Man nennt diese Eigenschaft <b>Submultiplikativität</b> — „sub“, weil nur \(\le\) und nicht \(=\) gilt.</p><p>Dass Gleichheit im Allgemeinen falsch ist, hat einen anschaulichen Grund: \(T\) erreicht seinen maximalen Streckfaktor auf gewissen Vektoren, \(S\) auf gewissen anderen. Nur wenn \(T\) seine eigenen „guten“ Vektoren gerade in die „guten“ Vektoren von \(S\) hineinschiebt, kommt das volle Produkt heraus. Im Zahlenbeispiel unten liegen die Maximalstellen der beiden Multiplikatoren an verschiedenen Enden des Intervalls, und der Verlust ist dramatisch.</p><p>Die Vorlesung notiert die Komposition multiplikativ, also \(ST\) statt \(S\circ T\). Das ist Absicht: \(\mathcal{L}(E,E)\) verhält sich wie ein Ring, in dem man Operatoren multiplizieren, Potenzen \(T^n\) bilden und Polynome in \(T\) einsetzen kann — allerdings ohne Kommutativität, genau wie bei Matrizen. Die Abschätzung \(\|T^n\|_{\mathcal{L}}\le\|T\|_{\mathcal{L}}^n\) ist der Schlüssel dazu, dass Reihen von Operatoren konvergieren, sobald \(\|T\|_{\mathcal{L}}<1\) ist.</p><p>Praktisch verwendet man den Satz meistens nicht, um Normen auszurechnen, sondern um sich Arbeit zu sparen: sobald zwei Operatoren stetig sind, ist ihre Verkettung automatisch stetig, und man hat sofort eine brauchbare Konstante.</p>`,
        beispiel: String.raw`<p><b>1) Zwei Multiplikationsoperatoren, Ungleichung echt.</b> Sei \(E=F=G=C([0,1],\mathbb{R})\) und</p>\[\varphi(x)=x,\qquad \psi(x)=1-x,\qquad T=T_\psi,\quad S=T_\varphi.\]<p>Zunächst ist \((ST)f=T_\varphi(T_\psi f)\), also punktweise \(\big((ST)f\big)(x)=\varphi(x)\psi(x)f(x)\); die Komposition zweier Multiplikationsoperatoren ist also wieder einer: \(ST=T_{\varphi\psi}\). Nach <a href="#/7.2.5">7.2.5</a> gilt \(\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\) und damit</p>\[\|S\|_{\mathcal{L}}=\max_{x\in[0,1]}|x|=1,\qquad \|T\|_{\mathcal{L}}=\max_{x\in[0,1]}|1-x|=1,\]\[\|ST\|_{\mathcal{L}}=\|\varphi\psi\|_C=\max_{x\in[0,1]}x(1-x).\]<p>Die Funktion \(x\mapsto x(1-x)=x-x^2\) hat die Ableitung \(1-2x\), also das Maximum bei \(x=\tfrac12\) mit Wert \(\tfrac12\cdot\tfrac12=\tfrac14\). Somit</p>\[\|ST\|_{\mathcal{L}}=\tfrac14\ \le\ 1\cdot 1=\|S\|_{\mathcal{L}}\cdot\|T\|_{\mathcal{L}},\]<p>und die Ungleichung ist echt. Der Grund: \(|\varphi|\) wird bei \(x=1\) maximal, \(|\psi|\) bei \(x=0\) — die beiden Maximalstellen liegen auseinander.</p><p><b>2) Gleichheit ist möglich.</b> Mit \(\varphi=\psi\), etwa \(\varphi(x)=1+x\), ist \(ST=T_{\varphi^2}\) und</p>\[\|ST\|_{\mathcal{L}}=\|\varphi^2\|_C=\Big(\max_{x\in[0,1]}(1+x)\Big)^2=2^2=4=\|\varphi\|_C\cdot\|\varphi\|_C=\|S\|_{\mathcal{L}}\|T\|_{\mathcal{L}}.\]<p>Ebenso liefert \(S=T=\mathbf{1}\) sofort \(\|\mathbf{1}\mathbf{1}\|_{\mathcal{L}}=\|\mathbf{1}\|_{\mathcal{L}}=1=1\cdot 1\).</p><p><b>3) Funktional nach Operator.</b> Sei \(T=T_\varphi\in\mathcal{L}(C([0,1],\mathbb{K}),C([0,1],\mathbb{K}))\) und \(S=\delta_y\in\mathcal{L}(C([0,1],\mathbb{K}),\mathbb{K})\). Dann ist \(ST\in\mathcal{L}(C([0,1],\mathbb{K}),\mathbb{K})\) mit</p>\[(ST)f=\delta_y(T_\varphi f)=(T_\varphi f)(y)=\varphi(y)\,f(y)=\varphi(y)\,\delta_y f,\]<p>also \(ST=\varphi(y)\,\delta_y\) und \(\|ST\|_{\mathcal{L}}=|\varphi(y)|\cdot\|\delta_y\|_{\mathcal{L}}=|\varphi(y)|\). Wegen \(|\varphi(y)|\le\|\varphi\|_C\) ist das in Einklang mit \(\|ST\|_{\mathcal{L}}\le\|\delta_y\|_{\mathcal{L}}\|T_\varphi\|_{\mathcal{L}}=1\cdot\|\varphi\|_C\), und für \(\varphi(x)=x\), \(y=\tfrac13\) erhält man \(\tfrac13\le 1\).</p>`,
        plus: String.raw`<p><b>Reihenfolge beachten.</b> In \(ST\) wirkt zuerst \(T\), dann \(S\) — wie bei Matrizen und wie bei \(S\circ T\). Die Zwischenräume müssen zusammenpassen: \(T\) landet in \(F\), und genau dort startet \(S\). In Klausuren wird gern die falsche Reihenfolge angeboten.</p><p><b>Notation.</b> Für die Identität schreibt die Tafel eine doppelt gestrichene Eins; hier steht \(\mathbf{1}\). Es ist \(\mathbf{1}\in\mathcal{L}(E,E)\) und \(\|\mathbf{1}\|_{\mathcal{L}}=1\), sofern \(E\) nicht der Nullraum ist.</p><p><b>Wozu das später gut ist.</b> Die Submultiplikativität ist die Grundlage der Kettenregel für Fréchet-Ableitungen: die Ableitung einer Verkettung ist die Komposition der Ableitungen, und ihre Norm wird durch das Produkt der Normen kontrolliert. Zusammen mit \(\|T^n\|_{\mathcal{L}}\le\|T\|_{\mathcal{L}}^n\) und der Vollständigkeit aus <a href="#/7.2.7">7.2.7</a> liefert sie außerdem — für <i>vollständiges</i> \(E\), denn nur dann ist \(\mathcal{L}(E,E)\) vollständig — dass \(\mathbf{1}-T\) für \(\|T\|_{\mathcal{L}}<1\) invertierbar ist (geometrische Reihe für Operatoren); das ist das Werkzeug hinter dem Satz über implizite Funktionen. Vergleiche <a href="#/ref/konv_summen">Konvergenz von Reihen</a>.</p>`}},
       {id:"7.2.7", title:"Vollständigkeit von L(E,F)", body:{
        def: String.raw`<p><b>Satz.</b> Sei \((F,\|\cdot\|_F)\) vollständig. Dann ist \(\big(\mathcal{L}(E,F),\|\cdot\|_{\mathcal{L}(E,F)}\big)\) vollständig, also ein Banachraum.</p><p><b>Beweisskizze.</b> Sei \((T_n)\) eine Cauchyfolge in \(\mathcal{L}(E,F)\), kurz \(T_n\in CF\big(\mathcal{L}(E,F)\big)\). Konstruiert wird ein \(T\in\mathcal{L}(E,F)\) mit \(T_n\to T\) in \(\|\cdot\|_{\mathcal{L}}\).</p><p><b>Schritt 1 (Konstruktion von \(T\)).</b> Sei \(x\in E\) fest und \(y_n=T_nx\in F\). Mit der Grundabschätzung aus <a href="#/7.2.5">7.2.5</a></p>\[\|y_n-y_m\|_F=\|T_nx-T_mx\|_F=\|(T_n-T_m)x\|_F\le\|T_n-T_m\|_{\mathcal{L}(E,F)}\cdot\|x\|_E,\]<p>und wegen \(\|T_n-T_m\|_{\mathcal{L}(E,F)}<\varepsilon\) für \(n,m\ge N_\varepsilon\) ist \((y_n)_{n\in\mathbb{N}}\in CF(F)\). Da \(F\) vollständig ist, existiert \(y=y(x)\in F\) mit \(y_n\to y\) in \(\|\cdot\|_F\). Damit ist eine Abbildung</p>\[T:E\to F,\qquad T:x\mapsto y(x)=\lim_{n\to\infty}T_nx\ \ \text{(Limes in } \|\cdot\|_F)\]<p>erklärt.</p><p><b>Schritt 2 (\(T\in\mathcal{L}(E,F)\)).</b> Linearität für \(\alpha,\beta\in\mathbb{K}\), \(x',x''\in E\):</p>\[T(\alpha x'+\beta x'')=\lim_{n\to\infty}T_n(\alpha x'+\beta x'')=\lim_{n\to\infty}\big(\alpha T_nx'+\beta T_nx''\big)=\alpha\lim_{n\to\infty}T_nx'+\beta\lim_{n\to\infty}T_nx''=\alpha Tx'+\beta Tx''.\]<p>Stetigkeit: jede Cauchyfolge ist beschränkt, es existiert also \(C\in\mathbb{R}\) mit \(\|T_n\|_{\mathcal{L}}\le C\) für alle \(n\in\mathbb{N}\), und mit der Stetigkeit der Norm</p>\[\|Tx\|_F=\Big\|\lim_{n\to\infty}T_nx\Big\|_F=\lim_{n\to\infty}\|T_nx\|_F\le\Big(\sup_{n\in\mathbb{N}}\|T_n\|_{\mathcal{L}}\Big)\cdot\|x\|_E\le C\cdot\|x\|_E.\]<p><b>Schritt 3 (\(T_n\to T\) in \(\|\cdot\|_{\mathcal{L}}\)).</b> Zu \(\varepsilon>0\) existiert \(N_\varepsilon\in\mathbb{N}\) mit \(\|T_n-T_m\|_{\mathcal{L}(E,F)}<\varepsilon\) für \(n,m\ge N_\varepsilon\), also</p>\[\|T_nx-T_mx\|_F\le\|T_n-T_m\|_{\mathcal{L}}\,\|x\|_E\le\varepsilon\,\|x\|_E.\qquad (*)\]<p>Für \(m\to\infty\) gilt \(T_mx\to Tx\) in \(\|\cdot\|_F\), also \(T_nx-T_mx\to T_nx-Tx\) und damit \(\|T_nx-T_mx\|_F\to\|T_nx-Tx\|_F\). Aus \((*)\) folgt</p>\[\|T_nx-Tx\|_F\le\varepsilon\|x\|_E,\ x\in E\quad\Longrightarrow\quad \sup_{x\in E,\ x\neq\mathbf{0}_E}\frac{\|(T_n-T)x\|_F}{\|x\|_E}=\|T_n-T\|_{\mathcal{L}(E,F)}\le\varepsilon\]<p>für alle \(n\ge N_\varepsilon\), also \(T_n\to T\) in \(\mathcal{L}(E,F)\). \(\ \square\)</p>`,
        worte: String.raw`<p>Der Satz sagt: Vollständigkeit vererbt sich vom Zielraum auf den Operatorraum. Bemerkenswert ist, was <i>nicht</i> vorausgesetzt wird — über \(E\) wird nur verlangt, dass es ein normierter Raum ist. \(E\) darf Lücken haben; die Vollständigkeit von \(\mathcal{L}(E,F)\) hängt allein an \(F\). Der Grund ist im Beweis sofort sichtbar: die Grenzwerte werden ausschließlich in \(F\) gebildet, \(E\) liefert nur die Testvektoren.</p><p>Die Beweisstrategie ist dieselbe wie bei der Vollständigkeit von \(C(X,Y)\) in <a href="#/6.2.2">6.2.2</a> und lohnt sich als Muster: (1) Man gewinnt den Kandidaten für den Grenzwert punktweise — für jedes feste \(x\) ist \((T_nx)\) eine Cauchyfolge in \(F\), weil die Operatornorm-Cauchybedingung gleichmäßig in \(x\) ist. (2) Man zeigt, dass der punktweise Grenzwert die gewünschten Eigenschaften hat, hier Linearität (folgt aus der Rechenregel für Grenzwerte) und Stetigkeit (folgt daraus, dass Cauchyfolgen beschränkt sind, die Schranke \(C\) also unabhängig von \(n\) ist und beim Grenzübergang überlebt). (3) Man zeigt, dass die Konvergenz nicht nur punktweise, sondern in der Norm des Raums stattfindet — dazu friert man \(n\) ein und lässt nur \(m\to\infty\) laufen; die Ungleichung \((*)\) gilt gleichmäßig in \(x\) und überlebt deshalb den Grenzübergang.</p><p>Der Punkt, an dem Anfänger stolpern, ist Schritt 3: aus der punktweisen Konvergenz \(T_nx\to Tx\) folgt keineswegs automatisch \(\|T_n-T\|_{\mathcal{L}}\to 0\). Konvergenz in der Operatornorm ist gleichmäßige Konvergenz auf der Einheitssphäre, punktweise Konvergenz ist echt schwächer — genau derselbe Unterschied wie zwischen punktweiser und gleichmäßiger Konvergenz von Funktionenfolgen in Kapitel 6. Dass es hier trotzdem klappt, liegt daran, dass die Cauchybedingung von Anfang an in der Operatornorm formuliert war und die Schranke \(\varepsilon\|x\|_E\) nicht von \(n\) und \(m\) einzeln, sondern nur von \(N_\varepsilon\) abhängt.</p>`,
        beispiel: String.raw`<p><b>Eine Cauchyfolge von Multiplikationsoperatoren.</b> Sei \(E=F=C([0,1],\mathbb{R})\) mit \(\|\cdot\|_C\). Dieser Raum ist vollständig (Banachraum, vgl. <a href="#/6.2.2">6.2.2</a>), also ist \(\mathcal{L}(E,F)\) nach dem Satz vollständig.</p><p>Setze für \(n\in\mathbb{N}\)</p>\[\varphi_n(x)=\sum_{k=0}^{n}\frac{x^k}{k!},\qquad T_n:=T_{\varphi_n}\in\mathcal{L}(E,F),\quad (T_nf)(x)=\varphi_n(x)f(x).\]<p><b>Schritt A: \((T_n)\) ist eine Cauchyfolge.</b> Da \(\varphi\mapsto T_\varphi\) linear ist, gilt \(T_n-T_m=T_{\varphi_n-\varphi_m}\), und nach <a href="#/7.2.5">7.2.5</a> ist \(\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\). Für \(n>m\) also</p>\[\|T_n-T_m\|_{\mathcal{L}}=\|\varphi_n-\varphi_m\|_C=\max_{x\in[0,1]}\sum_{k=m+1}^{n}\frac{x^k}{k!}=\sum_{k=m+1}^{n}\frac{1}{k!}\ \le\ \sum_{k=m+1}^{\infty}\frac{1}{k!}\ \longrightarrow\ 0\quad (m\to\infty),\]<p>denn \(\sum_{k\ge 0}1/k!=e\) konvergiert. Zu \(\varepsilon>0\) gibt es also \(N_\varepsilon\) mit \(\|T_n-T_m\|_{\mathcal{L}}<\varepsilon\) für \(n,m\ge N_\varepsilon\).</p><p><b>Schritt B: Der Grenzoperator.</b> Nach dem Satz existiert \(T\in\mathcal{L}(E,F)\) mit \(\|T_n-T\|_{\mathcal{L}}\to 0\). Man kann ihn hier explizit angeben: mit \(\varphi(x)=e^x\) ist \(T=T_\varphi\), denn</p>\[\|T_n-T_\varphi\|_{\mathcal{L}}=\|\varphi_n-\varphi\|_C=\max_{x\in[0,1]}\sum_{k=n+1}^{\infty}\frac{x^k}{k!}=\sum_{k=n+1}^{\infty}\frac{1}{k!}\ \longrightarrow\ 0.\]<p><b>Schritt C: Kontrolle.</b> Die Norm des Grenzoperators ist \(\|T\|_{\mathcal{L}}=\|\varphi\|_C=\max_{x\in[0,1]}e^x=e\approx 2{,}718\), und die Näherungen erfüllen \(\|T_n\|_{\mathcal{L}}=\sum_{k=0}^{n}\tfrac{1}{k!}\), z.B. \(\|T_3\|_{\mathcal{L}}=1+1+\tfrac12+\tfrac16=\tfrac83\approx 2{,}667\). Wie es die Normstetigkeit verlangt, gilt \(\|T_n\|_{\mathcal{L}}\to\|T\|_{\mathcal{L}}\).</p><p><b>Zusatz: der Dualraum.</b> Da \(\mathbb{K}\) vollständig ist, ist \(\mathcal{L}(E,\mathbb{K})\) — der Raum aller stetigen linearen Funktionale auf \(E\), etwa mit den Elementen \(\delta_y\) und \(T_\psi\) aus <a href="#/7.2.4">7.2.4</a> — für <i>jeden</i> normierten Raum \(E\) vollständig, ganz gleich, ob \(E\) selbst vollständig ist.</p>`,
        plus: String.raw`<p><b>Klausurfalle.</b> Vorausgesetzt wird nur die Vollständigkeit von \(F\), nicht die von \(E\). Wer beides fordert, hat den Satz zu schwach zitiert; wer \(E\) statt \(F\) fordert, hat ihn falsch zitiert.</p><p><b>Notation.</b> Die Vorlesung schreibt \(T_n\in CF\big(\mathcal{L}(E,F)\big)\) statt „\((T_n)\) ist eine Cauchyfolge in \(\mathcal{L}(E,F)\)“; \(CF(X)\) ist die Menge der Cauchyfolgen in \(X\). Ein vollständiger normierter Raum heißt <b>Banachraum</b>; Beispiele aus der Vorlesung sind \(\mathbb{R}\), \(\mathbb{C}\), \(\mathbb{R}^d\), \(\mathbb{C}^d\), \(C([a,b],\mathbb{K}^d)\) bezüglich \(\|\cdot\|_C\) und \(C^1([a,b],\mathbb{K}^d)\) bezüglich \(\|\cdot\|_{C^1}\).</p><p><b>Zwei Konvergenzbegriffe auseinanderhalten.</b> \(T_n\to T\) in \(\|\cdot\|_{\mathcal{L}}\) bedeutet \(\sup_{\|x\|_E=1}\|T_nx-Tx\|_F\to 0\), also gleichmäßige Konvergenz auf der Einheitssphäre (gleichbedeutend: auf der abgeschlossenen Einheitskugel). Die schwächere Forderung „\(T_nx\to Tx\) für jedes einzelne \(x\)“ heißt punktweise (starke) Konvergenz und ist etwas anderes — dieselbe Unterscheidung wie zwischen punktweiser und gleichmäßiger Konvergenz von Funktionenfolgen, vgl. <a href="#/ref/grenzwerte">Grenzwerte</a> und Kapitel 6.</p><p><b>Wozu das gebraucht wird.</b> Erst weil \(\mathcal{L}(E,F)\) vollständig ist, darf man mit Reihen von Operatoren arbeiten (geometrische Reihe \(\sum_{n\ge 0}T^n\) für \(\|T\|_{\mathcal{L}}<1\), siehe <a href="#/7.2.6">7.2.6</a>) und Fixpunktargumente in Operatorräumen führen. Damit ist der technische Unterbau für §7.3 fertig: die Fréchet-Ableitung \(f'(x_0)\) lebt in \(\mathcal{L}(E,F)\), einem Raum, in dem man messen, addieren, komponieren und Grenzwerte bilden kann. Vergleiche <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}}]},
    {id:"7.3", t:"Die Fréchet-Ableitung", topics:[
       {id:"7.3.1", title:"Definition und Eindeutigkeit der Fréchet-Ableitung", body:{
        def: String.raw`<p><b>Ausgangssituation.</b> Seien \((E,\|\cdot\|_E)\) und \((F,\|\cdot\|_F)\) normierte Räume über \(\mathbb{K}\) und</p>
\[ \mathcal{U}\subset E\ \text{offen},\qquad x_0\in\mathcal{U}\subset E,\qquad f:\mathcal{U}\subset E\longrightarrow F. \]
<p>Da \(\mathcal{U}\) offen ist, existiert ein \(\delta=\delta_{x_0}>0\) mit</p>
\[ U_\delta(x_0)=\{x\in E:\ \|x-x_0\|_E<\delta\}\subset\mathcal{U}, \]
<p>d.h. \(x_0+h\in\mathcal{U}\) für alle \(h\in E\) mit \(\|h\|_E<\delta\). Der Zuwachs \(h\) darf also in <i>jeder</i> Richtung frei klein gemacht werden.</p>
<p><b>Erinnerung (Stetigkeit in Landau-Notation).</b> \(f\) ist stetig im Punkt \(x_0\) gdw</p>
\[ f(x_0+h)=f(x_0)+o(1),\qquad h\to\mathbf{0}_E, \]
<p>d.h. \(\forall_{\varepsilon>0}\ \exists_{\delta_\varepsilon>0}\ \forall_{h\in E,\ \|h\|_E\le\delta_\varepsilon}:\ \|f(x_0+h)-f(x_0)\|_F<\varepsilon.\) Frage der Vorlesung: <i>Wie können wir in dieser Notation die Ableitung definieren?</i></p>
<p><b>Def (Fréchet-Ableitung).</b> \(f\) ist im Punkt \(x_0\) <b>Fréchet-differenzierbar</b>, falls ein \(T\in\mathcal{L}(E,F)\) existiert, so dass</p>
\[ f(x_0+h)=f(x_0)+\underbrace{T h+o\big(\|h\|_E\big)}_{=\;o(1)}\ ,\qquad h\to\mathbf{0}_E. \]
<p>Man schreibt dann</p>
\[ f'(x_0)=T\in\mathcal{L}(E,F). \]
<p><b>Anmerkung (Eindeutigkeit).</b> Falls ein solches \(T\in\mathcal{L}(E,F)\) existiert, ist es eindeutig bestimmt.</p>
<p><b>Beweis</b> (Gegenannahme: zwei Kandidaten), in drei Schritten:</p>
<ul>
<li>(1) Es seien \(T_1,T_2\in\mathcal{L}(E,F)\) mit \(f(x_0+h)=f(x_0)+T_1h+o(\|h\|_E)\) und \(f(x_0+h)=f(x_0)+T_2h+o(\|h\|_E)\). Subtraktion der beiden Zeilen liefert \((T_1-T_2)h=T_1h-T_2h=o(\|h\|_E)\).</li>
<li>(2) Das heißt \(\forall_{\varepsilon>0}\ \exists_{\delta_\varepsilon>0}\ \forall_{h\in E,\ \|h\|_E\le\delta_\varepsilon}:\ \|T_1h-T_2h\|_F<\varepsilon\,\|h\|_E\), also
\[ \frac{\|(T_1-T_2)h\|_F}{\|h\|_E}\ \le\ \varepsilon\ ,\qquad h\in E,\ h\neq\mathbf{0}_E,\ \|h\|_E<\delta_\varepsilon. \]</li>
<li>(3) Der Quotient ist homogen in \(h\), daher \(\sup\limits_{h\in E,\ h\neq\mathbf{0}_E,\ \|h\|_E<\delta_\varepsilon}=\sup\limits_{h\in E,\ h\neq\mathbf{0}_E}\), und es folgt \(\|T_1-T_2\|_{\mathcal{L}(E,F)}\le\varepsilon\) für <i>jedes</i> \(\varepsilon>0\), also \(T_1=T_2=f'(x_0)\). \(\square\)</li>
</ul>`,
        worte: String.raw`<p>Die Ableitung ist hier keine Zahl mehr, sondern ein <b>linearer und stetiger Operator</b>: \(f'(x_0)\in\mathcal{L}(E,F)\). Differenzierbar heißt, dass sich der Zuwachs \(f(x_0+h)-f(x_0)\) in einen linearen Hauptterm \(Th\) und einen Rest zerlegen lässt, der beim Grenzübergang \(h\to\mathbf{0}_E\) <i>schneller</i> gegen Null geht als \(\|h\|_E\) selbst. Stetigkeit verlangt nur \(o(1)\) — der Fehler geht überhaupt gegen Null; Differenzierbarkeit verlangt \(o(\|h\|_E)\) — der Fehler geht, gemessen an \(\|h\|_E\), gegen Null. Anschaulich: \(x\mapsto f(x_0)+f'(x_0)(x-x_0)\) ist die beste affin-lineare Näherung von \(f\) bei \(x_0\), und sie ist die einzige, die so gut ist.</p>`,
        erfuellt: String.raw`<p>Zu prüfen sind <b>zwei</b> Dinge, und beide gehören zur Definition (die Vorlesung markiert sie an der Tafel mit einem Ausrufezeichen):</p>
<ul>
<li><b>Hauptterm:</b> \(h\mapsto Th\) muss <i>linear</i> und <i>stetig</i> sein, also \(T\in\mathcal{L}(E,F)\); äquivalent \(\|Th\|_F\le \|T\|_{\mathcal{L}(E,F)}\|h\|_E\) mit endlicher Operatornorm.</li>
<li><b>Restterm:</b> der verbleibende Rest \(r(h)=f(x_0+h)-f(x_0)-Th\) muss \(o(\|h\|_E)\) sein, d.h. \(\dfrac{\|r(h)\|_F}{\|h\|_E}\longrightarrow 0\) für \(h\to\mathbf{0}_E\).</li>
</ul>
<p><b>Durchgerechnetes Beispiel.</b> \(E=F=\mathbb{K}\), \(\mathcal{U}=\mathbb{K}\), \(f(x)=x^2\), \(x_0\in\mathbb{K}\) fest:</p>
\[ f(x_0+h)=(x_0+h)^2=\underbrace{x_0^2}_{=\,f(x_0)}+\underbrace{2x_0\,h}_{=\,Th}+\underbrace{h^2}_{=\,r(h)}\ . \]
<ul>
<li>Hauptterm: \(Th=2x_0h\) ist linear, und \(|Th|=2|x_0|\,|h|\), also \(T\in\mathcal{L}(\mathbb{K},\mathbb{K})\) mit \(\|T\|_{\mathcal{L}(\mathbb{K},\mathbb{K})}=2|x_0|<\infty\).</li>
<li>Restterm: \(\dfrac{|r(h)|}{|h|}=\dfrac{|h|^2}{|h|}=|h|\longrightarrow 0\) für \(h\to 0\), also \(h^2=o(|h|)\).</li>
</ul>
<p>Beides ist erfüllt, also ist \(f\) in \(x_0\) Fréchet-differenzierbar mit \(f'(x_0)=T=2x_0\,\cdot\) (Multiplikation mit \(2x_0\)); nach <a href="#/7.3.2">7.3.2</a> ist der zugehörige Skalar \(t_{x_0}=2x_0=\dfrac{df(x_0)}{dx}\).</p>`,
        verletzt: String.raw`<ul>
<li><b>Restglied nur \(o(1)\) statt \(o(\|h\|_E)\).</b> Für jedes stetige \(f\) gilt \(f(x_0+h)=f(x_0)+\mathbf{0}_{\mathcal{L}}h+o(1)\) — das ist bloß Stetigkeit und liefert keine Ableitung. Die Feinheit \(o(\|h\|_E)\) ist der ganze Punkt der Definition.</li>
<li><b>Rest ist \(O(\|h\|_E)\), aber nicht \(o(\|h\|_E)\).</b> \(E=F=\mathbb{R}\), \(f(x)=|x|\), \(x_0=0\): Nach Beispiel ① (<a href="#/7.3.2">7.3.2</a>) müsste \(t_0=\lim\limits_{h\to 0}\dfrac{|h|-0}{h}\) existieren; für \(h>0\) ist der Quotient \(+1\), für \(h<0\) ist er \(-1\). Es gibt also kein \(T\in\mathcal{L}(\mathbb{R},\mathbb{R})\): \(f\) ist in \(x_0=0\) nicht Fréchet-differenzierbar, obwohl \(\big||h|\big|\le 1\cdot|h|\) gilt.</li>
<li><b>Kandidat linear, aber nicht stetig.</b> Ein linearer Term allein genügt nicht — verlangt ist \(T\in\mathcal{L}(E,F)\). In unendlichdimensionalen Räumen ist das eine echte Zusatzforderung, und sie hängt an der Wahl der Normen: der Ableitungsoperator ist als Abbildung \(C^1\to C\) stetig (Beispiel ⑤ in <a href="#/7.3.5">7.3.5</a>), auf \(C\) mit \(\|\cdot\|_C\) jedoch nicht einmal überall erklärt.</li>
<li><b>Zwei verschiedene Kandidaten.</b> Kann nicht passieren: nach der Anmerkung ist \(T\) eindeutig. Wer zwei Zerlegungen findet, hat in einer davon den Restterm falsch abgeschätzt.</li>
</ul>`,
        plus: String.raw`<p><b>Roter Faden.</b> Der unmittelbar vorangehende Abschnitt über \(\mathcal{L}(E,F)\) ist genau die Vorbereitung: \(\mathcal{L}(E,F)\) ist ein Vektorraum über \(\mathbb{K}\), \(\|T\|_{\mathcal{L}(E,F)}=\sup\limits_{x\in E,\ x\neq\mathbf{0}_E}\dfrac{\|Tx\|_F}{\|x\|_E}\) ist eine Norm, es gilt stets \(\|Tx\|_F\le\|T\|_{\mathcal{L}(E,F)}\|x\|_E\), und für Kompositionen \(\|ST\|_{\mathcal{L}(E,G)}\le\|S\|_{\mathcal{L}(F,G)}\|T\|_{\mathcal{L}(E,F)}\). Genau diese drei Aussagen werden im Eindeutigkeitsbeweis, in der Produktregel und in der Kettenregel gebraucht (<a href="#/7.3.6">7.3.6</a>).</p>
<p><b>Klausurfalle.</b> Das \(o\) bezieht sich auf \(\|h\|_E\), also auf die Norm des <i>Urbildraums</i>, gemessen wird der Fehler aber in \(\|\cdot\|_F\). Und: die Abschätzung muss für <b>alle</b> \(h\to\mathbf{0}_E\) gelten, nicht nur längs einzelner Richtungen — daran scheitert die Umkehrung in <a href="#/7.3.4">7.3.4</a>, und das ist der Unterschied zur Richtungsableitung \(Df(x_0)[h]\) in §7.4.</p>
<p><b>Sprechweise.</b> An der Tafel steht „Frechet“ ohne Akzent und „F.-db.“, „Fr.-db.“, „F.-Abl.“; gemeint ist immer dasselbe. Vergleiche die eindimensionale Situation in <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.3.2", title:"Erste Beispiele: 𝕂→𝕂 und affin-lineare Abbildungen", body:{
        def: String.raw`<p><b>Beispiel ①</b> (die Fréchet-Ableitung verallgemeinert die gewöhnliche Ableitung). Sei</p>
\[ E=F=\mathbb{K};\qquad \mathcal{U}\subset\mathbb{K}\ \text{offen},\ x_0\in\mathcal{U},\qquad f:\mathcal{U}\subset\mathbb{K}\longrightarrow\mathbb{K}. \]
<p>Die Definition lautet hier</p>
\[ f(x_0+h)=f(x_0)+\underbrace{T}_{\in\,\mathcal{L}(\mathbb{K},\mathbb{K})}h+o(|h|)\ ,\qquad h\to 0. \]
<p>Jedes \(T\in\mathcal{L}(\mathbb{K},\mathbb{K})\) ist darstellbar durch ein \(t=t_{x_0}\in\mathbb{K}\), nämlich \(Th=t_{x_0}h\). Also</p>
\[ f(x_0+h)=f(x_0)+t_{x_0}h+o(|h|)\ ,\qquad h\to 0, \]
<p>und da man in \(\mathbb{K}\) durch \(h\neq 0\) dividieren darf,</p>
\[ \Longrightarrow\qquad \lim_{h\to 0}\frac{f(x_0+h)-f(x_0)}{h}\;=\;t_{x_0}\;=\;\frac{d f(x_0)}{dx}. \]
<p><b>Anmerkung (affin-lineare Abbildungen).</b> Sei \(f:\mathcal{U}=E\to F\) gegeben durch</p>
\[ f(x)=y_0+A(x-x_0)\ ,\qquad x,x_0\in E,\ y_0\in F,\ A\in\mathcal{L}(E,F). \]
<p>Dann ist \(f'(x_0)=A\), denn mit \(h=x-x_0\) gilt <i>exakt</i></p>
\[ f(x_0+h)=\underbrace{f(x_0)}_{=\,y_0}+\underbrace{A\,h}_{\text{linear, stetig}}+\underbrace{\mathbf{0}_F}_{=\,o(\|h\|_E)}. \]
<p>Der Restterm verschwindet identisch. Insbesondere ist eine stetige lineare Abbildung ihre eigene Ableitung:</p>
\[ A\in\mathcal{L}(E,F)\quad\Longrightarrow\quad A'(x_0)=A\ \ \text{für jedes}\ x_0\in E, \]
<p>und für eine konstante Abbildung \(f\equiv y_0\) ist \(f'(x_0)=\mathbf{0}_{\mathcal{L}}\).</p>`,
        worte: String.raw`<p>Im einfachsten Fall \(E=F=\mathbb{K}\) ist ein stetiger linearer Operator nichts anderes als die Multiplikation mit einer Zahl. Die Fréchet-Definition wird dadurch zum vertrauten Differenzenquotienten, und die Zahl \(t_{x_0}\), die den Operator darstellt, ist genau die Schulableitung \(df(x_0)/dx\). Der neue Begriff bricht also nichts, er verallgemeinert nur.</p><p>Der zweite Fall ist die Probe aufs Exempel in die andere Richtung: Ist \(f\) selbst schon affin-linear, so ist es seine eigene beste affin-lineare Näherung — der Fehler ist nicht nur klein, er ist Null, und die Ableitung ist in jedem Punkt derselbe Operator \(A\). Genau deshalb liest man später die Fréchet-Ableitung eines komplizierten Ausdrucks daran ab, welcher Term in \(h\) linear ist.</p>`,
        beispiel: String.raw`<p><b>(a) Skalarer Fall, ausgerechnet.</b> \(E=F=\mathbb{K}\), \(f(x)=x^3\), \(x_0\in\mathbb{K}\):</p>
\[ f(x_0+h)=(x_0+h)^3=\underbrace{x_0^3}_{=\,f(x_0)}+\underbrace{3x_0^2\,h}_{=\,t_{x_0}h}+\underbrace{3x_0h^2+h^3}_{=\,r(h)} . \]
<p>Restterm: \(\dfrac{|r(h)|}{|h|}\le 3|x_0|\,|h|+|h|^2\longrightarrow 0\) für \(h\to 0\), also \(r(h)=o(|h|)\). Der Hauptterm \(h\mapsto 3x_0^2h\) liegt in \(\mathcal{L}(\mathbb{K},\mathbb{K})\). Damit</p>
\[ f'(x_0)=t_{x_0}\,\cdot\ ,\qquad t_{x_0}=3x_0^2=\lim_{h\to 0}\frac{(x_0+h)^3-x_0^3}{h}=\frac{df(x_0)}{dx}. \]
<p><b>(b) Affin-lineare Abbildung, ausgerechnet.</b> \(E=F=\mathbb{K}^2\),</p>
\[ A=\begin{pmatrix}1&2\\0&3\end{pmatrix}\in\mathcal{L}(\mathbb{K}^2,\mathbb{K}^2),\qquad y_0=\begin{pmatrix}2\\1\end{pmatrix},\qquad x_0=\begin{pmatrix}1\\-1\end{pmatrix}, \]
\[ f(x)=y_0+A(x-x_0). \]
<p>Einsetzen von \(x=x_0+h\), \(h=(h_1,h_2)^{T}\):</p>
\[ f(x_0+h)=y_0+A\big((x_0+h)-x_0\big)=y_0+Ah=f(x_0)+\begin{pmatrix}h_1+2h_2\\3h_2\end{pmatrix}+\mathbf{0}_2 . \]
<p>Der Term in \(h\) ist linear und stetig, der Rest ist identisch \(\mathbf{0}_2=o(\|h\|)\). Also</p>
\[ f'(x)=A=\begin{pmatrix}1&2\\0&3\end{pmatrix}\qquad\text{für jedes }x\in\mathbb{K}^2, \]
<p>unabhängig vom Punkt — was man in <a href="#/7.3.4">7.3.4</a> auch als Jacobi-Matrix \(\mathcal{J}_{x_0}(f)=A\) wiederfindet.</p>
<p><b>(c) Sofortige Folgerungen.</b> \(f\equiv y_0\) konstant \(\Rightarrow f'(x_0)=\mathbf{0}_{\mathcal{L}}\); \(f=\mathbf{1}\) (Identität auf \(E\)) \(\Rightarrow f'(x_0)=\mathbf{1}\).</p>`,
        plus: String.raw`<p><b>Gut zu wissen.</b> Die Anmerkung über affin-lineare Abbildungen ist der meistbenutzte Satz des ganzen Abschnitts: Sie erklärt in einem Schritt die Beispiele ⑤ und ⑦ aus <a href="#/7.3.5">7.3.5</a> — der Ableitungsoperator \(D:C^1\to C\) ist linear und stetig, also \(D'(y_0)=D\); das Integralfunktional \(I:C\to\mathbb{R}\) ebenso, also \(I'(y_0)=I\). Für lineare Abbildungen ist die Ableitung punktunabhängig.</p>
<p><b>Klausurfalle.</b> Auch für \(E=F=\mathbb{K}\) ist \(f'(x_0)\) begrifflich ein <i>Operator</i>; \(t_{x_0}\) ist nur die Zahl, die ihn darstellt. Wer das trennt, verwechselt später nicht Gradient (Spalte), Ableitung (Zeile) und Jacobi-Matrix.</p>
<p><b>Ausblick.</b> Die Kettenregel in <a href="#/7.3.6">7.3.6</a> ist genau das Hintereinanderschalten zweier solcher affin-linearer Näherungen: \(f(x)=y_0+A(x-x_0)\), \(g(y)=z_0+B(y-y_0)\) liefert \((g\circ f)(x)=z_0+BA(x-x_0)\).</p>`}},
       {id:"7.3.3", title:"f: 𝕂^m → 𝕂 — partielle Ableitungen und Gradient", body:{
        def: String.raw`<p><b>Beispiel ②.</b> Sei</p>
\[ \mathcal{U}\subset E=\mathbb{K}^m\ \text{offen},\quad F=\mathbb{K},\quad x_0\in\mathcal{U},\qquad f:\mathcal{U}\subset\mathbb{K}^m\longrightarrow\mathbb{K}, \]
\[ x_0=\begin{pmatrix}x_1^{(0)}\\ \vdots\\ x_m^{(0)}\end{pmatrix},\qquad h=\begin{pmatrix}h_1\\ \vdots\\ h_m\end{pmatrix},\qquad f(x)=f(x_1,\dots,x_m). \]
<p>Fréchet-Differenzierbarkeit in \(x_0\) heißt</p>
\[ f(x_0+h)=f(x_0)+T_{x_0}h+o\big(\|h\|_{\mathbb{K}^m}\big)\ ,\qquad h\to\mathbf{0}_m,\qquad T_{x_0}\in\mathcal{L}(\mathbb{K}^m,\mathbb{K}). \]
<p>Ein solches \(T_{x_0}\) ist durch eine <b>Zeile</b> aus \(M^{1,m}\) darstellbar:</p>
\[ T_{x_0}h=\underbrace{\big(t_1(x_0),\dots,t_m(x_0)\big)}_{M^{1,m}}\begin{pmatrix}h_1\\ \vdots\\ h_m\end{pmatrix}. \]
<p><b>Bestimmung der Koeffizienten.</b> Man testet mit den Koordinatenrichtungen: sei \(h=\Theta\cdot e_j\) mit \(\Theta\in\mathbb{K}\) und \(e_j=(0,\dots,0,1,0,\dots,0)^{T}\) (die \(1\) an der \(j\)-ten Stelle). Dann</p>
\[ f(x_0+\Theta e_j)=f(x_0)+t_j(x_0)\,\Theta+o(|\Theta|)\ ,\qquad \Theta\to 0, \]
<p>und Division durch \(\Theta\) in \(\mathbb{K}\) liefert</p>
\[ t_j(x_0)=\lim_{\Theta\to 0}\frac{f(x_0+\Theta e_j)-f(x_0)}{\Theta}\;=:\;\left.\frac{\partial f}{\partial x_j}\right|_{x=x_0},\qquad j=1,\dots,m. \]
<p><b>Def (Gradient).</b></p>
\[ \left.\operatorname{grad} f\right|_{x=x_0}=\left.\nabla f\right|_{x=x_0}=\begin{pmatrix}\left.\dfrac{\partial f}{\partial x_1}\right|_{x=x_0}\\ \vdots\\ \left.\dfrac{\partial f}{\partial x_m}\right|_{x=x_0}\end{pmatrix}\in\mathbb{K}^m\quad(\text{Spalte}), \]
\[ T_{x_0}h=\underbrace{\left.\left(\frac{\partial f}{\partial x_1},\dots,\frac{\partial f}{\partial x_m}\right)\right|_{x=x_0}}_{=\;\left(\left.\operatorname{grad} f\right|_{x=x_0}\right)^{T}\;=\;\left(\left.\nabla f\right|_{x=x_0}\right)^{T}}\begin{pmatrix}h_1\\ \vdots\\ h_m\end{pmatrix}. \]
<p><b>Also (Satz).</b> Ist \(f\) in \(x_0\) Fréchet-differenzierbar, dann existieren alle partiellen Ableitungen \(\left.\frac{\partial f}{\partial x_1}\right|_{x=x_0},\dots,\left.\frac{\partial f}{\partial x_m}\right|_{x=x_0}\) und</p>
\[ f'(x_0)=T_{x_0}=\left(\left.\frac{\partial f}{\partial x_1}\right|_{x=x_0},\dots,\left.\frac{\partial f}{\partial x_m}\right|_{x=x_0}\right). \]`,
        worte: String.raw`<p>Für skalarwertige Funktionen mehrerer Veränderlicher ist die Fréchet-Ableitung eine <b>Zeile</b> von Zahlen, und diese Zahlen sind genau die partiellen Ableitungen. Man erhält sie, indem man in der Definition den beliebigen Zuwachs \(h\) durch einen Zuwachs \(\Theta e_j\) längs einer einzigen Koordinatenachse ersetzt: dann steht dort ein gewöhnlicher Differenzenquotient in einer Variablen, und die übrigen Koordinaten werden festgehalten.</p><p>Der Gradient ist derselbe Datensatz, nur als <b>Spalte</b> geschrieben; die Ableitungsmatrix ist seine Transponierte. Wichtig ist die Richtung der Aussage: Fréchet-Differenzierbarkeit <i>liefert</i> die partiellen Ableitungen — sie folgt nicht automatisch aus ihnen.</p>`,
        beispiel: String.raw`<p><b>Beispiel ④.</b> \(\mathcal{U}=E=\mathbb{R}^2\), \(F=\mathbb{R}\),</p>
\[ f(x)=f(x_1,x_2)=x_1^2+3x_2^2+x_1+2 . \]
<p><i>Schritt 1 (Kandidat über die partiellen Ableitungen).</i> Fréchet-Ableitung in \(x_0=(x_1^{(0)},x_2^{(0)})^{T}\):</p>
\[ \mathcal{J}_{x_0}(f)=\left(\left.\frac{\partial f}{\partial x_1}\right|_{x=x_0},\ \left.\frac{\partial f}{\partial x_2}\right|_{x=x_0}\right)=\big(2x_1^{(0)}+1,\ 6x_2^{(0)}\big). \]
<p><i>Schritt 2 (Nachrechnen der Definition).</i> Mit \(h=(h_1,h_2)^{T}\):</p>
\[ f(x_0+h)=\big(x_1^{(0)}+h_1\big)^2+3\big(x_2^{(0)}+h_2\big)^2+\big(x_1^{(0)}+h_1\big)+2 \]
\[ =\underbrace{\big(x_1^{(0)}\big)^2+3\big(x_2^{(0)}\big)^2+x_1^{(0)}+2}_{=\,f(x_0)}\;+\;\underbrace{2x_1^{(0)}h_1+6x_2^{(0)}h_2+h_1}_{=\,\big(2x_1^{(0)}+1,\ 6x_2^{(0)}\big)\left(\begin{smallmatrix}h_1\\ h_2\end{smallmatrix}\right)}\;+\;\underbrace{h_1^2+3h_2^2}_{\le\,3\|h\|^2} . \]
<p><i>Schritt 3 (die beiden Forderungen).</i> Der mittlere Term ist \(\mathcal{J}_{x_0}(f)\,h\), also linear und stetig, denn \(|\mathcal{J}_{x_0}(f)h|\le\big(|2x_1^{(0)}+1|+|6x_2^{(0)}|\big)\|h\|\). Der letzte Term erfüllt</p>
\[ \frac{|h_1^2+3h_2^2|}{\|h\|}\ \le\ \frac{3\|h\|^2}{\|h\|}=3\|h\|\longrightarrow 0,\qquad h\to\mathbf{0}_2=\begin{pmatrix}0\\0\end{pmatrix}, \]
<p>also ist er \(o(\|h\|)\). Damit ist \(f\) in \(x_0\) Fréchet-differenzierbar mit</p>
\[ f'(x_0)=\big(2x_1^{(0)}+1,\ 6x_2^{(0)}\big),\qquad \left.\operatorname{grad} f\right|_{x=x_0}=\begin{pmatrix}2x_1^{(0)}+1\\ 6x_2^{(0)}\end{pmatrix}. \]
<p><i>Probe an einer Stelle.</i> In \(x_0=(1,-1)^{T}\): \(f'(x_0)=(3,-6)\), also \(f(x_0+h)\approx f(x_0)+3h_1-6h_2=7+3h_1-6h_2\).</p>`,
        plus: String.raw`<p><b>Klausurfalle (Zeile oder Spalte?).</b> \(f'(x_0)\) ist eine <i>Zeile</i> aus \(M^{1,m}\), damit \(f'(x_0)h\) überhaupt gebildet werden kann; \(\operatorname{grad} f\big|_{x=x_0}=\nabla f\big|_{x=x_0}\) ist die zugehörige <i>Spalte</i>. Es gilt \(f'(x_0)=\big(\left.\operatorname{grad} f\right|_{x=x_0}\big)^{T}\), gleichbedeutend mit \(f'(x_0)h=\big\langle \left.\operatorname{grad} f\right|_{x=x_0},h\big\rangle\) im reellen Fall.</p>
<p><b>Warum nur diese \(m\) Zahlen?</b> Weil die Definition mit <i>jedem</i> \(h\) arbeitet, insbesondere mit \(h=\Theta e_j\). Umgekehrt testen die partiellen Ableitungen nur \(m\) ausgezeichnete Richtungen — deshalb gilt die Umkehrung nicht (siehe <a href="#/7.3.4">7.3.4</a>).</p>
<p><b>Ausblick §7.4.</b> Dieselbe Rechnung mit beliebiger fester Richtung \(h\) statt \(e_j\) führt auf die Richtungsableitung \(Df(x_0)[h]=\lim\limits_{t\to 0}\frac{f(x_0+th)-f(x_0)}{t}\); speziell \(Df(x_0)[e_j]=\left.\frac{\partial f}{\partial x_j}\right|_{x=x_0}\).</p>`}},
       {id:"7.3.4", title:"f: 𝕂^m → 𝕂^n — die Jacobi-Matrix", body:{
        def: String.raw`<p><b>Beispiel ③.</b> Sei</p>
\[ \mathcal{U}\subset E=\mathbb{K}^m\ \text{offen},\quad F=\mathbb{K}^n,\quad x_0\in\mathcal{U},\qquad f:\mathcal{U}\subset\mathbb{K}^m\longrightarrow\mathbb{K}^n, \]
\[ f(x)=\begin{pmatrix}f_1(x_1,\dots,x_m)\\ \vdots\\ f_n(x_1,\dots,x_m)\end{pmatrix},\qquad x_0,h\in\mathbb{K}^m\ \text{wie in }7.3.3 . \]
<p>Fréchet-Differenzierbarkeit in \(x_0\):</p>
\[ f(x_0+h)=f(x_0)+T_{x_0}h+o\big(\|h\|_{\mathbb{K}^m}\big),\qquad T_{x_0}\in\mathcal{L}(\mathbb{K}^m,\mathbb{K}^n), \]
<p>und \(T_{x_0}\) lässt sich durch eine Matrix aus \(M^{n,m}\) darstellen:</p>
\[ T_{x_0}h=\begin{pmatrix}t_{11}(x_0)&\dots&t_{1m}(x_0)\\ \vdots& &\vdots\\ t_{n1}(x_0)&\dots&t_{nm}(x_0)\end{pmatrix}\begin{pmatrix}h_1\\ \vdots\\ h_m\end{pmatrix}. \]
<p><b>Bestimmung der Einträge</b> (wie in Beispiel ②, komponentenweise):</p>
<ul>
<li>(1) Setze \(h=\Theta e_\ell\) und betrachte nur die \(k\)-te Komponente der Gleichung: \(f_k(x_0+\Theta e_\ell)=f_k(x_0)+t_{k\ell}(x_0)\Theta+o(|\Theta|)\).</li>
<li>(2) Division durch \(\Theta\) und \(\Theta\to 0\) liefert \(t_{k\ell}(x_0)=\left.\dfrac{\partial f_k}{\partial x_\ell}\right|_{x=x_0}\).</li>
</ul>
<p><b>Def (Jacobi-Matrix).</b></p>
\[ T_{x_0}=f'(x_0)=\mathcal{J}_{x_0}(f)=\begin{pmatrix}\left.\dfrac{\partial f_1}{\partial x_1}\right|_{x=x_0}&\dots&\left.\dfrac{\partial f_1}{\partial x_m}\right|_{x=x_0}\\[1ex] \vdots& &\vdots\\[1ex] \left.\dfrac{\partial f_n}{\partial x_1}\right|_{x=x_0}&\dots&\left.\dfrac{\partial f_n}{\partial x_m}\right|_{x=x_0}\end{pmatrix}\in M^{n,m}. \]
<p>Manchmal schreibt man auch</p>
\[ \mathcal{J}_{x_0}(f)=\left.\frac{D(f_1,\dots,f_n)}{D(x_1,\dots,x_m)}\right|_{x=x_0}. \]
<p><b>Also (Satz).</b> Ist \(f\) in \(x_0\) Fréchet-differenzierbar, dann existieren alle partiellen Ableitungen</p>
\[ \left.\frac{\partial f_k}{\partial x_\ell}\right|_{x=x_0},\qquad k=1,\dots,n,\quad \ell=1,\dots,m, \]
<p>und es gilt \(f'(x_0)=\mathcal{J}_{x_0}(f)\). <b>Die Umkehrung gilt nicht!</b></p>`,
        worte: String.raw`<p>Bei vektorwertigen Funktionen wird aus der Ableitungszeile eine <b>Matrix</b>: In der \(k\)-ten Zeile steht die Ableitung der \(k\)-ten Komponente \(f_k\), in der \(\ell\)-ten Spalte wird nach der \(\ell\)-ten Variablen \(x_\ell\) abgeleitet. Sie heißt Jacobi-Matrix \(\mathcal{J}_{x_0}(f)\) und hat das Format \(n\times m\), passend zu \(T_{x_0}:\mathbb{K}^m\to\mathbb{K}^n\).</p><p>Die Aussage läuft nur in eine Richtung: Aus Fréchet-Differenzierbarkeit folgt die Existenz aller \(n\cdot m\) partiellen Ableitungen, und die Ableitung ist dann genau diese Matrix. Aus der bloßen Existenz der partiellen Ableitungen folgt umgekehrt <i>nicht</i>, dass \(f\) Fréchet-differenzierbar ist.</p>`,
        erfuellt: String.raw`<p><b>Wann greift der Satz?</b> Wenn man die Zerlegung \(f(x_0+h)=f(x_0)+\mathcal{J}_{x_0}(f)\,h+r(h)\) hinschreibt und für den Rest \(\|r(h)\|/\|h\|\to 0\) bei \(h\to\mathbf{0}_m\) nachweist. Dann — und erst dann — ist \(f'(x_0)=\mathcal{J}_{x_0}(f)\).</p>
<p><b>Durchgerechnetes Beispiel.</b> \(\mathcal{U}=E=\mathbb{R}^2\), \(F=\mathbb{R}^2\),</p>
\[ f(x)=\begin{pmatrix}f_1(x_1,x_2)\\ f_2(x_1,x_2)\end{pmatrix}=\begin{pmatrix}x_1^2+3x_2^2+x_1+2\\ x_1x_2\end{pmatrix} \]
<p>(die erste Komponente ist Beispiel ④ aus <a href="#/7.3.3">7.3.3</a>). Partielle Ableitungen:</p>
\[ \mathcal{J}_{x_0}(f)=\begin{pmatrix}2x_1^{(0)}+1&6x_2^{(0)}\\ x_2^{(0)}&x_1^{(0)}\end{pmatrix}\in M^{2,2}. \]
<p>Nachrechnen mit \(h=(h_1,h_2)^{T}\), komponentenweise:</p>
\[ f_1(x_0+h)=f_1(x_0)+\big(2x_1^{(0)}+1\big)h_1+6x_2^{(0)}h_2+\underbrace{h_1^2+3h_2^2}_{\le\,3\|h\|^2}, \]
\[ f_2(x_0+h)=\big(x_1^{(0)}+h_1\big)\big(x_2^{(0)}+h_2\big)=f_2(x_0)+x_2^{(0)}h_1+x_1^{(0)}h_2+\underbrace{h_1h_2}_{\le\,\|h\|^2}, \]
<p>zusammen also</p>
\[ f(x_0+h)=f(x_0)+\mathcal{J}_{x_0}(f)\,h+r(h),\qquad r(h)=\begin{pmatrix}h_1^2+3h_2^2\\ h_1h_2\end{pmatrix},\qquad \frac{\|r(h)\|}{\|h\|}\le 4\|h\|\longrightarrow 0 , \]
<p>denn \(\|r(h)\|\le\big|h_1^2+3h_2^2\big|+\big|h_1h_2\big|\le 3\|h\|^2+\|h\|^2=4\|h\|^2\).</p>
<p>Also \(f'(x_0)=\mathcal{J}_{x_0}(f)\); in \(x_0=(1,-1)^{T}\) etwa \(f'(x_0)=\begin{pmatrix}3&-6\\ -1&1\end{pmatrix}\).</p>
<p><b>Sonderfälle, in denen es immer klappt.</b> Für \(f(x)=y_0+A(x-x_0)\) mit \(A\in M^{n,m}\) ist der Rest identisch \(\mathbf{0}_n\), also \(\mathcal{J}_{x_0}(f)=A\) (<a href="#/7.3.2">7.3.2</a>). Für \(n=1\) reduziert sich \(\mathcal{J}_{x_0}(f)\) auf die Zeile \(\big(\left.\operatorname{grad} f\right|_{x=x_0}\big)^{T}\) aus <a href="#/7.3.3">7.3.3</a>.</p>`,
        verletzt: String.raw`<ul>
<li><b>Die Umkehrung gilt nicht.</b> Aus der Existenz aller \(\left.\frac{\partial f_k}{\partial x_\ell}\right|_{x=x_0}\) folgt <i>nicht</i>, dass \(f\) in \(x_0\) Fréchet-differenzierbar ist. Die partiellen Ableitungen entstehen aus den Testrichtungen \(h=\Theta e_\ell\) und sehen nur die \(m\) Koordinatenachsen; die Definition verlangt die Abschätzung \(\|r(h)\|=o(\|h\|)\) aber für <b>alle</b> \(h\to\mathbf{0}_m\) gleichzeitig.</li>
<li><b>Konsequenz für die Praxis.</b> Man kann die Matrix der partiellen Ableitungen immer formal hinschreiben — sie ist nur dann die Ableitung, wenn der Restterm die \(o(\|h\|)\)-Probe besteht. Diese Probe ist der eigentliche Beweisschritt (siehe die Rechnung unter „erfüllt“).</li>
<li><b>Notwendige Bedingung, die vorher scheitern kann.</b> Wegen \(T_{x_0}h+o(\|h\|)=o(1)\) ist jede in \(x_0\) Fréchet-differenzierbare Funktion dort stetig. Ist \(f\) in \(x_0\) unstetig, so ist \(f\) dort nicht Fréchet-differenzierbar — auch wenn alle partiellen Ableitungen existieren.</li>
<li><b>Falsches Format.</b> \(\mathcal{J}_{x_0}(f)\in M^{n,m}\): Zeilenzahl \(=\) Zahl der Komponenten von \(f\), Spaltenzahl \(=\) Zahl der Variablen. Wer die Matrix transponiert hinschreibt, kann für \(n\neq m\) das Produkt \(\mathcal{J}_{x_0}(f)\,h\) schon aus Formatgründen nicht mehr bilden; für \(n=m\) ist das Produkt zwar bildbar, stellt aber einen anderen Operator dar — der Fehler bleibt dann unbemerkt und liefert ein falsches Ergebnis.</li>
</ul>`,
        plus: String.raw`<p><b>Merkschema.</b> \(\mathcal{J}_{x_0}(f)\) hat so viele Zeilen wie \(f\) Komponenten und so viele Spalten wie es Variablen gibt: \(M^{n,m}\) für \(f:\mathbb{K}^m\to\mathbb{K}^n\). Die alternative Schreibweise \(\frac{D(f_1,\dots,f_n)}{D(x_1,\dots,x_m)}\big|_{x=x_0}\) der Vorlesung meint dieselbe <i>Matrix</i>. Im quadratischen Fall \(n=m\) heißt ihre Determinante \(\det\mathcal{J}_{x_0}(f)\) Funktionaldeterminante; für sie wird später (bei Koordinatenwechseln \(y=f(x)\)) ebenfalls das Symbol \(\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\) benutzt — man muss also aus dem Zusammenhang lesen, ob Matrix oder Determinante gemeint ist.</p>
<p><b>Wozu?</b> Die Kettenregel wird damit zum Matrizenprodukt \(\mathcal{J}_{x_0}(g\circ f)=\mathcal{J}_{y_0}(g)\,\mathcal{J}_{x_0}(f)\) (<a href="#/7.3.6">7.3.6</a>) — die Formate \(M^{p,m}=M^{p,n}\cdot M^{n,m}\) passen genau dann, wenn man Zeilen und Spalten nicht vertauscht.</p>
<p><b>Wo die Lücke geschlossen wird.</b> Dass die Umkehrung scheitert, ist der Grund, warum §7.4 zunächst den schwächeren Begriff der Richtungs- bzw. Gâteaux-Ableitung \(Df(x_0)[h]\) einführt und danach untersucht, unter welchen Zusatzvoraussetzungen aus ihm doch die Fréchet-Ableitung wird.</p>`}},
       {id:"7.3.5", title:"Beispiele in Funktionenräumen", body:{
        def: String.raw`<p>Grundräume (vgl. <a href="#/6.2.1">6.2.1</a>): \(C=C([a,b],\mathbb{R})\) und \(C^1=C^1([a,b],\mathbb{R})\), \(a< b\), mit</p>
\[ \|y\|_{C}=\max_{x\in[a,b]}|y(x)|,\qquad \|y\|_{C^1}=\|y\|_{C}+\|y'\|_{C}. \]
<p>Der „Punkt“, in dem abgeleitet wird, ist jetzt selbst eine Funktion \(y_0=y_0(x)\); der Zuwachs \(h=h(x)\) ist ebenfalls eine Funktion.</p>
<p><b>Beispiel ⑤ (Ableitungsoperator).</b> \(\mathcal{U}=E=C^1\), \(F=C\),</p>
\[ D:\ C^1\longrightarrow C\ ;\qquad D:\ y(x)\longmapsto y'(x). \]
<p>\(D\) ist linear und wegen \(\|Dy\|_{C}=\|y'\|_{C}\le\|y\|_{C}+\|y'\|_{C}=\|y\|_{C^1}\) stetig, also \(D\in\mathcal{L}(C^1,C)\). Nach der Anmerkung über lineare Abbildungen (<a href="#/7.3.2">7.3.2</a>):</p>
\[ D'(y_0)=D\qquad\text{für jedes }y_0\in C^1. \]
<p><b>Beispiel ⑥ (nichtlinearer Operator).</b> \(\mathcal{U}=E=C^1\), \(F=C\),</p>
\[ K:\ C^1\longrightarrow C\ ;\qquad K:\ y(x)\longmapsto \big(y(x)\big)^2+3y(x)+2\big(y'(x)\big)^2+y(x)\cdot y'(x). \]
<p>Die Fréchet-Ableitung von \(K\) im „Punkt“ \(y_0=y_0(x)\) ist der <b>Differentialoperator</b></p>
\[ K'(y_0)=T_{y_0}=\big(2y_0+3+y_0'\big)\cdot\;+\;\big(4y_0'+y_0\big)\frac{d}{dx}\ \in\ \mathcal{L}(C^1,C). \]
<p><b>Beispiel ⑦ (lineares Integralfunktional).</b> \(\mathcal{U}=E=C\), \(F=\mathbb{R}\),</p>
\[ I:\ C\longrightarrow\mathbb{R}\ ;\qquad I:\ y(x)\longmapsto\int_a^b y(x)\,dx\quad\text{(linear)}, \]
\[ \left|\int_a^b y(x)\,dx\right|\le\int_a^b|y(x)|\,dx\le \max_{x\in[a,b]}|y(x)|\cdot(b-a)=(b-a)\,\|y\|_{C} \ \Longrightarrow\ I\in\mathcal{L}(C,\mathbb{R}), \]
<p>somit \(I'(y_0)=I\).</p>
<p><b>Beispiel ⑧ (quadratisches Funktional).</b> \(\mathcal{U}=E=C^1\), \(F=\mathbb{R}\), \(V\in C([a,b],\mathbb{R})\),</p>
\[ I(y)=\int_a^b\Big(\big(y'(x)\big)^2-V(x)\big(y(x)\big)^2\Big)dx . \]
<p>Für \(y_0,h\in C^1\) ist \(I'(y_0)\in\mathcal{L}(C^1,\mathbb{R})\) gegeben durch</p>
\[ I'(y_0)[h]=2\int_a^b y_0'(x)\,h'(x)\,dx-2\int_a^b V(x)\,y_0(x)\,h(x)\,dx . \]`,
        worte: String.raw`<p>Der Ableitungsbegriff funktioniert wörtlich genauso, wenn der „Punkt“ eine Funktion ist. Lineare und stetige Operatoren sind wieder ihre eigene Ableitung (Beispiele ⑤ und ⑦). Bei nichtlinearen Ausdrücken (Beispiele ⑥ und ⑧) setzt man \(y_0+h\) ein, multipliziert aus und sortiert nach Potenzen von \(h\): der konstante Anteil ist der Funktionswert, der in \(h\) lineare Anteil ist der Kandidat für die Ableitung, alles Quadratische ist Restterm.</p><p>Dann sind genau zwei Dinge zu prüfen — an der Tafel jeweils mit einem Ausrufezeichen markiert: der Hauptterm muss in \(\mathcal{L}(C^1,C)\) bzw. \(\mathcal{L}(C^1,\mathbb{R})\) liegen (linear <i>und</i> stetig bezüglich der richtigen Normen), und der Restterm muss \(o(\|h\|_{C^1})\) sein. Bemerkenswert: die Ableitung eines nichtlinearen Operators auf \(C^1\) ist selbst wieder ein Differentialoperator.</p>`,
        beispiel: String.raw`<p><b>Beispiel ⑥ vollständig gerechnet.</b> Mit \(y_0,h\in C^1\):</p>
\[ K(y_0+h)=(y_0+h)^2+3(y_0+h)+2\big(y_0'+h'\big)^2+(y_0+h)\big(y_0'+h'\big) \]
\[ =\underbrace{y_0^2+3y_0+2\big(y_0'\big)^2+y_0\,y_0'}_{=\,K y_0}\;+\;\underbrace{2y_0h+3h+4y_0'h'+y_0h'+y_0'h}_{\text{linear in }h}\;+\;\underbrace{h^2+2\big(h'\big)^2+h\cdot h'}_{\text{Restterm}} . \]
<p><i>Hauptterm sortieren</i> (nach \(h\) und \(h'\)):</p>
\[ \big(2y_0+3+y_0'\big)h+\big(4y_0'+y_0\big)\frac{d}{dx}h\;=\;T_{y_0}h . \]
<p><i>Prüfung 1: \(T_{y_0}\in\mathcal{L}(C^1,C)\).</i> Der Multiplikationsoperator \(A:y(x)\mapsto a(x)y(x)\) mit \(a\in C\) ist linear und stetig, denn</p>
\[ \|ay\|_{C}=\max_{x\in[a,b]}|a(x)y(x)|\le \max_{x\in[a,b]}|a(x)|\cdot\max_{x\in[a,b]}|y(x)|\le M\,\|y\|_{C}\le M\,\|y\|_{C^1}, \]
<p>also sowohl \(C\to C\) als auch \(C^1\to C\) stetig. Mit \(\frac{d}{dx}=D\in\mathcal{L}(C^1,C)\) (Beispiel ⑤) und \(2y_0+3+y_0'\in C\), \(4y_0'+y_0\in C\) folgt</p>
\[ T_{y_0}=\underbrace{\big(2y_0+3+y_0'\big)\cdot}_{\mathcal{L}(C^1,C)}+\underbrace{\underbrace{\big(4y_0'+y_0\big)\cdot}_{\mathcal{L}(C,C)}\underbrace{\tfrac{d}{dx}}_{\mathcal{L}(C^1,C)}}_{\mathcal{L}(C^1,C)}\ \in\ \mathcal{L}(C^1,C). \]
<p><i>Prüfung 2: Restterm \(=o(\|h\|_{C^1})\).</i></p>
\[ \big\|h^2\big\|_{C}=\max_{x\in[a,b]}|h(x)|^2=\|h\|_{C}^{2}\le\|h\|_{C^1}^{2},\qquad \big\|2(h')^2\big\|_{C}=2\|h'\|_{C}^{2}\le 2\|h\|_{C^1}^{2}, \]
<p>und \(h\cdot h'\) wird analog abgeschätzt (an der Tafel als Hausaufgabe gestellt). Alle Terme sind \(\le\ \text{const}\cdot\|h\|_{C^1}^{2}\), also \(o(\|h\|_{C^1})\). Damit ist \(K\) in \(y_0\) Fréchet-differenzierbar mit \(K'(y_0)=T_{y_0}\).</p>
<p><b>Beispiel ⑧ vollständig gerechnet.</b> Mit \(y_0,h\in C^1\):</p>
\[ I(y_0+h)=\int_a^b\Big(\big(y_0'+h'\big)^2-V\big(y_0+h\big)^2\Big)dx \]
\[ =\underbrace{\int_a^b\Big(\big(y_0'\big)^2-V y_0^2\Big)dx}_{=\,I(y_0)}+\underbrace{\int_a^b\Big(2y_0'h'-2Vy_0h\Big)dx}_{\text{linear in }h}+\underbrace{\int_a^b\Big(\big(h'\big)^2-Vh^2\Big)dx}_{\text{Restterm}} . \]
<p><i>Hauptterm stetig:</i></p>
\[ \left|2\int_a^b y_0'h'\,dx\right|\le 2\int_a^b|y_0'||h'|\,dx\le 2(b-a)\,\|y_0'\|_{C}\,\|h'\|_{C}\le M\,\|h\|_{C^1}, \]
<p>der zweite Summand analog (Hausaufgabe); also \(I'(y_0)\in\mathcal{L}(C^1,\mathbb{R})\). <i>Restterm:</i></p>
\[ \left|\int_a^b\big(h'(x)\big)^2dx\right|=\int_a^b\big(h'(x)\big)^2dx\le(b-a)\max_{x\in[a,b]}|h'(x)|^2=(b-a)\|h'\|_{C}^{2}\le(b-a)\|h\|_{C^1}^{2}, \]
<p>also \(o(\|h\|_{C^1})\); den Term \(\int_a^b V(x)\big(h(x)\big)^2dx\) in \(o(\|h\|_{C^1})\) abzuschätzen ist an der Tafel als Hausaufgabe gestellt und läuft genauso. Ergebnis:</p>
\[ I'(y_0)[h]=2\int_a^b y_0'h'\,dx-2\int_a^b Vy_0h\,dx . \]`,
        plus: String.raw`<p><b>Arbeitsschema für solche Aufgaben.</b> (1) \(y_0+h\) einsetzen und ausmultiplizieren. (2) Nach Potenzen von \(h\) sortieren: konstant \(=\) Funktionswert, linear \(=\) Kandidat \(T_{y_0}\), quadratisch \(=\) Rest. (3) Ausrufezeichen-Probe: \(T_{y_0}\) linear und stetig in der <i>richtigen</i> Norm, Rest \(o(\|h\|_{C^1})\). Bausteine dafür sind stets: der Multiplikationsoperator (stetig \(C\to C\) und \(C^1\to C\)), \(D=\frac{d}{dx}\in\mathcal{L}(C^1,C)\), das Integral \(I\in\mathcal{L}(C,\mathbb{R})\) mit \(\|I\|\le b-a\).</p>
<p><b>Warum \(C^1\) und nicht \(C\)?</b> Weil im Ausdruck \(y'\) vorkommt. Der Term \(\big(4y_0'+y_0\big)\frac{d}{dx}h\) ist als Abbildung von \(C^1\) nach \(C\) stetig; auf \(C\) mit \(\|\cdot\|_C\) ist \(\frac{d}{dx}\) dagegen nicht einmal überall erklärt, dort gibt es den Operator also gar nicht. Die Wahl der Normen ist Teil der Aufgabe, nicht Dekoration. Vergleiche \(\|f\|_{C^1}=\|f\|_{C}+\|f'\|_{C}\).</p>
<p><b>Beobachtung.</b> Die Ableitung von \(K\) ist selbst ein Differentialoperator, ihre Koeffizienten \(2y_0+3+y_0'\) und \(4y_0'+y_0\) hängen vom Entwicklungspunkt \(y_0\) ab — genau wie \(f'(x_0)=2x_0\) im skalaren Fall vom Punkt abhängt. Bei ⑤ und ⑦ hingegen ist die Ableitung punktunabhängig, weil die Abbildungen bereits linear sind.</p>`}},
       {id:"7.3.6", title:"Rechenregeln: Linearität, Produkt- und Kettenregel", body:{
        def: String.raw`<p><b>Das Rechnen mit F.-Abl.</b> — unter dieser Überschrift stellt die Vorlesung drei Regeln zusammen.</p>
<p><b>① Linearität bezüglich der zu differenzierenden Funktion.</b> Seien \(f,g:\mathcal{U}\subset E\to F\), \(\mathcal{U}\) offen, \(x_0\in\mathcal{U}\), \(\alpha,\beta\in\mathbb{K}\), und \(f,g\) seien in \(x_0\) Fréchet-differenzierbar. Dann ist \((\alpha f+\beta g):\mathcal{U}\subset E\to F\) in \(x_0\) Fréchet-differenzierbar und</p>
\[ (\alpha f+\beta g)'(x_0)=\underbrace{\underbrace{\alpha f'(x_0)}_{\mathcal{L}(E,F)}+\underbrace{\beta g'(x_0)}_{\mathcal{L}(E,F)}}_{\mathcal{L}(E,F)} . \]
<p><b>Beweis.</b></p>
<ul>
<li>(1) \(\alpha f(x_0+h)=\alpha f(x_0)+\alpha f'(x_0)h+o(\|h\|_E)\) und \(\beta g(x_0+h)=\beta g(x_0)+\beta g'(x_0)h+o(\|h\|_E)\).</li>
<li>(2) Addition: \((\alpha f+\beta g)(x_0+h)=(\alpha f+\beta g)(x_0)+\big(\alpha f'(x_0)+\beta g'(x_0)\big)h+o(\|h\|_E)\), \(h\to\mathbf{0}_E\).</li>
<li>(3) Da \(\mathcal{L}(E,F)\) ein Vektorraum ist, gilt \(\alpha f'(x_0)+\beta g'(x_0)\in\mathcal{L}(E,F)\); nach der Eindeutigkeit (<a href="#/7.3.1">7.3.1</a>) ist dies die Fréchet-Ableitung. \(\square\)</li>
</ul>
<p><b>② Produktregel.</b> Seien \(f:\mathcal{U}\subset E\to F\) und \(\alpha:\mathcal{U}\subset E\to\mathbb{K}\), \(\mathcal{U}\) offen, \(x_0\in\mathcal{U}\), beide in \(x_0\) Fréchet-differenzierbar, also \(f'(x_0)\in\mathcal{L}(E,F)\), \(\alpha'(x_0)\in\mathcal{L}(E,\mathbb{K})\). Dann ist \(\alpha\cdot f:\mathcal{U}\subset E\to F\) in \(x_0\) differenzierbar und</p>
\[ \underbrace{(\alpha f)'(x_0)}_{\mathcal{L}(E,F)}[h]\;=\;\underbrace{\underbrace{f(x_0)}_{F}\ \underbrace{\alpha'(x_0)}_{\mathcal{L}(E,\mathbb{K})}[h]}_{\mathcal{L}(E,F)}\;+\;\underbrace{\underbrace{\alpha(x_0)}_{\mathbb{K}}\ \underbrace{f'(x_0)}_{\mathcal{L}(E,F)}[h]}_{\mathcal{L}(E,F)} . \]
<p><b>Beweisidee.</b></p>
<ul>
<li>(1) Ausmultiplizieren: \(\alpha(x_0+h)f(x_0+h)=\big(\alpha(x_0)+\alpha'(x_0)h+o(\|h\|_E)\big)\big(f(x_0)+f'(x_0)h+o(\|h\|_E)\big)\).</li>
<li>(2) Sortieren: \(=\alpha(x_0)f(x_0)+\underbrace{\big(\alpha(x_0)f'(x_0)+f(x_0)\alpha'(x_0)\big)}_{\mathcal{L}(E,F)}h+(\text{Rest})\).</li>
<li>(3) Der Rest enthält u.a. \(\big(\alpha'(x_0)h\big)\big(f'(x_0)h\big)\), und
\[ \Big\|\big(\alpha'(x_0)h\big)\big(f'(x_0)h\big)\Big\|_F=\big|\alpha'(x_0)h\big|\cdot\big\|f'(x_0)h\big\|_F\le\|\alpha'(x_0)\|_{\mathcal{L}(E,\mathbb{K})}\|h\|_E\cdot\|f'(x_0)\|_{\mathcal{L}(E,F)}\|h\|_E \]
\[ \le M\,\|h\|_E\,\|h\|_E=o(\|h\|_E); \]
alle übrigen Summanden werden genauso abgeschätzt. \(\square\)</li>
</ul>
<p><b>③ Kettenregel.</b> Seien \((E,\|\cdot\|_E)\) (Variable \(x\)), \((F,\|\cdot\|_F)\) (Variable \(y\)), \((G,\|\cdot\|_G)\) (Variable \(z\)) und</p>
\[ f:\mathcal{U}\subset E\to F,\quad \mathcal{U}\ \text{offen},\ x_0\in\mathcal{U},\ f(\mathcal{U})\subset V;\qquad g:V\subset F\to G,\quad V\ \text{offen},\ y_0=f(x_0)\in V, \]
<p>\(f\) in \(x_0\) und \(g\) in \(y_0\) Fréchet-differenzierbar. Dann ist \((g\circ f):\mathcal{U}\subset E\to G\) in \(x_0\) Fréchet-differenzierbar und</p>
\[ (g\circ f)'(x_0)=\underbrace{\underbrace{g_y'(y_0)}_{\mathcal{L}(F,G)}\ \underbrace{f_x'(x_0)}_{\mathcal{L}(E,F)}}_{\mathcal{L}(E,G)}\qquad (\text{Beweis: Hausaufgabe}). \]
<p><b>Kettenregel für endlich viele Variablen.</b> \(E=\mathbb{K}^m\), \(F=\mathbb{K}^n\), \(G=\mathbb{K}^p\):</p>
\[ \underbrace{\mathcal{J}_{x_0}(g\circ f)}_{M^{p,m}}=\underbrace{\mathcal{J}_{y_0}(g)}_{M^{p,n}}\ \underbrace{\mathcal{J}_{x_0}(f)}_{M^{n,m}}, \]
\[ \begin{pmatrix}\dfrac{\partial(g_1\circ f)}{\partial x_1}&\dots&\dfrac{\partial(g_1\circ f)}{\partial x_m}\\[1ex] \vdots& &\vdots\\[1ex] \dfrac{\partial(g_p\circ f)}{\partial x_1}&\dots&\dfrac{\partial(g_p\circ f)}{\partial x_m}\end{pmatrix}_{x=x_0}=\begin{pmatrix}\dfrac{\partial g_1}{\partial y_1}&\dots&\dfrac{\partial g_1}{\partial y_n}\\[1ex] \vdots& &\vdots\\[1ex] \dfrac{\partial g_p}{\partial y_1}&\dots&\dfrac{\partial g_p}{\partial y_n}\end{pmatrix}_{y=y_0}\begin{pmatrix}\dfrac{\partial f_1}{\partial x_1}&\dots&\dfrac{\partial f_1}{\partial x_m}\\[1ex] \vdots& &\vdots\\[1ex] \dfrac{\partial f_n}{\partial x_1}&\dots&\dfrac{\partial f_n}{\partial x_m}\end{pmatrix}_{x=x_0}. \]
<p>Mit \(f(x)=y(x)\), \(g(y)=z(y)\), \((g\circ f)(x)=z(y(x))=\tilde z(x)\) schreibt man manchmal</p>
\[ \frac{D\tilde z}{Dx}=\frac{Dz}{Dy}\cdot\frac{Dy}{Dx}. \]
<p><b>Anmerkung.</b> Dies entspricht dem Einsetzen zweier linear-affiner Abbildungen: aus \(f(x)=y_0+A(x-x_0)\) und \(g(y)=z_0+B(y-y_0)\) folgt</p>
\[ (g\circ f)(x)=z_0+B\big(\underbrace{y_0+A(x-x_0)}_{y=f(x)}-y_0\big)=z_0+BA\,(x-x_0). \]`,
        worte: String.raw`<p>Die drei Regeln sagen: Differenzieren ist linear in der Funktion; beim Produkt aus einer skalaren Funktion \(\alpha\) und einer vektorwertigen Funktion \(f\) fällt der gewohnte Zwei-Summanden-Ausdruck an, nur muss man auf die Typen achten (\(f(x_0)\) ist ein Vektor, \(\alpha'(x_0)[h]\) ein Skalar, \(\alpha(x_0)\) ein Skalar, \(f'(x_0)[h]\) ein Vektor); und bei der Verkettung werden die beiden Ableitungsoperatoren <b>hintereinandergeschaltet</b>, also multipliziert — die äußere Ableitung im Bildpunkt \(y_0=f(x_0)\), die innere im Ausgangspunkt \(x_0\).</p><p>In endlich vielen Variablen ist die Kettenregel schlicht ein Matrizenprodukt der Jacobi-Matrizen, mit den Formaten \((p\times n)\cdot(n\times m)=(p\times m)\). Der Grund ist einfach: Ableiten heißt affin-linear approximieren, und die Hintereinanderausführung zweier affin-linearer Abbildungen \(x\mapsto y_0+A(x-x_0)\) und \(y\mapsto z_0+B(y-y_0)\) ist \(x\mapsto z_0+BA(x-x_0)\).</p>`,
        beispiel: String.raw`<p><b>(a) Produktregel, ausgerechnet.</b> \(E=\mathbb{K}^2\), \(F=\mathbb{K}\), \(\alpha(x)=x_1\), \(f(x)=x_2\). Beide sind linear und stetig, also (<a href="#/7.3.2">7.3.2</a>)</p>
\[ \alpha'(x_0)=(1,0),\qquad f'(x_0)=(0,1). \]
<p>Produktregel:</p>
\[ (\alpha f)'(x_0)=f(x_0)\,\alpha'(x_0)+\alpha(x_0)\,f'(x_0)=x_2^{(0)}(1,0)+x_1^{(0)}(0,1)=\big(x_2^{(0)},\,x_1^{(0)}\big). \]
<p>Probe über <a href="#/7.3.3">7.3.3</a>: \((\alpha f)(x)=x_1x_2\) hat \(\frac{\partial}{\partial x_1}=x_2\), \(\frac{\partial}{\partial x_2}=x_1\) — dieselbe Zeile.</p>
<p><b>(b) Kettenregel, ausgerechnet.</b> \(E=\mathbb{R}^2\), \(F=\mathbb{R}^2\), \(G=\mathbb{R}\) (also \(m=n=2\), \(p=1\)):</p>
\[ f(x)=\begin{pmatrix}x_1+x_2\\ x_1x_2\end{pmatrix},\qquad g(y)=y_1^2+3y_2^2+y_1+2\quad(\text{Beispiel ④}). \]
<p><i>Schritt 1 (die beiden Jacobi-Matrizen).</i> Mit \(y_0=f(x_0)=\big(x_1^{(0)}+x_2^{(0)},\ x_1^{(0)}x_2^{(0)}\big)^{T}\):</p>
\[ \mathcal{J}_{x_0}(f)=\begin{pmatrix}1&1\\ x_2^{(0)}&x_1^{(0)}\end{pmatrix}\in M^{2,2},\qquad \mathcal{J}_{y_0}(g)=\big(2y_1^{(0)}+1,\ 6y_2^{(0)}\big)\in M^{1,2}. \]
<p><i>Schritt 2 (Produkt bilden).</i></p>
\[ \mathcal{J}_{x_0}(g\circ f)=\mathcal{J}_{y_0}(g)\,\mathcal{J}_{x_0}(f)=\big(2y_1^{(0)}+1,\ 6y_2^{(0)}\big)\begin{pmatrix}1&1\\ x_2^{(0)}&x_1^{(0)}\end{pmatrix} \]
\[ =\Big(2\big(x_1^{(0)}+x_2^{(0)}\big)+1+6x_1^{(0)}\big(x_2^{(0)}\big)^2,\ \ 2\big(x_1^{(0)}+x_2^{(0)}\big)+1+6\big(x_1^{(0)}\big)^2x_2^{(0)}\Big)\in M^{1,2}. \]
<p><i>Schritt 3 (Probe durch direktes Einsetzen).</i> \((g\circ f)(x)=(x_1+x_2)^2+3(x_1x_2)^2+(x_1+x_2)+2\), also</p>
\[ \frac{\partial(g\circ f)}{\partial x_1}=2(x_1+x_2)+6x_1x_2^2+1,\qquad \frac{\partial(g\circ f)}{\partial x_2}=2(x_1+x_2)+6x_1^2x_2+1 \]
<p>— dasselbe Ergebnis. In \(x_0=(1,-1)^{T}\) etwa \(\mathcal{J}_{x_0}(g\circ f)=(7,-5)\).</p>
<p><b>(c) Affin-lineare Probe.</b> \(f(x)=y_0+A(x-x_0)\), \(g(y)=z_0+B(y-y_0)\) liefert \((g\circ f)(x)=z_0+BA(x-x_0)\), also \((g\circ f)'(x_0)=BA=g'(y_0)f'(x_0)\) — die Kettenregel ist hier exakt und nicht nur asymptotisch.</p>`,
        plus: String.raw`<p><b>Klausurfallen.</b> (i) <i>Reihenfolge:</i> \((g\circ f)'(x_0)=g'(y_0)\,f'(x_0)\) — erst die innere, dann die äußere Abbildung anwenden; Operatoren bzw. Matrizen kommutieren nicht, und nur diese Reihenfolge passt zu \(M^{p,n}\cdot M^{n,m}=M^{p,m}\). (ii) <i>Auswertungspunkte:</i> \(g'\) wird in \(y_0=f(x_0)\) ausgewertet, nicht in \(x_0\). (iii) <i>Voraussetzung:</i> \(f(\mathcal{U})\subset V\), sonst ist \(g\circ f\) gar nicht erklärt.</p>
<p><b>Typenbuchhaltung als Kontrolle.</b> Schreibt man unter jeden Term den Raum, in dem er lebt (\(F\), \(\mathbb{K}\), \(\mathcal{L}(E,F)\), \(M^{n,m}\)), so fallen Formatfehler sofort auf — das ist die Methode, mit der die Vorlesung Produkt- und Kettenregel notiert.</p>
<p><b>Roter Faden.</b> Mit ① und ② lässt sich die Rechnung aus Beispiel ⑥ (<a href="#/7.3.5">7.3.5</a>) auch regelbasiert führen: \(K=y\cdot y+3y+2y'\cdot y'+y\cdot y'\) mit \(y\mapsto y\) und \(y\mapsto y'=Dy\) als linearen, stetigen Bausteinen liefert genau \(T_{y_0}=(2y_0+3+y_0')\cdot+(4y_0'+y_0)\frac{d}{dx}\). Die Kettenregel für Jacobi-Matrizen ist außerdem die Grundlage für Koordinatenwechsel und implizite Funktionen in den folgenden Abschnitten.</p>`}}]},
    {id:"7.4", t:"Richtungsableitung und Gâteaux-Ableitung", topics:[
       {id:"7.4.1", title:"Die Richtungsableitung Df(x₀)[h]", body:{
        def: String.raw`<p>Es seien \((E,\|\cdot\|_E)\) und \((F,\|\cdot\|_F)\) normierte Räume, \(U\subset E\) offen, \(x_0\in U\) und \(f:U\subset E\to F\). Zu <b>festem</b> \(h\in E\) gibt es (weil \(U\) offen ist) ein \(\varepsilon>0\) mit \(x_0+t\cdot h\in U\) für alle \(t\in\mathbb{K}\) mit \(|t|<\varepsilon\). Man betrachtet die Hilfsfunktion einer Variablen</p>\[\varphi_h(t)=f(x_0+th),\qquad \varphi_h:\ \left]-\varepsilon,\varepsilon\right[\ \longrightarrow\ F.\]<p><b>Definition (Richtungsableitung).</b> Existiert der Grenzwert in \((F,\|\cdot\|_F)\), so heißt</p>\[Df(x_0)[h]\ =\ \left.\frac{d\varphi_h}{dt}\right|_{t=0}\ =\ \lim_{t\to0}\frac{\varphi_h(t)-\varphi_h(0)}{t}\ =\ \lim_{t\to0}\frac{f(x_0+th)-f(x_0)}{t}\ \in F\]<p>die <b>Richtungsableitung</b> von \(f\) in \(x_0\) in Richtung \(h\).</p><p><b>Beispiel (Tafel).</b> Für \(f:U\subset\mathbb{R}^m\to\mathbb{R}\), \(F=\mathbb{R}\), und die Koordinatenrichtungen \(h=e_j\), \(j=1,\dots,m\), ist</p>\[Df(x_0)[e_j]=\left.\frac{\partial f}{\partial x_j}\right|_{x=x_0}.\]<p><b>Eigenschaft 1 (Homogenität in \(h\)).</b> Für alle \(\alpha\in\mathbb{K}\) gilt</p>\[Df(x_0)[\alpha\cdot h]=\alpha\,Df(x_0)[h].\]`,
        worte: String.raw`<p>Die Richtungsableitung ist der Trick, ein Problem in einem womöglich unendlichdimensionalen Raum auf die vertraute eindimensionale Differentialrechnung zurückzuspielen: Man friert eine Richtung \(h\) ein, läuft von \(x_0\) aus nur noch auf der Geraden \(t\mapsto x_0+th\) und leitet die dabei entstehende Funktion \(\varphi_h\) <i>einer</i> Variablen bei \(t=0\) ab. Dass \(U\) offen ist, wird gebraucht, damit \(\varphi_h\) überhaupt auf einem ganzen Intervall \(\left]-\varepsilon,\varepsilon\right[\) erklärt ist und \(t=0\) ein innerer Punkt ist — sonst gäbe es den zweiseitigen Grenzwert nicht.</p><p>Zwei Punkte sind entscheidend. Erstens ist \(Df(x_0)[h]\in F\) ein <b>Vektor</b>, kein Operator; die eckigen Klammern erinnern daran, dass \(h\) hier nur ein eingefrorener Parameter ist, im Unterschied zur Fréchet-Ableitung \(f'(x_0)\in\mathcal{L}(E,F)\). Zweitens ist die Richtungsableitung eine <b>sehr schwache</b> Information: Sie kennt \(f\) nur längs einzelner Geraden durch \(x_0\) und weiß nichts darüber, was zwischen diesen Geraden passiert. Gratis bekommt man deshalb nur die Homogenität (Verlängern der Richtung streckt die Ableitung um denselben Faktor) — weder Additivität in \(h\) noch irgendeine Aussage darüber, wie gut \(f(x_0)+Df(x_0)[h]\) die Funktion in der Nähe von \(x_0\) approximiert.</p>`,
        beispiel: String.raw`<p><b>(a) Im \(\mathbb{R}^2\): die partiellen Ableitungen sind Richtungsableitungen.</b> Mit \(E=\mathbb{R}^2\), \(F=\mathbb{R}\), \(f(x_1,x_2)=x_1^2+3x_2^2+x_1+2\) (Beispiel der Vorlesung), Aufpunkt \(x^{(0)}=\left(x_1^{(0)},x_2^{(0)}\right)\) und Richtung \(h=(h_1,h_2)\):</p>\[\varphi_h(t)=\left(x_1^{(0)}+th_1\right)^2+3\left(x_2^{(0)}+th_2\right)^2+\left(x_1^{(0)}+th_1\right)+2 .\]<p>Ausmultiplizieren und nach Potenzen von \(t\) sortieren:</p>\[\varphi_h(t)=f\!\left(x^{(0)}\right)+t\Big[\left(2x_1^{(0)}+1\right)h_1+6x_2^{(0)}h_2\Big]+t^2\Big[h_1^2+3h_2^2\Big].\]<p>\(\varphi_h\) ist ein Polynom zweiten Grades in \(t\); Ableiten bei \(t=0\) liefert unmittelbar</p>\[Df\!\left(x^{(0)}\right)[h]=\left(2x_1^{(0)}+1\right)h_1+6x_2^{(0)}h_2 .\]<p>Für \(h=e_1=(1,0)\) ergibt das \(2x_1^{(0)}+1=\left.\frac{\partial f}{\partial x_1}\right|_{x=x^{(0)}}\), für \(h=e_2=(0,1)\) entsprechend \(6x_2^{(0)}=\left.\frac{\partial f}{\partial x_2}\right|_{x=x^{(0)}}\) — genau die partiellen Ableitungen. Die Homogenität liest man ebenfalls ab: Ersetzt man \(h\) durch \(\alpha h\), so wird der \(t\)-Koeffizient mit \(\alpha\) multipliziert.</p><p><b>(b) In einem Funktionenraum.</b> \(E=C^1([a,b],\mathbb{R})\) mit \(\|y\|_{C^1}=\|y\|_C+\|y'\|_C\), \(F=\mathbb{R}\), \(a< b\), \(V\in C([a,b],\mathbb{R})\), und das Funktional der Vorlesung</p>\[I(y)=\int_a^b\Big(\left(y'(x)\right)^2-V(x)\left(y(x)\right)^2\Big)\,dx .\]<p>Aufpunkt \(y_0\in C^1\), Richtung \(h\in C^1\). Einsetzen von \(y_0+th\) und Ausmultiplizieren der Quadrate:</p>\[\varphi_h(t)=I(y_0+th)=I(y_0)+2t\int_a^b\Big(y_0'h'-Vy_0h\Big)dx+t^2\int_a^b\Big(\left(h'\right)^2-Vh^2\Big)dx .\]<p>Wieder ein quadratisches Polynom in \(t\), also</p>\[DI(y_0)[h]=\left.\frac{d\varphi_h}{dt}\right|_{t=0}=2\int_a^b\Big(y_0'(x)h'(x)-V(x)y_0(x)h(x)\Big)dx .\]<p>Das ist genau der lineare Hauptterm, den die Vorlesung bei der direkten Fréchet-Rechnung erst mühsam vom Restglied trennen musste — über \(\varphi_h\) fällt er in einer Zeile ab.</p>`,
        plus: String.raw`<p><b>Beweis der Homogenität (wie an der Tafel).</b> Für \(\alpha=0\) sind beide Seiten \(=0\). Für \(\alpha\neq0\) substituiert man \(\theta=t\alpha\):</p>\[\left.\frac{d}{dt}\varphi_{\alpha h}(t)\right|_{t=0}=\alpha\lim_{t\to0}\frac{f(x_0+t\alpha h)-f(x_0)}{t\alpha}=\alpha\lim_{\theta\to0}\frac{f(x_0+\theta h)-f(x_0)}{\theta}=\alpha\left.\frac{d}{d\theta}\varphi_h(\theta)\right|_{\theta=0}.\]<p><b>Notation.</b> Richtungsableitung stets mit <i>eckigen</i> Klammern: \(Df(x_0)[h]\). Die Fréchet-Ableitung ist dagegen ein Operator \(f'(x_0)\in\mathcal{L}(E,F)\), dessen Anwendung ohne Klammern als Produkt \(f'(x_0)h\) geschrieben wird. Die Vorlesung nummeriert die Eigenschaften der Richtungsableitung mit eingekreisten Ziffern; hier sind das Eigenschaft 1 (Homogenität) und Eigenschaft 2 (Konsistenz mit der Fréchet-Ableitung, siehe <a href="#/7.4.2">7.4.2</a>).</p><p><b>Klausurfalle.</b> Aus der Existenz <i>aller</i> Richtungsableitungen folgt nichts über die Fréchet-Ableitung — nicht einmal, dass \(h\mapsto Df(x_0)[h]\) additiv ist. Zum Raum \(C([a,b],\mathbb{R})\) mit \(\|\cdot\|_C\) siehe <a href="#/6.2.1">6.2.1</a>, zur eindimensionalen Theorie den Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.4.2", title:"Konsistenz mit der Fréchet-Ableitung", body:{
        def: String.raw`<p><b>Eigenschaft 2 (Konsistenz mit der Fréchet-Ableitung).</b> Sei \(U\subset E\) offen und \(f:U\subset E\to F\) in \(x_0\in U\) Fréchet-differenzierbar. Dann existiert für <b>jedes</b> \(h\in E\) die Richtungsableitung, und es gilt</p>\[Df(x_0)[h]=f'(x_0)h .\]<p><b>Beweis</b> (Tafel, in Schritten).</p><ul><li><b>1.</b> Halte \(h\in E\) fest, sei \(t\in\mathbb{K}\), und setze \(\tilde h=t\cdot h\). Fréchet-Differenzierbarkeit bedeutet \(f(x_0+\tilde h)=f(x_0)+f'(x_0)\tilde h+o\!\left(\|\tilde h\|_E\right)\).</li><li><b>2.</b> \(f'(x_0)\) ist linear, also \(f'(x_0)\tilde h=\left(f'(x_0)h\right)\cdot t\); ferner ist \(\|\tilde h\|_E=\|h\|_E\cdot|t|\), bei festem \(h\) also \(o\!\left(\|h\|_E\cdot|t|\right)=o(|t|)\).</li><li><b>3.</b> Damit ist</li></ul>\[\varphi_h(t)=f(x_0+th)=\underbrace{f(x_0)}_{=\varphi_h(0)}+\left(f'(x_0)h\right)\cdot t+o(|t|),\qquad t\in\mathbb{K}.\]<ul><li><b>4.</b> Das ist genau die Differenzierbarkeit von \(\varphi_h\) in \(t=0\) mit \(\left.\frac{d}{dt}\varphi_h\right|_{t=0}=f'(x_0)h\). Damit ist die Behauptung bewiesen.</li></ul><p><b>Folgerung im \(\mathbb{R}^m\).</b> Ist \(f:U\subset\mathbb{R}^m\to\mathbb{R}\) (\(U\) offen) in \(x^{(0)}\in U\) Fréchet-differenzierbar und \(h=\left(\alpha_1,\dots,\alpha_m\right)^{T}\) mit \(\alpha_j\in\mathbb{K}\), so ist</p>\[Df\!\left(x^{(0)}\right)[h]=\mathcal{J}_{x^{(0)}}(f)\,h=\alpha_1\left.\frac{\partial f}{\partial x_1}\right|_{x=x^{(0)}}+\dots+\alpha_m\left.\frac{\partial f}{\partial x_m}\right|_{x=x^{(0)}}.\]<p><b>Zusammenfassend:</b> Fréchet-differenzierbar \(\Longrightarrow\) Existenz aller Richtungsableitungen. <b>Die Umkehrung gilt im Allgemeinen nicht.</b></p>`,
