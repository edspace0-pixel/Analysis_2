        worte: String.raw`<p>Die Fréchet-Ableitung in einem <i>festen</i> Punkt ist ein stetiger linearer Operator, also ein Element von \(\mathcal{L}(E,F)\). Lässt man den Punkt laufen, entsteht eine Funktion mit Werten in einem normierten Raum: \(x\mapsto f'(x)\) bildet \(U\subset E\) nach \(\mathcal{L}(E,F)\) ab. Für Abbildungen zwischen normierten Räumen gibt es aber bereits einen Ableitungsbegriff — man muss die Definition der Fréchet-Ableitung also nur ein <b>zweites Mal</b> anwenden, jetzt mit \(F\) ersetzt durch \(\mathcal{L}(E,F)\). Es wird hier nichts Neues erfunden, sondern dieselbe Definition auf einen größeren Zielraum losgelassen.</p><p>Daraus ergibt sich zwangsläufig der auf den ersten Blick unhandliche Typ \(\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\): Die zweite Ableitung frisst einen Vektor und liefert wieder einen Operator. Die beiden Vektoren haben dabei ganz verschiedene Rollen — \(h\) sagt, <i>in welche Richtung der Punkt \(x_0\) verschoben</i> wird, \(k\) sagt, <i>auf welchen Zuwachs der so entstandene Operator angewandt</i> wird. Weil man beide nacheinander einsetzen kann und das Ergebnis in jedem der beiden Argumente linear ist, liest man \(f''(x_0)\) am bequemsten als Bilinearform \(E\times E\to F\). In \(\mathbb{R}^m\) ist genau das später die Hesse-Matrix.</p><p>Wichtig ist, <b>wo</b> die Kleinheit des Restglieds gemessen wird: nicht in \(\|\cdot\|_F\), sondern in \(\|\cdot\|_{\mathcal{L}(E,F)}\), also gleichmäßig über alle Zuwächse gleichzeitig. Das ist deutlich stärker als punktweise Konvergenz der Operatoren und ist der eigentliche Grund, warum die zweite Ableitung so gute Eigenschaften hat (Bilinearität, Stetigkeit, später Symmetrie).</p>`,
        beispiel: String.raw`<p><b>Erster Schritt (Tafelbeispiel).</b> \(f:U\subset\mathbb{R}\to\mathbb{R}\), \(f(x)=x^3\), \(x_0\in U\):</p>\[f(x_0+h)=(x_0+h)^3=\underbrace{x_0^3}_{=f(x_0)}+\underbrace{3x_0^2h}_{\in\,\mathcal{L}(\mathbb{R},\mathbb{R})}+\underbrace{3x_0h^2+h^3}_{=o(|h|)}.\]<p>Kontrolle des Restglieds: \(\dfrac{|3x_0h^2+h^3|}{|h|}=|3x_0h+h^2|\longrightarrow 0\) für \(h\to0\), also tatsächlich \(o(|h|)\). Damit ist \(T_{x_0}=3x_0^2\) und</p>\[T_\bullet:\;U\longrightarrow\mathcal{L}(\mathbb{R},\mathbb{R})\sim\mathbb{R},\qquad x\longmapsto T_x=3x^2.\]<p><b>Zweiter Schritt.</b> Jetzt wird die Funktion \(T_\bullet=f'(\cdot)\) selbst differenziert. Für \(\hat h\to\mathbf{0}_E\), hier \(E=\mathbb{R}\):</p>\[f'(x_0+\hat h)=3(x_0+\hat h)^2=\underbrace{3x_0^2}_{=f'(x_0)}+\underbrace{6x_0\hat h}_{\text{linear in }\hat h}+\underbrace{3\hat h^2}_{=o(|\hat h|)}.\]<p>Der lineare Anteil ist die Zuordnung \(\hat h\longmapsto 6x_0\hat h\), und \(6x_0\hat h\) ist als <i>Operator</i> zu lesen, nämlich als „Multiplikation mit \(6x_0\hat h\)“ in \(\mathcal{L}(\mathbb{R},\mathbb{R})\). Also</p>\[f''(x_0)\in\mathcal{L}\big(\mathbb{R},\mathcal{L}(\mathbb{R},\mathbb{R})\big),\qquad f''(x_0)[h,k]=\big[f''(x_0)h\big]k=6x_0\,h\,k.\]<p><b>Rückübersetzung.</b> Unter der Identifikation \(\mathcal{L}(\mathbb{R},\mathbb{R})\sim\mathbb{R}\) (ein Operator auf \(\mathbb{R}\) ist die Multiplikation mit einer Zahl) entspricht \(f''(x_0)\) genau der Zahl \(6x_0\) — der vertrauten zweiten Ableitung von \(x^3\) aus der eindimensionalen Analysis. Die abstrakte Definition liefert im Eindimensionalen also nichts Neues, sondern nur die Sprache, die für allgemeine \(E,F\) trägt.</p>`,
        plus: String.raw`<p><b>Notation.</b> Die Vorlesung schreibt den Nullvektor als <i>durchgestrichene bzw. eingekringelte Null</i>; da KaTeX dieses Zeichen nicht kennt, steht hier durchgehend \(\mathbf{0}_E\) bzw. \(\mathbf{0}_F\) mit Raum-Index. Den Zuwachs auf der <i>zweiten</i> Stufe schreibt der Dozent mal mit Tilde \(\tilde h,\tilde T_{x_0}\), mal mit Dach \(\hat h,\hat T_{x_0}\) — gemeint ist stets dasselbe.</p><p><b>Zwei Klausurfallen.</b> (1) \(f''(x_0)\) liegt <b>nicht</b> in \(\mathcal{L}(E,F)\), sondern eine Stufe höher in \(\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\); wer die Typen nicht mitschreibt, verrechnet sich sofort. (2) Das Restglied in der Definition ist klein bezüglich der <b>Operatornorm</b>, nicht bezüglich \(\|\cdot\|_F\).</p><p>Der Vergleich mit dem eindimensionalen Fall — dort ist \(f''(x_0)\) einfach eine Zahl — steht auf dem Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>. Wie man \(f''(x_0)\) praktisch ausrechnet, ohne zweimal eine Landau-Entwicklung zu machen, steht in <a href="#/7.7.2">7.7.2</a>.</p>`}},
       {id:"7.7.2", title:"Symmetrie der zweiten Ableitung", body:{
        def: String.raw`<p><b>Satz (Darstellung durch iterierte Richtungsableitungen).</b> Falls \(f''(x_0)\) existiert, so gilt für alle \(h,k\in E\)</p>\[\big[f''(x_0)h\big]k=D\big(Df[k]\big)\Big|_{x=x_0}[h].\]<p>Typen links: \(f''(x_0)\in\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\), \(h\in E\), also \(\big[f''(x_0)h\big]\in\mathcal{L}(E,F)\), \(k\in E\), Ergebnis in \(F\). Rechts ist \(Df[k]\) eine \(F\)-wertige Funktion von \(x\); ihre Richtungsableitung in Richtung \(h\) liegt wieder in \(F\).</p><p><b>Zusammenfassung.</b> \(f''(x_0)\) ist bilinear und stetig,</p>\[f''(x_0):E\times E\longrightarrow F,\qquad f''(x_0)[h,k]=\big[f''(x_0)h\big]k=D\big(Df[k]\big)\Big|_{x=x_0}[h].\]<p><b>Satz (Symmetrie).</b> Sei \(f:U\subset E\to F\) in \(U\) zweifach Fréchet-differenzierbar und sei</p>\[f''(\cdot):U\longrightarrow\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\quad\text{stetig}.\]<p>Dann gilt für \(x\in U\) und alle \(h,k\in E\)</p>\[\big[f''(x)h\big][k]=\big[f''(x)k\big][h],\qquad\text{d.h.}\qquad f''(x)[h,k]=f''(x)[k,h],\]<p>die zugehörige stetige Bilinearform ist also <b>symmetrisch</b>.</p><p><b>Beweisskizze zur Darstellungsformel (Tafel).</b></p><ul><li><b>Schritt 1.</b> Nach Definition der Ableitung von \(f'(\cdot)\) ist \(f''(x_0)h=Df'(x_0)[h]=\lim\limits_{t\to0}\dfrac{f'(x_0+th)-f'(x_0)}{t}\) \(\;(*)\) — ein Grenzwert <i>in</i> \(\mathcal{L}(E,F)\) bezüglich \(\|\cdot\|_{\mathcal{L}(E,F)}\).</li><li><b>Schritt 2 (Zwischenüberlegung).</b> Ist \(\Psi:\left]-\varepsilon,\varepsilon\right[\longrightarrow\mathcal{L}(E,F)\) mit \(\Psi(t)\xrightarrow[\,t\to0\,]{\,\|\cdot\|_{\mathcal{L}}\,}\Psi_0\in\mathcal{L}(E,F)\), so gilt für jedes feste \(k\in E\) auch \(\Psi(t)k\to\Psi_0k\) in \(\|\cdot\|_F\), denn \[\big\|(\Psi(t)-\Psi_0)k\big\|_F\le\underbrace{\|\Psi(t)-\Psi_0\|_{\mathcal{L}}}_{\text{nach Voraussetzung}\;\to\,0}\cdot\|k\|_E\longrightarrow 0.\]</li><li><b>Schritt 3.</b> Schritt 2 mit \(\Psi(t)=\dfrac{f'(x_0+th)-f'(x_0)}{t}\) auf \((*)\) angewandt: das feste \(k\) darf in den Limes gezogen werden, \[\big[f''(x_0)h\big]k=\lim_{t\to0}\left(\frac{f'(x_0+th)[k]-f'(x_0)[k]}{t}\right).\]</li><li><b>Schritt 4.</b> Rechts steht genau die Richtungsableitung der Funktion \(x\mapsto f'(x)[k]=Df[k]\) in Richtung \(h\) an der Stelle \(x_0\): \[=D\big(f'(x)[k]\big)\Big|_{x=x_0}[h]=D\big(Df[k]\big)[h].\]</li></ul>`,
        worte: String.raw`<p>Die Darstellungsformel ist das Arbeitspferd des Abschnitts: Sie übersetzt den abstrakten Typ \(\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\) in etwas, das man wirklich ausrechnen kann — <b>zweimal hintereinander in eine Richtung ableiten</b>. Man liest sie von innen nach außen: zuerst wird \(f\) in Richtung \(k\) abgeleitet, das ergibt eine neue Funktion \(x\mapsto Df(x)[k]\) mit Werten in \(F\); diese wird anschließend in Richtung \(h\) abgeleitet, ausgewertet in \(x_0\). Das äußere Argument \(h\) gehört also zur äußeren Ableitung.</p><p>Der einzige technische Punkt im Beweis ist die Zwischenüberlegung. Der Differenzenquotient konvergiert nach Definition in der <b>Operatornorm</b>; um beide Seiten auf ein festes \(k\) anwenden zu dürfen, braucht man, dass Normkonvergenz in \(\mathcal{L}(E,F)\) die punktweise Konvergenz nach sich zieht. Das ist genau die Abschätzung \(\|Tk\|_F\le\|T\|_{\mathcal{L}}\|k\|_E\), angewandt auf \(T=\Psi(t)-\Psi_0\). Es ist derselbe Mechanismus wie bei gleichmäßiger gegenüber punktweiser Konvergenz von Funktionen: Die stärkere Konvergenz erlaubt es, Grenzwert und Auswertung zu vertauschen.</p><p>Der Symmetriesatz sagt dann: Die Reihenfolge der beiden Ableitungsrichtungen ist egal — aber <b>nicht umsonst</b>. Vorausgesetzt wird, dass \(f\) in ganz \(U\) zweimal differenzierbar <i>und</i> \(f''(\cdot)\) dort <i>stetig</i> ist. Ohne diese Stetigkeit bricht die Aussage zusammen; das Gegenbeispiel dazu steht in <a href="#/7.7.4">7.7.4</a>. Symmetrie ist also kein formaler Automatismus, sondern ein Satz mit Voraussetzung.</p>`,
        beispiel: String.raw`<p>Wir rechnen \(f''(x_0)\) einmal komplett mit der Darstellungsformel aus — und zwar in beiden Reihenfolgen, um die Symmetrie zu sehen. Sei</p>\[f:\mathbb{R}^2\to\mathbb{R},\qquad f(x)=x_1^2x_2,\qquad x=(x_1,x_2)^{T},\qquad x_0=(1,2)^{T}.\]<p><b>Schritt 1: die erste Ableitung in Richtung \(k=(k_1,k_2)^{T}\).</b> Da \(f\) ein Polynom ist, existieren alle partiellen Ableitungen und sind stetig; nach der hinreichenden Bedingung aus §7.6 ist \(f\) Fréchet-differenzierbar mit</p>\[Df(x)[k]=\frac{\partial f}{\partial x_1}k_1+\frac{\partial f}{\partial x_2}k_2=2x_1x_2\,k_1+x_1^2\,k_2=:g_k(x).\]<p><b>Schritt 2: \(g_k\) in Richtung \(h=(h_1,h_2)^{T}\) ableiten.</b> \(g_k\) ist wieder ein Polynom in \(x\) (mit den festen Parametern \(k_1,k_2\)):</p>\[\frac{\partial g_k}{\partial x_1}=2x_2k_1+2x_1k_2,\qquad \frac{\partial g_k}{\partial x_2}=2x_1k_1,\]\[D\big(Df[k]\big)\Big|_{x=x_0}[h]=\big(2x_2k_1+2x_1k_2\big)\Big|_{x=x_0}h_1+\big(2x_1k_1\big)\Big|_{x=x_0}h_2.\]<p>Einsetzen von \(x_0=(1,2)^{T}\):</p>\[f''(x_0)[h,k]=(4k_1+2k_2)h_1+2k_1h_2=4h_1k_1+2h_1k_2+2h_2k_1.\]<p><b>Schritt 3: Probe in vertauschter Reihenfolge.</b> Jetzt zuerst in Richtung \(h\), dann in Richtung \(k\):</p>\[Df(x)[h]=2x_1x_2h_1+x_1^2h_2,\qquad D\big(Df[h]\big)\Big|_{x=x_0}[k]=(4h_1+2h_2)k_1+2h_1k_2\]\[=4h_1k_1+2h_2k_1+2h_1k_2.\]<p>Beide Ausdrücke stimmen überein, also \(f''(x_0)[h,k]=f''(x_0)[k,h]\) — die Bilinearform ist symmetrisch, wie der Satz es verlangt (die Voraussetzung ist erfüllt: \(f''(\cdot)\) hat als Polynom stetige Koeffizienten).</p><p><b>Ablesen der Bilinearität.</b> \(f''(x_0)[h,k]=4h_1k_1+2h_1k_2+2h_2k_1\) ist in \(h\) und in \(k\) je linear, und wegen \(|f''(x_0)[h,k]|\le 8\|h\|\,\|k\|\) auch stetig — genau die Zusammenfassung von der Tafel.</p>`,
        plus: String.raw`<p><b>Klausurfalle Reihenfolge.</b> In \(\big[f''(x_0)h\big]k=D\big(Df[k]\big)\big|_{x=x_0}[h]\) wandert das <i>erste</i> Argument \(h\) nach <i>außen</i> und das <i>zweite</i> Argument \(k\) nach <i>innen</i>. Solange die Voraussetzungen des Symmetriesatzes gelten, ist das folgenlos — in einer Aufgabe ohne Stetigkeitsvoraussetzung darf man die Reihenfolge aber keinesfalls stillschweigend tauschen.</p><p><b>Roter Faden.</b> Die Zwischenüberlegung in Schritt 2 ist ein Musterbeispiel für den Beweistyp „stärkere Konvergenz erlaubt Vertauschen“: Aus \(\|\Psi(t)-\Psi_0\|_{\mathcal{L}}\to0\) folgt punktweise Konvergenz, nicht umgekehrt. Dieselbe Logik trägt bei gleichmäßiger Konvergenz von Funktionenfolgen (vgl. den Raum \(C(X,Y)\) mit \(\|\cdot\|_C\) in <a href="#/6.2.1">6.2.1</a>) und ist auf dem Spickzettel <a href="#/ref/vertauschen">Vertauschen von Grenzprozessen</a> gesammelt.</p><p>Die \(\mathbb{R}^m\)-Fassung dieses Symmetriesatzes ist der <b>Satz von Schwarz</b> (siehe <a href="#/7.7.4">7.7.4</a>); die Bilinearform \(f''(x_0)\) wird dort zur Hesse-Matrix.</p>`}},
       {id:"7.7.3", title:"Die Räume der n-linearen Abbildungen und höhere Ableitungen", body:{
        def: String.raw`<p><b>Anmerkung: der Raum der stetigen Bilinearformen.</b> Sei \(T:E\times E\to F\) bilinear und stetig. Über \(T[h,k]=[Th]k\) entsprechen sich</p>\[\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\;\cong\;\mathcal{L}(E,E;F),\]<p>und \(\mathcal{L}(E,E;F)\) ist ein Vektorraum. Darauf ist</p>\[\|T\|_{\mathcal{L}(E,E;F)}=\sup_{h,k\in E\setminus\{\mathbf{0}_E\}}\frac{\big\|T[h,k]\big\|_F}{\|h\|_E\cdot\|k\|_E}\]<p>eine Norm. Insbesondere gilt die Abschätzung \(\big\|T[h,k]\big\|_F\le\|T\|_{\mathcal{L}(E,E;F)}\cdot\|h\|_E\cdot\|k\|_E\).</p><p><b>Bezeichnungen (Stufen).</b></p>\[\mathcal{L}(E,F)=\mathcal{L}^{(1)}(E,F),\]\[\mathcal{L}(E,E;F)=\mathcal{L}^{(2)}(E,F)=\mathcal{L}\big(E,\mathcal{L}^{(1)}(E,F)\big),\]<p>und fortgesetzt für \(n\in\mathbb{N}\):</p>\[\mathcal{L}(\underbrace{E,\dots,E}_{n};F)=\mathcal{L}^{(n)}(E,F)=\mathcal{L}\big(E,\mathcal{L}^{(n-1)}(E,F)\big).\]<p><b>Höhere Ableitungen.</b> Ist \(f''(\cdot):U\subset E\to\mathcal{L}^{(2)}(E,F)\) differenzierbar, so gilt \(f'''(x)\in\mathcal{L}^{(3)}(E,F)\), usw.; allgemein</p>\[f^{(n)}(x_0)\in\mathcal{L}^{(n)}(E,F).\]<p>Bei entsprechender Stetigkeit dieser Ableitungen sind sie <b>symmetrisch</b>, d.h. \(f^{(n)}(x_0)[h_1,\dots,h_n]\) ändert sich beim Vertauschen der Argumente nicht.</p>`,
        worte: String.raw`<p>Hinter der Kette \(\mathcal{L}\big(E,\mathcal{L}^{(n-1)}(E,F)\big)=\mathcal{L}^{(n)}(E,F)\) steckt eine einzige, sehr einfache Idee: Eine Abbildung, die <i>einen</i> Vektor nimmt und dafür einen Operator auf Vektoren zurückgibt, ist dasselbe wie eine Abbildung, die <i>zwei</i> Vektoren gleichzeitig nimmt — man setzt die Argumente nur nacheinander statt gemeinsam ein. Jeder weitere Ableitungsschritt hängt also genau ein Argument an. Deshalb ist \(f'\) linear in einem Argument, \(f''\) bilinear in zweien, \(f'''\) trilinear in dreien, und \(f^{(n)}\) ist \(n\)-linear.</p><p>Die Norm auf \(\mathcal{L}^{(2)}(E,F)\) ist genau die Fortsetzung der Operatornorm: Sie misst, um welchen Faktor \(T\) Längen maximal vergrößert, jetzt eben mit zwei Eingängen im Nenner. Ihr eigentlicher Nutzen ist die daraus folgende Abschätzung \(\|T[h,k]\|_F\le\|T\|\,\|h\|_E\,\|k\|_E\); für multilineare Abbildungen ist Stetigkeit gleichbedeutend mit der Existenz einer solchen Schranke. Genau diese Abschätzung trägt später alle Restgliedabschätzungen.</p><p>Wichtig für die Klausur: Der Raum \(\mathcal{L}^{(n)}(E,F)\) ist selbst wieder ein normierter Raum — deswegen kann man immer weiter ableiten, ohne die Theorie zu wechseln. Und die Symmetrieaussage aus <a href="#/7.7.2">7.7.2</a> setzt sich fort: Bei stetiger \(n\)-ter Ableitung darf man die \(n\) Richtungen beliebig permutieren.</p>`,
        beispiel: String.raw`<p><b>(a) Der Ableitungsturm für \(f:\mathbb{R}\to\mathbb{R}\), \(f(x)=x^4\).</b> Jede Stufe entsteht durch Landau-Entwicklung der vorigen.</p><p><i>Stufe 1:</i></p>\[f(x_0+h)=x_0^4+\underbrace{4x_0^3h}_{\text{linear in }h}+\underbrace{6x_0^2h^2+4x_0h^3+h^4}_{=o(|h|)}\;\Longrightarrow\;f'(x)[h]=4x^3h\in\mathcal{L}^{(1)}(\mathbb{R},\mathbb{R}).\]<p><i>Stufe 2:</i> Anwenden auf ein festes \(k\) und nach \(\hat h\) entwickeln:</p>\[f'(x_0+\hat h)[k]=4(x_0+\hat h)^3k=4x_0^3k+\underbrace{12x_0^2\hat h\,k}_{\text{linear in }\hat h}+\underbrace{(12x_0\hat h^2+4\hat h^3)k}_{=o(|\hat h|)}\]\[\Longrightarrow\;f''(x_0)[h,k]=12x_0^2\,h\,k\in\mathcal{L}^{(2)}(\mathbb{R},\mathbb{R}).\]<p><i>Stufe 3:</i> genauso für \(f''(\cdot):\mathbb{R}\to\mathcal{L}^{(2)}(\mathbb{R},\mathbb{R})\):</p>\[f''(x_0+\hat h)[k,\ell]=12(x_0+\hat h)^2k\ell=12x_0^2k\ell+\underbrace{24x_0\hat h\,k\ell}_{\text{linear in }\hat h}+\underbrace{12\hat h^2k\ell}_{=o(|\hat h|)}\]\[\Longrightarrow\;f'''(x_0)[h,k,\ell]=24x_0\,h\,k\,\ell\in\mathcal{L}^{(3)}(\mathbb{R},\mathbb{R}).\]<p>Die Symmetrie ist hier direkt sichtbar: \(24x_0hk\ell\) ändert sich beim Vertauschen von \(h,k,\ell\) nicht. Die zugehörige Norm:</p>\[\|f'''(x_0)\|_{\mathcal{L}^{(3)}(\mathbb{R},\mathbb{R})}=\sup\frac{|24x_0\,h\,k\,\ell|}{|h|\cdot|k|\cdot|\ell|}=24|x_0|.\]<p><b>(b) Eine Norm in \(\mathcal{L}^{(2)}(\mathbb{R}^2,\mathbb{R})\).</b> Sei \(T[h,k]=h_1k_2+h_2k_1\) mit euklidischen Normen. Wegen</p>\[T[h,k]=\big\langle h,\,Ak\big\rangle_{\mathbb{R}^2},\qquad A=\begin{pmatrix}0&1\\1&0\end{pmatrix},\qquad \|Ak\|=\|k\|\;\;(A^2=\mathbf{1}),\]<p>liefert die Cauchy-Schwarz-Ungleichung \(|T[h,k]|\le\|h\|\cdot\|Ak\|=\|h\|\cdot\|k\|\), also \(\|T\|_{\mathcal{L}^{(2)}}\le1\). Für \(h=k=\tfrac{1}{\sqrt2}(1,1)^{T}\) ist \(\|h\|=\|k\|=1\) und \(T[h,k]=\tfrac12+\tfrac12=1\); das Supremum wird angenommen, also</p>\[\|T\|_{\mathcal{L}^{(2)}(\mathbb{R}^2,\mathbb{R})}=1.\]`,
        plus: String.raw`<p><b>Zur Schreibweise.</b> Das Semikolon in \(\mathcal{L}(E,\dots,E;F)\) trennt die \(n\) Argumenträume vom Zielraum. Die Vorlesung schreibt für die Identifikation \(\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\cong\mathcal{L}(E,E;F)\) an der Tafel einen geschwungenen Haken; gemeint ist ein Isomorphismus normierter Räume, unter dem \([Th]k\) und \(T[h,k]\) dasselbe Objekt bezeichnen. Beide Schreibweisen werden deshalb ohne Vorwarnung gemischt.</p><p><b>Wo das gebraucht wird.</b> Für \(E=\mathbb{R}^m\), \(F=\mathbb{R}\) ist \(\mathcal{L}^{(2)}(\mathbb{R}^m,\mathbb{R})\) genau der Raum der stetigen Bilinearformen auf \(\mathbb{R}^m\); über \(T[h,k]=\big\langle h,Ak\big\rangle_{\mathbb{R}^m}\) lässt sich dieser mit dem Raum der \(m\times m\)-Matrizen identifizieren — die zweite Ableitung wird dort zur Hesse-Matrix, siehe <a href="#/7.7.4">7.7.4</a>. Und die \(n\)-Linearität ist die Grundlage der mehrdimensionalen Taylorformel, in der die Terme \(\tfrac{1}{n!}f^{(n)}(x_0)[h,\dots,h]\) auftreten.</p><p>Dass Abbildungsräume selbst normierte Räume sind, ist aus <a href="#/6.2.1">6.2.1</a> vertraut (Raum \(C(X,Y)\) mit \(\|\cdot\|_C\)); hier wird dieselbe Konstruktion nur immer wieder auf sich selbst angewandt. Weitere Einordnung auf dem Spickzettel <a href="#/ref/saetze">Sätze</a>.</p>`}},
       {id:"7.7.4", title:"Satz von Schwarz und Hesse-Matrix", body:{
        def: String.raw`<p><b>Spezialfall \(\mathbb{R}^m\).</b> Sei \(f:U\subset\mathbb{R}^m\to\mathbb{R}\) zweifach Fréchet-differenzierbar in \(U\). Mit den Einheitsvektoren \(e_j,e_k\) und der Darstellungsformel aus <a href="#/7.7.2">7.7.2</a>:</p>\[f''(x_0)[e_k,e_j]=\big[f''(x_0)e_k\big]e_j=D\big(Df[e_j]\big)\Big|_{x=x_0}[e_k]=D\left(\frac{\partial f(x)}{\partial x_j}\right)\Big|_{x=x_0}[e_k]\]\[=\left.\left(\frac{\partial}{\partial x_k}\left(\frac{\partial f}{\partial x_j}\right)\right)\right|_{x=x_0}=\left.\frac{\partial^2f}{\partial x_k\,\partial x_j}\right|_{x=x_0}\]<p>— die <b>zweiten partiellen Ableitungen</b> sind also nichts anderes als die Werte der Bilinearform \(f''(x_0)\) auf Paaren von Einheitsvektoren.</p><p><b>Satz von Schwarz.</b> Für \(f:U\subset\mathbb{R}^m\to\mathbb{R}\) sollen alle zweiten partiellen Ableitungen in \(U\) existieren und dort <b>stetig</b> sein. Dann gilt</p>\[\frac{\partial^2f(x)}{\partial x_k\,\partial x_j}=\frac{\partial^2f(x)}{\partial x_j\,\partial x_k},\qquad x\in U,\quad 1\le k,j\le m.\]<p><b>Hesse-Matrix.</b></p>\[\left.\begin{pmatrix}\dfrac{\partial^2f}{\partial x_1^2}&\dots&\dfrac{\partial^2f}{\partial x_1\,\partial x_m}\\ \vdots&&\vdots\\ \dfrac{\partial^2f}{\partial x_m\,\partial x_1}&\dots&\dfrac{\partial^2f}{\partial x_m^2}\end{pmatrix}\right|_{x=x_0}=H_{x_0}(f),\]<p>und die zweite Ableitung als Bilinearform lautet damit</p>\[f''(x_0)[h,k]=\big\langle h,\;H_{x_0}(f)\,k\big\rangle_{\mathbb{R}^m}.\]<p>Nach dem Satz von Schwarz ist \(H_{x_0}(f)\) symmetrisch.</p>`,
        worte: String.raw`<p>Hier landet die abstrakte Theorie im Rechenbaren. Setzt man in die Bilinearform \(f''(x_0)\) nur Einheitsvektoren ein, so liefert die Darstellungsformel aus <a href="#/7.7.2">7.7.2</a> zweimaliges partielles Ableiten: erst nach \(x_j\) (inneres Argument \(e_j\)), dann nach \(x_k\) (äußeres Argument \(e_k\)). Die \(m^2\) Zahlen \(\partial^2f/\partial x_k\partial x_j\) legen die Bilinearform vollständig fest — man sammelt sie in der Hesse-Matrix, und \(f''(x_0)[h,k]=\langle h,H_{x_0}(f)k\rangle\) ist dann nur noch die übliche Matrixschreibweise einer Bilinearform.</p><p>Der Satz von Schwarz ist die \(\mathbb{R}^m\)-Fassung des Symmetriesatzes: Bei <i>stetigen</i> zweiten partiellen Ableitungen darf man die Reihenfolge des Ableitens vertauschen, die Hesse-Matrix ist also symmetrisch. Das ist inhaltlich ein Vertauschungssatz für zwei Grenzprozesse (zwei Differenzenquotienten), und wie immer bei Vertauschungssätzen ist die Stetigkeitsvoraussetzung kein Schmuck: Fällt sie weg, kann die Symmetrie tatsächlich scheitern.</p><p>Praktisch bedeutet das: In der Klausur muss man bei einer glatten Funktion — Polynome, Exponential-, Sinus-, Bruchfunktionen auf ihrem Definitionsbereich — nur die obere Dreieckshälfte der Hesse-Matrix ausrechnen und den Rest spiegeln. Bei einer stückweise definierten Funktion mit Sonderdefinition in einem Punkt ist dagegen immer Vorsicht geboten.</p>`,
        erfuellt: String.raw`<p><b>Schwarz greift:</b> \(f:\mathbb{R}^2\to\mathbb{R}\), \(f(x)=x_1^3x_2^2\), Punkt \(x_0=(1,2)^{T}\).</p><p><b>Erste partielle Ableitungen.</b></p>\[\frac{\partial f}{\partial x_1}=3x_1^2x_2^2,\qquad \frac{\partial f}{\partial x_2}=2x_1^3x_2.\]<p><b>Zweite partielle Ableitungen.</b></p>\[\frac{\partial^2f}{\partial x_1^2}=\frac{\partial}{\partial x_1}\big(3x_1^2x_2^2\big)=6x_1x_2^2,\qquad \frac{\partial^2f}{\partial x_2^2}=\frac{\partial}{\partial x_2}\big(2x_1^3x_2\big)=2x_1^3,\]\[\frac{\partial^2f}{\partial x_2\,\partial x_1}=\frac{\partial}{\partial x_2}\big(3x_1^2x_2^2\big)=6x_1^2x_2,\qquad \frac{\partial^2f}{\partial x_1\,\partial x_2}=\frac{\partial}{\partial x_1}\big(2x_1^3x_2\big)=6x_1^2x_2.\]<p>Beide gemischten Ableitungen sind gleich — wie es der Satz von Schwarz verlangt, denn alle zweiten partiellen Ableitungen sind Polynome und damit auf ganz \(\mathbb{R}^2\) stetig.</p><p><b>Hesse-Matrix.</b></p>\[H_{x}(f)=\begin{pmatrix}6x_1x_2^2&6x_1^2x_2\\ 6x_1^2x_2&2x_1^3\end{pmatrix},\qquad H_{x_0}(f)=\begin{pmatrix}24&12\\12&2\end{pmatrix}\;\;\text{für }x_0=(1,2)^{T},\]<p>symmetrisch. <b>Probe über die Bilinearform:</b></p>\[f''(x_0)[h,k]=\big\langle h,H_{x_0}(f)k\big\rangle_{\mathbb{R}^2}=24h_1k_1+12h_1k_2+12h_2k_1+2h_2k_2,\]<p>und Vertauschen von \(h\) und \(k\) liefert denselben Ausdruck: \(f''(x_0)[h,k]=f''(x_0)[k,h]\).</p>`,
        verletzt: String.raw`<p><b>Ohne Stetigkeit gilt der Satz nicht</b> (Anmerkung von der Tafel, mit der Hausaufgabe „Vergleichen Sie die gemischten 2. partiellen Ableitungen im Ursprung“). Sei \(x,y\in\mathbb{R}\) und</p>\[f(x,y)=\begin{cases}x\cdot y\cdot\dfrac{x^2-y^2}{x^2+y^2}\,,&x^2+y^2>0\\[2mm]0\,,&x=y=0.\end{cases}\]<p><b>Schritt 1: \(\partial f/\partial x\) auf der \(y\)-Achse.</b> Für festes \(y\) ist \(f(0,y)=0\), also</p>\[\frac{\partial f}{\partial x}(0,y)=\lim_{h\to0}\frac{f(h,y)-f(0,y)}{h}=\lim_{h\to0}\frac{h\,y\,\frac{h^2-y^2}{h^2+y^2}}{h}=\lim_{h\to0}y\,\frac{h^2-y^2}{h^2+y^2}=y\cdot\frac{-y^2}{y^2}=-y\]<p>für \(y\ne0\); für \(y=0\) ist \(f(h,0)=0\), also \(\frac{\partial f}{\partial x}(0,0)=0\), was ebenfalls \(-y\big|_{y=0}\) entspricht. Insgesamt \(\frac{\partial f}{\partial x}(0,y)=-y\) für alle \(y\).</p><p><b>Schritt 2: \(\partial f/\partial y\) auf der \(x\)-Achse.</b> Analog mit \(f(x,0)=0\):</p>\[\frac{\partial f}{\partial y}(x,0)=\lim_{h\to0}\frac{f(x,h)-f(x,0)}{h}=\lim_{h\to0}x\,\frac{x^2-h^2}{x^2+h^2}=x\cdot\frac{x^2}{x^2}=x\]<p>für alle \(x\) (für \(x=0\) direkt \(0\)).</p><p><b>Schritt 3: die gemischten zweiten Ableitungen im Ursprung.</b></p>\[\left.\frac{\partial^2f}{\partial y\,\partial x}\right|_{(0,0)}=\frac{\partial}{\partial y}\left(\frac{\partial f}{\partial x}\right)(0,0)=\lim_{h\to0}\frac{\frac{\partial f}{\partial x}(0,h)-\frac{\partial f}{\partial x}(0,0)}{h}=\lim_{h\to0}\frac{-h-0}{h}=-1,\]\[\left.\frac{\partial^2f}{\partial x\,\partial y}\right|_{(0,0)}=\frac{\partial}{\partial x}\left(\frac{\partial f}{\partial y}\right)(0,0)=\lim_{h\to0}\frac{\frac{\partial f}{\partial y}(h,0)-\frac{\partial f}{\partial y}(0,0)}{h}=\lim_{h\to0}\frac{h-0}{h}=+1.\]<p><b>Ergebnis:</b> \(-1\ne+1\), die gemischten zweiten partiellen Ableitungen im Ursprung stimmen <b>nicht</b> überein. Beide existieren also, sind aber verschieden. Die reinen zweiten Ableitungen sind dort harmlos: wegen \(f(x,0)=0\) ist \(\frac{\partial f}{\partial x}(x,0)=0\) und damit \(\frac{\partial^2f}{\partial x^2}(0,0)=0\), analog \(\frac{\partial^2f}{\partial y^2}(0,0)=0\). Mit \(x_1=x\), \(x_2=y\) und dem Eintrag \(\partial^2f/(\partial x_k\,\partial x_j)\) in Zeile \(k\), Spalte \(j\) lautet die Matrix der zweiten partiellen Ableitungen im Ursprung also</p>\[\begin{pmatrix}0&1\\-1&0\end{pmatrix}\]<p>— sie existiert sehr wohl, ist aber <b>nicht symmetrisch</b>; die Symmetrie, die der Satz von Schwarz liefern würde, scheitert hier tatsächlich, und eine Hesse-Matrix im Sinne einer <i>symmetrischen</i> Bilinearform gibt es in \(\mathbf{0}_2\) nicht.</p><p><b>Wo genau die Voraussetzung scheitert:</b> Außerhalb des Ursprungs ist \(f\) als rationale Funktion mit nirgends verschwindendem Nenner beliebig oft differenzierbar, alle zweiten partiellen Ableitungen existieren also auf ganz \(\mathbb{R}^2\). Wären sie im Ursprung stetig, so lieferte der Satz von Schwarz die Gleichheit — also sind sie dort <b>nicht stetig</b>. Genau die Stetigkeitsvoraussetzung ist verletzt, nicht die Existenz.</p>`,
        plus: String.raw`<p><b>Lesart der Indizes.</b> \(\dfrac{\partial^2f}{\partial x_k\,\partial x_j}\) bedeutet \(\dfrac{\partial}{\partial x_k}\left(\dfrac{\partial f}{\partial x_j}\right)\): von rechts nach links abarbeiten, zuerst nach \(x_j\). In der Hesse-Matrix steht dieser Eintrag in Zeile \(k\) und Spalte \(j\), passend zu \(f''(x_0)[e_k,e_j]\). Solange Schwarz anwendbar ist, spielt die Konvention keine Rolle — in Gegenbeispielen wie oben sehr wohl.</p><p><b>Gut zu wissen.</b> Die Hesse-Matrix ist bis auf Transposition die Jacobi-Matrix des Gradienten: \(\mathcal{J}_{x_0}\big(\operatorname{grad}f\big)\) hat in Zeile \(k\), Spalte \(j\) den Eintrag \(\left.\frac{\partial}{\partial x_j}\left(\frac{\partial f}{\partial x_k}\right)\right|_{x=x_0}=\left.\frac{\partial^2f}{\partial x_j\,\partial x_k}\right|_{x=x_0}\), stimmt nach dem Satz von Schwarz also mit \(H_{x_0}(f)\) überein. Weil \(H_{x_0}(f)\) symmetrisch ist, hat sie nur reelle Eigenwerte und ist orthogonal diagonalisierbar — das ist die Grundlage der Definitheitskriterien für lokale Extrema im Mehrdimensionalen und der mehrdimensionalen Taylorformel.</p><p><b>Einordnung.</b> Der Satz von Schwarz ist ein Vertauschungssatz für zwei Grenzprozesse und gehört damit in dieselbe Familie wie die Sätze über Grenzwert und Integral bzw. Grenzwert und Ableitung, siehe Spickzettel <a href="#/ref/vertauschen">Vertauschen von Grenzprozessen</a>; eine Übersicht der Voraussetzungen findet sich unter <a href="#/ref/saetze">Sätze</a>. Der eindimensionale Ausgangspunkt steht auf <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}}]},
    {id:"7.8", t:"Die Formel von Taylor", topics:[
       {id:"7.8.1", title:"Satz von Taylor mit Integralrestglied", body:{
        def: String.raw`<p><b>Voraussetzungen.</b> \((E,\|\cdot\|_E)\) und \((F,\|\cdot\|_F)\) seien normierte und <b>vollständige</b> Räume, \(\mathcal{U}\subset E\) offen, \(x_0\in\mathcal{U}\) und \(h\in E\) mit</p>
\[x_0+h\in\mathcal{U},\qquad \overline{x_0\,(x_0+h)}\subset\mathcal{U}.\]
<p>Ferner sei \(f:\mathcal{U}\to F\) \((n+1)\)-fach Fréchet-differenzierbar in \(\mathcal{U}\), d.h.</p>
\[f'(x)\in\mathcal{L}(E,F)=\mathcal{L}^{(1)}(E,F),\quad\dots,\quad f^{(n)}(x)\in\mathcal{L}(\underbrace{E,\dots,E}_{n\text{-fach}},F)=:\mathcal{L}^{(n)}(E,F),\]
<p>und alle diese Ableitungen seien stetig:</p>
\[f^{(k)}(\cdot):\ \mathcal{U}\ \xrightarrow{\ \text{stetig}\ }\ \mathcal{L}^{(k)}(E,F),\qquad k=0,\dots,n+1.\]
<p><b>Schreibweise.</b> \(f^{(k)}(x)\) ist \(k\)-linear, wird also auf \(k\) Vektoren angewandt: \(f^{(k)}(x)\big[h^{(1)},\dots,h^{(k)}\big]\) mit \(h^{(1)},\dots,h^{(k)}\in E\). Im Fall \(h=h^{(1)}=\dots=h^{(k)}\in E\) sei</p>
\[f^{(k)}(x)h^k:=f^{(k)}(x)\big[h,\dots,h\big]\ \in F.\]
<p><b>Satz von Taylor.</b> Unter diesen Voraussetzungen gilt</p>
\[f(x_0+h)=f(x_0)+\sum_{k=1}^{n}\frac{f^{(k)}(x_0)}{k!}\,h^k+r_n(x_0;h)\]
<p>mit dem <b>Integralrestglied</b></p>
\[r_n(x_0;h)=\frac{1}{n!}\int_0^1 f^{(n+1)}(x_0+th)\,h^{n+1}\,(1-t)^n\,dt\ =\ \mathcal{O}\!\left(\|h\|_E^{\,n+1}\right).\]
<p>Das Integral ist ein Riemann-Integral für Funktionen mit Werten in \(F\).</p>`,
        worte: String.raw`<p>Die Formel ist Wort für Wort die Taylorformel einer Veränderlichen — nur dass die \(k\)-te Ableitung keine Zahl mehr ist, sondern eine stetige \(k\)-lineare Abbildung. Deshalb ist \(f^{(k)}(x_0)h^k\) auch <b>keine Potenz</b>: es bedeutet, dieselbe Richtung \(h\) \(k\)-mal in die \(k\)-lineare Abbildung \(f^{(k)}(x_0)\) einzusetzen. Heraus kommt ein Element von \(F\), also dasselbe, was auch links steht — die Gleichung ist typmäßig sauber.</p>
<p>Der eigentliche Gewinn steckt im Restglied: es wird nicht bloß abgeschätzt, sondern <b>exakt</b> als Integral angegeben. Dafür braucht man ein Integral über eine Funktion mit Werten in \(F\), und genau hier geht die Vollständigkeit von \(F\) ein: Die Riemann-Summen des Integranden bilden eine Cauchy-Folge in \(F\), und die muss einen Grenzwert <i>in</i> \(F\) besitzen, damit das Integral überhaupt existiert. Ohne Vollständigkeit stünde auf der rechten Seite ein Symbol ohne Wert.</p>
<p>Die Voraussetzung, dass die ganze Verbindungsstrecke \(\overline{x_0\,(x_0+h)}\) in \(\mathcal{U}\) liegt, ist keine Schikane: der Beweis läuft komplett entlang dieser Strecke. Dass \(\mathcal{U}\) offen ist, genügt nicht — \(\mathcal{U}\) muss ja nicht konvex sein, und dann kann die Strecke aus dem Definitionsbereich herauslaufen.</p>
<p><b>Beweisidee.</b> Auf der Tafel stehen die Schritte 1 und 2; die Schritte 3 und 4 führen den Schluss aus:</p>
<ul>
<li><b>Schritt 1 — auf eine Veränderliche zurückführen.</b> Setze \(\varphi_h(t)=f(x_0+th)\), also \(\varphi_h:\left]-\varepsilon,\varepsilon\right[\to F\), eine Funktion von \(t\). Die Kettenregel liefert \(\varphi_h^{(k)}(t)=f^{(k)}(x_0+th)h^k\); die ganze Multilinearität steckt danach nur noch in den Koeffizienten.</li>
<li><b>Schritt 2 — skalar machen.</b> Für ein stetiges lineares Funktional \(\ell\in\mathcal{L}(F,\mathbb{K})\) ist \(\ell\,\varphi_h(t)=\ell\,f(x_0+t\cdot h)\) eine gewöhnliche \(\mathbb{K}\)-wertige Funktion einer Veränderlichen. Für sie gilt die klassische Taylorformel mit Integralrestglied.</li>
<li><b>Schritt 3 — \(\ell\) wieder hineinziehen.</b> Weil \(\ell\) linear und stetig ist, vertauscht es mit der endlichen Summe <i>und</i> mit dem Integral. Die skalare Formel lautet damit \(\ell\big(\text{linke Seite}\big)=\ell\big(\text{rechte Seite}\big)\) mit genau den behaupteten Ausdrücken.</li>
<li><b>Schritt 4 — zurück nach \(F\).</b> Die stetigen linearen Funktionale trennen die Punkte von \(F\) (Satz von Hahn-Banach). Stimmen also die \(\ell\)-Werte für <i>alle</i> \(\ell\) überein, so sind die beiden Elemente von \(F\) gleich.</li>
</ul>
<p>Auch die Abschätzung \(r_n=\mathcal{O}(\|h\|_E^{n+1})\) liest man direkt aus dem Integral ab: \(t\mapsto f^{(n+1)}(x_0+th)\) ist stetig auf der kompakten Strecke, also gilt \(\|f^{(n+1)}(x_0+th)\|_{\mathcal{L}^{(n+1)}(E,F)}\le M\) für ein \(M\ge 0\). Mit \(\|f^{(n+1)}(y)h^{n+1}\|_F\le M\|h\|_E^{\,n+1}\) und \(\frac{1}{n!}\int_0^1(1-t)^n\,dt=\frac{1}{(n+1)!}\) folgt</p>
\[\|r_n(x_0;h)\|_F\le\frac{M}{(n+1)!}\,\|h\|_E^{\,n+1}.\]`,
        beispiel: String.raw`<p><b>Ein Beispiel, das den abstrakten Rahmen wirklich braucht.</b> Sei \(E=C([0,1])\) mit \(\|\cdot\|_C\) (vollständig, siehe <a href="#/6.2.2">6.2.2</a>), \(F=\mathbb{R}\), \(\mathcal{U}=E\) und</p>
\[f(u)=\int_0^1 u(s)^3\,ds.\]
<p><b>Schritt 1 (Ableitungen ablesen).</b> Für \(u,h\in E\) liefert Ausmultiplizieren</p>
\[f(u+h)=f(u)+3\int_0^1u^2h\,ds+3\int_0^1uh^2\,ds+\int_0^1h^3\,ds.\]
<p>Der in \(h\) lineare Anteil ist \(f'(u)[h]=3\int_0^1u(s)^2h(s)\,ds\); wegen \(|f'(u)[h]|\le 3\|u\|_C^2\|h\|_C\) ist \(f'(u)\in\mathcal{L}(E,\mathbb{R})\). Ableiten von \(u\mapsto f'(u)\) (also \(f'(u+k)[h]-f'(u)[h]=6\int_0^1ukh\,ds+3\int_0^1k^2h\,ds\)) gibt</p>
\[f''(u)\big[h^{(1)},h^{(2)}\big]=6\int_0^1 u\,h^{(1)}h^{(2)}\,ds,\qquad f'''(u)\big[h^{(1)},h^{(2)},h^{(3)}\big]=6\int_0^1 h^{(1)}h^{(2)}h^{(3)}\,ds,\]
<p>und \(f^{(4)}\equiv 0\). In der Kurzschreibweise: \(f''(u)h^2=6\int_0^1u\,h^2\,ds\) und \(f'''(u)h^3=6\int_0^1h^3\,ds\) (letzteres hängt gar nicht von \(u\) ab, ist also insbesondere stetig in \(u\)).</p>
<p><b>Schritt 2 (Satz anwenden mit \(n=2\)).</b></p>
\[f(u+h)=f(u)+f'(u)h+\tfrac{1}{2}f''(u)h^2+r_2(u;h),\qquad r_2(u;h)=\frac{1}{2!}\int_0^1f'''(u+th)h^3(1-t)^2\,dt.\]
<p><b>Schritt 3 (Restglied ausrechnen).</b> Der Integrand ist hier von \(t\) unabhängig, bis auf das Gewicht:</p>
\[r_2(u;h)=\frac{6}{2}\left(\int_0^1h(s)^3ds\right)\underbrace{\int_0^1(1-t)^2dt}_{=1/3}=\int_0^1h(s)^3\,ds.\]
<p><b>Schritt 4 (Probe).</b> Mit \(f'(u)h=3\int_0^1u^2h\,ds\) und \(\tfrac12f''(u)h^2=3\int_0^1uh^2\,ds\) ist die rechte Seite der Taylorformel genau die Zerlegung aus Schritt 1 — die Formel ist hier sogar exakt. Und die Abschätzung stimmt: \(|r_2(u;h)|\le\int_0^1|h|^3ds\le\|h\|_C^3\), also \(r_2=\mathcal{O}(\|h\|_C^3)\).</p>
<p><b>Randfall \(n=0\).</b> Für \(n=0\) verschwindet die Summe und der Satz liefert die Integraldarstellung des Zuwachses</p>
\[f(x_0+h)-f(x_0)=\int_0^1f'(x_0+th)\,h\,dt,\]
<p>aus der man sofort \(\|f(x_0+h)-f(x_0)\|_F\le\big(\sup_{t\in[0,1]}\|f'(x_0+th)\|_{\mathcal{L}(E,F)}\big)\|h\|_E\) abliest — den Schrankensatz.</p>`,
        plus: String.raw`<p><b>Roter Faden.</b> Es wechseln nur die Objekte, nicht die Struktur: aus der Zahl \(f^{(k)}(x_0)\) wird ein Element von \(\mathcal{L}^{(k)}(E,F)\), aus \(h^k\) wird die \(k\)-fache Auswertung an derselben Richtung. Wer die eindimensionale Formel kann, kann diese auch — siehe <a href="#/ref/entwickeln">Entwickeln</a> und <a href="#/ref/saetze">Sätze</a>.</p>
<p><b>Klausurfallen.</b></p>
<ul>
<li>Die Summe startet bei \(k=1\); der Term \(k=0\) ist der Funktionswert \(f(x_0)\).</li>
<li>Im Polynom stehen Ableitungen bis zur Ordnung \(n\), im Restglied die Ordnung \(n+1\) — deshalb wird \((n+1)\)-fache Differenzierbarkeit vorausgesetzt.</li>
<li>Der Faktor \(\frac{1}{n!}\) im Integral gehört zum Gewicht \((1-t)^n\); erst zusammen mit \(\int_0^1(1-t)^ndt=\frac{1}{n+1}\) entsteht \(\frac{1}{(n+1)!}\). Wer beide Faktoren durcheinanderbringt, bekommt eine falsche Konstante in der Fehlerschranke.</li>
<li>Immer prüfen, dass die Verbindungsstrecke in \(\mathcal{U}\) liegt — \(\mathcal{U}\) offen allein reicht nicht.</li>
</ul>
<p><b>Wo die Vollständigkeit sitzt.</b> \(F\) vollständig wird für die Existenz des \(F\)-wertigen Riemann-Integrals gebraucht, \(E\) vollständig gehört zum üblichen Rahmen der Fréchet-Theorie (\(\mathcal{L}^{(k)}(E,F)\) mit Operatornorm ist dann selbst wieder vollständig, sobald \(F\) es ist).</p>
<p><b>Tafel-Details.</b> An der Tafel steht für die Strecke \(\overline{x_0\,(x_0+h)}\in\mathcal{U}\) und bei \(\mathcal{L}(E,\dots,E,F)\in\mathcal{L}^{(n)}(E,F)\) jeweils ein Elementzeichen; gemeint sind natürlich \(\subset\) bzw. die Definition \(=:\).</p>
<p><b>Ausblick.</b> Die Lagrange-Form des Restglieds (Zwischenstelle \(\Theta\) statt Integral) steht in <a href="#/7.8.2">7.8.2</a>; sie benötigt reellwertige \(f\), weil man dafür den Mittelwertsatz der Integralrechnung braucht.</p>`}},
       {id:"7.8.2", title:"Spezialfall ℝᵐ: die Nabla-Schreibweise ⟨h,∇⟩ᵏ", body:{
        def: String.raw`<p>Es sei nun \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}\) mit \(x=(x_1,\dots,x_m)^{T}\), \(h=(h_1,\dots,h_m)^{T}\) und Entwicklungspunkt \(x^{(0)}\). Die Taylorformel lautet unverändert</p>
\[f(x^{(0)}+h)=f(x^{(0)})+\sum_{k=1}^{n}\frac{1}{k!}f^{(k)}(x^{(0)})h^k+r_n(x^{(0)};h).\]
<p><b>Was ist \(f^{(k)}(x^{(0)})h^k\)?</b></p>
<p><b>Fall \(k=1\):</b></p>
\[f'(x^{(0)})h=\sum_{j=1}^{m}\frac{\partial f}{\partial x_j}\bigg|_{x=x^{(0)}}h_j=\big\langle\nabla f\big|_{x=x^{(0)}},\,h\big\rangle=\langle h,\nabla\rangle f\big|_{x=x^{(0)}}=\left(\sum_{j=1}^{m}h_j\frac{\partial}{\partial x_j}\right)f\;\bigg|_{x=x^{(0)}}.\]
<p><b>Fall \(k=2\):</b> \(f''(x^{(0)})h^2=\big\langle h,\,H_{x^{(0)}}(f)\,h\big\rangle\) mit der Hesse-Matrix</p>
\[H_{x^{(0)}}(f)=\begin{pmatrix}\dfrac{\partial^2f}{\partial x_1^2}&\cdots&\dfrac{\partial^2f}{\partial x_1\partial x_m}\\ \vdots&&\vdots\\ \dfrac{\partial^2f}{\partial x_m\partial x_1}&\cdots&\dfrac{\partial^2f}{\partial x_m^2}\end{pmatrix}\Bigg|_{x=x^{(0)}}.\]
<p>Nach dem Satz von Schwarz ist \(H_x(f)\) bei stetigen zweiten partiellen Ableitungen <b>symmetrisch</b>. Ausgeschrieben:</p>
\[f''(x^{(0)})h^2=\sum_{j,\ell=1}^{m}\frac{\partial^2f}{\partial x_j\partial x_\ell}\bigg|_{x=x^{(0)}}h_jh_\ell=\left(\sum_{j=1}^{m}h_j\frac{\partial}{\partial x_j}\;\sum_{\ell=1}^{m}h_\ell\frac{\partial}{\partial x_\ell}\right)f\;\bigg|_{x=x^{(0)}}=\langle h,\nabla\rangle^2f\big|_{x=x^{(0)}}.\]
<p><b>Allgemeines \(k\in\mathbb{N}\):</b></p>
\[f^{(k)}(x^{(0)})h^k=\sum_{j_1,\dots,j_k=1}^{m}\frac{\partial^kf}{\partial x_{j_1}\cdots\partial x_{j_k}}\bigg|_{x=x^{(0)}}h_{j_1}\cdots h_{j_k}=\underbrace{\langle h,\nabla\rangle\cdots\langle h,\nabla\rangle}_{k\text{-fach}}f\;\bigg|_{x=x^{(0)}}=\langle h,\nabla\rangle^kf\big|_{x=x^{(0)}}.\]
<p>Somit gilt für \((n+1)\)-fach stetig differenzierbares \(f\) (insbesondere existieren alle partiellen Ableitungen der Ordnung \(1,\dots,n+1\) in \(\mathcal{U}\) und sind stetig)</p>
\[f(x^{(0)}+h)=f(x^{(0)})+\sum_{k=1}^{n}\frac{\langle h,\nabla\rangle^k}{k!}f\;\bigg|_{x=x^{(0)}}+r_n(x^{(0)};h),\]
\[r_n(x^{(0)};h)=\frac{1}{n!}\int_0^1\underbrace{f^{(n+1)}(x^{(0)}+th)h^{n+1}}_{=\;\langle h,\nabla\rangle^{n+1}f\,|_{x=x^{(0)}+th}}(1-t)^n\,dt=\frac{1}{(n+1)!}\,\langle h,\nabla\rangle^{n+1}f\big|_{x=x^{(0)}+\Theta h}\]
<p>für ein gewisses \(\Theta\in[0,1]\) (Lagrange-Form).</p>
<p><b>Taylorreihe.</b> Ist \(f\) in \(x^{(0)}\) als Taylorreihe darstellbar, d.h. ist \(f\) beliebig oft Fréchet-differenzierbar, konvergiert \(\sum_{k=1}^{\infty}\frac{f^{(k)}(x^{(0)})h^k}{k!}\) und gilt \(r_n(x^{(0)};h)\xrightarrow{\ n\to\infty\ }0\) bei festen \(x^{(0)},h\), so ist</p>
\[f(x^{(0)}+h)=f(x^{(0)})+\sum_{k=1}^{\infty}\frac{\langle h,\nabla\rangle^k}{k!}f\;\bigg|_{x=x^{(0)}}=\left(\mathbf{1}+\sum_{k=1}^{\infty}\frac{\langle h,\nabla\rangle^k}{k!}\right)f\;\bigg|_{x=x^{(0)}}=e^{\langle h,\nabla\rangle}f\big|_{x=x^{(0)}}.\]`,
        worte: String.raw`<p>Der Schlüssel ist, \(\langle h,\nabla\rangle=\sum_{j=1}^m h_j\frac{\partial}{\partial x_j}\) als <b>Operator</b> zu lesen: er frisst eine Funktion und gibt eine Funktion zurück, nämlich die Ableitung in Richtung \(h\). Erst ganz am Schluss wird an der Stelle \(x^{(0)}\) ausgewertet — dafür stehen die senkrechten Striche \(\big|_{x=x^{(0)}}\) immer ganz rechts.</p>
<p><b>Warum die \(k\)-te Ableitung gerade die \(k\)-fache Anwendung dieses Operators ist:</b> Entlang der Geraden \(t\mapsto x^{(0)}+th\) betrachtet man wieder \(\varphi_h(t)=f(x^{(0)}+th)\). Die Kettenregel gibt \(\varphi_h'(t)=\sum_j\frac{\partial f}{\partial x_j}\big|_{x=x^{(0)}+th}h_j=\langle h,\nabla\rangle f\big|_{x=x^{(0)}+th}\). Da die \(h_j\) Konstanten sind, wiederholt sich beim nächsten Ableiten nach \(t\) exakt derselbe Vorgang, also \(\varphi_h^{(k)}(t)=\langle h,\nabla\rangle^kf\big|_{x=x^{(0)}+th}\). Die Taylorformel im \(\mathbb{R}^m\) ist damit nichts anderes als die eindimensionale Taylorformel für \(\varphi_h\) an der Stelle \(t=0\), ausgewertet bei \(t=1\).</p>
<p>Für \(k=1\) ist das der Gradient (Skalarprodukt mit \(h\)), für \(k=2\) die von der Hesse-Matrix erzeugte quadratische Form \(\langle h,H_{x^{(0)}}(f)h\rangle\); diese Darstellung als Doppelsumme gilt ohne jede Zusatzannahme. Der Satz von Schwarz kommt erst ins Spiel, wenn man gleiche Terme zusammenfassen will: nur weil die Reihenfolge der partiellen Ableitungen egal ist, liefern \(\frac{\partial^2f}{\partial x_j\partial x_\ell}\) und \(\frac{\partial^2f}{\partial x_\ell\partial x_j}\) denselben Beitrag (daher der Faktor \(2\) beim gemischten Glied), und man darf mit Multiindizes statt mit \(k\)-fachen Summen rechnen.</p>
<p>Die Lagrange-Form entsteht aus der Integralform mit dem Mittelwertsatz der Integralrechnung: das Gewicht \((1-t)^n\) ist auf \([0,1]\) nicht negativ und der Integrand \(t\mapsto\langle h,\nabla\rangle^{n+1}f\big|_{x=x^{(0)}+th}\) ist stetig und <b>reellwertig</b>, also wird er an einer Zwischenstelle \(\Theta\) angenommen. Genau hier geht ein, dass \(f\) nach \(\mathbb{R}\) abbildet — für vektorwertige \(f\) bleibt nur die Integralform.</p>
<p>Die Schreibweise \(e^{\langle h,\nabla\rangle}\) ist die kompakteste Form der Aussage: <i>Taylorreihe bedeutet Verschieben um \(h\).</i> Der Operator \(e^{\langle h,\nabla\rangle}\) ist ein Verschiebungsoperator, \(\mathbf{1}\) ist der Identitätsoperator (an der Tafel eine doppelt gestrichene Eins). Das ist eine formale, aber sehr merkfähige Schreibweise — sie gilt nur unter den drei angegebenen Bedingungen, denn eine konvergente Taylorreihe muss nicht gegen die Funktion konvergieren, solange man nicht \(r_n\to 0\) nachgewiesen hat.</p>`,
        beispiel: String.raw`<p><b>(a) Taylorentwicklung 2. Ordnung.</b> Sei \(f(x_1,x_2)=e^{x_1}\cos x_2\) und \(x^{(0)}=(0,0)^{T}\), also \(f(x^{(0)})=1\).</p>
<p><b>Schritt 1 (Term \(k=1\)).</b> \(\dfrac{\partial f}{\partial x_1}=e^{x_1}\cos x_2\), \(\dfrac{\partial f}{\partial x_2}=-e^{x_1}\sin x_2\), also \(\nabla f\big|_{x=x^{(0)}}=(1,0)^{T}\) und</p>
\[\langle h,\nabla\rangle f\big|_{x=x^{(0)}}=1\cdot h_1+0\cdot h_2=h_1.\]
<p><b>Schritt 2 (Term \(k=2\)).</b> \(\dfrac{\partial^2f}{\partial x_1^2}=e^{x_1}\cos x_2\to 1\), \(\dfrac{\partial^2f}{\partial x_1\partial x_2}=-e^{x_1}\sin x_2\to 0\), \(\dfrac{\partial^2f}{\partial x_2^2}=-e^{x_1}\cos x_2\to-1\), also</p>
\[H_{x^{(0)}}(f)=\begin{pmatrix}1&0\\0&-1\end{pmatrix},\qquad \langle h,\nabla\rangle^2f\big|_{x=x^{(0)}}=\big\langle h,H_{x^{(0)}}(f)h\big\rangle=h_1^2-h_2^2.\]
<p><b>Schritt 3 (Formel mit \(n=2\)).</b></p>
\[e^{h_1}\cos h_2=1+h_1+\tfrac{1}{2}\left(h_1^2-h_2^2\right)+r_2(x^{(0)};h),\qquad r_2=\mathcal{O}(\|h\|^3).\]
<p><b>Schritt 4 (Probe über bekannte Reihen).</b> \(\left(1+h_1+\tfrac{h_1^2}{2}+\dots\right)\left(1-\tfrac{h_2^2}{2}+\dots\right)=1+h_1+\tfrac{h_1^2}{2}-\tfrac{h_2^2}{2}+\dots\) — dieselben Terme bis zur Ordnung 2.</p>
<p><b>Schritt 5 (Zahlenprobe).</b> Für \(h=(0{,}1;\,0{,}2)^{T}\) ist \(f(x^{(0)}+h)=e^{0{,}1}\cos 0{,}2=1{,}08314\dots\), das Taylorpolynom liefert \(1+0{,}1+\tfrac12(0{,}01-0{,}04)=1{,}085\). Der tatsächliche Rest ist \(r_2=-1{,}86\cdot10^{-3}\). Der nächste Reihenterm \(\frac{1}{3!}\langle h,\nabla\rangle^3f\big|_{x=x^{(0)}}=\frac{1}{6}\left(h_1^3-3h_1h_2^2\right)=\frac{1}{6}(0{,}001-0{,}012)=-1{,}83\cdot10^{-3}\) trifft ihn fast exakt — genau das besagt \(r_2=\mathcal{O}(\|h\|^3)\).</p>
<p><b>(b) Die Exponentialformel an einem Fall, in dem man alles ausrechnen kann.</b> Sei \(f(x_1,x_2)=e^{x_1+x_2}\). Wegen \(\frac{\partial f}{\partial x_1}=\frac{\partial f}{\partial x_2}=f\) gilt</p>
\[\langle h,\nabla\rangle f=(h_1+h_2)f,\qquad\text{also}\qquad \langle h,\nabla\rangle^kf=(h_1+h_2)^kf\quad (k\in\mathbb{N}).\]
<p>Damit ist</p>
\[e^{\langle h,\nabla\rangle}f\big|_{x=x^{(0)}}=\sum_{k=0}^{\infty}\frac{(h_1+h_2)^k}{k!}\,e^{x^{(0)}_1+x^{(0)}_2}=e^{h_1+h_2}\,e^{x^{(0)}_1+x^{(0)}_2}=e^{(x^{(0)}_1+h_1)+(x^{(0)}_2+h_2)}=f(x^{(0)}+h).\]
<p>Die Reihe konvergiert für jedes \(h\), und das Restglied \(r_n=\frac{(h_1+h_2)^{n+1}}{(n+1)!}e^{x^{(0)}_1+x^{(0)}_2+\Theta(h_1+h_2)}\) geht für \(n\to\infty\) gegen \(0\) — die drei Bedingungen für die Taylorreihendarstellung sind also erfüllt, und \(e^{\langle h,\nabla\rangle}\) verschiebt tatsächlich um \(h\).</p>`,
        plus: String.raw`<p><b>Notationshinweis.</b> An der Tafel steht in §7.8 durchgehend \(x_0\); im \(\mathbb{R}^m\)-Teil schreiben wir wie ab §7.6 einheitlich \(x^{(0)}=(x^{(0)}_1,\dots,x^{(0)}_m)^{T}\). Gemeint ist dasselbe. Das \(\mathbf{1}\) in der Exponentialformel ist die doppelt gestrichene Eins der Tafel, also der Identitätsoperator.</p>
<p><b>Ausgeschrieben für \(m=2\), \(n=2\)</b> (die Form, die in Klausuren gebraucht wird):</p>
\[f(x^{(0)}+h)=f+\frac{\partial f}{\partial x_1}h_1+\frac{\partial f}{\partial x_2}h_2+\frac{1}{2}\left(\frac{\partial^2f}{\partial x_1^2}h_1^2+2\frac{\partial^2f}{\partial x_1\partial x_2}h_1h_2+\frac{\partial^2f}{\partial x_2^2}h_2^2\right)\Bigg|_{x=x^{(0)}}+\mathcal{O}\!\left(\|h\|^3\right).\]
<p>Der Faktor \(2\) beim gemischten Term ist kein Zufall: in der Doppelsumme tritt \(h_1h_2\) zweimal auf, und nach Schwarz sind beide Koeffizienten gleich.</p>
<p><b>Rechentrick zu Beispiel (a).</b> Mit \(f=\operatorname{Re}\left(e^{x_1+ix_2}\right)\) und \(\langle h,\nabla\rangle e^{x_1+ix_2}=(h_1+ih_2)e^{x_1+ix_2}\) folgt sofort \(\langle h,\nabla\rangle^kf\big|_{x=(0,0)^{T}}=\operatorname{Re}\left((h_1+ih_2)^k\right)\); für \(k=1,2,3\) also \(h_1\), \(h_1^2-h_2^2\), \(h_1^3-3h_1h_2^2\). So spart man sich das Aufstellen aller höheren partiellen Ableitungen.</p>
<p><b>Klausurfallen.</b></p>
<ul>
<li>Erst ableiten, dann auswerten: \(\langle h,\nabla\rangle^kf\big|_{x=x^{(0)}}\) heißt, den Operator \(k\)-mal auf die <i>Funktion</i> anzuwenden und das Ergebnis in \(x^{(0)}\) auszuwerten — nicht die Ableitungen einzeln auszuwerten und dann weiterzudifferenzieren.</li>
<li>\(\langle h,\nabla\rangle^k\) ist die \(k\)-te Potenz des Operators, nicht \(\langle h,\nabla^k\rangle\) und auch nicht \(\|h\|^k\Delta^{k/2}\) oder Ähnliches.</li>
<li>Der Faktor \(\frac{1}{k!}\) gehört zu jedem Summanden; die \(h_j\) sind Konstanten und dürfen am Operator vorbeigezogen werden.</li>
</ul>
<p><b>Roter Faden.</b> Für \(n=1\) liefert der \(k=1\)-Term die Tangentialebene (<a href="#/7.8.3">7.8.3</a>). In §7.9 wird der \(k=1\)-Term in einem kritischen Punkt null, und dann entscheidet gerade \(\langle h,H_{x^{*}}(f)h\rangle\) über lokales Minimum oder Maximum. Zum Vergleich mit dem eindimensionalen Fall siehe <a href="#/ref/entwickeln">Entwickeln</a> und <a href="#/ref/potenzreihen">Potenzreihen</a>.</p>`}},
       {id:"7.8.3", title:"Tangentialebene", body:{
        def: String.raw`<p>Sei \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}\) in \(x^{(0)}\in\mathcal{U}\) (total, d.h. Fréchet-) differenzierbar. Bricht man die Taylorformel nach dem Term \(k=1\) ab, erhält man die <b>Gleichung für die Tangentialebene (T.E.) in \(x=x^{(0)}\)</b>: mit \(x=x^{(0)}+h\), also \(h_j=x_j-x^{(0)}_j\),</p>
\[\tilde f\big(\underbrace{x^{(0)}+h}_{=\,x}\big)=f(x^{(0)})+\sum_{j=1}^{m}\frac{\partial f}{\partial x_j}\bigg|_{x=x^{(0)}}\cdot\underbrace{h_j}_{=\,(x-x^{(0)})_j},\]
<p>gleichbedeutend</p>
\[\tilde f(x)=f(x^{(0)})+\big\langle\nabla f\big|_{x=x^{(0)}},\;x-x^{(0)}\big\rangle=f(x^{(0)})+\langle h,\nabla\rangle f\big|_{x=x^{(0)}}.\]
<p>Als Punktmenge im \(\mathbb{R}^{m+1}\) ist die Tangentialebene der Graph von \(\tilde f\),</p>
\[\Big\{(x_1,\dots,x_m,x_{m+1})^{T}\in\mathbb{R}^{m+1}\;:\;x_{m+1}=\tilde f(x_1,\dots,x_m)\Big\},\]
<p>für \(m=2\) also eine Ebene, für allgemeines \(m\) eine Hyperebene. <b>Approximationsgüte:</b> ist \(f\) zweimal stetig differenzierbar, so liefert die Taylorformel mit \(n=1\)</p>
\[f(x)-\tilde f(x)=r_1(x^{(0)};h)=\frac{1}{2}\,\langle h,\nabla\rangle^2f\big|_{x=x^{(0)}+\Theta h}=\mathcal{O}\!\left(\|h\|^2\right),\qquad \Theta\in[0,1];\]
<p>ist \(f\) nur differenzierbar, so gilt immerhin \(f(x)-\tilde f(x)=o(\|h\|)\) — das ist genau die definierende Eigenschaft der Fréchet-Ableitung.</p>`,
        worte: String.raw`<p>Die Tangentialebene ist die <b>beste affine Näherung</b> von \(f\) in der Nähe von \(x^{(0)}\), und sie ist nichts anderes als die geometrische Gestalt der Ableitung: \(f(x)\approx f(x^{(0)})+f'(x^{(0)})h\). Die Ableitung liefert den linearen Teil, der Funktionswert den Höhenversatz. Für \(m=1\) ist das die gewöhnliche Tangente, für \(m=2\) die anschauliche Ebene, die sich an die Fläche \(x_3=f(x_1,x_2)\) anlegt.</p>
<p>Wichtig ist der Unterschied zwischen Funktion und Zahl: die Koeffizienten \(\frac{\partial f}{\partial x_j}\big|_{x=x^{(0)}}\) sind <b>Zahlen</b> (im Punkt ausgewertet), die Variablen sind die \(h_j=x_j-x^{(0)}_j\). Deshalb ist \(\tilde f\) affin — die Gleichung enthält kein \(x\) mehr in den Ableitungen.</p>
<p>Warum die Ebene den Graphen wirklich berührt und nicht nur schneidet, steht in der Fehlerformel: der Fehler ist quadratisch klein. Anschaulich heißt \(\mathcal{O}(\|h\|^2)\), dass man beim Halbieren des Abstands zu \(x^{(0)}\) ein Viertel des Fehlers behält — die Ebene schmiegt sich an. Genau in diesem Sinn ist die Tangentialebene eindeutig: unter allen affinen Funktionen ist sie die einzige, deren Fehler schneller als \(\|h\|\) verschwindet.</p>
<p>Man beachte, dass die Formel schon hinschreibbar ist, sobald bloß die \(m\) partiellen Ableitungen existieren. Ohne totale Differenzierbarkeit ist die entstehende Ebene aber keine Tangentialebene, weil der Fehler dann nicht \(o(\|h\|)\) sein muss (Beispiel im Feld „Gut zu wissen“). Die Formel ist also nur so gut wie die Voraussetzung, unter der sie hergeleitet wurde.</p>`,
        beispiel: String.raw`<p><b>(a) Ein Fall, in dem der Fehler exakt nachgerechnet werden kann.</b> \(f(x_1,x_2)=x_1^2+x_2^2\), \(x^{(0)}=(1,2)^{T}\).</p>
<p><b>Schritt 1 (Funktionswert).</b> \(f(x^{(0)})=1+4=5\).</p>
<p><b>Schritt 2 (Gradient im Punkt).</b> \(\frac{\partial f}{\partial x_1}=2x_1\), \(\frac{\partial f}{\partial x_2}=2x_2\), also \(\nabla f\big|_{x=x^{(0)}}=(2,4)^{T}\).</p>
<p><b>Schritt 3 (Gleichung aufstellen).</b></p>
\[\tilde f(x)=5+2\,(x_1-1)+4\,(x_2-2)=2x_1+4x_2-5,\]
<p>die Tangentialebene ist also \(\{x_3=2x_1+4x_2-5\}\subset\mathbb{R}^3\).</p>
<p><b>Schritt 4 (Fehler exakt bestimmen).</b></p>
\[f(x)-\tilde f(x)=x_1^2+x_2^2-2x_1-4x_2+5=(x_1-1)^2+(x_2-2)^2=h_1^2+h_2^2=\|h\|^2.\]
<p>Das ist genau der quadratische Taylorterm: mit \(H_{x^{(0)}}(f)=\begin{pmatrix}2&0\\0&2\end{pmatrix}\) ist \(\frac12\langle h,H_{x^{(0)}}(f)h\rangle=h_1^2+h_2^2\); alle Ableitungen ab der Ordnung 3 verschwinden, die Taylorformel bricht hier ab und ist exakt. Zahlenprobe mit \(h=(0{,}1;\,-0{,}2)^{T}\): \(f(1{,}1;\,1{,}8)=1{,}21+3{,}24=4{,}45\), \(\tilde f=2{,}2+7{,}2-5=4{,}4\), Differenz \(0{,}05=0{,}01+0{,}04\). Passt.</p>
<p><b>(b) Ein nicht quadratisches Beispiel.</b> \(f(x_1,x_2)=x_1e^{x_2}\), \(x^{(0)}=(2,0)^{T}\): \(f(x^{(0)})=2\), \(\frac{\partial f}{\partial x_1}=e^{x_2}\to1\), \(\frac{\partial f}{\partial x_2}=x_1e^{x_2}\to2\), also</p>
\[\tilde f(x)=2+(x_1-2)+2x_2=x_1+2x_2.\]
<p>Kontrolle bei \(h=(0{,}1;\,0{,}1)^{T}\): \(f(2{,}1;\,0{,}1)=2{,}1\cdot e^{0{,}1}=2{,}32086\dots\) gegen \(\tilde f=2{,}3\), Fehler \(0{,}0209\). Der vorhergesagte quadratische Term ist mit \(H_{x^{(0)}}(f)=\begin{pmatrix}0&1\\1&2\end{pmatrix}\)</p>
\[\tfrac12\big\langle h,H_{x^{(0)}}(f)h\big\rangle=h_1h_2+h_2^2=0{,}01+0{,}01=0{,}02,\]
<p>also dieselbe Größenordnung und fast derselbe Wert — der Rest \(\mathcal{O}(\|h\|^3)\) macht die Differenz \(0{,}0009\) aus.</p>`,
        plus: String.raw`<p><b>Einordnung.</b> Die Tangentialebene ist das Taylorpolynom 1. Grades. Nimmt man den quadratischen Term dazu, entsteht die Schmiegequadrik \(f(x^{(0)})+\langle\nabla f,h\rangle+\frac12\langle h,H_{x^{(0)}}(f)h\rangle\) — genau der Ausdruck, mit dem §7.9 kritische Punkte klassifiziert.</p>
<p><b>Roter Faden zu §7.9.</b> Die Tangentialebene ist genau dann waagrecht (\(\tilde f\) konstant), wenn \(\nabla f\big|_{x=x^{(0)}}\) verschwindet — das ist die notwendige Bedingung für ein lokales Extremum, also die Definition des kritischen Punktes.</p>
<p><b>Normalenvektor.</b> Für \(m=2\) ist die Ebene \(x_3=\tilde f(x_1,x_2)\) gleichbedeutend mit</p>
\[\frac{\partial f}{\partial x_1}\bigg|_{x=x^{(0)}}\big(x_1-x^{(0)}_1\big)+\frac{\partial f}{\partial x_2}\bigg|_{x=x^{(0)}}\big(x_2-x^{(0)}_2\big)-\big(x_3-f(x^{(0)})\big)=0;\]
<p>ein Normalenvektor ist also \(\left(\frac{\partial f}{\partial x_1},\frac{\partial f}{\partial x_2},-1\right)^{T}\Big|_{x=x^{(0)}}\).</p>
<p><b>Vektorwertiger Fall.</b> Für \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}^n\) heißt dasselbe Objekt Linearisierung: \(\tilde f(x)=f(x^{(0)})+\mathcal{J}_{x^{(0)}}(f)\,(x-x^{(0)})\). Der Gradient wird zur Jacobi-Matrix, die Ebene zum affinen Tangentialraum.</p>
<p><b>Warnung: partielle Ableitungen genügen nicht.</b> Für</p>
\[f(x_1,x_2)=\frac{x_1x_2}{x_1^2+x_2^2}\ \ (x\neq(0,0)^{T}),\qquad f(0,0)=0\]
<p>ist \(f(s,0)=f(0,s)=0\), also existieren beide partiellen Ableitungen in \(x^{(0)}=(0,0)^{T}\) und sind \(0\); die Formel würde die Ebene \(x_3=0\) liefern. Auf der Diagonale \(h=(s,s)^{T}\) ist aber \(f=\frac{s^2}{2s^2}=\frac12\), der Fehler also konstant \(\frac12\) und keineswegs \(o(\|h\|)\) — \(f\) ist in \((0,0)^{T}\) nicht einmal stetig. Ohne totale Differenzierbarkeit ist die hingeschriebene Ebene keine Tangentialebene.</p>
<p><b>Klausurfallen.</b> Partielle Ableitungen zuerst im Punkt auswerten (die Koeffizienten sind Zahlen), \(h_j=x_j-x^{(0)}_j\) einsetzen und den konstanten Term \(f(x^{(0)})\) nicht vergessen. Zur Einordnung siehe den Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}}]},
    {id:"7.9", t:"Extremwerte", topics:[
       {id:"7.9.1", title:"Lokale Extrema und die notwendige Bedingung", body:{
        def: String.raw`<p>Sei \((E,\|\cdot\|_E)\) vollständig, \(\mathcal{U}\subset E\) offen und \(f:\mathcal{U}\subset E\to\mathbb{R}\).</p><p><b>Definition.</b> \(f\) besitzt in \(x^*\in\mathcal{U}\) ein <b>lokales Maximum</b> \[\overset{\text{def}}{\Longleftrightarrow}\quad \exists_{\varepsilon>0}\ \forall_{x\in U_\varepsilon(x^*)\cap\,\mathcal{U}}\ :\quad f(x)\le f(x^*),\] und ein <b>lokales Minimum</b> \[\overset{\text{def}}{\Longleftrightarrow}\quad \exists_{\varepsilon>0}\ \forall_{x\in U_\varepsilon(x^*)\cap\,\mathcal{U}}\ :\quad f(x)\ge f(x^*).\]</p><p><b>Satz (notwendige Bedingung).</b> \(f:\mathcal{U}\subset E\to\mathbb{R}\) nehme in \(x^*\in\mathcal{U}\) einen lokalen Extremwert an. Wenn in \(x^*\) für ein gewisses \(h\in E\) die Richtungsableitung \(Df(x^*)[h]\) existiert, dann ist \[Df(x^*)[h]=0.\]</p><p><b>Beweis.</b> Betrachte \(\varphi_h(t)=f(x^*+t\cdot h)\), \(t\in\left]-\tilde\varepsilon,\tilde\varepsilon\right[\) für gewisses \(\tilde\varepsilon>0\) (möglich, da \(\mathcal{U}\) offen ist). Dann besitzt \(\varphi_h(\cdot)\) im Punkt \(t=0\) einen lokalen Extremwert und ist in \(t=0\) differenzierbar. Der Satz von Fermat liefert \[\frac{d\varphi_h}{dt}\bigg|_{t=0}=Df(x^*)[h]=0.\]</p><p><b>Definition.</b> Wir nennen \(x^*\) einen <b>kritischen Punkt</b>, falls \(Df(x^*)[h]=0\) für alle zugelassenen \(h\in E\).</p><p><b>Spezialfall</b> \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}\) mit \(f'(\cdot):\mathcal{U}\xrightarrow{\ \text{stetig}\ }\mathcal{L}(\mathbb{R}^m,\mathbb{R})\): dann ist \(Df(x)[h]=\big\langle h,\nabla f\big\rangle\big|_{x}\) für alle \(h\in\mathbb{R}^m\), und \(x^*\) ist genau dann kritischer Punkt, wenn \[\big\langle h,\nabla f(x^*)\big\rangle\ \overset{!}{=}\ 0\quad\text{für alle }h\in\mathbb{R}^m,\qquad\text{d.h.}\qquad \nabla f\big|_{x=x^*}=\mathbf{0}_m,\] also \[\frac{\partial f}{\partial x_1}\bigg|_{x=x^*}=\ldots=\frac{\partial f}{\partial x_m}\bigg|_{x=x^*}=0.\]</p>`,
        worte: String.raw`<p>„Lokal“ heißt: verglichen wird nur mit den Punkten einer kleinen Kugel \(U_\varepsilon(x^*)\) um \(x^*\); wie groß \(\varepsilon\) ist, darf von \(x^*\) abhängen, und weit weg darf \(f\) beliebig viel größer oder kleiner werden. Die Definition ist rein ordnungstheoretisch — sie braucht keinerlei Differenzierbarkeit, nur die Norm auf \(E\), um überhaupt „nahe bei \(x^*\)“ sagen zu können.</p><p>Die notwendige Bedingung ist nichts anderes als der Satz von Fermat, eine Dimension höher gedacht. Der Trick der Vorlesung ist immer derselbe: man legt durch \(x^*\) eine Gerade in Richtung \(h\) und schaut sich die Funktion <i>einer</i> Veränderlichen \(\varphi_h(t)=f(x^*+th)\) an. Weil \(\mathcal{U}\) offen ist, ist \(\varphi_h\) auf einem ganzen Intervall \(\left]-\tilde\varepsilon,\tilde\varepsilon\right[\) definiert, und weil \(x^*\) lokales Extremum von \(f\) ist, ist \(t=0\) lokales Extremum von \(\varphi_h\). Im Eindimensionalen weiß man: an einem <i>inneren</i> Extremum verschwindet die Ableitung — und genau diese Ableitung ist die Richtungsableitung \(Df(x^*)[h]\).</p><p>Beachtenswert ist, wie wenig verlangt wird: nur die Existenz der Richtungsableitung in der jeweiligen Richtung \(h\), nicht die volle Fréchet-Differenzierbarkeit. Deshalb steht in der Definition des kritischen Punktes auch „für alle <i>zugelassenen</i> \(h\)“ — nämlich für alle Richtungen, in denen \(Df(x^*)[h]\) überhaupt existiert. Ist \(f\) Fréchet-differenzierbar, so bedeutet das schlicht \(f'(x^*)=0\) als Element von \(\mathcal{L}(E,\mathbb{R})\); im \(\mathbb{R}^m\) ist das ein System von \(m\) Gleichungen \(\partial f/\partial x_j=0\) für \(m\) Unbekannte, also genau die Rechenvorschrift zum Aufspüren der Kandidaten.</p><p>Der Satz liefert eine <i>Kandidatenliste</i>, mehr nicht: er schließt alle Punkte aus, in denen die Ableitung nicht verschwindet, sagt aber über die verbleibenden Punkte nichts. Die Entscheidung fällt erst über die zweite Ableitung.</p>`,
        beispiel: String.raw`<p><b>Kritische Punkte von \(f(x,y)=x^3+y^3-3xy\) auf \(\mathcal{U}=\mathbb{R}^2\).</b> Die Funktion ist ein Polynom, also beliebig oft stetig differenzierbar; alle Richtungsableitungen existieren.</p><p><b>Schritt 1 (Gradient bilden).</b> \[\nabla f\big|_{x}=\begin{pmatrix}\dfrac{\partial f}{\partial x}\\[2mm] \dfrac{\partial f}{\partial y}\end{pmatrix}=\begin{pmatrix}3x^2-3y\\ 3y^2-3x\end{pmatrix}.\]</p><p><b>Schritt 2 (notwendige Bedingung ansetzen).</b> \(\nabla f\big|_{x=x^*}=\mathbf{0}_2\) bedeutet \[3x^2-3y=0\quad\text{und}\quad 3y^2-3x=0,\qquad\text{also}\qquad y=x^2,\quad x=y^2.\]</p><p><b>Schritt 3 (System lösen).</b> Einsetzen der ersten in die zweite Gleichung: \(x=(x^2)^2=x^4\), d.h. \[x\,(x^3-1)=0\quad\Longrightarrow\quad x=0\ \text{ oder }\ x=1.\] Mit \(y=x^2\) folgt \[x^*_{(1)}=(0,0)^{T},\qquad x^*_{(2)}=(1,1)^{T}.\]</p><p><b>Schritt 4 (Ergebnis lesen).</b> Nur diese beiden Punkte kommen als lokale Extremstellen überhaupt in Frage; es ist \(f(0,0)=0\) und \(f(1,1)=1+1-3=-1\). Ob dort tatsächlich ein Extremum vorliegt, entscheidet die notwendige Bedingung <i>nicht</i>: in \((1,1)^{T}\) liegt ein lokales Minimum (<a href="#/7.9.2">7.9.2</a>), in \((0,0)^{T}\) dagegen ein Sattelpunkt (<a href="#/7.9.3">7.9.3</a>, <a href="#/7.9.4">7.9.4</a>). Dieses Beispiel begleitet uns durch den ganzen Abschnitt.</p>`,
        plus: String.raw`<p><b>Notation.</b> Für den Nullvektor schreibt die Vorlesung an der Tafel eine durchgestrichene Null mit Raum-Index. Dieses Zeichen kennt KaTeX nicht, deshalb steht auf diesen Karten \(\mathbf{0}_E\), \(\mathbf{0}_F\), \(\mathbf{0}_m\); entsprechend ersetzt \(\mathbf{1}\) die doppelt gestrichene Eins (Identität). Der kritische Punkt bzw. Extremstellenkandidat heißt konsequent \(x^*\).</p><p><b>Roter Faden.</b> Die Extremwerttheorie in \(E\) läuft nach demselben Muster wie in einer Dimension: erst <i>notwendig</i> (erste Ableitung null, liefert Kandidaten), dann <i>hinreichend</i> (zweite Ableitung, entscheidet). Der ganze Rest von §7.9 ist die Ausarbeitung des zweiten Schrittes — abstrakt über Definitheit (<a href="#/7.9.2">7.9.2</a>, <a href="#/7.9.3">7.9.3</a>), konkret über die Hesse-Matrix (<a href="#/7.9.4">7.9.4</a>).</p><p><b>Klausurfallen.</b> (i) Der Satz gilt nur in <i>inneren</i> Punkten — \(\mathcal{U}\) ist offen. Auf dem Rand eines Gebietes oder unter Nebenbedingungen kann ein Extremum vorliegen, ohne dass die Ableitung verschwindet; dafür gibt es die Lagrange-Multiplikatoren in §7.12. (ii) \(Df(x^*)[h]=0\) für <i>ein</i> \(h\) macht \(x^*\) noch nicht zum kritischen Punkt; verlangt ist es für alle zugelassenen Richtungen. (iii) Die Umkehrung ist falsch: \(f(t)=t^3\) hat in \(t=0\) verschwindende Ableitung und trotzdem kein Extremum.</p><p>Der eindimensionale Satz von Fermat und die Vorzeichenkriterien stehen auf dem Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.9.2", title:"Definitheit — die hinreichende Bedingung", body:{
        def: String.raw`<p>Sei \(f:\mathcal{U}\subset E\to\mathbb{R}\) in \(\mathcal{U}\) 3-fach stetig Fréchet-differenzierbar, also insbesondere \(f^{(3)}(\cdot):\mathcal{U}\xrightarrow{\ \text{stetig}\ }\mathcal{L}^{(3)}(E,\mathbb{R})\), und sei \(x^*\in\mathcal{U}\) ein kritischer Punkt. Die Taylorformel aus §7.8 liefert \[f(x^*+h)=f(x^*)+\underbrace{f'(x^*)h}_{=0}+\tfrac12\,f''(x^*)h^2+\mathcal{O}\!\left(\|h\|_E^3\right),\] wobei \(f''(x^*)\in\mathcal{L}^{(2)}(E,\mathbb{R})\) bilinear ist und \(f''(x^*)h^2=\big(f''(x^*)h\big)h\) die zugehörige quadratische Form bezeichnet.</p><p><b>Definition.</b> Wir nennen \(f''(x^*)h^2\) <b>positiv definit</b> \[\overset{\text{def}}{\Longleftrightarrow}\quad \exists_{\varepsilon>0}\ \forall h\in E:\quad f''(x^*)h^2\ \ge\ \varepsilon\,\|h\|_E^2,\] und <b>negativ definit</b> \[\overset{\text{def}}{\Longleftrightarrow}\quad \exists_{\varepsilon>0}\ \forall h\in E:\quad f''(x^*)h^2\ \le\ -\varepsilon\,\|h\|_E^2.\] Entscheidend ist, dass ein <i>einziges</i> \(\varepsilon>0\) für <b>alle</b> \(h\in E\) taugt.</p><p><b>Satz (hinreichende Bedingung).</b> Sei \(f:\mathcal{U}\subset E\to\mathbb{R}\) in \(\mathcal{U}\) 3-fach stetig Fréchet-differenzierbar und \(x^*\in\mathcal{U}\) ein kritischer Punkt für \(f\). Dann gilt:</p><ul><li>Ist \(f''(x^*)\) positiv definit, so liegt in \(x=x^*\) ein lokales <b>Minimum</b> vor.</li><li>Ist \(f''(x^*)\) negativ definit, so liegt in \(x=x^*\) ein lokales <b>Maximum</b> vor.</li></ul><p><b>Beweis.</b> Wegen \(f'(x^*)=0\) ist \[f(x^*+h)-f(x^*)=\underbrace{\tfrac12 f''(x^*)h^2}_{\text{bestimmt das Vorzeichen}}+\ \mathcal{O}\!\left(\|h\|^3\right).\] Im positiv definiten Fall in drei Schritten: <b>(1)</b> \(\tfrac12 f''(x^*)h^2\ge\tfrac{\varepsilon}{2}\|h\|^2\). <b>(2)</b> Wegen der 3-fach stetigen Differenzierbarkeit gibt es \(C>0\) und \(\delta>0\) mit \(\left|\mathcal{O}(\|h\|^3)\right|\le C\|h\|^3\) für \(\|h\|<\delta\). <b>(3)</b> Für \(\|h\|<\min\{\delta,\ \varepsilon/(4C)\}\) folgt \[f(x^*+h)-f(x^*)\ \ge\ \left(\tfrac{\varepsilon}{2}-C\|h\|\right)\|h\|^2\ \ge\ \tfrac{\varepsilon}{4}\,\|h\|^2\ \ge\ 0,\] also ein (sogar striktes) lokales Minimum. Der negativ definite Fall folgt durch Übergang zu \(-f\).</p>`,
        worte: String.raw`<p>Nach dem ersten Schritt (<a href="#/7.9.1">7.9.1</a>) ist der lineare Term weg. Was von \(f\) in der Nähe von \(x^*\) übrig bleibt, ist eine <i>quadratische Form</i> plus einen Fehler der Ordnung \(\|h\|^3\). Und \(\|h\|^3\) ist für kleine \(\|h\|\) sehr viel kleiner als \(\|h\|^2\) — deshalb entscheidet der quadratische Term über das Vorzeichen der Änderung, sofern er selbst nicht entartet. Genau das steht an der Tafel in der grünen Unterklammer: \(\tfrac12 f''(x^*)h^2\) „bestimmt das Vorzeichen der Änderung“.</p><p>Damit dieses Argument trägt, genügt <i>nicht</i>, dass \(f''(x^*)h^2>0\) für jedes einzelne \(h\ne\mathbf{0}_E\) ist. Man braucht eine <b>gleichmäßige</b> Schranke \(f''(x^*)h^2\ge\varepsilon\|h\|_E^2\) mit einem für alle Richtungen gemeinsamen \(\varepsilon>0\): nur dann lässt sich der kubische Rest gegen den quadratischen Hauptteil ausspielen. Wäre das Infimum über die Einheitssphäre gleich Null, so gäbe es Richtungen, in denen der Rest den Hauptteil überholt — das Argument bräche zusammen. Genau deshalb ist die Definitheit in der Vorlesung mit \(\varepsilon\) formuliert und nicht mit „\(>0\)“.</p><p>Die Voraussetzung „3-fach stetig differenzierbar“ wirkt großzügig, hat aber ihren Zweck: sie sichert eine gleichmäßige Schranke \(C\|h\|^3\) für das Restglied auf einer ganzen Kugel um \(x^*\), was Schritt (2) des Beweises braucht.</p><p>Merke die Rollenverteilung: <a href="#/7.9.1">7.9.1</a> ist notwendig und nicht hinreichend, dieser Satz ist hinreichend und nicht notwendig. Es gibt lokale Minima, in denen \(f''(x^*)\) nicht positiv definit ist — dann sagt der Satz einfach nichts, und man muss von Hand nachsehen.</p>`,
        erfuellt: String.raw`<p><b>Positiv definit: \(f(x,y)=x^3+y^3-3xy\) im kritischen Punkt \(x^*=(1,1)^{T}\).</b> (Kandidat aus <a href="#/7.9.1">7.9.1</a>.)</p><p><b>Schritt 1 (zweite partielle Ableitungen).</b> Aus \(\frac{\partial f}{\partial x}=3x^2-3y\), \(\frac{\partial f}{\partial y}=3y^2-3x\) folgt \[\frac{\partial^2 f}{\partial x^2}=6x,\qquad \frac{\partial^2 f}{\partial y^2}=6y,\qquad \frac{\partial^2 f}{\partial x\,\partial y}=\frac{\partial^2 f}{\partial y\,\partial x}=-3.\] Im Punkt \(x^*=(1,1)^{T}\): \(6,\ 6,\ -3\).</p><p><b>Schritt 2 (quadratische Form aufstellen).</b> Mit \(h=(h_1,h_2)^{T}\) und der Formel aus §7.8 \[f''(x^*)h^2=\sum_{j,\ell=1}^{2}\frac{\partial^2 f(x^*)}{\partial x_j\,\partial x_\ell}\,h_j h_\ell = 6h_1^2-3h_1h_2-3h_2h_1+6h_2^2 = 6h_1^2-6h_1h_2+6h_2^2.\]</p><p><b>Schritt 3 (\(\varepsilon\) bestimmen).</b> Wir raten \(\varepsilon=3\) und rechnen die Differenz aus: \[6h_1^2-6h_1h_2+6h_2^2-3\left(h_1^2+h_2^2\right)=3h_1^2-6h_1h_2+3h_2^2=3\,(h_1-h_2)^2\ \ge\ 0.\] Also gilt für <b>alle</b> \(h\in\mathbb{R}^2\) \[f''(x^*)h^2\ \ge\ 3\,\|h\|^2,\] d.h. \(f''(x^*)\) ist positiv definit mit \(\varepsilon=3\).</p><p><b>Schritt 4 (Satz anwenden).</b> \(x^*=(1,1)^{T}\) ist kritisch und \(f''(x^*)\) positiv definit, also liegt dort ein lokales Minimum vor, mit Wert \(f(1,1)=-1\). Zur Kontrolle die exakte Entwicklung: \[f(1+h_1,\,1+h_2)-f(1,1)=\underbrace{3h_1^2-3h_1h_2+3h_2^2}_{=\;\tfrac12 f''(x^*)h^2}\;+\;h_1^3+h_2^3,\] und wegen \[3h_1^2-3h_1h_2+3h_2^2=\tfrac32\,(h_1-h_2)^2+\tfrac32\left(h_1^2+h_2^2\right)\ \ge\ \tfrac32\,\|h\|^2\] überwiegt der quadratische Anteil für kleine \(\|h\|\) den kubischen Rest \(h_1^3+h_2^3\). Dass \(\varepsilon=3\) hier die bestmögliche Wahl ist, zeigt <a href="#/7.9.4">7.9.4</a>: \(3\) ist der kleinste Eigenwert der Hesse-Matrix.</p>`,
        verletzt: String.raw`<p><b>Definitheit scheitert: \(f(x,y)=x^4+y^4\) im Punkt \(x^*=(0,0)^{T}\).</b></p><p><b>Schritt 1 (kritischer Punkt).</b> \(\nabla f\big|_{x}=(4x^3,\,4y^3)^{T}\), also \(\nabla f\big|_{x=(0,0)^T}=\mathbf{0}_2\): der Punkt ist kritisch.</p><p><b>Schritt 2 (zweite Ableitung).</b> \(\frac{\partial^2f}{\partial x^2}=12x^2\), \(\frac{\partial^2f}{\partial y^2}=12y^2\), \(\frac{\partial^2f}{\partial x\partial y}=0\); im Nullpunkt verschwinden alle drei. Damit ist \[f''(x^*)h^2=0\qquad\text{für alle }h\in\mathbb{R}^2.\]</p><p><b>Schritt 3 (Definitheit prüfen).</b> Gesucht wäre ein \(\varepsilon>0\) mit \(0=f''(x^*)h^2\ge\varepsilon\|h\|^2\) für alle \(h\); für \(h\ne\mathbf{0}_2\) ist das unmöglich, ebenso die Ungleichung mit \(-\varepsilon\|h\|^2\). Also ist \(f''(x^*)\) weder positiv noch negativ definit — <b>der Satz ist nicht anwendbar</b>.</p><p><b>Schritt 4 (was wirklich passiert).</b> Direkt: \(f(x,y)=x^4+y^4>0=f(0,0)\) für \((x,y)\ne(0,0)\), es liegt sogar ein striktes lokales Minimum vor. Die hinreichende Bedingung ist also nicht notwendig.</p><p><b>Schritt 5 (warum die zweite Ordnung hier wirklich nichts weiß).</b> Die Funktion \(g(x,y)=x^4-y^4\) hat in \((0,0)^{T}\) exakt dieselbe (verschwindende) zweite Ableitung, aber \(g(t,0)=t^4>0\) und \(g(0,t)=-t^4<0\) — also kein Extremum. Aus \(f''(x^*)h^2\equiv 0\) lässt sich somit prinzipiell nichts folgern; man muss auf höhere Ordnungen oder direkte Abschätzungen ausweichen.</p>`,
        plus: String.raw`<p><b>Warum das \(\varepsilon\) unverzichtbar ist.</b> Im \(\mathbb{R}^m\) ist die Einheitssphäre kompakt, deshalb sind „\(f''(x^*)h^2>0\) für alle \(h\ne\mathbf{0}_m\)“ und Definitheit dort gleichwertig (das \(\varepsilon\) ist der kleinste Eigenwert, siehe <a href="#/7.9.4">7.9.4</a>). In unendlichdimensionalen Räumen stimmt das nicht mehr: auf \(E=\ell^2\) ist \(Q(h)=\sum_{k\ge1}\frac{h_k^2}{k}\) für jedes \(h\ne\mathbf{0}_E\) echt positiv, aber für die Einheitsvektoren \(e_k\) gilt \(Q(e_k)=\tfrac1k\to0\) bei \(\|e_k\|=1\). Ein gemeinsames \(\varepsilon>0\) existiert also nicht. Genau deshalb formuliert die Vorlesung die Definitheit mit \(\varepsilon\) und nicht mit „\(>0\)“.</p><p><b>Bezug zu einer Dimension.</b> Für \(E=\mathbb{R}\) ist die Bilinearform \(f''(x^*)\in\mathcal{L}^{(2)}(\mathbb{R},\mathbb{R})\) durch die einzige Zahl \(a:=f''(x^*)[1,1]\) festgelegt, und \(f''(x^*)h^2=a\,h^2\). Definitheit heißt dann schlicht \(a>0\) bzw. \(a<0\) — der bekannte Test aus <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p><p><b>Klausurtipp.</b> „Positiv definit“ muss belegt werden, nicht behauptet: entweder man gibt wie oben ein konkretes \(\varepsilon\) an und rechnet die Differenz als Quadratsumme aus, oder man bestimmt im \(\mathbb{R}^m\) die Eigenwerte bzw. benutzt den Spur-Determinanten-Trick (<a href="#/7.9.4">7.9.4</a>). Bleibt die Form nur semidefinit (Gleichheit in einer Richtung möglich), so ist der Satz wertlos — dann hilft nur direkte Untersuchung.</p>`}},
       {id:"7.9.3", title:"Sattelpunkt-Kriterium", body:{
        def: String.raw`<p><b>Satz.</b> Sei \(x^*\in\mathcal{U}\) ein kritischer Punkt für \(f:\mathcal{U}\subset E\to\mathbb{R}\) (in \(\mathcal{U}\) 3-fach stetig Fréchet-differenzierbar). Angenommen, es gibt \(h',h''\in E\), so dass \[D\big(Df(x^*)h'\big)h'>0,\qquad D\big(Df(x^*)h''\big)h''<0.\] Dann liegt in \(x^*\) <b>kein lokaler Extremwert</b> vor.</p><p>Dabei ist \(D\big(Df(x^*)h\big)h\) die iterierte Richtungsableitung, also gerade die quadratische Form der zweiten Ableitung: \[D\big(Df(x^*)h\big)h=f''(x^*)\big[h,h\big]=f''(x^*)h^2.\]</p><p><b>Beweis.</b> Setze \(\varphi_h(t)=f(x^*+t\cdot h)\) für \(h=h'\) bzw. \(h=h''\). Dann ist \(\varphi_h''(0)=D\big(Df(x^*)h\big)h\), also \[\varphi_{h'}''(0)>0,\qquad \varphi_{h''}''(0)<0 .\] Weil \(x^*\) kritischer Punkt ist, gilt außerdem \(\varphi_{h'}'(0)=Df(x^*)[h']=0\) und \(\varphi_{h''}'(0)=Df(x^*)[h'']=0\). Nach dem eindimensionalen hinreichenden Kriterium besitzt \(\varphi_{h'}\) in \(t=0\) ein striktes lokales <i>Minimum</i> und \(\varphi_{h''}\) in \(t=0\) ein striktes lokales <i>Maximum</i>. In jeder noch so kleinen Umgebung von \(x^*\) gibt es daher Punkte \(x^*+t h'\) mit \(f(x^*+th')>f(x^*)\) <i>und</i> Punkte \(x^*+t h''\) mit \(f(x^*+th'')< f(x^*)\). Damit ist sowohl ein lokales Maximum als auch ein lokales Minimum ausgeschlossen.</p><p><b>Sprechweise.</b> Einen kritischen Punkt, in dem kein lokaler Extremwert vorliegt, nennt man einen <b>Sattelpunkt</b>.</p>`,
        worte: String.raw`<p>Dieser Satz ist das Gegenstück zu <a href="#/7.9.2">7.9.2</a>: dort wurde ein Extremum nachgewiesen, hier wird eines <i>ausgeschlossen</i>. Und er ist bemerkenswert billig zu haben — man muss die Bilinearform \(f''(x^*)\) gar nicht vollständig kennen, es genügen <b>zwei Testrichtungen</b> mit gegenläufigem Vorzeichen der Krümmung.</p><p>Anschaulich ist das genau das Sattelbild: entlang der einen Richtung geht es von \(x^*\) aus in beide Seiten bergauf, entlang der anderen in beide Seiten bergab. Ein Punkt, der zugleich Talsohle und Bergkamm ist, kann kein lokales Extremum sein, denn beliebig nah bei \(x^*\) liegen sowohl größere als auch kleinere Funktionswerte.</p><p>Die Beweistechnik ist wieder die Restriktion auf Geraden: \(\varphi_h(t)=f(x^*+th)\) verwandelt die Frage in eine Aussage über Funktionen einer Veränderlichen, für die \(\varphi_h'(0)=Df(x^*)[h]\) und \(\varphi_h''(0)=f''(x^*)h^2\) gelten. Man beachte die Richtung des Schlusses: für ein <i>Extremum</i> reicht das Verhalten entlang aller Geraden nicht aus, für den <i>Ausschluss</i> eines Extremums genügen zwei Geraden vollkommen — ein Gegenbeispiel braucht eben nur eine Stelle, an der die Behauptung scheitert.</p><p>Wichtig sind die strikten Ungleichungen \(>0\) und \(<0\). Ist \(f''(x^*)h^2\) etwa nur \(\ge 0\) mit einer Richtung, in der die Form verschwindet, so greift weder <a href="#/7.9.2">7.9.2</a> noch dieser Satz: dann entscheidet die zweite Ordnung nicht.</p>`,
        beispiel: String.raw`<p><b>Der Sattelpunkt von \(f(x,y)=x^3+y^3-3xy\) in \(x^*=(0,0)^{T}\).</b> (Zweiter Kandidat aus <a href="#/7.9.1">7.9.1</a>.)</p><p><b>Schritt 1 (kritischer Punkt).</b> \(\nabla f\big|_{x}=(3x^2-3y,\;3y^2-3x)^{T}\), also \(\nabla f\big|_{x=(0,0)^T}=\mathbf{0}_2\).</p><p><b>Schritt 2 (quadratische Form).</b> Mit \(\frac{\partial^2f}{\partial x^2}=6x\), \(\frac{\partial^2f}{\partial y^2}=6y\), \(\frac{\partial^2f}{\partial x\partial y}=-3\) wird im Nullpunkt \[f''(x^*)h^2=0\cdot h_1^2-3h_1h_2-3h_2h_1+0\cdot h_2^2=-6\,h_1h_2 .\] An dieser Form sieht man sofort, dass sie beide Vorzeichen annimmt.</p><p><b>Schritt 3 (Testrichtungen wählen).</b> \[h'=(1,-1)^{T}:\quad f''(x^*)(h')^2=-6\cdot1\cdot(-1)=6>0,\] \[h''=(1,1)^{T}:\quad f''(x^*)(h'')^2=-6\cdot1\cdot1=-6<0 .\] Die Voraussetzung des Satzes ist also erfüllt.</p><p><b>Schritt 4 (Gegenprobe über die Hilfsfunktionen).</b> Es ist \[\varphi_{h'}(t)=f(t,-t)=t^3-t^3+3t^2=3t^2\quad\Longrightarrow\quad \varphi_{h'}'(0)=0,\ \ \varphi_{h'}''(0)=6>0,\] \[\varphi_{h''}(t)=f(t,t)=2t^3-3t^2\quad\Longrightarrow\quad \varphi_{h''}'(t)=6t^2-6t,\ \ \varphi_{h''}''(t)=12t-6,\ \ \varphi_{h''}''(0)=-6<0 .\] Beide Werte stimmen mit Schritt 3 überein.</p><p><b>Schritt 5 (Schluss).</b> Entlang \(h'\) ist \(f(t,-t)=3t^2>0=f(0,0)\) für \(t\ne0\), entlang \(h''\) ist \(f(t,t)=t^2(2t-3)<0=f(0,0)\) für \(0<|t|<\tfrac32\). In jeder Umgebung von \((0,0)^{T}\) gibt es also größere und kleinere Werte: kein lokaler Extremwert, sondern ein <b>Sattelpunkt</b>. In <a href="#/7.9.4">7.9.4</a> ergibt sich dasselbe aus \(\det H_{x^*}(f)=-9<0\), und \(h',h''\) entpuppen sich als die Eigenvektoren zu den Eigenwerten \(+3\) und \(-3\).</p>`,
        plus: String.raw`<p><b>Wie man die Testrichtungen findet.</b> Im \(\mathbb{R}^m\) nimmt man am besten Eigenvektoren der Hesse-Matrix: \(h'\) zum größten Eigenwert \(\lambda_m>0\), \(h''\) zum kleinsten Eigenwert \(\lambda_1<0\) — das ist genau Fall 3 in <a href="#/7.9.4">7.9.4</a>. Oft genügen aber schon die Koordinatenrichtungen \(e_1,\ldots,e_m\): haben zwei der Zahlen \(\frac{\partial^2 f}{\partial x_j^2}\big|_{x=x^*}\) verschiedene Vorzeichen, ist man fertig.</p><p><b>Grenzen des Kriteriums.</b> Es ist hinreichend für „kein Extremum“, aber nicht notwendig. Verschwindet die quadratische Form in einer Richtung, so sagen weder <a href="#/7.9.2">7.9.2</a> noch dieser Satz etwas. Beispiel: \(f(x,y)=x^2+y^4\) und \(g(x,y)=x^2-y^4\) haben in \((0,0)^{T}\) beide die quadratische Form \(f''(x^*)h^2=2h_1^2\). Sie ist stets \(\ge 0\), verschwindet aber für \(h=(0,1)^{T}\). Dennoch hat \(f\) dort ein striktes lokales Minimum, \(g\) dagegen einen Sattelpunkt, denn \(g(0,t)=-t^4<0< t^2=g(t,0)\) für \(t\ne0\). Das ist der Tafel-Fall „sonst keine Aussage möglich“.</p><p><b>Merksatz für die Klausur.</b> Drei Ausgänge, drei Werkzeuge: definit \(\Rightarrow\) Extremum (<a href="#/7.9.2">7.9.2</a>), indefinit \(\Rightarrow\) Sattel (diese Karte), semidefinit \(\Rightarrow\) keine Aussage, direkte Untersuchung nötig.</p>`}},
       {id:"7.9.4", title:"Spezialfall \(\mathbb{R}^m\): Hesse-Matrix und Eigenwerte", body:{
        def: String.raw`<p><b>Spezialfall</b> \(f:\mathcal{U}\subset\mathbb{R}^m\to\mathbb{R}\), in \(\mathcal{U}\) 3-fach stetig Fréchet-differenzierbar (insbesondere sind alle zweiten partiellen Ableitungen auf \(\mathcal{U}\) stetig). Der Punkt \(x^*\) ist kritischer Punkt, falls \(\nabla f\big|_{x=x^*}=\mathbf{0}_m\), und es gilt \[f''(x^*)h^2=\big\langle h,\;H_{x^*}(f)\,h\big\rangle\] mit der Hesse-Matrix vom Typ \((m,m)\) \[H_{x^*}(f)=\begin{pmatrix}\dfrac{\partial^2 f}{\partial x_1^2}&\cdots&\dfrac{\partial^2 f}{\partial x_1\partial x_m}\\[2mm] \vdots& &\vdots\\[2mm] \dfrac{\partial^2 f}{\partial x_m\partial x_1}&\cdots&\dfrac{\partial^2 f}{\partial x_m^2}\end{pmatrix}\Bigg|_{x=x^*}.\]</p><p>Nach dem <b>Satz von Schwarz</b> ist \(H_{x^*}(f)\) bei stetigen zweiten partiellen Ableitungen auf \(\mathcal{U}\) <b>symmetrisch</b>, also diagonalisierbar mit reellen Eigenwerten \[\lambda_1\le\lambda_2\le\ldots\le\lambda_{m-1}\le\lambda_m\] (aufgezählt entsprechend geometrischer bzw. algebraischer Vielfachheit).</p><p><b>Lemma (Hausaufgabe).</b> Für alle \(h\in\mathbb{R}^m\), \(h\ne\mathbf{0}_m\), gilt \[\lambda_1\ \le\ \frac{\big\langle h,H_{x^*}(f)h\big\rangle}{\|h\|^2}\ \le\ \lambda_m,\] und die Schranken werden angenommen: \[\lambda_1=\min_{h\ne\mathbf{0}_m}\frac{\big\langle h,H_{x^*}(f)h\big\rangle}{\|h\|^2},\qquad \lambda_m=\max_{h\ne\mathbf{0}_m}\frac{\big\langle h,H_{x^*}(f)h\big\rangle}{\|h\|^2}.\]</p><p><b>Fallunterscheidung für einen kritischen Punkt \(x^*\):</b></p><ul><li><b>Fall 1:</b> \(0<\varepsilon=\lambda_1\le\lambda_2\le\ldots\le\lambda_m\ \hookrightarrow\ H_{x^*}(f)\) positiv definit \(\Rightarrow\) lokales <b>Minimum</b>.</li><li><b>Fall 2:</b> \(\lambda_1\le\ldots\le\lambda_m=-\varepsilon<0\ \hookrightarrow\ H_{x^*}(f)\) negativ definit \(\Rightarrow\) lokales <b>Maximum</b>.</li><li><b>Fall 3:</b> \(\lambda_1<0<\lambda_m\ \hookrightarrow\) kein lokaler Extremwert (<b>Sattelpunkt</b>).</li></ul><p>Sonst, d.h. wenn \(\lambda_1=0\) oder \(\lambda_m=0\) ist, ist keine Aussage möglich.</p><p><b>Trick für \(m=2\).</b> Für \(H=\begin{pmatrix}a&c\\ c&b\end{pmatrix}\) gilt \[\operatorname{Tr}H=a+b=\lambda_1+\lambda_2,\qquad \det H=ab-c^2=\lambda_1\lambda_2 .\]</p>`,
        worte: String.raw`<p>Im \(\mathbb{R}^m\) wird die abstrakte Definitheit aus <a href="#/7.9.2">7.9.2</a> vollständig berechenbar. Die zweite Ableitung ist dort nichts anderes als die Hesse-Matrix, und die quadratische Form \(f''(x^*)h^2\) ist das Skalarprodukt \(\langle h,H_{x^*}(f)h\rangle\). Der Satz von Schwarz macht diese Matrix symmetrisch — und Symmetrie ist der Schlüssel: eine symmetrische reelle Matrix hat eine Orthonormalbasis aus Eigenvektoren und lauter reelle Eigenwerte.</p><p>Damit wird das Lemma (Rayleigh-Quotient) fast selbstverständlich: schreibt man \(h=\sum_k c_k v_k\) in einer Orthonormalbasis von Eigenvektoren \(v_k\) zu \(\lambda_k\), so ist \(\langle h,Hh\rangle=\sum_k \lambda_k c_k^2\) und \(\|h\|^2=\sum_k c_k^2\). Der Quotient ist also ein gewichteter Mittelwert der Eigenwerte und liegt zwischen dem kleinsten und dem größten; die Extremwerte werden für \(h=v_1\) bzw. \(h=v_m\) angenommen.</p><p>Daraus liest man alles ab: \(\langle h,Hh\rangle\ge\lambda_1\|h\|^2\) heißt, dass für \(\lambda_1>0\) die Definitheit mit \(\varepsilon=\lambda_1\) gilt — und zwar mit dem <i>bestmöglichen</i> \(\varepsilon\), denn für \(h=v_1\) steht Gleichheit. Genauso ist \(\varepsilon=-\lambda_m\) im negativ definiten Fall. Fall 3 ist gerade das Sattelpunkt-Kriterium aus <a href="#/7.9.3">7.9.3</a> mit den Testrichtungen \(h'=v_m\) und \(h''=v_1\). Und wenn ein Eigenwert Null ist und die übrigen dasselbe Vorzeichen haben, ist die Form nur semidefinit — die zweite Ordnung entscheidet nicht.</p><p>Für \(m=2\) muss man die Eigenwerte nicht einmal ausrechnen: Spur und Determinante sind die elementarsymmetrischen Funktionen \(\lambda_1+\lambda_2\) und \(\lambda_1\lambda_2\), und aus deren Vorzeichen folgt die Vorzeichenverteilung der Eigenwerte. Ist \(\det H<0\), so haben \(\lambda_1,\lambda_2\) verschiedene Vorzeichen — Sattel. Ist \(\det H>0\), so haben sie dasselbe Vorzeichen, und die Spur verrät welches. Ist \(\det H=0\), so ist ein Eigenwert Null — keine Aussage.</p>`,
