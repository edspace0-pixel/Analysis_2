function beweiseHtml(){ return String.raw`
  <p class="sub">Die Abschätzungen und Tricks, die in fast jedem Analysis-Beweis auftauchen — je mit typischem Einsatz zum Aufklappen.</p>
  <div class="subgrid">
    <div class="subcard">
      <div class="subhead">Dreiecksungleichung</div>
      <div class="subrule">\(|a+b|\le|a|+|b|\) — auch für Summen \(\big|\sum a_k\big|\le\sum|a_k|\), Integrale \(\big|\int f\big|\le\int|f|\), Normen \(\|x+y\|\le\|x\|+\|y\|\)</div>
      ${exBox(String.raw`<p>Summenregel für Grenzwerte (\(a_n\to a,\ b_n\to b\)):</p>\[|(a_n+b_n)-(a+b)|\le|a_n-a|+|b_n-b|<\tfrac{\varepsilon}{2}+\tfrac{\varepsilon}{2}=\varepsilon\]`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Umgekehrte Dreiecksungleichung</div>
      <div class="subrule">\(\big|\,|a|-|b|\,\big|\le|a-b|\) — Beträge vergleichen, Nenner nach unten abschätzen.</div>
      ${exBox(String.raw`<p>\(a_n\to a\ \Rightarrow\ |a_n|\to|a|\):</p>\[\big|\,|a_n|-|a|\,\big|\le|a_n-a|\to0.\]<p>Oder Nenner absichern: \(|x-3|\le1\Rightarrow|x|\ge2\Rightarrow\dfrac{1}{|x|}\le\dfrac12\).</p>`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Cauchy-Schwarz-Ungleichung</div>
      <div class="subrule">\(|\langle x,y\rangle|\le\|x\|\,\|y\|\); Summen: \(\big(\sum a_kb_k\big)^{2}\le\sum a_k^{2}\cdot\sum b_k^{2}\); Integrale: \(\big(\int fg\big)^{2}\le\int f^{2}\cdot\int g^{2}\)</div>
      ${exBox(String.raw`<p>Mit \(b_k=1\):</p>\[\Big(\sum_{k=1}^{n}a_k\Big)^{2}\le n\,\sum_{k=1}^{n}a_k^{2}\]<p>— Summe gegen quadratische Summe tauschen; Startpunkt vieler Abschätzungen.</p>`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Bernoulli-Ungleichung</div>
      <div class="subrule">\((1+x)^{n}\ge 1+nx\) für \(x\ge-1\)</div>
      ${exBox(String.raw`<p>\(q^{n}\to\infty\) für \(q>1\): schreibe \(q=1+h\), \(h>0\):</p>\[q^{n}=(1+h)^{n}\ge 1+nh\ \longrightarrow\ \infty.\]`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">AM–GM &amp; Co.</div>
      <div class="subrule">\(\sqrt{ab}\le\dfrac{a+b}{2}\) (\(a,b\ge0\)); \(ab\le\dfrac{a^{2}+b^{2}}{2}\); \(x+\dfrac1x\ge2\) für \(x>0\)</div>
      ${exBox(String.raw`<p>Produkt gegen Quadrate tauschen:</p>\[\sum|a_k b_k|\le\frac12\sum a_k^{2}+\frac12\sum b_k^{2}\]<p>— aus einem unhandlichen Produkt werden zwei handliche Summen.</p>`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Nullergänzung (±-Trick)</div>
      <div class="subrule">Zwischenterm einschieben und Dreiecksungleichung: \(fg-\tilde f\tilde g=(f-\tilde f)g+\tilde f(g-\tilde g)\)</div>
      ${exBox(String.raw`<p>Produktregel für Grenzwerte:</p>\[|a_nb_n-ab|=|(a_n-a)b_n+a(b_n-b)|\le|a_n-a|\,|b_n|+|a|\,|b_n-b|\]<p>\(|b_n|\) ist beschränkt (konvergent) → beide Summanden \(\to0\).</p>`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">ε/2-Trick</div>
      <div class="subrule">Zwei Fehlerquellen? Jede unter \(\varepsilon/2\) drücken, dann \(N=\max(N_1,N_2)\). (Drei Quellen: \(\varepsilon/3\), …)</div>
      ${exBox(String.raw`<p>Konvergent \(\Rightarrow\) Cauchy: für \(m,n\ge N_{\varepsilon/2}\):</p>\[|a_n-a_m|\le|a_n-a|+|a-a_m|<\tfrac{\varepsilon}{2}+\tfrac{\varepsilon}{2}=\varepsilon.\]`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Sandwich-Lemma (Einschließung)</div>
      <div class="subrule">\(a_n\le c_n\le b_n\) und \(a_n,b_n\to L\ \Rightarrow\ c_n\to L\)</div>
      ${exBox(String.raw`\[-\frac1n\ \le\ \frac{\sin n}{n}\ \le\ \frac1n\qquad\Rightarrow\qquad \frac{\sin n}{n}\to0.\]`,"Typischer Einsatz")}
    </div>
    <div class="subcard">
      <div class="subhead">Standard-Abschätzungen</div>
      <div class="subrule">\(|\sin x|\le|x|\); \(|\sin x|,|\cos x|\le1\); \(e^{x}\ge1+x\); \(\ln x\le x-1\)</div>
      ${exBox(String.raw`<p>\(\displaystyle\sum\sin\frac{1}{k^{2}}\) konvergiert absolut:</p>\[\Big|\sin\frac{1}{k^{2}}\Big|\le\frac{1}{k^{2}}\qquad\text{(Majorante, }p=2>1\text{).}\]`,"Typischer Einsatz")}
    </div>
  </div>`; }

function saetzeHtml(){ return String.raw`
  <p class="sub">Die zentralen Definitionen und Sätze — je Feld: die <b>mathematische Definition</b>, darunter zum Aufklappen: <b>in Worten</b>, <b>✓ wie man „erfüllt" zeigt</b> und <b>✗ wie man „verletzt" zeigt</b>.</p>
  <div class="subgrid">
    <div class="subcard">
      <div class="subhead">Stetigkeit (ε-δ &amp; Folgenkriterium)</div>
      <div class="subrule">\(f:D\to\mathbb R\), \(x_0\in D\). Beide Fassungen sind äquivalent.</div>
      \[f\ \text{stetig in }x_0\ :\Longleftrightarrow\ \forall\varepsilon>0\ \exists\delta>0\ \forall x\in D:\ |x-x_0|<\delta\ \Rightarrow\ |f(x)-f(x_0)|<\varepsilon\]
      \[\textbf{Folgenkriterium:}\quad x_n\to x_0\ \Longrightarrow\ f(x_n)\to f(x_0)\quad\text{für jede Folge }(x_n)\subset D\]
      ${exBox(String.raw`<p>Zu jeder <b>Ziel-Toleranz</b> \(\varepsilon\) um \(f(x_0)\) gibt es eine <b>Start-Toleranz</b> \(\delta\) um \(x_0\): alle \(x\) im \(\delta\)-Fenster landen mit ihren Werten im \(\varepsilon\)-Fenster — kleine Eingabe-Wackler erzeugen kleine Ausgabe-Wackler, kein Sprung. Praxis: <b>Nachweisen</b> per ε-δ (δ konstruieren) oder per „Baukasten" (Summen, Produkte, Quotienten, Verkettungen stetiger Funktionen sind stetig); <b>Widerlegen</b> fast immer per Folgenkriterium — eine einzige böse Folge reicht.</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(f(x)=x^{2}\) ist stetig in jedem \(x_0\) — \(\delta\) explizit konstruieren:</p>\[|x^{2}-x_0^{2}|=|x-x_0|\cdot|x+x_0|\]<p>Beschränke zuerst \(|x-x_0|<1\): dann \(|x+x_0|\le|x-x_0|+2|x_0|\le 2|x_0|+1\). Wähle also</p>\[\delta=\min\Big(1,\ \frac{\varepsilon}{2|x_0|+1}\Big)\ \Rightarrow\ |x^{2}-x_0^{2}|\le\delta\,\big(2|x_0|+1\big)\le\varepsilon.\ \checkmark\]<p>(Schneller im Alltag: \(x^{2}=x\cdot x\) ist ein Produkt stetiger Funktionen.)</p>`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(f=\operatorname{sgn}\) ist in \(0\) unstetig — <b>Folgenkriterium</b> mit zwei Folgen:</p>\[x_n=\tfrac1n\to0:\ f(x_n)=1\to1,\qquad y_n=-\tfrac1n\to0:\ f(y_n)=-1\to-1\]<p>Zwei Folgen gegen \(x_0=0\), aber die Funktionswerte haben <b>verschiedene Limites</b> (und keiner ist \(f(0)=0\)) \(\Rightarrow\) nicht stetig in \(0\). Merke: schon <b>eine</b> Folge mit \(f(x_n)\not\to f(x_0)\) genügt.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Riemann-Integrierbarkeit \(f\in R[a,b]\)</div>
      <div class="subrule">\(f:[a,b]\to\mathbb R\) beschränkt; \(X\) Zerlegung mit <b>Rang</b> (Feinheit) \(\lambda(X)=\max_k\Delta x_k\), \(\Xi\) Stützstellen.</div>
      \[f\in R[a,b]\ :\Longleftrightarrow\ \exists\,I\in\mathbb{R}:\ \sigma(f,X,\Xi)=\sum_{k=1}^{n}f(\xi_k)\,\Delta x_k\ \xrightarrow[\ \lambda(X)\to0\ ]{}\ I\]
      <div class="subrule">für <b>jede</b> Zerlegungsfolge und <b>beliebige</b> Stützstellen; dann \(I=\int_a^b f\). Praktische Kriterien: stetig \(\Rightarrow\) intb.; monoton \(\Rightarrow\) intb.; Lebesgue: beschränkt + stetig bis auf Nullmenge \(\Leftrightarrow\) intb.</div>
      ${exBox(String.raw`<p>Zerhacke \([a,b]\) beliebig fein und lies die Funktionshöhe an beliebigen Zwischenstellen ab — bilde Rechtecksummen. \(f\) ist integrierbar, wenn <b>alle</b> diese Summen (egal wie zerlegt, egal wo abgelesen) gegen <b>denselben</b> Wert \(I\) streben. Beschränktheit ist Pflicht; im Alltag prüft man nicht die Definition, sondern: stetig? monoton? höchstens „harmlose" Sprungstellen?</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(f(x)=x^{2}\) auf \([0,1]\): \(f\) ist <b>stetig</b> auf dem kompakten Intervall \(\Rightarrow f\in R[0,1]\) (Satz „stetig ⇒ integrierbar"; Hintergrund: stetig auf Kompaktum \(\Rightarrow\) gleichmäßig stetig \(\Rightarrow\) Ober- und Untersummen rücken zusammen).</p><p>So läuft der Nachweis fast immer: <b>auf ein Kriterium zurückziehen</b>, nicht die Definition prüfen.</p>`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p><b>Dirichlet-Funktion</b> \(f=\mathbf 1_{\mathbb Q}\) auf \([0,1]\) (1 auf rationalen, 0 auf irrationalen Zahlen): jedes noch so kleine Teilintervall enthält beide Sorten Punkte. Wählt man <b>rationale</b> Stützstellen, ist \(\sigma=1\); wählt man <b>irrationale</b>, ist \(\sigma=0\):</p>\[\lim \sigma\ \text{hängt von der Stützstellenwahl ab}\ \Rightarrow\ f\notin R[0,1].\]<p>Verletzt-Nachweis = <b>zwei Ablesearten mit verschiedenen Limites</b> angeben.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Konvergenz uneigentlicher Integrale</div>
      <div class="subrule">Voraussetzung: \(f\) ist auf <b>jedem kompakten</b> Intervall \([A,R]\) Riemann-integrierbar (sonst ist \(F(R)\) gar nicht definiert).</div>
      \[\int_A^{+\infty}\!f(x)\,dx\ \text{konvergiert}\ :\Longleftrightarrow\ \lim_{R\to+\infty}\ \underbrace{\int_A^{R}\!f(x)\,dx}_{=:F(R)}\ \text{existiert in }\mathbb R\]
      <div class="subrule">Analog bei Randsingularität: \(\lim_{\varepsilon\to0^{+}}\int_a^{b-\varepsilon}f\).</div>
      ${exBox(String.raw`<p>Zwei Zutaten: <b>(1)</b> bis zu jeder endlichen Schranke \(R\) muss \(f\) ganz normal integrierbar sein — deshalb „auf jedem kompakten Intervall R-integrierbar". <b>(2)</b> Die Werte \(F(R)\) müssen sich für \(R\to+\infty\) auf eine feste Zahl <b>einpendeln</b>. Divergenz heißt: \(F(R)\to\pm\infty\) <i>oder</i> \(F(R)\) oszilliert ohne Limes.</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(\displaystyle\int_1^{+\infty}\frac{dx}{x^{2}}\): \(x^{-2}\) ist stetig auf jedem \([1,R]\) ✓. Dann \(F(R)\) explizit ausrechnen und den Limes bilden:</p>\[F(R)=\int_1^{R}\frac{dx}{x^{2}}=1-\frac{1}{R}\ \xrightarrow[R\to+\infty]{}\ 1\]<p>Limes existiert \(\Rightarrow\) konvergent mit Wert \(1\).</p>`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(\displaystyle\int_0^{+\infty}\cos x\,dx\): hier ist \(F(R)=\sin R\) — <b>beschränkt, aber ohne Grenzwert</b> (oszilliert ewig zwischen \(-1\) und \(1\)): divergent, obwohl nichts „explodiert"!</p><p>Und \(\displaystyle\int_1^{+\infty}\frac{dx}{x}\): \(F(R)=\ln R\to+\infty\) — divergent durch Explosion. Verletzt-Nachweis = \(F(R)\) ausrechnen und zeigen: \(\to\infty\) oder zwei Folgen \(R_n\) mit verschiedenen Limites (z. B. \(\sin\) bei \(2\pi n\) vs. \(2\pi n+\tfrac\pi2\)).</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Konvergenz einer Reihe</div>
      <div class="subrule">Eine Reihe ist per Definition die Folge ihrer Partialsummen.</div>
      \[\sum_{k=0}^{\infty}a_k=S\ :\Longleftrightarrow\ s_n=\sum_{k=0}^{n}a_k\ \xrightarrow[\ n\to\infty\ ]{}\ S\]
      ${exBox(String.raw`<p>Hinter jeder Reihe steckt eine gewöhnliche <b>Folge</b>: die Zwischensummen \(s_0,s_1,s_2,\dots\) Konvergiert diese Folge, „ist" die Reihe ihr Grenzwert. Alle Reihen-Kriterien sind letztlich Aussagen über diese Folge.</p>`,"In Worten")}
      ${exBox(String.raw`<p>Geometrische Reihe \(q=\tfrac12\): Partialsummen <b>explizit</b> hinschreiben und Limes ablesen:</p>\[s_n=\sum_{k=0}^{n}\Big(\tfrac12\Big)^{k}=\frac{1-(\tfrac12)^{n+1}}{1-\tfrac12}=2\Big(1-\tfrac{1}{2^{n+1}}\Big)\ \longrightarrow\ 2.\]`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(\sum(-1)^{k}\): \(s_n=1,0,1,0,\dots\) hat die zwei Häufungswerte \(1\) und \(0\) \(\Rightarrow\) \((s_n)\) divergiert \(\Rightarrow\) Reihe divergent.</p><p>Schneller Standardweg: <b>notwendiges Kriterium</b> — hier \(a_k=(-1)^{k}\not\to0\), fertig.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Absolute Konvergenz</div>
      <div class="subrule">Stärker als Konvergenz: erlaubt Umordnen und Produktbildung.</div>
      \[\sum a_k\ \text{konvergiert absolut}\ :\Longleftrightarrow\ \sum_{k}|a_k|<\infty\qquad(\Rightarrow\ \textstyle\sum a_k\ \text{konvergiert})\]
      ${exBox(String.raw`<p>Auch wenn man <b>alle Vorzeichen wegwirft</b>, bleibt die Summe endlich. Das ist die „robuste" Konvergenz: jede Umordnung liefert denselben Wert. Nur konvergent, aber nicht absolut („bedingt") heißt: die Vorzeichen-Auslöschung ist essenziell — Umordnen kann dann <i>jeden</i> Wert erzeugen (Riemann!).</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(\displaystyle\sum\frac{(-1)^{k}}{k^{2}}\): Beträge bilden und ein Kriterium anwenden:</p>\[\sum\Big|\frac{(-1)^{k}}{k^{2}}\Big|=\sum\frac{1}{k^{2}}\ \text{konvergiert }(p=2>1)\ \Rightarrow\ \text{absolut konvergent.}\]`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(\displaystyle\sum\frac{(-1)^{k+1}}{k}\): die Reihe selbst konvergiert (Leibniz, \(=\ln2\)) — aber die Betragsreihe ist die <b>harmonische</b>:</p>\[\sum\Big|\frac{(-1)^{k+1}}{k}\Big|=\sum\frac{1}{k}=\infty\]<p>\(\Rightarrow\) konvergent, aber <b>nicht absolut</b> (nur bedingt). Verletzt-Nachweis = Divergenz der Betragsreihe zeigen.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Punktweise Konvergenz \(f_n\to f\)</div>
      <div class="subrule">Funktionenfolge \(f_n:D\to\mathbb R\); jeder Punkt für sich.</div>
      \[f_n\to f\ \text{punktweise auf }D\ :\Longleftrightarrow\ \forall x\in D:\ \lim_{n\to\infty}f_n(x)=f(x)\]
      <div class="subrule">Das \(N=N(\varepsilon,x)\) darf von \(x\) abhängen.</div>
      ${exBox(String.raw`<p>\(x\) <b>festhalten</b>, dann ist \(f_n(x)\) eine gewöhnliche Zahlenfolge — die muss konvergieren, für jedes \(x\) einzeln. Wie schnell, darf von Punkt zu Punkt völlig verschieden sein.</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(f_n(x)=\frac{x}{n}\) auf \(\mathbb R\): festes \(x\) einsetzen und den Zahlen-Limes bilden:</p>\[\lim_{n\to\infty}\frac{x}{n}=0\quad\text{für jedes feste }x\ \Rightarrow\ f_n\to f\equiv0\ \text{punktweise.}\]`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(f_n(x)=(-1)^{n}x\) auf \(\mathbb R\): für \(x\neq0\) springt \(f_n(x)\) zwischen \(x\) und \(-x\) — die Zahlenfolge hat zwei Häufungswerte, also keinen Limes:</p>\[\Rightarrow\ (f_n)\ \text{konvergiert nicht einmal punktweise.}\]<p>Verletzt-Nachweis = <b>einen</b> Punkt \(x\) angeben, an dem \(f_n(x)\) divergiert.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Gleichmäßige Konvergenz \(f_n\rightrightarrows f\)</div>
      <div class="subrule">Ein \(N(\varepsilon)\) für <b>alle</b> \(x\) gleichzeitig — der ganze Graph im \(\varepsilon\)-Schlauch.</div>
      \[f_n\rightrightarrows f\ \text{auf }D\ :\Longleftrightarrow\ M_n=\sup_{x\in D}\,|f_n(x)-f(x)|\ \xrightarrow[\ n\to\infty\ ]{}\ 0\]
      ${exBox(String.raw`<p>Nicht jeder Punkt für sich, sondern der <b>schlimmste</b> Punkt zählt: \(M_n\) ist der größte Fehler auf ganz \(D\). Erst wenn selbst der gegen 0 geht, ist die Konvergenz gleichmäßig. Rezept: Grenzfunktion bestimmen → Fehlerfunktion \(|f_n-f|\) → Supremum (ggf. per Ableitung) → \(\to0\)?</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(f_n(x)=\frac{x}{n}\) auf \([0,1]\) (punktweise Grenzfunktion \(f\equiv0\)):</p>\[M_n=\sup_{x\in[0,1]}\Big|\frac{x}{n}\Big|=\frac{1}{n}\ \longrightarrow\ 0\ \Rightarrow\ \text{gleichmäßig.}\]<p><b>Achtung Bereich:</b> dieselbe Folge auf ganz \(\mathbb R\) hat \(M_n=\infty\) — dort <i>nicht</i> gleichmäßig!</p>`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>\(f_n(x)=x^{n}\) auf \([0,1]\): Grenzfunktion \(f(x)=0\) für \(x<1\), \(f(1)=1\). Fehler-Supremum:</p>\[M_n=\sup_{0\le x<1}x^{n}=1\ \not\to\ 0\ \Rightarrow\ \text{nur punktweise, nicht gleichmäßig.}\]<p>(Symptom: alle \(f_n\) stetig, Grenzfunktion unstetig — das kann bei gleichmäßiger Konvergenz nie passieren.)</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Cauchy-Folge &amp; Cauchy-Kriterium</div>
      <div class="subrule">Konvergenz nachweisen, <b>ohne den Grenzwert zu kennen</b>. In \(\mathbb R,\ \mathbb C,\ \mathbb R^{d}\) (vollständig): Cauchy \(\Leftrightarrow\) konvergent.</div>
      \[(a_n)\ \text{Cauchy}\ :\Longleftrightarrow\ \forall\varepsilon>0\ \exists N\ \forall m,n\ge N:\ |a_n-a_m|<\varepsilon\]
      <div class="subrule">Für Reihen: \(\Big|\sum_{k=n+1}^{m}a_k\Big|<\varepsilon\) für alle \(m>n\ge N\).</div>
      ${exBox(String.raw`<p>Die Folgenglieder rücken untereinander beliebig eng zusammen — nicht nur benachbarte, sondern <b>alle ab Index \(N\)</b>. In vollständigen Räumen ist das dasselbe wie Konvergenz; der Vorteil: man braucht keinen Kandidaten für den Limes.</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(a_n=\frac1n\): für \(m,n\ge N\) beide Glieder abschätzen:</p>\[\Big|\frac1n-\frac1m\Big|\le\frac1n+\frac1m\le\frac{2}{N}<\varepsilon\quad\text{für }N>\tfrac{2}{\varepsilon}\ \Rightarrow\ \text{Cauchy}\ \Rightarrow\ \text{konvergent.}\]`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p>Harmonische Reihe: der <b>Block-Trick</b> — vergleiche \(s_{2n}\) mit \(s_n\):</p>\[s_{2n}-s_n=\sum_{k=n+1}^{2n}\frac1k\ \ge\ n\cdot\frac{1}{2n}=\frac12\quad\text{für jedes }n\]<p>Der Abstand wird <b>nie</b> kleiner als \(\tfrac12\) \(\Rightarrow\) keine Cauchy-Folge \(\Rightarrow\) \(\sum\frac1k\) divergiert. Verletzt-Nachweis = ein festes \(\varepsilon_0\) (hier \(\tfrac12\)) finden, das immer wieder gerissen wird.</p>`,"✗ So zeigt man: verletzt")}
    </div>
    <div class="subcard">
      <div class="subhead">Hauptsatz der Differential- &amp; Integralrechnung</div>
      <div class="subrule">Voraussetzung: \(f\) <b>stetig</b> auf \([a,b]\).</div>
      \[F(x)=\int_a^{x}f(t)\,dt\ \Rightarrow\ F'=f\qquad\text{und}\qquad \int_a^{b}f=\Phi(b)-\Phi(a)\ \text{für jede Stammfunktion }\Phi\]
      ${exBox(String.raw`<p>Integrieren und Ableiten sind Umkehroperationen: die „Flächenfunktion" \(F\) wächst an der Stelle \(x\) genau mit der Rate \(f(x)\). Praktische Folge: bestimmte Integrale berechnet man über <b>irgendeine</b> Stammfunktion — Randwerte einsetzen, fertig.</p>`,"In Worten")}
      ${exBox(String.raw`<p>\(\displaystyle\int_0^{1}x^{2}\,dx\): Voraussetzung prüfen (\(x^{2}\) stetig ✓), Stammfunktion \(\Phi=\frac{x^{3}}{3}\) angeben (Probe: \(\Phi'=x^{2}\) ✓), Randwerte:</p>\[\int_0^{1}x^{2}\,dx=\frac{1}{3}-0=\frac13.\]`,"✓ So zeigt man: erfüllt")}
      ${exBox(String.raw`<p><b>Voraussetzung verletzt</b> — \(f=\operatorname{sgn}\) auf \([-1,1]\) (Sprung bei \(0\)):</p>\[F(x)=\int_{-1}^{x}\operatorname{sgn}(t)\,dt=|x|-1\]<p>\(F\) ist stetig, aber bei \(0\) <b>nicht differenzierbar</b> (Knick!) — dort gilt \(F'=f\) nicht. \(F'=f\) gilt nur an <b>Stetigkeitsstellen</b> von \(f\); die Stetigkeit im Satz ist also wesentlich.</p>`,"✗ Wenn die Voraussetzung fehlt")}
    </div>
  </div>`; }

function normenHtml(){ return String.raw`
<p class="sub">Das Handwerkszeug aus §7.1 und §7.2: Normaxiome prüfen, die passende Norm wählen, lineare Operatoren auf Stetigkeit testen und Operatornormen exakt ausrechnen. Darauf setzt die ganze Differentialrechnung in Kapitel 7 auf — die Fréchet-Ableitung ist ein Element von \(\mathcal{L}(E,F)\), und ohne Norm kann man sie weder messen noch das Restglied \(o(\|h\|_E)\) erklären. Siehe <a href="#/ref/frechet">Fréchet-Ableitung</a>.</p>

<div class="twocol">
  <div class="refblock">
    <h3>Norm und normierter Raum</h3>
    <p class="sub">\(E\) Vektorraum über \(\mathbb{K}\in\{\mathbb{R},\mathbb{C}\}\), Nullvektor \(\mathbf{0}_E\), Abbildung \(\|\cdot\|:E\to\mathbb{R}\).</p>
    <table class="reftable">
      <tr><td><b>(1)</b> \(\|x\|\ge 0\) und \(\|x\|=0\iff x=\mathbf{0}_E\)</td><td class="cond">Definitheit</td></tr>
      <tr><td><b>(2)</b> \(\|\alpha x\|=|\alpha|\cdot\|x\|\)</td><td class="cond">\(\alpha\in\mathbb{K}\), Homogenität</td></tr>
      <tr><td><b>(3)</b> \(\|x+y\|\le\|x\|+\|y\|\)</td><td class="cond">Dreiecksungleichung</td></tr>
      <tr><td>\((E,\|\cdot\|)\) heißt <b>normierter Raum</b>. Die <b>induzierte Metrik</b> ist \(d(x,y)=\|x-y\|\).<span class="when">Damit stehen alle Begriffe aus Analysis 1 sofort bereit: \(U_\varepsilon(x_0)\), offen, abgeschlossen, Cauchy-Folge, stetig — nichts davon muss neu bewiesen werden.</span></td></tr>
      <tr><td>Aus (2) folgt sofort \(\|-x\|=\|x\|\) und \(\|\mathbf{0}_E\|=0\).</td><td class="cond">\(\alpha=-1\) bzw. \(\alpha=0\)</td></tr>
      <tr><td>Gelten nur \(\|x\|\ge0\), (2) und (3), so heißt \(\|\cdot\|\) <b>Halbnorm</b>.</td><td class="cond">(1) verletzt</td></tr>
      <tr><td><b>Klausurfalle:</b> Axiom (1) zuerst prüfen, und zwar in <i>beiden</i> Richtungen. Bei Integral- und Supremumsausdrücken entscheidet der zugrunde liegende Funktionenraum: dieselbe Formel kann auf dem einen Raum eine Norm sein und auf dem größeren nur eine Halbnorm.
      ${exBox(String.raw`<p>Auf \(R[0,1]\) (Riemann-integrierbare Funktionen) sei \(\|f\|_{L^1}=\int_0^1|f(x)|\,dx\).</p><p>(2) und (3) gelten (Linearität und Monotonie des Integrals). Aber setze \(f(0)=1\) und \(f(x)=0\) für \(x\in\left]0,1\right]\).</p><p><b>Schritt 1.</b> \(f\) ist beschränkt und nur in einem Punkt unstetig, also \(f\in R[0,1]\).</p><p><b>Schritt 2.</b> Jede Riemann-Zwischensumme zu einer Zerlegung der Feinheit \(\delta\) ist höchstens \(1\cdot\delta\), also \(\int_0^1|f|\,dx=0\), d.h. \(\|f\|_{L^1}=0\).</p><p><b>Schritt 3.</b> Trotzdem ist \(f\neq\mathbf{0}\) wegen \(f(0)=1\). Also ist (1) verletzt: nur Halbnorm.</p><p><b>Auf \(C([0,1])\) klappt es:</b> wäre \(|f(x_0)|=c\gt0\), so gäbe es aus Stetigkeit ein Teilintervall der Länge \(\delta\gt0\) mit \(|f|\ge c/2\), also \(\int_0^1|f|\ge\tfrac{c}{2}\delta\gt0\) — Widerspruch. Dort ist \(\|\cdot\|_{L^1}\) also wirklich eine Norm. Vgl. <a href="#/7.1.1">7.1.1</a>.</p>`,"Halbnorm-Falle im Riemann-Raum")}
      </td></tr>
    </table>
  </div>

  <div class="refblock">
    <h3>Konvergenz und Stetigkeit</h3>
    <p class="sub">Alles wird auf eine reelle Zahlenfolge zurückgespielt — man muss nur den richtigen Abstand ausrechnen.</p>
    <table class="reftable">
      <tr><td>\(x_n\to x\) bezüglich \(\|\cdot\|\)  \(\iff\)  \(\|x_n-x\|\to 0\) in \(\mathbb{R}\)</td><td class="cond">Definition</td></tr>
      <tr><td>\(x_n\to\mathbf{0}_E\)  \(\iff\)  \(\|x_n\|\to 0\)</td><td class="cond">Spezialfall \(x=\mathbf{0}_E\)</td></tr>
      <tr><td>Grenzwerte sind eindeutig; jede konvergente Folge ist beschränkt.</td></tr>
      <tr><td><b>Stetigkeit der Norm</b> (umgekehrte Dreiecksungleichung)
      \[\big|\,\|x\|-\|y\|\,\big|\le\|x-y\|\]
      also \(\|x_n\|\to\|x\|\), sobald \(x_n\to x\).<span class="when">Einsetzen, um die Norm in den Limes hineinzuziehen: \(\lim\|x_n\|=\|\lim x_n\|\). Folgt in zwei Zeilen aus (3) mit \(x=(x-y)+y\).</span></td></tr>
      <tr><td><b>Stetigkeit der Vektorraum-Operationen.</b> Aus \(x_n\to x\), \(y_n\to y\) in \(\|\cdot\|\) und \(\alpha_n\to\alpha\) in \(|\cdot|\) folgt
      \[x_n+y_n\to x+y,\qquad \alpha_n x_n\to\alpha x.\]</td><td class="cond">Nulltrick, \(|\alpha_n|\) beschränkt</td></tr>
      <tr><td><b>Nachweis-Standardtrick:</b> \(\|x_n-x\|\) durch eine explizite reelle Nullfolge nach oben abschätzen — die exakte Norm braucht man nicht, nur eine brauchbare Schranke.<span class="when">Widerlegen läuft umgekehrt: ein festes \(\varepsilon\gt0\) und eine untere Schranke \(\|x_n-x\|\ge\varepsilon\) für unendlich viele \(n\).</span></td></tr>
      <tr><td><b>Klausurfalle:</b> „\(x_n\to x\)“ ist ohne Angabe der Norm unvollständig. In \(\mathbb{K}^d\) ist das harmlos (alle Normen äquivalent), in Funktionenräumen ist es der Normalfall, dass die Antwort von der Norm abhängt.
      ${exBox(String.raw`<p>Sei \(u_n\in C([0,1])\) der <b>Dreieckspuls</b> mit Träger \(\big[\tfrac{1}{2^{n+1}},\tfrac{1}{2^{n}}\big]\) und Höhe \(1\) (linear hoch, linear zurück, außerhalb \(\equiv 0\)).</p><p><b>In \(\|\cdot\|_C\):</b> die Spitze erreicht stets den Wert \(1\), also</p>\[\|u_n-\mathbf{0}_C\|_C=\|u_n\|_C=1\quad\text{für alle }n,\]<p>d.h. \(u_n\to\mathbf{0}_C\) gilt <b>nicht</b> (nimm \(\varepsilon=\tfrac12\)).</p><p><b>In \(\|\cdot\|_{L^1}\):</b> Grundseite \(\tfrac{1}{2^{n}}-\tfrac{1}{2^{n+1}}=\tfrac{1}{2^{n+1}}\), Höhe \(1\), also</p>\[\|u_n\|_{L^1}=\tfrac12\cdot\tfrac{1}{2^{n+1}}\cdot 1=\frac{1}{2^{n+2}}\longrightarrow 0,\]<p>d.h. hier gilt \(u_n\to\mathbf{0}_C\) sehr wohl. Punktweise gilt übrigens ebenfalls \(u_n(x)\to0\) — punktweise Konvergenz ist aber gar keine Konvergenz in einer Norm. Vgl. <a href="#/7.1.2">7.1.2</a> und <a href="#/ref/grenzwerte">Grenzwerte</a>.</p>`,"Eine Folge, zwei Normen, zwei Antworten")}
      </td></tr>
    </table>
  </div>
</div>

<div class="refblock">
  <h3>Die wichtigsten Normen</h3>
  <p class="sub">Nachschlagetabelle. Rechts steht, woran man die Norm erkennt beziehungsweise was man sich merken muss.</p>
  <table class="reftable">
    <tr><td><b>\(\mathbb{K}^d\), Betragssummennorm:</b> \(\displaystyle\|x\|_1=\sum_{k=1}^{d}|x_k|\)</td><td class="cond">Einheitskugel: Rhombus (Quadrat auf der Spitze)</td></tr>
    <tr><td><b>euklidische Norm:</b> \(\displaystyle\|x\|_2=\Big(\sum_{k=1}^{d}|x_k|^2\Big)^{1/2}=\sqrt{\langle x,x\rangle}\)</td><td class="cond">Einheitskugel: Kreis bzw. Kugel</td></tr>
    <tr><td><b>Maximumsnorm:</b> \(\displaystyle\|x\|_\infty=\sup_{k=1,\dots,d}|x_k|\)</td><td class="cond">Einheitskugel: achsenparalleles Quadrat</td></tr>
    <tr><td><b>allgemeine \(p\)-Norm:</b> \(\displaystyle\|x\|_p=\Big(\sum_{k=1}^{d}|x_k|^p\Big)^{1/p}\), \(1\le p\lt\infty\)<span class="when">Einheitskugel liegt dazwischen und bläht sich mit wachsendem \(p\) vom Rhombus zum Quadrat auf. Monotonie: \(\|x\|_\infty\le\dots\le\|x\|_2\le\|x\|_1\) und \(\|x\|_p\to\|x\|_\infty\) für \(p\to\infty\).</span>
    <br><b>Für \(0\lt p\lt 1\) keine Norm:</b> mit \(p=\tfrac12\), \(x=(1,0)\), \(y=(0,1)\) ist \(\|x+y\|_{1/2}=(1+1)^2=4\gt 2=\|x\|_{1/2}+\|y\|_{1/2}\).
    ${exBox(String.raw`<p>\(x=(3,-4,12)^{T}\in\mathbb{R}^3\):</p><p>\(\|x\|_1=3+4+12=19\);  \(\|x\|_2=\sqrt{9+16+144}=\sqrt{169}=13\);  \(\|x\|_\infty=\sup\{3,4,12\}=12\);  \(\|x\|_3=(27+64+1728)^{1/3}=1819^{1/3}\approx 12{,}21\).</p><p><b>Monotonie-Probe:</b> \(12\le 12{,}21\le 13\le 19\) — passt.</p><p><b>Homogenität (2):</b> \(-2x=(-6,8,-24)^{T}\), also \(\|-2x\|_2=\sqrt{36+64+576}=26=2\cdot13\).</p><p><b>Dreiecksungleichung (3):</b> mit \(y=(1,1,-1)^{T}\) ist \(x+y=(4,-3,11)^{T}\), also \(\|x+y\|_2=\sqrt{146}\approx 12{,}08\le 13+\sqrt3\approx 14{,}73\).</p><p>Nach <a href="#/7.1.3">7.1.3</a> sind alle diese Normen äquivalent — die Zahlenwerte unterscheiden sich, der Konvergenzbegriff nicht.</p>`,"Ein Vektor, vier Normen")}
    </td><td class="cond">Minkowski-Ungleichung ist die eigentliche Arbeit</td></tr>
    <tr><td><b>Folgenraum \(\ell_\infty\):</b> \(\displaystyle\ell_\infty=\Big\{x=(x_n)_{n\in\mathbb{N}}:\ \sup_{n\in\mathbb{N}}|x_n|\lt\infty\Big\}\), \(\displaystyle\|x\|_\infty=\sup_{n\in\mathbb{N}}|x_n|\)</td><td class="cond">Operationen gliedweise; \(\dim=\infty\)</td></tr>
    <tr><td><b>Folgenräume \(\ell_p\), \(1\le p\lt\infty\):</b> \(\displaystyle\ell_p=\Big\{x:\ \sum_{k=1}^{\infty}|x_k|^p\lt\infty\Big\}\), \(\displaystyle\|x\|_p=\Big(\sum_{k=1}^{\infty}|x_k|^p\Big)^{1/p}\)<span class="when">Die Endlichkeit der Norm ist Teil der Zugehörigkeitsbedingung, nicht ein Satz. Eine Aufgabe „liegt \(x\) in \(\ell_p\)?“ ist immer eine Reihenkonvergenz-Frage — siehe <a href="#/ref/konv_summen">Konvergenz von Summen</a>.</span>
    <br><b>Inklusionskette:</b> \(\ell_1\subset\ell_p\subset\ell_q\subset\ell_\infty\) für \(1\le p\le q\lt\infty\), dazu \(\|x\|_\infty\le\|x\|_q\le\|x\|_p\le\|x\|_1\); für \(p\lt q\) sind die Inklusionen echt. Genau umgekehrt zu \(\mathbb{K}^d\), wo alle \(p\)-Normen denselben Raum tragen.
    ${exBox(String.raw`<p><b>\(x=\big(\tfrac1k\big)_k\):</b> \(\|x\|_\infty=1\), also \(x\in\ell_\infty\). Die harmonische Reihe divergiert, also \(x\notin\ell_1\). Aber \(\sum_k\tfrac{1}{k^2}=\tfrac{\pi^2}{6}\), also \(x\in\ell_2\) mit \(\|x\|_2=\tfrac{\pi}{\sqrt6}\approx1{,}283\). Damit ist \(\ell_1\subsetneq\ell_2\).</p><p><b>\(z=\big(\tfrac{1}{\sqrt k}\big)_k\):</b> \(\|z\|_\infty=1\), aber \(\sum_k\big(\tfrac{1}{\sqrt k}\big)^2=\sum_k\tfrac1k=\infty\), also \(z\in\ell_\infty\setminus\ell_2\). Damit ist auch \(\ell_2\subsetneq\ell_\infty\).</p><p><b>\(y=\big(2^{-k}\big)_k\) liegt in allen:</b> \(\|y\|_1=\frac{1/2}{1-1/2}=1\), \(\|y\|_2=\big(\frac{1/4}{1-1/4}\big)^{1/2}=\tfrac{1}{\sqrt3}\approx0{,}577\), \(\|y\|_\infty=\tfrac12\). Monotonie-Probe: \(0{,}5\le 0{,}577\le 1\). Vgl. <a href="#/7.1.5">7.1.5</a>.</p>`,"Wo liegt welche Folge?")}
    </td><td class="cond">\(\dim\ell_p=\dim\ell_\infty=\infty\)</td></tr>
    <tr><td><b>\(C([a,b],\mathbb{K})\):</b> \(\displaystyle\|f\|_C=\max_{x\in[a,b]}|f(x)|\), Nullelement \(\mathbf{0}_C\equiv 0\)<span class="when">Das Maximum wird angenommen, weil \([a,b]\) kompakt und \(|f|\) stetig ist. Konvergenz bezüglich \(\|\cdot\|_C\) ist genau die gleichmäßige Konvergenz \(f_n\rightrightarrows f\) aus Kapitel 6.</span></td><td class="cond">\(\dim C([0,1])=\infty\) (Dreieckspulse)</td></tr>
    <tr><td><b>\(C^1([a,b],\mathbb{K})=\{f:\ f,f'\in C([a,b])\}\):</b> \(\ \|f\|_{C^1}=\|f\|_C+\|f'\|_C\)<span class="when">Einsetzen, sobald die Ableitung mitkontrolliert werden muss. Mit \(\|\cdot\|_C\) allein ist \(C^1\) zwar normiert, aber nicht vollständig.</span>
    ${exBox(String.raw`<p><b>\(f(x)=x^2\) auf \([0,1]\):</b> \(\|f\|_C=1\) (bei \(x=1\)), \(f'(x)=2x\), \(\|f'\|_C=2\), also \(\|f\|_{C^1}=1+2=3\).</p><p><b>\(g(x)=\sin(2\pi x)\) auf \([0,1]\):</b> \(\|g\|_C=1\), \(g'(x)=2\pi\cos(2\pi x)\), \(\|g'\|_C=2\pi\), also \(\|g\|_{C^1}=1+2\pi\approx7{,}28\).</p><p><b>Probe zu (3):</b> \(\|f+g\|_C\le 1+1=2\) und \(\|(f+g)'\|_C\le 2+2\pi\), zusammen \(\|f+g\|_{C^1}\le 3+(1+2\pi)=\|f\|_{C^1}+\|g\|_{C^1}\). Für die Definitheit genügt schon der erste Summand. Vgl. <a href="#/7.1.6">7.1.6</a>.</p>`,"Die C¹-Norm an zwei Funktionen")}
    </td><td class="cond">Norm-Axiome erben sich von \(\|\cdot\|_C\)</td></tr>
    <tr><td><b>\(L^1\)-Norm auf \(C([0,1])\):</b> \(\displaystyle\|f\|_{L^1}=\int_0^1|f(x)|\,dx\)</td><td class="cond">Norm auf \(C([0,1])\), auf \(R[0,1]\) nur Halbnorm</td></tr>
  </table>
</div>

<div class="twocol">
  <div class="refblock">
    <h3>Äquivalenz von Normen</h3>
    <table class="reftable">
      <tr><td><b>Definition.</b> \(\|\cdot\|_A\) und \(\|\cdot\|_B\) auf \(E\) heißen <b>äquivalent</b>, falls es Konstanten \(c,C\in\left]0,+\infty\right[\) gibt mit
      \[c\,\|x\|_A\ \le\ \|x\|_B\ \le\ C\,\|x\|_A,\qquad x\in E.\]</td><td class="cond">zwei Konstanten, gleichmäßig in \(x\)</td></tr>
      <tr><td><b>Was das bedeutet.</b> Setze \(x_n-x\) statt \(x\) ein: dann gilt
      \[x_n\to x\ \text{in}\ \|\cdot\|_A\iff x_n\to x\ \text{in}\ \|\cdot\|_B.\]
      Äquivalente Normen liefern <b>denselben Konvergenzbegriff</b>.<span class="when">Damit stimmen überein: konvergente Folgen samt Grenzwerten, Cauchy-Folgen, offene, abgeschlossene und beschränkte Mengen, stetige Abbildungen — und die Vollständigkeit.</span></td></tr>
      <tr><td><b>Was sich <i>nicht</i> überträgt:</b> die konkreten Zahlenwerte, die Gestalt der Einheitskugel und die Frage, welche Konstante optimal ist.</td><td class="cond">quantitative Aufgaben</td></tr>
      <tr><td><b>Satz.</b> Auf \(\mathbb{K}^d\), \(d\in\mathbb{N}\), sind je zwei Normen äquivalent.<span class="when">Konsequenz: Konvergenz in \(\mathbb{K}^d\) ist gleichbedeutend mit komponentenweiser Konvergenz, und \(\mathbb{K}^d\) ist bezüglich <i>jeder</i> Norm ein Banachraum. Beim Differenzieren darf man für \(o(\|h\|)\) frei zwischen \(\|\cdot\|_1,\|\cdot\|_2,\|\cdot\|_\infty\) wechseln.</span></td><td class="cond">nur endlichdimensional</td></tr>
      <tr><td><b>Die Standardkonstanten (auswendig):</b>
      \[\|x\|_\infty\le\|x\|_1\le d\,\|x\|_\infty,\qquad \|x\|_\infty\le\|x\|_2\le\sqrt d\,\|x\|_\infty\]
      Beide scharf: \(x=e_1\) links, \(x=(1,\dots,1)\) rechts.</td><td class="cond">\(c=1\), \(C=d\) bzw. \(C=\sqrt d\)</td></tr>
      <tr><td><b>Warum der Satz endlichdimensional bleibt.</b> Der Beweis vergleicht jede Norm mit \(\|\cdot\|_\infty\): oben über \(x=\sum_k x_ke_k\) mit \(C=\sum_k\|e_k\|\), unten über das Minimum der stetigen Funktion \(x\mapsto\|x\|\) auf der <b>kompakten</b> Einheitssphäre \(\{\|x\|_\infty=1\}\). In unendlicher Dimension ist die Einheitssphäre nicht kompakt — genau dort bricht er zusammen.</td></tr>
      <tr><td><b>Widerlegungs-Rezept.</b> Eine Folge \(x_n\) angeben mit \(\|x_n\|_A=1\) für alle \(n\), aber \(\|x_n\|_B\to0\). Dann erzwingt \(c\,\|x_n\|_A\le\|x_n\|_B\) sofort \(c\le 0\) — Widerspruch.
      ${exBox(String.raw`<p><b>(a) Dreieckspuls in \(C([0,1])\).</b> Mit \(u_n\) wie oben ist</p>\[\|u_n\|_C=1,\qquad \|u_n\|_{L^1}=\frac{1}{2^{n+2}}\longrightarrow 0.\]<p>Eine Abschätzung \(\|f\|_C\le C\,\|f\|_{L^1}\) mit festem \(C\) würde \(1\le C\cdot 2^{-(n+2)}\to0\) erzwingen — unmöglich. Also sind \(\|\cdot\|_C\) und \(\|\cdot\|_{L^1}\) auf \(C([0,1])\) nicht äquivalent.</p><p><b>(b) Das Tafelbeispiel in \(\ell_1\).</b> Sei \(x^{(n)}\) die Folge mit \(2^n\) Einträgen \(\tfrac{1}{2^n}\), sonst \(0\). Dann</p>\[\|x^{(n)}\|_\infty=\frac{1}{2^n}\longrightarrow 0,\qquad \|x^{(n)}\|_1=2^n\cdot\frac{1}{2^n}=1\ \text{ für alle }n.\]<p>Wäre \(c\,\|x\|_1\le\|x\|_\infty\) mit festem \(c\gt0\), so folgte \(c\le 2^{-n}\to0\). Die eine Richtung \(\|x\|_\infty\le\|x\|_1\) gilt weiter; die Gegenrichtung ist unrettbar, weil die Konstante \(d\) aus \(\mathbb{K}^d\) hier nicht mehr beschränkt ist. Vgl. <a href="#/7.1.3">7.1.3</a>.</p>`,"Zwei Gegenbeispiele im Unendlichdimensionalen")}
      </td></tr>
    </table>
    <div class="note"><b>Klausurfalle Nummer eins.</b> „Alle Normen sind äquivalent“ gilt <b>ausschließlich</b> auf endlichdimensionalen Räumen. Wer den Satz in \(C([a,b])\) oder \(\ell_p\) benutzt, hat den Punkt verloren.</div>
  </div>

  <div class="refblock">
    <h3>Vollständigkeit und Banachraum</h3>
    <table class="reftable">
      <tr><td>\((x_n)\) heißt <b>Cauchy-Folge</b>, falls
      \[\forall_{\varepsilon\gt0}\ \exists_{N_\varepsilon\in\mathbb{N}}\ \forall_{n,m\ge N_\varepsilon}:\ \|x_n-x_m\|\lt\varepsilon.\]</td></tr>
      <tr><td>\((E,\|\cdot\|)\) heißt <b>vollständig</b>, falls jede Cauchy-Folge einen Grenzwert <b>in \(E\)</b> besitzt.<span class="when">Der Zusatz „in \(E\)“ ist der ganze Inhalt: der Grenzwert darf nicht aus dem Raum herausfallen.</span></td></tr>
      <tr><td><b>Banachraum</b> = vollständig + normiert.</td><td class="cond">Definition (Tafel)</td></tr>
      <tr><td><b>Vollständig sind:</b> \(\mathbb{R},\ \mathbb{C},\ \mathbb{R}^d,\ \mathbb{C}^d\) (bezüglich jeder Norm); \(\ell_p\) und \(\ell_\infty\); \(C([a,b],\mathbb{K}^d)\) bezüglich \(\|\cdot\|_C\); \(C^1([a,b],\mathbb{K}^d)\) bezüglich \(\|\cdot\|_{C^1}\).</td><td class="cond">Tafelliste; \(\ell_p,\ell_\infty\) als Zusatz</td></tr>
      <tr><td><b>Nicht vollständig sind:</b> \(C([0,1])\) bezüglich \(\|\cdot\|_{L^1}\); \(C^1([0,1])\) bezüglich \(\|\cdot\|_C\); \(\mathbb{Q}\) bezüglich \(|\cdot|\).</td><td class="cond">Löcher im Raum</td></tr>
      <tr><td><b>Merksatz.</b> Vollständigkeit ist eine Eigenschaft des <i>Paares</i> \((E,\|\cdot\|)\), nicht des Vektorraums allein — \(C([0,1])\) ist mit \(\|\cdot\|_C\) ein Banachraum und mit \(\|\cdot\|_{L^1}\) keiner.<span class="when">Bei äquivalenten Normen überträgt sich Vollständigkeit dagegen, denn sie haben dieselben Cauchy-Folgen und Grenzwerte.</span></td></tr>
      <tr><td><b>Prüfschema „vollständig?“:</b> Cauchy-Folge nehmen \(\to\) Kandidaten für den Grenzwert konstruieren (meist punktweise) \(\to\) nachweisen, dass er im Raum liegt \(\to\) Konvergenz <i>in der Norm</i> zeigen. Am dritten Schritt scheitern die Gegenbeispiele.
      ${exBox(String.raw`<p>Für \(n\ge3\) sei \(f_n\) die Rampe: \(f_n\equiv0\) auf \(\big[0,\tfrac12\big]\), linear von \(0\) auf \(1\) auf \(\big[\tfrac12,\tfrac12+\tfrac1n\big]\), danach \(f_n\equiv1\). Alle \(f_n\) sind stetig.</p><p><b>Cauchy:</b> für \(m\ge n\) stimmen \(f_n\) und \(f_m\) außerhalb von \(\big[\tfrac12,\tfrac12+\tfrac1n\big]\) überein und dort ist \(|f_n-f_m|\le1\), also \(\|f_n-f_m\|_{L^1}\le\tfrac1n\to0\).</p><p><b>Kein Grenzwert in \(C([0,1])\):</b> Angenommen \(\|f_n-f\|_{L^1}\to0\) mit \(f\) stetig. Links: \(\int_0^{1/2}|f|\,dx\le\|f-f_n\|_{L^1}\to0\), also \(f\equiv0\) auf \(\big[0,\tfrac12\big]\), insbesondere \(f\big(\tfrac12\big)=0\). Rechts: für jedes \(\delta\in\left]0,\tfrac12\right[\) ist \(f_n\equiv1\) auf \(\big[\tfrac12+\delta,1\big]\) ab \(n\gt\tfrac1\delta\), also \(f\equiv1\) auf \(\left]\tfrac12,1\right]\). Die Stetigkeit in \(x=\tfrac12\) liefert \(0=f\big(\tfrac12\big)=1\) — Widerspruch.</p><p>Der fehlende Grenzwert ist die Sprungfunktion; erst \(L^1([0,1])\) schließt dieses Loch. Vgl. <a href="#/7.1.7">7.1.7</a>.</p>`,"Stetige Funktionen mit der L¹-Norm sind nicht vollständig")}
      </td></tr>
      <tr><td><b>Wozu man es braucht.</b> Der Banachsche Fixpunktsatz liefert nur in vollständigen Räumen einen Fixpunkt — und auf ihm ruhen der Satz über implizite Funktionen und der Umkehrsatz. Vgl. <a href="#/ref/saetze">Sätze</a>.</td></tr>
    </table>
  </div>
</div>

<div class="twocol">
  <div class="refblock">
    <h3>Lineare Operatoren: linear, stetig, beschränkt</h3>
    <p class="sub">\(E,F\) normierte Räume über \(\mathbb{K}\), \(D_T\subset E\) linearer Teilraum (insbesondere \(\mathbf{0}_E\in D_T\)).</p>
    <table class="reftable">
      <tr><td><b>linear:</b> \(T(\alpha x+\beta y)=\alpha Tx+\beta Ty\) für \(\alpha,\beta\in\mathbb{K}\), \(x,y\in D_T\)</td><td class="cond">Schreibweise ohne Klammern: \(Tx\)</td></tr>
      <tr><td><b>Null-Test:</b> jeder lineare Operator erfüllt \(T\mathbf{0}_E=\mathbf{0}_F\).<span class="when">Schnellster Nichtlinearitätstest: geht die Null nicht auf die Null, ist \(T\) nicht linear (etwa \(Ax=x+1\)). Notwendig, aber nicht hinreichend — \((Sf)(x)=f(x)^2\) erfüllt ihn und ist trotzdem nicht linear.</span></td></tr>
      <tr><td><b>Satz (Stetigkeit genügt im Nullpunkt).</b> \(T\) linear ist in einem \(y\in D_T\) stetig \(\iff\) \(T\) ist in \(\mathbf{0}_E\) stetig.<span class="when">Also: ein linearer Operator ist entweder überall stetig oder nirgends. Nie mit \(\varepsilon\)-\(\delta\) an einer beliebigen Stelle arbeiten — den Nullpunkt testen.</span></td><td class="cond">Grund: \(Tx-Ty=T(x-y)\)</td></tr>
      <tr><td><b>beschränkt:</b> es gibt ein \(C\in\mathbb{R}\) mit
      \[\|Tx\|_F\le C\cdot\|x\|_E,\qquad x\in D_T.\]</td><td class="cond">\(C\) unabhängig von \(x\)</td></tr>
      <tr><td><b>Satz.</b> \(T\) linear ist stetig auf \(D_T\) \(\iff\) \(T\) ist beschränkt \(\iff\) \(T\) ist Lipschitz-stetig.<span class="when">Damit ist eine analytische Eigenschaft durch <i>eine einzige Ungleichung</i> ersetzt. Aus \(\|Tx\|_F\le C\|x\|_E\) folgt \(\|Tx-Ty\|_F=\|T(x-y)\|_F\le C\|x-y\|_E\).</span></td></tr>
      <tr><td><b>Unbeschränktheit zeigen:</b> eine Folge \(x_n\in D_T\setminus\{\mathbf{0}_E\}\) angeben mit
      \[\frac{\|Tx_n\|_F}{\|x_n\|_E}\longrightarrow\infty.\]
      Dann existiert kein zulässiges \(C\), und \(T\) ist in <i>keinem</i> Punkt stetig.<span class="when">Bei linearen Operatoren darf man Testvektoren beliebig umskalieren — der Quotient ändert sich nicht. Deshalb genügt eine unbeschränkte Familie; setzt man \(A_n=\|Tx_n\|_F/\|x_n\|_E\), so erfüllt die Nullfolge \(z_n=\dfrac{x_n}{\|x_n\|_E\cdot A_n}\) genau \(\|Tz_n\|_F=1\).</span>
      ${exBox(String.raw`<p>\(E=F=C([0,1],\mathbb{R})\) mit \(\|\cdot\|_C\), \(D_T=C^1([0,1],\mathbb{R})\), \((Tf)(x)=\tfrac{df(x)}{dx}\).</p><p>Teste mit \(f_n(x)=\sin(n\pi x)\):</p>\[\|f_n\|_C=\max_{x\in[0,1]}|\sin(n\pi x)|=1,\qquad (Tf_n)(x)=n\pi\cos(n\pi x),\qquad \|Tf_n\|_C=n\pi.\]<p>Eine Abschätzung \(\|Tf\|_C\le C\|f\|_C\) lieferte \(n\pi\le C\) für alle \(n\) — unmöglich. Der Quotient \(\|Tf_n\|_C/\|f_n\|_C=n\pi\to\infty\).</p><p><b>Beweisfolge dazu:</b> \(A_n=n\pi\), \(y_n=f_n\), also \(z_n=\tfrac{1}{n\pi}f_n\) mit \(\|z_n\|_C=\tfrac{1}{n\pi}\to0\), aber \(\|Tz_n\|_C=1\). Vgl. <a href="#/7.2.2">7.2.2</a> und <a href="#/7.2.3">7.2.3</a>.</p>`,"Ableitungsoperator ist unbeschränkt")}
      </td></tr>
      <tr><td><b>Endliche Dimension:</b> jede lineare Abbildung \(\mathbb{K}^m\to\mathbb{K}^n\) ist automatisch beschränkt, also stetig. Unstetige lineare Operatoren gibt es nur in unendlichdimensionalen Räumen.</td><td class="cond">deshalb in Analysis 1 nie Thema</td></tr>
    </table>
    <div class="note"><b>Merksatz.</b> „Beschränkt“ heißt <i>nicht</i> „beschränktes Bild“, sondern „beschränkter Streckfaktor“. Ein linearer Operator mit beschränktem Bild wäre zwangsläufig der Nulloperator, denn \(\|T(\lambda x)\|_F=|\lambda|\,\|Tx\|_F\) wächst über alle Grenzen.</div>
  </div>

  <div class="refblock">
    <h3>Der Raum \(\mathcal{L}(E,F)\) und die Operatornorm</h3>
    <p class="sub">Ab hier stets \(D_T=E\) — sonst könnte man Operatoren nicht addieren.</p>
    <table class="reftable">
      <tr><td>\(\mathcal{L}(E,F)=\{T:E\to F:\ T\ \text{linear und stetig}\}\), Vektorraum mit \((T_1+T_2)f=T_1f+T_2f\) und \((\alpha T_1)f=\alpha(T_1f)\), Nulloperator \(\mathbf{0}_{\mathcal{L}}\).</td><td class="cond">stetig \(=\) beschränkt</td></tr>
      <tr><td><b>Operatornorm.</b> Für \(T\in\mathcal{L}(E,F)\)
      \[\|T\|_{\mathcal{L}(E,F)}=\sup_{x\in E,\ x\neq\mathbf{0}_E}\frac{\|Tx\|_F}{\|x\|_E}\lt\infty.\]</td><td class="cond">ist eine Norm auf \(\mathcal{L}(E,F)\)</td></tr>
      <tr><td><b>Die äquivalenten Supremums-Darstellungen:</b>
      \[\|T\|_{\mathcal{L}(E,F)}=\sup_{\|x\|_E=1}\|Tx\|_F=\sup_{0\lt\|x\|_E\le 1}\|Tx\|_F\]<span class="when">Grund ist die Homogenität: Zähler und Nenner bekommen beim Umskalieren \(x\mapsto\lambda x\) beide den Faktor \(|\lambda|\). In der Praxis rechnet man immer mit \(\|x\|_E=1\).</span></td></tr>
      <tr><td><b>Grundabschätzung</b> — das meistbenutzte Werkzeug des Kapitels:
      \[\|Tx\|_F\le\|T\|_{\mathcal{L}(E,F)}\cdot\|x\|_E,\qquad x\in E.\]</td><td class="cond">Definition, rückwärts gelesen</td></tr>
      <tr><td><b>\(\|T\|_{\mathcal{L}}\) ist die kleinste zulässige Konstante \(C\)</b> aus \(\|Tx\|_F\le C\|x\|_E\).<span class="when">Deshalb bedeutet „Operatornorm bestimmen“ immer: obere Schranke plus Testvektor. Siehe Rezept unten.</span></td></tr>
      <tr><td><b>Summe:</b> aus \(C_1\) und \(C_2\) wird \(C_1+C_2\), also \(\|T_1+T_2\|_{\mathcal{L}}\le\|T_1\|_{\mathcal{L}}+\|T_2\|_{\mathcal{L}}\).</td><td class="cond">Ungleichung darf echt sein</td></tr>
      <tr><td><b>Submultiplikativität.</b> Für \(T\in\mathcal{L}(E,F)\), \(S\in\mathcal{L}(F,G)\) ist \(ST\in\mathcal{L}(E,G)\) mit
      \[\|ST\|_{\mathcal{L}(E,G)}\le\|S\|_{\mathcal{L}(F,G)}\cdot\|T\|_{\mathcal{L}(E,F)}.\]<span class="when">In \(ST\) wirkt <b>zuerst \(T\)</b>, dann \(S\); die Zwischenräume müssen passen. Zusatz: \(\mathcal{L}(E,E)\) ist eine Algebra, \(\|\mathbf{1}\|_{\mathcal{L}}=1\) und \(\|T^n\|_{\mathcal{L}}\le\|T\|_{\mathcal{L}}^n\).</span>
      ${exBox(String.raw`<p>\(E=F=G=C([0,1],\mathbb{R})\), \(S=T_\varphi\) mit \(\varphi(x)=x\) und \(T=T_\psi\) mit \(\psi(x)=1-x\). Die Komposition zweier Multiplikationsoperatoren ist wieder einer: \(ST=T_{\varphi\psi}\).</p>\[\|S\|_{\mathcal{L}}=\max_{[0,1]}|x|=1,\qquad \|T\|_{\mathcal{L}}=\max_{[0,1]}|1-x|=1,\]\[\|ST\|_{\mathcal{L}}=\max_{x\in[0,1]}x(1-x)=\tfrac14\quad(\text{Maximum bei }x=\tfrac12),\]<p>also \(\tfrac14\le 1\cdot 1\) — echt kleiner. Grund: \(|\varphi|\) wird bei \(x=1\) maximal, \(|\psi|\) bei \(x=0\), die Maximalstellen liegen auseinander.</p><p><b>Gleichheit ist möglich:</b> mit \(\varphi=\psi=1+x\) ist \(\|ST\|_{\mathcal{L}}=\|\varphi^2\|_C=2^2=4=2\cdot2\). Vgl. <a href="#/7.2.6">7.2.6</a>.</p>`,"Submultiplikativität: warum keine Gleichheit")}
      </td></tr>
      <tr><td><b>Satz (Vollständigkeit).</b> Ist \(F\) vollständig, so ist \(\big(\mathcal{L}(E,F),\|\cdot\|_{\mathcal{L}(E,F)}\big)\) ein Banachraum.<span class="when">Klausurfalle: vorausgesetzt wird nur die Vollständigkeit von \(F\), <i>nicht</i> die von \(E\) — die Grenzwerte werden ausschließlich in \(F\) gebildet. Folge: der Dualraum \(\mathcal{L}(E,\mathbb{K})\) ist für jeden normierten Raum \(E\) vollständig.</span></td><td class="cond">nur \(F\) vollständig</td></tr>
      <tr><td><b>Zwei Konvergenzbegriffe auseinanderhalten.</b> \(T_n\to T\) in \(\|\cdot\|_{\mathcal{L}}\) bedeutet \(\sup_{\|x\|_E=1}\|T_nx-Tx\|_F\to0\), also gleichmäßige Konvergenz auf der Einheitssphäre. Die punktweise Forderung „\(T_nx\to Tx\) für jedes einzelne \(x\)“ ist echt schwächer.</td><td class="cond">derselbe Unterschied wie in Kapitel 6</td></tr>
    </table>
  </div>
</div>

<div class="refblock">
  <h3>Rezept: Operatornorm exakt bestimmen</h3>
  <p class="sub">Zwei Hälften, und die zweite wird am häufigsten vergessen. Wer nur abschätzt, hat \(\|T\|_{\mathcal{L}}\le C\) gezeigt — nicht die Norm bestimmt.</p>
  <table class="reftable">
    <tr><td><b>1. Räume und Normen hinschreiben.</b> \(D_T\), \(E\) mit \(\|\cdot\|_E\), \(F\) mit \(\|\cdot\|_F\).<span class="when">Ohne diese Angabe hat die Frage „ist \(T\) stetig?“ keine Antwort — der Ableitungsoperator ist mit \(\|\cdot\|_C\) auf \(E\) unbeschränkt und mit \(\|\cdot\|_{C^1}\) beschränkt, bei identischer Abbildungsvorschrift.</span></td><td class="cond">immer zuerst</td></tr>
    <tr><td><b>2. Linearität prüfen.</b> Meist eine Zeile, punktweise gerechnet. Schnelltest vorab: \(T\mathbf{0}_E=\mathbf{0}_F\)?</td><td class="cond">sonst gibt es keine Operatornorm</td></tr>
    <tr><td><b>3. Obere Schranke:</b> ein \(C\) finden mit \(\|Tx\|_F\le C\,\|x\|_E\) für <b>alle</b> \(x\in E\). Daraus folgt \(\|T\|_{\mathcal{L}(E,F)}\le C\).<span class="when">Werkzeugkasten: \(\max\) eines Produkts \(\le\) Produkt der \(\max\); \(\big|\int \psi f\big|\le\|f\|_C\int|\psi|\); Cauchy-Schwarz zeilenweise bei Matrizen; Dreiecksungleichung.</span></td><td class="cond">liefert nur \(\le\)</td></tr>
    <tr><td><b>4. Untere Schranke mit einem Testvektor:</b> ein \(\hat x\in E\) mit \(\|\hat x\|_E=1\) angeben und \(\|T\hat x\|_F\) ausrechnen. Kommt \(C\) heraus, ist man fertig:
    \[\|T\|_{\mathcal{L}}\ \ge\ \frac{\|T\hat x\|_F}{\|\hat x\|_E}=\|T\hat x\|_F=C.\]<span class="when">Standard-Testvektoren: \(f\equiv1\) auf \(C([a,b])\); die Einheitsvektoren \(e_k\) in \(\mathbb{K}^d\) und \(\ell_p\); schmale hohe Pulse, wenn eine \(L^1\)-Norm im Nenner steht.</span></td><td class="cond">liefert \(\ge\)</td></tr>
    <tr><td><b>5. Falls kein Vektor \(C\) annimmt:</b> eine Folge \(x_n\neq\mathbf{0}_E\) angeben, deren Quotient gegen \(C\) strebt:
    \[\frac{\|Tx_n\|_F}{\|x_n\|_E}\longrightarrow C\quad\Longrightarrow\quad \|T\|_{\mathcal{L}}\ \ge\ \lim_{n\to\infty}\frac{\|Tx_n\|_F}{\|x_n\|_E}=C.\]
    Normieren muss man dabei nicht — der Quotient ist ohnehin skalierungsinvariant.<span class="when">Es ist ein <b>Supremum</b>, kein Maximum: dass es nicht angenommen wird, ist erlaubt und kommt regelmäßig vor.</span></td><td class="cond">der häufigere Fall</td></tr>
    <tr><td><b>6. Ergebnis:</b> \(\|T\|_{\mathcal{L}(E,F)}=C\), die kleinste in Schritt 3 zulässige Konstante.</td></tr>
    <tr><td><b>Variante: Unbeschränktheit zeigen.</b> Statt 3. und 4. eine Folge \(x_n\neq\mathbf{0}_E\) mit \(\|Tx_n\|_F/\|x_n\|_E\to\infty\) angeben. Dann ist \(T\) unbeschränkt, also in keinem Punkt stetig, und \(T\notin\mathcal{L}(E,F)\).<span class="when">Meist reicht eine oszillierende Testfamilie wie \(\sin(n\pi x)\) oder eine Pulsfolge mit fester Höhe und schrumpfendem Träger.</span>
    ${exBox(String.raw`<p><b>Aufgabe.</b> \(E=D_T=C^1([0,1],\mathbb{R})\) mit \(\|f\|_{C^1}=\|f\|_C+\|f'\|_C\), \(F=C([0,1],\mathbb{R})\) mit \(\|\cdot\|_C\), \(Tf=f'\). Bestimme \(\|T\|_{\mathcal{L}(E,F)}\).</p><p><b>Schritt 2 (Linearität).</b> \((\alpha f+\beta g)'=\alpha f'+\beta g'\) — klar.</p><p><b>Schritt 3 (obere Schranke).</b> Für jedes \(f\in C^1\)</p>\[\|Tf\|_F=\|f'\|_C\le\|f\|_C+\|f'\|_C=\|f\|_{C^1}=\|f\|_E,\]<p>also \(C=1\) und \(\|T\|_{\mathcal{L}}\le1\).</p><p><b>Schritt 4 scheitert:</b> für jedes \(f\neq\mathbf{0}_E\) ist \(\dfrac{\|f'\|_C}{\|f\|_C+\|f'\|_C}\lt 1\) echt — kein Testvektor erreicht \(1\).</p><p><b>Schritt 5 (Folge).</b> Setze \(f_n(x)=\tfrac1n\sin(n\pi x)\). Dann \(\|f_n\|_C=\tfrac1n\), \(f_n'(x)=\pi\cos(n\pi x)\), \(\|f_n'\|_C=\pi\), also</p>\[\frac{\|Tf_n\|_C}{\|f_n\|_{C^1}}=\frac{\pi}{\tfrac1n+\pi}\longrightarrow 1\quad(n\to\infty).\]<p><b>Schritt 6.</b> Zusammen \(\|T\|_{\mathcal{L}}=1\), ohne dass das Supremum angenommen wird. Vgl. <a href="#/7.2.5">7.2.5</a>.</p>`,"Vollständiger Rechenweg mit nicht angenommenem Supremum")}
    </td></tr>
  </table>
</div>

<div class="refblock">
  <h3>Beispielkatalog: Operatoren mit Rechenweg</h3>
  <p class="sub">Der Beispielkatalog der Vorlesung. Beispiel ① ist die Skalarmultiplikation \(Tx=c\,x\) auf \(\mathbb{K}\) mit \(\|T\|_{\mathcal{L}}=|c|\); die übrigen sechs stehen hier. Jede Zeile enthält Räume, Normen und den fertigen Wert; die Rechenwege stehen in den Ausklapp-Kästen — die beiden Ableitungszeilen sind oben schon durchgerechnet.</p>
  <table class="reftable">
    <tr><td><b>Multiplikationsoperator</b> \(\ (T_\varphi f)(x)=\varphi(x)\cdot f(x)\), \(\varphi\in C([0,1],\mathbb{K})\) fest
    \[\|T_\varphi\|_{\mathcal{L}}=\|\varphi\|_C\]
    ${exBox(String.raw`<p><b>Obere Schranke.</b> Für \(f\in C([0,1],\mathbb{K})\)</p>\[\|T_\varphi f\|_C=\max_{x\in[0,1]}|\varphi(x)f(x)|\le\Big(\max_{x\in[0,1]}|\varphi(x)|\Big)\Big(\max_{x\in[0,1]}|f(x)|\Big)=\|\varphi\|_C\,\|f\|_C,\]<p>also \(\|T_\varphi\|_{\mathcal{L}}\le\|\varphi\|_C\). Der entscheidende Schritt ist die Ungleichung in der Mitte — die Maximalstellen von \(|\varphi|\) und \(|f|\) müssen ja nicht übereinstimmen.</p><p><b>Untere Schranke.</b> Testvektor \(f\equiv1\) mit \(\|f\|_C=1\):</p>\[\|T_\varphi f\|_C=\max_{x\in[0,1]}|\varphi(x)\cdot1|=\|\varphi\|_C\ \Longrightarrow\ \|T_\varphi\|_{\mathcal{L}}\ge\|\varphi\|_C.\]<p><b>Zahlenbeispiel.</b> \(\varphi(x)=1+x^2\): \(\|T_\varphi\|_{\mathcal{L}}=\max_{[0,1]}(1+x^2)=2\). Das Analogon einer Diagonalmatrix: \(T_\varphi\) wirkt punktweise, der größte Faktor ist die Streckkonstante. Vgl. <a href="#/7.2.4">7.2.4</a>.</p>`,"Rechenweg Multiplikationsoperator")}
    </td><td class="cond">\(E=F=C([0,1],\mathbb{K})\), \(\|\cdot\|_C\)</td></tr>
    <tr><td><b>Auswertungsfunktional</b> \(\ \delta_y f=f(y)\), \(y\in[0,1]\) fest — ein <b>lineares Funktional</b>
    \[\|\delta_y\|_{\mathcal{L}}=1\qquad(\text{Supremum wird angenommen})\]<span class="when">Vorsicht: mit \(\|\cdot\|_{L^1}\) statt \(\|\cdot\|_C\) auf \(E\) ist \(\delta_y\) <i>unbeschränkt</i>. Punktweise Auswertung lässt sich durch ein Integral nicht kontrollieren.</span>
    ${exBox(String.raw`<p><b>Obere Schranke.</b> \(|\delta_y f|=|f(y)|\le\max_{x\in[0,1]}|f(x)|=\|f\|_C\), also \(\|\delta_y\|_{\mathcal{L}}\le1\).</p><p><b>Untere Schranke.</b> Testvektor \(f\equiv1\): \(\|f\|_C=1\) und \(|\delta_y f|=1\), also \(\|\delta_y\|_{\mathcal{L}}\ge1\). Zusammen \(=1\).</p><p><b>Warum es mit \(\|\cdot\|_{L^1}\) scheitert.</b> Schiebe einen Dreieckspuls der Höhe \(n\) und der Grundseite \(\tfrac{1}{n^2}\) unter die Stelle \(y\). Dann ist \(f_n(y)=n\), aber \(\|f_n\|_{L^1}=\tfrac12\cdot\tfrac{1}{n^2}\cdot n=\tfrac{1}{2n}\to0\); der Quotient \(|\delta_y f_n|/\|f_n\|_{L^1}=2n^2\to\infty\).</p><p><b>Querverbindung.</b> \(\delta_y\) ist die saubere Version dessen, was die Physik als \(\int\delta(x-y)f(x)\,dx=f(y)\) schreibt: keine Funktion, sondern ein stetiges lineares Funktional.</p>`,"Rechenweg Auswertungsfunktional")}
    </td><td class="cond">\(E=C([0,1],\mathbb{K})\) mit \(\|\cdot\|_C\), \(F=\mathbb{K}\)</td></tr>
    <tr><td><b>Ableitungsoperator, unbeschränkt</b> \(\ (Tf)(x)=\dfrac{df(x)}{dx}\)
    <br>Nicht stetig, unbeschränkt — \(T\notin\mathcal{L}(E,F)\).<span class="when">Hier ist \(D_T=C^1\) ein <i>echter</i> Teilraum von \(E=C\); genau dafür unterscheidet die Vorlesung überhaupt zwischen \(D_T\) und \(E\).</span></td><td class="cond">\(D_T=C^1([0,1],\mathbb{R})\subset E=F=C\), beides \(\|\cdot\|_C\)</td></tr>
    <tr><td><b>Ableitungsoperator, beschränkt</b> \(\ (Tf)(x)=\dfrac{df(x)}{dx}\), gleiche Vorschrift, andere Norm auf \(E\)
    \[\|T\|_{\mathcal{L}}=1\qquad(\text{Supremum wird nicht angenommen})\]<span class="when">Merksatz zu ⑤ gegen ⑤a: Beschränktheit ist keine Eigenschaft der Abbildungsvorschrift, sondern des Tripels aus Vorschrift, Definitionsbereich und beiden Normen.</span></td><td class="cond">\(E=D_T=C^1\) mit \(\|\cdot\|_{C^1}\), \(F=C\) mit \(\|\cdot\|_C\)</td></tr>
    <tr><td><b>Integralfunktional</b> \(\ \displaystyle T_\psi f=\int_0^1\psi(x)f(x)\,dx\), \(\psi\in R[0,1]\) fest
    \[\|T_\psi\|_{\mathcal{L}}=\int_0^1|\psi(x)|\,dx\]
    ${exBox(String.raw`<p><b>Linearität</b> folgt aus der Linearität des Integrals.</p><p><b>Obere Schranke.</b></p>\[|T_\psi f|=\Big|\int_0^1\psi(x)f(x)\,dx\Big|\le\int_0^1|\psi(x)||f(x)|\,dx\le\|f\|_C\int_0^1|\psi(x)|\,dx,\]<p>also \(C=\int_0^1|\psi|\,dx\lt\infty\), denn mit \(\psi\) ist auch \(|\psi|\) Riemann-integrierbar.</p><p><b>Untere Schranke, Fall \(\psi\ge0\).</b> Testvektor \(f\equiv1\): \(T_\psi f=\int_0^1\psi\,dx=C\) und \(\|f\|_C=1\). Zahlenbeispiel \(\psi(x)=x\): \(C=\int_0^1x\,dx=\tfrac12\), also \(\|T_\psi\|_{\mathcal{L}}=\tfrac12\).</p><p><b>Bei vorzeichenwechselndem \(\psi\).</b> Man möchte \(f=\operatorname{sgn}\psi\) einsetzen — das ist im Allgemeinen nicht stetig, liegt also nicht in \(E=C([0,1],\mathbb{K})\). Man nähert es stetig an; das Supremum \(\int_0^1|\psi|\,dx\) wird dann im Allgemeinen <i>nicht</i> angenommen. Vgl. <a href="#/7.2.5">7.2.5</a>.</p>`,"Rechenweg Integralfunktional")}
    </td><td class="cond">\(E=C([0,1],\mathbb{K})\) mit \(\|\cdot\|_C\), \(F=\mathbb{K}\)</td></tr>
    <tr><td><b>Matrixoperator</b> \(\ Tx=Ax\) mit \(A=(a_{k\ell})\), \(k=1,\dots,n\), \(\ell=1,\dots,m\)
    \[\|A\|_{\mathcal{L}}\le\Big(\sum_{k=1}^{n}\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)^{1/2}\]<span class="when">In endlicher Dimension ist damit <i>jede</i> lineare Abbildung beschränkt und stetig — Gegenbeispiele existieren nur in unendlichdimensionalen Räumen.</span>
    ${exBox(String.raw`<p><b>Cauchy-Schwarz zeilenweise.</b> Für die \(k\)-te Komponente</p>\[\Big|\sum_{\ell=1}^{m}a_{k\ell}x_\ell\Big|^2\le\Big(\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)\Big(\sum_{\ell=1}^{m}|x_\ell|^2\Big)=\Big(\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)\|x\|_2^2,\]<p>Summation über \(k\) liefert</p>\[\|Ax\|_2\le C\,\|x\|_2,\qquad C=\Big(\sum_{k=1}^{n}\sum_{\ell=1}^{m}|a_{k\ell}|^2\Big)^{1/2}.\]<p><b>Zahlenbeispiel.</b> \(A\) mit den Zeilen \((1,2)\) und \((0,1)\): \(C=\sqrt{1+4+0+1}=\sqrt6\approx2{,}449\).</p><p><b>Achtung:</b> \(C\) ist hier nur eine obere Schranke, nicht die Operatornorm. Schritt 4 des Rezepts scheitert — kein Einheitsvektor erreicht \(\sqrt6\). Tatsächlich ist \(\|A\|_{\mathcal{L}}=1+\sqrt2\approx2{,}414\) — Zusatz über die Vorlesung hinaus: das ist der größte Singulärwert, denn \(A^{T}A\) hat den größten Eigenwert \(3+2\sqrt2=(1+\sqrt2)^2\). Für den Nachweis der Stetigkeit reicht die Frobenius-Schranke völlig aus.</p>`,"Rechenweg Matrixoperator")}
    </td><td class="cond">\(E=\mathbb{K}^m\), \(F=\mathbb{K}^n\), jeweils \(\|\cdot\|_2\)</td></tr>
  </table>
</div>`; }

function frechetHtml(){ return String.raw`
<p class="sub">Ableiten, wenn der „Punkt“ ein Vektor oder eine ganze Funktion ist. Das Blatt sortiert die fünf Stufen der Ableitungsbegriffe, gibt die Rezepte zum Nachweis, die Rechenregeln, die Mittelwertungleichungen und den Katalog der Funktionenraum-Beispiele. Grundeinstellung überall: \(E,F\) normierte Räume über \(\mathbb{K}\), \(\mathcal{U}\subset E\) offen, \(x_0\in\mathcal{U}\), \(f:\mathcal{U}\subset E\to F\), Zuwachs \(h\in E\).</p>

<div class="refblock">
<h3>Die Hierarchie — fünf Stufen, vier Pfeile</h3>
<p class="sub"><b>stetig differenzierbar</b> \(\Longrightarrow\) <b>Fréchet</b> \(\Longrightarrow\) <b>Gâteaux (schwach)</b> \(\Longrightarrow\) <b>alle Richtungsableitungen</b> \(\Longrightarrow\) <b>alle partiellen Ableitungen</b>. Keiner dieser Pfeile lässt sich ohne Zusatzvoraussetzung umkehren.</p>
<table class="reftable">
