        worte: String.raw`<p>Eigenschaft 2 sagt: Die Fréchet-Ableitung ist die stärkere Information, die Richtungsableitung steckt in ihr bereits drin. Anschaulich ist das klar — die Fréchet-Bedingung \(f(x_0+h)=f(x_0)+f'(x_0)h+o\!\left(\|h\|_E\right)\) gilt für <i>alle</i> kleinen Zuwächse gleichzeitig. Schränkt man sie auf die Zuwächse einer einzigen Geraden ein, ersetzt also \(h\) durch \(t\cdot h\) mit festem \(h\), so bleibt eine eindimensionale Entwicklung erster Ordnung übrig, deren linearer Koeffizient gerade \(f'(x_0)h\) ist. Rechnerisch ist der ganze Beweis nichts anderes als das Herausziehen des Skalars \(t\) aus dem linearen Term und die Beobachtung, dass \(o\!\left(\|h\|_E|t|\right)\) bei festem \(h\) einfach \(o(|t|)\) ist.</p><p>Im Fréchet-Fall erbt \(h\mapsto Df(x_0)[h]=f'(x_0)h\) damit automatisch Linearität und Stetigkeit. Umgekehrt geht es schief: Richtungsableitungen sehen nur einzelne Geraden und sagen nichts über das Verhalten <i>zwischen</i> ihnen. Es können deshalb alle Richtungsableitungen existieren, ohne dass \(h\mapsto Df(x_0)[h]\) auch nur additiv wäre — und dann kann es nach Eigenschaft 2 erst recht keine Fréchet-Ableitung geben. Genau so führt man Nicht-Differenzierbarkeit elegant vor: nicht über Restgliedabschätzungen, sondern über die verletzte Linearität.</p>`,
        erfuellt: String.raw`<p><b>Fréchet-differenzierbar — die Richtungsableitung ist die Jacobi-Zeile.</b> \(f:\mathbb{R}^2\to\mathbb{R}\), \(f(x_1,x_2)=x_1^2+3x_2^2+x_1+2\), Aufpunkt \(x^{(0)}=(1,2)\), Richtung \(h=(\alpha_1,\alpha_2)\).</p><p><i>Über die Fréchet-Ableitung:</i> die Vorlesung hat \(\mathcal{J}_{x^{(0)}}(f)=\left(2x_1^{(0)}+1,\ 6x_2^{(0)}\right)\) berechnet, hier also \(\mathcal{J}_{(1,2)}(f)=(3,\ 12)\) und somit \(f'\!\left(x^{(0)}\right)h=3\alpha_1+12\alpha_2\).</p><p><i>Direkt über \(\varphi_h\):</i> mit \(f(1,2)=1+12+1+2=16\) ist</p>\[\varphi_h(t)=\left(1+t\alpha_1\right)^2+3\left(2+t\alpha_2\right)^2+\left(1+t\alpha_1\right)+2=16+t\left(3\alpha_1+12\alpha_2\right)+t^2\left(\alpha_1^2+3\alpha_2^2\right),\]\[Df\!\left(x^{(0)}\right)[h]=\left.\frac{d\varphi_h}{dt}\right|_{t=0}=3\alpha_1+12\alpha_2=\mathcal{J}_{x^{(0)}}(f)\,h .\]<p>Beides stimmt überein, und \(h\mapsto3\alpha_1+12\alpha_2\) ist linear und stetig — so muss es nach Eigenschaft 2 sein.</p>`,
        verletzt: String.raw`<p><b>Alle Richtungsableitungen existieren, trotzdem gibt es keine Fréchet-Ableitung</b> (Tafelbeispiel). Es bezeichne \(\sqrt[3]{\;\cdot\;}\) die auf ganz \(\mathbb{R}\) erklärte Umkehrfunktion von \(x\mapsto x^3\). Sei</p>\[f:\mathbb{R}^2\to\mathbb{R},\qquad f(x_1,x_2)=\sqrt[3]{x_1^3+x_2^3},\qquad x^{(0)}=(0,0),\quad h=(h_1,h_2).\]<p><i>Schritt 1 (Richtungsableitungen ausrechnen).</i></p>\[\varphi_h(t)=f\!\left(x^{(0)}+th\right)=\sqrt[3]{(th_1)^3+(th_2)^3}=\sqrt[3]{t^3\left(h_1^3+h_2^3\right)}=t\,\sqrt[3]{h_1^3+h_2^3}.\]<p>\(\varphi_h\) ist also linear in \(t\) (auch für \(t<0\), da die dritte Wurzel auf ganz \(\mathbb{R}\) definiert und ungerade ist), und für <b>jedes</b> \(h\) existiert</p>\[Df(0,0)[h]=\left.\frac{d\varphi_h}{dt}\right|_{t=0}=\sqrt[3]{h_1^3+h_2^3}.\]<p><i>Schritt 2 (die Abhängigkeit von \(h\) ist nicht additiv).</i> Mit \(e_1=(1,0)\), \(e_2=(0,1)\):</p>\[Df(0,0)[e_1]=\sqrt[3]{1}=1,\qquad Df(0,0)[e_2]=1,\qquad Df(0,0)[e_1+e_2]=\sqrt[3]{2}\approx1{,}26 .\]\[\sqrt[3]{2}\ \neq\ 2=Df(0,0)[e_1]+Df(0,0)[e_2].\]<p><i>Schritt 3 (Schluss).</i> Wäre \(f\) in \((0,0)\) Fréchet-differenzierbar, so wäre nach Eigenschaft 2 \(Df(0,0)[h]=f'(0,0)h\) linear in \(h\), insbesondere additiv — Widerspruch. Also besitzt \(f\) in \(x^{(0)}=(0,0)\) keine Fréchet-Ableitung. Homogen ist \(Df(0,0)[\,\cdot\,]\) übrigens sehr wohl, denn \(\sqrt[3]{\alpha^3\left(h_1^3+h_2^3\right)}=\alpha\sqrt[3]{h_1^3+h_2^3}\) — im Einklang mit Eigenschaft 1 aus <a href="#/7.4.1">7.4.1</a>.</p>`,
        plus: String.raw`<p><b>Klausurfalle.</b> Im Gegenbeispiel existieren beide partiellen Ableitungen in \((0,0)\) und sind gleich \(1\); die naiv hingeschriebene „Jacobi-Zeile“ \((1,1)\) würde \(Df(0,0)[h]=h_1+h_2\) suggerieren. Die wahre Richtungsableitung ist aber \(\sqrt[3]{h_1^3+h_2^3}\). Die Formel \(Df\!\left(x^{(0)}\right)[h]=\mathcal{J}_{x^{(0)}}(f)\,h\) ist eine <i>Folgerung</i> aus der Fréchet-Differenzierbarkeit und darf nie als Ersatz für deren Nachweis benutzt werden.</p><p><b>Roter Faden.</b> Es gilt die Kette: Fréchet-differenzierbar \(\Rightarrow\) Gâteaux-differenzierbar \(\Rightarrow\) alle Richtungsableitungen existieren. Keiner der beiden Pfeile lässt sich ohne Zusatzvoraussetzung umkehren: Der zweite Rückweg scheitert am Beispiel dieser Karte (\(Df(x_0)[\,\cdot\,]\) nicht linear), der erste am Spiralbeispiel in <a href="#/7.4.3">7.4.3</a>. Eine hinreichende Bedingung, die den Weg zurück doch gangbar macht, liefert erst <a href="#/7.4.4">7.4.4</a>.</p>`}},
       {id:"7.4.3", title:"Die schwache Ableitung (Gâteaux)", body:{
        def: String.raw`<p><b>Definition (schwache Ableitung / Gâteaux-Ableitung).</b> Sei \(U\subset E\) <b>offen</b>, \(f:U\subset E\to F\) und \(x_0\in U\). Es sollen</p><ul><li>alle Richtungsableitungen \(Df(x_0)[h]\), \(h\in E\), existieren und</li><li>die Abbildung \(Df(x_0)[\,\cdot\,]:E\to F,\ h\mapsto Df(x_0)[h]\), <b>linear und stetig</b> sein.</li></ul><p>Dann nennen wir den dadurch erklärten Operator \(f'_S(x_0)\in\mathcal{L}(E,F)\) mit</p>\[f'_S(x_0)\,h=Df(x_0)[h]\qquad\text{für alle }h\in E\]<p>die <b>schwache Ableitung</b> (Gâteaux-Ableitung) von \(f\) in \(x_0\); \(f\) heißt dann in \(x_0\) Gâteaux-differenzierbar.</p><p><b>Anmerkung.</b> Ist \(f\) in \(x_0\in U\) Fréchet-differenzierbar, so existiert die schwache Ableitung und es ist \(f'_S(x_0)=f'(x_0)\in\mathcal{L}(E,F)\).</p><p><b>Anmerkung.</b> Die Umkehrung gilt im Allgemeinen nicht.</p>`,
        worte: String.raw`<p>Die Gâteaux-Ableitung ist der Versuch, aus den vielen einzelnen Richtungsableitungen wieder <i>einen</i> Operator zu machen. Verlangt wird dazu genau das, was die Richtungsableitung von sich aus nicht hergibt: dass \(h\mapsto Df(x_0)[h]\) linear und stetig ist, also ein Element von \(\mathcal{L}(E,F)\) — dasselbe Objekt, das auch die Fréchet-Ableitung ist. Der Unterschied liegt also nicht im Typ des Ergebnisses, sondern darin, wie man es gewinnt.</p><p>Was gegenüber Fréchet fehlt, ist die <b>Gleichmäßigkeit</b>. Gâteaux fordert zweierlei: dass \(h\mapsto Df(x_0)[h]\) linear und stetig ist, und dass für jede <i>feste</i> Richtung \(h\) gilt \(f(x_0+th)=f(x_0)+t\,f'_S(x_0)h+o(|t|)\) für \(t\to0\) — mit einem Restterm, der von der Richtung abhängen darf. Fréchet fordert dagegen \(o\!\left(\|h\|_E\right)\) für \(h\to\mathbf{0}_E\) <i>ohne</i> Rücksicht darauf, aus welcher Richtung \(h\) kommt. In dieser Lücke lebt das Spiralbeispiel: Längs jeder einzelnen Geraden ist die Funktion nahe \(x_0\) sogar identisch Null, und trotzdem gibt es beliebig nahe an \(x_0\) Punkte, an denen sie im Vergleich zu \(\|h\|\) nicht klein ist.</p><p>Das tiefgestellte \(S\) in \(f'_S\) steht für „schwach“. Im \(\mathbb{R}^m\) ist die Stetigkeitsforderung automatisch erfüllt (jede lineare Abbildung auf einem endlichdimensionalen Raum ist stetig), dort muss man nur die Linearität von \(Df(x_0)[\,\cdot\,]\) prüfen.</p>`,
        erfuellt: String.raw`<p><b>Gâteaux-differenzierbar, aber nicht Fréchet-differenzierbar</b> — das Spiralbeispiel der Vorlesung. Sei \(\Gamma\) die archimedische Spirale</p>\[\Gamma=\Big\{\varphi\left(\cos\varphi,\ \sin\varphi\right)\ :\ \varphi\in\left]0,2\pi\right]\Big\}\subset\mathbb{R}^2\]<p>— der Spiralpunkt zum Winkel \(\varphi\) hat also vom Ursprung den Abstand \(\varphi\) — und</p>\[f(x)=\begin{cases}0,& x\in\mathbb{R}^2\setminus\Gamma,\\[2pt] \varphi,& x=\varphi\left(\cos\varphi,\sin\varphi\right)\in\Gamma.\end{cases}\]<p>Wegen \(\varphi>0\) ist \(\mathbf{0}_2\notin\Gamma\), also \(f(\mathbf{0}_2)=0\).</p><p><i>Schritt 1 (alle Richtungsableitungen sind Null).</i> Für \(h=\mathbf{0}_2\) ist \(\varphi_h\equiv f(\mathbf{0}_2)=0\), also \(Df(0,0)[\mathbf{0}_2]=0\). Sei nun \(h\neq\mathbf{0}_2\) fest. Ein Punkt von \(\Gamma\) mit Polarwinkel \(\vartheta\) gehört zu einem \(\varphi\in\left]0,2\pi\right]\) mit \(\varphi\equiv\vartheta\) modulo \(2\pi\) — pro Winkel gibt es also genau einen Spiralpunkt, und sein Abstand zum Ursprung ist \(\varphi>0\). Die Gerade \(\{t\,h:t\in\mathbb{R}\}\) realisiert nur zwei Winkel (den von \(h\) und den entgegengesetzten), trifft \(\Gamma\) daher in höchstens zwei Punkten, und jeder davon hat positiven Abstand zum Ursprung. Es gibt folglich ein \(\rho>0\) mit</p>\[x\in\{t\,h:t\in\mathbb{R}\},\ \ 0<\|x\|<\rho\quad\Longrightarrow\quad x\notin\Gamma .\]<p>Für \(0<|t|<\rho/\|h\|\) ist somit \(f(t\,h)=0\) und daher</p>\[Df(0,0)[h]=\lim_{t\to0}\frac{f(\mathbf{0}_2+t\,h)-f(\mathbf{0}_2)}{t}=\lim_{t\to0}\frac{0-0}{t}=0 .\]<p><i>Schritt 2 (schwache Ableitung).</i> \(Df(0,0)[\,\cdot\,]\equiv0\) ist linear und stetig, also ist \(f\) in \((0,0)\) Gâteaux-differenzierbar mit</p>\[f'_S(0,0)=\mathbf{0}\in\mathcal{L}\!\left(\mathbb{R}^2,\mathbb{R}\right)\quad(\text{Nulloperator}).\]<p><i>Schritt 3 (keine Fréchet-Ableitung).</i> Fréchet-Differenzierbarkeit würde bedeuten</p>\[f(\mathbf{0}_2+h)=\underbrace{f(\mathbf{0}_2)}_{=0}+\underbrace{\mathbf{0}\,h}_{=0}+o(\|h\|),\qquad\text{also}\qquad f(h)=o(\|h\|).\]<p>Wähle aber \(h_n=\varphi_n\left(\cos\varphi_n,\sin\varphi_n\right)\in\Gamma\) mit \(\varphi_n=\frac1n\to0\). Dann ist \(\|h_n\|=\varphi_n\) und \(f(h_n)=\varphi_n\), also</p>\[\frac{\left|f(h_n)\right|}{\|h_n\|}=1\ \not\longrightarrow\ 0\qquad(n\to\infty).\]<p>Der Restterm ist nur \(O(\|h\|)\) und nicht \(o(\|h\|)\): die notwendige Restgliedabschätzung gilt nicht. Also ist \(f'_S(0,0)=\mathbf{0}\) <b>nicht</b> die Fréchet-Ableitung — und da nach Eigenschaft 2 aus <a href="#/7.4.2">7.4.2</a> jede Fréchet-Ableitung mit \(f'_S(0,0)\) übereinstimmen müsste, existiert in \((0,0)\) überhaupt keine.</p>`,
        verletzt: String.raw`<p><b>Nicht Gâteaux-differenzierbar, obwohl alle Richtungsableitungen existieren.</b> Für \(f(x_1,x_2)=\sqrt[3]{x_1^3+x_2^3}\) aus <a href="#/7.4.2">7.4.2</a> wurde ausgerechnet</p>\[Df(0,0)[h]=\sqrt[3]{h_1^3+h_2^3}\qquad\text{für alle }h=(h_1,h_2)\in\mathbb{R}^2 .\]<p>Die erste Forderung der Definition ist damit erfüllt. Die zweite scheitert an der Additivität:</p>\[Df(0,0)\big[(1,0)\big]+Df(0,0)\big[(0,1)\big]=1+1=2\ \neq\ \sqrt[3]{2}=Df(0,0)\big[(1,1)\big].\]<p>Also ist \(Df(0,0)[\,\cdot\,]\) nicht linear, und es gibt <b>kein</b> \(f'_S(0,0)\in\mathcal{L}\!\left(\mathbb{R}^2,\mathbb{R}\right)\) mit \(f'_S(0,0)h=Df(0,0)[h]\). Die Funktion ist in \((0,0)\) nicht Gâteaux-differenzierbar — und damit erst recht nicht Fréchet-differenzierbar.</p>`,
        plus: String.raw`<p><b>Notation.</b> Für den Nullvektor bzw. den Nulloperator schreibt die Vorlesung eine <i>durchgestrichene</i> Null (Doppelstrich-Null), meist mit Raumindex; da KaTeX dieses Zeichen nicht kennt, steht hier \(\mathbf{0}_E\), \(\mathbf{0}_2\) bzw. \(\mathbf{0}\). Entsprechend wird die Identität an der Tafel als doppelt gestrichene Eins geschrieben, hier \(\mathbf{1}\).</p><p><b>Einordnung.</b> Die drei Begriffe verhalten sich so: Fréchet-differenzierbar \(\Rightarrow\) Gâteaux-differenzierbar \(\Rightarrow\) Existenz aller Richtungsableitungen. Die Spirale trennt die erste Implikation (Gâteaux ohne Fréchet), die dritte Wurzel die zweite (Richtungsableitungen ohne Gâteaux). Beide Gegenbeispiele leben im \(\mathbb{R}^2\) — es ist also kein Phänomen unendlichdimensionaler Räume.</p><p><b>Gut zu wissen.</b> Die Spiralfunktion ist in \((0,0)\) sogar <i>stetig</i>: für \(x\in\Gamma\) ist \(f(x)=\varphi=\|x\|\), also \(|f(x)|\le\|x\|\to0\). An der Stetigkeit von \(f\) liegt es also nicht; es fehlt allein die Gleichmäßigkeit der Restgliedabschätzung. Welche Zusatzvoraussetzung diese Gleichmäßigkeit erzwingt, klärt <a href="#/7.4.4">7.4.4</a>.</p>`}},
       {id:"7.4.4", title:"Hinreichende Bedingung für Fréchet-Differenzierbarkeit", body:{
        def: String.raw`<p><b>Satz (*) — hinreichende Bedingung für Fréchet-Differenzierbarkeit.</b> Sei \(U\subset E\) offen, \(x_0\in U\) und \(f:U\subset E\to F\). Für ein gewisses \(\varepsilon>0\) gelte:</p><ul><li>\(f\) ist in <b>allen</b> Punkten von \(U_\varepsilon(x_0)\subset U\) Gâteaux-differenzierbar, und</li><li>die Abbildung</li></ul>\[f'_S(\cdot):\ U_\varepsilon(x_0)\longrightarrow\mathcal{L}(E,F),\qquad x\longmapsto f'_S(x)\]<p>ist stetig auf \(U_\varepsilon(x_0)\) (Stetigkeit bezüglich der Operatornorm \(\|\cdot\|_{\mathcal{L}(E,F)}\)).</p><p>Dann existiert die Fréchet-Ableitung von \(f\) in \(x_0\), und es ist</p>\[f'(x_0)=f'_S(x_0).\]<p>An der Tafel steht „Beweis folgt später“ — er wird mit dem Hauptsatz der Differentialrechnung (§7.5) geführt.</p><p><b>Beweisidee in vier Schritten.</b></p><ul><li><b>1.</b> Zu zeigen ist \(f(x_0+h)-f(x_0)-f'_S(x_0)h=o\!\left(\|h\|_E\right)\) für \(h\to\mathbf{0}_E\).</li><li><b>2.</b> Setze \(a=x_0\), \(b=x_0+h\), also \(b-a=h\). Für \(\|h\|_E<\varepsilon\) liegt die Verbindungsstrecke \(\overline{ab}\) ganz in \(U_\varepsilon(x_0)\), dort ist \(f\) in jedem Punkt Gâteaux-differenzierbar.</li><li><b>3.</b> Die Mittelwertungleichung (2) des Hauptsatzes (§7.5) liefert</li></ul>\[\left\|f(x_0+h)-f(x_0)-f'_S(x_0)h\right\|_F\ \le\ \sup_{x\in\overset{\circ}{\overline{ab}}}\left\|f'_S(x)-f'_S(x_0)\right\|_{\mathcal{L}(E,F)}\cdot\|h\|_E .\]<ul><li><b>4.</b> Weil \(x\mapsto f'_S(x)\) in \(x_0\) stetig ist, gibt es zu jedem \(\eta>0\) ein \(\delta_\eta>0\), so dass das Supremum \(\le\eta\) ist, sobald \(\|h\|_E<\delta_\eta\). Die rechte Seite ist dann \(\le\eta\,\|h\|_E\), also \(o\!\left(\|h\|_E\right)\). (Die Tafel benutzt hier denselben Buchstaben \(\varepsilon\) wie für den Kugelradius.)</li></ul>`,
        worte: String.raw`<p>Der Satz schließt genau die Lücke, die das Spiralbeispiel aufgerissen hat. Gâteaux-Differenzierbarkeit <i>in einem einzigen Punkt</i> kontrolliert \(f\) nur längs der Geraden durch diesen Punkt; jede Gerade darf ihr eigenes Restglied mitbringen, und über das Verhalten dazwischen ist nichts gesagt. Fordert man dagegen Gâteaux-Differenzierbarkeit auf einer <b>ganzen Kugel</b> \(U_\varepsilon(x_0)\) und zusätzlich, dass sich der Ableitungsoperator \(f'_S(x)\) beim Wandern des Punktes \(x\) stetig verhält, so lassen sich die Einzelinformationen der Geraden zu einer gleichmäßigen Aussage zusammenbinden. Technisch geschieht das über die Mittelwertungleichung, die \(f(b)-f(a)\) durch das Supremum der Ableitungsnormen auf der Verbindungsstrecke abschätzt: Ein Supremum über die Strecke ist eben eine Aussage über alle Zwischenpunkte, nicht nur über die Endpunkte.</p><p>Praktisch ist Satz (*) das Arbeitspferd der Differentialrechnung in normierten Räumen. Die Richtungsableitung \(Df(x)[h]=\left.\frac{d}{dt}f(x+th)\right|_{t=0}\) ist eine gewöhnliche Ableitung nach einer skalaren Variablen und daher meist in zwei Zeilen ausgerechnet. Man prüft anschließend Linearität und Stetigkeit in \(h\) sowie die Stetigkeit in \(x\) — und ist die mühsame Restgliedabschätzung der Fréchet-Definition los. Im \(\mathbb{R}^m\) entspricht das der vertrauten Situation: dort tritt an die Stelle der Stetigkeit von \(x\mapsto f'_S(x)\) die Stetigkeit der partiellen Ableitungen, und man erhält den klassischen Satz „stetig partiell differenzierbar auf einer Umgebung \(\Rightarrow\) total differenzierbar“. Verwechseln darf man beides nicht: Die bloße Existenz der partiellen Ableitungen liefert noch keine Gâteaux-Differenzierbarkeit, denn dazu muss \(h\mapsto Df(x)[h]\) linear sein — genau daran scheitert das Beispiel der dritten Wurzel in <a href="#/7.4.2">7.4.2</a>.</p>`,
        beispiel: String.raw`<p><b>Das quadratische Funktional der Vorlesung, diesmal über Satz (*).</b> Sei \(E=C^1([a,b],\mathbb{R})\) mit \(\|y\|_{C^1}=\|y\|_C+\|y'\|_C\), \(F=\mathbb{R}\), \(a< b\), \(V\in C([a,b],\mathbb{R})\) und</p>\[I(y)=\int_a^b\Big(\left(y'(x)\right)^2-V(x)\left(y(x)\right)^2\Big)\,dx .\]<p>(Die Buchstaben \(a,b\) bezeichnen hier die Intervallenden, nicht die beiden Punkte der Verbindungsstrecke aus dem Beweis.)</p><p><i>Schritt 1: Richtungsableitung.</i> Für \(y,h\in C^1\) ist \(t\mapsto I(y+th)\) ein quadratisches Polynom in \(t\) (nachgerechnet in <a href="#/7.4.1">7.4.1</a>), also</p>\[DI(y)[h]=2\int_a^b\Big(y'(x)h'(x)-V(x)y(x)h(x)\Big)dx .\]<p><i>Schritt 2: linear und stetig in \(h\).</i> Die Linearität in \(h\) sieht man dem Ausdruck an. Für die Stetigkeit schätzt man mit \(\|h\|_C\le\|h\|_{C^1}\) und \(\|h'\|_C\le\|h\|_{C^1}\) ab:</p>\[\left|DI(y)[h]\right|\le2(b-a)\Big(\|y'\|_C\|h'\|_C+\|V\|_C\|y\|_C\|h\|_C\Big)\le M(y)\,\|h\|_{C^1},\]<p>mit \(M(y)=2(b-a)\left(\|y'\|_C+\|V\|_C\|y\|_C\right)\). Also existiert \(I'_S(y)\in\mathcal{L}\!\left(C^1,\mathbb{R}\right)\) mit \(I'_S(y)h=DI(y)[h]\): \(I\) ist in jedem \(y\in C^1\) Gâteaux-differenzierbar.</p><p><i>Schritt 3: \(y\mapsto I'_S(y)\) ist stetig.</i> Für \(y,z\in C^1\) und \(u=y-z\) ist \(\left(I'_S(y)-I'_S(z)\right)h=2\int_a^b\left(u'h'-Vuh\right)dx\), also mit derselben Abschätzung</p>\[\left|\left(I'_S(y)-I'_S(z)\right)h\right|\le2(b-a)\left(1+\|V\|_C\right)\|y-z\|_{C^1}\,\|h\|_{C^1}\]<p>und nach Übergang zum Supremum über alle \(h\) mit \(\|h\|_{C^1}\le1\)</p>\[\left\|I'_S(y)-I'_S(z)\right\|_{\mathcal{L}(C^1,\mathbb{R})}\le2(b-a)\left(1+\|V\|_C\right)\|y-z\|_{C^1}.\]<p>Die Abbildung \(y\mapsto I'_S(y)\) ist also sogar Lipschitz-stetig, insbesondere stetig auf jeder Kugel \(U_\varepsilon(y_0)\).</p><p><i>Schluss.</i> Satz (*) liefert: \(I\) ist in jedem \(y_0\in C^1\) Fréchet-differenzierbar mit</p>\[I'(y_0)h=2\int_a^b\Big(y_0'(x)h'(x)-V(x)y_0(x)h(x)\Big)dx .\]<p>Das ist genau der Hauptterm, den die Vorlesung zuvor über die direkte Restgliedabschätzung \(\int_a^b\left(\left(h'\right)^2-Vh^2\right)dx=o\!\left(\|h\|_{C^1}\right)\) gewonnen hatte — hier fällt er ganz ohne Restgliedrechnung ab.</p>`,
        plus: String.raw`<p><b>Warum jede Voraussetzung gebraucht wird.</b> Die Spiralfunktion aus <a href="#/7.4.3">7.4.3</a> ist in \((0,0)\) Gâteaux-differenzierbar — und außerhalb von \(\Gamma\) ebenfalls, denn dort verschwindet sie lokal identisch. In den Punkten \(x\in\Gamma\) dagegen existiert keine einzige Richtungsableitung: Eine Gerade trifft die nirgends geradlinige Spirale in der Nähe von \(x\) nur in \(x\) selbst, längs jeder Richtung ist also \(f=0\) für kleine \(t\neq0\), während \(f(x)=\varphi>0\) ist; der Differenzenquotient \(\frac{0-\varphi}{t}\) divergiert. Da jede Kugel \(U_\varepsilon(0,0)\) Punkte von \(\Gamma\) enthält (nimm \(\varphi<\varepsilon\)), ist die erste Voraussetzung von Satz (*) — Gâteaux-Differenzierbarkeit in <i>allen</i> Punkten einer Umgebung — verletzt, und der Schluss auf die Fréchet-Differenzierbarkeit fällt zu Recht aus. Die Forderung „in allen Punkten einer Umgebung“ ist also keine Bequemlichkeit, sondern der Kern der Sache.</p><p><b>Roter Faden.</b> \(f'\) existiert \(\Rightarrow\) \(f'_S\) existiert und stimmt mit \(f'\) überein (<a href="#/7.4.3">7.4.3</a>); zurück geht es mit Satz (*), also unter der Zusatzforderung, dass \(f'_S\) auf einer Umgebung existiert und dort stetig von \(x\) abhängt. Der Beweis benutzt die Mittelwertungleichungen des Hauptsatzes der Differentialrechnung (§7.5) und ist deren erste ernsthafte Anwendung; zum Vergleich mit der eindimensionalen Situation siehe den Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p><p><b>Klausurtipp.</b> Wird nach der Fréchet-Ableitung eines Funktionals oder Operators gefragt, sind zwei Wege erlaubt: (a) direkt entwickeln, Hauptterm als Element von \(\mathcal{L}(E,F)\) identifizieren und das Restglied als \(o\!\left(\|h\|_E\right)\) abschätzen; (b) \(Df(x)[h]\) über \(\left.\frac{d}{dt}f(x+th)\right|_{t=0}\) berechnen und Satz (*) anwenden. Weg (b) ist fast immer der kürzere — dann muss man aber die Stetigkeit von \(x\mapsto f'_S(x)\) in der Operatornorm wirklich nachweisen, sonst hat man nur die schwache Ableitung in der Hand.</p>`}}]},
    {id:"7.5", t:"Der Hauptsatz der Differentialrechnung", topics:[
       {id:"7.5.1", title:"Verbindungsstrecke und Mittelwertungleichungen", body:{
        def: String.raw`<p>Es seien \((E,\|\cdot\|_E)\) und \((F,\|\cdot\|_F)\) normierte Räume, \(\mathcal U\subset E\) offen und \(a,b\in\mathcal U\).</p><p><b>Verbindungsstrecke.</b> Die abgeschlossene bzw. die offene Strecke von \(a\) nach \(b\) sind</p>\[\overline{ab}=\big\{x=a+t(b-a)\ :\ t\in[0,1]\big\},\qquad \overset{\circ}{\overline{ab}}=\overline{ab}\setminus\{a,b\}.\]<p>Vorausgesetzt wird stets \(\overline{ab}\subset\mathcal U\) (die offene Menge \(\mathcal U\) muss nicht konvex sein!).</p><p><b>Satz (Hauptsatz der Differentialrechnung).</b> Sei \(f:\mathcal U\subset E\to F\) in <i>jedem</i> Punkt von \(\overline{ab}\) Gateaux-differenzierbar. Dann gilt</p>\[(1)\quad \big\|f(b)-f(a)\big\|_F\ \le\ \sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)\big\|_{\mathcal L(E,F)}\cdot\big\|b-a\big\|_E,\]\[(2)\quad \big\|f(b)-f(a)-f'_S(a)(b-a)\big\|_F\ \le\ \sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)-f'_S(a)\big\|_{\mathcal L(E,F)}\cdot\big\|b-a\big\|_E.\]<p>Der Beweis von (1) steht in <a href="#/7.5.3">7.5.3</a>; (2) folgt aus (1) (siehe unten).</p>`,
        worte: String.raw`<p>Der eindimensionale Mittelwertsatz \(f(b)-f(a)=f'(\xi)\,(b-a)\) hat in normierten Räumen <i>kein</i> Gegenstück: einen Zwischenpunkt \(\xi\), der die Differenz exakt trifft, gibt es im Allgemeinen nicht (Gegenbeispiel in <a href="#/7.5.3">7.5.3</a>). Was übrig bleibt und was man tatsächlich braucht, ist eine <b>Schranke</b> — in der Literatur heißt der Satz deshalb auch Schrankensatz; an der Tafel steht nur „Satz“ unter der Überschrift 7.5.</p><p>Aussage (1) liest sich als Tempolimit-Argument: die Gesamtänderung \(\|f(b)-f(a)\|_F\) ist höchstens die größte „Steigung“ längs der Strecke, gemessen in der Operatornorm von \(f'_S(x)\), mal die zurückgelegte Länge \(\|b-a\|_E\). Ist die Ableitung längs \(\overline{ab}\) durch \(L\) beschränkt, so ist \(f\) auf der Strecke Lipschitz-stetig mit Konstante \(L\) (man wende (1) auf Teilstrecken an).</p><p>Aussage (2) ist die geschärfte, <i>linearisierte</i> Fassung: links steht nicht mehr die Differenz selbst, sondern der Fehler der linearen Approximation \(f(a)+f'_S(a)(b-a)\); rechts misst das Supremum, wie stark die Ableitung längs der Strecke von ihrem Wert in \(a\) abweicht, also die <b>Oszillation</b> von \(f'_S\). Genau in dieser Form braucht man den Satz: ist \(f'_S\) stetig, so wird die rechte Seite beliebig klein gegenüber \(\|b-a\|_E\) — und das ist exakt die Restgliedbedingung der Frechet-Ableitung.</p><p>Bemerkenswert ist, wie wenig vorausgesetzt wird: nur <b>Gateaux</b>-Differenzierbarkeit, und diese nur in den Punkten der Strecke. Das genügt, weil im Beweis \(f'_S(x)\) nur in der einen Richtung \(h=b-a\) ausgewertet wird; die für die Frechet-Ableitung typische Gleichmäßigkeit in allen Richtungen wird nicht gebraucht. In den Suprema läuft \(x\) nur über die <i>offene</i> Strecke \(\overset{\circ}{\overline{ab}}\), die Werte von \(f'_S\) in \(a\) und \(b\) gehen also in die Suprema nicht ein — in (2) tritt \(f'_S(a)\) natürlich trotzdem auf, dort aber als fester Vergleichswert. Gebraucht wird die Differenzierbarkeit in den Endpunkten nur, damit die Hilfsfunktion des Beweises bis an den Rand von \([0,1]\) stetig ist.</p>`,
        beispiel: String.raw`<p><b>Zahlenprobe zu (1) und (2).</b> Sei \(E=\mathbb R^2\) mit der euklidischen Norm, \(F=\mathbb R\), \(\mathcal U=E\) und</p>\[f(x)=x_1^2+x_2^2,\qquad a=(1,0)^{T},\quad b=(0,1)^{T},\quad b-a=(-1,1)^{T},\ \ \|b-a\|_E=\sqrt2 .\]<p><i>Ableitung.</i> \(f\) ist ein Polynom, also überall Frechet- und damit Gateaux-differenzierbar mit \(f'_S(x)h=2x_1h_1+2x_2h_2\). Die Operatornorm eines solchen Funktionals auf dem euklidischen \(\mathbb R^2\) ist die Länge seines Koeffizientenvektors:</p>\[\big\|f'_S(x)\big\|_{\mathcal L(E,F)}=\big\|(2x_1,2x_2)\big\|=2\,\|x\|_E .\]<p><i>Strecke.</i> \(x(t)=a+t(b-a)=(1-t,\;t)^{T}\), also \(\|x(t)\|_E=\sqrt{(1-t)^2+t^2}\) und \(\sup_{t\in\left]0,1\right[}\|x(t)\|_E=1\) (Wert an den Enden, auf der offenen Strecke nicht angenommen).</p><p><i>(1) prüfen.</i> Links \(\|f(b)-f(a)\|_F=|1-1|=0\); rechts \(2\cdot 1\cdot\sqrt2=2\sqrt2\). Also \(0\le 2\sqrt2\) — richtig, aber grob.</p><p><i>(2) prüfen.</i> Es ist \(f'_S(a)(b-a)=2\cdot 1\cdot(-1)+2\cdot 0\cdot 1=-2\), links also</p>\[\big|f(b)-f(a)-f'_S(a)(b-a)\big|=\big|0-(-2)\big|=2 .\]<p>Rechts hat \(f'_S(x(t))-f'_S(a)\) den Koeffizientenvektor \(\big(2(1-t)-2,\;2t\big)=(-2t,\,2t)\) mit Norm \(2t\sqrt2\); das Supremum über \(\left]0,1\right[\) ist \(2\sqrt2\), und</p>\[2\ \le\ 2\sqrt2\cdot\sqrt2\ =\ 4 .\]<p>Beide Ungleichungen gelten, keine mit Gleichheit: der Satz liefert Schranken, keine exakten Werte.</p><p><b>Anwendung A (Tafel): aus (1) folgt (2).</b> (2) muss nicht separat bewiesen werden — es ist (1), angewendet auf eine passend „begradigte“ Funktion.</p><p><i>Schritt 1 (Hilfsfunktion).</i> Setze \(\varphi:\mathcal U\subset E\to F\),</p>\[\varphi(x)=f(x)-f'_S(a)(x-a),\qquad a,x\in\mathcal U\subset E.\]<p>Typkontrolle wie an der Tafel: \(f(x)\in F\), \(f'_S(a)\in\mathcal L(E,F)\), \(x-a\in E\), also \(f'_S(a)(x-a)\in F\) — die Differenz ist wohldefiniert in \(F\).</p><p><i>Schritt 2 (Randwerte).</i> Wegen \(\varphi(a)=f(a)-f'_S(a)\mathbf{0}_E=f(a)\) ist</p>\[\varphi(b)-\varphi(a)=f(b)-f'_S(a)(b-a)-f(a).\]<p><i>Schritt 3 (Ableitung der Hilfsfunktion).</i> Der Zusatzterm ist affin, sein Differenzenquotient in Richtung \(h\) ist konstant:</p>\[\frac{f'_S(a)\big((x+th)-a\big)-f'_S(a)(x-a)}{t}=\frac{t\,f'_S(a)h}{t}=f'_S(a)h .\]<p>Also existiert \(D\varphi(x)[h]=Df(x)[h]-f'_S(a)h\) für alle \(h\in E\) und ist linear und stetig in \(h\); d.h. \(\varphi\) ist in jedem Punkt von \(\overline{ab}\) Gateaux-differenzierbar mit</p>\[\varphi'_S(x)=f'_S(x)-f'_S(a).\]<p><i>Schritt 4 (Anwenden von (1)).</i> \(\|\varphi(b)-\varphi(a)\|_F\le\sup_{x\in\overset{\circ}{\overline{ab}}}\|\varphi'_S(x)\|_{\mathcal L(E,F)}\|b-a\|_E\) — nach Schritt 2 und 3 ist das wörtlich (2). Fertig.</p><p><b>Anwendung B (Tafel): Beweis von Satz (∗)</b> — „stetige Gateaux-Ableitung \(\Rightarrow\) Frechet-Ableitung“. Es sei \(f\) in allen Punkten von \(\mathcal U_{\varepsilon_0}(x_0)\subset\mathcal U\) Gateaux-differenzierbar und \(f'_S(\cdot):\mathcal U_{\varepsilon_0}(x_0)\to\mathcal L(E,F)\), \(x\mapsto f'_S(x)\), stetig. (An der Tafel heißt dieser Radius \(\varepsilon\); hier \(\varepsilon_0\), weil \(\varepsilon\) gleich als Stetigkeits-\(\varepsilon\) gebraucht wird.) Behauptung: \(f\) ist in \(x_0\) Frechet-differenzierbar mit \(f'(x_0)=f'_S(x_0)\).</p><p><i>Schritt 1 (was zu zeigen ist).</i> Für \(h\to\mathbf{0}_E\) muss gelten</p>\[f(x_0+h)-f(x_0)-f'_S(x_0)h=o\big(\|h\|_E\big).\]<p><i>Schritt 2 (Strecke wählen).</i> Setze \(a=x_0\), \(b=x_0+h\), also \(b-a=h\). Für \(\|h\|_E<\varepsilon_0\) liegt \(\overline{ab}\) ganz in \(\mathcal U_{\varepsilon_0}(x_0)\), denn Kugeln sind konvex. Ungleichung (2) liefert</p>\[\big\|f(x_0+h)-f(x_0)-f'_S(x_0)h\big\|_F\le\sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)-f'_S(x_0)\big\|_{\mathcal L(E,F)}\cdot\|h\|_E.\]<p><i>Schritt 3 (Stetigkeit ausnutzen).</i> Zu jedem \(\varepsilon>0\) gibt es \(\delta_\varepsilon>0\) mit \(\|f'_S(x)-f'_S(x_0)\|_{\mathcal L(E,F)}\le\varepsilon\) für \(\|x-x_0\|_E<\delta_\varepsilon\). Jeder Punkt \(x=x_0+th\) der Strecke erfüllt \(\|x-x_0\|_E=t\|h\|_E\le\|h\|_E\); für \(\|h\|_E<\delta_\varepsilon\) ist daher das ganze Supremum \(\le\varepsilon\).</p><p><i>Schritt 4 (Schluss).</i> Für \(\|h\|_E<\min\{\delta_\varepsilon,\varepsilon_0\}\) folgt</p>\[\big\|f(x_0+h)-f(x_0)-f'_S(x_0)h\big\|_F\le\varepsilon\,\|h\|_E,\]<p>und da \(\varepsilon>0\) beliebig war, ist der Rest \(o(\|h\|_E)\). Also existiert \(f'(x_0)=f'_S(x_0)\).</p>`,
        plus: String.raw`<p><b>Zur Notation.</b> Die Vorlesung schreibt den Nullvektor als durchgestrichene (doppelt gestrichene) Null mit Raum-Index. Dieses Zeichen kennt KaTeX nicht, deshalb steht auf dieser Website \(\mathbf{0}_E\), \(\mathbf{0}_F\), \(\mathbf{0}_n\); entsprechend \(\mathbf{1}\) für die Identität.</p><p><b>Roter Faden.</b> \(\text{Frechet}\Rightarrow\text{Gateaux}\Rightarrow\text{Richtungsableitungen}\) — die Umkehrungen sind falsch. Satz (∗) repariert die erste Lücke unter einer Zusatzbedingung, und das Werkzeug dafür ist genau Ungleichung (2). Der Hauptsatz ist damit das Bindeglied zwischen dem schwachen und dem starken Ableitungsbegriff.</p><p><b>Klausurfallen.</b> (i) \(\overline{ab}\subset\mathcal U\) ist eine echte Voraussetzung — bei nicht konvexem \(\mathcal U\) muss man sie prüfen. (ii) Die Suprema laufen über die <i>offene</i> Strecke \(\overset{\circ}{\overline{ab}}\), nicht über \(\overline{ab}\). (iii) Rechts steht die <b>Operatornorm</b> \(\|f'_S(x)\|_{\mathcal L(E,F)}\), nicht ein Funktionswert. (iv) Ist das Supremum \(=\infty\), ist die Aussage richtig, aber nutzlos.</p><p>Vergleiche den eindimensionalen Fall auf dem Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.5.2", title:"Der Satz von Hahn-Banach", body:{
        def: String.raw`<p><b>Stetige lineare Funktionale.</b> Für einen normierten Raum \((F,\|\cdot\|_F)\) über \(\mathbb K\) ist \(\mathcal L(F,\mathbb K)\) der Raum der stetigen linearen Abbildungen \(\ell:F\to\mathbb K\) (der Dualraum). Die Vorlesung schreibt die Anwendung ohne Klammern, also \(\ell x\) bzw. \(\ell f(x)\), und es gilt</p>\[\|\ell\|_{\mathcal L(F,\mathbb K)}=\sup_{x\neq\mathbf{0}_F}\frac{|\ell x|}{\|x\|_F},\qquad\text{insbesondere}\qquad |\ell x|\le\|\ell\|_{\mathcal L(F,\mathbb K)}\,\|x\|_F .\]<p><b>Satz von Hahn-Banach</b> (in der hier benutzten Form, ohne Beweis). Sei \((F,\|\cdot\|_F)\) ein normierter Raum. Zu jedem \(y_0\in F\) existiert ein \(\ell_{y_0}\in\mathcal L(F,\mathbb K)\) mit</p>\[\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}=1,\qquad \ell_{y_0}\,y_0=\|y_0\|_F .\]<p>An der Tafel wird der Satz mit „H.B.“ abgekürzt.</p>`,
        worte: String.raw`<p>Ein normierter Raum hat im Allgemeinen <i>kein</i> Skalarprodukt — man kann nicht einfach „auf \(y_0\) projizieren“, um dessen Länge zu messen. Hahn-Banach liefert den Ersatz: zu jedem vorgegebenen Vektor \(y_0\) gibt es ein skalarwertiges Messgerät \(\ell_{y_0}\), das genau auf diesen Vektor geeicht ist.</p><p>Die beiden Forderungen greifen wie Schloss und Schlüssel ineinander:</p><ul><li>\(\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}=1\) bedeutet \(|\ell_{y_0}y|\le\|y\|_F\) für <i>alle</i> \(y\in F\) — das Messgerät übertreibt nie;</li><li>\(\ell_{y_0}y_0=\|y_0\|_F\) bedeutet, dass es an der Stelle \(y_0\) die volle Länge anzeigt — dort untertreibt es also auch nicht.</li></ul><p>Zusammen: \(\|y\|_F=\max\{|\ell y| : \ell\in\mathcal L(F,\mathbb K),\ \|\ell\|_{\mathcal L(F,\mathbb K)}\le 1\}\). Die Norm eines Vektors lässt sich also verlustfrei durch Skalare ausdrücken. Genau das braucht man im Beweis des Hauptsatzes (<a href="#/7.5.3">7.5.3</a>): dort wird die \(F\)-wertige Funktion \(t\mapsto f(x(t))\) durch \(\Psi(t)=\ell f(x(t))\) zu einer \(\mathbb K\)-wertigen Funktion einer reellen Variablen gemacht, auf die die eindimensionale Differentialrechnung anwendbar ist. Ohne Hahn-Banach wäre jede solche Reduktion mit Informationsverlust verbunden; mit dem optimal gewählten \(\ell_{y_0}\) ist der Verlust null.</p><p>Für \(y_0=\mathbf{0}_F\) ist die zweite Bedingung trivial erfüllt; in der Anwendung wird ohnehin nur der Fall \(y_0\neq\mathbf{0}_F\) gebraucht. Die Existenzaussage selbst ist alles andere als offensichtlich — sie garantiert insbesondere, dass der Dualraum eines normierten Raumes „reich“ ist. Der Beweis benutzt das Zornsche Lemma und wird in der Vorlesung nicht geführt.</p>`,
        beispiel: String.raw`<p><b>Spezialfall Hilbertraum (Tafel).</b> Hier kann man \(\ell_{y_0}\) explizit hinschreiben — Hahn-Banach ist dann nicht nötig, und man sieht, was der Satz im allgemeinen Fall leisten muss.</p><p>Sei \((F,\|\cdot\|)\) ein Hilbertraum mit Skalarprodukt \(\langle\cdot,\cdot\rangle:F^2\to\mathbb K\) und \(\|x\|_F^2=\langle x,x\rangle\). Sei \(y_0\in F\), \(y_0\neq\mathbf{0}_F\). Betrachte</p>\[\ell_{y_0}:F\longrightarrow\mathbb K,\qquad \ell_{y_0}x=\langle x,y_0\rangle\cdot\frac{1}{\|y_0\|_F}.\]<p><i>Schritt 1 (linear).</i> \(\ell_{y_0}\) ist linear in \(x\in F\), da das Skalarprodukt im ersten Argument linear ist.</p><p><i>Schritt 2 (stetig, Norm \(\le 1\)).</i> Mit der Cauchy-Schwarz-Ungleichung \(|\langle x,y_0\rangle|\le\|x\|_F\|y_0\|_F\):</p>\[|\ell_{y_0}x|=|\langle x,y_0\rangle|\cdot\frac{1}{\|y_0\|_F}\ \le\ \|x\|_F\cdot\frac{\|y_0\|_F}{\|y_0\|_F}\ =\ 1\cdot\|x\|_F,\]<p>also ist \(\ell_{y_0}\) beschränkt und damit stetig, und \(\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}\le 1\).</p><p><i>Schritt 3 (Test mit \(x=y_0\)).</i></p>\[\ell_{y_0}y_0=\underbrace{\langle y_0,y_0\rangle}_{=\|y_0\|_F^2}\cdot\frac{1}{\|y_0\|_F}=\|y_0\|_F .\]<p>Das ist die zweite Hahn-Banach-Eigenschaft.</p><p><i>Schritt 4 (Norm \(=1\)).</i> Aus Schritt 3 folgt \(\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}\ge\dfrac{|\ell_{y_0}y_0|}{\|y_0\|_F}=1\); mit Schritt 2 also \(\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}=1\). (An der Tafel steht dies als gelbe Korrektur „\(=\)“ über dem zunächst notierten \(\le\).)</p><p><b>Ganz konkret.</b> \(F=\mathbb R^2\) mit dem euklidischen Skalarprodukt, \(y_0=(3,4)^{T}\), also \(\|y_0\|_F=\sqrt{9+16}=5\) und</p>\[\ell_{y_0}x=\frac{3x_1+4x_2}{5},\qquad x=(x_1,x_2)^{T}.\]<p>Probe: \(\ell_{y_0}y_0=\dfrac{3\cdot 3+4\cdot 4}{5}=\dfrac{25}{5}=5=\|y_0\|_F\). Und \(|\ell_{y_0}x|\le\|x\|_F\) nach Cauchy-Schwarz, mit Gleichheit z.B. für den Einheitsvektor \(x=\big(\tfrac35,\tfrac45\big)^{T}\), wo \(\ell_{y_0}x=\dfrac{9/5+16/5}{5}=1\) herauskommt. Also \(\|\ell_{y_0}\|_{\mathcal L(\mathbb R^2,\mathbb R)}=1\).</p>`,
        plus: String.raw`<p><b>Wo der Satz herkommt.</b> Der allgemeine Satz von Hahn-Banach ist ein <i>Fortsetzungssatz</i>: ein stetiges lineares Funktional auf einem Teilraum lässt sich normgleich auf den ganzen Raum fortsetzen. Die hier zitierte Fassung erhält man daraus, indem man auf dem eindimensionalen Teilraum \(\{\lambda y_0:\lambda\in\mathbb K\}\) das Funktional \(\lambda y_0\mapsto\lambda\|y_0\|_F\) betrachtet — es hat dort offensichtlich Norm \(1\) und den richtigen Wert in \(y_0\) — und es normgleich fortsetzt.</p><p><b>Merksatz.</b> \(\|y\|_F=\max_{\|\ell\|\le 1}|\ell y|\): Vektorabschätzungen in \(F\) darf man in Skalarabschätzungen in \(\mathbb K\) übersetzen, ohne etwas zu verlieren. Das ist das Standardmuster „teste mit einem Funktional“.</p><p><b>Gut zu wissen.</b> Das Funktional \(\ell_{y_0}\) ist im Allgemeinen <i>nicht eindeutig</i>. Im Hilbertraum ist es das (nach Riesz eindeutige) normierte Skalarprodukt-Funktional; in \((\mathbb R^2,\|\cdot\|_\infty)\) etwa erfüllen für \(y_0=(1,1)^{T}\) alle \(\ell x=\alpha x_1+\beta x_2\) mit \(\alpha,\beta\ge 0\), \(\alpha+\beta=1\) beide Bedingungen: \(\ell y_0=\alpha+\beta=1=\|y_0\|_\infty\), und die zu \(\|\cdot\|_\infty\) duale Norm von \(\ell\) ist \(|\alpha|+|\beta|=1\). Für den Beweis in <a href="#/7.5.3">7.5.3</a> genügt die Existenz.</p><p><b>Einsatzort.</b> Schritt 3 im Beweis des Hauptsatzes: dort wird \(\ell=\ell_{y_0}\) mit \(y_0=f(b)-f(a)\) gewählt. Siehe auch <a href="#/ref/saetze">Sätze</a>.</p>`}},
       {id:"7.5.3", title:"Beweis des Hauptsatzes (Schrankensatz)", body:{
        def: String.raw`<p><b>Zu beweisen</b> ist Aussage (1) aus <a href="#/7.5.1">7.5.1</a>: ist \(f:\mathcal U\subset E\to F\) in jedem Punkt von \(\overline{ab}\) Gateaux-differenzierbar, so gilt</p>\[\big\|f(b)-f(a)\big\|_F\le\sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)\big\|_{\mathcal L(E,F)}\cdot\|b-a\|_E .\]<p><b>Vorbereitung.</b> Parametrisiere die Strecke durch</p>\[x(t)=a+t\,\underbrace{(b-a)}_{=\,h}\in E,\qquad t\in\left]-\varepsilon,1+\varepsilon\right[\ \text{für gewisses }\varepsilon>0,\]<p>(möglich, da die kompakte Strecke \(\overline{ab}\) in der offenen Menge \(\mathcal U\) liegt). Sei \(\ell\in\mathcal L(F,\mathbb K)\) zunächst beliebig und</p>\[\Psi:\left]-\varepsilon,1+\varepsilon\right[\longrightarrow\mathbb K,\qquad \Psi(t)=\underbrace{\ell}_{\in\,\mathcal L(F,\mathbb K)}\ \underbrace{f(x(t))}_{\in\,F}\ \in\mathbb K .\]<p><b>Schritt 1: \(\Psi\) ist in jedem \(t\in[0,1]\) differenzierbar.</b> Wegen \(x(t+\Delta t)=x(t)+\Delta t\,h\) ist</p>\[\frac{\Psi(t+\Delta t)-\Psi(t)}{\Delta t}=\frac{\ell f\big(x(t)+\Delta t\,h\big)-\ell f\big(x(t)\big)}{\Delta t}=\ell\left(\frac{f\big(x(t)+\Delta t\,h\big)-f\big(x(t)\big)}{\Delta t}\right).\]<p>Da \(x(t)\in\overline{ab}\) und \(f\) dort nach Voraussetzung Gateaux-differenzierbar ist, existiert der Grenzwert</p>\[\lim_{\Delta t\to 0}\frac{f\big(x(t)+\Delta t\,h\big)-f\big(x(t)\big)}{\Delta t}=Df\big(x(t)\big)[h]=f'_S\big(x(t)\big)h\ \in F,\]<p>und da \(\ell\) linear und <i>stetig</i> ist, darf \(\ell\) mit dem Grenzwert vertauscht werden. Also existiert</p>\[\frac{d\Psi(t)}{dt}=\ell\big(f'_S(x(t))\,h\big),\qquad t\in[0,1].\]<p><b>Schritt 2: eindimensionaler Hauptsatz.</b> \(\Psi\) ist auf \([0,1]\) stetig und differenzierbar, also</p>\[\big|\Psi(1)-\Psi(0)\big|\le\sup_{t\in\left]0,1\right[}\left|\frac{d\Psi(t)}{dt}\right|\cdot\underbrace{|1-0|}_{=1}.\]<p>Einsetzen von \(\Psi(0)=\ell f(a)\), \(\Psi(1)=\ell f(b)\) und zweimaliges Anwenden der Operatornorm-Ungleichung</p>\[\big|\ell\big(f'_S(x(t))h\big)\big|\le\|\ell\|_{\mathcal L(F,\mathbb K)}\big\|f'_S(x(t))h\big\|_F\le\|\ell\|_{\mathcal L(F,\mathbb K)}\big\|f'_S(x(t))\big\|_{\mathcal L(E,F)}\|h\|_E\]<p>liefert</p>\[\big|\ell\big(f(b)-f(a)\big)\big|\le\|\ell\|_{\mathcal L(F,\mathbb K)}\ \sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)\big\|_{\mathcal L(E,F)}\cdot\|b-a\|_E .\]<p><b>Schritt 3: Wahl von \(\ell\) nach Hahn-Banach.</b> Ist \(y_0:=f(b)-f(a)\neq\mathbf{0}_F\), so wähle nach H.B. (<a href="#/7.5.2">7.5.2</a>) \(\ell=\ell_{y_0}\) mit \(\|\ell_{y_0}\|_{\mathcal L(F,\mathbb K)}=1\) und \(\ell_{y_0}y_0=\|y_0\|_F\). Die linke Seite wird dann zu \(\|f(b)-f(a)\|_F\), die Konstante rechts zu \(1\):</p>\[\big\|f(b)-f(a)\big\|_F\le 1\cdot\sup_{x\in\overset{\circ}{\overline{ab}}}\big\|f'_S(x)\big\|_{\mathcal L(E,F)}\cdot\|b-a\|_E .\]<p>Für \(f(b)=f(a)\) ist die Behauptung trivial. Damit ist (1) bewiesen.</p>`,
        worte: String.raw`<p>Der Beweis besteht aus <b>zwei Reduktionen</b> und einer optimalen Wahl.</p><p><i>Reduktion 1 — der Definitionsbereich.</i> Statt \(f\) auf ganz \(\mathcal U\) betrachtet man \(f\) nur längs der Strecke, also \(t\mapsto f(x(t))\) mit \(x(t)=a+th\). Damit ist die Variable eindimensional, und genau hier geht die Gateaux-Voraussetzung ein: der Differenzenquotient in \(t\) an der Stelle \(t\) ist wörtlich der Differenzenquotient der Richtungsableitung von \(f\) im Punkt \(x(t)\) in der einen Richtung \(h=b-a\).</p><p><i>Reduktion 2 — der Zielbereich.</i> Die Funktion \(t\mapsto f(x(t))\) ist noch \(F\)-wertig, und für vektorwertige Funktionen gibt es keine Differentialrechnung mit Mittelwertsatz. Also schaltet man ein stetiges lineares Funktional \(\ell\) nach: \(\Psi(t)=\ell f(x(t))\) ist \(\mathbb K\)-wertig, und für solche Funktionen einer reellen Variablen kennt man den Hauptsatz aus Analysis 1. Dass \(\ell\) stetig ist, wird gebraucht, um \(\ell\) durch den Grenzwert des Differenzenquotienten hindurchzuziehen; dass \(\ell\) linear ist, um überhaupt einen Differenzenquotienten daraus zu machen.</p><p><i>Der Preis und wie Hahn-Banach ihn zurückzahlt.</i> Nach den beiden Reduktionen hat man nur eine Aussage über die Zahl \(|\ell(f(b)-f(a))|\), nicht über \(\|f(b)-f(a)\|_F\). Die Abschätzung gilt aber für <i>jedes</i> \(\ell\) — man darf es also nachträglich passend zum Ergebnisvektor \(y_0=f(b)-f(a)\) wählen. Hahn-Banach liefert ein \(\ell_{y_0}\), das bei Norm \(1\) die volle Länge von \(y_0\) anzeigt; die Reduktion kostet dann nichts.</p><p><i>Warum nur eine Ungleichung?</i> Der eindimensionale Mittelwertsatz würde ein \(t_0\) mit \(\Psi(1)-\Psi(0)=\Psi'(t_0)\) liefern — aber dieses \(t_0\) hängt von \(\ell\) ab. Einen für alle Funktionale gemeinsamen Zwischenpunkt gibt es nicht, und deshalb bleibt am Ende eine Schranke statt einer Gleichung stehen (siehe Beispiel).</p>`,
        beispiel: String.raw`<p><b>Ein Beispiel, das den ganzen Beweis nachspielt</b> — und zugleich zeigt, dass die Gleichheitsversion des Mittelwertsatzes falsch ist.</p><p>Sei \(E=\mathbb R\), \(F=\mathbb R^2\) mit der euklidischen Norm, \(\mathcal U=\mathbb R\) und</p>\[f(t)=\begin{pmatrix}t^2\\ t^3\end{pmatrix},\qquad a=0,\quad b=1,\quad h=b-a=1 .\]<p><i>Die Ableitung.</i> \(f'_S(t)\in\mathcal L(\mathbb R,\mathbb R^2)\) ist die lineare Abbildung \(s\mapsto(2ts,\,3t^2s)^{T}\), ihre Operatornorm ist</p>\[\big\|f'_S(t)\big\|_{\mathcal L(\mathbb R,\mathbb R^2)}=\sup_{|s|\le 1}\big\|(2ts,3t^2s)^{T}\big\|=\sqrt{4t^2+9t^4},\]<p>und da dies auf \(\left]0,1\right[\) monoton wächst, ist \(\sup_{t\in\left]0,1\right[}\|f'_S(t)\|=\sqrt{4+9}=\sqrt{13}\approx 3{,}606\).</p><p><i>Ungleichung (1) prüfen.</i> Es ist \(f(1)-f(0)=(1,1)^{T}\), also \(\|f(b)-f(a)\|_F=\sqrt2\approx 1{,}414\) und in der Tat</p>\[\sqrt2\ \le\ \sqrt{13}\cdot 1 .\]<p><i>Schritt 3 konkret.</i> Hier ist \(y_0=f(b)-f(a)=(1,1)^{T}\), \(\|y_0\|_F=\sqrt2\), und das Hahn-Banach-Funktional ist (Hilbertraumfall, vgl. <a href="#/7.5.2">7.5.2</a>)</p>\[\ell_{y_0}x=\frac{\langle x,y_0\rangle}{\|y_0\|_F}=\frac{x_1+x_2}{\sqrt2},\qquad \|\ell_{y_0}\|_{\mathcal L(\mathbb R^2,\mathbb R)}=1 .\]<p><i>Schritt 1 und 2 konkret.</i> \(\Psi(t)=\ell_{y_0}f(x(t))=\dfrac{t^2+t^3}{\sqrt2}\), also \(\Psi(0)=0\), \(\Psi(1)=\dfrac{2}{\sqrt2}=\sqrt2\) und</p>\[\Psi'(t)=\frac{2t+3t^2}{\sqrt2},\qquad \sup_{t\in\left]0,1\right[}|\Psi'(t)|=\frac{5}{\sqrt2}\approx 3{,}536 .\]<p>Die Ungleichungskette des Beweises lautet hier</p>\[\underbrace{\sqrt2}_{\|f(b)-f(a)\|_F=|\Psi(1)-\Psi(0)|}\le\ \underbrace{\frac{5}{\sqrt2}}_{\sup|\Psi'|}\ \le\ \underbrace{\sqrt{13}}_{\sup\|f'_S\|\cdot\|h\|_E},\]<p>also \(1{,}414\le 3{,}536\le 3{,}606\). Man sieht: die erste Ungleichung ist die eigentliche Abschätzung, die zweite ist der (kleine) Verlust beim Übergang von \(|\ell(f'_S h)|\) zu \(\|\ell\|\cdot\|f'_S\|\cdot\|h\|\). Auf der linken Seite geht dagegen <b>nichts</b> verloren: \(\Psi(1)-\Psi(0)=\sqrt2\) ist exakt \(\|f(b)-f(a)\|_F\) — genau das leistet die Hahn-Banach-Wahl.</p><p><i>Warum keine Gleichheit möglich ist.</i> Ein Mittelwertsatz in der Form \(f(b)-f(a)=f'_S(t_0)\,(b-a)\) würde</p>\[\begin{pmatrix}1\\ 1\end{pmatrix}=\begin{pmatrix}2t_0\\ 3t_0^2\end{pmatrix}\quad\Longrightarrow\quad t_0=\tfrac12\ \text{ und }\ t_0=\tfrac{1}{\sqrt3}\]<p>erzwingen — ein Widerspruch. Es gibt also keinen Zwischenpunkt. Für das skalare \(\Psi\) dagegen existiert er sehr wohl: \(\Psi'(t_0)=\sqrt2\) bedeutet \(3t_0^2+2t_0-2=0\), also \(t_0=\frac{-1+\sqrt7}{3}\approx 0{,}549\) — ein Punkt, der weder \(\tfrac12\) noch \(\tfrac{1}{\sqrt3}\) ist und der von der Wahl von \(\ell\) abhängt. Genau deshalb bleibt am Ende eine Ungleichung.</p>`,
        plus: String.raw`<p><b>Wo welche Voraussetzung eingeht.</b> (i) \(\overline{ab}\subset\mathcal U\) und \(\mathcal U\) offen: damit \(\Psi\) auf einem etwas größeren Intervall \(\left]-\varepsilon,1+\varepsilon\right[\) definiert und auf \([0,1]\) stetig ist. (ii) Gateaux-Differenzierbarkeit in <i>jedem</i> Punkt von \(\overline{ab}\): Schritt 1, inklusive der Randpunkte. (iii) Stetigkeit von \(\ell\): Vertauschen von \(\ell\) mit dem Grenzwert. (iv) Hahn-Banach: nur Schritt 3.</p><p><b>Der Fall \(\mathbb K=\mathbb C\).</b> \(\Psi\) ist dann komplexwertig auf einem reellen Intervall; der Mittelwertsatz in Gleichungsform ist dafür falsch (klassisch: \(t\mapsto e^{it}\) auf \([0,2\pi]\)). Benutzt wird deshalb bewusst nur die <i>Ungleichungsversion</i> \(|\Psi(1)-\Psi(0)|\le\sup|\Psi'|\), die auch komplexwertig gilt. Vgl. <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p><p><b>Klausurfallen.</b> Die Abschätzung in Schritt 2 benutzt <i>zwei</i> verschiedene Operatornormen hintereinander: erst \(\|\ell\|_{\mathcal L(F,\mathbb K)}\) (Funktional auf \(F\)), dann \(\|f'_S(x(t))\|_{\mathcal L(E,F)}\) (Ableitung als Operator \(E\to F\)). Wer beide verwechselt, bekommt die Räume nicht zusammen. Ebenso beliebt: den Fall \(f(b)=f(a)\) zu vergessen, in dem Hahn-Banach nichts liefert und die Aussage trivial ist.</p><p><b>Anschluss.</b> Aus (1) folgt mit der Hilfsfunktion \(\varphi(x)=f(x)-f'_S(a)(x-a)\) sofort (2), und aus (2) folgt Satz (∗) — beides in <a href="#/7.5.1">7.5.1</a>. Die Beweisstruktur „auf eine Strecke einschränken, mit einem Funktional testen, eindimensional argumentieren“ ist ein Standardmuster, siehe <a href="#/ref/beweise">Beweise</a>.</p>`}}]},
    {id:"7.6", t:"Abbildungen f: U ⊂ ℝᵐ → ℝⁿ", topics:[
       {id:"7.6.1", title:"Partielle Ableitung, Richtungsableitung, Gâteaux-Ableitung", body:{
        def: String.raw`<p>Es sei \(U\subset\mathbb{R}^m\) offen und \(f:U\subset\mathbb{R}^m\to\mathbb{R}^n\), \(f(x)=\big(f_1(x),\dots,f_n(x)\big)^{T}\). Bezeichnungen der Vorlesung: \(x^{(0)}=\big(x^{(0)}_1,\dots,x^{(0)}_m\big)^{T}\in U\), \(x=(x_1,\dots,x_m)^{T}\), \(h=(h_1,\dots,h_m)^{T}\) und \(e_j=(0,\dots,0,1,0,\dots,0)\) mit der \(1\) an \(j\)-ter Stelle unter \(m\) Einträgen.</p><p><b>Partielle Ableitung.</b>\[\frac{\partial f}{\partial x_j}\Big|_{x=x^{(0)}}=\lim_{t\to 0}\frac{f\big(x^{(0)}+t\,e_j\big)-f\big(x^{(0)}\big)}{t},\qquad j=1,\dots,m,\]gleichwertig mit der Entwicklung\[f\big(x^{(0)}+t\,e_j\big)=f\big(x^{(0)}\big)+\left(\frac{\partial f}{\partial x_j}\Big|_{x=x^{(0)}}\right)\cdot t+o(|t|),\qquad t\to 0.\]</p><p><b>Richtungsableitung</b> zur Richtung \(h=(h_1,\dots,h_m)^{T}\):\[Df\big(x^{(0)}\big)[h]=\lim_{t\to 0}\frac{f\big(x^{(0)}+t\,h\big)-f\big(x^{(0)}\big)}{t},\]gleichwertig mit \(f(x^{(0)}+t\,h)=f(x^{(0)})+Df(x^{(0)})[h]\cdot t+o(|t|)\) — und zwar für entsprechende, individuelle \(h\in\mathbb{R}^m\). Insbesondere ist \(\frac{\partial f}{\partial x_j}\big|_{x=x^{(0)}}=Df(x^{(0)})[e_j]\).</p><p>Falls \(Df(x^{(0)})[h]\) existiert, ist diese automatisch <b>homogen</b>:\[Df\big(x^{(0)}\big)[\alpha h]=\alpha\,Df\big(x^{(0)}\big)[h]\]für alle \(\alpha\in\mathbb{R}\). <b>Aber:</b> im Allgemeinen keine Additivität.</p><p><b>Gâteaux-Ableitung (schwache Ableitung).</b> Es gelte</p><ul><li>\(Df(x^{(0)})[h]\) existiert für alle \(h\in\mathbb{R}^m\);</li><li>\(Df(x^{(0)})[\,\cdot\,]\) ist linear in \(h\) (insbesondere additiv);</li><li>(die Stetigkeit dieser linearen Abbildung ist auf \(\mathbb{R}^m\) automatisch).</li></ul><p>Dann heißt \(f\) in \(x^{(0)}\) Gâteaux-differenzierbar, und mit \(f'_S(x^{(0)})\in\mathcal{L}(\mathbb{R}^m,\mathbb{R}^n)\) gilt\[f'_S\big(x^{(0)}\big)h=Df\big(x^{(0)}\big)[h].\]Falls die Gâteaux-Ableitung existiert, ist sie die <b>Jacobi-Matrix</b>\[f'_S\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f)=\begin{pmatrix}\dfrac{\partial f_1}{\partial x_1}&\cdots&\dfrac{\partial f_1}{\partial x_m}\\ \vdots&\ddots&\vdots\\ \dfrac{\partial f_n}{\partial x_1}&\cdots&\dfrac{\partial f_n}{\partial x_m}\end{pmatrix}\Bigg|_{x=x^{(0)}}.\]</p>`,
        worte: String.raw`<p>Alle drei Begriffe messen dasselbe: wie stark sich \(f\) ändert, wenn man von \(x^{(0)}\) aus <i>in einer festen Richtung</i> losgeht. Sie unterscheiden sich nur darin, wie viele Richtungen zugelassen sind und ob die Ergebnisse untereinander zusammenhängen müssen.</p><p><b>Partiell</b> heißt: alle Koordinaten bis auf die \(j\)-te werden eingefroren, übrig bleibt die gewöhnliche eindimensionale Ableitung von \(t\mapsto f(x^{(0)}+t\,e_j)\). Man rechnet also stur nach den Regeln der <a href="#/ref/diffrechnung">Differentialrechnung</a> in einer Variablen und behandelt die übrigen Variablen als Konstanten.</p><p><b>Richtungsableitung</b> heißt: dieselbe eindimensionale Ableitung, nur längs einer beliebigen Geraden \(t\mapsto x^{(0)}+t\,h\). Die Homogenität ist deshalb geschenkt: \(h\) durch \(\alpha h\) zu ersetzen bedeutet nur, dieselbe Gerade mit \(\alpha\)-facher Geschwindigkeit zu durchlaufen, der Differenzenquotient wird dabei mit \(\alpha\) skaliert. Die Additivität ist dagegen keineswegs geschenkt: \(h'\), \(h''\) und \(h'+h''\) sind drei <i>verschiedene</i> Geraden, und die Kenntnis von \(f\) auf den ersten beiden sagt zunächst nichts über die dritte. Genau hier steckt die Schwäche des Begriffs.</p><p><b>Gâteaux</b> repariert das per Forderung: man verlangt alle Richtungen <i>und</i> Linearität. Ist \(Df(x^{(0)})[\,\cdot\,]\) erst einmal linear, so ist sie durch ihre Werte auf der Basis \(e_1,\dots,e_m\) festgelegt — und das sind gerade die partiellen Ableitungen. Deshalb ist die Gâteaux-Ableitung immer die Jacobi-Matrix: in der \(i\)-ten Zeile stehen die partiellen Ableitungen der \(i\)-ten Komponente \(f_i\), in der \(j\)-ten Spalte die Ableitungen nach \(x_j\). Die Matrix ist damit die einzig mögliche Kandidatin; die eigentliche Frage ist stets nur, ob sie wirklich <i>funktioniert</i>.</p>`,
        erfuellt: String.raw`<p>\(m=n=2\), \(f(x_1,x_2)=\big(x_1^2x_2,\;x_1+x_2\big)^{T}\), \(x^{(0)}=(1,2)^{T}\), also \(f(x^{(0)})=(2,3)^{T}\). Sei \(h=(h_1,h_2)^{T}\) beliebig.</p><p><b>Schritt 1: Richtungsableitung direkt aus der Definition.</b> Für die erste Komponente ist\[(1+th_1)^2(2+th_2)=2+t\,(4h_1+h_2)+t^2\,\big(2h_1^2+2h_1h_2\big)+t^3h_1^2h_2,\]also\[\frac{f_1(x^{(0)}+t\,h)-f_1(x^{(0)})}{t}=4h_1+h_2+t\,\big(2h_1^2+2h_1h_2\big)+t^2h_1^2h_2\;\longrightarrow\;4h_1+h_2\]für \(t\to0\). Für die zweite Komponente ist \((1+th_1)+(2+th_2)-3=t\,(h_1+h_2)\), der Differenzenquotient also konstant gleich \(h_1+h_2\). Zusammen\[Df\big(x^{(0)}\big)[h]=\begin{pmatrix}4h_1+h_2\\ h_1+h_2\end{pmatrix}.\]</p><p><b>Schritt 2: Linearität prüfen.</b> Der erhaltene Ausdruck ist in \(h\) homogen <i>und</i> additiv, also linear. Damit existiert die Gâteaux-Ableitung \(f'_S(x^{(0)})\in\mathcal{L}(\mathbb{R}^2,\mathbb{R}^2)\).</p><p><b>Schritt 3: Abgleich mit der Jacobi-Matrix.</b> Es ist \(\frac{\partial f_1}{\partial x_1}=2x_1x_2\), an \(x^{(0)}\) also \(4\); \(\frac{\partial f_1}{\partial x_2}=x_1^2\), an \(x^{(0)}\) also \(1\); \(\frac{\partial f_2}{\partial x_1}=\frac{\partial f_2}{\partial x_2}=1\). Somit\[f'_S\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f)=\begin{pmatrix}4&1\\ 1&1\end{pmatrix},\qquad \mathcal{J}_{x^{(0)}}(f)\,h=\begin{pmatrix}4h_1+h_2\\ h_1+h_2\end{pmatrix},\]in Übereinstimmung mit Schritt 1.</p>`,
        verletzt: String.raw`<p>\(m=2\), \(n=1\), Entwicklungspunkt \(x^{(0)}=\mathbf{0}_2\):\[f(x_1,x_2)=\begin{cases}\dfrac{x_1^3}{x_1^2+x_2^2},&(x_1,x_2)\neq(0,0),\\ 0,&(x_1,x_2)=(0,0).\end{cases}\]</p><p><b>Schritt 1: Sämtliche Richtungsableitungen existieren.</b> Für \(h=(h_1,h_2)^{T}\neq\mathbf{0}_2\) und \(t\neq0\) ist\[f\big(t\,h\big)=\frac{t^3h_1^3}{t^2\,(h_1^2+h_2^2)}=t\cdot\frac{h_1^3}{h_1^2+h_2^2},\]der Differenzenquotient also von \(t\) unabhängig:\[Df\big(\mathbf{0}_2\big)[h]=\frac{h_1^3}{h_1^2+h_2^2}.\]Insbesondere \(\frac{\partial f}{\partial x_1}\big|_{x=\mathbf{0}_2}=Df(\mathbf{0}_2)[e_1]=1\) und \(\frac{\partial f}{\partial x_2}\big|_{x=\mathbf{0}_2}=Df(\mathbf{0}_2)[e_2]=0\).</p><p><b>Schritt 2: Homogen — wie es der Satz verspricht.</b>\[Df\big(\mathbf{0}_2\big)[\alpha h]=\frac{\alpha^3h_1^3}{\alpha^2\,(h_1^2+h_2^2)}=\alpha\,Df\big(\mathbf{0}_2\big)[h].\]</p><p><b>Schritt 3: Aber nicht additiv.</b> Mit \(h'=e_1\), \(h''=e_2\) ist\[Df\big(\mathbf{0}_2\big)[h'+h'']=\frac{1^3}{1^2+1^2}=\frac12,\qquad Df\big(\mathbf{0}_2\big)[h']+Df\big(\mathbf{0}_2\big)[h'']=1+0=1.\]Wegen \(\tfrac12\neq1\) ist \(Df(\mathbf{0}_2)[\,\cdot\,]\) nicht linear: \(f\) ist in \(\mathbf{0}_2\) <b>nicht</b> Gâteaux-differenzierbar, obwohl jede einzelne Richtungsableitung existiert.</p><p>Bemerkenswert: an der Stetigkeit liegt es nicht, denn \(|f(x)|=\frac{|x_1|^3}{x_1^2+x_2^2}\le\frac{|x_1|^3}{x_1^2}=|x_1|\le\|x\|\), also ist \(f\) in \(\mathbf{0}_2\) stetig. Es scheitert allein an der Linearität.</p>`,
        plus: String.raw`<p><b>Notation.</b> Für den Nullvektor schreibt die Vorlesung an der Tafel eine durchgestrichene Null mit Raum-Index; da KaTeX dieses Symbol nicht kennt, steht hier durchgehend \(\mathbf{0}_m\) (bzw. \(\mathbf{0}_2\), \(\mathbf{0}_E\), \(\mathbf{0}_F\)) — gemeint ist stets dasselbe.</p><p><b>Roter Faden.</b> Die Begriffe bilden eine Kette wachsender Stärke; jede Stufe zieht alle darüberstehenden nach sich, und keine dieser Implikationen lässt sich umkehren:</p><ul><li>alle partiellen Ableitungen existieren (nur \(m\) ausgezeichnete Richtungen),</li><li>alle Richtungsableitungen existieren (alle Geraden, aber ohne Kopplung),</li><li>Gâteaux-differenzierbar (alle Geraden <i>und</i> Linearität),</li><li>Fréchet-differenzierbar (zusätzlich gleichmäßig in den Richtungen, siehe <a href="#/7.6.2">7.6.2</a>).</li></ul><p>Die Trennung der zweiten von der dritten Stufe leistet das Gegenbeispiel oben. Die erste von der zweiten trennt das Gegenbeispiel in <a href="#/7.6.3">7.6.3</a>: dort existieren beide partiellen Ableitungen, außerhalb der Koordinatenachsen aber keine einzige Richtungsableitung. Die dritte von der vierten trennt das Gegenbeispiel in <a href="#/7.6.2">7.6.2</a>.</p><p><b>Klausurfalle.</b> Aus der bloßen Existenz aller partiellen Ableitungen folgt nichts, nicht einmal Stetigkeit. Wer \(\mathcal{J}_{x^{(0)}}(f)\) hinschreibt, hat noch nichts bewiesen; er hat nur die einzige Kandidatin notiert. Der bequeme Ausweg ist der Satz aus <a href="#/7.6.3">7.6.3</a>.</p><p><b>Spezialfall \(n=1\).</b> Dann ist \(\mathcal{J}_{x^{(0)}}(f)\) eine einzeilige Matrix, nämlich der transponierte Gradient; das wird in <a href="#/7.6.4">7.6.4</a> ausgeführt.</p>`}},
       {id:"7.6.2", title:"Fréchet-Ableitung und totales Differential", body:{
        def: String.raw`<p><b>Fréchet-Ableitung.</b> Gegenüber der Gâteaux-Ableitung tritt eine <i>zusätzliche Forderung an den Restterm</i> hinzu: er muss klein sein <i>gleichmäßig in den Richtungen</i>. Man nennt \(f:U\subset\mathbb{R}^m\to\mathbb{R}^n\) in \(x^{(0)}\in U\) Fréchet-differenzierbar, falls es ein \(f'(x^{(0)})\in\mathcal{L}(\mathbb{R}^m,\mathbb{R}^n)\) gibt mit\[f\big(x^{(0)}+h\big)=f\big(x^{(0)}\big)+f'\big(x^{(0)}\big)h+o\big(\|h\|_{\mathbb{R}^m}\big),\qquad h\to\mathbf{0}_m.\]</p><p>Aus der Fréchet-Differenzierbarkeit folgt die Gâteaux-Differenzierbarkeit — man setze \(h=t\,h_0\) mit festem \(h_0\) und lasse \(t\to0\) — und es ist\[f'\big(x^{(0)}\big)=f'_S\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f).\]Die Umkehrung gilt nicht.</p><p><b>Totales Differential (Spezialfall \(n=1\)).</b> Hier ist \(f'(x^{(0)})\) eine Zeile, und die Entwicklung lautet\[f\big(x^{(0)}+h\big)-f\big(x^{(0)}\big)=f'\big(x^{(0)}\big)h+o\big(\|h\|\big)\]mit\[f'\big(x^{(0)}\big)h=\left(\frac{\partial f}{\partial x_1},\dots,\frac{\partial f}{\partial x_m}\right)\begin{pmatrix}h_1\\ \vdots\\ h_m\end{pmatrix}=\left(\frac{\partial f}{\partial x_1}\right)h_1+\dots+\left(\frac{\partial f}{\partial x_m}\right)h_m.\]Mit der Notation \(h_1=dx_1,\;\dots,\;h_m=dx_m\) heißt\[\frac{\partial f}{\partial x_1}\Big|_{x=x^{(0)}}dx_1+\dots+\frac{\partial f}{\partial x_m}\Big|_{x=x^{(0)}}dx_m=df\]das <b>totale Differential</b> von \(f\) in \(x^{(0)}\).</p>`,
        worte: String.raw`<p>Der ganze Unterschied zwischen Gâteaux und Fréchet steckt in einem einzigen Quantorentausch — man vergleiche die Situation mit punktweiser und gleichmäßiger Konvergenz (<a href="#/ref/grenzwerte">Grenzwerte</a>).</p><p><b>Gâteaux</b> sagt: fixiere eine Richtung \(h\); <i>dann</i> ist der Fehler längs dieser einen Geraden von der Ordnung \(o(|t|)\). Wie klein \(|t|\) dafür sein muss, darf von \(h\) abhängen — und zwar völlig unkontrolliert. Bei jeder Drehung der Richtung darf die Sache von vorn beginnen.</p><p><b>Fréchet</b> sagt: eine einzige Abschätzung für alle Richtungen gleichzeitig. Ausgeschrieben heißt \(o(\|h\|)\) nämlich: zu jedem \(\varepsilon>0\) gibt es ein \(\delta>0\), so dass\[\big\|f(x^{(0)}+h)-f(x^{(0)})-f'(x^{(0)})h\big\|\le\varepsilon\,\|h\|\]für <i>alle</i> \(h\) mit \(\|h\|<\delta\) gilt — also auf einer ganzen Kugel, nicht nur auf jeder einzelnen Geraden. Erst das macht die lineare Abbildung zu einer echten Approximation: \(f\) sieht in der Nähe von \(x^{(0)}\) aus wie die affine Abbildung \(h\mapsto f(x^{(0)})+f'(x^{(0)})h\); für \(n=1\) ist deren Graph gerade die Tangentialebene an den Graphen von \(f\).</p><p>Das <b>totale Differential</b> ist nichts anderes als der lineare Hauptteil dieser Entwicklung, mit \(dx_j\) als bloßem Namen für das Inkrement \(h_j\). Die Sprechweise trennt die beiden Rollen sauber: \(\frac{\partial f}{\partial x_j}\) beschreibt die Änderung entlang <i>einer</i> Koordinate, \(df\) die Änderung bei simultaner Störung <i>aller</i> Koordinaten. Dass sich Letzteres einfach als Summe der Ersteren schreiben lässt, ist gerade der Inhalt der Differenzierbarkeit — und keine Selbstverständlichkeit.</p>`,
        erfuellt: String.raw`<p>\(f(x_1,x_2)=x_1^2x_2\) (also \(m=2\), \(n=1\)), \(x^{(0)}=(1,2)^{T}\), \(f(x^{(0)})=2\).</p><p><b>Schritt 1: Kandidatin bestimmen.</b> \(\frac{\partial f}{\partial x_1}=2x_1x_2\), an \(x^{(0)}\) gleich \(4\); \(\frac{\partial f}{\partial x_2}=x_1^2\), an \(x^{(0)}\) gleich \(1\). Also kommt nur\[f'\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f)=\big(4,\;1\big)\]in Frage.</p><p><b>Schritt 2: Restterm exakt ausrechnen.</b>\[f\big(x^{(0)}+h\big)=(1+h_1)^2(2+h_2)=2+4h_1+h_2+2h_1^2+2h_1h_2+h_1^2h_2,\]also mit \(R(h):=f(x^{(0)}+h)-f(x^{(0)})-\big(4h_1+h_2\big)\)\[R(h)=2h_1^2+2h_1h_2+h_1^2h_2.\]</p><p><b>Schritt 3: Abschätzen.</b> Aus \(|h_1|\le\|h\|\) und \(|h_2|\le\|h\|\) folgt\[|R(h)|\le 2\|h\|^2+2\|h\|^2+\|h\|^3=4\|h\|^2+\|h\|^3,\]also\[\frac{|R(h)|}{\|h\|}\le 4\|h\|+\|h\|^2\;\longrightarrow\;0\qquad(h\to\mathbf{0}_2).\]Damit ist \(R(h)=o(\|h\|)\), und \(f\) ist in \(x^{(0)}\) Fréchet-differenzierbar mit totalem Differential\[df=4\,dx_1+1\,dx_2 .\]Konkret: eine Störung \(h=(0{,}01;\,-0{,}02)^{T}\) ändert \(f\) in erster Näherung um \(4\cdot0{,}01-0{,}02=0{,}02\).</p>`,
        verletzt: String.raw`<p>Gâteaux ist echt schwächer als Fréchet. Sei \(x^{(0)}=\mathbf{0}_2\) und\[f(x_1,x_2)=\begin{cases}\dfrac{x_1^3\,x_2}{x_1^6+x_2^2},&(x_1,x_2)\neq(0,0),\\ 0,&(x_1,x_2)=(0,0).\end{cases}\]</p><p><b>Schritt 1: \(f\) ist in \(\mathbf{0}_2\) Gâteaux-differenzierbar.</b> Für \(h=(h_1,h_2)^{T}\neq\mathbf{0}_2\) und \(t\neq0\) ist\[f\big(t\,h\big)=\frac{t^4h_1^3h_2}{t^6h_1^6+t^2h_2^2}=t^2\cdot\frac{h_1^3h_2}{t^4h_1^6+h_2^2}.\]Für \(h_2\neq0\) folgt\[\frac{f(t\,h)-f(\mathbf{0}_2)}{t}=t\cdot\frac{h_1^3h_2}{t^4h_1^6+h_2^2}\;\longrightarrow\;0\qquad(t\to0),\]denn der Bruch strebt gegen \(h_1^3/h_2\) und wird mit \(t\) multipliziert. Für \(h_2=0\) ist \(f(t\,h)=0\), der Quotient also identisch \(0\). Somit \(Df(\mathbf{0}_2)[h]=0\) für alle \(h\in\mathbb{R}^2\) — das ist linear, also \(f'_S(\mathbf{0}_2)=(0,\,0)\).</p><p><b>Schritt 2: \(f\) ist in \(\mathbf{0}_2\) nicht Fréchet-differenzierbar.</b> Man laufe nicht längs einer Geraden, sondern längs der Kurve \(x_2=x_1^3\), also \(h=(s,\,s^3)^{T}\) mit \(s\to0\):\[f(h)=\frac{s^3\cdot s^3}{s^6+s^6}=\frac12 .\]Der Rest ist also\[\frac{\big|f(\mathbf{0}_2+h)-f(\mathbf{0}_2)-f'_S(\mathbf{0}_2)h\big|}{\|h\|}=\frac{1/2}{\sqrt{s^2+s^6}}\;\longrightarrow\;+\infty\qquad(s\to0),\]und keineswegs \(o(\|h\|)\). (Dieselbe Rechnung zeigt: \(f\) ist in \(\mathbf{0}_2\) nicht einmal stetig, denn auf jener Kurve gilt \(f\equiv\frac12\), während \(f(\mathbf{0}_2)=0\) ist.)</p><p><b>Diagnose.</b> Längs jeder festen Geraden ist der Fehler brav; die Schwelle, ab der er klein wird, hängt aber so heftig von der Richtung ab, dass keine gemeinsame Schranke existiert. Genau das schließt die Fréchet-Bedingung aus.</p>`,
        plus: String.raw`<p><b>Fréchet zieht Stetigkeit nach sich.</b> Aus der Entwicklung folgt sofort \(f(x^{(0)}+h)-f(x^{(0)})=f'(x^{(0)})h+o(\|h\|)\to0\) für \(h\to\mathbf{0}_m\), da die lineare Abbildung stetig ist. Gâteaux leistet das nicht, wie das Gegenbeispiel zeigt. Wer also die Unstetigkeit einer Funktion in \(x^{(0)}\) nachweist, hat damit bereits die Fréchet-Differenzierbarkeit widerlegt.</p><p><b>Arbeitsschema für die Klausur.</b> (1) Alle partiellen Ableitungen bilden und \(\mathcal{J}_{x^{(0)}}(f)\) hinschreiben — mehr als diese Matrix kann \(f'(x^{(0)})\) ohnehin nicht sein. (2) Entweder \(R(h)=f(x^{(0)}+h)-f(x^{(0)})-\mathcal{J}_{x^{(0)}}(f)h\) explizit abschätzen und \(R(h)/\|h\|\to0\) zeigen, oder — viel bequemer — den hinreichenden Satz aus <a href="#/7.6.3">7.6.3</a> zitieren. Der Weg über die Definition lohnt praktisch nur in den kritischen Punkten stückweise definierter Funktionen.</p><p><b>Sprechweise.</b> „Total differenzierbar“ und „Fréchet-differenzierbar“ meinen dasselbe; \(dx_1,\dots,dx_m\) sind keine geheimnisvollen unendlich kleinen Größen, sondern schlicht andere Namen für die Komponenten \(h_1,\dots,h_m\) des Zuwachses. Weitere Merkregeln auf dem Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}},
       {id:"7.6.3", title:"Hinreichende Bedingungen: stetige partielle Ableitungen", body:{
        def: String.raw`<p><b>Satz (hinreichende Bedingung für die Existenz der Gâteaux-Ableitung).</b> Für ein gewisses \(\varepsilon>0\) mit \(U_\varepsilon(x^{(0)})\subset U\) mögen alle partiellen Ableitungen von \(f:U\subset\mathbb{R}^m\to\mathbb{R}^n\) in \(U_\varepsilon(x^{(0)})\) existieren und in \(x=x^{(0)}\) stetig sein. Dann ist \(f\) in \(x^{(0)}\) Gâteaux-differenzierbar und\[f'_S\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f).\]</p><p><b>Satz (hinreichende Bedingung zur Fréchet-Differenzierbarkeit).</b> Für ein gewisses \(\varepsilon>0\) mit \(U_\varepsilon(x^{(0)})\subset U\) mögen alle partiellen Ableitungen von \(f\) existieren und in \(U_\varepsilon(x^{(0)})\) stetig sein. Dann ist \(f\) in \(x^{(0)}\) Fréchet-differenzierbar und\[f'\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f).\]</p><p><b>Beweisskizze</b> (zur ersten Aussage; Vereinfachung \(n=1\), für \(n>1\) argumentiert man komponentenweise. Die Fréchet-Version wurde in der Vorlesung ohne weiteren Beweis angeschlossen).</p><p><b>Vorbemerkung.</b> Nach Voraussetzung existiert \(\frac{\partial f(x)}{\partial x_j}=Df(x)[e_j]\) für alle \(x\in U_\varepsilon(x^{(0)})\), und wegen der allgemeinen Homogenität der Richtungsableitung damit auch \(Df(x)[\alpha e_j]=\alpha\,Df(x)[e_j]\).</p><p><b>Zwischenüberlegung (Mittelwertsatz).</b> Existiert \(Df(x)[h]\) für ein gewisses \(h\) in allen \(x\in U_\varepsilon(x^{(0)})\), so ist\[g(t)=f(x+t\,h),\qquad t\in\left]-\varepsilon,\,1+\varepsilon\right[,\]differenzierbar in \(t\), und der Mittelwertsatz der Differentialrechnung in einer Variablen liefert\[f(x+h)-f(x)=g(1)-g(0)=\frac{dg}{dt}\Big|_{t=t_0}\cdot(1-0)=Df\big(x+t_0\,h\big)[h]\]für ein gewisses \(t_0=t_0(x,h)\in[0,1]\).</p><p><b>Schritt 1 (Additivität).</b> Sei \(h=h'+h''\) (dabei sind \(h'\) und \(h''\) Vielfache von Einheitsvektoren bzw. bereits erledigte Teilsummen — nur für solche Richtungen ist die Existenz von \(Df(x)[\,\cdot\,]\) in ganz \(U_\varepsilon(x^{(0)})\) bekannt). Teleskopieren und zweimal die Zwischenüberlegung anwenden:\[f\big(x^{(0)}+h\big)-f\big(x^{(0)}\big)=\Big[f\big(x^{(0)}+h'+h''\big)-f\big(x^{(0)}+h'\big)\Big]+\Big[f\big(x^{(0)}+h'\big)-f\big(x^{(0)}\big)\Big]\]\[=Df\big(x^{(0)}+h'+t_0''h''\big)[h'']+Df\big(x^{(0)}+t_0'h'\big)[h']\]mit geeigneten \(t_0'=t_0'(x^{(0)};h',h'')\in[0,1]\) und \(t_0''=t_0''(x^{(0)};h',h'')\in[0,1]\). Nun wird mit \(s>0\) skaliert, \(h'\mapsto s\,h'\), \(h''\mapsto s\,h''\), \(h\mapsto s\,h\); mit der Homogenität folgt\[f\big(x^{(0)}+s\,h\big)-f\big(x^{(0)}\big)=s\,Df\big(x^{(0)}+s\,h'+s\,t_0''h''\big)[h'']+s\,Df\big(x^{(0)}+s\,t_0'h'\big)[h'].\]Die Argumente streben für \(s\to0\) gegen \(x^{(0)}\); mit der Stetigkeit der partiellen Ableitungen in \(x^{(0)}\) ergibt sich nach Division durch \(s\)\[\lim_{s\to0}\frac{f\big(x^{(0)}+s\,h\big)-f\big(x^{(0)}\big)}{s}=Df\big(x^{(0)}\big)[h'']+Df\big(x^{(0)}\big)[h'],\]also die Additivität.</p><p><b>Schritt 2.</b> Sukzessive anwenden auf \(h=h_1e_1+\dots+h_me_m\). Damit ist \(Df(x^{(0)})[\,\cdot\,]\) linear und\[Df\big(x^{(0)}\big)[h]=\sum_{j=1}^{m}h_j\,\frac{\partial f}{\partial x_j}\Big|_{x=x^{(0)}}=\mathcal{J}_{x^{(0)}}(f)\,h.\qquad\square\]</p>`,
        worte: String.raw`<p>Dieser Satz ist das Arbeitspferd der ganzen Differentialrechnung mehrerer Veränderlicher. Er dreht die Beweislast um: statt eine Restabschätzung \(R(h)=o(\|h\|)\) zu führen, genügt es, \(m\cdot n\) partielle Ableitungen auszurechnen und ihnen die Stetigkeit anzusehen. Das kostet nichts, weil partielle Ableitungen mit den gewohnten Regeln aus einer Variablen berechnet werden.</p><p><b>Wo genau die Voraussetzung gebraucht wird.</b> Die Beweisidee ist eine Teleskopsumme: der Zuwachs in Richtung \(h=h'+h''\) wird in zwei Teilzuwächse zerlegt, die nacheinander abgelaufen werden. Jeder Teilschritt lebt auf einem Geradenstück, auf dem der eindimensionale Mittelwertsatz anwendbar ist — genau dafür müssen die partiellen Ableitungen auf einer <i>ganzen Umgebung</i> existieren, nicht nur im Punkt. Der Mittelwertsatz produziert dabei Zwischenstellen \(t_0'\), \(t_0''\), über die man keinerlei Kontrolle hat; sie hängen unkontrolliert von \(x^{(0)}\), \(h'\), \(h''\) ab. Deshalb der Trick mit der Skalierung \(h\mapsto s\,h\): lässt man \(s\to0\) laufen, wandern sämtliche Auswertungspunkte gegen \(x^{(0)}\), gleichgültig wie die Zwischenstellen liegen — und dort rettet die <i>Stetigkeit</i> der partiellen Ableitungen den Grenzübergang. Ohne Stetigkeit ist der Grenzwert wertlos.</p><p>Ist die Additivität erst für zwei Summanden gesichert, liefert die Zerlegung \(h=h_1e_1+\dots+h_me_m\) per Iteration die volle Linearität — und eine lineare Richtungsableitung ist nach <a href="#/7.6.1">7.6.1</a> genau die Jacobi-Matrix.</p>`,
        erfuellt: String.raw`<p>\(f:\mathbb{R}^2\to\mathbb{R}^2\), \(f(x_1,x_2)=\big(e^{x_1}\cos x_2,\;e^{x_1}\sin x_2\big)^{T}\).</p><p><b>Schritt 1: alle partiellen Ableitungen bilden.</b>\[\frac{\partial f_1}{\partial x_1}=e^{x_1}\cos x_2,\qquad\frac{\partial f_1}{\partial x_2}=-e^{x_1}\sin x_2,\]\[\frac{\partial f_2}{\partial x_1}=e^{x_1}\sin x_2,\qquad\frac{\partial f_2}{\partial x_2}=e^{x_1}\cos x_2 .\]</p><p><b>Schritt 2: Existenz und Stetigkeit.</b> Alle vier Ausdrücke existieren in jedem Punkt des \(\mathbb{R}^2\) und sind als Produkte der stetigen Funktionen \(x_1\mapsto e^{x_1}\) und \(x_2\mapsto\cos x_2\) bzw. \(\sin x_2\) auf ganz \(\mathbb{R}^2\) stetig. Insbesondere gilt dies auf jeder Umgebung \(U_\varepsilon(x^{(0)})\).</p><p><b>Schritt 3: Satz anwenden.</b> Also ist \(f\) in jedem \(x^{(0)}\in\mathbb{R}^2\) Fréchet-differenzierbar mit\[f'\big(x^{(0)}\big)=\mathcal{J}_{x^{(0)}}(f)=e^{x^{(0)}_1}\begin{pmatrix}\cos x^{(0)}_2&-\sin x^{(0)}_2\\ \sin x^{(0)}_2&\cos x^{(0)}_2\end{pmatrix}.\]Es war keine einzige Restabschätzung nötig — genau das ist der Nutzen des Satzes. Zur Kontrolle: \(\det\mathcal{J}_{x^{(0)}}(f)=e^{2x^{(0)}_1}\big(\cos^2x^{(0)}_2+\sin^2x^{(0)}_2\big)=e^{2x^{(0)}_1}\neq0\); die Ableitung ist also in jedem Punkt invertierbar (eine Drehstreckung).</p>`,
        verletzt: String.raw`<p>Die Stetigkeitsvoraussetzung ist wesentlich — mit der bloßen Existenz der partiellen Ableitungen bricht der Satz zusammen. Sei \(x^{(0)}=\mathbf{0}_2\) und\[f(x_1,x_2)=\begin{cases}\dfrac{x_1x_2}{x_1^2+x_2^2},&(x_1,x_2)\neq(0,0),\\ 0,&(x_1,x_2)=(0,0).\end{cases}\]</p><p><b>Schritt 1: alle partiellen Ableitungen existieren überall.</b> Im Nullpunkt ist \(f(t,0)=0\) und \(f(0,t)=0\), also\[\frac{\partial f}{\partial x_1}\Big|_{x=\mathbf{0}_2}=\frac{\partial f}{\partial x_2}\Big|_{x=\mathbf{0}_2}=0 .\]Für \((x_1,x_2)\neq(0,0)\) liefert die Quotientenregel\[\frac{\partial f}{\partial x_1}=\frac{x_2\,(x_1^2+x_2^2)-x_1x_2\cdot 2x_1}{(x_1^2+x_2^2)^2}=\frac{x_2\,(x_2^2-x_1^2)}{(x_1^2+x_2^2)^2}.\]</p><p><b>Schritt 2: die Voraussetzung ist verletzt.</b> Auf der Achse \(x_1=0\), \(x_2\neq0\) ist\[\frac{\partial f}{\partial x_1}=\frac{x_2\cdot x_2^2}{x_2^4}=\frac{1}{x_2}\;\longrightarrow\;\pm\infty\qquad(x_2\to0),\]während der Wert im Nullpunkt \(0\) beträgt. Die partielle Ableitung ist in \(\mathbf{0}_2\) also unstetig.</p><p><b>Schritt 3: und die Behauptung ist tatsächlich falsch.</b> Für \(h=(h_1,h_2)^{T}\) mit \(h_1h_2\neq0\) ist\[f\big(t\,h\big)=\frac{t^2h_1h_2}{t^2\,(h_1^2+h_2^2)}=\frac{h_1h_2}{h_1^2+h_2^2}\neq0,\]also unabhängig von \(t\), und damit\[\frac{f(t\,h)-f(\mathbf{0}_2)}{t}=\frac{1}{t}\cdot\frac{h_1h_2}{h_1^2+h_2^2}\;\longrightarrow\;\pm\infty\qquad(t\to0).\]Außerhalb der beiden Koordinatenachsen existiert also nicht einmal die Richtungsableitung; \(f\) ist in \(\mathbf{0}_2\) weder Gâteaux- noch Fréchet-differenzierbar und nicht einmal stetig (auf der Geraden \(x_1=x_2\) ist \(f\equiv\frac12\)).</p>`,
        plus: String.raw`<p><b>Die beiden Sätze unterscheiden sich nur in einem Wort — dem Ort der Stetigkeit.</b> Wird Stetigkeit der partiellen Ableitungen nur im Punkt \(x^{(0)}\) verlangt (Existenz aber auf \(U_\varepsilon(x^{(0)})\)), erhält man die Gâteaux-Ableitung; wird sie auf der ganzen Umgebung \(U_\varepsilon(x^{(0)})\) verlangt, erhält man die Fréchet-Ableitung. Das passt zur Merkregel aus <a href="#/7.6.2">7.6.2</a>: Kleinheit des Restes <i>gleichmäßig in allen Richtungen</i> braucht Information auf einer ganzen Umgebung, nicht bloß in einem Punkt.</p><p><b>Sprechweise \(C^1\).</b> Existieren alle partiellen Ableitungen auf \(U\) und sind sie dort stetig, so schreibt man \(f\in C^1(U)\); solche \(f\) sind auf ganz \(U\) Fréchet-differenzierbar. Da Polynome, \(\exp\), \(\sin\), \(\cos\), Wurzeln auf ihrem Definitionsbereich und Quotienten mit nichtverschwindendem Nenner beliebig oft stetig partiell differenzierbar sind, erledigt dieser Satz die allermeisten Klausuraufgaben in zwei Zeilen. Auf die Definition muss man nur in den kritischen Punkten stückweise erklärter Funktionen zurückgreifen.</p><p><b>Hinreichend, nicht notwendig.</b> Die Umkehrung ist falsch:\[f(x_1,x_2)=\begin{cases}\big(x_1^2+x_2^2\big)\sin\dfrac{1}{\sqrt{x_1^2+x_2^2}},&(x_1,x_2)\neq(0,0),\\ 0,&(x_1,x_2)=(0,0)\end{cases}\]ist in \(\mathbf{0}_2\) Fréchet-differenzierbar mit \(f'(\mathbf{0}_2)=(0,\,0)\), denn \(|f(h)|\le\|h\|^2=o(\|h\|)\). Die partiellen Ableitungen existieren zwar überall, oszillieren aber in der Nähe des Nullpunkts (in \(\frac{\partial f}{\partial x_1}\) tritt der Term \(-\frac{x_1}{\|x\|}\cos\frac{1}{\|x\|}\) auf) und sind dort unstetig. Weitere Struktur solcher Implikationsketten auf dem Spickzettel <a href="#/ref/saetze">Sätze</a>.</p>`}},
       {id:"7.6.4", title:"Zur Bedeutung des Gradienten", body:{
        def: String.raw`<p>Sei \(f:U\subset\mathbb{R}^m\longrightarrow\mathbb{R}\) (also \(n=1\)), \(x^{(0)}\in U\), und \(f\) sei in \(x^{(0)}\) differenzierbar. Dann ist\[f\big(x^{(0)}+h\big)=f\big(x^{(0)}\big)+f'\big(x^{(0)}\big)h+o\big(\|h\|\big)\]mit\[f'\big(x^{(0)}\big)h=\sum_{j=1}^{m}\frac{\partial f}{\partial x_j}\Big|_{x=x^{(0)}}\cdot h_j=\Big\langle \nabla f\big|_{x=x^{(0)}},\;h\Big\rangle,\qquad h=(h_1,\dots,h_m)^{T},\]wobei der <b>Gradient</b> als Spaltenvektor erklärt ist durch\[\Big(\nabla f\big|_{x=x^{(0)}}\Big)^{T}=\left(\frac{\partial f}{\partial x_1},\;\dots,\;\frac{\partial f}{\partial x_m}\right)\Big|_{x=x^{(0)}}.\]</p><p>Gleichbedeutend: \(\operatorname{grad} f\big|_{x=x^{(0)}}=\nabla f\big|_{x=x^{(0)}}\) ist der Spaltenvektor, und\[f'_S\big(x^{(0)}\big)=f'\big(x^{(0)}\big)=\big(\operatorname{grad} f\big)\big|^{T}_{x=x^{(0)}}=\mathcal{J}_{x^{(0)}}(f)\]ist die zugehörige Zeile.</p><p><b>Geometrische Bedeutung.</b> Nach der Cauchy-Schwarz-Ungleichung ist\[\big|\langle\nabla f,\,h\rangle\big|\;\le\;\|\nabla f\|\cdot\|h\| ,\]und dieser Ausdruck wird maximal, falls \(h\) parallel zu \(\nabla f\) und gleich orientiert ist. Der Gradient zeigt also in die Richtung des stärksten Anstiegs von \(f\), und \(\|\nabla f\|\) ist die zugehörige maximale Anstiegsrate (bezogen auf \(\|h\|=1\)).</p>`,
        worte: String.raw`<p>Für \(n=1\) ist die Ableitung \(f'(x^{(0)})\) eine lineare Abbildung \(\mathbb{R}^m\to\mathbb{R}\), also eine Zeile. Jede solche Zeile lässt sich als Skalarprodukt mit einem festen Spaltenvektor schreiben — und dieser Vektor heißt Gradient. Die Formel \(f'(x^{(0)})h=\langle\nabla f,h\rangle\) ist damit keine tiefe Aussage, sondern die Übersetzung „lineares Funktional = Skalarprodukt mit einem Vektor“. Ihr Wert liegt darin, dass der Ableitung dadurch <i>eine Richtung</i> zugeordnet wird, über die man geometrisch reden kann.</p><p>Der Rest ist Cauchy-Schwarz. Hält man die Schrittlänge \(\|h\|\) fest und dreht die Richtung, so ist die Änderung von \(f\) in erster Ordnung gleich \(\langle\nabla f,h\rangle\). Dieses Skalarprodukt ist</p><ul><li><b>maximal</b>, wenn \(h\) in Richtung von \(\nabla f\) zeigt — Richtung des steilsten Anstiegs, Rate \(\|\nabla f\|\);</li><li><b>minimal</b>, wenn \(h\) entgegengesetzt zeigt — Richtung des steilsten Abstiegs, Rate \(-\|\nabla f\|\);</li><li><b>null</b>, wenn \(h\) senkrecht auf \(\nabla f\) steht — in erster Ordnung ändert sich \(f\) nicht, man läuft tangential zur Niveaumenge.</li></ul><p>In der Vorlesungsskizze ist das so gezeichnet: über der \((x_1,x_2)\)-Ebene liegt die Fläche mit dem Punkt \(\big(x_1,x_2,f(x_1,x_2)\big)\), darunter in der Grundebene der Punkt \((x_1,x_2)\); von beiden geht ein Pfeil aus, der den stärksten Anstieg andeutet. Wichtig für das Verständnis: der Gradient selbst lebt im Definitionsbereich \(\mathbb{R}^m\), er ist ein Vektor der Grundebene und kein Tangentialvektor an den Graphen — er gibt an, in welche Richtung man <i>in der Grundebene</i> laufen muss, damit es am steilsten bergauf geht.</p>`,
        beispiel: String.raw`<p>\(f(x_1,x_2)=x_1^3+x_2^2\), \(x^{(0)}=(1,2)^{T}\), also \(f(x^{(0)})=1+4=5\).</p><p><b>Schritt 1: Gradient bestimmen.</b> \(\frac{\partial f}{\partial x_1}=3x_1^2\), an \(x^{(0)}\) gleich \(3\); \(\frac{\partial f}{\partial x_2}=2x_2\), an \(x^{(0)}\) gleich \(4\). Beide sind auf ganz \(\mathbb{R}^2\) stetig, nach <a href="#/7.6.3">7.6.3</a> ist \(f\) also differenzierbar, und\[\nabla f\big|_{x=x^{(0)}}=\begin{pmatrix}3\\ 4\end{pmatrix},\qquad f'\big(x^{(0)}\big)=\big(3,\;4\big),\qquad \big\|\nabla f\big|_{x=x^{(0)}}\big\|=\sqrt{9+16}=5 .\]</p><p><b>Schritt 2: Gegenprobe über die Definition.</b> Mit \(h=(h_1,h_2)^{T}\) ist\[f\big(x^{(0)}+t\,h\big)=(1+th_1)^3+(2+th_2)^2=5+t\,(3h_1+4h_2)+t^2\big(3h_1^2+h_2^2\big)+t^3h_1^3,\]also\[Df\big(x^{(0)}\big)[h]=\lim_{t\to0}\frac{f(x^{(0)}+t\,h)-5}{t}=3h_1+4h_2=\Big\langle \nabla f\big|_{x=x^{(0)}},\;h\Big\rangle .\]</p><p><b>Schritt 3: Richtungen vergleichen</b> (jeweils \(\|h\|=1\)):</p><ul><li>\(h=e_1\): \(\;3\);</li><li>\(h=e_2\): \(\;4\);</li><li>\(h=\frac{1}{\sqrt2}(1,1)^{T}\): \(\;\frac{3+4}{\sqrt2}=\frac{7}{\sqrt2}\approx4{,}95\);</li><li>\(h=\frac15(3,4)^{T}\): \(\;\frac{9+16}{5}=5=\|\nabla f\|\) — das Maximum, wie von Cauchy-Schwarz vorhergesagt;</li><li>\(h=\frac15(4,-3)^{T}\): \(\;\frac{12-12}{5}=0\) — senkrecht zum Gradienten, tangential zur Niveaulinie \(x_1^3+x_2^2=5\).</li></ul><p><b>Schritt 4: lineare Näherung nutzen.</b> Für \(h=(0{,}1;\,-0{,}1)^{T}\) ist\[f\big(x^{(0)}+h\big)\approx 5+3\cdot0{,}1+4\cdot(-0{,}1)=4{,}9 ,\]während der exakte Wert \(f(1{,}1;\,1{,}9)=1{,}331+3{,}61=4{,}941\) beträgt. Der Fehler \(0{,}041\) ist gegenüber \(\|h\|\approx0{,}141\) klein und geht beim weiteren Verkleinern von \(h\) schneller als \(\|h\|\) gegen null — das ist die Aussage \(o(\|h\|)\).</p>`,
        plus: String.raw`<p><b>Zeile oder Spalte?</b> Die Vorlesung unterscheidet sauber: \(\operatorname{grad} f\big|_{x=x^{(0)}}=\nabla f\big|_{x=x^{(0)}}\) ist ein <i>Spaltenvektor</i>, die Ableitung \(f'(x^{(0)})=\mathcal{J}_{x^{(0)}}(f)\) die zugehörige <i>Zeile</i>, also \(f'(x^{(0)})=(\nabla f|_{x=x^{(0)}})^{T}\). In Rechnungen mit Matrizen kostet die Verwechslung Punkte: \(\mathcal{J}\,h\) ist ein Matrix-Vektor-Produkt, \(\langle\nabla f,h\rangle\) ein Skalarprodukt — beide liefern dieselbe Zahl, aber nur bei richtiger Anordnung.</p><p><b>Merksatz.</b> Der Gradient steht senkrecht auf den Niveaumengen \(\{x:\;f(x)=c\}\) und zeigt in Richtung wachsender Werte. Das folgt unmittelbar daraus, dass \(\langle\nabla f,h\rangle=0\) genau die Richtungen ohne Änderung erster Ordnung beschreibt.</p><p><b>Roter Faden nach vorn.</b> Ist \(x^{(0)}\) eine innere Extremstelle, so gibt es überhaupt keine Anstiegsrichtung; daraus wird die notwendige Bedingung \(\nabla f\big|_{x=x^{(0)}}=\mathbf{0}_m\) für lokale Extrema. Welche Art von kritischem Punkt vorliegt, entscheidet dann erst die zweite Ableitung, also die Hesse-Matrix \(H_{x_0}(f)\) aus dem Paragraphen 7.7 über Ableitungen höherer Ordnung — dort wechselt die Vorlesung übrigens vom Entwicklungspunkt \(x^{(0)}\) zurück auf die Schreibweise \(x_0\). Für den Aufbau des gesamten Kapitels vgl. den Spickzettel <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p><p><b>Anwendungsblick.</b> Dass \(-\nabla f\) die Richtung des steilsten Abstiegs ist, ist die gesamte Idee des Gradientenverfahrens der numerischen Optimierung: man läuft schrittweise gegen den Gradienten und landet in einem kritischen Punkt.</p>`}}]},
    {id:"7.7", t:"Ableitungen höherer Ordnung", topics:[
       {id:"7.7.1", title:"Die zweite Fréchet-Ableitung", body:{
        def: String.raw`<p><b>Ausgangspunkt: die Ableitung als \(\mathcal{L}(E,F)\)-wertige Funktion.</b> Sei \(f:U\subset E\to F\) in <b>allen</b> \(x\in U\) Fréchet-differenzierbar, also</p>\[f(x+h)=f(x)+T_xh+o(\|h\|_E).\]<p>Für jedes fixierte \(x\in U\) ist \(T_x=f'(x)\in\mathcal{L}(E,F)\). Damit ist die Ableitung selbst eine Funktion mit Werten im normierten Raum \(\big(\mathcal{L}(E,F),\|\cdot\|_{\mathcal{L}(E,F)}\big)\):</p>\[T_\bullet=f'(\cdot):\;U\longrightarrow\mathcal{L}(E,F),\qquad x\longmapsto T_x=f'(x).\]<p><b>Definition (zweite Fréchet-Ableitung).</b> Gilt für \(\hat h\to\mathbf{0}_E\)</p>\[\underbrace{f'(x_0+\hat h)}_{\in\,\mathcal{L}(E,F)}=\underbrace{f'(x_0)}_{\in\,\mathcal{L}(E,F)}+\hat T_{x_0}\hat h+o(\|\hat h\|_E)\]<p>mit einem \(\hat T_{x_0}\in\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\) — das Restglied wird dabei in der Operatornorm \(\|\cdot\|_{\mathcal{L}(E,F)}\) gemessen, \(\hat T_{x_0}\hat h\in\mathcal{L}(E,F)\) —, so nennt man</p>\[\hat T_{x_0}=f''(x_0)\in\mathcal{L}\big(E,\mathcal{L}(E,F)\big)\]<p>die <b>zweite Fréchet-Ableitung</b> von \(f\) in \(x_0\).</p><p><b>Typen-Buchführung.</b> Für \(h\in E\) ist \(f''(x_0)h\in\mathcal{L}(E,F)\), für \(k\in E\) also \(\big[f''(x_0)h\big]k\in F\). Man fasst \(f''(x_0)\) deshalb als Abbildung</p>\[f''(x_0):E\times E\longrightarrow F,\qquad f''(x_0)[h,k]=\big[f''(x_0)h\big]k\]<p>auf; diese ist <b>bilinear</b> und <b>stetig</b>.</p>`,
