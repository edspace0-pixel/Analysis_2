        beispiel: String.raw`<p><b>Vollständige Diskussion von \(f(x,y)=x^3+y^3-3xy\).</b> Die kritischen Punkte \((0,0)^{T}\) und \((1,1)^{T}\) wurden in <a href="#/7.9.1">7.9.1</a> bestimmt.</p><p><b>Schritt 1 (Hesse-Matrix allgemein).</b> Aus \(\frac{\partial f}{\partial x}=3x^2-3y\) und \(\frac{\partial f}{\partial y}=3y^2-3x\) folgt \[H_{x}(f)=\begin{pmatrix}6x&-3\\ -3&6y\end{pmatrix},\] symmetrisch, wie es der Satz von Schwarz verlangt (die zweiten partiellen Ableitungen sind Polynome, also stetig).</p><p><b>Schritt 2 (Punkt \((0,0)^{T}\)).</b> \[H_{(0,0)^T}(f)=\begin{pmatrix}0&-3\\ -3&0\end{pmatrix},\qquad \operatorname{Tr}H=0=\lambda_1+\lambda_2,\qquad \det H=0\cdot0-(-3)^2=-9=\lambda_1\lambda_2 .\] Wegen \(\lambda_1\lambda_2=-9<0\) haben die Eigenwerte verschiedene Vorzeichen, also \(\lambda_1<0<\lambda_2\): <b>Fall 3</b>, kein lokaler Extremwert, <b>Sattelpunkt</b>. Explizit: \(\lambda^2-0\cdot\lambda-9=0\) liefert \(\lambda_1=-3\), \(\lambda_2=3\), mit Eigenvektoren \(v_1=(1,1)^{T}\) (denn \(Hv_1=(-3,-3)^{T}=-3v_1\)) und \(v_2=(1,-1)^{T}\) (denn \(Hv_2=(3,-3)^{T}=3v_2\)) — genau die Testrichtungen \(h''\) und \(h'\) aus <a href="#/7.9.3">7.9.3</a>.</p><p><b>Schritt 3 (Punkt \((1,1)^{T}\)).</b> \[H_{(1,1)^T}(f)=\begin{pmatrix}6&-3\\ -3&6\end{pmatrix},\qquad \operatorname{Tr}H=12,\qquad \det H=36-9=27 .\] Wegen \(\lambda_1\lambda_2=27>0\) und \(\lambda_1+\lambda_2=12>0\) sind beide Eigenwerte positiv: <b>Fall 1</b>, \(H_{x^*}(f)\) positiv definit, also lokales <b>Minimum</b> mit \(f(1,1)=-1\). Explizit aus \(\lambda^2-12\lambda+27=(\lambda-3)(\lambda-9)=0\): \(\lambda_1=3\), \(\lambda_2=9\). Nach dem Lemma ist \[\big\langle h,H_{(1,1)^T}(f)h\big\rangle\ \ge\ \lambda_1\|h\|^2=3\|h\|^2,\] also \(\varepsilon=3\) — dasselbe \(\varepsilon\), das in <a href="#/7.9.2">7.9.2</a> zu Fuß über \(3(h_1-h_2)^2\ge0\) gefunden wurde, und zwar das bestmögliche.</p><p><b>Schritt 4 (Schnellcheck für \(m=2\)).</b> Man muss nur zwei Zahlen ansehen:</p><ul><li>\(\det H<0\ \Rightarrow\) Sattelpunkt;</li><li>\(\det H>0\) und \(\operatorname{Tr}H>0\ \Rightarrow\) lokales Minimum;</li><li>\(\det H>0\) und \(\operatorname{Tr}H<0\ \Rightarrow\) lokales Maximum;</li><li>\(\det H=0\ \Rightarrow\) keine Aussage.</li></ul><p>Im Beispiel: \(-9<0\) in \((0,0)^{T}\) (Sattel), \(27>0\) und \(12>0\) in \((1,1)^{T}\) (Minimum).</p>`,
        plus: String.raw`<p><b>Das \(\varepsilon\) hat einen Namen.</b> Die abstrakte Bedingung \(f''(x^*)h^2\ge\varepsilon\|h\|^2\) aus <a href="#/7.9.2">7.9.2</a> ist im \(\mathbb{R}^m\) exakt die Bedingung \(\lambda_1>0\), mit \(\varepsilon=\lambda_1\) als optimaler Konstante. Deshalb ist hier — anders als in unendlichdimensionalen Räumen — „\(\langle h,Hh\rangle>0\) für alle \(h\ne\mathbf{0}_m\)“ bereits gleichbedeutend mit positiver Definitheit: das Minimum über die (kompakte) Einheitssphäre wird angenommen und ist \(\lambda_1\).</p><p><b>Klausurfalle \(\det H=0\).</b> Der häufigste Fehler ist, aus \(\lambda_1=0,\ \lambda_2>0\) auf ein Minimum zu schließen. Gegenbeispielpaar: \(f(x,y)=x^2+y^4\) und \(g(x,y)=x^2-y^4\) haben in \((0,0)^{T}\) beide \(H=\begin{pmatrix}2&0\\0&0\end{pmatrix}\), also \(\det H=0\); dennoch hat \(f\) ein striktes lokales Minimum und \(g\) einen Sattelpunkt. In diesem Fall muss man von Hand untersuchen — etwa entlang der Richtung, in der die Form verschwindet.</p><p><b>Reihenfolge im Rechenweg.</b> (1) \(\nabla f\big|_{x}\) aufstellen und \(\nabla f\big|_{x=x^*}=\mathbf{0}_m\) lösen — alle Kandidaten sammeln. (2) \(H_x(f)\) einmal allgemein aufstellen. (3) In jeden Kandidaten einsetzen und die Eigenwerte bzw. für \(m=2\) nur \(\operatorname{Tr}H\) und \(\det H\) bestimmen. (4) Fall 1/2/3 zuordnen. Nur global gesuchte Extrema auf abgeschlossenen Mengen brauchen zusätzlich eine Randbetrachtung — dafür siehe die Lagrange-Multiplikatoren in §7.12.</p><p><b>Einordnung.</b> Aus der Linearen Algebra kennt man für die Definitheit auch das Hauptminoren-Kriterium; die Vorlesung argumentiert bewusst über Eigenwerte, weil nur der Rayleigh-Quotient direkt das \(\varepsilon\) der abstrakten Definition liefert. Eine Übersicht über die Sätze dieses Kapitels bietet der Spickzettel <a href="#/ref/saetze">Sätze</a>.</p>`}}]},
    {id:"7.10", t:"Der Fixpunktsatz von Banach", topics:[
       {id:"7.10.1", title:"Kontraktion und Fixpunktsatz", body:{
        def: String.raw`<p>Sei \((M,d)\) ein <b>vollständiger</b> metrischer Raum (Tafel-Abkürzung: m.R.) mit \(\emptyset\neq M\), und sei \(T:M\to M\).</p><p><b>Definition.</b> Man nennt \(T\) eine <b>Kontraktion</b>, falls ein \(\alpha<1\) existiert, so dass für alle \(x,y\in M\) gilt \[d(Tx,Ty)\;\leq\;\alpha\cdot d(x,y).\]</p><p><b>Satz (Banach).</b> Sei \(T:M\to M\) eine Kontraktion auf einem vollständigen m.R. Dann existiert <b>genau ein</b> \(x^*\in M\) mit \[Tx^*=x^*.\]</p><p><b>Anmerkung.</b> Lösungen der Gleichung \(Tx=x\) nennt man <b>Fixpunkte</b> von \(T\). Im Beweis wird \(\alpha\in\left]0,1\right[\) benutzt; das ist keine Einschränkung: aus \(0\leq d(Tx,Ty)\leq\alpha\,d(x,y)\) folgt \(\alpha\geq 0\), sobald \(M\) mehr als einen Punkt enthält, und \(\alpha=0\) bedeutet, dass \(T\) konstant ist — der Fixpunkt ist dann sofort abzulesen.</p>`,
        worte: String.raw`<p>Eine Kontraktion zieht je zwei Punkte um einen <i>festen</i> Faktor \(\alpha<1\) zusammen: nach einer Anwendung von \(T\) ist ihr Abstand höchstens noch das \(\alpha\)-fache. Wiederholt man das, schrumpfen alle Abstände geometrisch, die Bahnen \(x,Tx,T^2x,\ldots\) laufen also zwangsläufig zusammen. Der Satz sagt mehr: sie laufen alle auf <i>denselben</i> Punkt zu, und dieser Punkt bleibt unter \(T\) stehen.</p><p>Worauf es ankommt:</p><ul><li><b>\(\alpha\) ist uniform.</b> Ein einziges \(\alpha<1\) muss für <i>alle</i> Paare \(x,y\in M\) taugen. Die schwächere Bedingung \(d(Tx,Ty)< d(x,y)\) für \(x\neq y\) reicht nicht (siehe Gegenbeispiel).</li><li><b>\(T\) bildet \(M\) in sich ab.</b> Sonst ist schon \(x_2=Tx_1\) nicht definiert und man kann nicht iterieren. Das ist der Punkt, den man in Aufgaben am häufigsten vergisst zu prüfen.</li><li><b>\(M\) ist vollständig und nicht leer.</b> Die Kontraktionsbedingung liefert nur eine Cauchy-Folge; erst die Vollständigkeit gibt ihr einen Grenzwert <i>in \(M\)</i>.</li><li>Eine Kontraktion ist Lipschitz-stetig mit Konstante \(\alpha\), insbesondere stetig. Genau das wird in Schritt 3 benutzt: \(d(Tx^*,Tx_{n-1})\leq\alpha\,d(x^*,x_{n-1})\to 0\), d.h. \(Tx_{n-1}\to Tx^*\).</li></ul><p><b>Beweis in vier Schritten</b> (die Vorlesung nummeriert sie eingekreist am Rand):</p><ul><li><b>Schritt 1.</b> Wähle \(x_0\in M\) beliebig und iteriere: \(x_1=Tx_0\), \(x_2=Tx_1\), \(\ldots\), \(x_n=Tx_{n-1}\), \(\ldots\) Das liefert eine Folge \((x_k)_{k=0}^{\infty}\) in \(M\).</li><li><b>Schritt 2.</b> Es ist \((x_k)\in\mathrm{CF}(M,d)\), d.h. die Folge ist eine Cauchy-Folge: für \(n>m\) gilt \(d(x_n,x_m)\leq\frac{\alpha^m}{1-\alpha}\,d(x_1,x_0)\), und wegen \(\alpha^m\to 0\) existiert zu jedem \(\varepsilon>0\) ein \(N_\varepsilon\in\mathbb{N}\) mit \(n>m\geq N_\varepsilon\Rightarrow d(x_n,x_m)<\varepsilon\) (Rechnung in <a href="#/7.10.2">7.10.2</a>). Wegen der Vollständigkeit von \(M\) existiert somit \[x^*=\lim_{n\to\infty}x_n=\lim_{n\to\infty}T^nx_0\in M.\]</li><li><b>Schritt 3 (Existenz).</b> Wegen \(x_n=Tx_{n-1}\) ist \[0\leq d(Tx^*,x^*)\leq d(Tx^*,x_n)+d(x_n,x^*)=d(Tx^*,Tx_{n-1})+d(x_n,x^*)\leq\alpha\,d(x^*,x_{n-1})+d(x_n,x^*).\] Beide Summanden streben für \(n\to\infty\) gegen \(0\), die linke Seite hängt aber gar nicht von \(n\) ab. Also \(d(Tx^*,x^*)=0\), d.h. \(Tx^*=x^*\).</li><li><b>Schritt 4 (Eindeutigkeit).</b> Seien \(x^*,x^{**}\in M\) mit \(Tx^*=x^*\) und \(Tx^{**}=x^{**}\). Dann \[0\leq d(x^*,x^{**})=d(Tx^*,Tx^{**})\leq\alpha\,d(x^*,x^{**}),\qquad\alpha<1.\] Das ist nur für \(d(x^*,x^{**})=0\) möglich, also \(x^*=x^{**}\).</li></ul><p>Der Trick in Schritt 4 ist typisch: eine nichtnegative Zahl \(t\) mit \(t\leq\alpha t\) und \(\alpha<1\) muss \(t=0\) sein. Denselben Kniff braucht man immer wieder, siehe <a href="#/ref/beweise">Beweistechniken</a>.</p>`,
        erfuellt: String.raw`<p><b>Beispiel einer Kontraktion.</b> \(M=[0,1]\subset\mathbb{R}\) mit \(d(x,y)=|x-y|\) und \[T:M\to M,\qquad Tx=\frac{x^2+1}{4}.\]</p><p><b>(i) \(M\) ist nicht leer und vollständig.</b> \([0,1]\) ist abgeschlossen in \(\mathbb{R}\), und abgeschlossene Teilmengen eines vollständigen Raums sind vollständig.</p><p><b>(ii) \(T\) bildet \(M\) in sich ab.</b> Für \(x\in[0,1]\) ist \(0\leq x^2\leq 1\), also \[Tx=\frac{x^2+1}{4}\in\left[\tfrac14,\tfrac12\right]\subset[0,1].\]</p><p><b>(iii) Kontraktionskonstante.</b> Für \(x,y\in[0,1]\) ist \[|Tx-Ty|=\frac{|x^2-y^2|}{4}=\frac{|x+y|}{4}\,|x-y|\leq\frac{2}{4}\,|x-y|=\frac12\,|x-y|,\] denn \(0\leq x+y\leq 2\). Also ist \(T\) eine Kontraktion mit \(\alpha=\tfrac12<1\).</p><p><b>(iv) Folgerung.</b> Nach dem Satz von Banach hat \(T\) genau einen Fixpunkt in \([0,1]\). Hier kann man ihn ausrechnen: \[x=\frac{x^2+1}{4}\iff x^2-4x+1=0\iff x=2\pm\sqrt3.\] Wegen \(2+\sqrt3\approx 3{,}73\notin[0,1]\) bleibt \[x^*=2-\sqrt3\approx 0{,}2679.\] Probe: \((2-\sqrt3)^2=7-4\sqrt3\), also \(\frac{(7-4\sqrt3)+1}{4}=\frac{8-4\sqrt3}{4}=2-\sqrt3\). Passt.</p>`,
        verletzt: String.raw`<p><b>Gegenbeispiel 1: „echt kleiner“ genügt nicht.</b> \(M=[1,\infty[\;\subset\mathbb{R}\) mit \(d(x,y)=|x-y|\) und \[Tx=x+\frac1x.\]</p><p><b>(i)</b> \(M\) ist abgeschlossen in \(\mathbb{R}\), also vollständig, und \(T\) bildet \(M\) in sich ab: für \(x\geq 1\) ist \(Tx=x+\frac1x\geq 1\).</p><p><b>(ii) Abstände werden echt kleiner.</b> Für \(1\leq x< y\) ist \[Ty-Tx=(y-x)+\left(\frac1y-\frac1x\right)=(y-x)-\frac{y-x}{xy}=(y-x)\left(1-\frac{1}{xy}\right).\] Wegen \(xy>1\) ist \(0<1-\frac{1}{xy}<1\), also \[0< d(Tx,Ty)< d(x,y)\qquad\text{für alle }x\neq y.\]</p><p><b>(iii) Trotzdem keine Kontraktion.</b> Ein zulässiges \(\alpha\) müsste \(1-\frac{1}{xy}\leq\alpha\) für alle \(x,y\) erfüllen. Mit \(x=n\), \(y=n+1\) ist \[\frac{d(Tx,Ty)}{d(x,y)}=1-\frac{1}{n(n+1)}\;\longrightarrow\;1\qquad(n\to\infty),\] das Supremum der Quotienten ist also \(1\). Es gibt kein \(\alpha<1\).</p><p><b>(iv) Und tatsächlich kein Fixpunkt:</b> \(Tx=x\iff\frac1x=0\), unlösbar. Die uniforme Konstante ist also wirklich unverzichtbar.</p><p><b>Gegenbeispiel 2: fehlende Vollständigkeit.</b> \(M=\left]0,1\right]\), \(Tx=\frac{x}{2}\). Hier ist \(T(M)=\left]0,\tfrac12\right]\subset M\) und \(|Tx-Ty|=\tfrac12|x-y|\), also eine Kontraktion mit \(\alpha=\tfrac12\). Dennoch gibt es keinen Fixpunkt: \(x=\frac{x}{2}\iff x=0\notin M\). Der Grund: \(\left]0,1\right]\) ist <b>nicht vollständig</b>, die Iterationsfolge \(x_k=2^{-k}\) ist Cauchy, ihr Grenzwert \(0\) liegt aber nicht in \(M\).</p>`,
        plus: String.raw`<p><b>Vier Voraussetzungen, vier Fehlerquellen.</b> \(M\neq\emptyset\), \(M\) vollständig, \(T(M)\subseteq M\), \(\alpha<1\) uniform. Jede einzelne kann man verletzen und den Satz damit kippen (die beiden Gegenbeispiele oben zeigen die letzten beiden). In Klausuraufgaben ist genau diese Reihenfolge das Prüfschema.</p><p><b>Der Fixpunkt hängt nicht vom Startpunkt ab.</b> Aus der Eindeutigkeit folgt: \(\lim_{n\to\infty}T^nx_0\) ist für <i>jedes</i> \(x_0\in M\) dasselbe \(x^*\). Man darf den bequemsten Startwert wählen.</p><p><b>Notation der Vorlesung.</b> Das Argument wird ohne Klammern angehängt: \(Tx\), \(Tx_{n-1}\), \(T^nx_0\) (n-fache Anwendung). \(\mathrm{CF}(M,d)\) bezeichnet die Cauchy-Folgen in \((M,d)\); Fixpunkte tragen einen Stern, im Eindeutigkeitsbeweis zwei: \(x^*\), \(x^{**}\).</p><p><b>Roter Faden.</b> Der Fixpunktsatz ist kein Nebenschauplatz, sondern die Maschine hinter dem Rest des Kapitels: der Satz über implizite Funktionen (§7.11) und der Umkehrsatz werden bewiesen, indem man die zu lösende Gleichung in die Form \(Tx=x\) bringt und \(T\) als Kontraktion nachweist. Als \(M\) dient dabei nicht der ganze Raum, sondern eine abgeschlossene Kugel um den Ausgangspunkt — abgeschlossene Teilmengen vollständiger Räume sind ja wieder vollständig. Deshalb wird der Satz gleich für allgemeine vollständige metrische Räume formuliert und nicht nur für \(\mathbb{R}^m\): Funktionenräume wie \(C(X,Y)\) mit \(\|\cdot\|_C\), vollständig nach <a href="#/6.2.2">6.2.2</a>, sind damit ohne Zusatzarbeit mit erfasst. Weitere Einordnung: <a href="#/ref/saetze">Sätze-Übersicht</a>.</p>`}},
       {id:"7.10.2", title:"Iterationsverfahren und Fehlerabschätzung", body:{
        def: String.raw`<p><b>Anmerkung.</b> Der Beweis des Fixpunktsatzes (<a href="#/7.10.1">7.10.1</a>) ist konstruktiv; er liefert zwei Dinge.</p><p><b>Ein Lösungsverfahren.</b> Wähle \(x_0\in M\) beliebig und setze \(x_1=Tx_0\), \(x_2=Tx_1\), \(\ldots\), \(x_n=Tx_{n-1}\). Dann konvergiert die Iterationsfolge gegen den Fixpunkt: \[x^*=\lim_{n\to\infty}x_n=\lim_{n\to\infty}T^nx_0.\]</p><p><b>Grundabschätzung.</b> Aufeinanderfolgende Glieder rücken geometrisch zusammen: \[d(x_k,x_{k-1})=d(Tx_{k-1},Tx_{k-2})\leq\alpha\,d(x_{k-1},x_{k-2})\leq\alpha^2 d(x_{k-2},x_{k-3})\leq\ldots\leq\alpha^{k-1}d(x_1,x_0).\] Für \(n>m\) folgt mit der Dreiecksungleichung \[d(x_n,x_m)\leq d(x_n,x_{n-1})+d(x_{n-1},x_{n-2})+\ldots+d(x_{m+1},x_m)\leq\left(\alpha^{n-1}+\alpha^{n-2}+\ldots+\alpha^{m}\right)d(x_1,x_0)\] und wegen \(\alpha^{n-1}+\ldots+\alpha^m=\alpha^m\left(\alpha^{n-m-1}+\ldots+1\right)\leq\dfrac{\alpha^m}{1-\alpha}\) schließlich \[d(x_n,x_m)\leq\frac{\alpha^{m}}{1-\alpha}\,d(x_1,x_0),\qquad n>m,\ \alpha\in\left]0,1\right[.\]</p><p><b>Cauchy-Kriterium.</b> Wegen \(\alpha^m\to 0\) heißt das: es existiert zu jedem \(\varepsilon>0\) ein \(N_\varepsilon\in\mathbb{N}\) mit \[n>m\geq N_\varepsilon\;\Longrightarrow\;d(x_n,x_m)<\varepsilon.\]</p><p><b>Eine Fehlerabschätzung.</b> Mit \(n\to\infty\) (also \(x_n\to x^*\)) geht daraus hervor \[d(x^*,x_m)\leq\frac{\alpha^{m}}{1-\alpha}\,d(x_1,x_0)\qquad\text{für alle }m\in\mathbb{N}.\]</p>`,
        worte: String.raw`<p>Die Kette \(d(x_k,x_{k-1})\leq\alpha^{k-1}d(x_1,x_0)\) ist der ganze Kern: jeder Iterationsschritt ist höchstens \(\alpha\)-mal so groß wie der vorige, die Schrittlängen bilden also eine geometrische Nullfolge. Summiert man sie über die Dreiecksungleichung auf, steht rechts ein Stück der geometrischen Reihe, und die schätzt man großzügig durch ihren vollen Wert \(\frac{1}{1-\alpha}\) ab. Deshalb steht in der Schranke \(\alpha^m\) und nicht \(\alpha^n\): der <i>kleinere</i> Index bestimmt die Genauigkeit, und da \(\alpha^m\to 0\), ist das Cauchy-Kriterium erfüllt.</p><p>Beim Grenzübergang \(n\to\infty\) bleibt \(m\) fest stehen, nur \(x_n\) wandert nach \(x^*\); die rechte Seite hängt gar nicht von \(n\) ab. Sauber begründet man das mit \(d(x^*,x_m)\leq d(x^*,x_n)+d(x_n,x_m)\) und lässt im ersten Summanden \(n\to\infty\) laufen.</p><p>Warum das praktisch wertvoll ist:</p><ul><li><b>Es ist eine A-priori-Abschätzung.</b> Rechts stehen nur \(\alpha\) und der <i>erste</i> Schritt \(d(x_1,x_0)\). Man kann also nach einem einzigen Iterationsschritt ausrechnen, wie viele Schritte für eine geforderte Genauigkeit garantiert reichen, ohne sie ausgeführt zu haben.</li><li><b>Die Konvergenz ist mindestens geometrisch</b> mit Rate \(\alpha\): pro Schritt gewinnt man den Faktor \(\alpha\). Kleines \(\alpha\) heißt schnell, ein \(\alpha\) knapp unter \(1\) heißt sehr langsam, denn dann ist zusätzlich der Vorfaktor \(\frac{1}{1-\alpha}\) riesig.</li><li><b>Es ist eine Garantie, keine Prognose.</b> Der tatsächliche Fehler darf beliebig viel kleiner sein als die Schranke, siehe das Beispiel.</li></ul>`,
        beispiel: String.raw`<p><b>Wurzelziehen als Fixpunktiteration (Heron-Verfahren).</b> Gesucht ist \(\sqrt2\). Wir setzen \[M=[1,2],\qquad d(x,y)=|x-y|,\qquad Tx=\frac12\left(x+\frac2x\right).\]</p><p><b>Schritt A: \(M\) ist nicht leer und vollständig.</b> \([1,2]\) ist abgeschlossen in \(\mathbb{R}\), also vollständig.</p><p><b>Schritt B: \(T\) bildet \(M\) in sich ab.</b> Für \(x\in[1,2]\) ist \[Tx-\sqrt2=\frac{x^2-2\sqrt2\,x+2}{2x}=\frac{(x-\sqrt2)^2}{2x}\geq 0,\] also \(Tx\geq\sqrt2\geq 1\). Nach oben: \(x\leq 2\) und \(\frac2x\leq 2\), also \(Tx\leq\frac12(2+2)=2\). Zusammen \(T([1,2])\subseteq[\sqrt2,2]\subset[1,2]\).</p><p><b>Schritt C: Kontraktionskonstante.</b> Für \(x,y\in[1,2]\) ist \[Tx-Ty=\frac12\left[(x-y)+2\left(\frac1x-\frac1y\right)\right]=\frac12\,(x-y)\left(1-\frac{2}{xy}\right).\] Wegen \(1\leq xy\leq 4\) ist \(\frac12\leq\frac{2}{xy}\leq 2\), also \(\left|1-\frac{2}{xy}\right|\leq 1\) und damit \[|Tx-Ty|\leq\frac12\,|x-y|.\] \(T\) ist eine Kontraktion mit \(\alpha=\tfrac12\).</p><p><b>Schritt D: Der Satz greift.</b> Es gibt genau ein \(x^*\in[1,2]\) mit \(Tx^*=x^*\), und \[x=\frac12\left(x+\frac2x\right)\iff 2x=x+\frac2x\iff x^2=2\iff x^*=\sqrt2.\]</p><p><b>Schritt E: Iteration mit \(x_0=2\).</b> \[x_1=\frac12\left(2+1\right)=\frac32,\qquad x_2=\frac12\left(\frac32+\frac43\right)=\frac12\cdot\frac{17}{6}=\frac{17}{12}\approx 1{,}41667,\] \[x_3=\frac12\left(\frac{17}{12}+\frac{24}{17}\right)=\frac12\cdot\frac{289+288}{204}=\frac{577}{408}\approx 1{,}4142157.\]</p><p><b>Schritt F: Fehlerabschätzung.</b> Es ist \(d(x_1,x_0)=\left|\frac32-2\right|=\frac12\) und \(\frac{1}{1-\alpha}=2\), also \[\left|\sqrt2-x_m\right|\leq\frac{\alpha^m}{1-\alpha}\,d(x_1,x_0)=\left(\frac12\right)^{m}\cdot 2\cdot\frac12=2^{-m}.\] Für \(m=3\) garantiert das \(\left|\sqrt2-x_3\right|\leq\frac18=0{,}125\); tatsächlich ist der Fehler \(\approx 2{,}1\cdot 10^{-6}\), also weit besser als die Garantie.</p><p><b>Schritt G: Schrittzahl planen.</b> Wie viele Iterationen sichern \(10^{-3}\)? Aus \(2^{-m}\leq 10^{-3}\) folgt \(2^m\geq 1000\), also \(m\geq 10\) (wegen \(2^{10}=1024\)). Diese Aussage steht fest, <i>bevor</i> man die zehn Schritte rechnet.</p>`,
        plus: String.raw`<p><b>A priori und a posteriori.</b> Die Tafelabschätzung \(d(x^*,x_m)\leq\frac{\alpha^m}{1-\alpha}d(x_1,x_0)\) benutzt nur den ersten Schritt und ist deshalb meist grob. Weil sie für <i>jeden</i> Startwert gilt, darf man sie auf die verschobene Iteration \(\tilde x_0:=x_{m-1}\), \(\tilde x_k=x_{m-1+k}\) anwenden — gleiches \(T\), gleicher Fixpunkt. Mit dem Index \(1\) statt \(m\) liefert sie \(d(x^*,\tilde x_1)\leq\frac{\alpha}{1-\alpha}d(\tilde x_1,\tilde x_0)\), wegen \(\tilde x_1=x_m\) also die schärfere A-posteriori-Abschätzung \[d(x^*,x_m)\leq\frac{\alpha}{1-\alpha}\,d(x_m,x_{m-1}),\qquad m\geq 1,\] in der der zuletzt gemachte Schritt steht. Im Beispiel oben ist \(d(x_3,x_2)=\left|\frac{577}{408}-\frac{17}{12}\right|=\frac{1}{408}\) und \(\frac{\alpha}{1-\alpha}=1\), also \(\left|\sqrt2-x_3\right|\leq\frac{1}{408}\approx 2{,}5\cdot 10^{-3}\) statt \(0{,}125\). Faustregel: a priori zum Planen, a posteriori zum Abnehmen des Ergebnisses.</p><p><b>Klausurfalle.</b> Die Abschätzung gilt für \(n>m\); dreht man die Rollen um, steht auf der rechten Seite der falsche Exponent. Und \(\frac{1}{1-\alpha}\) kommt aus der <i>unendlichen</i> geometrischen Reihe, ist also nur wegen \(\alpha<1\) endlich. Nochmals: erst \(M\neq\emptyset\) vollständig, dann \(T(M)\subseteq M\), dann \(\alpha\) bestimmen, und erst danach iterieren und abschätzen.</p><p><b>Die Schranke ist nicht die Wahrheit.</b> Das Heron-Verfahren ist ein Newton-Verfahren und konvergiert in Wirklichkeit quadratisch, der Fehler quadriert sich also grob pro Schritt. Der Fixpunktsatz sieht davon nichts, er garantiert nur die geometrische Rate \(\alpha\). Umgekehrt gilt: eine schlechte Wahl von \(M\) liefert ein großes \(\alpha\) und damit eine unnötig pessimistische Schranke, obwohl das Verfahren dasselbe ist.</p><p><b>Wozu das gebraucht wird.</b> Genau dieses Iterationsschema trägt den Satz über implizite Funktionen (§7.11) und den Umkehrsatz: dort wird die Auflösung \(y(x)\) als Grenzwert \(\lim_{n\to\infty}T^ny_0\) einer Kontraktion konstruiert, wobei \(M\) eine abgeschlossene Kugel in einem vollständigen Raum ist. Dieselbe Konstruktion, dann in einem Funktionenraum wie \(C(X,Y)\) mit \(\|\cdot\|_C\) (<a href="#/6.2.2">6.2.2</a>), liefert später in der Theorie der Differentialgleichungen den Existenzsatz von Picard-Lindelöf. Vergleiche auch die Iterationsverfahren aus der eindimensionalen <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>`}}]},
    {id:"7.11", t:"Der Satz über implizite Funktionen", topics:[
       {id:"7.11.1", title:"Motivation und lokale Auflösbarkeit", body:{
        def: String.raw`<p><b>Ausgangsfrage.</b> Gegeben eine Gleichung \(\Phi(x,y)=0\) mit zwei Gruppen von Variablen. Gibt es eine Funktion \(y=y(x)\), so dass \(y=y(x)\ \Longleftrightarrow\ \Phi(x,y)=0\)?</p>
<p><b>Motivation, Beispiel 1 (Kreis).</b> \(\Phi:\mathbb{R}\times\mathbb{R}\to\mathbb{R}\), \(\Phi(x,y)=x^2+y^2-r^2\), \(r>0\); dabei sind \(x,y\in\mathbb{R}\) Variablen und \(r\) ein Parameter. Betrachtet wird \(\Phi(x,y)=0\) um einen Punkt mit \(\Phi(x_0,y_0)=0\).<br><b>Global:</b> Nein. <b>Lokal:</b> Hängt von \((x_0,y_0)\) ab.</p>
<p><b>Idee (Linearisierung).</b> Mit \(h_x=x-x_0\), \(h_y=y-y_0\):</p>
\[\underbrace{\Phi(x_0+h_x,\,y_0+h_y)}_{=\,0}=\underbrace{\Phi(x_0,y_0)}_{=\,0}+\frac{\partial\Phi}{\partial x}\Big|_{(x_0,y_0)}h_x+\frac{\partial\Phi}{\partial y}\Big|_{(x_0,y_0)}h_y+\underbrace{r_1(h_x,h_y)}_{o(\|h\|)}\]
\[h_y=y-y_0=-\frac{1}{\frac{\partial\Phi}{\partial y}\big|_{(x_0,y_0)}}\left(\frac{\partial\Phi}{\partial x}\Big|_{(x_0,y_0)}(x-x_0)+r_1(x-x_0,\,y-y_0)\right),\qquad\text{falls }\ \frac{\partial\Phi}{\partial y}\Big|_{(x_0,y_0)}\neq 0.\]
<p><b>Motivation, Beispiel 2 (System).</b> \(x=(x_1,\dots,x_m)\in\mathbb{R}^m\), \(y=(y_1,\dots,y_n)\in\mathbb{R}^n\), \(\Phi:\mathbb{R}^m\times\mathbb{R}^n\to\mathbb{R}^n\):</p>
\[\Phi(x,y)=\mathbf{0}_n\in\mathbb{R}^n\iff\begin{cases}\Phi_1(x_1,\dots,x_m;\,y_1,\dots,y_n)=0\\ \qquad\vdots\\ \Phi_n(x_1,\dots,x_m;\,y_1,\dots,y_n)=0\end{cases}\]
<p><i>Frage der Vorlesung:</i> Kann man aus diesen \(n\) Gleichungen \(y=(y_1,\dots,y_n)\) nach \(x=(x_1,\dots,x_m)\) auflösen?</p>
<p>Die Ableitung im Punkt \((x^{(0)},y^{(0)})\) zerfällt in zwei Blöcke:</p>
\[\Phi'\big|_{(x^{(0)},y^{(0)})}=\begin{pmatrix}\frac{\partial\Phi_1}{\partial x_1}&\cdots&\frac{\partial\Phi_1}{\partial x_m}&\Big|&\frac{\partial\Phi_1}{\partial y_1}&\cdots&\frac{\partial\Phi_1}{\partial y_n}\\ \vdots& &\vdots&\Big|&\vdots& &\vdots\\ \frac{\partial\Phi_n}{\partial x_1}&\cdots&\frac{\partial\Phi_n}{\partial x_m}&\Big|&\frac{\partial\Phi_n}{\partial y_1}&\cdots&\frac{\partial\Phi_n}{\partial y_n}\end{pmatrix}=\left(\ \frac{\partial\Phi}{\partial x}\ \Big|\ \frac{\partial\Phi}{\partial y}\ \right)\]
<p>Ist der \(n\times n\)-Block \(\frac{\partial\Phi}{\partial y}\big|_{(x^{(0)},y^{(0)})}\) invertierbar, so folgt formal</p>
\[h_y=y-y^{(0)}=-\left(\frac{\partial\Phi}{\partial y}\Big|_{(x^{(0)},y^{(0)})}\right)^{-1}\left(\frac{\partial\Phi}{\partial x}\Big|_{(x^{(0)},y^{(0)})}\big(x-x^{(0)}\big)+o\big(\|h_x\|+\|h_y\|\big)\right).\]
<p><b>Allgemeine Problemstellung.</b> \(E,F,G\) Banachräume, \(E\times F\ni(x,y)\) mit der Produktnorm \(\|(x,y)\|_{E\times F}=\|x\|_E+\|y\|_F\); \(V\subset E\times F\) offen, \((x_0,y_0)\in V\), \(\Phi:V\subset E\times F\to G\) mit \(\Phi(x_0,y_0)=\mathbf{0}_G\). Gesucht ist die Auflösung von \(\Phi(x,y)=\mathbf{0}_G\) nach \(y\).</p>
<p><b>Definition (lokale Auflösbarkeit).</b> \(\Phi\) heißt in einer Umgebung von \((x_0,y_0)\) <b>lokal auflösbar</b>, wenn \(\varepsilon>0\) und \(\delta>0\) existieren mit \(U_\varepsilon(x_0)\times U_\delta(y_0)\subset V\) und wenn eine Funktion \(f:U_\varepsilon(x_0)\to U_\delta(y_0)\) existiert mit</p>
<ul><li>(1) \(\ \forall\,x\in U_\varepsilon(x_0):\quad \Phi\big(x,f(x)\big)=\mathbf{0}_G\)</li>
<li>(2) \(\ \forall\,(x,y)\in U_\varepsilon(x_0)\times U_\delta(y_0):\quad \Phi(x,y)=\mathbf{0}_G\ \Rightarrow\ y=f(x)\)</li></ul>`,
        worte: String.raw`<p>Eine Gleichung wie \(x^2+y^2=r^2\) beschreibt eine Kurve, keinen Funktionsgraphen: über einem \(x\) mit \(|x|< r\) liegen zwei Lösungspunkte, über \(|x|>r\) gar keiner. <b>Global</b> kann es deshalb keine Funktion \(y(x)\) geben, deren Graph genau die Lösungsmenge ist. Beschränkt man den Blick jedoch auf ein kleines Fenster \(U_\varepsilon(x_0)\times U_\delta(y_0)\) um einen Lösungspunkt, so sieht die Kurve dort meistens wie ein Graph aus. Genau das fordert die Definition: (1) ist die <i>Existenz</i> (die Funktion \(f\) liefert wirklich Lösungen), (2) ist die <i>Eindeutigkeit</i> (im Fenster gibt es keine weiteren Lösungen). Ohne (2) wäre die Definition wertlos, denn \(f\) dürfte dann willkürlich zwischen mehreren Zweigen hin- und herspringen.</p>
<p>Warum ist ausgerechnet \(\frac{\partial\Phi}{\partial y}\neq 0\) die richtige Bedingung? Die Linearisierung ersetzt \(\Phi\) in erster Ordnung durch seine Tangentialabbildung. Die linearisierte Gleichung \(\Phi_x h_x+\Phi_y h_y=0\) ist genau dann nach \(h_y\) auflösbar, wenn der \(y\)-Anteil \(\Phi_y\) invertierbar ist; das Restglied \(r_1=o(\|h\|)\) ist so klein, dass es diese Auflösbarkeit in einer kleinen Umgebung nicht zerstört. Anschaulich bedeutet \(\Phi_y(x_0,y_0)=0\) bei \(\Phi_x(x_0,y_0)\neq 0\), dass die Niveaulinie dort eine senkrechte Tangente hat — und über einer senkrechten Tangente kippt jeder Graph um. (Verschwinden beide partiellen Ableitungen, so ist der Punkt singulär und es gibt überhaupt keine Tangente.)</p>
<p>Beim Übergang zu \(\mathbb{R}^m\times\mathbb{R}^n\) wird aus der Zahl \(\partial\Phi/\partial y\) der rechte \(n\times n\)-Block der Jacobi-Matrix, aus „ungleich null“ wird „invertierbar“ und aus der Division die Multiplikation mit der inversen Matrix. Man beachte die Buchführung: es gibt genau so viele Gleichungen (\(n\)) wie aufzulösende Unbekannte \(y_1,\dots,y_n\); die \(x\)-Variablen bleiben frei. In der Banachraum-Fassung ist \(\Phi'_y(x_0,y_0)\) ein Operator, und „invertierbar“ heißt: die Inverse existiert auf ganz \(G\) und ist wieder stetig.</p>`,
        erfuellt: String.raw`<p><b>Kreis, Punkt mit \(y_0\neq 0\).</b> Sei \(\Phi(x,y)=x^2+y^2-r^2\) und \((x_0,y_0)=(0,r)\).</p>
<p><i>Schritt 1 (Lösungspunkt).</i> \(\Phi(0,r)=0+r^2-r^2=0\), also \(\Phi(x_0,y_0)=0\).</p>
<p><i>Schritt 2 (Kandidat).</i> Aus \(x^2+y^2-r^2=0\) folgt \(y^2=r^2-x^2\), also \(y=\pm\sqrt{r^2-x^2}\). Wegen \(y_0=r>0\) kommt nur der Pluszweig in Frage:</p>
\[f(x)=\sqrt{r^2-x^2},\qquad |x|< r.\]
<p><i>Schritt 3 (Fenster wählen).</i> Setze \(\varepsilon=\delta=\tfrac{r}{2}\). Für \(x\in U_{r/2}(0)\), also \(|x|<\tfrac r2\), gilt \(r^2-x^2>r^2-\tfrac{r^2}{4}=\tfrac34 r^2\), somit</p>
\[\tfrac{\sqrt3}{2}\,r< f(x)\le r,\qquad\text{d.h. } |f(x)-r|<\Big(1-\tfrac{\sqrt3}{2}\Big)r\approx 0{,}134\,r<\tfrac r2 .\]
<p>Also \(f:U_{r/2}(0)\to U_{r/2}(r)\).</p>
<p><i>Schritt 4 ((1) und (2) nachrechnen).</i></p>
<p>(1) \(\Phi(x,f(x))=x^2+\big(r^2-x^2\big)-r^2=0\) für alle \(|x|<\tfrac r2\).</p>
<p>(2) Ist \((x,y)\in U_{r/2}(0)\times U_{r/2}(r)\) mit \(\Phi(x,y)=0\), so ist \(y^2=r^2-x^2\) und zugleich \(y>r-\tfrac r2=\tfrac r2>0\); der Minuszweig scheidet also aus und es folgt \(y=+\sqrt{r^2-x^2}=f(x)\).</p>
<p><i>Kontrolle der Bedingung.</i> \(\frac{\partial\Phi}{\partial y}\big|_{(0,r)}=2y\big|_{y=r}=2r\neq 0\) — die Linearisierung war auflösbar, und die Auflösung existiert tatsächlich. Dasselbe funktioniert an jedem Kreispunkt mit \(y_0\neq 0\).</p>`,
        verletzt: String.raw`<p><b>Kreis, Punkt mit senkrechter Tangente.</b> Sei wieder \(\Phi(x,y)=x^2+y^2-r^2\), jetzt aber \((x_0,y_0)=(r,0)\).</p>
<p><i>Schritt 1.</i> \(\Phi(r,0)=r^2+0-r^2=0\), der Punkt liegt also auf der Lösungsmenge. Aber</p>
\[\frac{\partial\Phi}{\partial y}\Big|_{(r,0)}=2y\big|_{y=0}=0 .\]
<p><i>Schritt 2 ((1) scheitert).</i> Sei \(\varepsilon>0\) beliebig. \(U_\varepsilon(r)\) enthält Punkte \(x>r\). Für solche \(x\) gilt für <b>jedes</b> \(y\)</p>
\[\Phi(x,y)=x^2+y^2-r^2\ \ge\ x^2-r^2>0,\]
<p>also gibt es überhaupt kein \(y\) mit \(\Phi(x,y)=0\). Eine Funktion \(f\) auf ganz \(U_\varepsilon(r)\) mit Eigenschaft (1) kann es folglich nicht geben.</p>
<p><i>Schritt 3 ((2) scheitert).</i> Sei zusätzlich \(\delta>0\) beliebig. Für \(x\) mit \(\max\big\{0,\sqrt{r^2-\delta^2}\big\}< x< r\) (solche \(x\) gibt es stets, und für \(\delta\ge r\) genügt \(0< x< r\)) ist \(0<\sqrt{r^2-x^2}<\delta\), und die beiden verschiedenen Punkte</p>
\[y_\pm=\pm\sqrt{r^2-x^2}\ \in\ U_\delta(0)\]
<p>erfüllen beide \(\Phi(x,y_\pm)=x^2+(r^2-x^2)-r^2=0\). Also folgt aus \(\Phi(x,y)=0\) nicht \(y=f(x)\): die Eindeutigkeit ist in <i>jedem</i> Fenster verletzt.</p>
<p><i>Fazit.</i> In \((r,0)\) ist die Gleichung nicht nach \(y\) auflösbar — geometrisch die senkrechte Tangente. Wohl aber nach \(x\): wegen \(\frac{\partial\Phi}{\partial x}\big|_{(r,0)}=2r\neq 0\) liefert \(x=\sqrt{r^2-y^2}\) eine lokale Auflösung. Welche Variable man auflösen darf, entscheidet also die jeweilige partielle Ableitung.</p>`,
        plus: String.raw`<p><b>Notation.</b> Für den Nullvektor schreibt die Vorlesung an der Tafel eine durchgestrichene Null mit Raum-Index. KaTeX kennt dieses Zeichen nicht, deshalb steht hier durchgehend \(\mathbf{0}_E,\ \mathbf{0}_F,\ \mathbf{0}_G\) bzw. \(\mathbf{0}_n\); ebenso wird die doppelt gestrichene Eins (der Identitätsoperator) als \(\mathbf{1}\) geschrieben.</p>
<p><b>Roter Faden.</b> §7.11 beantwortet genau eine Frage: <i>Wann beschreibt eine Gleichung lokal einen Graphen?</i> Die Antwort hat drei Stufen — (a) die Bedingung finden (diese Karte), (b) sie zum Satz machen und beweisen (<a href="#/7.11.2">7.11.2</a>, <a href="#/7.11.3">7.11.3</a>), (c) die Eigenschaften der Auflösung studieren (<a href="#/7.11.4">7.11.4</a>, <a href="#/7.11.5">7.11.5</a>) und daraus den Umkehrsatz gewinnen (<a href="#/7.11.6">7.11.6</a>). Eine Übersicht der Formulierungen findet sich auf dem Spickzettel <a href="#/ref/saetze">Sätze</a>.</p>
<p><b>Klausurfalle.</b> „Lokal auflösbar“ ist eine Aussage über ein <i>Paar</i> \((x_0,y_0)\), nicht über \(\Phi\) allein. Dieselbe Funktion \(\Phi\) ist in einem Punkt auflösbar und im nächsten nicht. Wer die Frage „Ist \(x^2+y^2-r^2=0\) nach \(y\) auflösbar?“ ohne Angabe des Punktes mit „ja“ beantwortet, hat sie falsch verstanden.</p>`}},
       {id:"7.11.2", title:"Partielle Fréchet-Ableitung und der Satz", body:{
        def: String.raw`<p><b>Definition (partielle Fréchet-Ableitung).</b> Sei \(\Phi:V\subset E\times F\to G\). Ein Operator</p>
\[T=\frac{\partial\Phi}{\partial x}\Big|_{(x_0,y_0)}=\Phi'_x(x_0,y_0)\in\mathcal{L}(E,G)\]
<p>heißt <b>partielle Fréchet-Ableitung von \(\Phi\) nach \(E\)</b>, genau dann wenn</p>
\[\Phi(x_0+h_x,\,y_0)=\Phi(x_0,y_0)+T\,h_x+o\big(\|h_x\|_E\big)\qquad\text{für }E\ni h_x\to\mathbf{0}_E .\]
<p>Völlig analog (an der Tafel als Hausaufgabe, „HA“) ist</p>
\[S=\frac{\partial\Phi}{\partial y}\Big|_{(x_0,y_0)}=\Phi'_y(x_0,y_0)\in\mathcal{L}(F,G)\]
<p>die partielle Fréchet-Ableitung nach \(F\): \(\Phi(x_0,y_0+h_y)=\Phi(x_0,y_0)+S\,h_y+o(\|h_y\|_F)\) für \(F\ni h_y\to\mathbf{0}_F\). Beim Ableiten nach einer Variablen wird die andere also festgehalten — wie bei der gewöhnlichen partiellen Ableitung, nur dass hier ganze Variablenblöcke festgehalten werden.</p>
<p><b>Satz (Lokale Auflösbarkeit implizit gegebener Funktionen).</b> Seien \(E,F,G\) Banachräume, \(V\subset E\times F\) offen, \((x_0,y_0)\in V\) und \(\Phi(x_0,y_0)=\mathbf{0}_G\). Es gelte:</p>
<ul>
<li>(1) \(\Phi:V\subset E\times F\longrightarrow G\) ist stetig;</li>
<li>(2) \(\Phi'_y\) existiert auf ganz \(V\) und \(\Phi'_y(\cdot):V\to\mathcal{L}(F,G)\) ist stetig;</li>
<li>(3) \(\Phi'_y(x_0,y_0)\) ist auf \(G\) invertierbar, und \(\Psi=\big[\Phi'_y(x_0,y_0)\big]^{-1}\in\mathcal{L}(G,F)\).</li>
</ul>
<p><b>Dann</b> ist \(\Phi\) in einer Umgebung von \((x_0,y_0)\) lokal zu \(y=f(x)\) auflösbar.</p>
<p><b>Endlichdimensionales Kriterium.</b> Für \(\Phi:\mathbb{R}^m\times\mathbb{R}^n\to\mathbb{R}^n\) besagt (3), dass der \(n\times n\)-Block \(\frac{\partial\Phi}{\partial y}\) im Punkt invertierbar ist, also</p>
\[\det\frac{\partial\Phi}{\partial y}\Big|_{(x^{(0)},y^{(0)})}=\det\frac{D(\Phi_1,\dots,\Phi_n)}{D(y_1,\dots,y_n)}\Big|_{(x^{(0)},y^{(0)})}\neq 0 .\]
<p>Achtung: \(\frac{D(\Phi_1,\dots,\Phi_n)}{D(y_1,\dots,y_n)}\) bezeichnet in der Vorlesung — wie in <a href="#/7.11.6">7.11.6</a> — die Jacobi-<i>Matrix</i>; die Determinante muss ausdrücklich gebildet werden.</p>`,
        worte: String.raw`<p>Die drei Voraussetzungen sind kein Zierrat, jede wird im Beweis an genau einer Stelle gebraucht.</p>
<p><b>(1) Stetigkeit von \(\Phi\)</b> sorgt dafür, dass \(\Phi(x,y_0)\) klein bleibt, wenn \(x\) nahe bei \(x_0\) liegt. Das ist es, was die Fixpunktabbildung eine kleine Kugel um \(y_0\) in sich selbst abbilden lässt (Schritt 3 des Beweises).</p>
<p><b>(2) Stetigkeit von \(\Phi'_y\)</b> ist die eigentliche Arbeitsvoraussetzung. Sie erlaubt, den Operator \(\Phi'_y(x,y)\) in einer kleinen Umgebung durch den <i>festen</i> Operator \(\Phi'_y(x_0,y_0)\) zu ersetzen — bis auf einen Fehler, den man beliebig klein machen kann. Genau dieser kleine Fehler ist später die Kontraktionskonstante \(\Theta\).</p>
<p><b>(3) Invertierbarkeit von \(\Phi'_y(x_0,y_0)\)</b> ist die Übersetzung von „\(\partial\Phi/\partial y\neq 0\)“ ins Unendlichdimensionale. Sie wird nur <i>in einem Punkt</i> verlangt — das ist der ganze Charme des Satzes: eine Bedingung an eine einzige Linearisierung liefert eine Aussage über eine ganze Umgebung.</p>
<p>Bemerkenswert ist, was <b>nicht</b> gefordert wird: \(\Phi\) muss nach \(x\) überhaupt nicht differenzierbar sein. Für die reine Existenz der Auflösung genügt Stetigkeit in \(x\); erst wenn man die Auflösung differenzieren will, kommt \(\Phi'_x\) hinzu (siehe <a href="#/7.11.4">7.11.4</a>). Ebenso wenig wird eine Formel für \(f\) geliefert — der Satz ist ein reiner Existenzsatz, der Beweis liefert allerdings ein Iterationsverfahren mit.</p>
<p>Im Endlichdimensionalen ist „invertierbar“ gleichbedeutend mit \(\det\neq 0\); man prüft also die Determinante des rechten Blocks der Jacobi-Matrix, nicht der ganzen Matrix. Die ganze \(n\times(m+n)\)-Matrix ist gar nicht quadratisch.</p>`,
        beispiel: String.raw`<p><b>Ein System, dessen Voraussetzungen vollständig geprüft werden.</b> Sei \(E=\mathbb{R}\), \(F=G=\mathbb{R}^2\), \(V=\mathbb{R}\times\mathbb{R}^2\) und</p>
\[\Phi(x;y_1,y_2)=\begin{pmatrix}y_1^2+y_2^2-1-x\\ y_1-y_2\end{pmatrix}.\]
<p>Betrachteter Punkt: \(x_0=0\), \(y_0=\big(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\big)^{T}\).</p>
<p><i>Schritt 0 (Lösungspunkt).</i></p>
\[\Phi\big(0;\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\big)=\begin{pmatrix}\tfrac12+\tfrac12-1-0\\ \tfrac{1}{\sqrt2}-\tfrac{1}{\sqrt2}\end{pmatrix}=\begin{pmatrix}0\\0\end{pmatrix}=\mathbf{0}_2 .\]
<p><i>Schritt 1 (Voraussetzung (1)).</i> Beide Komponenten sind Polynome in \((x,y_1,y_2)\), also ist \(\Phi\) stetig auf ganz \(V\).</p>
<p><i>Schritt 2 (Voraussetzung (2)).</i> Ableiten nach \(y=(y_1,y_2)\) bei festem \(x\):</p>
\[\Phi'_y(x;y_1,y_2)=\begin{pmatrix}2y_1&2y_2\\ 1&-1\end{pmatrix}.\]
<p>Die Einträge sind stetige Funktionen von \((x,y)\), also ist \(\Phi'_y(\cdot):V\to\mathcal{L}(\mathbb{R}^2,\mathbb{R}^2)\) stetig.</p>
<p><i>Schritt 3 (Voraussetzung (3)).</i> Im Punkt:</p>
\[\Phi'_y\big(0;y_0\big)=\begin{pmatrix}\sqrt2&\sqrt2\\ 1&-1\end{pmatrix},\qquad \det=\sqrt2\cdot(-1)-\sqrt2\cdot 1=-2\sqrt2\neq 0 .\]
<p>Also invertierbar, und mit \(\begin{pmatrix}a&b\\ c&d\end{pmatrix}^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&-b\\ -c&a\end{pmatrix}\):</p>
\[\Psi=\big[\Phi'_y(0;y_0)\big]^{-1}=\frac{1}{-2\sqrt2}\begin{pmatrix}-1&-\sqrt2\\ -1&\sqrt2\end{pmatrix}=\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}.\]
<p><i>Probe:</i> \(\begin{pmatrix}\sqrt2&\sqrt2\\ 1&-1\end{pmatrix}\cdot\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}=\frac{1}{2\sqrt2}\begin{pmatrix}2\sqrt2&0\\ 0&2\sqrt2\end{pmatrix}=\mathbf{1}\). </p>
<p><i>Schritt 4 (Schluss des Satzes).</i> Alle Voraussetzungen sind erfüllt, also ist die Gleichung in einer Umgebung von \((0;y_0)\) nach \(y=f(x)\) auflösbar.</p>
<p><i>Schritt 5 (Kontrolle von Hand).</i> Hier lässt sich \(f\) sogar explizit angeben: die zweite Gleichung liefert \(y_1=y_2=:y\), die erste dann \(2y^2=1+x\), also \(y=\pm\sqrt{\tfrac{1+x}{2}}\). Wegen \((y_0)_1=\tfrac{1}{\sqrt2}>0\) ist der Pluszweig zu nehmen:</p>
\[f(x)=\sqrt{\frac{1+x}{2}}\begin{pmatrix}1\\1\end{pmatrix},\qquad x>-1,\qquad f(0)=\begin{pmatrix}\tfrac{1}{\sqrt2}\\ \tfrac{1}{\sqrt2}\end{pmatrix}=y_0 .\]
<p>Der Satz hat also genau das vorhergesagt, was die Rechnung von Hand bestätigt — mit dem Unterschied, dass der Satz auch dann greift, wenn man die Gleichung nicht mehr explizit auflösen kann.</p>`,
        plus: String.raw`<p><b>Tafel-Detail (Klausurfalle).</b> An der Tafel steht in Voraussetzung (2) „\(\Phi'_y(\cdot)\to\mathcal{L}(E,G)\) ist stetig“. Das ist ein Verschreiber: \(\Phi'_y\) bildet \(F\) nach \(G\) ab, also muss es \(\mathcal{L}(F,G)\) heißen — genau so steht es auch bei der Definition von \(S\) und in Schritt 2 des Beweises (\(\|\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\|_{\mathcal{L}(F,G)}\)). Wer die Räume nicht mitführt, verrechnet sich später bei den Operatornormen.</p>
<p><b>Buchführung der Räume.</b> \(\Phi'_x\in\mathcal{L}(E,G)\), \(\Phi'_y\in\mathcal{L}(F,G)\), \(\Psi=[\Phi'_y]^{-1}\in\mathcal{L}(G,F)\), und die Auflösung hat \(y'_x(x_0)\in\mathcal{L}(E,F)\). Man kann jede Formel des Paragraphen allein daran kontrollieren, ob die Verkettungen zusammenpassen: \(\mathcal{L}(G,F)\circ\mathcal{L}(E,G)=\mathcal{L}(E,F)\).</p>
<p><b>Welche Variable ist welche?</b> Die Rolle von \(x\) und \(y\) ist reine Konvention. Aufgelöst wird immer nach derjenigen Variablengruppe, deren partielle Ableitung invertierbar ist. Genau dieser Rollentausch macht in <a href="#/7.11.6">7.11.6</a> aus dem Satz über implizite Funktionen den Umkehrsatz.</p>`}},
       {id:"7.11.3", title:"Beweis über den Fixpunktsatz", body:{
        def: String.raw`<p><b>Beweisidee.</b> Die Gleichung \(\Phi(x,y)=\mathbf{0}_G\) wird bei festgehaltenem \(x\) in eine Fixpunktgleichung für \(y\) verwandelt und dann der Fixpunktsatz von Banach (§7.10) angewendet. Mit \(\Psi=[\Phi'_y(x_0,y_0)]^{-1}\in\mathcal{L}(G,F)\) setze für festes \(x\in U_\varepsilon(x_0)\)</p>
\[A=A(x):U_\delta(y_0)\to F,\qquad Ay=\underbrace{y}_{\in F}-\underbrace{\Psi}_{\in\mathcal{L}(G,F)}\underbrace{\Phi(x,y)}_{\in G}\ \in F .\]
<p><b>Schritt 1 (Fixpunkt-Umformulierung).</b> Seien \(\varepsilon,\delta>0\) mit \(U_\varepsilon(x_0)\times U_\delta(y_0)\subset V\). Dann</p>
\[Ay=y\iff \Psi\,\Phi(x,y)=\mathbf{0}_F\iff \Phi(x,y)=\mathbf{0}_G,\]
<p>denn \(\Psi\) ist invertierbar, also \(\ker\Psi=\{\mathbf{0}_G\}\). Die gesuchten \(y\in U_\delta(y_0)\) sind also genau die <b>Fixpunkte</b> von \(A(x)\).</p>
<p><b>Schritt 2 (\(A\) ist eine Kontraktion).</b> In drei Teilen.</p>
<p>(I) \(A\) ist nach \(y\) Fréchet-differenzierbar: aus \(A(y+h_y)-Ay=h_y-\Psi\big(\Phi(x,y+h_y)-\Phi(x,y)\big)\) und \(\Phi(x,y+h_y)-\Phi(x,y)=\Phi'_y(x,y)h_y+o(\|h_y\|_F)\) folgt mit dem Trick \(h_y=\Psi\Psi^{-1}h_y\):</p>
\[A(y+h_y)-Ay=\Psi\big(\underbrace{\Phi'_y(x_0,y_0)}_{=\Psi^{-1}}-\Phi'_y(x,y)\big)h_y+o\big(\|h_y\|_F\big),\qquad A'_y=\Psi\big(\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\big)\in\mathcal{L}(F,F).\]
<p>(II) Mit \(C:=\|\Psi\|_{\mathcal{L}(G,F)}\):</p>
\[\|A'_y\|_{\mathcal{L}(F,F)}\le C\cdot\big\|\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\big\|_{\mathcal{L}(F,G)} .\]
<p>Wähle \(\Theta\in\left]0,1\right[\). Wegen der Stetigkeit von \(\Phi'_y\) gibt es \(\varepsilon_0\in\left]0,\varepsilon\right[\), \(\delta_0\in\left]0,\delta\right[\) mit \(\|\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\|_{\mathcal{L}(F,G)}\le\frac{\Theta}{C}\) auf \(U_{\varepsilon_0}(x_0)\times U_{\delta_0}(y_0)\), also \(\|A'_y\|_{\mathcal{L}(F,F)}\le\Theta<1\) dort.</p>
<p>(III) Der Hauptsatz der Differentialrechnung (Mittelwertungleichung) gibt für \(y_1,y_2\in U_{\delta_0}(y_0)\)</p>
\[\|Ay_1-Ay_2\|_F\le\sup_{y\in\overline{y_1y_2}}\|A'_y\|_{\mathcal{L}(F,F)}\cdot\|y_1-y_2\|_F\le\Theta\,\|y_1-y_2\|_F .\]
<p><b>Schritt 3 (Selbstabbildung einer abgeschlossenen Kugel).</b> Setze \(\delta_1=\frac{\delta_0}{2}>0\), \(B_{\delta_1}(y_0)=\{y\in F:\|y-y_0\|_F\le\delta_1\}\subset U_{\delta_0}(y_0)\). Dann</p>
\[\|Ay-y_0\|_F\le\|Ay-Ay_0\|_F+\|Ay_0-y_0\|_F\le\Theta\|y-y_0\|_F+\|\Psi\,\Phi(x,y_0)\|_F\le\Theta\|y-y_0\|_F+C\,\big\|\Phi(x,y_0)-\Phi(x_0,y_0)\big\|_G .\]
<p>Wegen der Stetigkeit von \(\Phi\) existiert \(\varepsilon_1\in\left]0,\varepsilon_0\right[\) mit \(\|\Phi(x,y_0)-\Phi(x_0,y_0)\|_G<\delta_1\frac{1-\Theta}{C}\) für \(x\in U_{\varepsilon_1}(x_0)\), also</p>
\[\|Ay-y_0\|_F\le\Theta\,\delta_1+(1-\Theta)\delta_1=\delta_1,\qquad A:B_{\delta_1}(y_0)\to U_{\delta_1}(y_0)\subset B_{\delta_1}(y_0).\]
<p><b>Schritt 4 (Banach).</b> \(F\) ist vollständig und \(M=B_{\delta_1}(y_0)\) abgeschlossen, also ist \((M,d)\) mit \(d(y_1,y_2)=\|y_1-y_2\|_F\) ein vollständiger metrischer Raum. \(A(x):M\to M\) ist Kontraktion, also nach dem Fixpunktsatz von Banach</p>
\[\exists!\ y\in M:\ A(x)y=y\ \hookrightarrow\ \Phi(x,y)=\mathbf{0}_G,\quad\text{sogar } y\in U_{\delta_1}(y_0).\]
<p>Die Zuordnung \(f:x\mapsto y\) (mit \(y\) dem Fixpunkt von \(A(x)\)) ist die gesuchte Auflösung. \(\boxtimes\)</p>`,
        worte: String.raw`<p>Der ganze Beweis besteht aus einem einzigen Kunstgriff: Statt \(\Phi(x,y)=\mathbf{0}_G\) direkt zu lösen, addiert man \(y\) auf beiden Seiten einer geeignet <i>vorkonditionierten</i> Gleichung. Warum die Multiplikation mit \(\Psi\)? Die naive Abbildung \(y\mapsto y-\Phi(x,y)\) wäre gar nicht definiert, denn \(y\in F\) und \(\Phi(x,y)\in G\) — man darf sie nicht subtrahieren. \(\Psi\in\mathcal{L}(G,F)\) transportiert den Wert zurück nach \(F\), und weil \(\Psi\) invertierbar ist, geht dabei keine Information verloren: Fixpunkte von \(A\) sind exakt die Nullstellen von \(\Phi\).</p>
<p>Die Wahl gerade der <i>Inversen der Ableitung</i> ist kein Zufall, sondern der Newton-Gedanke. Rechnet man \(A'_y\) aus, so kürzt sich der Hauptterm weg und übrig bleibt</p>
\[A'_y=\Psi\big(\Phi'_y(x_0,y_0)-\Phi'_y(x,y)\big),\]
<p>also genau die <i>Abweichung</i> der Ableitung von ihrem Wert im Basispunkt. Diese Abweichung ist nach Voraussetzung (2) stetig und in \((x_0,y_0)\) gleich null — man kann sie also durch Verkleinern der Umgebung unter jede vorgegebene Schranke drücken. Genau hier wird aus Voraussetzung (2) die Kontraktionskonstante \(\Theta<1\).</p>
<p>Zwei Feinheiten, die man leicht übersieht:</p>
<ul>
<li><b>Warum die abgeschlossene Kugel \(B_{\delta_1}(y_0)\)?</b> Der Fixpunktsatz von Banach braucht einen <i>vollständigen</i> metrischen Raum. Eine offene Kugel ist nicht vollständig, eine abgeschlossene Kugel in einem Banachraum schon. Deshalb halbiert Schritt 3 den Radius.</li>
<li><b>Warum Schritt 3 überhaupt?</b> Kontraktion allein genügt nicht — \(A\) muss die Menge auch <i>in sich</i> abbilden. Dass das für hinreichend kleines \(\varepsilon_1\) klappt, ist genau die Stelle, an der Voraussetzung (1) (Stetigkeit von \(\Phi\) in \(x\)) gebraucht wird.</li>
</ul>
<p>Die Eindeutigkeit des Fixpunktes liefert zugleich Eigenschaft (2) der lokalen Auflösbarkeit — Existenz und Eindeutigkeit fallen also in einem einzigen Satz an.</p>`,
        beispiel: String.raw`<p><b>Der Beweis am Kreis, Schritt für Schritt durchgerechnet.</b> \(E=F=G=\mathbb{R}\), \(\Phi(x,y)=x^2+y^2-1\), Basispunkt \((x_0,y_0)=(0,1)\).</p>
<p><i>Vorbereitung.</i> \(\Phi(0,1)=0\); \(\Phi'_y(x,y)=2y\), also \(\Phi'_y(0,1)=2\) und</p>
\[\Psi=\big[\Phi'_y(0,1)\big]^{-1}=\tfrac12,\qquad C=\|\Psi\|=\tfrac12 .\]
<p><i>Schritt 1 (Fixpunktabbildung).</i> Wegen \(V=\mathbb{R}^2\) darf man etwa \(\varepsilon=2\), \(\delta=1\) nehmen. Dann</p>
\[A(x)y=y-\tfrac12\big(x^2+y^2-1\big).\]
<p>Probe der Äquivalenz: \(A(x)y=y\iff \tfrac12(x^2+y^2-1)=0\iff x^2+y^2=1\). Die Fixpunkte sind also genau die Kreispunkte über \(x\).</p>
<p><i>Schritt 2 (Kontraktion).</i> Ableiten nach \(y\):</p>
\[A'_y=1-\tfrac12\cdot 2y=1-y,\]
<p>und das stimmt mit der allgemeinen Formel überein: \(\Psi\big(\Phi'_y(0,1)-\Phi'_y(x,y)\big)=\tfrac12(2-2y)=1-y\). Wähle \(\Theta=\tfrac12\). Verlangt ist \(|\Phi'_y(0,1)-\Phi'_y(x,y)|=|2-2y|\le\frac{\Theta}{C}=1\), also \(|y-1|\le\tfrac12\). Man darf somit</p>
\[\varepsilon_0=1\in\left]0,\varepsilon\right[,\qquad \delta_0=\tfrac12\in\left]0,\delta\right[\]
<p>setzen; dort ist \(|A'_y|=|1-y|\le\tfrac12=\Theta<1\), und die Mittelwertungleichung gibt \(|Ay_1-Ay_2|\le\tfrac12|y_1-y_2|\).</p>
<p><i>Schritt 3 (Selbstabbildung).</i> \(\delta_1=\frac{\delta_0}{2}=\tfrac14\), also \(M=B_{1/4}(1)=[\,\tfrac34,\tfrac54\,]\). Die Bedingung an \(\varepsilon_1\) lautet</p>
\[\big|\Phi(x,y_0)-\Phi(x_0,y_0)\big|=\big|(x^2+1-1)-0\big|=x^2<\delta_1\frac{1-\Theta}{C}=\tfrac14\cdot\frac{1/2}{1/2}=\tfrac14,\]
<p>also \(|x|<\tfrac12=:\varepsilon_1\) (und in der Tat \(\varepsilon_1<\varepsilon_0\)). Für solche \(x\) gilt dann \(|A(x)y-1|\le\Theta\cdot\tfrac14+(1-\Theta)\cdot\tfrac14=\tfrac14\), d.h. \(A(x):M\to M\).</p>
<p><i>Schritt 4 (Banach).</i> \(M=[\tfrac34,\tfrac54]\subset\mathbb{R}\) ist abgeschlossen und beschränkt, also vollständig; \(A(x)\) ist Kontraktion mit \(\Theta=\tfrac12\). Es existiert genau ein Fixpunkt</p>
\[y(x)=\sqrt{1-x^2},\qquad |x|<\tfrac12 .\]
<p><i>Kontrolle, dass er wirklich in \(M\) liegt:</i> für \(|x|<\tfrac12\) ist \(\sqrt{1-x^2}>\sqrt{3}/2\approx0{,}866>\tfrac34\) und \(\le 1<\tfrac54\).</p>
<p><i>Das Verfahren aus dem Beweis.</i> Die Iteration \(y_{k+1}=A(x)y_k\) mit Startwert \(y_0=1\) liefert</p>
\[y_1=1-\tfrac12\big(x^2+1-1\big)=1-\tfrac{x^2}{2},\]
<p>und das ist genau die Taylorentwicklung \(\sqrt{1-x^2}=1-\tfrac{x^2}{2}-\tfrac{x^4}{8}-\dots\) bis zur zweiten Ordnung. Die Fehlerabschätzung des Fixpunktsatzes gibt</p>
\[\big|y(x)-y_k\big|\le\frac{\Theta^{\,k}}{1-\Theta}\,|y_1-y_0|=\frac{(1/2)^k}{1/2}\cdot\frac{x^2}{2}=\Big(\tfrac12\Big)^{k}x^2,\]
<p>für \(x=0{,}4\) und \(k=5\) also \(|y(0{,}4)-y_5|\le\tfrac{1}{32}\cdot0{,}16=0{,}005\).</p>`,
        plus: String.raw`<p><b>Wo die Vollständigkeit steckt.</b> Der Satz braucht \(F\) als Banachraum — nur dann ist die abgeschlossene Kugel \(B_{\delta_1}(y_0)\) ein vollständiger metrischer Raum und der Fixpunktsatz anwendbar. Für \(F=C([a,b])\) mit \(\|\cdot\|_C\) ist das gerade die Vollständigkeit dieses Funktionenraums; genau deshalb lässt sich derselbe Beweis auf Integral- und Differentialgleichungen anwenden. An \(E\) und \(G\) wird Vollständigkeit an keiner Stelle wirklich benötigt.</p>
<p><b>Prüfungsfrage „Wo geht welche Voraussetzung ein?“</b> (1) in Schritt 3, (2) in Schritt 2 (II), (3) in Schritt 1 (Äquivalenz der Fixpunktgleichung) und in Schritt 2 (I) über \(\Psi^{-1}=\Phi'_y(x_0,y_0)\). Vollständigkeit von \(F\) in Schritt 4. Diese Zuordnung ist die typische mündliche Nachfrage — vgl. auch den Spickzettel <a href="#/ref/beweise">Beweise</a>.</p>
<p><b>Konstruktiver Gehalt.</b> Der Beweis ist nicht nur ein Existenzbeweis: er liefert mit \(y=\lim_{k\to\infty}A(x)^k y_0\) ein Näherungsverfahren samt a-priori-Fehlerabschätzung \(d(y^*,y_k)\le\frac{\Theta^k}{1-\Theta}d(y_1,y_0)\). Das ist im Kern das Newton-Verfahren mit eingefrorener Ableitung.</p>`}},
       {id:"7.11.4", title:"Stetigkeit und Differenzierbarkeit der impliziten Funktion", body:{
        def: String.raw`<p><b>Anmerkung (Stetigkeit in \(x_0\)).</b> Die durch den Satz gelieferte Funktion \(y=y(x)=f(x)\) erfüllt \(y(x_0)=f(x_0)=y_0\) und ist in \(x=x_0\) stetig. Denn mit der Fixpunkteigenschaft \(y(x)=A(x)y(x)\):</p>
\[\|y(x)-y_0\|_F=\|A(x)y(x)-y_0\|_F\le\|Ay(x)-Ay_0\|_F+\|Ay_0-y_0\|_F\le\Theta\,\|y(x)-y_0\|_F+\|\Psi\,\Phi(x,y_0)\|_F\]
<p>mit gewissem \(\Theta\in\left]0,1\right[\). Umstellen liefert die Grundabschätzung</p>
\[(*)\qquad \|y(x)-y_0\|_F\ \le\ \frac{C}{1-\Theta}\,\big\|\underbrace{\Phi(x,y_0)-\underbrace{\Phi(x_0,y_0)}_{=\,\mathbf{0}_G}}_{\longrightarrow\ \mathbf{0}_G\ \text{für}\ x\to x_0}\big\|_G\ \longrightarrow\ 0\quad (x\to x_0),\]
<p>da \(\Phi\) stetig ist. Hier ist \(C=\|\Psi\|_{\mathcal{L}(G,F)}\).</p>
<p><b>Satz (Differenzierbarkeit der implizit gegebenen Funktion).</b> Sei zusätzlich zu (1)–(3) aus <a href="#/7.11.2">7.11.2</a> die Funktion \(\Phi\) in \(V\) partiell Fréchet-differenzierbar nach \(E\) und sei \(\Phi'_x(\cdot):V\to\mathcal{L}(E,G)\) stetig. Dann ist \(y(x)=f(x)\) in \(x=x_0\) Fréchet-differenzierbar und</p>
\[\mathcal{L}(E,F)\ \ni\ y'_x(x_0)=-\underbrace{\big[\Phi'_y(x_0,y_0)\big]^{-1}}_{\in\,\mathcal{L}(G,F)}\ \underbrace{\Phi'_x(x_0,y_0)}_{\in\,\mathcal{L}(E,G)} .\]
<p><b>Beweis (2 Schritte).</b></p>
<p><i>Schritt 1: \(\|h_y\|_F=O(\|h_x\|_E)\).</i> Aus \((*)\) und der partiellen Differenzierbarkeit nach \(E\), d.h. \(\Phi(x,y_0)-\Phi(x_0,y_0)=\Phi'_x(x_0,y_0)h_x+o(\|h_x\|_E)\):</p>
\[\|h_y\|_F=\|y(x)-y_0\|_F\le\frac{C}{1-\Theta}\big\|\Phi'_x(x_0,y_0)h_x+o(\|h_x\|_E)\big\|_G\le\tilde{C}\Big(O\big(\|h_x\|_E\big)+o\big(\|h_x\|_E\big)\Big)\]
<p>für \(h_x\to\mathbf{0}_E\).</p>
<p><i>Schritt 2: Restglied.</i> Setze \(\omega(h_x,h_y)=\Phi'_x(x_0,y_0)h_x+\Phi'_y(x_0,y_0)h_y\) mit \(y(x)=y=y_0+h_y\). Wegen \(\Phi(x_0+h_x,y_0+h_y)=\Phi(x_0,y_0)=\mathbf{0}_G\) ist</p>
\[\|\omega(h_x,h_y)\|_G=\big\|\Phi(x_0+h_x,y_0+h_y)-\Phi(x_0,y_0)-\Phi'_x(x_0,y_0)h_x-\Phi'_y(x_0,y_0)h_y\big\|_G .\]
<p>Einschieben von \(\pm\Phi(x_0+h_x,y_0)\) und \(\pm\Phi'_y(x_0+h_x,y_0)h_y\), Dreiecksungleichung und die Mittelwertungleichung geben</p>
\[\|\omega\|_G\le\sup_{x\in\overline{x_0(x_0+h_x)}}\underbrace{\big\|\Phi'_x(x,y_0)-\Phi'_x(x_0,y_0)\big\|_{\mathcal{L}(E,G)}}_{=\,o(1)}\|h_x\|_E+2\sup\ \underbrace{\big\|\Phi'_y(x,y)-\Phi'_y(x,y_0)\big\|_{\mathcal{L}(F,G)}}_{=\,o(1)}\|h_y\|_F,\]
<p>wobei das zweite Supremum über \(x\in\overline{x_0(x_0+h_x)}\) und \(y\in\overline{y_0(y_0+h_y)}\) läuft. Mit Schritt 1 folgt</p>
\[\|\omega(h_x,h_y)\|_G=o(1)\cdot O\big(\|h_x\|_E\big)=o\big(\|h_x\|_E\big),\]
<p>also \(\Phi'_x(x_0,y_0)h_x+\Phi'_y(x_0,y_0)h_y=o(\|h_x\|_E)\) und nach Anwenden von \(\Psi\):</p>
\[y(x)-y_0=h_y=-\underbrace{\big[\Phi'_y(x_0,y_0)\big]^{-1}\Phi'_x(x_0,y_0)}_{\in\,\mathcal{L}(E,F)}\underbrace{h_x}_{=\,x-x_0}+\,o\big(\|h_x\|_E\big).\qquad \boxtimes\]`,
        worte: String.raw`<p>Der Satz aus <a href="#/7.11.2">7.11.2</a> liefert nur die nackte Existenz einer Funktion \(f\) — über deren Qualität sagt er zunächst nichts. Diese Karte holt das nach, und zwar in zwei Stufen mit jeweils genau einer Zusatzzutat.</p>
<p><b>Stufe 1 — Stetigkeit.</b> Sie kostet gar nichts Neues: die Abschätzung \((*)\) fällt direkt aus der Kontraktionseigenschaft ab. Der Trick ist, \(y(x)\) durch \(A(x)y(x)\) zu ersetzen (Fixpunkt!), die Dreiecksungleichung anzuwenden und den Term \(\Theta\|y(x)-y_0\|\) auf die linke Seite zu bringen — dort steht dann \((1-\Theta)\|y(x)-y_0\|\) mit \(1-\Theta>0\). Diese Abschätzung ist quantitativ: sie sagt, dass die Auflösung höchstens so stark ausschlägt wie \(\Phi\) selbst, verstärkt um den Faktor \(\frac{C}{1-\Theta}\). Eine schlecht konditionierte Ableitung (großes \(C=\|\Psi\|\)) macht die Auflösung empfindlich.</p>
<p><b>Stufe 2 — Differenzierbarkeit.</b> Jetzt kommt \(\Phi'_x\) ins Spiel, das der Existenzsatz gar nicht brauchte. Die <i>Formel</i> ist sofort plausibel: Differenziert man \(\Phi(x,y(x))=\mathbf{0}_G\) formal mit der Kettenregel, so kommt \(\Phi'_x+\Phi'_y\,y'_x=\mathbf{0}\) heraus, also \(y'_x=-[\Phi'_y]^{-1}\Phi'_x\). Der Beweis muss lediglich rechtfertigen, dass man das darf, d.h. dass das Restglied wirklich \(o(\|h_x\|_E)\) ist.</p>
<p>Der Kern ist Schritt 1: aus \((*)\) folgt \(\|h_y\|_F=O(\|h_x\|_E)\), der \(y\)-Zuwachs ist also höchstens von der Größenordnung des \(x\)-Zuwachses. Erst damit wird der Term \(o(1)\cdot\|h_y\|_F\) in Schritt 2 zu \(o(1)\cdot O(\|h_x\|_E)=o(\|h_x\|_E)\) — das ist die entscheidende Buchhaltung. Ohne Schritt 1 wüsste man nicht, dass \(h_y\) nicht viel schneller wächst als \(h_x\), und die Abschätzung bräche zusammen.</p>
<p>Die Teleskopabschätzung in Schritt 2 sieht kompliziert aus, ist aber Routine: der Ausdruck wird so in drei Portionen zerlegt, dass in jeder Portion nur <i>eine</i> Variable variiert; auf jede Portion lässt sich dann die Mittelwertungleichung mit einer <i>stetigen</i> Ableitung anwenden, und Stetigkeit der Ableitung liefert die Faktoren \(o(1)\).</p>`,
        beispiel: String.raw`<p><b>(a) Der Kreis.</b> \(\Phi(x,y)=x^2+y^2-r^2\), Punkt \((x_0,y_0)\) auf dem Kreis mit \(y_0\neq 0\).</p>
<p><i>Zusatzvoraussetzung prüfen:</i> \(\Phi'_x(x,y)=2x\) existiert überall und ist stetig. Ebenso \(\Phi'_y(x,y)=2y\), und \(\Phi'_y(x_0,y_0)=2y_0\neq 0\) ist invertierbar mit \(\Psi=\frac{1}{2y_0}\).</p>
<p><i>Formel anwenden:</i></p>
\[y'_x(x_0)=-\big[\Phi'_y(x_0,y_0)\big]^{-1}\Phi'_x(x_0,y_0)=-\frac{1}{2y_0}\cdot 2x_0=-\frac{x_0}{y_0}.\]
<p><i>Probe durch explizites Ableiten</i> (für \(y_0>0\), also \(y(x)=\sqrt{r^2-x^2}\)):</p>
\[y'(x)=\frac{-2x}{2\sqrt{r^2-x^2}}=-\frac{x}{\sqrt{r^2-x^2}}=-\frac{x}{y}\ \checkmark\]
<p><i>Zahlenbeispiel:</i> \(r=5\), \((x_0,y_0)=(3,4)\). Dann \(y'(3)=-\tfrac34\), und die Tangente an den Kreis lautet \(y=4-\tfrac34(x-3)\). Die Steigung \(-x_0/y_0\) ist gerade der negative Kehrwert der Steigung \(y_0/x_0\) des Ortsvektors — Tangente steht senkrecht auf dem Radius, wie es sein muss.</p>
<p><b>(b) Ein System (matrixwertige Ableitung).</b> Fortsetzung des Beispiels aus <a href="#/7.11.2">7.11.2</a>: \(\Phi(x;y_1,y_2)=\big(y_1^2+y_2^2-1-x,\ y_1-y_2\big)^{T}\), \(x_0=0\), \(y_0=\big(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\big)^{T}\).</p>
<p><i>Schritt 1:</i> Ableitung nach \(x\) (beide \(y\) fest):</p>
\[\Phi'_x(x;y)=\begin{pmatrix}-1\\ 0\end{pmatrix}\in\mathcal{L}(\mathbb{R},\mathbb{R}^2),\qquad\text{konstant, also stetig.}\]
<p><i>Schritt 2:</i> Mit \(\Psi=\frac{1}{2\sqrt2}\begin{pmatrix}1&\sqrt2\\ 1&-\sqrt2\end{pmatrix}\) aus <a href="#/7.11.2">7.11.2</a>:</p>
\[\Psi\,\Phi'_x=\frac{1}{2\sqrt2}\begin{pmatrix}1\cdot(-1)+\sqrt2\cdot 0\\ 1\cdot(-1)-\sqrt2\cdot 0\end{pmatrix}=\frac{1}{2\sqrt2}\begin{pmatrix}-1\\ -1\end{pmatrix},\]
\[y'_x(0)=-\Psi\,\Phi'_x=\frac{1}{2\sqrt2}\begin{pmatrix}1\\ 1\end{pmatrix}=\frac{\sqrt2}{4}\begin{pmatrix}1\\ 1\end{pmatrix}.\]
<p><i>Probe:</i> Explizit war \(f(x)=\sqrt{\tfrac{1+x}{2}}\,(1,1)^{T}\), also</p>
\[f'(x)=\frac{1}{2}\Big(\frac{1+x}{2}\Big)^{-1/2}\cdot\frac12\begin{pmatrix}1\\1\end{pmatrix}=\frac{1}{2\sqrt{2}\,\sqrt{1+x}}\begin{pmatrix}1\\1\end{pmatrix},\qquad f'(0)=\frac{1}{2\sqrt2}\begin{pmatrix}1\\1\end{pmatrix}\ \checkmark\]`,
        plus: String.raw`<p><b>Merkformel.</b> \(y'_x=-[\Phi'_y]^{-1}\Phi'_x\) — im skalaren Fall \(y'=-\dfrac{\partial\Phi/\partial x}{\partial\Phi/\partial y}\). Das Minuszeichen und die <b>Reihenfolge</b> der Faktoren sind die beiden häufigsten Fehlerquellen: im Matrixfall ist \([\Phi'_y]^{-1}\Phi'_x\neq \Phi'_x[\Phi'_y]^{-1}\), und Letzteres ist meist nicht einmal definiert. Kontrolle über die Räume: \(\mathcal{L}(G,F)\circ\mathcal{L}(E,G)=\mathcal{L}(E,F)\).</p>
<p><b>Was der Satz nicht sagt.</b> Er liefert Differenzierbarkeit zunächst nur <i>im Punkt</i> \(x_0\). Da die Voraussetzungen aber in einer ganzen Umgebung gelten und \((x,y(x))\) für \(x\) nahe \(x_0\) wieder ein zulässiger Basispunkt ist (die Invertierbarkeit von \(\Phi'_y\) überträgt sich wegen der Stetigkeit von \(\Phi'_y\) auf eine Umgebung), überträgt sich die Aussage auf die ganze Umgebung: \(y(\cdot)\) ist dort stetig differenzierbar mit \(y'_x(x)=-[\Phi'_y(x,y(x))]^{-1}\Phi'_x(x,y(x))\). Das ist die Grundlage für die höheren Ableitungen in <a href="#/7.11.5">7.11.5</a>.</p>
<p><b>Stabilitätslesart.</b> \((*)\) mit dem Faktor \(\frac{C}{1-\Theta}\) ist eine Konditionsabschätzung: sie misst, wie stark die Lösung auf Störungen des Parameters \(x\) reagiert. Je näher \(\Phi'_y(x_0,y_0)\) an der Nicht-Invertierbarkeit liegt, desto größer ist \(C=\|\Psi\|\) und desto instabiler die Auflösung — beim Kreis explodiert \(y'=-x/y\) genau dann, wenn \(y\to 0\) geht.</p>`}},
       {id:"7.11.5", title:"Implizite Differentiation — Beispiele", body:{
        def: String.raw`<p><b>Verfahren.</b> Ist \(\Phi(x,y)=0\) lokal nach \(y=y(x)\) aufgelöst, so braucht man \(f\) nicht zu kennen, um \(y'\) zu berechnen: man differenziert die <i>Identität</i> \(g(x)=\Phi\big(x,y(x)\big)=0\) mit der Kettenregel. Mit der Parametrisierung der Lösungskurve</p>
\[\varkappa:\ x\longmapsto\begin{pmatrix}x\\ y(x)\end{pmatrix},\qquad g=\Phi\circ\varkappa,\qquad \varkappa'_x(x_0)=\begin{pmatrix}1\\ y'(x_0)\end{pmatrix}\]
<p>ist</p>
\[0=g'(x_0)=\big(\Phi\circ\varkappa\big)'_x(x_0)=\Phi'\big|_{\varkappa(x_0)}\cdot\varkappa'_x(x_0)=\Big(\frac{\partial\Phi}{\partial x},\ \frac{\partial\Phi}{\partial y}\Big)(x_0,y_0)\begin{pmatrix}1\\ y'(x_0)\end{pmatrix},\]
<p>also (<b>Beispiel 1 der Vorlesung</b>, \(E=F=G=\mathbb{R}\))</p>
\[0=\frac{\partial\Phi}{\partial x}\Big|_{(x_0,y_0)}+\frac{\partial\Phi}{\partial y}\Big|_{(x_0,y_0)}\cdot y'(x_0),\qquad y'(x_0)=-\frac{1}{\frac{\partial\Phi(x_0,y_0)}{\partial y}}\cdot\frac{\partial\Phi(x_0,y_0)}{\partial x}.\]
<p><b>Beispiel 2 (zweite Ableitung, an der Tafel als Hausaufgabe).</b> Ansatz: die Identität</p>
\[\frac{\partial\Phi\big(x,y(x)\big)}{\partial x}+\frac{\partial\Phi\big(x,y(x)\big)}{\partial y}\,y'(x)=0\]
<p>noch einmal nach \(x\) differenzieren und nach \(y''(x)\) auflösen:</p>
\[\Phi_{xx}+2\,\Phi_{xy}\,y'+\Phi_{yy}\,(y')^2+\Phi_y\,y''=0,\qquad y''=-\frac{\Phi_{xx}+2\,\Phi_{xy}\,y'+\Phi_{yy}\,(y')^2}{\Phi_y}.\]
<p><b>Beispiel 3 (mehrere freie Variablen).</b> \((x,y)\in\mathbb{R}^2=E\), \(z\in\mathbb{R}=F\), \(\Phi(x,y,z)\in\mathbb{R}\). Mit \(\varkappa(x,y)=\big(x,\,y,\,z(x,y)\big)^{T}\) ist \((\Phi\circ\varkappa)(x,y)=\Phi(x,y,z(x,y))=0\); Richtungsableitung \(D\,[\,e_y\,]\) mit \(e_y=(0,1)^T\):</p>
\[0=\Phi'\big|_{\varkappa(x_0,y_0)}\cdot\varkappa'(x_0,y_0)\,h=\Big(\frac{\partial\Phi}{\partial x},\frac{\partial\Phi}{\partial y},\frac{\partial\Phi}{\partial z}\Big)\begin{pmatrix}1&0\\ 0&1\\ \frac{\partial z}{\partial x}&\frac{\partial z}{\partial y}\end{pmatrix}h,\qquad h=e_y=\begin{pmatrix}0\\1\end{pmatrix},\]
\[0=\frac{\partial\Phi}{\partial y}+\frac{\partial\Phi}{\partial z}\cdot\frac{\partial z}{\partial y}\qquad\Longrightarrow\qquad \frac{\partial z}{\partial y}\Big|_{(x_0,y_0)}=-\ \frac{\frac{\partial\Phi}{\partial y}\big|_{(x_0,y_0,z(x_0,y_0))}}{\frac{\partial\Phi}{\partial z}\big|_{(x_0,y_0,z(x_0,y_0))}}.\]
<p><b>Zyklische Kettenregel (Hausaufgabe).</b> Für \(\Phi(x,y,z)=0\) gilt</p>
\[\Big(\frac{\partial x}{\partial y}\Big)\Big(\frac{\partial y}{\partial z}\Big)\Big(\frac{\partial z}{\partial x}\Big)=-1 .\]`,
        worte: String.raw`<p>Die implizite Differentiation ist die praktische Seite von §7.11 und die einzige, die in Rechenaufgaben ständig gebraucht wird. Die Grundeinsicht: \(\Phi(x,y(x))=0\) ist keine Gleichung, die man an einer Stelle prüft, sondern eine <b>Identität in \(x\)</b> — sie gilt auf einem ganzen Intervall. Und Identitäten darf man ableiten; auf beiden Seiten steht dann wieder dasselbe, nämlich null.</p>
<p>Der einzige technische Punkt ist, dass die linke Seite eine <i>Verkettung</i> ist: \(x\) steckt zweimal drin, einmal direkt und einmal über \(y(x)\). Die Vorlesung macht das explizit, indem sie die Parametrisierung \(\varkappa(x)=(x,y(x))^{T}\) einführt; dann ist \(g=\Phi\circ\varkappa\) eine gewöhnliche Verkettung und die Kettenregel liefert das Produkt aus der Zeile \(\Phi'=(\Phi_x,\Phi_y)\) und der Spalte \(\varkappa'=(1,y')^{T}\). Die \(1\) in der Spalte ist die Ableitung der ersten Komponente \(x\mapsto x\) — sie ist der Grund, warum \(\Phi_x\) unbegleitet stehen bleibt.</p>
<p>Bei mehreren freien Variablen ändert sich nur die Buchführung: aus der Spalte \(\varkappa'\) wird eine Matrix, deren obere Blockzeilen die Einheitsmatrix bilden, und man greift mit einer Richtungsableitung \(D[\,e_y\,]\) die interessierende Spalte heraus. Wichtig ist, sauber zu unterscheiden, welche Variablen frei sind (\(x,y\)) und welche abhängig (\(z=z(x,y)\)).</p>
<p>Die zyklische Kettenregel mit dem überraschenden Ergebnis \(-1\) ist ein hübscher Test dafür, ob man das Verfahren verstanden hat: alle drei Ableitungen sind Quotienten \(-\Phi_\bullet/\Phi_\bullet\), im Produkt kürzt sich alles bis auf drei Minuszeichen weg. In der Thermodynamik heißt diese Formel Tripelproduktregel; wer sie als \(+1\) erinnert, hat die Vorzeichen der impliziten Differentiation nicht verinnerlicht.</p>`,
        beispiel: String.raw`<p><b>(a) Beispiel 1 der Vorlesung, ausgeführt am Kreis.</b> \(\Phi(x,y)=x^2+y^2-r^2\), \(y=y(x)\) lokal aufgelöst bei \(y_0\neq0\).</p>
<p><i>Schritt 1 (Identität ableiten).</i> \(g(x)=x^2+y(x)^2-r^2=0\). Ableiten nach \(x\):</p>
\[0=g'(x)=2x+2y(x)\,y'(x).\]
<p><i>Schritt 2 (auflösen).</i> Für \(y(x)\neq 0\):</p>
\[y'(x)=-\frac{2x}{2y}=-\frac{x}{y}.\]
<p><i>Schritt 3 (Probe).</i> Mit \(y=\sqrt{r^2-x^2}\) ist \(y'=-x/\sqrt{r^2-x^2}=-x/y\ \checkmark\)</p>
<p><b>(b) Beispiel 2: die zweite Ableitung.</b> Die Gleichung \(2x+2y\,y'=0\), also \(x+y\,y'=0\), noch einmal nach \(x\) ableiten (Produktregel im zweiten Term):</p>
\[1+\big(y'\big)^2+y\,y''=0\ \Longrightarrow\ y''=-\frac{1+(y')^2}{y}.\]
<p>Einsetzen von \(y'=-x/y\):</p>
\[y''=-\frac{1+\frac{x^2}{y^2}}{y}=-\frac{y^2+x^2}{y^3}=-\frac{r^2}{y^3}.\]
<p><i>Kontrolle mit der allgemeinen Formel:</i> \(\Phi_{xx}=2\), \(\Phi_{xy}=0\), \(\Phi_{yy}=2\), \(\Phi_y=2y\):</p>
\[y''=-\frac{2+0+2\frac{x^2}{y^2}}{2y}=-\frac{y^2+x^2}{y^3}=-\frac{r^2}{y^3}\ \checkmark\]
<p><i>Deutung:</i> Für \(y>0\) (obere Halbkreislinie) ist \(y''<0\), die Kurve ist konkav — wie es der Anschauung entspricht. Zahlenbeispiel \(r=5\), \((x_0,y_0)=(3,4)\): \(y'(3)=-\tfrac34\), \(y''(3)=-\tfrac{25}{64}\).</p>
<p><b>(c) Beispiel 3: implizite Fläche.</b> \(\Phi(x,y,z)=x^2+y^2+z^2-r^2=0\) (Kugel), \(z=z(x,y)\) lokal aufgelöst bei \(z_0\neq 0\).</p>
<p><i>Schritt 1 (partielle Ableitungen).</i> \(\Phi_x=2x\), \(\Phi_y=2y\), \(\Phi_z=2z\).</p>
<p><i>Schritt 2 (Formel).</i></p>
\[\frac{\partial z}{\partial y}\Big|_{(x_0,y_0)}=-\frac{\Phi_y}{\Phi_z}=-\frac{2y_0}{2z_0}=-\frac{y_0}{z_0},\qquad\text{analog}\quad\frac{\partial z}{\partial x}=-\frac{x_0}{z_0}.\]
<p><i>Schritt 3 (Probe).</i> Für \(z_0>0\) ist \(z(x,y)=\sqrt{r^2-x^2-y^2}\), also \(\frac{\partial z}{\partial y}=\frac{-2y}{2\sqrt{r^2-x^2-y^2}}=-\frac{y}{z}\ \checkmark\)</p>
<p><b>(d) Zyklische Kettenregel, an derselben Kugel verifiziert.</b> Löst man dieselbe Gleichung jeweils nach der anderen Variablen auf, so gilt nach demselben Muster</p>
\[\frac{\partial x}{\partial y}=-\frac{\Phi_y}{\Phi_x}=-\frac{y}{x},\qquad \frac{\partial y}{\partial z}=-\frac{\Phi_z}{\Phi_y}=-\frac{z}{y},\qquad \frac{\partial z}{\partial x}=-\frac{\Phi_x}{\Phi_z}=-\frac{x}{z},\]
\[\Big(-\frac{y}{x}\Big)\Big(-\frac{z}{y}\Big)\Big(-\frac{x}{z}\Big)=-\frac{xyz}{xyz}=-1\ \checkmark\]
<p>Die Rechnung zeigt zugleich, warum das Ergebnis universell ist: die Beträge kürzen sich immer, übrig bleiben die drei Minuszeichen.</p>`,
        plus: String.raw`<p><b>Notation.</b> Die Vorlesung schreibt für die Parametrisierung der Lösungsmenge ein geschwungenes \(x\); hier steht dafür \(\varkappa\). Die Rechenanweisung „ableiten nach \(x\)“ bzw. „Richtungsableitung in \(e_y\)“ notiert die Vorlesung hinter einem senkrechten Strich: \(g(x)=0\ \big|\ \frac{d}{dx}\) bzw. \((\Phi\circ\varkappa)(x,y)=0\ \big|\ D\cdot[\,e_y\,]\).</p>
<p><b>Klausurstrategie.</b> Fast jede Aufgabe zu §7.11 hat dieselbe Struktur: (i) prüfen, dass der Punkt die Gleichung erfüllt; (ii) \(\Phi_y(x_0,y_0)\neq 0\) bzw. \(\det\Phi'_y\neq 0\) nachweisen — erst das rechtfertigt, dass \(y(x)\) überhaupt existiert und differenzierbar ist; (iii) implizit differenzieren. Wer (ii) überspringt, rechnet formal richtig, hat aber die eigentliche Frage nicht beantwortet. Ableitungsregeln zum Nachschlagen: <a href="#/ref/diffrechnung">Differentialrechnung</a>.</p>
<p><b>Typischer Fehler.</b> Beim zweiten Ableiten vergisst man leicht, dass \(y'\) selbst noch von \(x\) abhängt, und behandelt es wie eine Konstante. Ebenso ist \(\Phi_y(x,y(x))\) eine verkettete Funktion — beim Ableiten entstehen dort \(\Phi_{xy}\) und \(\Phi_{yy}y'\).</p>`}},
       {id:"7.11.6", title:"Lokale Umkehrbarkeit und der Umkehrsatz", body:{
        def: String.raw`<p><b>Beispiel 4 der Vorlesung: lokale Invertierbarkeit als Spezialfall.</b> Sei \(f:U\subset E\to V\subset F\), \(y_0=f(x_0)\), \(y=f(x)\). Man schreibt die Gleichung \(y=f(x)\) als implizite Gleichung</p>
\[\Phi(x,y)=y-f(x)\ \in\ F=G,\qquad \Phi'_x=-f'_x,\qquad \Phi'_y=\mathbf{1},\]
<p>und löst sie nun nicht nach \(y\), sondern <b>nach \(x=x(y)\)</b> auf (Rollentausch). Die Bedingung des Satzes aus <a href="#/7.11.2">7.11.2</a> lautet damit: \(\Phi'_x(x_0)=-f'_x(x_0)\) ist invertierbar (bei notwendiger Stetigkeit). Dann existiert eine Umkehrfunktion von \(U_\delta(y_0)\) nach \(U_\varepsilon(x_0)\), und mit der Ableitungsformel aus <a href="#/7.11.4">7.11.4</a>:</p>
\[x'_y(y_0)=-\big[\Phi'_x\big]^{-1}\Phi'_y=-\big[-f'_x(x_0)\big]^{-1}\mathbf{1}=\big[f'_x(x_0)\big]^{-1}\mathbf{1}.\]
<p><b>Spezialfall \(E=F=\mathbb{R}^n\).</b> Für \(f(x)=f(x_1,\dots,x_n)=\big(y_1(x_1,\dots,x_n),\dots,y_n(x_1,\dots,x_n)\big)^{T}\) ist</p>
\[y'_x=f'=\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}=\mathcal{J}_x(f)=\begin{pmatrix}\frac{\partial y_1}{\partial x_1}&\cdots&\frac{\partial y_1}{\partial x_n}\\ \vdots& &\vdots\\ \frac{\partial y_n}{\partial x_1}&\cdots&\frac{\partial y_n}{\partial x_n}\end{pmatrix},\]
<p>und ist diese Matrix in \(x=x_0\) invertierbar, so gilt für die Umkehrabbildung</p>
\[x'_y=\big(f^{-1}\big)'_y=\frac{D(x_1,\dots,x_n)}{D(y_1,\dots,y_n)}=\begin{pmatrix}\frac{\partial x_1}{\partial y_1}&\cdots&\frac{\partial x_1}{\partial y_n}\\ \vdots& &\vdots\\ \frac{\partial x_n}{\partial y_1}&\cdots&\frac{\partial x_n}{\partial y_n}\end{pmatrix}=\left[\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\right]^{-1}.\]
<p><b>Beachte:</b> \(\ \dfrac{\partial x_k}{\partial y_\ell}\ \neq\ \dfrac{1}{\frac{\partial y_\ell}{\partial x_k}}\) — invertiert wird die <i>Matrix</i>, nicht der einzelne Eintrag.</p>
<p><b>Definition (Diffeomorphismus).</b> \(f:U\subset E\to V\subset F\) heißt <b>Diffeomorphismus der Klasse \(C^p\)</b>, \(p\in\mathbb{N}\), genau dann wenn</p>
<ul><li>(1) \(f:U\to V\) bijektiv ist;</li>
<li>(2) \(f\) und \(f^{-1}\) \(p\)-fach stetig Fréchet-differenzierbar sind.</li></ul>
<p><b>Satz (über die lokale Umkehrfunktion).</b> Sei \(f:W\subset\mathbb{R}^m\to\mathbb{R}^m\), \(W\) offen, \(x_0\in W\), \(y_0=f(x_0)\). Sei \(f\) in \(W\) \(p\)-fach stetig differenzierbar und sei \(\mathcal{J}_x(f)\big|_{x=x_0}\) invertierbar. Dann existieren offene Mengen \(\mathcal{U}\subset\mathbb{R}^m\) mit \(x_0\in\mathcal{U}\) und \(V\subset\mathbb{R}^m\) mit \(y_0\in V\), so dass \(f:\mathcal{U}\to V\) ein \(C^p\)-Diffeomorphismus ist.</p>`,
        worte: String.raw`<p>Der Umkehrsatz ist kein neuer Satz, sondern ein Blickwechsel auf den alten. Der Trick besteht darin, die Gleichung \(y=f(x)\) als implizite Gleichung \(\Phi(x,y)=y-f(x)=\mathbf{0}_F\) zu lesen und dann die Rollen von \(x\) und \(y\) zu tauschen: nicht \(y\) soll aus \(x\) berechnet werden, sondern \(x\) aus \(y\). Da \(\Phi\) nun nach der Variablen \(x\) aufgelöst werden soll, ist die relevante partielle Ableitung \(\Phi'_x=-f'_x\), und deren Invertierbarkeit ist genau die Voraussetzung des Umkehrsatzes.</p>
<p>Die Ableitungsformel fällt dabei automatisch ab, und sie ist genau die, die man erwartet: die Ableitung der Umkehrfunktion ist die inverse Matrix der Ableitung — das mehrdimensionale Analogon zu \((f^{-1})'(y)=1/f'(x)\). Der Minus-Faktor aus \(-[\Phi'_x]^{-1}\Phi'_y\) hebt sich gegen das Minus in \(\Phi'_x=-f'_x\) weg.</p>
<p>Drei Punkte sind prüfungsrelevant:</p>
<ul>
<li><b>Der Satz ist strikt lokal.</b> \(\det\mathcal{J}\neq 0\) in jedem Punkt von \(W\) macht \(f\) nicht global injektiv. Polarkoordinaten sind das Standardgegenbeispiel: die Jacobi-Determinante ist überall \(\neq0\) für \(r>0\), trotzdem ist \(f\) wegen der \(2\pi\)-Periodizität global nicht injektiv.</li>
<li><b>Invertierbarkeit der Jacobi-Matrix ist hinreichend für <i>lokale</i> Bijektivität, für Bijektivität aber nicht notwendig</b> — sie ist jedoch notwendig dafür, dass die Umkehrung wieder differenzierbar ist. Aus \(f^{-1}\circ f=\mathbf{1}\) und \(f\circ f^{-1}=\mathbf{1}\) folgt nämlich mit der Kettenregel \((f^{-1})'(y_0)\,f'(x_0)=\mathbf{1}\) und \(f'(x_0)\,(f^{-1})'(y_0)=\mathbf{1}\), also ist \(f'(x_0)\) invertierbar.</li>
<li><b>Der Satz erhält die Glattheitsklasse:</b> ist \(f\) \(p\)-fach stetig differenzierbar, so auch \(f^{-1}\). Das steckt in der Definition des \(C^p\)-Diffeomorphismus und ist der Grund, warum in (2) ausdrücklich <i>beide</i> Richtungen gefordert werden.</li>
</ul>
<p>Die Warnung \(\frac{\partial x_k}{\partial y_\ell}\neq 1/\frac{\partial y_\ell}{\partial x_k}\) ist wichtig, weil die Bruchschreibweise der partiellen Ableitungen zum Kürzen verführt. Richtig ist nur die Matrixgleichung \(\frac{D(x_1,\dots,x_n)}{D(y_1,\dots,y_n)}=\big[\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\big]^{-1}\); der einzelne Eintrag der Inversen mischt alle Einträge der Ausgangsmatrix.</p>`,
        erfuellt: String.raw`<p><b>Polarkoordinaten, \(r>0\).</b> \(f:\left]0,\infty\right[\times\mathbb{R}\to\mathbb{R}^2\),</p>
\[f(r,\varphi)=\begin{pmatrix}x\\ y\end{pmatrix}=\begin{pmatrix}r\cos\varphi\\ r\sin\varphi\end{pmatrix}.\]
<p><i>Schritt 1 (Jacobi-Matrix).</i></p>
\[\mathcal{J}_{(r,\varphi)}(f)=\frac{D(x,y)}{D(r,\varphi)}=\begin{pmatrix}\frac{\partial x}{\partial r}&\frac{\partial x}{\partial\varphi}\\ \frac{\partial y}{\partial r}&\frac{\partial y}{\partial\varphi}\end{pmatrix}=\begin{pmatrix}\cos\varphi&-r\sin\varphi\\ \sin\varphi&\ \ r\cos\varphi\end{pmatrix}.\]
<p><i>Schritt 2 (Determinante).</i></p>
\[\det\mathcal{J}=r\cos^2\varphi+r\sin^2\varphi=r>0\quad\text{für }r>0 .\]
<p>Alle Einträge sind beliebig oft stetig differenzierbar, also ist \(f\) in \(C^\infty\), und die Voraussetzungen des Umkehrsatzes sind für jedes \(p\in\mathbb{N}\) in jedem Punkt \((r_0,\varphi_0)\) mit \(r_0>0\) erfüllt.</p>
<p><i>Schritt 3 (Schluss).</i> Es gibt offene Umgebungen \(\mathcal{U}\ni(r_0,\varphi_0)\) und \(V\ni f(r_0,\varphi_0)\) mit \(f:\mathcal{U}\to V\) ein \(C^\infty\)-Diffeomorphismus. Konkret leistet das etwa \(\mathcal{U}=\left]0,\infty\right[\times\left]\varphi_0-\pi,\varphi_0+\pi\right[\).</p>
<p><i>Schritt 4 (Ableitung der Umkehrung).</i> Mit \(\begin{pmatrix}a&b\\ c&d\end{pmatrix}^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&-b\\ -c&a\end{pmatrix}\):</p>
\[\frac{D(r,\varphi)}{D(x,y)}=\left[\frac{D(x,y)}{D(r,\varphi)}\right]^{-1}=\frac{1}{r}\begin{pmatrix}r\cos\varphi&r\sin\varphi\\ -\sin\varphi&\cos\varphi\end{pmatrix}=\begin{pmatrix}\cos\varphi&\sin\varphi\\ -\frac{\sin\varphi}{r}&\frac{\cos\varphi}{r}\end{pmatrix}.\]
<p><i>Schritt 5 (Probe von Hand).</i> Direkt aus \(r=\sqrt{x^2+y^2}\) und \(\varphi=\arctan(y/x)\) (letzteres für \(x>0\)):</p>
\[\frac{\partial r}{\partial x}=\frac{x}{\sqrt{x^2+y^2}}=\cos\varphi\ \checkmark,\qquad \frac{\partial\varphi}{\partial x}=\frac{-y}{x^2+y^2}=\frac{-r\sin\varphi}{r^2}=-\frac{\sin\varphi}{r}\ \checkmark\]
<p><i>Schritt 6 (die Warnung „Beachte“ konkret).</i> Es ist \(\frac{\partial x}{\partial r}=\cos\varphi\) und \(\frac{\partial r}{\partial x}=\cos\varphi\), aber \(\frac{1}{\partial x/\partial r}=\frac{1}{\cos\varphi}\). Für \(\varphi=\tfrac{\pi}{3}\) etwa ist \(\frac{\partial r}{\partial x}=\tfrac12\), während \(\frac{1}{\partial x/\partial r}=2\) — die naive Kehrwertregel ist also tatsächlich falsch.</p>`,
        verletzt: String.raw`<p><b>(a) Polarkoordinaten im Ursprung, \(r=0\).</b> Dieselbe Abbildungsvorschrift, jetzt aber auf ganz \(\mathbb{R}^2\) betrachtet: \(f:\mathbb{R}^2\to\mathbb{R}^2\), \(f(r,\varphi)=(r\cos\varphi,\,r\sin\varphi)^{T}\), im Punkt \((r_0,\varphi_0)=(0,\varphi_0)\).</p>
<p><i>Schritt 1.</i></p>
\[\mathcal{J}_{(0,\varphi_0)}(f)=\begin{pmatrix}\cos\varphi_0&0\\ \sin\varphi_0&0\end{pmatrix},\qquad \det\mathcal{J}=\cos\varphi_0\cdot 0-0\cdot\sin\varphi_0=0 .\]
<p>Die Voraussetzung des Umkehrsatzes ist verletzt.</p>
<p><i>Schritt 2 (und es geht wirklich schief).</i> Für jedes \(\varphi\) ist \(f(0,\varphi)=(0,0)^{T}\). Jede noch so kleine Umgebung von \((0,\varphi_0)\) enthält Punkte \((0,\varphi_0)\) und \((0,\varphi_0+t)\) mit \(t\neq0\), die beide auf denselben Bildpunkt gehen. \(f\) ist also in keiner Umgebung injektiv — eine lokale Umkehrfunktion existiert nicht, nicht einmal eine unstetige.</p>
<p><b>(b) Ein bijektives Gegenbeispiel: \(f(x)=x^3\) auf \(\mathbb{R}\), \(x_0=0\).</b></p>
<p><i>Schritt 1.</i> \(f'(x)=3x^2\), also \(f'(0)=0\): die Jacobi-Matrix (hier \(1\times1\)) ist nicht invertierbar, der Umkehrsatz nicht anwendbar.</p>
<p><i>Schritt 2.</i> Trotzdem ist \(f:\mathbb{R}\to\mathbb{R}\) bijektiv mit \(f^{-1}(y)=y^{1/3}\) — Bijektivität ist also nicht das Problem.</p>
<p><i>Schritt 3 (was scheitert).</i> Für \(y\neq0\) ist \(\big(f^{-1}\big)'(y)=\tfrac13 y^{-2/3}\), und</p>
\[\lim_{y\to 0}\ \tfrac13\,y^{-2/3}=+\infty,\]
<p>also ist \(f^{-1}\) in \(y=0\) nicht differenzierbar. \(f\) ist folglich auf keiner Umgebung von \(0\) ein \(C^1\)-Diffeomorphismus — Bedingung (2) der Definition ist verletzt.</p>
<p><i>Schritt 4 (der strukturelle Grund).</i> Wäre \(f^{-1}\) in \(y_0=f(x_0)\) differenzierbar, so gäbe die Kettenregel aus \(f^{-1}\circ f=\mathbf{1}\) sofort</p>
\[\big(f^{-1}\big)'(y_0)\cdot f'(x_0)=\mathbf{1},\]
<p>was mit \(f'(x_0)=0\) auf \(0=1\) führt. Die Invertierbarkeit von \(\mathcal{J}_{x_0}(f)\) ist also für einen Diffeomorphismus <b>notwendig</b> — der Umkehrsatz sagt, dass sie zusammen mit stetiger Differenzierbarkeit auch hinreichend ist.</p>`,
        plus: String.raw`<p><b>Zusammenhang der beiden Sätze.</b> Umkehrsatz und Satz über implizite Funktionen sind äquivalent: hier wurde der Umkehrsatz aus dem impliziten Satz gewonnen (über \(\Phi(x,y)=y-f(x)\)); umgekehrt lässt sich der implizite Satz aus dem Umkehrsatz herleiten, indem man \((x,y)\mapsto(x,\Phi(x,y))\) betrachtet. In der Klausur genügt es, eine Richtung parat zu haben — aber man sollte wissen, dass es dieselbe Aussage in zwei Kleidern ist.</p>
<p><b>Notation.</b> Die Vorlesung schreibt die Identität als doppelt gestrichene Eins; hier steht dafür \(\mathbf{1}\). Die Jacobi-Matrix erscheint in zwei Schreibweisen, \(\mathcal{J}_x(f)\) und in der \(D\)-Notation \(\frac{D(y_1,\dots,y_n)}{D(x_1,\dots,x_n)}\); die zweite ist bei Variablenwechseln und Substitutionsregeln bequemer, weil sie an den Kürzungsregeln für Brüche erinnert — allerdings nur auf Matrixebene, nicht eintragsweise. Beide bezeichnen die <i>Matrix</i>; wo die Determinante gemeint ist (wie in <a href="#/7.11.2">7.11.2</a>), muss \(\det\) ausdrücklich davorstehen.</p>
<p><b>Dimensionsbedingung.</b> Der Umkehrsatz verlangt \(f:W\subset\mathbb{R}^m\to\mathbb{R}^m\), also gleiche Dimension in Urbild und Bild. Nur dann kann \(\mathcal{J}_x(f)\) überhaupt quadratisch und damit invertierbar sein. (Die Tafel benutzt im Spezialfall den Buchstaben \(n\) und im Satz \(m\); gemeint ist beide Male dieselbe gemeinsame Dimension.)</p>
<p><b>Ausblick.</b> Der Satz über implizite Funktionen ist das Werkzeug, mit dem in §7.12 Extrema unter Nebenbedingungen behandelt werden: eine Nebenbedingung \(F(\tilde x)=0\) wird lokal nach einem Teil der Variablen aufgelöst, und daraus entstehen die Lagrange-Bedingungen.</p>`}}]},
    {id:"7.12", t:"Extremwerte unter Nebenbedingungen", topics:[
       {id:"7.12.1", title:"Motivation und geometrische Idee", body:{
        def: String.raw`<p>Gesucht ist nicht ein Extremwert auf einer offenen Menge, sondern nur auf derjenigen Teilmenge, die durch eine <b>Nebenbedingung</b> beschrieben wird. Die zu optimierende Funktion heißt <b>Zielfunktion</b>. (An der Tafel stets als „Zf“ und „NB“ abgekürzt.)</p><p><b>Beispiel ① (Tafel).</b> Finde unter allen Rechtecken mit gegebenem Umfang \(U\) jenes mit maximalem Flächeninhalt. Mit Breite \(x\) und Höhe \(y\):</p><p>Zielfunktion: \(f(x,y)=x\cdot y\).<br>Nebenbedingung: \(F(x,y)=2(x+y)-U=0\).</p><p><b>Lösung „in der Schule“.</b> Die Nebenbedingung nach \(y\) auflösen und in die Zielfunktion einsetzen:</p>\[y=y(x)=\tfrac12 U-x\ \hookrightarrow\ \tilde f(x)=f\big(x,y(x)\big)=x\cdot\left(\frac{U}{2}-x\right),\]<p>dann nach \(x\) differenzieren.</p><p><b>Geometrische Beobachtungen ①–④ (Tafel).</b></p><ul><li>① Die Zielfunktion erzeugt <b>Höhenlinien</b> in der \((x,y)\)-Ebene.</li><li>② Die Nebenbedingungen schränken die zulässigen \((x,y)\) ein; im Beispiel auf eine Gerade.</li><li>③ Der Extremwert unter Nebenbedingung wird dort angenommen, wo die Höhenlinie der Zielfunktion die Gerade der Nebenbedingung <i>berührt</i> (tangential).</li><li>④ Also \(\nabla f\parallel\nabla F\) bzw. \[\nabla f=\lambda\,\nabla F\quad\text{für gewisses }\lambda\in\mathbb{R}.\]</li></ul>`,
        worte: String.raw`<p>Der Unterschied zum freien Extremwertproblem ist klein, aber entscheidend: Bei einem freien Extremwert darf man in <i>alle</i> Richtungen ausweichen, deshalb muss dort \(\nabla f=\mathbf{0}_2\) gelten. Unter einer Nebenbedingung darf man nur noch <i>längs der Nebenbedingungskurve</i> ausweichen. Verlangt wird daher viel weniger: Die Richtungsableitung von \(f\) muss nur in den Richtungen verschwinden, die auf der Kurve bleiben. Der Gradient selbst darf durchaus ungleich Null sein.</p><p>Genau das ist der Inhalt der Beobachtungen ③ und ④. Würde die Höhenlinie von \(f\) die Nebenbedingungskurve <i>kreuzen</i> statt sie zu berühren, so läge auf der einen Seite des Schnittpunkts ein größerer, auf der anderen ein kleinerer Funktionswert; man könnte also längs der Kurve weiterlaufen und \(f\) vergrößern. Extremal kann es nur dort sein, wo Höhenlinie und Nebenbedingungskurve <b>dieselbe Tangente</b> haben. Da \(\nabla f\) senkrecht auf den Höhenlinien von \(f\) und \(\nabla F\) senkrecht auf der Kurve \(F=0\) steht, sind bei gleicher Tangente die beiden Gradienten parallel: \(\nabla f=\lambda\nabla F\). Der Faktor \(\lambda\) ist dabei zunächst nichts weiter als der Proportionalitätsfaktor zweier paralleler Vektoren.</p><p>Der Schulweg (Auflösen und Einsetzen) funktioniert im Beispiel, weil sich \(2(x+y)-U=0\) global und bequem nach \(y\) auflösen lässt. Das ist der Ausnahmefall. Die Lagrange-Methode (<a href="#/7.12.2">7.12.2</a>) macht denselben Gedanken systematisch und ohne explizites Auflösen; dass sie funktioniert, ist gerade der Satz über implizite Funktionen (<a href="#/7.12.3">7.12.3</a>).</p>`,
        beispiel: String.raw`<p><b>Beispiel ① vollständig auf dem Schulweg.</b> Sinnvoller Bereich: \(x>0,\ y>0\), wegen der Nebenbedingung also \(0< x< U/2\).</p><p><b>1. Nebenbedingung auflösen.</b> \(2(x+y)-U=0\iff y=y(x)=\dfrac{U}{2}-x\).</p><p><b>2. Einsetzen.</b></p>\[\tilde f(x)=f\big(x,y(x)\big)=x\left(\frac{U}{2}-x\right)=\frac{U}{2}\,x-x^{2}.\]<p><b>3. Differenzieren.</b> \(\tilde f'(x)=\dfrac{U}{2}-2x\), also \(\tilde f'(x)=0\iff x^{*}=\dfrac{U}{4}\). Wegen \(\tilde f''(x)=-2<0\) liegt dort ein Maximum vor.</p><p><b>4. Rückeinsetzen.</b> \(y^{*}=\dfrac{U}{2}-\dfrac{U}{4}=\dfrac{U}{4}\). Das optimale Rechteck ist also das <b>Quadrat</b> mit Seitenlänge \(U/4\); der maximale Flächeninhalt ist \(f(x^{*},y^{*})=\dfrac{U^{2}}{16}\).</p><p><b>5. Probe auf Beobachtung ④.</b> Die Höhenlinien von \(f\) sind die Hyperbeln \(xy=c\), die Nebenbedingung ist die Gerade \(x+y=\tfrac{U}{2}\). Es ist</p>\[\operatorname{grad} f\big|_{(x^{*},y^{*})}=\begin{pmatrix}y^{*}\\ x^{*}\end{pmatrix}=\begin{pmatrix}U/4\\ U/4\end{pmatrix},\qquad \operatorname{grad} F\big|_{(x^{*},y^{*})}=\begin{pmatrix}2\\ 2\end{pmatrix},\]<p>also tatsächlich \(\nabla f\big|_{(x^{*},y^{*})}=\lambda\,\nabla F\big|_{(x^{*},y^{*})}\) mit \(\lambda=\dfrac{U}{8}\). Geometrisch: Die Hyperbel \(xy=U^{2}/16\) berührt die Gerade \(x+y=U/2\) im Punkt \((U/4,\,U/4)\) — jede Hyperbel mit größerem \(c\) verfehlt die Gerade ganz.</p>`,
